    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        
        html {
            height: 100%;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: 30px;
            overflow-x: hidden;
            position: relative;
        }
        
        .header {
            text-align: center;
            padding: 15px 10px;
            background: linear-gradient(135deg, #111 0%, #1a237e 100%);
            position: sticky;
            top: 0;
            z-index: 1000;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(26, 35, 126, 0.4);
            border-bottom: 4px solid #4fc3f7;
            width: 100%;
            max-width: 100vw;
        }
        
        .header h1 {
            font-size: clamp(20px, 4.5vw, 28px);
            color: #fff;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.3;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .header-subtitle {
            font-size: clamp(12px, 2.8vw, 15px);
            color: #b3e5fc;
            margin-top: 8px;
            font-weight: 500;
            opacity: 0.9;
            line-height: 1.4;
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 10px;
            width: 100%;
            overflow: hidden;
        }
        
        .content-section {
            width: 100%;
            margin-bottom: 20px;
        }
        
        /* RSS WALL CONTAINER - Βελτιωμένο για 10 ειδήσεις */
        .rss-wall-container {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #4fc3f7;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        
        .rss-wall-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4fc3f7;
        }
        
        .rss-wall-title {
            font-size: clamp(18px, 3.5vw, 22px);
            font-weight: 700;
            color: #4fc3f7;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }
        
        .rss-wall-subtitle {
            font-size: clamp(13px, 2.5vw, 16px);
            color: #b3e5fc;
            opacity: 0.9;
        }
        
        /* Βελτιωμένο aspect ratio container για 10 ειδήσεις */
        .aspect-ratio-container {
            position: relative;
            width: 100%;
            padding-top: 200%; /* Υψηλότερο για 10 ειδήσεις */
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .aspect-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        
        /* ΤΕΤΡΑΓΩΝΑ BANNER ΜΕΤΑ ΑΠΟ RSS FEED */
        .square-ad-container {
            width: 100%;
            margin: 0 auto 20px auto;
            text-align: center;
        }
        
        .square-ad {
            display: inline-block;
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, rgba(26, 35, 126, 0.15) 0%, rgba(79, 195, 247, 0.1) 100%);
            border-radius: 10px;
            border: 3px solid #4fc3f7;
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.3);
            overflow: hidden;
            position: relative;
        }
        
        .square-ad ins {
            display: block;
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* ADS CONTAINER - ΤΕΤΡΑΓΩΝΙΣΜΕΝΕΣ ΜΠΑΡΕΣ ΜΕ ΠΕΡΙΣΣΟΤΕΡΕΣ ΔΙΑΦΗΜΙΣΕΙΣ */
        .ads-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 30px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }
        
        /* ΒΕΛΤΙΩΜΕΝΟ RESPONSIVE DESIGN */
        @media (max-width: 1200px) {
            .aspect-ratio-container {
                padding-top: 180%; /* Tablet landscape */
            }
        }
        
        @media (max-width: 992px) {
            .ads-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .square-ad {
                width: 260px;
                height: 260px;
            }
            
            .rss-wall-container {
                padding: 12px;
            }
            
            .rss-wall-title {
                font-size: 20px;
            }
            
            .aspect-ratio-container {
                padding-top: 160%; /* Tablet portrait */
            }
        }
        
        @media (max-width: 768px) {
            .ads-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .square-ad {
                width: 240px;
                height: 240px;
            }
            
            .rss-wall-container {
                padding: 10px;
                margin-bottom: 15px;
            }
            
            .rss-wall-title {
                font-size: 18px;
            }
            
            .rss-wall-subtitle {
                font-size: 14px;
            }
            
            .main-container {
                padding: 15px 8px;
            }
            
            .aspect-ratio-container {
                padding-top: 140%; /* Mobile landscape */
            }
        }
        
        @media (max-width: 576px) {
            .ads-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .square-ad {
                width: 280px;
                height: 280px;
                max-width: 90%;
            }
            
            .rss-wall-container {
                padding: 8px;
            }
            
            .header {
                padding: 12px 8px;
            }
            
            .aspect-ratio-container {
                padding-top: 120%; /* Mobile portrait */
            }
        }
        
        @media (max-width: 400px) {
            .square-ad {
                width: 100%;
                max-width: 260px;
                height: 260px;
            }
            
            .aspect-ratio-container {
                padding-top: 110%; /* Μικρές οθόνες */
            }
            
            .header h1 {
                font-size: 18px;
            }
            
            .header-subtitle {
                font-size: 13px;
            }
        }
        
        @media (max-width: 320px) {
            .square-ad {
                max-width: 240px;
                height: 240px;
            }
            
            .aspect-ratio-container {
                padding-top: 100%; /* Πολύ μικρές οθόνες */
            }
        }
        
        /* ΒΕΛΤΙΩΜΕΝΑ AD BOXES */
        .ad-box {
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            border: 2px solid;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            max-width: 100%;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .ad-box:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
        }
        
        .ad-box-1 {
            border-color: #4fc3f7;
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.4);
        }
        
        .ad-box-2 {
            border-color: #69f0ae;
            box-shadow: 0 6px 20px rgba(105, 240, 174, 0.4);
        }
        
        .ad-box-3 {
            border-color: #ff9800;
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
        }
        
        .ad-box-4 {
            border-color: #ff4081;
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
        }
        
        /* ΧΩΡΙΣ ΤΙΤΛΟΥΣ - ΜΟΝΟ AD CONTENT */
        .ad-content {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            max-width: 100%;
            overflow: hidden;
        }
        
        .custom-ad-slot {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
        }
        
        .custom-ad-slot ins {
            width: 100% !important;
            height: 100% !important;
            min-height: 150px !important;
            max-height: 220px !important;
            max-width: 100% !important;
            display: block !important;
        }
        
        /* Βελτίωση για iOS */
        @supports (-webkit-touch-callout: none) {
            body {
                min-height: -webkit-fill-available;
            }
        }
        
        /* Animation για φόρτωση */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .square-ad {
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }
        
        .rss-wall-container {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .ad-box {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* Loading indicator για καλύτερη UX */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(79, 195, 247, 0.3);
            border-radius: 50%;
            border-top-color: #4fc3f7;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ - Βελτιωμένη
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        // Φόρτωση όλων των διαφημίσεων
                        adsbygoogle.push({});
                        
                        // Επιπλέον φορτώσεις για καλύτερη κάλυψη
                        setTimeout(() => {
                            try { 
                                adsbygoogle.push({}); 
                                console.log('Επιπλέον φόρτωση διαφημίσεων 1');
                            } catch(e) {}
                        }, 1500);
                        
                        setTimeout(() => {
                            try { 
                                adsbygoogle.push({}); 
                                console.log('Επιπλέον φόρτωση διαφημίσεων 2');
                            } catch(e) {}
                        }, 3000);
                        
                        console.log('Όλες οι διαφημίσεις φορτώθηκαν');
                        
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                } else {
                    setTimeout(LOAD_ALL_ADS, 1000);
                }
            }
            
            // Αρχική φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 2000);
            
            // Ανανέωση διαφημίσεων κάθε 30 δευτερόλεπτα
            setInterval(LOAD_ALL_ADS, 30000);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
            
            // Refresh iframes every 10 minutes
            function refreshIframes() {
                const iframes = document.querySelectorAll('.aspect-iframe');
                iframes.forEach((iframe, index) => {
                    console.log(`Ανανέωση RSS iframe ${index + 1}...`);
                    const currentSrc = iframe.src;
                    iframe.src = currentSrc;
                    
                    // Show loading overlay
                    const loadingId = index === 0 ? 'newsLoading' : 'sportsLoading';
                    const loadingElement = document.getElementById(loadingId);
                    if (loadingElement) {
                        loadingElement.style.display = 'flex';
                    }
                });
            }
            
            // Refresh every 10 minutes
            setInterval(refreshIframes, 600000);
            
            // Adjust aspect ratio on resize για 10 ειδήσεις
            function adjustAspectRatios() {
                const containers = document.querySelectorAll('.aspect-ratio-container');
                containers.forEach(container => {
                    if (window.innerWidth < 320) {
                        container.style.paddingTop = '100%';
                    } else if (window.innerWidth < 400) {
                        container.style.paddingTop = '110%';
                    } else if (window.innerWidth < 576) {
                        container.style.paddingTop = '120%';
                    } else if (window.innerWidth < 768) {
                        container.style.paddingTop = '140%';
                    } else if (window.innerWidth < 992) {
                        container.style.paddingTop = '160%';
                    } else if (window.innerWidth < 1200) {
                        container.style.paddingTop = '180%';
                    } else {
                        container.style.paddingTop = '200%'; /* Υψηλό για 10+ ειδήσεις */
                    }
                });
            }
            
            // Adjust on load and resize
            setTimeout(adjustAspectRatios, 100);
            window.addEventListener('resize', adjustAspectRatios);
            
            // Επιπλέον loading functions
            window.hideLoading = function(loadingId) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                    }, 500);
                }
            };
            
            window.handleIframeError = function(loadingId, containerId) {
                const loadingElement = document.getElementById(loadingId);
                const container = document.getElementById(containerId);
                
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
                
                if (container) {
                    container.innerHTML = `
                        <div style="padding: 40px; text-align: center; color: #ff6b6b;">
                            <div style="font-size: 48px; margin-bottom: 15px;">⚠️</div>
                            <p style="font-size: 16px; margin-bottom: 10px;">Δεν ήταν δυνατή η φόρτωση των ειδήσεων.</p>
                            <button onclick="location.reload()" style="
                                background: #4fc3f7;
                                color: white;
                                border: none;
                                padding: 10px 20px;
                                border-radius: 5px;
                                font-size: 14px;
                                cursor: pointer;
                                margin-top: 10px;
                            ">
                                Προσπαθήστε ξανά
                            </button>
                        </div>
                    `;
                }
            };
            
            // Fallback: hide loading after 8 seconds
            setTimeout(() => {
                hideLoading('newsLoading');
                hideLoading('sportsLoading');
            }, 8000);
            
            // Optimize for mobile performance
            if ('ontouchstart' in window) {
                // Optimizations for touch devices
                document.body.style.webkitOverflowScrolling = 'touch';
            }
        });
    </script>
