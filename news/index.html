    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
            
            // Αυτόματη φόρτωση διαφημίσεων
            function loadAds() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                        // Αφαίρεση loading indicator όταν φορτωθεί η διαφήμιση
                        setTimeout(() => {
                            document.querySelectorAll('.ad-loading').forEach(loader => {
                                loader.style.display = 'none';
                            });
                        }, 2000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων με καθυστέρηση
            setTimeout(loadAds, 1000);
            setTimeout(loadAds, 3000);
            
            // Επιπλέον φόρτωση όταν ο χρήστης φτάσει κοντά σε διαφήμιση
            const observerOptions = {
                root: null,
                rootMargin: '300px', // Περισσότερη απόσταση για προ-φόρτωση
                threshold: 0.1
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        loadAds();
                        // Παύση παρατήρησης μετά τη φόρτωση
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);
            
            // Παρατήρηση όλων των διαφημίσεων
            document.querySelectorAll('.ad-container').forEach(ad => {
                observer.observe(ad);
            });
            
            // Ανανέωση διαφημίσεων κάθε 60 δευτερόλεπτα
            setInterval(loadAds, 60000);
            
            // Προσθήκη τυχαίας κίνησης για βελτιωμένο visual appeal
            const ads = document.querySelectorAll('.ad-container ins');
            ads.forEach(ad => {
                ad.addEventListener('mouseenter', () => {
                    ad.style.transform = 'translateY(-5px) scale(1.02)';
                });
                
                ad.addEventListener('mouseleave', () => {
                    ad.style.transform = 'translateY(0) scale(1)';
                });
            });
            
            // Προσθήκη κλικ tracking (μη παρεμβατικό)
            document.querySelectorAll('.ad-container').forEach(container => {
                container.addEventListener('click', function() {
                    console.log('Ad clicked');
                    // Εδώ μπορείς να προσθέσεις Google Analytics ή άλλο tracking
                });
            });
        });
    </script>
