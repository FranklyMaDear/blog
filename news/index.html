    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
            
            // Ειδική φόρτωση για τετράγωνες διαφημίσεις με βίντεο/φωτογραφίες
            function loadSquareAd(adElement) {
                if (typeof adsbygoogle !== 'undefined' && adElement) {
                    try {
                        // Ρύθμιση για τετράγωνες διαφημίσεις
                        adElement.setAttribute('data-ad-format', 'rectangle');
                        adElement.style.width = '336px';
                        adElement.style.height = '336px';
                        adElement.style.margin = '0 auto';
                        adElement.style.display = 'block';
                        
                        // Επαναφορά για επαναφόρτωση
                        adElement.setAttribute('data-ad-status', 'unfilled');
                        adsbygoogle.push({});
                        
                        console.log('Square ad loaded:', adElement.getAttribute('data-ad-slot'));
                    } catch(e) {
                        console.log('Square ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση όλων των τετράγωνων διαφημίσεων
            function loadAllSquareAds() {
                const adElements = document.querySelectorAll('.ad-container .adsbygoogle');
                adElements.forEach(function(ad, index) {
                    setTimeout(function() {
                        loadSquareAd(ad);
                    }, index * 800); // Περισσότερο χρόνο μεταξύ φορτώσεων
                });
            }
            
            // Αρχική φόρτωση τετράγωνων διαφημίσεων
            setTimeout(loadAllSquareAds, 1500);
            setTimeout(loadAllSquareAds, 6000);
            
            // Επιπλέον φόρτωση όταν ο χρήστης φτάσει κοντά σε τετράγωνη διαφήμιση
            const observerOptions = {
                root: null,
                rootMargin: '400px', // Μεγαλύτερο margin για προληπτική φόρτωση
                threshold: 0.05
            };
            
            const adObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const adElement = entry.target.querySelector('.adsbygoogle');
                        if (adElement && adElement.getAttribute('data-ad-status') !== 'filled') {
                            setTimeout(() => {
                                loadSquareAd(adElement);
                            }, 300);
                        }
                    }
                });
            }, observerOptions);
            
            // Παρατήρηση όλων των ad containers
            document.querySelectorAll('.ad-container').forEach(container => {
                adObserver.observe(container);
            });
            
            // Ανανέωση τετράγωνων διαφημίσεων κάθε 60 δευτερόλεπτα
            setInterval(function() {
                const now = new Date();
                const minutes = now.getMinutes();
                
                // Ανανέωση διαφημίσεων κάθε λεπτό (εναλλάξ)
                const adContainers = document.querySelectorAll('.ad-container');
                const adIndex = minutes % adContainers.length;
                const adElement = adContainers[adIndex].querySelector('.adsbygoogle');
                
                if (adElement) {
                    console.log('Refreshing square ad at index:', adIndex);
                    loadSquareAd(adElement);
                }
            }, 60000);
            
            // Προσθήκη click tracking για τα top links
            document.querySelectorAll('.top-links a').forEach(link => {
                link.addEventListener('click', function() {
                    console.log('Top link clicked:', this.href);
                    // Μπορείς να προσθέσεις Google Analytics tracking εδώ
                    if (typeof gtag !== 'undefined') {
                        gtag('event', 'top_nav_click', {
                            'event_category': 'navigation',
                            'event_label': this.textContent.trim()
                        });
                    }
                });
            });
            
            // Προσθήκη hover effect για διαφημίσεις
            document.querySelectorAll('.ad-container ins').forEach(ad => {
                ad.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.02)';
                    this.style.boxShadow = '0 12px 30px rgba(52, 152, 219, 0.3)';
                });
                
                ad.addEventListener('mouseleave', function() {
                    this.style.transform = 'scale(1)';
                    this.style.boxShadow = '0 8px 25px rgba(52, 152, 219, 0.2)';
                });
            });
            
            // Performance monitoring
            window.addEventListener('load', function() {
                const perfData = window.performance.timing;
                const pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
                console.log('Page load time:', pageLoadTime + 'ms');
                console.log('Square ads configured:', document.querySelectorAll('.ad-container').length);
            });
        });
    </script>
