    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
            
            // Βελτιστοποίηση για responsive
            function adjustWidgetsForMobile() {
                const isMobile = window.innerWidth <= 768;
                const widgets = document.querySelectorAll('.widget-content, .horoscope-middle-content');
                
                widgets.forEach(widget => {
                    if (isMobile) {
                        widget.style.minHeight = '200px';
                    } else {
                        widget.style.minHeight = '150px';
                    }
                });
            }
            
            // Κάλεσε την function κατά το load και resize
            adjustWidgetsForMobile();
            window.addEventListener('resize', adjustWidgetsForMobile);
        });
    </script>
