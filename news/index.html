    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
            
            // Αυτόματη φόρτωση διαφημίσεων
            function loadAds() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                        // Αφαίρεση loading indicator όταν φορτωθεί η διαφήμιση
                        setTimeout(() => {
                            document.querySelectorAll('.ad-loading').forEach(loader => {
                                loader.style.opacity = '0';
                                setTimeout(() => {
                                    loader.style.display = 'none';
                                }, 500);
                            });
                        }, 1500);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                        // Εμφάνιση fallback μηνύματος
                        document.querySelectorAll('.ad-loading').forEach(loader => {
                            loader.innerHTML = 'Διαφήμιση - Κάντε κλικ για περισσότερες πληροφορίες';
                            loader.style.color = '#aaa';
                        });
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων με καθυστέρηση
            setTimeout(loadAds, 800);
            setTimeout(loadAds, 2000);
            
            // Επιπλέον φόρτωση όταν ο χρήστης φτάσει κοντά σε διαφήμιση
            const observerOptions = {
                root: null,
                rootMargin: '400px', // Ακόμα μεγαλύτερη απόσταση για προ-φόρτωση
                threshold: 0.05
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        loadAds();
                        // Παύση παρατήρησης μετά τη φόρτωση
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);
            
            // Παρατήρηση όλων των διαφημίσεων
            document.querySelectorAll('.ad-container').forEach(ad => {
                observer.observe(ad);
            });
            
            // Ανανέωση διαφημίσεων κάθε 45 δευτερόλεπτα
            setInterval(loadAds, 45000);
            
            // Προσθήκη τυχαίας κίνησης για βελτιωμένο visual appeal
            const ads = document.querySelectorAll('.ad-container ins');
            ads.forEach(ad => {
                ad.addEventListener('mouseenter', () => {
                    ad.style.transform = 'translateY(-8px) scale(1.03)';
                    ad.style.boxShadow = '0 25px 60px rgba(0, 0, 0, 0.7)';
                });
                
                ad.addEventListener('mouseleave', () => {
                    ad.style.transform = 'translateY(0) scale(1)';
                    ad.style.boxShadow = '0 12px 40px rgba(0, 0, 0, 0.5)';
                });
            });
            
            // Προσθήκη κλικ tracking (μη παρεμβατικό)
            document.querySelectorAll('.ad-container').forEach(container => {
                container.addEventListener('click', function() {
                    console.log('Ad clicked - Large format');
                    // Εδώ μπορείς να προσθέσεις Google Analytics ή άλλο tracking
                    if (typeof gtag !== 'undefined') {
                        gtag('event', 'ad_click', {
                            'event_category': 'engagement',
                            'event_label': 'large_ad'
                        });
                    }
                });
            });
            
            // Προσαρμογή μεγέθους διαφημίσεων βάσει viewport
            function adjustAdSizes() {
                const viewportWidth = window.innerWidth;
                const ads = document.querySelectorAll('.ad-container ins');
                
                ads.forEach(ad => {
                    if (viewportWidth >= 1200) {
                        ad.style.maxWidth = '1200px';
                        ad.style.height = '350px';
                    } else if (viewportWidth >= 992) {
                        ad.style.maxWidth = '1000px';
                        ad.style.height = '320px';
                    } else if (viewportWidth >= 768) {
                        ad.style.maxWidth = '728px';
                        ad.style.height = '280px';
                    } else {
                        ad.style.maxWidth = '100%';
                        ad.style.height = '250px';
                    }
                });
            }
            
            window.addEventListener('resize', adjustAdSizes);
            adjustAdSizes(); // Αρχική κλήση
        });
    </script>
</body>
</html>
