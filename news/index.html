    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
            
            // Αυτόματη φόρτωση διαφημίσεων
            function loadAds() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων με καθυστέρηση
            setTimeout(loadAds, 1000);
            setTimeout(loadAds, 3000);
            
            // Επιπλέον φόρτωση όταν ο χρήστης φτάσει κοντά σε διαφήμιση
            const observerOptions = {
                root: null,
                rootMargin: '200px', // Φόρτωση πριν φτάσει ο χρήστης
                threshold: 0.1
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        loadAds();
                    }
                });
            }, observerOptions);
            
            // Παρατήρηση όλων των διαφημίσεων
            document.querySelectorAll('.ad-container').forEach(ad => {
                observer.observe(ad);
            });
        });
    </script>
