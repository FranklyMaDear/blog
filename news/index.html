        /* Animation για φόρτωση */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .rss-embed-container {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .square-ad {
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }
        
        .csv-feed-container {
            animation: fadeIn 0.5s ease-out forwards;
        }

            // PARSE CSV FUNCTION
            function parseCSV(csvText) {
                const lines = csvText.split('\n');
                const headers = lines[0].split(',');
                const data = [];
                
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    
                    // Χειρισμός CSV με quotes και commas
                    const currentLine = [];
                    let inQuotes = false;
                    let currentValue = '';
                    
                    for (let char of lines[i]) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            currentLine.push(currentValue);
                            currentValue = '';
                        } else {
                            currentValue += char;
                        }
                    }
                    currentLine.push(currentValue); // Τελευταία τιμή
                    
                    const obj = {};
                    for (let j = 0; j < headers.length; j++) {
                        let value = currentLine[j] || '';
                        // Remove quotes if present
                        value = value.replace(/^"|"$/g, '');
                        obj[headers[j]] = value;
                    }
                    
                    // Προσθήκη μόνο αν έχει τίτλο
                    if (obj.Title && obj.Title.trim() !== '') {
                        data.push(obj);
                    }
                }
                
                return data;
            }
            
            // DISPLAY CSV DATA
            function displayCSVData() {
                try {
                    const csvContent = document.getElementById('csv-news-content');
                    const parsedData = parseCSV(csvData);
                    
                    if (parsedData.length === 0) {
                        csvContent.innerHTML = `
                            <div class="csv-no-data">
                                <div>📰</div>
                                <p>Δεν υπάρχουν διαθέσιμες ειδήσεις αυτήν τη στιγμή.</p>
                            </div>
                        `;
                        return;
                    }
                    
                    let html = '';
                    
                    // Εμφάνιση μόνο των 10 πιο πρόσφατων ειδήσεων
                    const recentNews = parsedData.slice(0, 10);
                    
                    recentNews.forEach((item, index) => {
                        // Format date for display
                        let displayDate = item.Published || '';
                        displayDate = displayDate.replace(' UTC', '');
                        displayDate = displayDate.replace('2026-02-', '');
                        displayDate = displayDate.replace('2026-02-0', '');
                        
                        // Χειρισμός ημερομηνίας
                        const dateParts = displayDate.split(' ');
                        if (dateParts.length > 0) {
                            const day = dateParts[0];
                            const time = dateParts[1] || '';
                            displayDate = `${day}/02 ${time}`;
                        }
                        
                        // Get title - remove any extra quotes
                        let title = item.Title || 'Αθλητική είδηση';
                        title = title.replace(/^"|"$/g, '');
                        
                        // Get link
                        const link = item.Link || '#';
                        
                        // Shorten long titles
                        if (title.length > 80) {
                            title = title.substring(0, 77) + '...';
                        }
                        
                        html += `
                            <div class="csv-news-item">
                                <div class="csv-news-title">${title}</div>
                                <a href="${link}" class="csv-news-link" target="_blank" rel="noopener">
                                    Διαβάστε περισσότερα →
                                </a>
                                <div class="csv-news-meta">
                                    <span class="csv-news-host">${item.Source ? item.Source.replace(' - Ειδήσεις Google', '') : 'Αθλητικά'}</span>
                                    <span class="csv-news-date">${displayDate}</span>
                                </div>
                            </div>
                        `;
                    });
                    
                    csvContent.innerHTML = html;
                    
                } catch (error) {
                    console.error('Error displaying CSV data:', error);
                    const csvContent = document.getElementById('csv-news-content');
                    csvContent.innerHTML = `
                        <div class="csv-no-data">

                            <p>Σφάλμα φόρτωσης ειδήσεων. Παρακαλώ δοκιμάστε ξανά αργότερα.</p>
                        </div>
                    `;
                }
            }
