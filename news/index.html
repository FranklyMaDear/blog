    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Hide loading indicator after widget loads
            function hideLoadingIndicator() {
                const loadingIndicator = document.getElementById('loadingIndicator');
                if (loadingIndicator) {
                    setTimeout(() => {
                        loadingIndicator.style.display = 'none';
                    }, 2000);
                }
            }
            
            // Check if RSS app widget is loaded
            function checkWidgetLoaded() {
                const wallElement = document.querySelector('rssapp-wall');
                if (wallElement && wallElement.children.length > 0) {
                    hideLoadingIndicator();
                } else {
                    setTimeout(checkWidgetLoaded, 500);
                }
            }
            
            // Start checking for widget load
            setTimeout(checkWidgetLoaded, 1000);
            
            // Fallback: hide loading after 5 seconds
            setTimeout(hideLoadingIndicator, 5000);
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        // Φόρτωση όλων των διαφημίσεων
                        adsbygoogle.push({});
                        
                        // Επιπλέον φορτώσεις για καλύτερη κάλυψη
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                        
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 2000);
                        
                        console.log('Όλες οι διαφημίσεις φορτώθηκαν');
                        
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                } else {
                    setTimeout(LOAD_ALL_ADS, 1000);
                }
            }
            
            // Αρχική φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 2000);
            
            // Ανανέωση διαφημίσεων κάθε 30 δευτερόλεπτα
            setInterval(LOAD_ALL_ADS, 30000);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
            
            // Refresh widget every 10 minutes
            function refreshWidget() {
                const wallElement = document.querySelector('rssapp-wall');
                const scriptElement = document.querySelector('script[src="https://widget.rss.app/v1/wall.js"]');
                
                if (wallElement && scriptElement) {
                    console.log('Ανανέωση RSS widget...');
                    // Remove and re-add the widget
                    const parent = wallElement.parentNode;
                    wallElement.remove();
                    scriptElement.remove();
                    
                    // Create new elements
                    const newWall = document.createElement('rssapp-wall');
                    newWall.id = 'nm4nFJ628VJOCXvF';
                    
                    const newScript = document.createElement('script');
                    newScript.src = 'https://widget.rss.app/v1/wall.js';
                    newScript.async = true;
                    
                    parent.appendChild(newWall);
                    parent.appendChild(newScript);
                    
                    // Show loading indicator
                    const loadingIndicator = document.getElementById('loadingIndicator');
                    if (loadingIndicator) {
                        loadingIndicator.style.display = 'block';
                    }
                    
                    // Check again for load
                    setTimeout(checkWidgetLoaded, 1000);
                }
            }
            
            // Refresh every 10 minutes
            setInterval(refreshWidget, 600000);
        });
    </script>
