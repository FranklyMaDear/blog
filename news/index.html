    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΒΕΛΤΙΣΤΟΠΟΙΗΜΕΝΗ ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        // Προσθήκη όλων των διαφημίσεων
                        adsbygoogle.push({});
                        
                        // Προσθήκη με καθυστέρηση για καλύτερη απόδοση
                        setTimeout(() => {
                            try { 
                                adsbygoogle.push({});
                            } catch(e) {}
                        }, 500);
                        
                        setTimeout(() => {
                            try { 
                                adsbygoogle.push({});
                            } catch(e) {}
                        }, 1500);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Αρχική φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 1000);
            
            // Αυτόματη ανανέωση διαφημίσεων κάθε 45 δευτερόλεπτα
            setInterval(LOAD_ALL_ADS, 45000);
            
            // Ανανέωση διαφημίσεων όταν ο χρήστης κάνει scroll
            let scrollTimeout;
            window.addEventListener('scroll', function() {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(function() {
                    LOAD_ALL_ADS();
                }, 2000);
            });
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
        });
