    <style>
        * {

            padding: 0;

        html {

        body {

        }
        
        .header {

            background: linear-gradient(135deg, #111 0%, #1a237e 100%);
            position: sticky;
            top: 0;
            z-index: 1000;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(26, 35, 126, 0.4);
            border-bottom: 4px solid #4fc3f7;
            width: 100%;
            max-width: 100vw;
        }
        
        .header h1 {

            color: #fff;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.3;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .header-subtitle {

            color: #b3e5fc;
            margin-top: 10px;
            font-weight: 500;
            opacity: 0.9;
            line-height: 1.4;
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 15px;
            width: 100%;
            overflow: hidden;
        }
        
        .content-section {
            width: 100%;
            margin-bottom: 30px;
        }
        
        /* RSS Embed Container */
        .rss-embed-container {
            position: relative;
            width: 100%;
            padding-top: 120%; /* Μεγαλύτερο για 5 άρθρα */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
            border: 2px solid #333;
            margin-bottom: 25px;
        }
        
        .rss-embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
        }
        
        /* ΤΕΤΡΑΓΩΝΑ BANNER ΜΕΤΑ ΑΠΟ ΚΑΘΕ RSS FEED */
        .square-ad-container {
            width: 100%;
            margin: 0 auto 30px auto;
            text-align: center;
        }
        
        .square-ad {
            display: inline-block;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, rgba(26, 35, 126, 0.15) 0%, rgba(79, 195, 247, 0.1) 100%);
            border-radius: 12px;
            border: 3px solid #4fc3f7;
            box-shadow: 0 8px 30px rgba(79, 195, 247, 0.3);
            overflow: hidden;
            position: relative;
        }
        
        .square-ad ins {
            display: block;
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* ADS CONTAINER - ΤΕΤΡΑΓΩΝΙΣΜΕΝΕΣ ΜΠΑΡΕΣ ΧΩΡΙΣ ΤΙΤΛΟΥΣ */
        .ads-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 40px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }
        
        @media (max-width: 992px) {
            .ads-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .square-ad {
                width: 280px;
                height: 280px;
            }
        }
        
        @media (max-width: 768px) {
            .ads-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .square-ad {
                width: 250px;
                height: 250px;
            }
        }
        
        @media (max-width: 576px) {
            .ads-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .square-ad {
                width: 280px;
                height: 280px;
            }
        }
        
        @media (max-width: 400px) {
            .square-ad {
                width: 100%;
                max-width: 280px;
                height: 280px;
            }
        }
        
        .ad-box {
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            border: 3px solid;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            max-width: 100%;
            width: 100%;
            transition: transform 0.3s;
        }
        
        .ad-box:hover {
            transform: scale(1.05);
        }
        
        .ad-box-1 {
            border-color: #4fc3f7;
            box-shadow: 0 8px 30px rgba(79, 195, 247, 0.4);
        }
        
        .ad-box-2 {

        /* ΧΩΡΙΣ ΤΙΤΛΟΥΣ - ΜΟΝΟ AD CONTENT */

        /* Animation για φόρτωση */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .rss-embed-container {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .square-ad {
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        // Φόρτωση όλων των διαφημίσεων
                        adsbygoogle.push({});
                        
                        // Επιπλέον φορτώσεις για καλύτερη κάλυψη
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                        
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 2000);
                        
                        console.log('Όλες οι διαφημίσεις φορτώθηκαν');
                        
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                } else {
                    setTimeout(LOAD_ALL_ADS, 1000);
                }
            }
            
            // Αρχική φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 2000);
            
            // Ανανέωση διαφημίσεων κάθε 30 δευτερόλεπτα
            setInterval(LOAD_ALL_ADS, 30000);
            
            // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
            window.addEventListener('resize', function() {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    window.setTimeout(function() {
                        document.activeElement.scrollIntoView({ block: 'center' });
                    }, 0);
                }
            });
        });
    </script>
