    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
    
    <style>
        /* Βασικά Styles (Συμπυκνωμένα για ανάγνωση) */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #fff; line-height: 1.6; }
        .header { background: linear-gradient(135deg, #1a237e, #0d47a1); padding: 20px; text-align: center; border-bottom: 4px solid #FF9800; }
        .header h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); margin-bottom: 5px; }
        .date { color: #b0bec5; font-size: 0.95rem; }
        .main-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .news-card { background: #1e1e1e; border-radius: 12px; overflow: hidden; transition: transform 0.3s ease; border: 1px solid #333; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        .news-image { height: 180px; width: 100%; overflow: hidden; background: #2a2a2a; }
        .news-image img { width: 100%; height: 100%; object-fit: cover; }
        .news-content { padding: 20px; }
        .news-category { display: inline-block; background: #FF9800; color: #000; padding: 4px 12px; border-radius: 15px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .news-title { font-size: 1.25rem; margin-bottom: 10px; color: #fff; }
        .news-excerpt { color: #aaa; font-size: 0.9rem; margin-bottom: 15px; }
        .news-footer { display: flex; justify-content: space-between; font-size: 0.8rem; color: #78909c; }
        
        .video-section { margin: 40px 0; }
        .video-container { background: #000; border-radius: 12px; overflow: hidden; position: relative; min-height: 400px; }
        video { width: 100%; height: 100%; }
        .video-ad-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 25%; background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center; z-index: 100; }
        .video-ad-overlay.show { display: flex; }
        .ad-close-button { position: absolute; top: 10px; right: 15px; background: #555; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 1.2rem; }
        
        .ads-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 50px; }
        @media (max-width: 768px) { .ads-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .ads-container { grid-template-columns: 1fr; } }
        .ad-box { aspect-ratio: 1 / 1; background: #1a1a1a; border-radius: 8px; display: flex; flex-direction: column; border: 2px solid #444; overflow: hidden; }
        .ad-title { padding: 12px; text-align: center; font-weight: bold; border-bottom: 1px solid #444; color: #FF9800; }
        .ad-content { flex: 1; display: flex; align-items: center; justify-content: center; }
        
        .footer { text-align: center; padding: 30px; color: #666; margin-top: 50px; border-top: 1px solid #333; }
        .loading { text-align: center; padding: 30px; color: #FF9800; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📰 Τα Νέα της Ημέρας</h1>
        <div class="date" id="currentDate">Τετάρτη, 4 Φεβρουαρίου 2026</div>
    </div>
    
    <div class="main-container">
        <!-- ΕΔΩ ΘΑ ΜΠΟΥΝ ΤΑ ΝΕΑ ΑΠΟ ΤΟ RSS (ΤΟ ΠΛΑΙΣΙΟ 'news-grid') -->
        <div id="newsContainer" class="news-grid">
            <div class="loading">⏳ Φόρτωση τελευταίων ειδήσεων...</div>
        </div>
        
        <!-- ΕΝΟΤΗΤΑ ΒΙΝΤΕΟ -->
        <div class="video-section">
            <div class="video-container">
                <video id="mainVideo" controls playsinline poster="https://blog.franklymadear.com/post/one/thumbnail122.png">
                    <source src="https://blog.franklymadear.com/post/one/video.mp4" type="video/mp4">
                </video>
                <!-- ΜΠΑΝΕΡ ΔΙΑΦΗΜΙΣΗΣ ΜΕΣΑ ΣΤΟ ΒΙΝΤΕΟ -->
                <div class="video-ad-overlay" id="videoAdOverlay">
                    <button class="ad-close-button" id="closeVideoAdBtn">×</button>
                    <div class="ad-content">
                        <!-- AdSense Ad για το Βίντεο -->
                        <ins class="adsbygoogle"
                             style="display:block; width: 100%; height: 100%;"
                             data-ad-client="ca-pub-3186700611266549"
                             data-ad-slot="9660744817"
                             data-ad-format="rectangle"></ins>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ΤΕΤΡΑΓΩΝΙΣΜΕΝΕΣ ΔΙΑΦΗΜΙΣΤΙΚΕΣ ΜΠΑΡΕΣ -->
        <div class="ads-container">
            <!-- ΜΠΑΡΑ 1 -->
            <div class="ad-box">
                <div class="ad-title">ΔΙΑΦΗΜΙΣΗ 1</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block; width: 100%; height: 100%;"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="3092455087"></ins>
                </div>
            </div>
            <!-- ΜΠΑΡΑ 2 -->
            <div class="ad-box">
                <div class="ad-title">ΔΙΑΦΗΜΙΣΗ 2</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block; width: 100%; height: 100%;"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="3092455087"></ins>
                </div>
            </div>
            <!-- ΜΠΑΡΑ 3 -->
            <div class="ad-box">
                <div class="ad-title">ΔΙΑΦΗΜΙΣΗ 3</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block; width: 100%; height: 100%;"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="6330498148"></ins>
                </div>
            </div>
            <!-- ΜΠΑΡΑ 4 -->
            <div class="ad-box">
                <div class="ad-title">ΔΙΑΦΗΜΙΣΗ 4</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block; width: 100%; height: 100%;"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="6330498148"></ins>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>FranklyMaDear News © 2026 | Πηγή ειδήσεων: Google News RSS</p>
    </div>
    
    <script>
        // --- Α. ΦΟΡΤΩΣΗ ΠΡΑΓΜΑΤΙΚΩΝ ΕΙΔΗΣΕΩΝ ---
        document.addEventListener('DOMContentLoaded', function() {
            const newsContainer = document.getElementById('newsContainer');
            const currentDateEl = document.getElementById('currentDate');
            
            // Ορισμός σημερινής ημερομηνίας
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            currentDateEl.textContent = today.toLocaleDateString('el-GR', options);
            
            // RSS Feed από το Google News για Ελλάδα
            const rssFeedUrl = 'https://news.google.com/rss?hl=el-GR&gl=GR&ceid=GR:el';
            
            // Συνάρτηση για να καλέσουμε το RSS μέσω CORS proxy (απαραίτητο για browser)
            async function fetchNews() {
                // Χρησιμοποιούμε ένα δωρεάν CORS proxy για να αποφύγουμε τα CORS errors
                const proxyUrl = 'https://api.allorigins.win/get?url=';
                const targetUrl = encodeURIComponent(rssFeedUrl);
                
                try {
                    const response = await fetch(proxyUrl + targetUrl);
                    const data = await response.json();
                    const rssText = data.contents;
                    
                    // Μετατροπή του RSS κειμένου σε XML
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(rssText, "text/xml");
                    
                    // Εξαγωγή των στοιχείων από το RSS
                    const items = xmlDoc.querySelectorAll('item');
                    newsContainer.innerHTML = ''; // Καθαρίζουμε το μήνυμα "Φόρτωση..."
                    
                    // Δημιουργία κάρτας για κάθε είδηση (περιορίζουμε στις πρώτες 6)
                    items.forEach((item, index) => {
                        if(index >= 6) return;
                        
                        const title = item.querySelector('title').textContent;
                        const link = item.querySelector('link').textContent;
                        const description = item.querySelector('description')?.textContent || 'Δεν υπάρχει περιγραφή.';
                        const pubDate = item.querySelector('pubDate')?.textContent || '';
                        
                        // Εξαγωγή εικόνας από το περιεχόμενο του description
                        let imageUrl = 'https://blog.franklymadear.com/post/one/thumbnail122.png'; // default
                        const imgMatch = description.match(/<img[^>]+src="([^">]+)"/);
                        if (imgMatch) imageUrl = imgMatch[1];
                        
                        const newsCard = document.createElement('article');
                        newsCard.className = 'news-card';
                        newsCard.innerHTML = `
                            <div class="news-image">
                                <img src="${imageUrl}" alt="${title}" loading="lazy">
                            </div>
                            <div class="news-content">
                                <span class="news-category">ΕΙΔΗΣΗ</span>
                                <h3 class="news-title"><a href="${link}" target="_blank" style="color: inherit; text-decoration: none;">${title}</a></h3>
                                <p class="news-excerpt">${description.replace(/<[^>]*>/g, '').substring(0, 120)}...</p>
                                <div class="news-footer">
                                    <span>📅 ${formatDate(pubDate)}</span>
                                    <a href="${link}" target="_blank" style="color: #4fc3f7;">Διαβάστε περισσότερα →</a>
                                </div>
                            </div>
                        `;
                        newsContainer.appendChild(newsCard);
                    });
                    
                } catch (error) {
                    console.error('Σφάλμα φόρτωσης ειδήσεων:', error);
                    newsContainer.innerHTML = '<div class="loading">❌ Δεν ήταν δυνατή η φόρτωση των ειδήσεων αυτήν τη στιγμή.</div>';
                }
            }
            
            // Βοηθητική συνάρτηση για μορφοποίηση ημερομηνίας
            function formatDate(dateString) {
                if(!dateString) return 'Σήμερα';
                const date = new Date(dateString);
                return date.toLocaleDateString('el-GR', { day: 'numeric', month: 'short' });
            }
            
            // Κλήση συνάρτησης για φόρτωση ειδήσεων
            fetchNews();
            
            // --- Β. ΛΕΙΤΟΥΡΓΙΕΣ ΒΙΝΤΕΟ & ΔΙΑΦΗΜΙΣΕΩΝ ---
            const video = document.getElementById('mainVideo');
            const videoAdOverlay = document.getElementById('videoAdOverlay');
            const closeVideoAdBtn = document.getElementById('closeVideoAdBtn');
            let adShown = false;
            
            // Εμφάνιση διαφήμισης στο βίντεο μετά από 8 δευτερόλεπτα
            video.addEventListener('play', function() {
                if(!adShown) {
                    setTimeout(() => {
                        videoAdOverlay.classList.add('show');
                        adShown = true;
                    }, 8000);
                }
            });
            
            // Κλείσιμο διαφήμισης βίντεο
            closeVideoAdBtn.addEventListener('click', function() {
                videoAdOverlay.classList.remove('show');
            });
            
            // --- Γ. ΕΝΕΡΓΟΠΟΙΗΣΗ ΟΛΩΝ ΤΩΝ ΔΙΑΦΗΜΙΣΕΩΝ ---
            function loadAllAds() {
                // Ενεργοποίηση AdSense για όλα τα μπάνερ
                (adsbygoogle = window.adsbygoogle || []).push({});
                
                // Επαναφορτώνουμε διαφημίσεις αν δεν εμφανιστούν
                setTimeout(() => {
                    const adContainers = document.querySelectorAll('.adsbygoogle');
                    adContainers.forEach(container => {
                        if (container.clientHeight < 10) {
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        }
                    });
                }, 2000);
            }
            
            // Φόρτωση διαφημίσεων με καθυστέρηση και περιοδικά
            setTimeout(loadAllAds, 1500);
            setInterval(loadAllAds, 45000); // Ανανέωση κάθε 45 δευτερόλεπτα
        });
    </script>
</body>
</html>
