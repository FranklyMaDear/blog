    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set current date
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('el-GR', options);
            
            // Sample news data (in a real scenario, this would come from an API)
            const newsData = [
                {
                    category: "Πολιτική",
                    title: "Νέες εξελίξεις στη βουλή - Συζήτηση για το νομοσχέδιο",
                    excerpt: "Η βουλή συνεδριάζει για κρίσιμες ψηφοφορίες σε σημαντικά νομοσχέδια.",
                    image: "https://images.unsplash.com/photo-1581833971358-2c8b550f87b3?w=400&h=200&fit=crop",
                    time: "Πριν 1 ώρα"
                },
                {
                    category: "Οικονομία",
                    title: "Αναπροσαρμογή προβλέψεων για τον πληθωρισμό",
                    excerpt: "Τράπεζα της Ελλάδος αναθεωρεί τις προβλέψεις της για τον πληθωρισμό.",
                    image: "https://images.unsplash.com/photo-1665686306575-21b6d1588d4d?w=400&h=200&fit=crop",
                    time: "Πριν 2 ώρες"
                },
                {
                    category: "Αθλητισμός",
                    title: "Μεγάλο ντέρμπι Σαββάτου - Προετοιμασίες ολοκληρώνονται",
                    excerpt: "Οι δύο γίγαντες του ελληνικού ποδοσφαίρου προετοιμάζονται για το ντέρμπι.",
                    image: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w-400&h=200&fit=crop",
                    time: "Πριν 3 ώρες"
                },
                {
                    category: "Τεχνολογία",
                    title: "Νέα τεχνολογία AI από ελληνική startup",
                    excerpt: "Ελληνική εταιρεία παρουσιάζει καινοτόμο λύση τεχνητής νοημοσύνης.",
                    image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400&h=200&fit=crop",
                    time: "Πριν 4 ώρες"
                },
                {
                    category: "Υγεία",
                    title: "Νέα μελέτη για τα οφέλη της μεσογειακής δίαιτας",
                    excerpt: "Επιστημονική έρευνα επιβεβαιώνει τα οφέλη για την καρδιά.",
                    image: "https://images.unsplash.com/photo-1490818387583-1baba5e638af?w=400&h=200&fit=crop",
                    time: "Πριν 5 ώρες"
                },
                {
                    category: "Καιρός",
                    title: "Αλλαγή καιρού - Αναμένονται βροχοπτώσεις",
                    excerpt: "Μετά την άνοιξη, αναμένονται έντονες βροχοπτώσεις σε όλη τη χώρα.",
                    image: "https://images.unsplash.com/photo-1592210454359-9043f067919b?w=400&h=200&fit=crop",
                    time: "Πριν 6 ώρες"
                }
            ];
            
            // Breaking news headlines
            const breakingNews = [
                "Σημαντικές εξελίξεις στην εθνική οικονομία - Ανακοίνωση από Υπουργείο Οικονομικών",
                "Νέα μέτρα για τον τουρισμό - Ανακοίνωση σήμερα",
                "Διεθνείς αντιδράσεις για τα γεγονότα στη Μέση Ανατολή",
                "Κορυφαία ελληνικά πανεπιστήμια στις διεθνείς κατατάξεις"
            ];
            
            // Display breaking news
            const breakingText = document.getElementById('breakingNewsText');
            let currentBreakingIndex = 0;
            
            function updateBreakingNews() {
                breakingText.textContent = breakingNews[currentBreakingIndex];
                currentBreakingIndex = (currentBreakingIndex + 1) % breakingNews.length;
            }
            
            updateBreakingNews();
            setInterval(updateBreakingNews, 8000);
            
            // Display featured news
            const featuredNewsContainer = document.getElementById('featuredNews');
            
            newsData.forEach(news => {
                const newsCard = document.createElement('div');
                newsCard.className = 'news-card';
                newsCard.innerHTML = `
                    <div class="news-image">
                        <img src="${news.image}" alt="${news.title}" loading="lazy">
                    </div>
                    <div class="news-content">
                        <div class="news-category">${news.category}</div>
                        <h3 class="news-title">${news.title}</h3>
                        <p class="news-excerpt">${news.excerpt}</p>
                        <div class="news-time">
                            <span>🕒</span>
                            <span>${news.time}</span>
                        </div>
                    </div>
                `;
                featuredNewsContainer.appendChild(newsCard);
            });
            
            // Video player functionality
            const video = document.getElementById('mainVideo');
            
            // Auto-play video when in viewport
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && video.paused) {
                        video.play().catch(e => console.log('Auto-play prevented:', e));
                    }
                });
            }, { threshold: 0.5 });
            
            observer.observe(video);
            
            // Load ads
            function loadAds() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                        setTimeout(() => {
                            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                        }, 1000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Load ads with delay
            setTimeout(loadAds, 2000);
            setInterval(loadAds, 30000);
            
            // Prevent zoom on iOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            // Update news every 5 minutes (simulated)
            setInterval(() => {
                console.log('Refreshing news data...');
                // In real implementation, this would fetch from API
            }, 300000);
        });
