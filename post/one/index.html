    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 2000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 1500);
            setInterval(LOAD_ALL_ADS, 30000);
            
            // Βελτιστοποίηση RSS embed
            const rssIframe = document.querySelector('.rss-embed-container iframe');
            if (rssIframe) {
                // Προσθήκη event listener για φόρτωση
                rssIframe.addEventListener('load', function() {
                    console.log('RSS embed loaded successfully');
                });
            }
        });
        
        // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
        window.addEventListener('resize', function() {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                window.setTimeout(function() {
                    document.activeElement.scrollIntoView({ block: 'center' });
                }, 0);
            }
        });
    </script>
