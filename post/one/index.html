        * {

        .main-container {
            max-width: 1200px;

            width: 100%;

        }
        
        .section-title {

            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .section-title::before,
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
        }
        
        /* Χρώματα για κάθε κατηγορία */
        .section-1 { color: #4fc3f7; }
        .section-2 { color: #69f0ae; }
        .section-3 { color: #ff9800; }
        .section-4 { color: #ff4081; }
        .section-5 { color: #b388ff; }
        
        .rss-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .rss-item {
            background-color: #111;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid #333;
        }
        
        .rss-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.9);
        }
        
        /* RSS Embed Container - ΒΕΛΤΙΩΜΕΝΟ ΓΙΑ 5 ΑΡΘΡΑ */
        .rss-embed-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Σταθερό για 5 άρθρα */
            background-color: #000;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        
        .rss-embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
            border-radius: 0 0 12px 12px;
        }
        
        /* ΚΕΝΤΡΙΚΗ ΔΙΑΦΗΜΙΣΗ */

            width: 100%;
            max-width: 728px;

        /* ADS CONTAINER - ΤΕΤΡΑΓΩΝΙΣΜΕΝΕΣ ΜΠΑΡΕΣ */

        /* Animation για φόρτωση */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .rss-item {

        .rss-item:nth-child(1) { animation-delay: 0.1s; }
        .rss-item:nth-child(2) { animation-delay: 0.2s; }
        .rss-item:nth-child(3) { animation-delay: 0.3s; }
        .rss-item:nth-child(4) { animation-delay: 0.4s; }
        .rss-item:nth-child(5) { animation-delay: 0.5s; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        // Φόρτωση όλων των διαφημίσεων
                        adsbygoogle.push({});
                        
                        // Επιπλέον φορτώσεις για καλύτερη κάλυψη
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                        
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 2000);
                        
                        console.log('Όλες οι διαφημίσεις φορτώθηκαν');
                        
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                } else {
                    // Αν το AdSense δεν έχει φορτωθεί ακόμα, δοκιμάστε ξανά
                    console.log('AdSense not loaded yet, retrying...');
                    setTimeout(LOAD_ALL_ADS, 1000);
                }
            }
            
            // Αρχική φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 2000);
            
            // Ανανέωση διαφημίσεων κάθε 30 δευτερόλεπτα
            setInterval(LOAD_ALL_ADS, 30000);
            
            // ΒΕΛΤΙΩΜΕΝΗ ΔΙΑΧΕΙΡΙΣΗ RSS EMBEDS
            const rssItems = document.querySelectorAll('.rss-item');
            
            rssItems.forEach((item, index) => {
                const iframe = item.querySelector('iframe');
                const container = item.querySelector('.rss-embed-container');
                
                // Προσθήκη animation delay
                item.style.animationDelay = `${index * 0.1}s`;
                
                if (iframe) {
                    // Βελτιστοποίηση φόρτωσης
                    if (index < 2) {
                        iframe.loading = 'eager'; // Τα πρώτα 2 γρήγορα
                    } else {
                        iframe.loading = 'lazy'; // Τα υπόλοιπα lazy
                    }
                    
                    iframe.addEventListener('load', function() {
                        console.log(`RSS feed ${index + 1} loaded: ${iframe.title}`);
                        item.style.opacity = '1';
                        
                        // Προσαρμογή ύψους αν χρειαστεί
                        setTimeout(() => {
                            try {
                                // Έλεγχος αν το iframe έχει περιεχόμενο
                                if (iframe.contentWindow && iframe.contentWindow.document) {
                                    const contentHeight = iframe.contentWindow.document.body.scrollHeight;
                                    if (contentHeight > 0) {
                                        console.log(`Feed ${index + 1} height: ${contentHeight}px`);
                                    }
                                }
                            } catch(e) {
                                // Cross-origin error, αγνοούμε
                            }
                        }, 3000);
                    });
                    
                    iframe.addEventListener('error', function() {
                        console.error(`RSS feed ${index + 1} failed to load: ${iframe.src}`);
                        // Εμφάνιση μηνύματος σφάλματος
                        container.innerHTML = `
                            <div style="color: white; padding: 20px; text-align: center;">
                                <p>Δεν ήταν δυνατή η φόρτωση των ειδήσεων.</p>
                                <p>Παρακαλώ δοκιμάστε ξανά αργότερα.</p>
                            </div>
                        `;
                    });
                }
            });
            
            // ΑΝΑΝΕΩΣΗ RSS FEEDS ΚΑΘΕ 10 ΛΕΠΤΑ
            function refreshRSSFeeds() {
                console.log('Ανανέωση RSS feeds...');
                rssItems.forEach((item, index) => {
                    const iframe = item.querySelector('iframe');
                    if (iframe) {
                        try {
                            const currentSrc = iframe.src;
                            iframe.src = currentSrc; // Ανανέωση
                            console.log(`Refreshed feed ${index + 1}`);
                        } catch(e) {
                            console.log(`Error refreshing feed ${index + 1}:`, e);
                        }
                    }
                });
            }
            
            // Ανανέωση κάθε 10 λεπτά
            setInterval(refreshRSSFeeds, 600000);
            
            // Προαιρετικό: Ανανέωση όταν ο χρήστης επιστρέφει στο tab
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    setTimeout(refreshRSSFeeds, 2000);
                }
            });
            
            // SMOOTH SCROLLING
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });
        
        // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
        window.addEventListener('resize', function() {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                window.setTimeout(function() {
                    document.activeElement.scrollIntoView({ block: 'center' });
                }, 0);
            }
        });
    </script>
