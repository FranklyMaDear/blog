<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Πίνακας Ελέγχου - Καφεμαντεία</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #8B4513;
            --primary-light: #A0522D;
            --secondary: #D2691E;
            --accent: #F4A460;
            --light: #F5F5DC;
            --dark: #3E2723;
            --text: #5D4037;
            --success: #4CAF50;
            --error: #f44336;
            --info: #2196F3;
            --warning: #FF9800;
        }
        
        body {
            background: linear-gradient(135deg, var(--light) 0%, #f8f4e9 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.2);
        }
        
        .logo {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: block;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        /* Horizontal Categories */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 5px 0 15px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .categories::-webkit-scrollbar {
            display: none;
        }
        
        .category {
            flex: 0 0 auto;
            min-width: 140px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }
        
        .category.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, #f8f4e9 0%, white 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.2);
        }
        
        .category-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--primary);
        }
        
        .category-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--dark);
        }
        
        .category-count {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        /* Content Sections */
        .content-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.1);
            display: none;
        }
        
        .content-section.active {
            display: block;
        }
        
        .section-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .section-title {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .add-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.3s;
        }
        
        .add-btn:hover {
            background: #388e3c;
        }
        
        /* Items Grid */
        .items-grid {
            display: grid;
            gap: 15px;
        }
        
        .item-card {
            background: #fcfaf7;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .item-user {
            font-weight: 600;
            color: var(--dark);
            font-size: 1rem;
        }
        
        .item-date {
            color: var(--text);
            font-size: 0.8rem;
            opacity: 0.8;
        }
        
        .item-status {
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-answered {
            background: #d4edda;
            color: #155724;
        }
        
        .item-content {
            margin-bottom: 12px;
        }
        
        .item-message {
            line-height: 1.4;
            font-size: 0.9rem;
        }
        
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        
        .photo-item {
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .photo-image {
            width: 100%;
            height: 70px;
            object-fit: cover;
            display: block;
        }
        
        .item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
        }
        
        .btn-view {
            background: var(--info);
            color: white;
        }
        
        .btn-reply {
            background: var(--success);
            color: white;
        }
        
        .btn-delete {
            background: var(--error);
            color: white;
        }
        
        .btn-download {
            background: var(--primary);
            color: white;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e0d6c9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text);
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.9rem;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0d6c9;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: #fcfaf7;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(210, 105, 30, 0.1);
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text);
        }
        
        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #e0d6c9;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 5px;
            }
            
            header {
                padding: 15px 10px;
                margin-bottom: 15px;
            }
            
            .logo {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 1.3rem;
            }
            
            .category {
                min-width: 120px;
                padding: 12px;
            }
            
            .category-icon {
                font-size: 1.5rem;
            }
            
            .content-section {
                padding: 15px;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .add-btn {
                width: 100%;
                justify-content: center;
            }
            
            .item-actions {
                width: 100%;
                justify-content: center;
            }
            
            .action-btn {
                flex: 1;
                justify-content: center;
                min-width: 80px;
            }
            
            .photos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 360px) {
            .category {
                min-width: 110px;
                padding: 10px;
            }
            
            .category-title {
                font-size: 0.8rem;
            }
            
            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <i class="fas fa-mug-hot logo"></i>
            <h1>Πίνακας Ελέγχου</h1>
            <p class="subtitle">Διαχείριση Καφεμαντείας</p>
        </header>
        
        <!-- Οριζόντιες Κατηγορίες -->
        <div class="categories">
            <div class="category active" data-category="users">
                <div class="category-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="category-title">Χρήστες</div>
                <div class="category-count" id="users-count">0</div>
            </div>
            
            <div class="category" data-category="messages">
                <div class="category-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="category-title">Μηνύματα</div>
                <div class="category-count" id="messages-count">0</div>
            </div>
            
            <div class="category" data-category="photos">
                <div class="category-icon">
                    <i class="fas fa-camera"></i>
                </div>
                <div class="category-title">Φωτογραφίες</div>
                <div class="category-count" id="photos-count">0</div>
            </div>
            
            <div class="category" data-category="points">
                <div class="category-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="category-title">Σημεία</div>
                <div class="category-count" id="points-count">0</div>
            </div>
        </div>
        
        <!-- Περιεχόμενο Χρηστών -->
        <section id="users-section" class="content-section active">
            <div class="section-header">
                <h2 class="section-title">Διαχείριση Χρηστών</h2>
                <button class="add-btn" id="add-user-btn">
                    <i class="fas fa-plus"></i> Νέος Χρήστης
                </button>
            </div>
            
            <div class="items-grid" id="users-list">
                <!-- Θα προστεθούν δυναμικά οι χρήστες -->
            </div>
        </section>
        
        <!-- Περιεχόμενο Μηνυμάτων -->
        <section id="messages-section" class="content-section">
            <div class="section-header">
                <h2 class="section-title">Μηνύματα Επισκεπτών</h2>
                <button class="add-btn" id="add-message-btn">
                    <i class="fas fa-plus"></i> Νέο Μήνυμα
                </button>
            </div>
            
            <div class="items-grid" id="messages-list">
                <!-- Θα προστεθούν δυναμικά τα μηνύματα -->
            </div>
        </section>
        
        <!-- Περιεχόμενο Φωτογραφιών -->
        <section id="photos-section" class="content-section">
            <div class="section-header">
                <h2 class="section-title">Υποβολές Φωτογραφιών</h2>
                <button class="add-btn" id="add-photo-btn">
                    <i class="fas fa-plus"></i> Νέα Υποβολή
                </button>
            </div>
            
            <div class="items-grid" id="photos-list">
                <!-- Θα προστεθούν δυναμικά οι φωτογραφίες -->
            </div>
        </section>
        
        <!-- Περιεχόμενο Σημείων -->
        <section id="points-section" class="content-section">
            <div class="section-header">
                <h2 class="section-title">Διαχείριση Σημείων</h2>
                <button class="add-btn" id="add-point-btn">
                    <i class="fas fa-plus"></i> Νέο Σημείο
                </button>
            </div>
            
            <div class="items-grid" id="points-list">
                <!-- Θα προστεθούν δυναμικά τα σημεία -->
            </div>
        </section>
    </div>

    <!-- Modal για Προσθήκη/Επεξεργασία -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Προσθήκη Νέου</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="item-form">
                    <div class="form-group">
                        <label for="item-name">Όνομα:</label>
                        <input type="text" id="item-name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="item-email">Email:</label>
                        <input type="email" id="item-email">
                    </div>
                    
                    <div class="form-group">
                        <label for="item-message">Μήνυμα:</label>
                        <textarea id="item-message"></textarea>
                    </div>
                    
                    <div class="form-group" id="photo-upload-group" style="display: none;">
                        <label for="item-photos">Φωτογραφίες:</label>
                        <input type="file" id="item-photos" multiple accept="image/*">
                    </div>
                    
                    <div class="form-group" id="point-location-group" style="display: none;">
                        <label for="item-location">Τοποθεσία:</label>
                        <input type="text" id="item-location" placeholder="Π.χ. Αθήνα, Κέντρο">
                    </div>
                    
                    <div class="modal-actions">
                        <button type="button" class="action-btn btn-view" id="cancel-btn">
                            Ακύρωση
                        </button>
                        <button type="submit" class="action-btn btn-reply">
                            Αποθήκευση
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Δεδομένα
            let data = {
                users: JSON.parse(localStorage.getItem('adminUsers')) || [],
                messages: JSON.parse(localStorage.getItem('adminMessages')) || [],
                photos: JSON.parse(localStorage.getItem('adminPhotos')) || [],
                points: JSON.parse(localStorage.getItem('adminPoints')) || []
            };
            
            // Σύστημα κατηγοριών
            const categories = document.querySelectorAll('.category');
            const contentSections = document.querySelectorAll('.content-section');
            
            categories.forEach(category => {
                category.addEventListener('click', () => {
                    const categoryId = category.getAttribute('data-category');
                    
                    // Απενεργοποίηση όλων των κατηγοριών
                    categories.forEach(cat => cat.classList.remove('active'));
                    contentSections.forEach(section => section.classList.remove('active'));
                    
                    // Ενεργοποίηση επιλεγμένης κατηγορίας
                    category.classList.add('active');
                    document.getElementById(`${categoryId}-section`).classList.add('active');
                });
            });
            
            // Modal λειτουργίες
            const modal = document.getElementById('item-modal');
            const closeModalBtn = document.querySelector('.close-modal');
            const cancelBtn = document.getElementById('cancel-btn');
            const itemForm = document.getElementById('item-form');
            
            function openModal(category) {
                document.getElementById('modal-title').textContent = `Προσθήκη ${getCategoryTitle(category)}`;
                document.getElementById('photo-upload-group').style.display = category === 'photos' ? 'block' : 'none';
                document.getElementById('point-location-group').style.display = category === 'points' ? 'block' : 'none';
                modal.style.display = 'flex';
                currentCategory = category;
            }
            
            function closeModal() {
                modal.style.display = 'none';
                itemForm.reset();
            }
            
            closeModalBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);
            
            // Κουμπιά προσθήκης
            document.getElementById('add-user-btn').addEventListener('click', () => openModal('users'));
            document.getElementById('add-message-btn').addEventListener('click', () => openModal('messages'));
            document.getElementById('add-photo-btn').addEventListener('click', () => openModal('photos'));
            document.getElementById('add-point-btn').addEventListener('click', () => openModal('points'));
            
            // Υποβολή φόρμας
            let currentCategory = '';
            
            itemForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const newItem = {
                    id: Date.now(),
                    name: document.getElementById('item-name').value,
                    email: document.getElementById('item-email').value,
                    message: document.getElementById('item-message').value,
                    date: new Date().toISOString(),
                    status: 'pending'
                };
                
                if (currentCategory === 'points') {
                    newItem.location = document.getElementById('item-location').value;
                }
                
                data[currentCategory].push(newItem);
                saveData();
                loadCategoryData(currentCategory);
                updateCounts();
                closeModal();
                
                alert(`${getCategoryTitle(currentCategory)} προστέθηκε επιτυχώς!`);
            });
            
            // Φόρτωση δεδομένων
            function loadAllData() {
                loadCategoryData('users');
                loadCategoryData('messages');
                loadCategoryData('photos');
                loadCategoryData('points');
                updateCounts();
            }
            
            function loadCategoryData(category) {
                const container = document.getElementById(`${category}-list`);
                const items = data[category];
                
                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <i class="fas fa-${getCategoryIcon(category)}"></i>
                            </div>
                            <h3>Δεν βρέθηκαν ${getCategoryTitle(category).toLowerCase()}</h3>
                            <p>Προσθέστε νέα ${getCategoryTitle(category).toLowerCase()} πατώντας το κουμπί "Προσθήκη"</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = '';
                
                items.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'item-card';
                    
                    let contentHTML = '';
                    let actionsHTML = '';
                    
                    switch(category) {
                        case 'users':
                            contentHTML = `
                                <div class="item-message">Email: ${item.email || 'Δεν υπάρχει'}</div>
                            `;
                            actionsHTML = `
                                <button class="action-btn btn-view" onclick="viewItem('${category}', ${item.id})">
                                    <i class="fas fa-eye"></i> Προβολή
                                </button>
                                <button class="action-btn btn-delete" onclick="deleteItem('${category}', ${item.id})">
                                    <i class="fas fa-trash"></i> Διαγραφή
                                </button>
                            `;
                            break;
                            
                        case 'messages':
                            contentHTML = `
                                <div class="item-message">${item.message || 'Δεν υπάρχει μήνυμα'}</div>
                            `;
                            actionsHTML = `
                                <button class="action-btn btn-reply" onclick="replyToItem('${category}', ${item.id})">
                                    <i class="fas fa-reply"></i> Απάντηση
                                </button>
                                <button class="action-btn btn-delete" onclick="deleteItem('${category}', ${item.id})">
                                    <i class="fas fa-trash"></i> Διαγραφή
                                </button>
                            `;
                            break;
                            
                        case 'photos':
                            contentHTML = `
                                <div class="item-message">${item.message || 'Δεν υπάρχει περιγραφή'}</div>
                                <div class="photos-grid">
                                    <div class="photo-item">
                                        <div class="photo-image" style="background: #e0d6c9; display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 0.8rem;">
                                            <i class="fas fa-image"></i>
                                        </div>
                                    </div>
                                </div>
                            `;
                            actionsHTML = `
                                <button class="action-btn btn-view" onclick="viewItem('${category}', ${item.id})">
                                    <i class="fas fa-eye"></i> Προβολή
                                </button>
                                <button class="action-btn btn-download" onclick="downloadItem('${category}', ${item.id})">
                                    <i class="fas fa-download"></i> Λήψη
                                </button>
                                <button class="action-btn btn-delete" onclick="deleteItem('${category}', ${item.id})">
                                    <i class="fas fa-trash"></i> Διαγραφή
                                </button>
                            `;
                            break;
                            
                        case 'points':
                            contentHTML = `
                                <div class="item-message">Τοποθεσία: ${item.location || 'Δεν ορίστηκε'}</div>
                                ${item.message ? `<div class="item-message">${item.message}</div>` : ''}
                            `;
                            actionsHTML = `
                                <button class="action-btn btn-view" onclick="viewItem('${category}', ${item.id})">
                                    <i class="fas fa-eye"></i> Προβολή
                                </button>
                                <button class="action-btn btn-delete" onclick="deleteItem('${category}', ${item.id})">
                                    <i class="fas fa-trash"></i> Διαγραφή
                                </button>
                            `;
                            break;
                    }
                    
                    itemElement.innerHTML = `
                        <div class="item-header">
                            <div class="item-user">${item.name}</div>
                            <div class="item-date">${formatDate(item.date)}</div>
                            <div class="item-status status-${item.status}">${getStatusText(item.status)}</div>
                        </div>
                        <div class="item-content">
                            ${contentHTML}
                        </div>
                        <div class="item-actions">
                            ${actionsHTML}
                        </div>
                    `;
                    
                    container.appendChild(itemElement);
                });
            }
            
            // Βοηθητικές συναρτήσεις
            function getCategoryTitle(category) {
                const titles = {
                    'users': 'Χρήστης',
                    'messages': 'Μήνυμα',
                    'photos': 'Φωτογραφία',
                    'points': 'Σημείο'
                };
                return titles[category] || 'Στοιχείο';
            }
            
            function getCategoryIcon(category) {
                const icons = {
                    'users': 'users',
                    'messages': 'envelope',
                    'photos': 'camera',
                    'points': 'map-marker-alt'
                };
                return icons[category] || 'circle';
            }
            
            function getStatusText(status) {
                const statusMap = {
                    'pending': 'Εκκρεμεί',
                    'answered': 'Απαντήθηκε'
                };
                return statusMap[status] || status;
            }
            
            function formatDate(dateString) {
                const options = { 
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                };
                return new Date(dateString).toLocaleDateString('el-GR', options);
            }
            
            function saveData() {
                localStorage.setItem('adminUsers', JSON.stringify(data.users));
                localStorage.setItem('adminMessages', JSON.stringify(data.messages));
                localStorage.setItem('adminPhotos', JSON.stringify(data.photos));
                localStorage.setItem('adminPoints', JSON.stringify(data.points));
            }
            
            function updateCounts() {
                document.getElementById('users-count').textContent = data.users.length;
                document.getElementById('messages-count').textContent = data.messages.length;
                document.getElementById('photos-count').textContent = data.photos.length;
                document.getElementById('points-count').textContent = data.points.length;
            }
            
            // Global functions για τα buttons
            window.viewItem = function(category, id) {
                alert(`Προβολή ${getCategoryTitle(category)} με ID: ${id}`);
            };
            
            window.replyToItem = function(category, id) {
                alert(`Απάντηση στο ${getCategoryTitle(category)} με ID: ${id}`);
            };
            
            window.downloadItem = function(category, id) {
                alert(`Λήψη ${getCategoryTitle(category)} με ID: ${id}`);
            };
            
            window.deleteItem = function(category, id) {
                if (confirm(`Είστε σίγουρος ότι θέλετε να διαγράψετε αυτό το ${getCategoryTitle(category).toLowerCase()};`)) {
                    data[category] = data[category].filter(item => item.id !== id);
                    saveData();
                    loadCategoryData(category);
                    updateCounts();
                    alert(`${getCategoryTitle(category)} διαγράφηκε επιτυχώς!`);
                }
            };
            
            // Αρχική φόρτωση
            loadAllData();
        });
    </script>
</body>
</html>
