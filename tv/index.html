<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>LIVE ΣΤΟΙΧΕΙΑ</title>
    <style>
        /* RIZIKA MOBILE FIRST */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1e2b;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        .sub {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 32px;
            border-bottom: 1px solid #eef2f6;
            padding-bottom: 20px;
        }
        /* ΚΟΥΜΠΙΑ – ΜΙΚΡΑ, ΛΕΠΤΑ, ΓΡΑΜΜΑΤΑ ΜΙΚΡΑ */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: white;
            border: 1.2px solid #e2e8f0;
            border-radius: 40px;
            padding: 12px 16px;
            margin-bottom: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
            background: #f9fbfd;
        }
        .btn i {
            margin-right: 8px;
            font-size: 18px;
        }
        /* ΜΟΝΟ ΤΟ ΤΕΛΕΥΤΑΙΟ ΕΧΕΙ LINK – ΔΕΝ ΤΟΝ ΑΛΛΑΖΟΥΜΕ ΟΠΤΙΚΑ */
        .btn-last {
            background: #eaf2ff;
            border-color: #2563eb;
            color: #2563eb;
            font-weight: 600;
            border-width: 1.5px;
            margin-top: 8px;
        }
        .btn-last i {
            color: #2563eb;
        }
        /* ΔΙΑΦΗΜΙΣΤΙΚΟΣ ΧΩΡΟΣ – ΜΙΚΡΟΣ, ΔΙΑΚΡΙΤΙΚΟΣ */
        .ad-container {
            width: 100%;
            margin: 24px 0;
            padding: 8px 0;
            border-top: 1px dashed #d1d5db;
            border-bottom: 1px dashed #d1d5db;
            background: #fafcfc;
            border-radius: 12px;
        }
        .ad-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #9ca3af;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: center;
        }
        .note {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #edf2f7;
        }
        /* ΔΙΑΣΤΗΜΑΤΑ */
        .spacer {
            height: 8px;
        }
        /* EMOJI ΣΑΝ ICON */
        .emoji-icon {
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="card">
        
        <div class="title">⚽ ΠΑΟΚ – ΠΑΝΑΘΗΝΑΪΚΟΣ</div>
        <div class="sub">LIVE · Κύπελλο </div>

        <!-- 1o ΚΟΥΜΠΙ – ΜΟΝΟ ΚΕΙΜΕΝΟ, ΧΩΡΙΣ LINK -->
        <div class="btn">
            <span class="emoji-icon">▶️</span> Κλικ εδώ να δείτε τον αγώνα
        </div>
        
        <!-- 2o ΚΟΥΜΠΙ – ΜΟΝΟ ΚΕΙΜΕΝΟ, ΧΩΡΙΣ LINK -->
        <div class="btn">
            <span class="emoji-icon">🏆</span> Κλικ εδώ για περισσότερα
        </div>

        <!-- ΔΙΑΦΗΜΙΣΗ #1 – ΑΝΑΜΕΣΑ ΣΤΑ ΚΟΥΜΠΙΑ -->
        <div class="ad-container">
            <div class="ad-label">Διαφήμιση</div>
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
            <ins class="adsbygoogle"
                 style="display:block; text-align:center;"
                 data-ad-layout="in-article"
                 data-ad-format="fluid"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- 3o ΚΟΥΜΠΙ – ΜΟΝΟ ΚΕΙΜΕΝΟ, ΧΩΡΙΣ LINK -->
        <div class="btn">
            <span class="emoji-icon">📱</span> Live τώρα
        </div>
        
        <!-- 4o ΚΟΥΜΠΙ – ΜΟΝΟ ΚΕΙΜΕΝΟ, ΧΩΡΙΣ LINK -->
        <div class="btn">
            <span class="emoji-icon">🎬</span> Δείτε highlights
        </div>

        <!-- ΔΙΑΦΗΜΙΣΗ #2 – ΑΝΑΜΕΣΑ -->
        <div class="ad-container">
            <div class="ad-label">Διαφήμιση</div>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="3092455087"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- 5o ΚΟΥΜΠΙ – ΤΕΛΕΥΤΑΙΟ, ΜΟΝΟ ΑΥΤΟ ΕΧΕΙ LINK (ΚΛΙΚ ΕΔΩ ΓΙΑ ΠΕΡΙΣΣΟΤΕΡΑ) -->
        <a href="http://www.fawanews.sc/PAOK%20vs%20Panathinaikos.html" 
           class="btn btn-last" 
           target="_blank" 
           rel="noopener noreferrer">
            <span class="emoji-icon">🔗</span> Κλικ εδώ για περισσότερα
        </a>

        <!-- EXTRA ΔΙΑΦΗΜΙΣΗ (ΠΡΟΑΙΡΕΤΙΚΗ) -->
        <div class="ad-container" style="margin-top: 28px;">
            <div class="ad-label">Προτεινόμενο</div>
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="note">
            🥰🥰🥰🥰🥰🥰
        </div>

    </div>
</body>
</html>
