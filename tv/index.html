<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ζωντανός Αγώνας Ποδοσφαίρου | Live Stream</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        
        /* Header με διαφήμιση */
        .header-ad {
            background: #111;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #e94560;
        }
        
        /* Κύριο περιεχόμενο - Ζωντανή Ροή */
        .main-stream {
            width: 100%;
            height: calc(100vh - 200px);
            min-height: 500px;
            background: #000;
        }
        
        #liveStream {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Διαφημίσεις */
        .ad-container {
            background: #222;
            margin: 0 auto;
            text-align: center;
            padding: 10px;
        }
        
        .top-ad {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            padding: 15px;
        }
        
        .middle-ad {
            margin: 15px auto;
            max-width: 728px;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .bottom-ad {
            background: #111;
            padding: 20px;
            border-top: 2px solid #333;
        }
        
        .sticky-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            padding: 10px;
            z-index: 1000;
            border-top: 2px solid #e94560;
            display: none;
        }
        
        .close-ad {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main-stream {
                height: calc(100vh - 150px);
                min-height: 300px;
            }
            
            .sticky-ad {
                display: block;
            }
            
            .middle-ad {
                margin: 10px auto;
                max-width: 320px;
            }
        }
        
        @media (max-width: 480px) {
            .main-stream {
                height: calc(100vh - 120px);
                min-height: 250px;
            }
        }
        
        /* Loading spinner */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #e94560;
            z-index: 1001;
            display: none;
        }
        
        .loader.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Top Ad -->
    <div class="header-ad top-ad">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    
    <!-- Main Stream -->
    <div class="main-stream">
        <iframe id="liveStream" 
                src="https://web.camel1.live/football/aris-thessaloniki-vs-p" 
                allowfullscreen 
                scrolling="no" 
                frameborder="0"
                allow="autoplay; encrypted-media">
        </iframe>
    </div>
    
    <!-- Middle Ad -->
    <div class="ad-container middle-ad">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"
             data-ad-format="horizontal"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    
    <!-- Bottom Ad -->
    <div class="ad-container bottom-ad">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    
    <!-- Sticky Mobile Ad -->
    <div class="sticky-ad" id="stickyAd">
        <button class="close-ad" id="closeAd">&times;</button>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"
             data-ad-format="autorelaxed"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    
    <!-- Loading Spinner -->
    <div class="loader" id="loader">Φόρτωση ροής...</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const liveStream = document.getElementById('liveStream');
            const loader = document.getElementById('loader');
            const stickyAd = document.getElementById('stickyAd');
            const closeAd = document.getElementById('closeAd');
            
            // Φόρτωση ροής
            loader.classList.add('active');
            
            liveStream.addEventListener('load', function() {
                loader.classList.remove('active');
                console.log('Stream loaded successfully');
            });
            
            liveStream.addEventListener('error', function() {
                loader.innerHTML = 'Σφάλμα φόρτωσης ροής. Δοκιμάστε ξανά...';
                setTimeout(function() {
                    liveStream.src = 'https://web.camel1.live/football/aris-thessaloniki-vs-p?t=' + Date.now();
                }, 5000);
            });
            
            // Διαχείριση Sticky Ad για mobile
            function handleStickyAd() {
                if (window.innerWidth <= 768) {
                    stickyAd.style.display = 'block';
                } else {
                    stickyAd.style.display = 'none';
                }
            }
            
            closeAd.addEventListener('click', function() {
                stickyAd.style.display = 'none';
                localStorage.setItem('adClosed', 'true');
            });
            
            // Έλεγχος αν ο χρήστης έχει κλείσει το ad
            if (localStorage.getItem('adClosed') === 'true') {
                stickyAd.style.display = 'none';
            } else {
                handleStickyAd();
            }
            
            window.addEventListener('resize', handleStickyAd);
            
            // Αυτόματο refresh ροής κάθε 10 λεπτά
            setInterval(function() {
                loader.classList.add('active');
                liveStream.src = liveStream.src.split('?')[0] + '?refresh=' + Date.now();
            }, 600000);
            
            // Αποτροπή πλοήγησης
            window.onbeforeunload = function() {
                return 'Ο αγώνας είναι ζωντανός! Θέλετε σίγουρα να φύγετε;';
            };
            
            // Fullscreen με διπλό κλικ
            liveStream.parentElement.addEventListener('dblclick', function() {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    liveStream.parentElement.requestFullscreen();
                }
            });
            
            // Ενεργοποίηση διαφημίσεων
            (adsbygoogle = window.adsbygoogle || []).push({});
            
            // Προσθήκη ασφαλείας για iframe
            try {
                liveStream.contentWindow.onbeforeunload = function(e) {
                    e.preventDefault();
                    e.returnValue = '';
                    return '';
                };
            } catch(e) {
                // Security restriction - ignore
            }
            
            // Εμφάνιση link για backup
            setTimeout(function() {
                console.log('Live Stream URL: https://web.camel1.live/football/aris-thessaloniki-vs-p');
                console.log('Page optimized for ads and streaming');
            }, 1000);
        });
    </script>
</body>
</html>
