<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 ARΗΣ - ΠΑΟΚ Live | Official Stream</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* Initial Popup Ad */
        .initial-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .close-popup {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #e10600;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            z-index: 10001;
        }
        
        /* Play Button Container - Not at top anymore */
        .play-container {
            padding: 40px 20px 20px 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .play-btn {
            display: inline-block;
            background: linear-gradient(45deg, #e10600, #ff4500);
            color: white;
            text-decoration: none;
            padding: 22px 60px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 70px;
            border: 3px solid #ffcc00;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(225, 6, 0, 0.6);
            margin-top: 30px;
        }
        
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(225, 6, 0, 0.8);
        }
        
        /* Match Info */
        .match-info {
            background: rgba(225, 6, 0, 0.1);
            padding: 25px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 600px;
            text-align: center;
        }
        
        .match-teams {
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
            color: #ffcc00;
        }
        
        /* Ads under play button */
        .ad-under-button {
            margin: 30px auto;
            max-width: 800px;
            text-align: center;
        }
        
        /* Single Ad Style - NO BORDERS */
        .single-ad {
            width: 100%;
            min-height: 250px;
            margin: 20px 0;
        }
        
        /* Two ads side by side */
        .two-ads {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 30px auto;
            max-width: 800px;
        }
        
        .ad-item {
            min-height: 250px;
        }
        
        /* Pre-stream popup */
        .pre-stream-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .pre-stream-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #e10600;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #777;
            font-size: 14px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .play-btn {
                padding: 18px 40px;
                font-size: 22px;
                width: 90%;
            }
            
            .match-teams {
                font-size: 24px;
            }
            
            .two-ads {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Initial Popup Ad (shown when page loads) -->
    <div class="initial-popup" id="initialPopup">
        <button class="close-popup" id="closeInitialPopup">X Κλείσιμο</button>
        <div class="single-ad" id="initialAd">
            <!-- Initial popup ad loads here -->
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="play-container">
        <!-- Match Info -->
        <div class="match-info">
            <h1>🔴 ΖΩΝΤΑΝΟΣ ΑΓΩΝΑΣ</h1>
            <div class="match-teams">
                ARΗΣ THESSALONIKI <span style="margin: 0 15px; font-size: 28px;">VS</span> ΠΑΟΚ
            </div>
            <p style="margin-top: 15px; color: #ccc; font-size: 18px;">
                Super League Greece | Live Football Match
            </p>
        </div>
        
        <!-- Play Button -->
        <a href="http://www.fawanews.sc/Aris%20vs%20PAOK.html" 
           target="_blank" 
           class="play-btn"
           id="mainPlayBtn">
            ▶️ ΔΕΙΤΕ ΤΟΝ ΑΓΩΝΑ ΤΩΡΑ LIVE
        </a>
        
        <!-- Ad UNDER the play button -->
        <div class="ad-under-button">
            <div class="single-ad" id="adUnderButton">
                <!-- Ad directly under button -->
            </div>
        </div>
        
        <!-- Two more ads side by side -->
        <div class="two-ads">
            <div class="ad-item" id="adLeft">
                <!-- Left ad -->
            </div>
            <div class="ad-item" id="adRight">
                <!-- Right ad -->
            </div>
        </div>
        
        <!-- More ads below -->
        <div class="ad-under-button">
            <div class="single-ad" id="adBottom1">
                <!-- Bottom ad 1 -->
            </div>
        </div>
        
        <div class="two-ads">
            <div class="ad-item" id="adBottom2">
                <!-- Bottom ad 2 -->
            </div>
            <div class="ad-item" id="adBottom3">
                <!-- Bottom ad 3 -->
            </div>
        </div>
    </div>
    
    <!-- Pre-stream Popup (shown when clicking play button) -->
    <div class="pre-stream-popup" id="preStreamPopup">
        <button class="pre-stream-close" id="closePreStreamPopup">X Συνέχεια στη Ροή</button>
        <div class="single-ad" id="preStreamAd1" style="width: 90%; max-width: 728px; min-height: 200px; margin: 20px 0;">
            <!-- Pre-stream ad 1 -->
        </div>
        <div class="single-ad" id="preStreamAd2" style="width: 90%; max-width: 728px; min-height: 200px; margin: 20px 0;">
            <!-- Pre-stream ad 2 -->
        </div>
    </div>
    
    <footer>
        © 2025 Live Sports Stream | Όλα τα δικαιώματα των μεταδόσεων ανήκουν στους νόμιμους κατόχους.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const STREAM_URL = "http://www.fawanews.sc/Aris%20vs%20PAOK.html";
            const initialPopup = document.getElementById('initialPopup');
            const closeInitialPopup = document.getElementById('closeInitialPopup');
            const mainPlayBtn = document.getElementById('mainPlayBtn');
            const preStreamPopup = document.getElementById('preStreamPopup');
            const closePreStreamPopup = document.getElementById('closePreStreamPopup');
            
            // All ad elements
            const ads = [
                'initialAd',           // Initial popup
                'adUnderButton',       // Under play button
                'adLeft', 'adRight',   // Two ads side by side
                'adBottom1',           // Bottom ad 1
                'adBottom2', 'adBottom3', // Bottom ads 2&3
                'preStreamAd1', 'preStreamAd2' // Pre-stream ads
            ];
            
            // Initialize ALL ads
            function initializeAds() {
                ads.forEach(adId => {
                    const adElement = document.getElementById(adId);
                    if (adElement) {
                        // Clean ad element (no borders, no padding)
                        adElement.style.border = 'none';
                        adElement.style.padding = '0';
                        adElement.style.background = 'transparent';
                        
                        adElement.innerHTML = `
                            <ins class="adsbygoogle"
                                 style="display:block; width:100%; height:100%;"
                                 data-ad-client="ca-pub-3186700611266549"
                                 data-ad-slot="9660744817"
                                 data-ad-format="autorelaxed"
                                 data-full-width-responsive="true"></ins>
                        `;
                    }
                });
                
                // Load ads
                setTimeout(() => {
                    if (window.adsbygoogle) {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                        console.log("All ads initialized");
                    }
                }, 1000);
            }
            
            // Close initial popup
            closeInitialPopup.addEventListener('click', function() {
                initialPopup.style.display = 'none';
                
                // Load main page ads after closing popup
                setTimeout(() => {
                    if (window.adsbygoogle) {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    }
                }, 500);
            });
            
            // When clicking play button
            mainPlayBtn.addEventListener('click', function(e) {
                e.preventDefault(); // Prevent immediate redirect
                
                // Show pre-stream popup with ads
                preStreamPopup.style.display = 'flex';
                
                // Load pre-stream ads
                setTimeout(() => {
                    if (window.adsbygoogle) {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    }
                }, 300);
            });
            
            // Close pre-stream popup and open stream
            closePreStreamPopup.addEventListener('click', function() {
                preStreamPopup.style.display = 'none';
                
                // Open stream in new tab
                setTimeout(() => {
                    window.open(STREAM_URL, '_blank');
                    
                    // Refresh main page ads
                    setTimeout(() => {
                        if (window.adsbygoogle) {
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        }
                    }, 1000);
                }, 300);
            });
            
            // Auto-refresh ads every 25 seconds
            setInterval(() => {
                if (window.adsbygoogle && document.hasFocus()) {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            }, 25000);
            
            // Initialize everything
            initializeAds();
        });
    </script>
</body>
</html>
