<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 ΟΛΥΜΠΙΑΚΟΣ - ΠΑΝΑΘΗΝΑΪΚΟΣ | Ζωντανό</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Match Header */
        .match-header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 25px;
        }
        
        .live-badge {
            display: inline-block;
            background: #e10600;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .match-title {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .team-names {
            font-size: 20px;
            font-weight: 600;
            color: #444;
            margin-bottom: 10px;
        }
        
        .match-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        
        /* Ad Container */
        .ad-container {
            margin: 25px auto;
            text-align: center;
            max-width: 600px;
        }
        
        /* Square Ads - 100% width of container */
        .square-ad-container {
            width: 100%;
            max-width: 600px;
            margin: 25px auto;
            text-align: center;
        }
        
        .square-ad {
            width: 100%;
            height: 250px;
            margin: 0 auto;
            display: block;
        }
        
        /* Buttons Section */
        .buttons-section {
            text-align: center;
            margin: 30px auto;
            max-width: 600px;
        }
        
        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px auto;
        }
        
        .stream-btn {
            display: block;
            background: #e10600;
            color: white;
            text-decoration: none;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            width: 100%;
            text-align: center;
        }
        
        .stream-btn:hover {
            background: #ff2a00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(225, 6, 0, 0.2);
        }
        
        .stream-btn:active {
            transform: translateY(0);
        }
        
        .btn-icon {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .btn-secondary {
            background: #2c3e50;
        }
        
        .btn-secondary:hover {
            background: #34495e;
        }
        
        .btn-tertiary {
            background: #27ae60;
        }
        
        .btn-tertiary:hover {
            background: #2ecc71;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
            font-size: 13px;
            margin-top: 50px;
            border-top: 1px solid #eee;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .match-title {
                font-size: 22px;
            }
            
            .team-names {
                font-size: 18px;
            }
            
            .stream-btn {
                padding: 16px 25px;
                font-size: 16px;
            }
            
            .square-ad {
                height: 200px;
            }
            
            .buttons-grid {
                gap: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .match-title {
                font-size: 20px;
            }
            
            .team-names {
                font-size: 16px;
            }
            
            .stream-btn {
                padding: 14px 20px;
                font-size: 15px;
            }
            
            .square-ad {
                height: 180px;
            }
        }
        
        @media (min-width: 769px) {
            .buttons-grid {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .stream-btn {
                width: auto;
                min-width: 200px;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.stream-btn');
            
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    console.log("Opening live stream...");
                    
                    // Track button clicks
                    const buttonText = this.textContent.trim();
