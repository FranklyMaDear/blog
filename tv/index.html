    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Στοιχεία DOM
            const playButton = document.getElementById('playButton');
            const streamOverlay = document.getElementById('streamOverlay');
            const liveStreamFrame = document.getElementById('liveStreamFrame');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            // URL ζωντανού αγώνα
            const LIVE_STREAM_URL = 'https://web.camel1.live/football/ofi-crete-vs-levadiakos/live/zp5rzghgp6zjq82';
            
            // Λειτουργία PLAY για ζωντανή ροή
            playButton.addEventListener('click', function() {
                // Εμφάνιση loading
                loadingSpinner.style.display = 'block';
                playButton.style.display = 'none';
                
                // Φόρτωση του iframe με τον ζωντανό αγώνα
                liveStreamFrame.src = LIVE_STREAM_URL;
                
                // Μετά από 3 δευτερόλεπτα, απόκρυψη overlay
                setTimeout(function() {
                    streamOverlay.style.opacity = '0';
                    setTimeout(function() {
                        streamOverlay.style.display = 'none';
                        loadingSpinner.style.display = 'none';
                    }, 500);
                }, 3000);
            });
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) event.preventDefault();
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) event.preventDefault();
                lastTouchEnd = now;
            }, false);
            
            // Αποτροπή πλοήγησης από iframe
            liveStreamFrame.addEventListener('load', function() {
                try {
                    // Αποτροπή πλοήγησης σε νέα tab
                    const iframeWindow = liveStreamFrame.contentWindow;
                    iframeWindow.onbeforeunload = function(e) {
                        e.preventDefault();
                        e.returnValue = '';
                        return 'Ο αγώνας παίζεται εδώ. Παρακαλώ μην φύγετε από τη σελίδα!';
                    };
                    
                    // Αποτροπή αναδρομής
                    iframeWindow.location.origin = window.location.origin;
                } catch (e) {
                    console.log('Security restrictions apply');
                }
            });
            
            // Διαχείριση sticky mobile ad
            const stickyMobileAd = document.getElementById('stickyMobileAd');
            const closeStickyAdBtn = document.getElementById('closeStickyAd');
            
            function hasUserClosedStickyAd() {
                return localStorage.getItem('stickyMobileAdClosed') === 'true';
            }
            
            function handleStickyMobileAd() {
                const isMobile = window.innerWidth <= 768;
                
                if (isMobile && !hasUserClosedStickyAd()) {
                    setTimeout(() => {
                        stickyMobileAd.style.display = 'flex';
                    }, 1500);
                } else {
                    stickyMobileAd.style.display = 'none';
                }
            }
            
            function closeStickyMobileAd() {
                stickyMobileAd.style.display = 'none';
                localStorage.setItem('stickyMobileAdClosed', 'true');
            }
            
            closeStickyAdBtn.addEventListener('click', closeStickyMobileAd);
            
            setTimeout(() => {
                if (stickyMobileAd.style.display === 'flex') closeStickyMobileAd();
            }, 12000);
            
            // Διαχείριση sidebar για desktop
            function handleDesktopSidebar() {
                const desktopSidebar = document.getElementById('desktopSidebar');
                const isDesktop = window.innerWidth > 1100;
                
                if (isDesktop) {
                    desktopSidebar.style.display = 'block';
                } else {
                    desktopSidebar.style.display = 'none';
                }
            }
            
            // Initialize Ads
            function initializeAds() {
                if (window.adsbygoogle) {
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch (e) {
                        console.error('Error initializing ads:', e);
                    }
                } else {
                    setTimeout(initializeAds, 1000);
                }
            }
            
            // Lazy load ads on scroll
            let adsInitialized = false;
            window.addEventListener('scroll', function() {
                if (!adsInitialized) {
                    initializeAds();
                    adsInitialized = true;
                }
            });
            
            // Αυτόματο refresh της ροής κάθε 10 λεπτά (προαιρετικό)
            setInterval(function() {
                if (streamOverlay.style.display === 'none') {
                    console.log('Refreshing stream...');
                    // Προσθήκη timestamp για να αποφευχθεί cache
                    liveStreamFrame.src = LIVE_STREAM_URL + '?t=' + new Date().getTime();
                }
            }, 600000); // 10 λεπτά
            
            // Αρχικές ρυθμίσεις
            handleStickyMobileAd();
            window.addEventListener('resize', handleStickyMobileAd);
            
            handleDesktopSidebar();
            window.addEventListener('resize', handleDesktopSidebar);
            
            // Αρχικοποίηση διαφημίσεων
            setTimeout(initializeAds, 800);
            
            // Προσθήκη fullscreen support
            function toggleFullscreen() {
                const elem = document.documentElement;
                if (!document.fullscreenElement) {
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen();
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen();
                    } else if (elem.msRequestFullscreen) {
                        elem.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            }
            
            // Δυνατότητα fullscreen με διπλό κλικ στο video
            liveStreamFrame.addEventListener('dblclick', toggleFullscreen);
            
            // Πληροφορίες για τον αγώνα
            console.log('Live Stream Page Loaded');
            console.log('Match: OFI Crete vs Levadiakos');
            console.log('Stream URL:', LIVE_STREAM_URL);
        });
    </script>
