        /* Βελτίωση για iOS */

        input, textarea, select {

        /* RESPONSIVE */

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) event.preventDefault();
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) event.preventDefault();
                lastTouchEnd = now;
            }, false);
            
            // Προσαρμογή widget για responsive
            function adjustWidgetSize() {
                const widgetContainer = document.getElementById('widget-mh0nmlduuza6');
                const isMobile = window.innerWidth <= 768;
                
                if (widgetContainer) {
                    if (isMobile) {
                        // Για mobile, κάνουμε το widget πλήρως responsive
                        widgetContainer.style.width = '100%';
                        widgetContainer.style.maxWidth = '100%';
                        widgetContainer.style.overflowX = 'auto';
                        widgetContainer.style.fontSize = '12px';
                    } else {
                        // Για desktop
                        widgetContainer.style.width = 'auto';
                        widgetContainer.style.maxWidth = '1000px';
                        widgetContainer.style.fontSize = '14px';
                    }
                }
            }
            
            // Διαχείριση sticky mobile ad
            const stickyMobileAd = document.getElementById('stickyMobileAd');
            const closeStickyAdBtn = document.getElementById('closeStickyAd');
            
            function hasUserClosedStickyAd() {
                return localStorage.getItem('stickyMobileAdClosed') === 'true';
            }
            
            function handleStickyMobileAd() {
                const isMobile = window.innerWidth <= 768;
                
                if (isMobile && !hasUserClosedStickyAd()) {
                    setTimeout(() => {
                        stickyMobileAd.style.display = 'flex';
                    }, 1500);
                } else {
                    stickyMobileAd.style.display = 'none';
                }
            }
            
            function closeStickyMobileAd() {
                stickyMobileAd.style.display = 'none';
                localStorage.setItem('stickyMobileAdClosed', 'true');
            }
            
            closeStickyAdBtn.addEventListener('click', closeStickyMobileAd);
            
            setTimeout(() => {
                if (stickyMobileAd.style.display === 'flex') closeStickyMobileAd();
            }, 12000);
            
            // Διαχείριση sidebar για desktop
            function handleDesktopSidebar() {
                const desktopSidebar = document.getElementById('desktopSidebar');
                const isDesktop = window.innerWidth > 1100;
                
                if (isDesktop) {
                    desktopSidebar.style.display = 'block';
                } else {
                    desktopSidebar.style.display = 'none';
                }
            }
            
            // Initialize Ads
            function initializeAds() {
                if (window.adsbygoogle) {
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch (e) {
                        console.error('Error initializing ads:', e);
                    }
                } else {
                    setTimeout(initializeAds, 1000);
                }
            }
            
            // Lazy load ads on scroll
            let adsInitialized = false;
            window.addEventListener('scroll', function() {
                if (!adsInitialized) {
                    initializeAds();
                    adsInitialized = true;
                }
            });
            
            // Αυτόματο refresh του widget κάθε 5 λεπτά
            setInterval(function() {
                const widgetScript = document.querySelector('script[src*="scoreaxis.com"]');
                if (widgetScript) {
                    // Δημιουργία νέου script element για refresh
                    const newScript = document.createElement('script');
                    newScript.src = widgetScript.src.split('?')[0] + '?widgetId=mh0nmlduuza6&lang=el&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&font=heebo&fontSize=14&rowDensity=100&widgetWidth=auto&widgetHeight=auto&bodyColor=%23ffffff&textColor=%23141416&linkColor=%23141416&borderColor=%23ecf1f7&tabColor=%23f3f8fd&t=' + new Date().getTime();
                    newScript.async = true;
                    
                    // Αντικατάσταση του παλιού script
                    widgetScript.parentNode.replaceChild(newScript, widgetScript);
                }
            }, 300000); // 5 λεπτά
            
            // Αρχικές ρυθμίσεις
            adjustWidgetSize();
            window.addEventListener('resize', adjustWidgetSize);
            
            handleStickyMobileAd();
            window.addEventListener('resize', handleStickyMobileAd);
            
            handleDesktopSidebar();
            window.addEventListener('resize', handleDesktopSidebar);
            
            // Αρχικοποίηση διαφημίσεων
            setTimeout(initializeAds, 800);
        });
    </script>
