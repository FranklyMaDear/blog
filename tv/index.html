    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const STREAM_URL = "http://www.fawanews.sc/Olympiacos%20vs%20Panathinaikos%20---%20CH%201.html";
            
            // Ads array
            const ads = [
                { id: 'adWrapper1', container: 'adContainer1' },
                { id: 'adWrapper2', container: 'adContainer2' },
                { id: 'adWrapper3', container: 'adContainer3' },
                { id: 'adWrapper4', container: 'adContainer4' },
                { id: 'adWrapper5', container: 'adContainer5' }
            ];
            
            // Initialize ads
            function initializeAds() {
                if (window.adsbygoogle) {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
                
                // Check ads after loading
                setTimeout(checkAds, 3000);
            }
            
            // Check which ads loaded
            function checkAds() {
                ads.forEach(ad => {
                    const wrapper = document.getElementById(ad.id);
                    const container = document.getElementById(ad.container);
                    
                    if (wrapper && container) {
                        // Check if ad has content
                        const hasContent = wrapper.offsetHeight > 50 || 
                                         wrapper.innerHTML.includes('iframe') ||
                                         wrapper.innerHTML.includes('img');
                        
                        if (!hasContent) {
                            container.classList.add('ad-hidden');
                        }
                    }
                });
            }
            
            // Play button
            const playBtn = document.getElementById('mainPlayBtn');
            if (playBtn) {
                playBtn.addEventListener('click', function() {
                    console.log("Opening stream...");
                    
                    // Refresh ads
                    setTimeout(() => {
                        if (window.adsbygoogle) {
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        }
                    }, 300);
                });
            }
            
            // Auto-refresh ads
            setInterval(() => {
                if (window.adsbygoogle && document.hasFocus()) {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            }, 30000);
            
            // Initialize
            initializeAds();
        });
    </script>
