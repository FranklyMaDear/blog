<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 ΟΛΥΜΠΙΑΚΟΣ - ΠΑΝΑΘΗΝΑΪΚΟΣ | Ζωντανό</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Match Header */
        .match-header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
        }
        
        .live-badge {
            display: inline-block;
            background: #e10600;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .match-title {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .team-names {
            font-size: 20px;
            font-weight: 600;
            color: #444;
            margin-bottom: 10px;
        }
        
        .match-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        
        /* Your Ad - Centered */
        .ad-container {
            margin: 30px auto;
            text-align: center;
            max-width: 600px;
        }
        
        /* Play Button */
        .play-section {
            text-align: center;
            padding: 40px 20px;
            margin: 40px auto;
        }
        
        .play-btn {
            display: inline-block;
            background: #e10600;
            color: white;
            text-decoration: none;
            padding: 20px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(225, 6, 0, 0.3);
            border: none;
        }
        
        .play-btn:hover {
            background: #ff2a00;
            transform: scale(1.03);
        }
        
        .play-icon {
            margin-right: 10px;
            font-size: 22px;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
            font-size: 13px;
            margin-top: 50px;
            border-top: 1px solid #eee;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .match-title {
                font-size: 22px;
            }
            
            .team-names {
                font-size: 18px;
            }
            
            .play-btn {
                padding: 18px 40px;
                font-size: 20px;
                width: 90%;
            }
        }
        
        @media (max-width: 480px) {
            .match-title {
                font-size: 20px;
            }
            
            .team-names {
                font-size: 16px;
            }
            
            .play-btn {
                padding: 16px 35px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Match Header -->
        <div class="match-header">
            <div class="live-badge">🔴 ΖΩΝΤΑΝΑ</div>
            <h1 class="match-title">SUPER LEAGUE DERBY</h1>
            <div class="team-names">ΟΛΥΜΠΙΑΚΟΣ - ΠΑΝΑΘΗΝΑΪΚΟΣ</div>
            <div class="match-info">Σάββατο 20:30 | Στάδιο Καραϊσκάκη</div>
        </div>
        
        <!-- Your Single Ad -->
        <div class="ad-container">
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
                crossorigin="anonymous"></script>
            <ins class="adsbygoogle"
                style="display:block"
                data-ad-format="autorelaxed"
                data-ad-client="ca-pub-3186700611266549"
                data-ad-slot="9660744817"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
        
        <!-- Play Button -->
        <div class="play-section">
            <a href="http://www.fawanews.sc/Olympiacos%20vs%20Panathinaikos%20---%20CH%201.html" 
               target="_blank" 
               class="play-btn"
               id="mainPlayBtn">
                <span class="play-icon">▶️</span> ΖΩΝΤΑΝΗ ΡΟΗ
            </a>
        </div>
    </div>
    
    <footer>
        © 2025 Live Sports | Όλα τα δικαιώματα των μεταδόσεων ανήκουν στους νόμιμους κατόχους.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const playBtn = document.getElementById('mainPlayBtn');
            
            if (playBtn) {
                playBtn.addEventListener('click', function() {
                    console.log("Opening live stream...");
                });
            }
        });
    </script>
</body>
</html>
