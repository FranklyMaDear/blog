<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Favicon -->
    <link rel="icon" href="https://blog.franklymadear.com/videos/one/thumbnail56.png" type="image/png">
    <link rel="apple-touch-icon" href="https://blog.franklymadear.com/videos/one/thumbnail56.png">
    
    <!-- iOS και Android tags για native fullscreen experience -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Open Graph Meta Tags για Facebook, WhatsApp, κλπ -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Must Watch Exclusive Video">
    <meta property="og:description" content="Exclusive video content you must watch">
    <meta property="og:url" content="https://blog.franklymadear.com/videos/one/index.html">
    <meta property="og:image" content="https://blog.franklymadear.com/videos/one/thumbnail56.png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:video" content="https://blog.franklymadear.com/videos/one/video56.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="1280">
    <meta property="og:video:height" content="720">
    <meta property="og:site_name" content="FmD Videos">
    
    <!-- X (Twitter) Player Card Tags - ΔΙΟΡΘΩΜΕΝΑ -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FmD699">
    <meta name="twitter:title" content="Must Watch Exclusive Video">
    <meta name="twitter:description" content="Exclusive video content you must watch">
    <meta name="twitter:image" content="https://blog.franklymadear.com/videos/one/thumbnail56.png">
    <meta name="twitter:player" content="https://blog.franklymadear.com/videos/one/index.html">
    <meta name="twitter:player:width" content="480">
    <meta name="twitter:player:height" content="480">
    <meta name="twitter:player:stream" content="https://blog.franklymadear.com/videos/one/video56.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <!-- Απόκρυψη διεύθυνσης URL και απόσπαση προσοχής από URL -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    
    <title>Must Watch Exclusive Video</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        /* Hide URL bar on mobile */
        @media (max-width: 768px) {
            body {
                height: 100vh;
                overflow: hidden;
            }
        }
        
        /* MAIN CONTAINER */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* VIDEO */
        #mainVideo {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            background: #000;
        }
        
        /* Thumbnail overlay */
        .thumbnail-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            max-width: 100%;
            max-height: 100%;
        }
        
        .thumbnail-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        
        /* Play button - ΓΚΡΙ ΔΙΑΦΑΝΟ */
        .play-button-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(128, 128, 128, 0.7);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .play-button-center:hover {
            background: rgba(128, 128, 128, 0.9);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .play-button-center::after {
            content: '▶';
            color: white;
            font-size: 28px;
            margin-left: 3px;
            font-weight: bold;
        }
        
        /* Progress bar */
        .progress-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 4;
            cursor: pointer;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-container:hover .progress-container {
            opacity: 1;
        }
        
        .progress-bar {
            position: relative;
            height: 100%;
            width: 0%;
            background: #1d9bf0;
            border-radius: 2px;
            transition: width 0.1s;
        }
        
        /* Monetag Ad Container */
        .monetag-ad-overlay {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            height: 80px;
            z-index: 5;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Controls */
        .video-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 10px 20px;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .video-container:hover .video-controls {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            opacity: 0.9;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }
        
        /* Timer - mm:ss */
        .timer {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            min-width: 60px;
            letter-spacing: -0.5px;
        }
        
        /* Time tooltip */
        .time-tooltip {
            position: absolute;
            top: -30px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%);
            transition: opacity 0.2s;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .progress-container:hover .time-tooltip {
            opacity: 1;
        }
        
        /* Loading spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #1d9bf0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 6;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Hide URL bar on mobile */
        @media (max-height: 400px) {
            .video-controls {
                bottom: 10px;
                padding: 6px 12px;
            }
            
            .progress-container {
                bottom: 45px;
            }
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .play-button-center {
                width: 60px;
                height: 60px;
            }
            
            .play-button-center::after {
                font-size: 24px;
            }
            
            .video-controls {
                bottom: 15px;
                padding: 8px 16px;
                gap: 15px;
            }
            
            .control-btn {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }
            
            .progress-container {
                bottom: 50px;
                width: 85%;
            }
            
            .timer {
                font-size: 13px;
            }
        }
        
        /* X/Twitter player specific */
        @media (max-width: 480px) {
            .play-button-center {
                width: 50px;
                height: 50px;
            }
            
            .play-button-center::after {
                font-size: 20px;
            }
            
            .progress-container {
                width: 80%;
                bottom: 45px;
            }
            
            .video-controls {
                gap: 12px;
                padding: 6px 14px;
            }
            
            .control-btn {
                width: 34px;
                height: 34px;
                font-size: 18px;
            }
        }
        
        /* Fullscreen adjustments */
        .video-container:fullscreen .progress-container {
            bottom: 80px;
        }
        
        .video-container:fullscreen .video-controls {
            bottom: 30px;
        }
    </style>
    
    <!-- JavaScript για απόκρυψη URL -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                // Προσθήκη αυτής της γραμμής για iOS
                document.body.style.height = window.innerHeight + 'px';
                
                // Αποτροπή zoom
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                // Αποτροπή κινητών URL bars
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });
    </script>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- Thumbnail overlay -->
        <div class="thumbnail-overlay" id="thumbnailOverlay">
            <img class="thumbnail-img" src="https://blog.franklymadear.com/videos/one/thumbnail56.png" alt="Video Thumbnail" 
                 onerror="this.style.display='none';">
        </div>
        
        <!-- Play button -->
        <button class="play-button-center" id="playButton"></button>
        
        <!-- Main video -->
        <video id="mainVideo" preload="auto" playsinline muted>
            <source src="https://blog.franklymadear.com/videos/one/video56.mp4" type="video/mp4">
        </video>
        
        <!-- Progress bar with Monetag overlay -->
        <div class="progress-container" id="progressContainer">
            <div class="time-tooltip" id="timeTooltip">00:00</div>
            <div class="progress-bar" id="progressBar"></div>
            <!-- Monetag Ad Container -->
            <div class="monetag-ad-overlay" id="monetagAdOverlay"></div>
        </div>
        
        <!-- Video controls -->
        <div class="video-controls">
            <button class="control-btn" id="playPauseBtn">⏸</button>
            <div class="timer" id="currentTime">00:00</div>
            <div style="opacity: 0.3; color: white;">/</div>
            <div class="timer" id="durationTime">00:00</div>
            <button class="control-btn" id="muteBtn">🔇</button>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const playButton = document.getElementById('playButton');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const timeTooltip = document.getElementById('timeTooltip');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const monetagAdOverlay = document.getElementById('monetagAdOverlay');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let hasAutoPlayed = false;
        let isHoveringProgress = false;
        let videoWidth = 0;
        let videoHeight = 0;
        let monetagLoaded = false;
        
        // Format time σε mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTime() {
            currentTimeEl.textContent = formatTime(mainVideo.currentTime);
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                durationTimeEl.textContent = formatTime(mainVideo.duration);
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                progressBar.style.width = `${progress}%`;
            }
        }
        
        // Update time tooltip on hover
        let lastHoverX = 0;
        
        function updateTimeTooltip() {
            if (!mainVideo.duration || isNaN(mainVideo.duration)) return;
            
            const rect = progressContainer.getBoundingClientRect();
            const percent = (lastHoverX - rect.left) / rect.width;
            const time = percent * mainVideo.duration;
            
            timeTooltip.textContent = formatTime(time);
            timeTooltip.style.left = `${percent * 100}%`;
        }
        
        // Load Monetag script
        function loadMonetag() {
            if (!monetagLoaded) {
                monetagLoaded = true;
                
                // Δημιουργία script για Monetag
                const newScript = document.createElement('script');
                newScript.dataset.zone = '10274195';
                newScript.src = 'https://al5sm.com/tag.min.js';
                newScript.async = true;
                newScript.setAttribute('data-cfasync', 'false');
                
                // Προσθήκη στο monetagAdOverlay
                monetagAdOverlay.appendChild(newScript);
                
                console.log('Monetag script loaded in progress bar overlay');
            }
        }
        
        // Seek to specific time
        function seekToTime(clientX) {
            const rect = progressContainer.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            
            mainVideo.currentTime = time;
            
            // Εμφάνιση loading spinner
            loadingSpinner.style.display = 'block';
            
            setTimeout(() => {
                loadingSpinner.style.display = 'none';
            }, 300);
            
            // Φόρτωση Monetag κατά το seeking
            loadMonetag();
        }
        
        // Start video
        function startVideo() {
            playButton.style.display = 'none';
            
            mainVideo.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                thumbnailOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                    muteBtn.textContent = '🔊';
                }
                
                // Φόρτωση Monetag μετά το play
                setTimeout(loadMonetag, 1000);
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(e => {
                    console.log('Fullscreen error:', e);
                });
                fullscreenBtn.textContent = '🗗';
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
        
        // Try autoplay for X player
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                hasAutoPlayed = true;
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }
                }, 1000);
                
                // Φόρτωση Monetag μετά το autoplay
                setTimeout(loadMonetag, 1500);
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Προσαρμογή thumbnail στο μέγεθος του βίντεο
        function adjustThumbnailSize() {
            if (videoWidth > 0 && videoHeight > 0) {
                thumbnailOverlay.style.width = `${videoWidth}px`;
                thumbnailOverlay.style.height = `${videoHeight}px`;
            }
        }
        
        // Progress bar interaction
        progressContainer.addEventListener('mousemove', (e) => {
            lastHoverX = e.clientX;
            isHoveringProgress = true;
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                updateTimeTooltip();
            }
        });
        
        progressContainer.addEventListener('mouseleave', () => {
            isHoveringProgress = false;
            timeTooltip.style.opacity = '0';
        });
        
        progressContainer.addEventListener('click', (e) => {
            seekToTime(e.clientX);
        });
        
        // Touch support
        progressContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            seekToTime(e.touches[0].clientX);
        });
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight);
            
            adjustThumbnailSize();
            updateTime();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            }
        });
        
        mainVideo.addEventListener('resize', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            adjustThumbnailSize();
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '⟳';
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px;">Video Error</div>
                    <div style="font-size: 14px; opacity: 0.8;">
                        Check if video56.mp4 exists at: https://blog.franklymadear.com/videos/one/video56.mp4
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        mainVideo.addEventListener('click', togglePlayPause);
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'KeyM':
                    toggleMute();
                    break;
                case 'KeyF':
                    toggleFullscreen();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(mainVideo.duration, mainVideo.currentTime + 5);
                    break;
            }
        });
        
        // Show/hide controls
        let controlsTimeout;
        videoContainer.addEventListener('mousemove', () => {
            const controls = document.querySelector('.video-controls');
            const progress = document.querySelector('.progress-container');
            
            if (isPlaying || hasAutoPlayed) {
                controls.style.opacity = '1';
                progress.style.opacity = '1';
                
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (isPlaying && !isHoveringProgress) {
                        controls.style.opacity = '0';
                        progress.style.opacity = '0';
                    }
                }, 3000);
            }
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        // Fullscreen change events
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.textContent = '⛶';
            }
        });
        
        // Initial Monetag load after page load
        window.addEventListener('load', () => {
            setTimeout(loadMonetag, 2000);
            
            // Απόκρυψη URL
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - https://blog.franklymadear.com/videos/one/index.html');
        
        // Track video views for analytics
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - FmD @FmD699');
        });
        
    </script>
</body>
</html>
