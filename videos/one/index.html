<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Favicon -->
    <link rel="icon" href="thumbnail56.png" type="image/png">
    <link rel="apple-touch-icon" href="thumbnail56.png">
    
    <!-- iOS και Android tags για native fullscreen experience -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Open Graph Meta Tags για Facebook, WhatsApp, κλπ -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Must Watch Exclusive Video">
    <meta property="og:image" content="thumbnail56.png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:video" content="video56.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="1280">
    <meta property="og:video:height" content="720">
    
    <!-- X (Twitter) Player Card Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Must Watch Exclusive Video">
    <meta name="twitter:image" content="thumbnail56.png">
    <meta name="twitter:player" content="index.html">
    <meta name="twitter:player:width" content="375">
    <meta name="twitter:player:height" content="667">
    <meta name="twitter:player:stream" content="video56.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <!-- Απόκρυψη διεύθυνσης URL και απόσπαση προσοχής από URL -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    
    <title>Must Watch Exclusive Video</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        /* Hide URL bar on mobile */
        @media (max-width: 768px) {
            body {
                height: 100vh;
                overflow: hidden;
            }
        }
        
        /* MAIN CONTAINER */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* VIDEO */
        #mainVideo {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            background: #000;
        }
        
        /* Thumbnail overlay */
        .thumbnail-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            max-width: 100%;
            max-height: 100%;
        }
        
        .thumbnail-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        
        /* Play button - ΓΚΡΙ ΔΙΑΦΑΝΟ */
        .play-button-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(128, 128, 128, 0.7);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .play-button-center:hover {
            background: rgba(128, 128, 128, 0.9);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .play-button-center::after {
            content: '▶';
            color: white;
            font-size: 28px;
            margin-left: 3px;
            font-weight: bold;
        }
        
        /* Progress bar - ΣΤΥΛ Ξ (Χωρίς controls, μόνο η γραμμή) */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 4;
            cursor: pointer;
        }
        
        .progress-bar {
            position: relative;
            height: 100%;
            width: 0%;
            background: #1d9bf0;
            transition: width 0.1s;
        }
        
        /* Time Display - Σαν στην εικόνα, πάνω από το βίντεο */
        .time-display {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
            font-weight: 500;
            z-index: 5;
            display: none;
            backdrop-filter: blur(5px);
        }
        
        .video-container:hover .time-display {
            display: block;
        }
        
        /* Volume Control - Μικρό και απλό */
        .volume-control {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            z-index: 5;
            font-size: 14px;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-container:hover .volume-control {
            opacity: 1;
        }
        
        /* Monetag Ad Container */
        .monetag-ad-overlay {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 50px;
            z-index: 5;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Fullscreen button - Κάτω δεξιά */
        .fullscreen-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            z-index: 5;
            font-size: 14px;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-container:hover .fullscreen-btn {
            opacity: 1;
        }
        
        /* Loading spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #1d9bf0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 6;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .play-button-center {
                width: 60px;
                height: 60px;
            }
            
            .play-button-center::after {
                font-size: 24px;
            }
            
            .time-display {
                bottom: 10px;
                right: 10px;
                font-size: 12px;
            }
            
            .volume-control, .fullscreen-btn {
                bottom: 10px;
                width: 22px;
                height: 22px;
                font-size: 12px;
            }
            
            .volume-control {
                left: 10px;
            }
            
            .monetag-ad-overlay {
                width: 250px;
                height: 40px;
                bottom: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .play-button-center {
                width: 50px;
                height: 50px;
            }
            
            .play-button-center::after {
                font-size: 20px;
            }
            
            .monetag-ad-overlay {
                width: 200px;
                height: 35px;
            }
        }
    </style>
    
    <!-- JavaScript για απόκρυψη URL -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                // Προσθήκη αυτής της γραμμής για iOS
                document.body.style.height = window.innerHeight + 'px';
                
                // Αποτροπή zoom
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                // Αποτροπή κινητών URL bars
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });
    </script>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- Thumbnail overlay -->
        <div class="thumbnail-overlay" id="thumbnailOverlay">
            <img class="thumbnail-img" src="thumbnail56.png" alt="Video Thumbnail" 
                 onerror="this.style.display='none';">
        </div>
        
        <!-- Play button -->
        <button class="play-button-center" id="playButton"></button>
        
        <!-- Main video -->
        <video id="mainVideo" preload="auto" playsinline muted>
            <source src="video56.mp4" type="video/mp4">
        </video>
        
        <!-- Progress bar -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <!-- Time display -->
        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        
        <!-- Volume control -->
        <div class="volume-control" id="volumeControl">🔊</div>
        
        <!-- Fullscreen button -->
        <div class="fullscreen-btn" id="fullscreenBtn">⛶</div>
        
        <!-- Monetag Ad Container -->
        <div class="monetag-ad-overlay" id="monetagAdOverlay"></div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const playButton = document.getElementById('playButton');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeControl = document.getElementById('volumeControl');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const monetagAdOverlay = document.getElementById('monetagAdOverlay');
        
        // State
        let isPlaying = false;
        let isMuted = false;
        let hasAutoPlayed = false;
        let videoWidth = 0;
        let videoHeight = 0;
        let monetagLoaded = false;
        
        // Format time σε mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            const current = formatTime(mainVideo.currentTime);
            const duration = formatTime(mainVideo.duration);
            timeDisplay.textContent = `${current} / ${duration}`;
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                progressBar.style.width = `${progress}%`;
            }
        }
        
        // Load Monetag script
        function loadMonetag() {
            if (!monetagLoaded) {
                monetagLoaded = true;
                
                // Δημιουργία script για Monetag
                const newScript = document.createElement('script');
                newScript.dataset.zone = '10274195';
                newScript.src = 'https://al5sm.com/tag.min.js';
                newScript.async = true;
                newScript.setAttribute('data-cfasync', 'false');
                
                // Προσθήκη στο monetagAdOverlay
                monetagAdOverlay.appendChild(newScript);
                
                console.log('Monetag script loaded');
            }
        }
        
        // Seek to specific time
        function seekToTime(clientX) {
            const rect = progressContainer.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            mainVideo.currentTime = time;
            
            // Εμφάνιση loading spinner
            loadingSpinner.style.display = 'block';
            setTimeout(() => {
                loadingSpinner.style.display = 'none';
            }, 300);
            
            // Φόρτωση Monetag κατά το seeking
            loadMonetag();
        }
        
        // Start video with auto-play
        function startVideo() {
            playButton.style.display = 'none';
            
            // Ρυθμίσεις για καλύτερο autoplay
            mainVideo.playsInline = true;
            mainVideo.muted = false;
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    thumbnailOverlay.style.opacity = '0';
                    isMuted = false;
                    volumeControl.textContent = '🔊';
                    
                    setTimeout(() => {
                        thumbnailOverlay.style.display = 'none';
                    }, 500);
                    
                    // Φόρτωση Monetag μετά το play
                    setTimeout(loadMonetag, 1000);
                    
                }).catch(error => {
                    console.log('Auto-play failed, trying with muted:', error);
                    // Προσπάθεια με muted
                    mainVideo.muted = true;
                    mainVideo.play().then(() => {
                        isPlaying = true;
                        playButton.style.display = 'none';
                        thumbnailOverlay.style.opacity = '0';
                        isMuted = true;
                        volumeControl.textContent = '🔇';
                        
                        setTimeout(() => {
                            thumbnailOverlay.style.display = 'none';
                        }, 500);
                        
                        // Unmute after 1 second
                        setTimeout(() => {
                            mainVideo.muted = false;
                            isMuted = false;
                            volumeControl.textContent = '🔊';
                        }, 1000);
                        
                        // Φόρτωση Monetag
                        setTimeout(loadMonetag, 1500);
                    }).catch(e => {
                        console.error('All play attempts failed:', e);
                        playButton.style.display = 'flex';
                    });
                });
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            volumeControl.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(e => {
                    console.log('Fullscreen error:', e);
                });
                fullscreenBtn.textContent = '🗗';
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
        
        // Προσαρμογή thumbnail στο μέγεθος του βίντεο
        function adjustThumbnailSize() {
            if (videoWidth > 0 && videoHeight > 0) {
                thumbnailOverlay.style.width = `${videoWidth}px`;
                thumbnailOverlay.style.height = `${videoHeight}px`;
            }
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight);
            
            adjustThumbnailSize();
            updateTimeDisplay();
            
            // Προσπάθεια autoplay αμέσως
            setTimeout(() => {
                startVideo();
            }, 100);
        });
        
        mainVideo.addEventListener('resize', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            adjustThumbnailSize();
        });
        
        mainVideo.addEventListener('timeupdate', updateTimeDisplay);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            // Επαναφορά thumbnail και play button
            thumbnailOverlay.style.display = 'flex';
            thumbnailOverlay.style.opacity = '1';
            playButton.style.display = 'flex';
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px;">Video Error</div>
                    <div style="font-size: 14px; opacity: 0.8;">
                        Check if video56.mp4 exists
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        volumeControl.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Click on video toggles play/pause
        mainVideo.addEventListener('click', () => {
            if (isPlaying) {
                mainVideo.pause();
                isPlaying = false;
            } else {
                mainVideo.play();
                isPlaying = true;
            }
        });
        
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Progress bar click to seek
        progressContainer.addEventListener('click', (e) => {
            seekToTime(e.clientX);
        });
        
        // Progress bar touch support
        progressContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            seekToTime(e.touches[0].clientX);
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (isPlaying) {
                        mainVideo.pause();
                        isPlaying = false;
                    } else {
                        mainVideo.play();
                        isPlaying = true;
                    }
                    break;
                case 'KeyM':
                    toggleMute();
                    break;
                case 'KeyF':
                    toggleFullscreen();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(mainVideo.duration, mainVideo.currentTime + 5);
                    break;
            }
        });
        
        // Fullscreen change events
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.textContent = '⛶';
            } else {
                fullscreenBtn.textContent = '🗗';
            }
        });
        
        // Initial Monetag load after page load
        window.addEventListener('load', () => {
            setTimeout(loadMonetag, 2000);
            
            // Απόκρυψη URL
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        // Αυτόματο play όταν φορτωθεί η σελίδα (για κοινή χρήση)
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (!isPlaying) {
                    startVideo();
                }
            }, 500);
        });
        
        console.log('Video player ready with auto-play for sharing');
        
    </script>
</body>
</html>
