<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }
        
        #mainVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* ΚΕΝΗ ΟΘΟΝΗ ΠΡΙΝ ΤΟ ΒΙΝΤΕΟ */
        .blank-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* ΠΛΗΡΗΣ ΟΘΟΝΗΣ PLAY BUTTON */
        .play-button-fullscreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: rgba(220, 20, 60, 0.85);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
            box-shadow: 0 0 0 15px rgba(220, 20, 60, 0.2);
        }
        
        .play-button-fullscreen:hover {
            background: rgba(220, 20, 60, 1);
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 0 25px rgba(220, 20, 60, 0.3);
        }
        
        .play-button-fullscreen::after {
            content: '▶';
            color: white;
            font-size: 50px;
            margin-left: 8px;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.7); }
            70% { box-shadow: 0 0 0 40px rgba(220, 20, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0); }
        }
        
        /* Loading indicator */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 4;
            text-align: center;
            display: none;
        }
        
        /* Video controls */
        .video-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        
        .video-container:hover .video-controls {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Timer display */
        .timer {
            font-family: monospace;
            font-size: 16px;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        
        /* Progress bar */
        .progress-container {
            position: absolute;
            bottom: 90px;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-container:hover .progress-container {
            opacity: 1;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #dc143c;
            transition: width 0.1s;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .play-button-fullscreen {
                width: 100px;
                height: 100px;
            }
            
            .play-button-fullscreen::after {
                font-size: 40px;
            }
            
            .video-controls {
                bottom: 20px;
                gap: 10px;
                padding: 8px 15px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 22px;
            }
        }
        
        @media (max-width: 480px) {
            .play-button-fullscreen {
                width: 80px;
                height: 80px;
            }
            
            .play-button-fullscreen::after {
                font-size: 30px;
            }
            
            .video-controls {
                bottom: 15px;
                padding: 6px 12px;
            }
            
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <!-- ΚΕΝΗ ΜΑΥΡΗ ΟΘΟΝΗ ΠΡΙΝ ΤΟ ΒΙΝΤΕΟ -->
        <div class="blank-screen" id="blankScreen"></div>
        
        <!-- ΜΕΓΑΛΟ PLAY BUTTON -->
        <button class="play-button-fullscreen" id="playButton"></button>
        
        <!-- LOADING -->
        <div class="loading" id="loading">
            ⏳ Φόρτωση...
        </div>
        
        <!-- ΒΙΝΤΕΟ -->
        <video id="mainVideo" preload="none" playsinline>
            <source src="video55.mp4" type="video/mp4">
        </video>
        
        <!-- PROGRESS BAR -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <!-- CONTROLS -->
        <div class="video-controls">
            <button class="control-btn" id="playPauseBtn">⏸</button>
            <div class="timer" id="currentTime">00:00</div>
            <button class="control-btn" id="muteBtn">🔊</button>
            <div class="timer" id="durationTime">00:00</div>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const blankScreen = document.getElementById('blankScreen');
        const playButton = document.getElementById('playButton');
        const loading = document.getElementById('loading');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const progressBar = document.getElementById('progressBar');
        
        // State
        let isPlaying = false;
        let isMuted = true; // Αρχικά muted για autoplay
        let hasStarted = false;
        
        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time and progress
        function updateTime() {
            currentTimeEl.textContent = formatTime(mainVideo.currentTime);
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                durationTimeEl.textContent = formatTime(mainVideo.duration);
                
                // Update progress bar
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                progressBar.style.width = `${progress}%`;
            }
        }
        
        // Start video
        function startVideo() {
            if (hasStarted) return;
            
            hasStarted = true;
            loading.style.display = 'block';
            playButton.style.display = 'none';
            
            // Set video source and play
            mainVideo.src = 'video55.mp4';
            mainVideo.load();
            
            mainVideo.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                blankScreen.style.opacity = '0';
                
                setTimeout(() => {
                    blankScreen.style.display = 'none';
                    loading.style.display = 'none';
                }, 500);
                
                // Unmute για καλύτερη εμπειρία
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                    muteBtn.textContent = '🔊';
                }
            }).catch(e => {
                console.error('Play failed:', e);
                loading.style.display = 'none';
                playButton.style.display = 'flex';
                hasStarted = false;
                
                // Show error on play button
                playButton.style.background = 'rgba(255, 0, 0, 0.8)';
                playButton.textContent = '❌ ΚΛΙΚ';
                playButton.style.fontSize = '20px';
                playButton.style.padding = '0';
                playButton.innerHTML = 'ΚΛΙΚ ΓΙΑ ΒΙΝΤΕΟ';
                
                setTimeout(() => {
                    playButton.style.background = 'rgba(220, 20, 60, 0.85)';
                    playButton.innerHTML = '';
                    playButton.style.fontSize = 'inherit';
                    playButton.style.padding = 'inherit';
                }, 2000);
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (!hasStarted) {
                startVideo();
                return;
            }
            
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(e => {
                    console.log('Fullscreen error:', e);
                });
                fullscreenBtn.textContent = '🗗';
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
        
        // Event Listeners
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('loadedmetadata', () => {
            updateTime();
        });
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '⟳';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loading.style.display = 'none';
            
            // Show error message on blank screen
            blankScreen.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 60px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 24px; margin-bottom: 10px;">Βίντεο δεν βρέθηκε</div>
                    <div style="font-size: 16px; opacity: 0.8; margin-bottom: 30px;">
                        Βεβαιωθείτε ότι το αρχείο <strong>video55.mp4</strong><br>
                        είναι ανεβασμένο στον ίδιο φάκελο
                    </div>
                    <button onclick="location.reload()" 
                            style="background: #dc143c; color: white; border: none; 
                                   padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                        Δοκίμασε Ξανά
                    </button>
                </div>
            `;
            
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Click on video to play/pause
        mainVideo.addEventListener('click', togglePlayPause);
        
        // Click on blank screen to start
        blankScreen.addEventListener('click', startVideo);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'KeyM':
                    toggleMute();
                    break;
                case 'KeyF':
                    toggleFullscreen();
                    break;
                case 'KeyK':
                    togglePlayPause();
                    break;
            }
        });
        
        // Show controls on mouse move
        let controlsTimeout;
        videoContainer.addEventListener('mousemove', () => {
            const controls = document.querySelector('.video-controls');
            const progress = document.querySelector('.progress-container');
            
            if (hasStarted) {
                controls.style.opacity = '1';
                progress.style.opacity = '1';
                
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (isPlaying) {
                        controls.style.opacity = '0';
                        progress.style.opacity = '0';
                    }
                }, 3000);
            }
        });
        
        // Προσαρμογή play button για touch
        playButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playButton.style.transform = 'translate(-50%, -50%) scale(0.95)';
        });
        
        playButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            playButton.style.transform = 'translate(-50%, -50%) scale(1)';
            startVideo();
        });
        
        console.log('Video player ready');
        console.log('Click the red play button to start');
        
    </script>
</body>
</html>
