    <style>
        /* Ολόκληρο το CSS παραμένει το ίδιο */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: relative;
            color: #fff;
        }
        
        /* ... όλο το άλλο CSS παραμένει αμετάβλητο ... */
    </style>
</head>
<body>
    <!-- Full Screen Video Container -->
    <div class="video-container" id="videoContainer">
        <!-- Loading overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loader"></div>
        </div>
        
        <!-- Poster overlay with thumbnail -->
        <div class="video-poster" id="videoPoster" style="background: #000 url('https://blog.franklymadear.com/facebook/thumbnail55.png') center center no-repeat; background-size: cover;"></div>
        
        <!-- Actual Video Element -->
        <video id="mainVideo" preload="auto" playsinline autoplay muted poster="https://blog.franklymadear.com/facebook/thumbnail55.png">
            <!-- ΠΡΑΓΜΑΤΙΚΟ ΒΙΝΤΕΟ MP4 -->
            <source src="https://blog.franklymadear.com/facebook/videos/one/video55.mp4" type="video/mp4">
            Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την αναπαραγωγή βίντεο.
        </video>
        
        <!-- Title -->
        <div class="video-title">Must Watch Video - Exclusive Content</div>
        
        <!-- Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸</button>
            <div class="timer" id="currentTime">00:00</div>
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="timer" id="durationTime">00:00</div>
            
            <div class="volume-control">
                <button class="control-btn" id="volumeBtn">🔊</button>
                <div class="volume-slider" id="volumeSlider">
                    <div class="volume-level" id="volumeLevel"></div>
                </div>
            </div>
            
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>
    
    <!-- Share Buttons -->
    <div class="share-container">
        <div class="share-toggle">
            📤
        </div>
        <div class="share-buttons">
            <div class="share-title">Share</div>
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://blog.franklymadear.com/facebook/videos/one/index.html" 
               target="_blank" 
               class="share-btn fb">
               <span class="icon">📘</span>
               <span>Facebook</span>
            </a>
            
            <a href="https://twitter.com/intent/tweet?url=https://blog.franklymadear.com/facebook/videos/one/index.html&text=Must Watch Video - Exclusive Content" 
               target="_blank" 
               class="share-btn tw">
               <span class="icon">🐦</span>
               <span>Twitter</span>
            </a>
            
            <a href="https://api.whatsapp.com/send?text=Must Watch Video - Exclusive Content:%20https://blog.franklymadear.com/facebook/videos/one/index.html" 
               target="_blank" 
               class="share-btn wa">
               <span class="icon">📱</span>
               <span>WhatsApp</span>
            </a>
            
            <a href="https://t.me/share/url?url=https://blog.franklymadear.com/facebook/videos/one/index.html&text=Must Watch Video - Exclusive Content" 
               target="_blank" 
               class="share-btn tg">
               <span class="icon">✈️</span>
               <span>Telegram</span>
            </a>
            
            <a href="mailto:?subject=Must Watch Video - Exclusive Content&body=Must Watch Video - Exclusive Content: https://blog.franklymadear.com/facebook/videos/one/index.html" 
               class="share-btn mail">
               <span class="icon">✉️</span>
               <span>Email</span>
            </a>
            
            <a href="#" 
               class="share-btn link"
               onclick="copyToClipboard(); return false;">
               <span class="icon">🔗</span>
               <span>Copy Link</span>
            </a>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPoster = document.getElementById('videoPoster');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const progressBar = document.getElementById('progressBar');
        const progressEl = document.getElementById('progress');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLevel = document.getElementById('volumeLevel');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoControls = document.getElementById('videoControls');
        const videoTitle = document.querySelector('.video-title');
        
        // Video configuration - ΠΡΑΓΜΑΤΙΚΟ ΒΙΝΤΕΟ MP4
        const videoUrl = 'https://blog.franklymadear.com/facebook/videos/one/video55.mp4';
        const thumbnailUrl = 'https://blog.franklymadear.com/facebook/thumbnail55.png';
        
        // State variables
        let isPlaying = false;
        let isMuted = true; // Αρχικά muted για autoplay
        let volume = 0; // Αρχικά 0 για autoplay
        let controlsTimeout;
        let isTouchDevice = false;
        let autoplayBlocked = false;
        
        // Detect touch device
        if ('ontouchstart' in window || navigator.maxTouchPoints) {
            isTouchDevice = true;
            videoContainer.classList.add('touch-active');
        }
        
        // Format time to MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTime() {
            currentTimeEl.textContent = formatTime(mainVideo.currentTime);
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                durationTimeEl.textContent = formatTime(mainVideo.duration);
                
                // Update progress
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                progressEl.style.width = `${progress}%`;
            }
        }
        
        // Show controls temporarily
        function showControls() {
            videoControls.style.opacity = '1';
            videoTitle.style.opacity = '1';
            clearTimeout(controlsTimeout);
            
            if (isPlaying) {
                controlsTimeout = setTimeout(() => {
                    videoControls.style.opacity = '0';
                    videoTitle.style.opacity = '0';
                }, 3000);
            }
        }
        
        // Hide controls
        function hideControls() {
            videoControls.style.opacity = '0';
            videoTitle.style.opacity = '0';
        }
        
        // Play/Pause functionality
        function togglePlay() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    playPauseBtn.textContent = '⏸';
                    isPlaying = true;
                    showControls();
                    
                    // Ενεργοποίηση ήχου όταν ο χρήστης πατάει play
                    if (isMuted) {
                        mainVideo.muted = false;
                        volume = 1.0;
                        updateVolume();
                    }
                }).catch(e => {
                    console.log("Play failed:", e);
                    showAutoplayFallback();
                });
            } else {
                mainVideo.pause();
                playPauseBtn.textContent = '▶';
                isPlaying = false;
                showControls();
            }
        }
        
        // Volume control
        function updateVolume() {
            mainVideo.volume = volume;
            volumeLevel.style.width = `${volume * 100}%`;
            
            if (volume === 0) {
                volumeBtn.textContent = '🔇';
                mainVideo.muted = true;
                isMuted = true;
            } else if (volume < 0.5) {
                volumeBtn.textContent = '🔈';
                mainVideo.muted = false;
                isMuted = false;
            } else {
                volumeBtn.textContent = '🔊';
                mainVideo.muted = false;
                isMuted = false;
            }
        }
        
        // Toggle mute
        function toggleMute() {
            if (isMuted) {
                volume = 1.0;
            } else {
                volume = 0;
            }
            updateVolume();
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (videoContainer.requestFullscreen) {
                    videoContainer.requestFullscreen();
                } else if (videoContainer.webkitRequestFullscreen) {
                    videoContainer.webkitRequestFullscreen();
                } else if (videoContainer.msRequestFullscreen) {
                    videoContainer.msRequestFullscreen();
                }
                fullscreenBtn.textContent = '🗗';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                fullscreenBtn.textContent = '⛶';
            }
            showControls();
        }
        
        // Seek video
        function seekVideo(event) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            mainVideo.currentTime = pos * mainVideo.duration;
            showControls();
        }
        
        // Adjust volume
        function adjustVolume(event) {
            const rect = volumeSlider.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            volume = Math.max(0, Math.min(1, pos));
            updateVolume();
            showControls();
        }
        
        // Show autoplay fallback button
        function showAutoplayFallback() {
            autoplayBlocked = true;
            videoPoster.style.display = 'flex';
            videoPoster.style.justifyContent = 'center';
            videoPoster.style.alignItems = 'center';
            videoPoster.style.flexDirection = 'column';
            videoPoster.style.gap = '20px';
            videoPoster.style.backgroundColor = 'rgba(0, 0, 0, 0.9)';
            videoPoster.innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 24px; margin-bottom: 10px; color: white;">🎬</div>
                    <div style="color: white; font-size: 18px; margin-bottom: 20px;">Το βίντεο είναι έτοιμο!</div>
                    <button class="play-button" id="manualPlayBtn">
                        <span class="play-icon">▶</span>
                        <span>Παίξε το Βίντεο</span>
                    </button>
                    <div style="color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 15px;">
                        Η αυτόματη αναπαραγωγή απαγορεύτηκε από το πρόγραμμα περιήγησης
                    </div>
                </div>
            `;
            
            document.getElementById('manualPlayBtn').addEventListener('click', () => {
                mainVideo.muted = false;
                mainVideo.play().then(() => {
                    videoPoster.style.opacity = '0';
                    setTimeout(() => {
                        videoPoster.style.display = 'none';
                    }, 500);
                    playPauseBtn.textContent = '⏸';
                    isPlaying = true;
                    volume = 1.0;
                    updateVolume();
                    showControls();
                });
            });
        }
        
        // Event Listeners
        
        // Video events
        mainVideo.addEventListener('loadeddata', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
                
                // Το βίντεο παίζει αυτόματα λόγω autoplay
                playPauseBtn.textContent = '⏸';
                isPlaying = true;
                
                // Κρύψε το poster αμέσως μόλις το βίντεο παίξει
                setTimeout(() => {
                    videoPoster.style.opacity = '0';
                    setTimeout(() => {
                        videoPoster.style.display = 'none';
                    }, 500);
                }, 300);
                
                showControls();
            }, 300);
            
            updateTime();
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            playPauseBtn.textContent = '⟳';
            isPlaying = false;
            showControls();
        });
        
        mainVideo.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸';
            isPlaying = true;
        });
        
        mainVideo.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
            isPlaying = false;
            showControls();
        });
        
        // Video error handling
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', e);
            loadingOverlay.innerHTML = `
                <div style="text-align: center; color: white;">
                    <div style="font-size: 30px; margin-bottom: 10px;">❌</div>
                    <div style="font-size: 18px; margin-bottom: 10px;">Σφάλμα φόρτωσης βίντεο</div>
                    <div style="font-size: 14px; opacity: 0.7;">Βεβαιωθείτε ότι το βίντεο υπάρχει στο URL:<br>${videoUrl}</div>
                    <div style="font-size: 14px; opacity: 0.7; margin-top: 10px;">Thumbnail URL:<br>${thumbnailUrl}</div>
                </div>
            `;
        });
        
        // Δοκίμασε autoplay και αν αποτύχει, δείξε fallback
        mainVideo.play().then(() => {
            console.log("Autoplay successful");
            isPlaying = true;
        }).catch(e => {
            console.log("Autoplay blocked, showing fallback:", e);
            setTimeout(() => {
                if (mainVideo.paused) {
                    showAutoplayFallback();
                }
            }, 1000);
        });
        
        // User interaction events
        videoContainer.addEventListener('click', (e) => {
            if (e.target !== videoControls && !videoControls.contains(e.target) && 
                e.target.id !== 'manualPlayBtn' && !e.target.closest('#manualPlayBtn')) {
                togglePlay();
            }
        });
        
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', () => {
            videoContainer.classList.add('touch-active');
            showControls();
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlay();
        });
        
        progressBar.addEventListener('click', (e) => {
            e.stopPropagation();
            seekVideo(e);
        });
        
        volumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });
        
        volumeSlider.addEventListener('click', (e) => {
            e.stopPropagation();
            adjustVolume(e);
        });
        
        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });
        
        // Fullscreen change listener
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.textContent = '⛶';
            } else {
                fullscreenBtn.textContent = '🗗';
            }
        });
        
        // Copy link function
        function copyToClipboard() {
            const url = 'https://blog.franklymadear.com/facebook/videos/one/index.html';
            navigator.clipboard.writeText(url)
                .then(() => {
                    // Show temporary notification
                    const originalText = document.querySelector('.share-btn.link span:last-child').textContent;
                    document.querySelector('.share-btn.link span:last-child').textContent = 'Copied!';
                    setTimeout(() => {
                        document.querySelector('.share-btn.link span:last-child').textContent = originalText;
                    }, 2000);
                })
                .catch(err => {
                    console.error('Error copying:', err);
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = url;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('Link copied to clipboard!');
                });
        }
        
        // Mobile tap handling for share buttons
        const shareContainer = document.querySelector('.share-container');
        const shareToggle = document.querySelector('.share-toggle');
        
        if (isTouchDevice) {
            shareToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                shareContainer.classList.toggle('active');
                if (shareContainer.classList.contains('active')) {
                    shareContainer.querySelector('.share-buttons').style.opacity = '1';
                    shareContainer.querySelector('.share-buttons').style.visibility = 'visible';
                    shareContainer.querySelector('.share-buttons').style.transform = 'translateY(0)';
                } else {
                    shareContainer.querySelector('.share-buttons').style.opacity = '0';
                    shareContainer.querySelector('.share-buttons').style.visibility = 'hidden';
                    shareContainer.querySelector('.share-buttons').style.transform = 'translateY(10px)';
                }
            });
            
            // Close when clicking outside
            document.addEventListener('click', (e) => {
                if (!shareContainer.contains(e.target) && shareContainer.classList.contains('active')) {
                    shareContainer.classList.remove('active');
                    shareContainer.querySelector('.share-buttons').style.opacity = '0';
                    shareContainer.querySelector('.share-buttons').style.visibility = 'hidden';
                    shareContainer.querySelector('.share-buttons').style.transform = 'translateY(10px)';
                }
            });
        }
        
        // Initialize volume
        updateVolume();
        
        // Show controls initially
        showControls();
        
        console.log('Video page loaded successfully');
        console.log('Video URL:', videoUrl);
        console.log('Thumbnail URL:', thumbnailUrl);
    </script>
