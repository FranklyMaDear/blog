    <title>Watch Exclusive Video</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* MAIN CONTAINER - ΚΕΝΤΡΑΡΙΣΜΕΝΟ ΤΟ ΒΙΝΤΕΟ */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* ΒΙΝΤΕΟ - ΦΥΛΑΞΕ ΤΟ ΑΡΧΙΚΟ ΜΕΓΕΘΟΣ */
        #mainVideo {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            background: #000;
        }
        
        /* Thumbnail overlay - ίδιο μέγεθος με το βίντεο */
        .thumbnail-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            max-width: 100%;
            max-height: 100%;
        }
        
        .thumbnail-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        
        /* Play button - ΚΕΝΤΡΟ ΤΟΥ ΒΙΝΤΕΟ */
        .play-button-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(220, 20, 60, 0.9);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        
        .play-button-center:hover {
            background: rgba(220, 20, 60, 1);
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .play-button-center::after {
            content: '▶';
            color: white;
            font-size: 40px;
            margin-left: 5px;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(220, 20, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0); }
        }
        
        /* Progress bar - ΒΑΣΗ ΤΗΣ ΟΘΟΝΗΣ */
        .progress-container {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 4;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-container:hover .progress-container {
            opacity: 1;
        }
        
        .progress-bar {
            position: relative;
            height: 100%;
            width: 0%;
            background: #dc143c;
            transition: width 0.1s;
        }
        
        .progress-handle {
            position: absolute;
            top: 50%;
            right: -10px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transform: translateY(-50%);
            cursor: grab;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        
        .progress-bar:hover .progress-handle,
        .progress-container.dragging .progress-handle {
            display: block;
        }
        
        /* Controls - ΒΑΣΗ ΤΗΣ ΟΘΟΝΗΣ */
        .video-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        
        .video-container:hover .video-controls {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Timer */
        .timer {
            font-family: monospace;
            font-size: 16px;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 10px;
            min-width: 70px;
        }
        
        /* Time tooltip */
        .time-tooltip {
            position: absolute;
            bottom: 25px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%);
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        
        .progress-container:hover .time-tooltip {
            opacity: 1;
        }
        
        /* Loading spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #dc143c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 6;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* FULLSCREEN POPUP AD - Από το ΚΑΤΩ στο ΠΑΝΩ */
        .fullscreen-ad {
            position: fixed;
            bottom: -100vh;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.97);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: bottom 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
        }
        
        .fullscreen-ad.show {
            bottom: 0;
        }
        
        .fullscreen-ad.show-abrupt {
            bottom: 0;
            transition: none;
        }
        
        .ad-header {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 0 20px;
        }
        
        .ad-title {
            color: #ffcb2e;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 2px 15px rgba(0,0,0,0.7);
            margin: 0;
        }
        
        .ad-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            margin-top: 8px;
            font-weight: 500;
        }
        
        .ad-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .ad-container {
            width: 100%;
            max-width: 1200px;
            height: 600px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 60px rgba(0,0,0,0.6);
            border: 4px solid #ffcb2e;
            position: relative;
        }
        
        .ad-close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 32px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .ad-close-btn:hover {
            background: rgba(255, 0, 0, 0.4);
            border-color: #ff0000;
            transform: rotate(90deg) scale(1.1);
        }
        
        .ad-footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            padding: 0 20px;
            font-weight: 500;
        }
        
        .ad-timer {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
            padding: 0 20px;
        }
        
        /* Mid-game Ad Indicator */
        .midgame-ad-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(209, 154, 76, 0.9);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            display: none;
            box-shadow: 0 3px 15px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .play-button-center {
                width: 80px;
                height: 80px;
            }
            
            .play-button-center::after {
                font-size: 30px;
            }
            
            .video-controls {
                bottom: 20px;
                padding: 8px 15px;
            }
            
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .progress-container {
                bottom: 80px;
                height: 6px;
            }
            
            .progress-handle {
                width: 16px;
                height: 16px;
                right: -8px;
            }
            
            .ad-container {
                height: 450px;
                max-width: 95%;
                border-width: 3px;
            }
            
            .ad-title {
                font-size: 22px;
            }
            
            .ad-subtitle {
                font-size: 16px;
            }
            
            .ad-close-btn {
                top: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 28px;
            }
            
            .ad-footer {
                font-size: 14px;
                bottom: 30px;
            }
            
            .ad-timer {
                font-size: 16px;
                bottom: 60px;
            }
            
            .midgame-ad-indicator {
                top: 10px;
                right: 10px;
                font-size: 12px;
                padding: 6px 12px;
            }
        }
        
        @media (max-width: 480px) {
            .ad-container {
                height: 350px;
                border-radius: 15px;
            }
            
            .ad-title {
                font-size: 20px;
            }
            
            .ad-subtitle {
                font-size: 14px;
            }
            
            .ad-close-btn {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Mid-game Ad Indicator -->
    <div class="midgame-ad-indicator" id="midgameAdIndicator">
        🕒 Επόμενη διαφήμιση σε: <span id="midgameTimer">120</span> δευτερόλεπτα
    </div>
    
    <!-- FULLSCREEN POPUP AD (ΚΑΤΩ → ΠΑΝΩ) -->
    <div class="fullscreen-ad" id="fullscreenAd">
        <button class="ad-close-btn" id="closeFullscreenAd">×</button>
        
        <div class="ad-header">
            <h2 class="ad-title">🎬 Exclusive Video Player</h2>
            <p class="ad-subtitle">Υποστήριξε το δωρεάν βίντεο με μια μικρή επισκεψή στη διαφήμιση!</p>
        </div>
        
        <div class="ad-content">
            <div class="ad-container">
                <!-- GOOGLE FULLSCREEN AD -->
                <ins class="adsbygoogle"
                     style="display:block; width:100%; height:100%;"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="9660744817"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </div>
        
        <div class="ad-timer" id="adTimer">Αυτόματο κλείσιμο σε: <span id="adTimerCount">15</span> δευτερόλεπτα</div>
        <div class="ad-footer">Κλείστε τη διαφήμιση για να συνεχίσετε να παρακολουθείτε το βίντεο</div>
    </div>

    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- Thumbnail overlay - ΑΚΡΙΒΩΣ ΙΔΙΟ ΜΕΓΕΘΟΣ ΜΕ ΤΟ ΒΙΝΤΕΟ -->
        <div class="thumbnail-overlay" id="thumbnailOverlay">
            <img class="thumbnail-img" src="thumbnail55.png" alt="Video Thumbnail" 
                 onerror="this.style.display='none';">
        </div>
        
        <!-- Play button -->
        <button class="play-button-center" id="playButton"></button>
        
        <!-- Main video - ΧΩΡΙΣ object-fit: cover -->
        <video id="mainVideo" preload="auto" playsinline muted>
            <source src="video55.mp4" type="video/mp4">
        </video>
        
        <!-- Progress bar -->
        <div class="progress-container" id="progressContainer">
            <div class="time-tooltip" id="timeTooltip">00:00</div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-handle" id="progressHandle"></div>
            </div>
        </div>
        
        <!-- Video controls -->
        <div class="video-controls">
            <button class="control-btn" id="playPauseBtn">⏸</button>
            <div class="timer" id="currentTime">00:00</div>
            <button class="control-btn" id="muteBtn">🔇</button>
            <div class="timer" id="durationTime">00:00</div>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const playButton = document.getElementById('playButton');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressHandle = document.getElementById('progressHandle');
        const timeTooltip = document.getElementById('timeTooltip');
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        // Ad Elements
        const fullscreenAd = document.getElementById("fullscreenAd");
        const closeFullscreenAd = document.getElementById("closeFullscreenAd");
        const adTimerCount = document.getElementById("adTimerCount");
        const midgameAdIndicator = document.getElementById("midgameAdIndicator");
        const midgameTimer = document.getElementById("midgameTimer");
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let hasAutoPlayed = false;
        let isDragging = false;
        let isHoveringProgress = false;
        let videoWidth = 0;
        let videoHeight = 0;
        
        // Ad Variables
        let adShown = false;
        let midgameAdShown = false;
        let videoStartTime = null;
        let adTimer;
        let adCountdownTimer;
        let midgameCountdownTimer;
        let midgameAdTimeout;
        let adCountdownValue = 15;
        let videoActive = false;
        
        // FULLSCREEN AD FUNCTIONS
        function showFullscreenAd(type = "startup") {
            // Μάρκαρε ότι εμφανίστηκε
            if (type === "startup") {
                adShown = true;
            } else {
                midgameAdShown = true;
            }
            
            // Παύση βίντεο κατά τη διάρκεια διαφήμισης
            if (isPlaying) {
                mainVideo.pause();
            }
            
            // Κλείσε το mid-game indicator
            hideMidgameIndicator();
            
            // Αναδύεται από το ΚΑΤΩ
            fullscreenAd.classList.add('show');
            
            // Reset countdown
            adCountdownValue = 15;
            adTimerCount.textContent = adCountdownValue;
            
            // Φόρτωση Google Ad
            setTimeout(() => {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log(`${type === "startup" ? "Startup" : "Mid-game"} Google Ad loaded`);
                } catch (e) {
                    console.log("Ad load error:", e);
                }
            }, 300);
            
            // Απότομα στο ΠΑΝΩ (μετά από 3 δευτερόλεπτα)
            setTimeout(() => {
                fullscreenAd.classList.remove('show');
                fullscreenAd.classList.add('show-abrupt');
            }, 3000);
            
            // Start countdown
            startAdCountdown();
            
            // Auto-close μετά από 15 δευτερόλεπτα
            clearTimeout(adTimer);
            adTimer = setTimeout(() => {
                closeFullscreenAdFunc(type);
            }, 15000);
        }
        
        function startAdCountdown() {
            clearInterval(adCountdownTimer);
            adCountdownTimer = setInterval(() => {
                adCountdownValue--;
                adTimerCount.textContent = adCountdownValue;
                
                if (adCountdownValue <= 0) {
                    clearInterval(adCountdownTimer);
                }
            }, 1000);
        }
        
        function closeFullscreenAdFunc(type = "startup") {
            fullscreenAd.classList.remove('show', 'show-abrupt');
            clearInterval(adCountdownTimer);
            clearTimeout(adTimer);
            
            // Συνεχίστε το βίντεο αν ήταν σε παύση
            if (isPlaying && type === "midgame") {
                mainVideo.play();
            }
            
            // Αν ήταν mid-game ad, ξαναξεκίνα το countdown για επόμενη
            if (type === "midgame") {
                setTimeout(() => {
                    midgameAdShown = false;
                    startMidgameAdCountdown();
                }, 60000); // Ξαναεμφανίζεται μετά από 1 λεπτό
            }
        }
        
        // MID-GAME AD FUNCTIONS
        function startMidgameAdCountdown() {
            // Καθαρίσε προηγούμενα timers
            stopMidgameAdCountdown();
            
            let secondsLeft = 120; // 2 λεπτά = 120 δευτερόλεπτα
            
            // Εμφάνιση indicator
            midgameTimer.textContent = secondsLeft;
            midgameAdIndicator.style.display = 'block';
            
            // Countdown
            midgameCountdownTimer = setInterval(() => {
                secondsLeft--;
                midgameTimer.textContent = secondsLeft;
                
                if (secondsLeft <= 0) {
                    // Εμφάνιση mid-game ad
                    if (videoActive && !midgameAdShown && isPlaying) {
                        showFullscreenAd("midgame");
                    }
                    clearInterval(midgameCountdownTimer);
                    hideMidgameIndicator();
                }
            }, 1000);
            
            // Backup timer για mid-game ad
            midgameAdTimeout = setTimeout(() => {
                if (videoActive && !midgameAdShown && isPlaying) {
                    showFullscreenAd("midgame");
                }
                hideMidgameIndicator();
            }, 120000); // 2 λεπτά
        }
        
        function stopMidgameAdCountdown() {
            clearInterval(midgameCountdownTimer);
            clearTimeout(midgameAdTimeout);
            hideMidgameIndicator();
        }
        
        function hideMidgameIndicator() {
            midgameAdIndicator.style.display = 'none';
        }
        
        // VIDEO PLAYER FUNCTIONS
        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTime() {
            currentTimeEl.textContent = formatTime(mainVideo.currentTime);
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                durationTimeEl.textContent = formatTime(mainVideo.duration);
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                progressBar.style.width = `${progress}%`;
            }
        }
        
        // Update time tooltip on hover
        function updateTimeTooltip() {
            if (!mainVideo.duration || isNaN(mainVideo.duration)) return;
            
            const rect = progressContainer.getBoundingClientRect();
            const percent = (lastHoverX - rect.left) / rect.width;
            const time = percent * mainVideo.duration;
            
            timeTooltip.textContent = formatTime(time);
            timeTooltip.style.left = `${percent * 100}%`;
        }
        
        // Seek to specific time
        function seekToTime(clientX) {
            const rect = progressContainer.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            mainVideo.currentTime = time;
            
            loadingSpinner.style.display = 'block';
            
            setTimeout(() => {
                loadingSpinner.style.display = 'none';
            }, 500);
        }
        
        // Start video
        function startVideo() {
            videoActive = true;
            playButton.style.display = 'none';
            
            mainVideo.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                thumbnailOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                    muteBtn.textContent = '🔊';
                }
                
                videoStartTime = Date.now();
                
                // Προετοιμασία για mid-game ad (μετά από 2 λεπτά)
                startMidgameAdCountdown();
                
                // Εμφάνιση πρώτης FULLSCREEN AD μετά από 2 δευτερόλεπτα
                if (!adShown) {
                    setTimeout(() => {
                        showFullscreenAd("startup");
                    }, 2000);
                }
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                    videoActive = true;
                    
                    // Επανεκκίνηση mid-game countdown αν χρειάζεται
                    if (!midgameAdShown) {
                        startMidgameAdCountdown();
                    }
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(e => {
                    console.log('Fullscreen error:', e);
                });
                fullscreenBtn.textContent = '🗗';
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
        
        // Try autoplay for X player
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                hasAutoPlayed = true;
                videoActive = true;
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                videoStartTime = Date.now();
                
                // Προετοιμασία για mid-game ad
                startMidgameAdCountdown();
                
                // Εμφάνιση startup ad
                if (!adShown) {
                    setTimeout(() => {
                        showFullscreenAd("startup");
                    }, 2000);
                }
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }
                }, 1000);
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Προσαρμογή thumbnail στο μέγεθος του βίντεο
        function adjustThumbnailSize() {
            if (videoWidth > 0 && videoHeight > 0) {
                thumbnailOverlay.style.width = `${videoWidth}px`;
                thumbnailOverlay.style.height = `${videoHeight}px`;
            }
        }
        
        // Progress bar interaction
        let lastHoverX = 0;
        
        progressContainer.addEventListener('mousemove', (e) => {
            lastHoverX = e.clientX;
            isHoveringProgress = true;
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                updateTimeTooltip();
            }
        });
        
        progressContainer.addEventListener('mouseleave', () => {
            isHoveringProgress = false;
            timeTooltip.style.opacity = '0';
        });
        
        progressContainer.addEventListener('click', (e) => {
            if (!isDragging) {
                seekToTime(e.clientX);
            }
        });
        
        // Drag functionality for progress handle
        progressHandle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            isDragging = true;
            progressContainer.classList.add('dragging');
            document.body.style.cursor = 'grabbing';
            
            function onMouseMove(e) {
                if (isDragging && mainVideo.duration) {
                    const rect = progressContainer.getBoundingClientRect();
                    let percent = (e.clientX - rect.left) / rect.width;
                    percent = Math.max(0, Math.min(1, percent));
                    
                    progressBar.style.width = `${percent * 100}%`;
                    timeTooltip.textContent = formatTime(percent * mainVideo.duration);
                    timeTooltip.style.left = `${percent * 100}%`;
                    timeTooltip.style.opacity = '1';
                    
                    if (isPlaying) {
                        mainVideo.pause();
                    }
                }
            }
            
            function onMouseUp(e) {
                if (isDragging) {
                    isDragging = false;
                    progressContainer.classList.remove('dragging');
                    document.body.style.cursor = '';
                    
                    if (mainVideo.duration) {
                        const rect = progressContainer.getBoundingClientRect();
                        let percent = (e.clientX - rect.left) / rect.width;
                        percent = Math.max(0, Math.min(1, percent));
                        
                        mainVideo.currentTime = percent * mainVideo.duration;
                        
                        if (isPlaying) {
                            mainVideo.play();
                        }
                    }
                    
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }
            }
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
        
        // Touch support
        progressContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            seekToTime(e.touches[0].clientX);
        });
        
        // Event Listeners για βίντεο
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight);
            console.log('Video will display at original size');
            
            adjustThumbnailSize();
            updateTime();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            } else {
                console.log('Running in regular browser');
            }
        });
        
        mainVideo.addEventListener('resize', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            adjustThumbnailSize();
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '⟳';
            videoActive = false;
            stopMidgameAdCountdown();
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            stopMidgameAdCountdown();
            
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px;">Video Error</div>
                    <div style="font-size: 14px; opacity: 0.8;">
                        Check if video55.mp4 exists in the videos folder
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        mainVideo.addEventListener('click', togglePlayPause);
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Ad Close Handler
        closeFullscreenAd.addEventListener("click", () => {
            const type = midgameAdShown ? "midgame" : "startup";
            closeFullscreenAdFunc(type);
        });
        
        // Close ad by clicking outside (στο 50% πάνω μέρος)
        fullscreenAd.addEventListener("click", (e) => {
            if (e.clientY < window.innerHeight / 2) {
                const type = midgameAdShown ? "midgame" : "startup";
                closeFullscreenAdFunc(type);
            }
        });
        
        // PAGE VISIBILITY TRACKING
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                videoActive = false;
                stopMidgameAdCountdown();
                
                // Παύση βίντεο αν είναι ενεργό
                if (isPlaying) {
                    mainVideo.pause();
                    isPlaying = false;
                    playPauseBtn.textContent = '▶';
                }
            } else {
                videoActive = true;
                // Επανεκκίνηση mid-game countdown μόνο αν το βίντεο παίζει
                if (isPlaying && !midgameAdShown) {
                    startMidgameAdCountdown();
                }
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'KeyM':
                    toggleMute();
                    break;
                case 'KeyF':
                    toggleFullscreen();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(mainVideo.duration, mainVideo.currentTime + 5);
                    break;
            }
        });
        
        // Show/hide controls
        let controlsTimeout;
        videoContainer.addEventListener('mousemove', () => {
            const controls = document.querySelector('.video-controls');
            const progress = document.querySelector('.progress-container');
            
            if (isPlaying || hasAutoPlayed) {
                controls.style.opacity = '1';
                progress.style.opacity = '1';
                
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (isPlaying && !isDragging && !isHoveringProgress) {
                        controls.style.opacity = '0';
                        progress.style.opacity = '0';
                    }
                }, 3000);
            }
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        console.log('Video player ready with ad system');
        
    </script>
</body>
</html>
