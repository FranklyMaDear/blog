<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Τίτλος και περιγραφή -->
    <title>Must Watch Video - Exclusive Content</title>
    <meta name="description" content="Watch this exclusive video now. Premium content available for viewing.">
    
    <!-- TWITTER CARD - Player Card για άμεση αναπαραγωγή -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="Must Watch Video - Exclusive Content">
    <meta name="twitter:description" content="Watch this exclusive video now. Premium content available for viewing.">
    <!-- Θα χρησιμοποιήσουμε το ΠΡΩΤΟ ΚΑΡΕ του βίντεο σαν thumbnail -->
    <meta name="twitter:image" content="https://blog.franklymadear.com/videos/thumbnail55.png">
    <!-- Ο Player URL - ΕΔΩ ΘΑ ΕΜΦΑΝΙΣΤΕΙ ΤΟ ΒΙΝΤΕΟ -->
    <meta name="twitter:player" content="https://blog.franklymadear.com/videos/player.html">
    <meta name="twitter:player:width" content="1280">
    <meta name="twitter:player:height" content="720">
    <!-- Το stream URL για άμεση αναπαραγωγή -->
    <meta name="twitter:player:stream" content="https://blog.franklymadear.com/videos/video55.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://blog.franklymadear.com/videos/index.html">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Κύριος container για το βίντεο - ΟΛΗ Η ΟΘΟΝΗ */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }
        
        /* Το βίντεο - ΠΛΗΡΗ ΟΘΟΝΗ */
        #mainVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* ΚΑΛΥΠΤΕΙ ΟΛΗ ΤΗΝ ΟΘΟΝΗ */
            z-index: 1;
        }
        
        /* Overlay με το ΠΡΩΤΟ ΚΑΡΕ (thumbnail) */
        .thumbnail-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        
        /* Play Button - ΣΤΗ ΜΕΣΗ ΤΗΣ ΟΘΟΝΗΣ */
        .play-button-large {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 3;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        
        .play-button-large:hover {
            background: rgba(220, 20, 60, 0.8);
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .play-button-large::after {
            content: '▶';
            color: white;
            font-size: 40px;
            margin-left: 8px; /* Για να φαίνεται πιο κεντραρισμένο το play */
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        
        /* Ένδειξη Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 4;
            text-align: center;
        }
        
        /* Απλά Controls */
        .simple-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
        }
        
        .video-container:hover .simple-controls {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Tweet Button */
        .tweet-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1DA1F2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .tweet-button:hover {
            background: #1a91da;
        }
        
        /* Πληροφορίες βίντεο */
        .video-info {
            position: absolute;
            bottom: 100px;
            left: 20px;
            z-index: 3;
            max-width: 600px;
        }
        
        .video-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .video-description {
            font-size: 16px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .play-button-large {
                width: 80px;
                height: 80px;
            }
            
            .play-button-large::after {
                font-size: 30px;
            }
            
            .video-title {
                font-size: 22px;
            }
            
            .video-info {
                bottom: 120px;
                left: 15px;
                right: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .play-button-large {
                width: 70px;
                height: 70px;
            }
            
            .play-button-large::after {
                font-size: 25px;
            }
            
            .simple-controls {
                bottom: 20px;
                gap: 10px;
                padding: 8px 15px;
            }
            
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <!-- Το ΠΡΩΤΟ ΚΑΡΕ (Thumbnail) -->
        <div class="thumbnail-overlay" id="thumbnailOverlay">
            <!-- Εδώ θα φορτωθεί το πρώτο καρέ του βίντεο -->
            <img id="firstFrame" src="" alt="Video Thumbnail" style="width:100%; height:100%; object-fit:cover; display:none;">
        </div>
        
        <!-- Μεγάλο Play Button (ΚΕΝΤΡΟ) -->
        <div class="play-button-large" id="playButton"></div>
        
        <!-- Loading Indicator -->
        <div class="loading" id="loading" style="display:none;">
            ⏳ Φόρτωση βίντεο...
        </div>
        
        <!-- Κύριο Βίντεο -->
        <video id="mainVideo" preload="metadata" playsinline>
            <!-- ΒΙΝΤΕΟ MP4 -->
            <source src="video55.mp4" type="video/mp4">
            Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την αναπαραγωγή βίντεο.
        </video>
        
        <!-- Video Info -->
        <div class="video-info">
            <div class="video-title">Must Watch Video</div>
            <div class="video-description">Exclusive content available for viewing now</div>
        </div>
        
        <!-- Απλά Controls -->
        <div class="simple-controls">
            <button class="control-btn" id="playPauseBtn">⏸</button>
            <button class="control-btn" id="muteBtn">🔊</button>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
        
        <!-- Tweet Button -->
        <a href="https://twitter.com/intent/tweet?url=https://blog.franklymadear.com/videos/index.html&text=Watch%20this%20exclusive%20video%20now&hashtags=video,exclusive" 
           target="_blank" 
           class="tweet-button">
           🐦 Tweet this Video
        </a>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const firstFrameImg = document.getElementById('firstFrame');
        const playButton = document.getElementById('playButton');
        const loading = document.getElementById('loading');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // State
        let isPlaying = false;
        let isMuted = false;
        
        // Πάρτο ΠΡΩΤΟ ΚΑΡΕ από το βίντεο
        function extractFirstFrame() {
            // Δημιουργούμε ένα προσωρινό βίντεο στοιχείο
            const tempVideo = document.createElement('video');
            tempVideo.crossOrigin = 'anonymous';
            tempVideo.preload = 'metadata';
            
            tempVideo.addEventListener('loadeddata', function() {
                // Σταματάμε το βίντεο στο πρώτο καρέ
                tempVideo.currentTime = 0;
                
                // Περιμένουμε να είναι έτοιμο
                setTimeout(() => {
                    // Δημιουργούμε canvas
                    const canvas = document.createElement('canvas');
                    canvas.width = tempVideo.videoWidth;
                    canvas.height = tempVideo.videoHeight;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                    
                    // Μετατρέπουμε σε data URL
                    const dataURL = canvas.toDataURL('image/jpeg');
                    
                    // Εμφανίζουμε το πρώτο καρέ
                    firstFrameImg.src = dataURL;
                    firstFrameImg.style.display = 'block';
                    
                    // Καθαρίζουμε μνήμη
                    tempVideo.remove();
                    canvas.remove();
                }, 100);
            });
            
            tempVideo.src = mainVideo.querySelector('source').src;
        }
        
        // Play/Pause λειτουργία
        function togglePlay() {
            if (mainVideo.paused) {
                // PLAY
                loading.style.display = 'block';
                
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                    playButton.style.display = 'none';
                    thumbnailOverlay.style.opacity = '0';
                    
                    setTimeout(() => {
                        thumbnailOverlay.style.display = 'none';
                        loading.style.display = 'none';
                    }, 500);
                    
                    // Αναγκάζουμε το unmute για καλύτερη εμπειρία
                    if (isMuted) {
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }
                }).catch(e => {
                    console.error('Play failed:', e);
                    loading.style.display = 'none';
                    alert('Σφάλμα αναπαραγωγής: ' + e.message);
                });
            } else {
                // PAUSE
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }
        
        // Mute/Unmute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(e => {
                    console.log('Fullscreen error:', e);
                });
                fullscreenBtn.textContent = '🗗';
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('Βίντεο metadata loaded');
            console.log('Διάρκεια:', mainVideo.duration, 'δευτερόλεπτα');
            console.log('Διαστάσεις:', mainVideo.videoWidth, 'x', mainVideo.videoHeight);
            
            // Προσπάθεια εξαγωγής πρώτου καρέ
            extractFirstFrame();
            
            // Προσπάθεια autoplay (muted)
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                // Αν πετύχει το autoplay
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    mainVideo.pause();
                    mainVideo.currentTime = 0;
                    thumbnailOverlay.style.display = 'none';
                }, 100);
            }).catch(e => {
                // Αν αποτύχει το autoplay (φυσιολογικό)
                console.log('Autoplay blocked:', e.message);
                // Κρατάμε το thumbnail και το play button ορατά
            });
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loading.style.display = 'none';
            
            let errorMsg = 'Άγνωστο σφάλμα';
            if (mainVideo.error) {
                switch(mainVideo.error.code) {
                    case 1: errorMsg = 'Ακύρωση φόρτωσης'; break;
                    case 2: errorMsg = 'Σφάλμα δικτύου'; break;
                    case 3: errorMsg = 'Δεν μπορεί να αποκωδικοποιηθεί το βίντεο'; break;
                    case 4: errorMsg = 'Μη υποστηριζόμενη μορφή'; break;
                }
            }
            
            // Fallback: χρησιμοποίησε το εναλλακτικό thumbnail
            firstFrameImg.src = 'thumbnail55.png';
            firstFrameImg.style.display = 'block';
            firstFrameImg.onerror = function() {
                this.src = 'https://via.placeholder.com/1280x720/000000/FFFFFF?text=VIDEO+THUMBNAIL';
            };
            
            console.error('Video loading error:', errorMsg);
        });
        
        // Χειρισμός κλικ
        playButton.addEventListener('click', togglePlay);
        videoContainer.addEventListener('click', (e) => {
            if (e.target === videoContainer || e.target === thumbnailOverlay || e.target === firstFrameImg) {
                togglePlay();
            }
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlay();
        });
        
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });
        
        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });
        
        // Βοηθητικό function για debugging
        function debugVideo() {
            console.log('--- VIDEO DEBUG INFO ---');
            console.log('Video src:', mainVideo.querySelector('source').src);
            console.log('Video readyState:', mainVideo.readyState);
            console.log('Video networkState:', mainVideo.networkState);
            console.log('Video error:', mainVideo.error);
            console.log('--- END DEBUG ---');
        }
        
        // Execute debug on load
        window.addEventListener('load', () => {
            setTimeout(debugVideo, 2000);
        });
        
        // Εμφάνιση controls όταν κινείται το ποντίκι
        let controlsTimeout;
        videoContainer.addEventListener('mousemove', () => {
            const controls = document.querySelector('.simple-controls');
            controls.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    controls.style.opacity = '0';
                }
            }, 2000);
        });
        
        // Χειρισμός πλήκτρων πληκτρολογίου
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'KeyM':
                    toggleMute();
                    break;
                case 'KeyF':
                    toggleFullscreen();
                    break;
            }
        });
        
        console.log('Twitter Player Video Page Loaded');
        
    </script>
</body>
</html>
