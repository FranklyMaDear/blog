<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- X (Twitter) Player Card Tags - ΓΙΑ ΑΜΕΣΗ ΑΝΑΠΑΡΑΓΩΓΗ -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="Must Watch Exclusive Video">
    <meta name="twitter:description" content="Watch this exclusive content now">
    <!-- THUMBNAIL για το X -->
    <meta name="twitter:image" content="https://blog.franklymadear.com/videos/thumbnail55.png">
    <!-- Player URL - Η ΣΕΛΙΔΑ ΠΟΥ ΘΑ ΑΝΑΠΑΡΑΓΕΙ ΤΟ ΒΙΝΤΕΟ -->
    <meta name="twitter:player" content="https://blog.franklymadear.com/videos/index.html">
    <meta name="twitter:player:width" content="1280">
    <meta name="twitter:player:height" content="720">
    <!-- DIRECT STREAM για άμεση αναπαραγωγή στο X -->
    <meta name="twitter:player:stream" content="https://blog.franklymadear.com/videos/video55.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <title>Watch Exclusive Video</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }
        
        #mainVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* THUMBNAIL για προεπισκόπηση πριν το play */
        .thumbnail-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        
        .thumbnail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* PLAY BUTTON στο κέντρο */
        .play-button-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(220, 20, 60, 0.9);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        
        .play-button-center:hover {
            background: rgba(220, 20, 60, 1);
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .play-button-center::after {
            content: '▶';
            color: white;
            font-size: 40px;
            margin-left: 5px;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(220, 20, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0); }
        }
        
        /* Controls */
        .video-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        
        .video-container:hover .video-controls {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Timer */
        .timer {
            font-family: monospace;
            font-size: 16px;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        
        /* Progress bar */
        .progress-container {
            position: absolute;
            bottom: 90px;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-container:hover .progress-container {
            opacity: 1;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #dc143c;
            transition: width 0.1s;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .play-button-center {
                width: 80px;
                height: 80px;
            }
            
            .play-button-center::after {
                font-size: 30px;
            }
            
            .video-controls {
                bottom: 20px;
                padding: 8px 15px;
            }
            
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <!-- THUMBNAIL που φαίνεται στο X και πριν το play -->
        <div class="thumbnail-overlay" id="thumbnailOverlay">
            <img class="thumbnail-img" src="thumbnail55.png" alt="Video Thumbnail" 
                 onerror="this.style.display='none';">
        </div>
        
        <!-- PLAY BUTTON -->
        <button class="play-button-center" id="playButton"></button>
        
        <!-- ΒΙΝΤΕΟ -->
        <video id="mainVideo" preload="auto" playsinline muted>
            <source src="video55.mp4" type="video/mp4">
        </video>
        
        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <!-- CONTROLS -->
        <div class="video-controls">
            <button class="control-btn" id="playPauseBtn">⏸</button>
            <div class="timer" id="currentTime">00:00</div>
            <button class="control-btn" id="muteBtn">🔇</button>
            <div class="timer" id="durationTime">00:00</div>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const playButton = document.getElementById('playButton');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const progressBar = document.getElementById('progressBar');
        
        // State
        let isPlaying = false;
        let isMuted = true; // Αρχικά muted για autoplay
        let hasAutoPlayed = false;
        
        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time and progress
        function updateTime() {
            currentTimeEl.textContent = formatTime(mainVideo.currentTime);
            
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                durationTimeEl.textContent = formatTime(mainVideo.duration);
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                progressBar.style.width = `${progress}%`;
            }
        }
        
        // Start video (χειροκίνητο)
        function startVideo() {
            playButton.style.display = 'none';
            
            mainVideo.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                thumbnailOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                // Unmute
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                    muteBtn.textContent = '🔊';
                }
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(e => {
                    console.log('Fullscreen error:', e);
                });
                fullscreenBtn.textContent = '🗗';
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
        
        // ΑΥΤΟΜΑΤΗ ΕΝΑΡΞΗ (για το X player)
        function tryAutoplay() {
            // Προσπάθεια autoplay με ήχο muted
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                hasAutoPlayed = true;
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                // Αφού ξεκινήσει, ξε-mute μετά από λίγο
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }
                }, 1000);
                
            }).catch(e => {
                console.log('Autoplay failed (normal for some browsers):', e.message);
                // Κρατάμε το thumbnail και το play button ορατά
                playButton.style.display = 'flex';
            });
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            updateTime();
            
            // Ελέγχουμε αν είμαστε σε embedded player (X)
            const isEmbedded = window.self !== window.top;
            
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                // Στο X, προσπάθεια άμεσης αναπαραγωγής
                tryAutoplay();
            } else {
                // Σε κανονικό browser, περιμένουμε χειροκίνητο play
                console.log('Running in regular browser');
            }
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '⟳';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            
            // Fallback μήνυμα
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px;">Video Error</div>
                    <div style="font-size: 14px; opacity: 0.8;">
                        Check if video55.mp4 exists in the videos folder
                    </div>
                </div>
            `;
            
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Κλικ στο βίντεο για play/pause
        mainVideo.addEventListener('click', togglePlayPause);
        
        // Κλικ στο thumbnail για play
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'KeyM':
                    toggleMute();
                    break;
                case 'KeyF':
                    toggleFullscreen();
                    break;
            }
        });
        
        // Show/hide controls
        let controlsTimeout;
        videoContainer.addEventListener('mousemove', () => {
            const controls = document.querySelector('.video-controls');
            const progress = document.querySelector('.progress-container');
            
            if (isPlaying || hasAutoPlayed) {
                controls.style.opacity = '1';
                progress.style.opacity = '1';
                
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (isPlaying) {
                        controls.style.opacity = '0';
                        progress.style.opacity = '0';
                    }
                }, 3000);
            }
        });
        
        // Αυτόματη έναρξη όταν ο χρήστης αλληλεπιδράσει με τη σελίδα
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        document.addEventListener('touchstart', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        console.log('X Player ready');
        console.log('Thumbnail: thumbnail55.png');
        console.log('Video: video55.mp4');
        
    </script>
</body>
</html>
