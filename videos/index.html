<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Must Watch Video - Exclusive Content</title>
    
    <!-- Facebook Meta Tags -->
    <meta property="og:title" content="Must Watch Video - Exclusive Content">
    <meta property="og:description" content="Watch this exclusive video now. Premium content available for viewing.">
    <meta property="og:image" content="thumbnail55.png"> <!-- Χρησιμοποίησε πλήρη URL αν δεν δουλεύει -->
    <meta property="og:url" content="https://blog.franklymadear.com/videos/index.html">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="video55.mp4"> <!-- Χρησιμοποίησε πλήρη URL αν δεν δουλεύει -->
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="1280">
    <meta property="og:video:height" content="720">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Must Watch Video - Exclusive Content">
    <meta name="twitter:description" content="Watch this exclusive video now. Premium content available for viewing.">
    <meta name="twitter:image" content="thumbnail55.png"> <!-- Χρησιμοποίησε πλήρη URL αν δεν δουλεύει -->
    <meta name="twitter:player" content="https://blog.franklymadear.com/videos/index.html">
    <meta name="twitter:player:width" content="1280">
    <meta name="twitter:player:height" content="720">
    <meta name="twitter:player:stream" content="video55.mp4"> <!-- Χρησιμοποίησε πλήρη URL αν δεν δουλεύει -->
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Video Container */
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
        }
        
        /* Video Element */
        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        
        /* Loading Animation */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Fallback Container */
        .fallback-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        
        .fallback-container h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4ecdc4;
        }
        
        .fallback-container p {
            font-size: 16px;
            margin-bottom: 30px;
            color: #ccc;
            max-width: 600px;
        }
        
        /* Play Button */
        .play-button {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(78, 205, 196, 0.6);
        }
        
        /* Error Message */
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-width: 600px;
            text-align: left;
        }
        
        .error-message h3 {
            color: #dc3545;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .error-message code {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 5px;
            font-size: 14px;
            word-break: break-all;
            display: block;
            margin: 10px 0;
        }
        
        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-container:hover .controls {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .timer {
            font-family: monospace;
            font-size: 14px;
            min-width: 50px;
        }
        
        /* Share Buttons */
        .share-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
        
        .share-toggle {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }
        
        .share-buttons {
            position: absolute;
            bottom: 60px;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            min-width: 170px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s;
        }
        
        .share-container:hover .share-buttons {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .share-btn {
            display: block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 8px;
            text-align: center;
            transition: all 0.2s;
        }
        
        .share-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .fallback-container h2 {
                font-size: 20px;
            }
            
            .play-button {
                padding: 15px 30px;
                font-size: 16px;
            }
            
            .controls {
                bottom: 10px;
                padding: 10px 15px;
                gap: 10px;
            }
            
            .share-container {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <!-- Loading Indicator -->
        <div class="loader" id="loader"></div>
        
        <!-- Fallback UI (Shows if autoplay fails) -->
        <div class="fallback-container" id="fallbackContainer">
            <h2>🎬 Το βίντεο είναι έτοιμο!</h2>
            <p>Η αυτόματη αναπαραγωγή απαγορεύτηκε από το πρόγραμμα περιήγησης</p>
            <button class="play-button" id="manualPlayBtn">
                <span>▶</span>
                <span>Παίξε το Βίντεο</span>
            </button>
            <p>Κάντε κλικ στο κουμπί παραπάνω για να ξεκινήσει η αναπαραγωγή</p>
            
            <!-- Error Display Area -->
            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </div>
        
        <!-- Main Video Element -->
        <video id="mainVideo" preload="metadata" playsinline>
            <!-- ΑΛΛΑΞΤΕ ΑΥΤΗ ΤΗ ΔΙΑΔΡΟΜΗ ΕΑΝ ΔΕΝ ΔΟΥΛΕΥΕΙ -->
            <source src="video55.mp4" type="video/mp4">
            <!-- ΕΦΕΤΕΡΕΙΑ: <source src="https://blog.franklymadear.com/video55.mp4" type="video/mp4"> -->
            Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την αναπαραγωγή βίντεο.
        </video>
        
        <!-- Video Controls -->
        <div class="controls">
            <button class="control-btn" id="playPauseBtn">⏸</button>
            <span class="timer" id="currentTime">00:00</span>
            <span class="timer" id="durationTime">00:00</span>
            <button class="control-btn" id="muteBtn">🔊</button>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
        
        <!-- Share Buttons -->
        <div class="share-container">
            <div class="share-toggle">
                📤
            </div>
            <div class="share-buttons">
                <a href="https://www.facebook.com/sharer/sharer.php?u=https://blog.franklymadear.com/videos/index.html" 
                   target="_blank" class="share-btn">Facebook</a>
                <a href="https://twitter.com/intent/tweet?url=https://blog.franklymadear.com/videos/index.html" 
                   target="_blank" class="share-btn">Twitter</a>
                <a href="https://api.whatsapp.com/send?text=Δες αυτό το βίντεο: https://blog.franklymadear.com/videos/index.html" 
                   target="_blank" class="share-btn">WhatsApp</a>
                <a href="#" class="share-btn" onclick="copyLink(); return false;">Αντιγραφή Link</a>
            </div>
        </div>
    </div>
    
    <script>
        // DOM Elements
        const video = document.getElementById('mainVideo');
        const loader = document.getElementById('loader');
        const fallbackContainer = document.getElementById('fallbackContainer');
        const errorMessage = document.getElementById('errorMessage');
        const manualPlayBtn = document.getElementById('manualPlayBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // State
        let isPlaying = false;
        let isMuted = false;
        
        // Format time as MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time displays
        function updateTime() {
            currentTimeEl.textContent = formatTime(video.currentTime);
            
            if (video.duration && !isNaN(video.duration)) {
                durationTimeEl.textContent = formatTime(video.duration);
            }
        }
        
        // Toggle play/pause
        function togglePlay() {
            if (video.paused) {
                video.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                    fallbackContainer.style.display = 'none';
                }).catch(e => {
                    showError('Αποτυχία αναπαραγωγής: ' + e.message);
                });
            } else {
                video.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            video.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => {
                    console.log('Fullscreen error:', e);
                });
                fullscreenBtn.textContent = '🗗';
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
        
        // Show error message
        function showError(message) {
            errorMessage.innerHTML = `
                <h3>❌ Σφάλμα Φόρτωσης Βίντεο</h3>
                <p>${message}</p>
                <p>Πιθανά προβλήματα:</p>
                <ul>
                    <li>Το αρχείο βίντεο δεν βρίσκεται στον server</li>
                    <li>Λάθος διαδρομή προς το βίντεο</li>
                    <li>Το αρχείο είναι κατεστραμμένο</li>
                </ul>
                <p><strong>Δοκιμάστε:</strong></p>
                <ol>
                    <li>Ανεβάστε το αρχείο <code>video55.mp4</code> στον ίδιο φάκελο με αυτή τη σελίδα</li>
                    <li>Βεβαιωθείτε ότι το όνομα αρχείου είναι σωστό</li>
                    <li>Δοκιμάστε να ανοίξετε αυτό το link: <code id="videoLink"></code></li>
                </ol>
            `;
            
            // Show the actual video URL for debugging
            const videoLink = document.getElementById('videoLink');
            if (videoLink) {
                const videoSrc = video.querySelector('source').src;
                videoLink.textContent = videoSrc;
            }
            
            errorMessage.style.display = 'block';
        }
        
        // Check if video file exists
        function checkVideoExists() {
            const videoSrc = video.querySelector('source').src;
            
            // Create test request
            fetch(videoSrc, { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    console.log('Video file exists:', videoSrc);
                })
                .catch(error => {
                    console.error('Video file check failed:', error);
                    showError(`Το βίντεο δεν βρέθηκε στη διαδρομή: <code>${videoSrc}</code><br>
                              Σφάλμα: ${error.message}`);
                    
                    // Also hide loader since we know it won't load
                    loader.style.display = 'none';
                });
        }
        
        // Copy link to clipboard
        function copyLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url)
                .then(() => {
                    alert('Το link αντιγράφηκε!');
                })
                .catch(err => {
                    console.error('Copy failed:', err);
                    // Fallback
                    const textArea = document.createElement('textarea');
                    textArea.value = url;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('Το link αντιγράφηκε (fallback)');
                });
        }
        
        // Event Listeners
        video.addEventListener('loadeddata', () => {
            loader.style.display = 'none';
            updateTime();
            
            // Try autoplay with sound muted
            video.muted = true;
            video.play()
                .then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                    fallbackContainer.style.display = 'none';
                    
                    // After 1 second, try to unmute (user gesture required)
                    setTimeout(() => {
                        video.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }, 1000);
                })
                .catch(e => {
                    console.log('Autoplay failed (normal for some browsers):', e.message);
                    // Keep fallback visible for manual play
                    fallbackContainer.style.display = 'flex';
                });
        });
        
        video.addEventListener('timeupdate', updateTime);
        
        video.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '⟳';
        });
        
        video.addEventListener('error', (e) => {
            loader.style.display = 'none';
            console.error('Video error:', video.error);
            
            let errorText = 'Άγνωστο σφάλμα';
            switch(video.error.code) {
                case 1: errorText = 'Ακύρωση φόρτωσης'; break;
                case 2: errorText = 'Σφάλμα δικτύου'; break;
                case 3: errorText = 'Σφάλμα αποκωδικοποίησης βίντεο'; break;
                case 4: errorText = 'Μη υποστηριζόμενη μορφή βίντεο'; break;
            }
            
            showError(`Σφάλμα βίντεο (${errorText}). Βεβαιωθείτε ότι:
                <ol>
                    <li>Το αρχείο <strong>video55.mp4</strong> είναι ανεβασμένο</li>
                    <li>Βρίσκεται στον ίδιο φάκελο με αυτή τη σελίδα</li>
                    <li>Η μορφή είναι συμβατή MP4 (H.264 codec)</li>
                </ol>
                <p><strong>Γρήγορο fix:</strong> Ανέβασε το βίντεο στον ίδιο φάκελο με το index.html</p>`);
        });
        
        // Manual play button
        manualPlayBtn.addEventListener('click', togglePlay);
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlay);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Initial setup
        video.volume = 1.0;
        
        // Check if video file exists on page load
        window.addEventListener('load', () => {
            setTimeout(checkVideoExists, 500);
        });
        
        // Show controls on mouse move
        let controlsTimeout;
        document.addEventListener('mousemove', () => {
            const controls = document.querySelector('.controls');
            controls.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    controls.style.opacity = '0';
                }
            }, 2000);
        });
        
        console.log('Video page initialized');
        console.log('Video source:', video.querySelector('source').src);
    </script>
</body>
</html>
