    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΣΥΣΤΗΜΑ ΣΧΟΛΙΑΣΜΟΥ
            const commentForm = document.getElementById('commentForm');
            const commentsList = document.getElementById('commentsList');
            const noComments = document.getElementById('noComments');
            
            // Φόρτωση υπαρχόντων σχολίων από localStorage
            function loadComments() {
                const comments = JSON.parse(localStorage.getItem('pageComments')) || [];
                
                if (comments.length > 0) {
                    noComments.style.display = 'none';
                    commentsList.innerHTML = '';
                    
                    // Ταξινόμηση από νεότερο προς παλιότερο
                    comments.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    comments.forEach(comment => {
                        const commentElement = document.createElement('div');
                        commentElement.className = 'comment';
                        commentElement.innerHTML = `
                            <div class="comment-header">
                                <span class="comment-author">${comment.author}</span>
                                <span class="comment-date">${formatDate(comment.date)}</span>
                            </div>
                            <div class="comment-text">${comment.text}</div>
                        `;
                        commentsList.appendChild(commentElement);
                    });
                } else {
                    noComments.style.display = 'block';
                }
            }
            
            // Μορφοποίηση ημερομηνίας
            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('el-GR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            
            // Επεξεργασία υποβολής σχολίου
            commentForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const author = document.getElementById('author').value.trim();
                const commentText = document.getElementById('comment').value.trim();
                
                if (!author || !commentText) {
                    alert('Παρακαλώ συμπληρώστε όλα τα πεδία.');
                    return;
                }
                
                // Λήψη υπαρχόντων σχολίων
                const comments = JSON.parse(localStorage.getItem('pageComments')) || [];
                
                // Προσθήκη νέου σχολίου
                const newComment = {
                    author: author,
                    text: commentText,
                    date: new Date().toISOString()
                };
                
                comments.unshift(newComment); // Προσθήκη στην αρχή
                
                // Αποθήκευση στο localStorage
                localStorage.setItem('pageComments', JSON.stringify(comments));
                
                // Επαναφόρτωση σχολίων
                loadComments();
                
                // Εκκαθάριση φόρμας
                commentForm.reset();
                
                // Μήνυμα επιτυχίας
                alert('Το σχόλιο σας υποβλήθηκε με επιτυχία!');
            });
            
            // Φόρτωση αρχικών σχολίων
            loadComments();
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 2000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων με καθυστέρηση
            setTimeout(LOAD_ALL_ADS, 1500);
            setInterval(LOAD_ALL_ADS, 30000);
        });
        
        // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
        window.addEventListener('resize', function() {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                window.setTimeout(function() {
                    document.activeElement.scrollIntoView({ block: 'center' });
                }, 0);
            }
        });
    </script>
