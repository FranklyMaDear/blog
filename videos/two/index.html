        /* Play button - ΓΚΡΙ ΔΙΑΦΑΝΟ */

        /* ΜΠΑΡΑ ΠΡΟΟΔΟΥ - ΑΚΡΙΒΩΣ ΟΠΩΣ ΣΤΟ SCREENSHOT */

        /* Progress bar wrapper - ΓΙΑ SEEKING */
        .progress-bar-wrapper {
            position: relative;
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;

            cursor: pointer;

        .progress-bar {
            position: relative;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1d9bf0, #1a8cd8);
            border-radius: 2px;
            transition: width 0.1s;

        /* Progress bar knob - ΓΙΑ ΟΠΤΙΚΗ ΑΝΑΓΝΩΣΗ */
        .progress-knob {
            position: absolute;
            top: 50%;
            right: -6px;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            transform: translateY(-50%);

            transition: opacity 0.2s;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
        
        .progress-bar-wrapper:hover .progress-knob {
            opacity: 1;
        }
        
        /* Time display - ΟΠΩΣ ΣΤΟ SCREENSHOT */
        .progress-time {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 6px;

        /* Tooltip για seeking */
        .seek-tooltip {
            position: absolute;

            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;

            font-family: 'Courier New', monospace;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%);
            transition: opacity 0.2s;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 5;
            font-weight: 600;

        /* Loading spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;

            border: 3px solid rgba(255, 255, 255, 0.1);

            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 6;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Hide URL bar on mobile */
        @media (max-height: 400px) {
            .progress-container {
                bottom: 45px;

            }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .play-button-center {

            }
            
            .play-button-center::after {

            }
            
            /* Μεγέθυνση για mobile */
            .thumbnail-img {
                width: 130%; /* Περισσότερη μεγέθυνση για mobile */
                height: 130%; /* Περισσότερη μεγέθυνση για mobile */
            }
        }
        
        /* X/Twitter player specific */
        @media (max-width: 480px) {
            .play-button-center {
                width: 50px;
                height: 50px;
            }
            
            .play-button-center::after {
                font-size: 20px;
            }
            
            .progress-container {
                width: 94%;

                height: 40px;
                padding: 0 12px;

            .ad-container {
                min-width: 100px;

            .ad-content {

            .progress-bar-wrapper {

            .progress-time {

            /* Μεγέθυνση για πολύ μικρές οθόνες */
            .thumbnail-img {

        /* Fullscreen adjustments */
        .video-container:fullscreen .progress-container {

        /* Hover effects */
        .progress-container:hover {

        .progress-bar-wrapper:hover {

        .progress-bar-wrapper:hover .progress-bar {

    </style>
    
    <!-- JavaScript για απόκρυψη URL -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                // Προσθήκη αυτής της γραμμής για iOS
                document.body.style.height = window.innerHeight + 'px';
                
                // Αποτροπή zoom
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                // Αποτροπή κινητών URL bars
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });
    </script>

<body>
    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- Thumbnail overlay -->
        <div class="thumbnail-overlay" id="thumbnailOverlay">
            <img class="thumbnail-img" src="https://blog.franklymadear.com/videos/two/thumbnail57.png" alt="Video Thumbnail - Must Watch Exclusive Video" 
                 onerror="this.style.display='none';">
        </div>
        
        <!-- Play button -->
        <button class="play-button-center" id="playButton"></button>
        
        <!-- Main video -->
        <video id="mainVideo" preload="auto" playsinline muted autoplay> <!-- Προσθήκη autoplay -->
            <source src="https://blog.franklymadear.com/videos/two/video57.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- ΜΠΑΡΑ ΠΡΟΟΔΟΥ - ΑΚΡΙΒΩΣ ΟΠΩΣ ΣΤΟ SCREENSHOT -->
        <div class="progress-container" id="progressContainer">
            <!-- Διαφήμιση ΜΕΣΑ στη μπάρα (χωρίς ετικέτα "Ad:") -->
            <div class="ad-container" id="adContainer">
                <span class="ad-content" id="adContent">Exclusive Content</span>
            </div>
            
            <!-- Μπάρα προόδου με seeking capability -->
            <div class="progress-bar-wrapper" id="progressBarWrapper">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-knob"></div>
                </div>
                <div class="seek-tooltip" id="seekTooltip">00:00</div>
            </div>
            
            <!-- Χρόνος στη μπάρα -->
            <div class="progress-time" id="progressTime">00:00 / 00:00</div>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const playButton = document.getElementById('playButton');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressBarWrapper = document.getElementById('progressBarWrapper');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const adContainer = document.getElementById('adContainer');
        const adContent = document.getElementById('adContent');
        const progressTime = document.getElementById('progressTime');
        const seekTooltip = document.getElementById('seekTooltip');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let hasAutoPlayed = false;
        let isSeeking = false;
        let videoWidth = 0;
        let videoHeight = 0;
        let monetagLoaded = false;
        
        // Format time σε mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTime() {
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                progressBar.style.width = `${progress}%`;
                progressTime.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(mainVideo.duration)}`;
            }
        }
        
        // Load Monetag script
        function loadMonetag() {
            if (!monetagLoaded) {
                monetagLoaded = true;
                
                try {
                    // Δημιουργία script για Monetag
                    const newScript = document.createElement('script');
                    newScript.dataset.zone = '10274195';
                    newScript.src = 'https://al5sm.com/tag.min.js';
                    newScript.async = true;
                    newScript.setAttribute('data-cfasync', 'false');
                    
                    // Προσθήκη στο adContainer
                    adContainer.appendChild(newScript);
                    
                    console.log('Monetag script loaded in ad container');
                } catch (e) {
                    console.error('Error loading Monetag:', e);
                }
            }
        }
        
        // Update ad content (fallback αν δεν φορτωθεί το monetag)
        function updateAdContent() {
            const adTexts = [
                "Exclusive Content",
                "Premium Video",
                "Must Watch",
                "Special Feature",
                "Limited Access"
            ];
            const randomAd = adTexts[Math.floor(Math.random() * adTexts.length)];
            adContent.textContent = randomAd;
        }
        
        // Seek to specific time
        function seekToTime(clientX) {
            const rect = progressBarWrapper.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            
            // Ενημέρωση του βίντεο
            mainVideo.currentTime = time;
            
            // Εμφάνιση loading spinner αν το βίντεο δεν είναι σε buffered περιοχή
            if (mainVideo.readyState < 3) {
                loadingSpinner.style.display = 'block';
                
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                }, 500);
            }
            
            // Φόρτωση Monetag κατά το seeking
            loadMonetag();
            
            console.log(`Seeking to: ${formatTime(time)}`);
        }
        
        // Update seek tooltip
        function updateSeekTooltip(clientX) {
            const rect = progressBarWrapper.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            seekTooltip.textContent = formatTime(time);
            seekTooltip.style.left = `${percent * 100}%`;
            seekTooltip.style.opacity = '1';
        }
        
        // Hide seek tooltip
        function hideSeekTooltip() {
            seekTooltip.style.opacity = '0';
        }
        
        // Start video
        function startVideo() {
            playButton.style.display = 'none';
            
            mainVideo.play().then(() => {
                isPlaying = true;
                thumbnailOverlay.style.opacity = '0';
                thumbnailOverlay.style.transform = 'translate(-50%, -50%) scale(1.2)'; // Κρατάμε την μεγέθυνση
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                }
                
                // Φόρτωση Monetag μετά το play
                setTimeout(loadMonetag, 1000);
                updateAdContent();
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
            }
        }
        
        // Try autoplay for X player
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                thumbnailOverlay.style.transform = 'translate(-50%, -50%) scale(1.2)'; // Κρατάμε την μεγέθυνση
                hasAutoPlayed = true;
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                    }
                }, 1000);
                
                // Φόρτωση Monetag μετά το autoplay
                setTimeout(loadMonetag, 1500);
                updateAdContent();
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Προσαρμογή thumbnail στο μέγεθος του βίντεο
        function adjustThumbnailSize() {
            if (videoWidth > 0 && videoHeight > 0) {
                thumbnailOverlay.style.width = `${videoWidth}px`;
                thumbnailOverlay.style.height = `${videoHeight}px`;
            }
        }
        
        // Προσαρμοσμένη autoplay συνάρτηση
        function customAutoplay() {
            console.log('Custom autoplay triggered');
            
            // Εξασφαλίζουμε ότι το βίντεο είναι muted για καλύτερη συμβατότητα
            mainVideo.muted = true;
            mainVideo.playsInline = true;
            
            // Προσπάθεια autoplay
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('Custom autoplay successful');
                    isPlaying = true;
                    playButton.style.display = 'none';
                    thumbnailOverlay.style.opacity = '0';
                    thumbnailOverlay.style.transform = 'translate(-50%, -50%) scale(1.2)';
                    hasAutoPlayed = true;
                    
                    setTimeout(() => {
                        thumbnailOverlay.style.display = 'none';
                    }, 500);
                    
                    // Απενεργοποίηση mute μετά από λίγο
                    setTimeout(() => {
                        if (isPlaying) {
                            mainVideo.muted = false;
                            isMuted = false;
                        }
                    }, 1500);
                    
                    // Φόρτωση Monetag
                    setTimeout(loadMonetag, 2000);
                    updateAdContent();
                    
                }).catch(e => {
                    console.log('Custom autoplay failed, showing play button:', e.message);
                    playButton.style.display = 'flex';
                    isMuted = true;
                    mainVideo.muted = true;
                });
            }
        }
        
        // Progress bar interaction για seeking
        progressBarWrapper.addEventListener('mousemove', (e) => {
            if (!mainVideo.duration || isNaN(mainVideo.duration)) return;
            updateSeekTooltip(e.clientX);
        });
        
        progressBarWrapper.addEventListener('mouseleave', () => {
            hideSeekTooltip();
        });
        
        progressBarWrapper.addEventListener('click', (e) => {
            seekToTime(e.clientX);
        });
        
        // Touch support για seeking
        progressBarWrapper.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isSeeking = true;
            seekToTime(e.touches[0].clientX);
        });
        
        progressBarWrapper.addEventListener('touchmove', (e) => {
            if (isSeeking) {
                e.preventDefault();
                updateSeekTooltip(e.touches[0].clientX);
            }
        });
        
        progressBarWrapper.addEventListener('touchend', () => {
            isSeeking = false;
            hideSeekTooltip();
        });
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight);
            
            adjustThumbnailSize();
            updateTime();
            updateAdContent();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            }
            
            // ΠΡΟΣΘΗΚΗ: Προσπάθεια autoplay μετά το φόρτωμα metadata
            setTimeout(customAutoplay, 500);
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px; color: white;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 10px; opacity: 0.9;">
                        Cannot load video: https://blog.franklymadear.com/videos/two/video57.mp4
                    </div>
                    <div style="font-size: 14px; opacity: 0.7;">
                        Please check if the video file exists
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        mainVideo.addEventListener('click', togglePlayPause);
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Keyboard shortcuts για seeking
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(mainVideo.duration, mainVideo.currentTime + 5);
                    break;
            }
        });
        
        // Show/hide progress bar on hover
        let barTimeout;
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying || hasAutoPlayed) {
                progressContainer.style.opacity = '1';
                
                clearTimeout(barTimeout);
                barTimeout = setTimeout(() => {
                    if (isPlaying && !isSeeking) {
                        progressContainer.style.opacity = '0';
                    }
                }, 3000);
            }
        });
        
        progressContainer.addEventListener('mouseenter', () => {
            clearTimeout(barTimeout);
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            updateAdContent();
            setTimeout(loadMonetag, 2000);
            
            // ΠΡΟΣΘΗΚΗ: Προσπάθεια autoplay κατά τη φόρτωση της σελίδας
            setTimeout(customAutoplay, 1000);
            
            // Απόκρυψη URL
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - https://blog.franklymadear.com/videos/two/index.html');
        
        // Track video views for analytics
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - FmD @FmD699');
        });
        
        // ΠΡΟΣΘΗΚΗ: Αυτόματο start μετά από λίγο
        setTimeout(() => {
            if (!hasAutoPlayed && !isPlaying) {
                customAutoplay();
            }
        }, 1500);
        
    </script>
</body>
</html>
