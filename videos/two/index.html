    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                // Προσθήκη αυτής της γραμμής για iOS
                document.body.style.height = window.innerHeight + 'px';
                
                // Αποτροπή zoom
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                // Αποτροπή κινητών URL bars
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });

        }
        
        function startAdCountdown() {
            clearInterval(adCountdownTimer);
            adCountdownTimer = setInterval(() => {
                adCountdownValue--;
                adTimerCount.textContent = adCountdownValue;
                
                if (adCountdownValue <= 0) {
                    clearInterval(adCountdownTimer);
                }
            }, 1000);
        }
        
        function closeFullscreenAdFunc(type = "startup") {
            fullscreenAd.classList.remove('show', 'show-abrupt');
            clearInterval(adCountdownTimer);
            clearTimeout(adTimer);
            
            // Συνεχίστε το βίντεο αν ήταν σε παύση
            if (isPlaying && type === "midgame") {
                mainVideo.play();
            }
            
            // Αν ήταν mid-game ad, ξαναξεκίνα το countdown για επόμενη
            if (type === "midgame") {
                setTimeout(() => {
                    midgameAdShown = false;
                    startMidgameAdCountdown();
                }, 60000); // Ξαναεμφανίζεται μετά από 1 λεπτό
            }
        }
        
        // MID-GAME AD FUNCTIONS
        function startMidgameAdCountdown() {
            // Καθαρίσε προηγούμενα timers
            stopMidgameAdCountdown();
            
            let secondsLeft = 120; // 2 λεπτά = 120 δευτερόλεπτα
            
            // Εμφάνιση indicator
            midgameTimer.textContent = secondsLeft;
            midgameAdIndicator.style.display = 'block';
            
            // Countdown
            midgameCountdownTimer = setInterval(() => {
                secondsLeft--;
                midgameTimer.textContent = secondsLeft;
                
                if (secondsLeft <= 0) {
                    // Εμφάνιση mid-game ad
                    if (videoActive && !midgameAdShown && isPlaying) {
                        showFullscreenAd("midgame");
                    }
                    clearInterval(midgameCountdownTimer);
                    hideMidgameIndicator();
                }
            }, 1000);
            
            // Backup timer για mid-game ad
            midgameAdTimeout = setTimeout(() => {
                if (videoActive && !midgameAdShown && isPlaying) {
                    showFullscreenAd("midgame");
                }
                hideMidgameIndicator();
            }, 120000); // 2 λεπτά
        }
        
        function stopMidgameAdCountdown() {
            clearInterval(midgameCountdownTimer);
            clearTimeout(midgameAdTimeout);
            hideMidgameIndicator();
        }
        
        function hideMidgameIndicator() {
            midgameAdIndicator.style.display = 'none';
        }
        
        // VIDEO PLAYER FUNCTIONS
        // Format time σε mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTime() {
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                seekProgress.style.width = `${progress}%`;
                timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(mainVideo.duration)}`;
            }
        }
        
        // Show seek bar
        function showSeekBar() {
            seekContainer.classList.add('active');
            
            // Auto hide after 3 seconds if not seeking
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                if (!isSeeking) {
                    seekContainer.classList.remove('active');
                }
            }, 3000);
        }
        
        // Hide seek bar
        function hideSeekBar() {
            if (!isSeeking) {
                seekContainer.classList.remove('active');
            }
        }
        
        // Update ad display (απλοποιημένο)
        function updateAdDisplay() {
            adText.textContent = "Νίκο πρόσεχε";
            
            // Αφαίρεση Monetag event listener και αντικατάσταση με απλό
            adOverlay.replaceWith(adOverlay.cloneNode(true));
            const newAdOverlay = document.getElementById('adOverlay');
            
            // Απλό event listener για το ad overlay
            newAdOverlay.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('Ad overlay clicked');
            });
            
            newAdOverlay.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('Ad overlay touched');
            });
        }
        
        // Seek to specific time
        function seekToTime(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            
            // Ενημέρωση του βίντεο
            mainVideo.currentTime = time;
            
            // Εμφάνιση loading spinner αν το βίντεο δεν είναι σε buffered περιοχή
            if (mainVideo.readyState < 3) {
                loadingSpinner.style.display = 'block';
                
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                }, 500);
            }
            
            console.log(`Seeking to: ${formatTime(time)}`);
        }
        
        // Update seek tooltip
        function updateSeekTooltip(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            seekTooltip.textContent = formatTime(time);
            seekTooltip.style.left = `${percent * 100}%`;
            seekTooltip.style.opacity = '1';
        }
        
        // Hide seek tooltip
        function hideSeekTooltip() {
            seekTooltip.style.opacity = '0';
        }
        
        // Start video
        function startVideo() {
            console.log('Play button clicked - starting video');
            videoActive = true;
            playButton.style.display = 'none';
            
            mainVideo.play().then(() => {
                console.log('Video playback started successfully');
                isPlaying = true;
                thumbnailOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                }
                
                updateAdDisplay();
                
                videoStartTime = Date.now();
                
                // Προετοιμασία για mid-game ad (μετά από 2 λεπτά)
                startMidgameAdCountdown();
                
                // Εμφάνιση πρώτης FULLSCREEN AD μετά από 2 δευτερόλεπτα
                if (!adShown) {
                    setTimeout(() => {
                        showFullscreenAd("startup");
                    }, 2000);
                }
                
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
                
                // Fallback: Try with muted
                mainVideo.muted = true;
                mainVideo.play().then(() => {
                    console.log('Video started with muted fallback');
                    isPlaying = true;
                    videoActive = true;
                    playButton.style.display = 'none';
                    thumbnailOverlay.style.opacity = '0';
                    
                    setTimeout(() => {
                        thumbnailOverlay.style.display = 'none';
                    }, 500);
                    
                    videoStartTime = Date.now();
                    startMidgameAdCountdown();
                    
                    if (!adShown) {
                        setTimeout(() => {
                            showFullscreenAd("startup");
                        }, 2000);
                    }
                });
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                    
                    // Επανεκκίνηση mid-game countdown αν χρειάζεται
                    if (!midgameAdShown) {
                        startMidgameAdCountdown();
                    }
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
            }
        }
        
        // Try autoplay for X player
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                videoActive = true;
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                hasAutoPlayed = true;
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                videoStartTime = Date.now();
                
                // Προετοιμασία για mid-game ad
                startMidgameAdCountdown();
                
                // Εμφάνιση startup ad
                if (!adShown) {
                    setTimeout(() => {
                        showFullscreenAd("startup");
                    }, 2000);
                }
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                    }
                }, 1000);
                
                updateAdDisplay();
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Προσαρμογή thumbnail στο μέγεθος του βίντεο
        function adjustThumbnailSize() {
            if (videoWidth > 0 && videoHeight > 0) {
                thumbnailOverlay.style.width = `${videoWidth}px`;
                thumbnailOverlay.style.height = `${videoHeight}px`;
            }
        }
        
        // Mouse movement detection για εμφάνιση seek bar
        let mouseMoveTimeout;
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying) {
                showSeekBar();
                
                clearTimeout(mouseMoveTimeout);
                mouseMoveTimeout = setTimeout(hideSeekBar, 3000);
            }
        });
        
        videoContainer.addEventListener('mouseleave', () => {
            if (!isSeeking) {
                hideSeekBar();
            }
        });
        
        // Seek bar interaction
        seekBar.addEventListener('mousemove', (e) => {
            if (!mainVideo.duration || isNaN(mainVideo.duration)) return;
            updateSeekTooltip(e.clientX);
        });
        
        seekBar.addEventListener('mouseenter', () => {
            showSeekBar();
        });
        
        seekBar.addEventListener('mouseleave', () => {
            hideSeekTooltip();
            if (!isSeeking) {
                setTimeout(hideSeekBar, 1000);
            }
        });
        
        seekBar.addEventListener('click', (e) => {
            // Prevent ad click when seeking
            e.stopPropagation();
            seekToTime(e.clientX);
            
            // Keep seek bar visible for a bit after seeking
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                seekContainer.classList.remove('active');
            }, 2000);
        });
        
        seekBar.addEventListener('mousedown', () => {
            isSeeking = true;
            showSeekBar();
        });
        
        document.addEventListener('mouseup', () => {
            isSeeking = false;
        });
        
        // Touch support για seeking
        seekBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isSeeking = true;
            seekToTime(e.touches[0].clientX);
            showSeekBar();
        });
        
        seekBar.addEventListener('touchmove', (e) => {
            if (isSeeking) {
                e.preventDefault();
                updateSeekTooltip(e.touches[0].clientX);
                showSeekBar();
            }
        });
        
        seekBar.addEventListener('touchend', (e) => {
            e.stopPropagation();
            isSeeking = false;
            hideSeekTooltip();
            
            // Keep seek bar visible for a bit after seeking
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                seekContainer.classList.remove('active');
            }, 2000);
        });
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight);
            
            adjustThumbnailSize();
            updateTime();
            updateAdDisplay();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            }
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
            stopMidgameAdCountdown();
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            stopMidgameAdCountdown();
            
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px; color: white;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 10px; opacity: 0.9;">
                        Cannot load video: https://blog.franklymadear.com/videos/two/video57.mp4
                    </div>
                    <div style="font-size: 14px; opacity: 0.7;">
                        Please check if the video file exists
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        mainVideo.addEventListener('click', togglePlayPause);
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Video click για εμφάνιση seek bar
        mainVideo.addEventListener('click', () => {
            if (isPlaying) {
                showSeekBar();
            }
        });
        
        // Ad Close Handler
        closeFullscreenAd.addEventListener("click", () => {
            const type = midgameAdShown ? "midgame" : "startup";
            closeFullscreenAdFunc(type);
        });
        
        // Close ad by clicking outside (στο 50% πάνω μέρος)
        fullscreenAd.addEventListener("click", (e) => {
            if (e.clientY < window.innerHeight / 2) {
                const type = midgameAdShown ? "midgame" : "startup";
                closeFullscreenAdFunc(type);
            }
        });
        
        // PAGE VISIBILITY TRACKING
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                videoActive = false;
                stopMidgameAdCountdown();
                
                // Παύση βίντεο αν είναι ενεργό
                if (isPlaying) {
                    mainVideo.pause();
                    isPlaying = false;
                }
            } else {
                videoActive = true;
                // Επανεκκίνηση mid-game countdown μόνο αν το βίντεο παίζει
                if (isPlaying && !midgameAdShown) {
                    startMidgameAdCountdown();
                }
            }
        });
        
        // Keyboard shortcuts για seeking
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    showSeekBar();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(mainVideo.duration, mainVideo.currentTime + 5);
                    showSeekBar();
                    break;
            }
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            updateAdDisplay();
            
            // Απόκρυψη URL
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - Updated with Google AdSense System');
        
        // Track video views for analytics
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - Νίκο πρόσεχε - FmD @FmD699');
        });
    </script>
</body>
</html>
