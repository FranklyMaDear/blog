            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 6px 25px rgba(211, 47, 47, 0.8);

        .play-button::after {
            content: '';

            border-bottom: 20px solid transparent;

        /* ADS CONTAINER - 3 ADS ONLY */
        .ads-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

        @media (max-width: 768px) {

        .ad-box {
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);

            display: flex;
            flex-direction: column;
        }
        
        .ad-box-1 {
            border-color: #4fc3f7;
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.3);
        }
        
        .ad-box-2 {
            border-color: #69f0ae;
            box-shadow: 0 4px 20px rgba(105, 240, 174, 0.3);
        }
        
        .ad-box-3 {
            border-color: #ff9800;
            box-shadow: 0 4px 20px rgba(255, 152, 0, 0.3);
        }
        
        .ad-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 2px solid #444;
        }
        
        .ad-box-1 .ad-title {
            color: #4fc3f7;
        }
        
        .ad-box-2 .ad-title {
            color: #69f0ae;
        }
        
        .ad-box-3 .ad-title {
            color: #ff9800;
        }
        
        .ad-content {
            flex: 1;
            width: 100%;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* FORCE AD DISPLAY */
        .force-ad-display {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .force-ad-display ins {
            width: 100% !important;
            min-height: 180px !important;
        }
        
        /* FALLBACK AD (αν δεν φορτώσει το AdSense) */
        .ad-fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #222 0%, #1a1a1a 100%);
            border: 2px dashed #444;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #888;
            text-align: center;
            padding: 20px;

        .ad-fallback-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #aaa;
        }
        
        .ad-fallback-text {
            font-size: 14px;
            line-height: 1.4;
            max-width: 250px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Έξαλλοι πανηγυρισμοί στα αποδυτήρια των παικτών του Ολυμπιακού μετά την πρόκριση</h1>
    </div>
    
    <div class="main-container">
        <div class="video-section">
            <div class="video-container">
                <div class="video-poster" id="videoPoster">
                    <img src="thumbnail100.png" alt="Έξαλλοι πανηγυρισμοί στα αποδυτήρια των παικτών του Ολυμπιακού μετά την πρόκριση" id="posterImage" crossorigin="anonymous">
                    <button class="play-button" id="playButton" aria-label="Play video"></button>
                </div>
                <video id="mainVideo" playsinline webkit-playsinline controls>
                    <source src="video100.mp4" type="video/mp4">
                    Το πρόγραμμα περιήγησής σας δεν υποστηρίζει βίντεο.
                </video>
            </div>
        </div>
        
        <!-- 3 ΜΟΝΟ ΔΙΑΦΗΜΙΣΕΙΣ -->
        <div class="ads-container">
            <!-- ΔΙΑΦΗΜΙΣΗ 1 -->
            <div class="ad-box ad-box-1">
                <div class="ad-title">🔵 ΔΙΑΦΗΜΙΣΗ 1</div>
                <div class="ad-content">
                    <div class="force-ad-display">
                        <!-- AUTORELAXED AD -->
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-format="autorelaxed"
                             data-ad-client="ca-pub-3186700611266549"

                             (adsbygoogle = window.adsbygoogle || []).push({});
                        </script>
                    </div>
                    <!-- FALLBACK -->

                        <div class="ad-fallback-title">Διαφήμιση</div>
                        <div class="ad-fallback-text">Η διαφήμιση θα εμφανιστεί σύντομα</div>
                    </div>
                </div>
            </div>
            
            <!-- ΔΙΑΦΗΜΙΣΗ 2 -->
            <div class="ad-box ad-box-2">
                <div class="ad-title">🟢 ΔΙΑΦΗΜΙΣΗ 2</div>
                <div class="ad-content">
                    <div class="force-ad-display">
                        <!-- FLUID LAYOUT AD -->
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-format="fluid"
                             data-ad-layout-key="-fb+5w+4e-db+86"
                             data-ad-client="ca-pub-3186700611266549"
                             data-ad-slot="3969235710"></ins>
                        <script>
                             (adsbygoogle = window.adsbygoogle || []).push({});
                        </script>
                    </div>
                    <!-- FALLBACK -->
                    <div class="ad-fallback" id="fallback2" style="display:none;">
                        <div class="ad-fallback-title">Διαφήμιση</div>
                        <div class="ad-fallback-text">Διαφημιστικό περιεχόμενο</div>
                    </div>
                </div>
            </div>
            
            <!-- ΔΙΑΦΗΜΙΣΗ 3 -->
            <div class="ad-box ad-box-3">
                <div class="ad-title">🟠 ΔΙΑΦΗΜΙΣΗ 3</div>
                <div class="ad-content">
                    <div class="force-ad-display">
                        <!-- AUTORELAXED AD 2 -->
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-format="autorelaxed"
                             data-ad-client="ca-pub-3186700611266549"
                             data-ad-slot="9660744817"></ins>
                        <script>
                             (adsbygoogle = window.adsbygoogle || []).push({});
                        </script>
                    </div>
                    <!-- FALLBACK -->
                    <div class="ad-fallback" id="fallback3" style="display:none;">
                        <div class="ad-fallback-title">Διαφήμιση</div>
                        <div class="ad-fallback-text">Εμπορική ανακοίνωση</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const videoPoster = document.getElementById('videoPoster');
            const playButton = document.getElementById('playButton');
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ
            playButton.addEventListener('click', function() {
                video.play().then(() => {
                    videoPoster.classList.add('hidden');
                }).catch(e => {
                    console.log('Video error:', e);
                });
            });
            
            // ΕΙΔΙΚΟΣ ΚΩΔΙΚΑΣ ΓΙΑ ΝΑ ΦΑΙΝΟΝΤΑΙ ΟΙ 3 ΔΙΑΦΗΜΙΣΕΙΣ
            function FORCE_SHOW_ALL_ADS() {
                console.log('=== FORCING ALL 3 ADS TO DISPLAY ===');
                
                // ΒΙΑΙΟ AD LOADING
                const forceLoad = () => {
                    try {
                        // ΑΝΑΓΚΑΣΤΙΚΗ ΦΟΡΤΩΣΗ ΚΑΙ ΕΠΑΝΑΦΟΡΤΩΣΗ
                        if (typeof adsbygoogle !== 'undefined') {
                            // 1η ΠΡΟΣΠΑΘΕΙΑ
                            adsbygoogle.push({});
                            console.log('Ad push 1');
                            
                            // 2η ΠΡΟΣΠΑΘΕΙΑ με 1 δευτερόλεπτο διαφορά
                            setTimeout(() => {
                                adsbygoogle.push({});
                                console.log('Ad push 2');
                            }, 1000);
                            
                            // 3η ΠΡΟΣΠΑΘΕΙΑ με 2 δευτερόλεπτα διαφορά
                            setTimeout(() => {
                                adsbygoogle.push({});
                                console.log('Ad push 3');
                            }, 2000);
                            
                            // 4η ΠΡΟΣΠΑΘΕΙΑ - EXTREME
                            setTimeout(() => {
                                adsbygoogle.push({});
                                console.log('Ad push 4 - EXTREME');
                            }, 3000);
                        }
                    } catch(e) {
                        console.log('Ad load error:', e);
                    }
                };
                
                // ΕΚΤΕΛΕΣΗ
                forceLoad();
                
                // ΕΛΕΓΧΟΣ ΓΙΑ FALLBACK ADS
                setTimeout(() => {
                    const allAds = document.querySelectorAll('ins.adsbygoogle');
                    allAds.forEach((ad, index) => {
                        // ΕΛΕΓΧΟΣ ΕΑΝ Η ΔΙΑΦΗΜΙΣΗ ΕΧΕΙ ΦΟΡΤΩΘΕΙ
                        if (ad.offsetHeight < 50 || ad.innerHTML.trim() === '') {
                            console.log(`Ad ${index + 1} not loaded, showing fallback`);
                            document.getElementById(`fallback${index + 1}`).style.display = 'flex';
                            
                            // ΕΠΙΠΛΕΟΝ ΠΡΟΣΠΑΘΕΙΑ ΓΙΑ ΑΥΤΗ ΤΗ ΔΙΑΦΗΜΙΣΗ
                            setTimeout(() => {
                                try {
                                    if (typeof adsbygoogle !== 'undefined') {
                                        adsbygoogle.push({});
                                    }
                                } catch(e) {}
                            }, 500);
                        } else {
                            console.log(`Ad ${index + 1} loaded successfully (height: ${ad.offsetHeight}px)`);
                            document.getElementById(`fallback${index + 1}`).style.display = 'none';
                        }
                    });
                }, 4000);
                
                // ΤΕΛΙΚΟΣ ΕΛΕΓΧΟΣ
                setTimeout(() => {
                    console.log('=== FINAL AD CHECK ===');
                    const finalCheck = document.querySelectorAll('ins.adsbygoogle');
                    let loadedCount = 0;
                    
                    finalCheck.forEach((ad, index) => {
                        if (ad.offsetHeight > 50) {
                            loadedCount++;
                        }
                    });
                    
                    console.log(`${loadedCount}/3 ads loaded successfully`);
                    
                    // ΑΝ ΦΟΡΤΩΘΟΥΝ ΛΙΓΟΤΕΡΕΣ ΑΠΟ 2, ΚΑΝΕ EXTRA PUSH
                    if (loadedCount < 2) {
                        console.log('TOO FEW ADS, DOING EXTRA PUSHES');
                        for(let i = 0; i < 5; i++) {
                            setTimeout(() => {
                                try {
                                    if (typeof adsbygoogle !== 'undefined') {
                                        adsbygoogle.push({});
                                    }
                                } catch(e) {}
                            }, i * 1000);
                        }
                    }
                }, 6000);
            }
            
            // ΕΚΚΙΝΗΣΗ ΤΟΥ AD SYSTEM
            setTimeout(FORCE_SHOW_ALL_ADS, 1500);
            
            // ΚΑΘΕ 30 ΔΕΥΤΕΡΟΛΕΠΤΑ, ΞΑΝΑΦΟΡΤΩΣΕ ΟΛΕΣ ΤΙΣ ΔΙΑΦΗΜΙΣΕΙΣ
            setInterval(FORCE_SHOW_ALL_ADS, 30000);
            
            // ΚΑΘΕ ΦΟΡΑ ΠΟΥ ΞΕΚΙΝΑΕΙ ΤΟ ΒΙΝΤΕΟ, ΞΑΝΑΦΟΡΤΩΣΕ ΔΙΑΦΗΜΙΣΕΙΣ
            video.addEventListener('play', function() {
                setTimeout(FORCE_SHOW_ALL_ADS, 5000);
            });
            
            // ΚΑΘΕ ΦΟΡΑ ΠΟΥ ΤΕΛΕΙΩΝΕΙ ΤΟ ΒΙΝΤΕΟ, ΞΑΝΑΦΟΡΤΩΣΕ ΔΙΑΦΗΜΙΣΕΙΣ
            video.addEventListener('ended', function() {
                setTimeout(FORCE_SHOW_ALL_ADS, 2000);
            });
            
            // ΚΑΘΕ ΦΟΡΑ ΠΟΥ Ο ΧΡΗΣΤΗΣ ΚΑΝΕΙ CLICK ΣΤΗ ΣΕΛΙΔΑ, ΞΑΝΑΦΟΡΤΩΣΕ
            document.addEventListener('click', function() {
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                        }
                    } catch(e) {}
                }, 300);
            });
        });
    </script>
