<body>
    <div class="header">

    </div>
    
    <div class="main-container">
        <div class="video-section">
            <div class="video-container">
                <!-- ΠΡΩΤΟ ΚΑΔΡΟ ΤΟΥ ΒΙΝΤΕΟ -->
                <img id="firstFrameThumbnail" src="thumbnail100.png" alt="Πρώτο καδρο βίντεο" style="display: none;">
                
                <div class="video-poster" id="videoPoster">
                    <img src="thumbnail100.png" alt="Έξαλλοι πανηγυρισμοί στα αποδυτήρια των παικτών του Ολυμπιακού μετά την πρόκριση" id="posterImage" crossorigin="anonymous">
                    <button class="play-button" id="playButton" aria-label="Play video"></button>
                </div>
                <!-- ΒΙΝΤΕΟ video100.mp4 -->
                <video id="mainVideo" playsinline webkit-playsinline controls poster="thumbnail100.png">
                    <source src="video100.mp4" type="video/mp4">
                    Το πρόγραμμα περιήγησής σας δεν υποστηρίζει βίντεο.
                </video>
            </div>
        </div>
        
        <!-- 4 ΤΕΤΡΑΓΩΝΙΣΜΕΝΕΣ ΜΠΑΡΕΣ ΜΕ ΤΑ SCRIPT ΣΟΥ -->
        <div class="ads-container">
            <!-- ΠΛΑΙΣΙΟ 1 -->
            <div class="ad-box ad-box-1">
                <div class="ad-title">🔵</div>
                <div class="ad-content">
                    <div class="custom-ad-slot" id="adSlot1">
                        <!-- SCRIPT 1: autorelaxed -->
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-format="autorelaxed"
                             data-ad-client="ca-pub-3186700611266549"
                             data-ad-slot="9660744817"></ins>
                    </div>
                </div>
            </div>
            
            <!-- ΠΛΑΙΣΙΟ 2 -->
            <div class="ad-box ad-box-2">
                <div class="ad-title">🟢</div>
                <div class="ad-content">
                    <div class="custom-ad-slot" id="adSlot2">
                        <!-- SCRIPT 2: video -->
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-client="ca-pub-3186700611266549"
                             data-ad-slot="3092455087"
                             data-ad-format="auto"
                             data-full-width-responsive="true"></ins>
                    </div>
                </div>
            </div>
            
            <!-- ΠΛΑΙΣΙΟ 3 -->
            <div class="ad-box ad-box-3">

                             style="display:block; text-align:center;"
                             data-ad-layout="in-article"

                             data-ad-slot="6330498148"></ins>

                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-format="fluid"
                             data-ad-layout-key="-fb+5w+4e-db+86"

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const videoPoster = document.getElementById('videoPoster');
            const playButton = document.getElementById('playButton');
            const firstFrameThumbnail = document.getElementById('firstFrameThumbnail');
            
            // ΑΥΤΟΜΑΤΟ START ΤΟΥ ΒΙΝΤΕΟ
            setTimeout(() => {
                video.play().then(() => {
                    videoPoster.classList.add('hidden');
                    // Σταματάμε το βίντεο μετά από 0.1 δευτερόλεπτα για να πάρουμε το πρώτο καδρο
                    setTimeout(() => {
                        video.pause();
                        video.currentTime = 0;
                        
                        try {
                            // Δημιουργία canvas για πρώτο καδρο
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = video.videoWidth || 1280;
                            canvas.height = video.videoHeight || 720;
                            
                            if (video.videoWidth > 0 && video.videoHeight > 0) {
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                // Εμφάνιση πρώτου καδρου
                                firstFrameThumbnail.src = canvas.toDataURL('image/png');
                                firstFrameThumbnail.style.display = 'block';
                            } else {
                                // Fallback: χρήση του poster image
                                firstFrameThumbnail.src = 'thumbnail100.png';
                                firstFrameThumbnail.style.display = 'block';
                            }
                        } catch (e) {
                            console.log('Canvas error:', e);
                            firstFrameThumbnail.src = 'thumbnail100.png';
                            firstFrameThumbnail.style.display = 'block';
                        }
                        
                    }, 100);
                }).catch(e => {
                    console.log('Auto-play failed:', e);
                    // Fallback: χρήση του poster image
                    firstFrameThumbnail.src = 'thumbnail100.png';
                    firstFrameThumbnail.style.display = 'block';
                });
            }, 1000);
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ
            playButton.addEventListener('click', function() {
                video.play().then(() => {
                    videoPoster.classList.add('hidden');
                    firstFrameThumbnail.style.display = 'none';
                }).catch(e => {
                    console.log('Video error:', e);
                });
            });
            
            video.addEventListener('play', function() {
                firstFrameThumbnail.style.display = 'none';
            });
            
            video.addEventListener('pause', function() {
                if (video.currentTime === 0) {
                    firstFrameThumbnail.style.display = 'block';
                }
            });
            
            // ΦΟΡΤΩΣΗ ΚΑΙ ΕΠΑΝΑΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                console.log('=== LOADING ALL ADS ===');
                
                // ΣΥΛΛΟΓΗ ΟΛΩΝ ΤΩΝ ADS
                const adElements = document.querySelectorAll('.adsbygoogle');
                
                // ΑΝΑΓΚΑΣΤΙΚΗ ΦΟΡΤΩΣΗ
                if (typeof adsbygoogle !== 'undefined') {
                    // 1η ΦΟΡΤΩΣΗ
                    adsbygoogle.push({});
                    console.log('First ad push');
                    
                    // 2η ΦΟΡΤΩΣΗ ΜΕ 1 ΔΕΥΤΕΡΟΛΕΠΤΟ ΔΙΑΦΟΡΑ
                    setTimeout(() => {
                        adsbygoogle.push({});
                        console.log('Second ad push');
                    }, 1000);
                    
                    // 3η ΦΟΡΤΩΣΗ ΜΕ 2 ΔΕΥΤΕΡΟΛΕΠΤΑ ΔΙΑΦΟΡΑ
                    setTimeout(() => {
                        adsbygoogle.push({});
                        console.log('Third ad push');
                    }, 2000);
                    
                    // ΕΛΕΓΧΟΣ ΜΕΤΑ ΑΠΟ 3 ΔΕΥΤΕΡΟΛΕΠΤΑ
                    setTimeout(() => {
                        adElements.forEach((ad, index) => {
                            if (ad.offsetHeight < 50 || ad.innerHTML.trim() === '') {
                                console.log(`Ad ${index + 1} not loaded properly`);
                            } else {
                                console.log(`Ad ${index + 1} loaded (height: ${ad.offsetHeight}px)`);
                            }
                        });
                    }, 3000);
                }
            }
            
            // ΕΚΚΙΝΗΣΗ ΤΩΝ ADS
            setTimeout(LOAD_ALL_ADS, 1500);
            
            // ΑΝΑΝΕΩΣΗ ΚΑΘΕ 30 ΔΕΥΤΕΡΟΛΕΠΤΑ
            setInterval(LOAD_ALL_ADS, 30000);
            
            // ΑΝΑΝΕΩΣΗ ΟΤΑΝ ΞΕΚΙΝΑΕΙ ΤΟ ΒΙΝΤΕΟ
            video.addEventListener('play', function() {
                setTimeout(LOAD_ALL_ADS, 5000);
            });
            
            // ΑΝΑΝΕΩΣΗ ΟΤΑΝ ΤΕΛΕΙΩΝΕΙ ΤΟ ΒΙΝΤΕΟ
            video.addEventListener('ended', function() {
                setTimeout(LOAD_ALL_ADS, 2000);
            });
            
            // ΑΝΑΝΕΩΣΗ ΜΕ CLICK
            document.addEventListener('click', function() {
                setTimeout(() => {
                    if (typeof adsbygoogle !== 'undefined') {
                        adsbygoogle.push({});
                    }
                }, 300);
            });
            
            // TWITTER META TAGS
            const metaTags = [
                {property: 'twitter:image:width', content: '1200'},
                {property: 'twitter:image:height', content: '630'},
                {property: 'twitter:site', content: '@OlympiacosFC'},
                {property: 'twitter:creator', content: '@OlympiacosFC'}
            ];
            
            metaTags.forEach(tag => {
                const meta = document.createElement('meta');
                if (tag.property) meta.setAttribute('property', tag.property);
                meta.content = tag.content;
                document.head.appendChild(meta);
            });
            
            // ΤΕΛΙΚΟ AD PUSH ΜΕΤΑ ΑΠΟ 5 ΔΕΥΤΕΡΟΛΕΠΤΑ
            setTimeout(() => {
                if (typeof adsbygoogle !== 'undefined') {
                    adsbygoogle.push({});
                    console.log('Final ad push');
                }
            }, 5000);
        });
    </script>
