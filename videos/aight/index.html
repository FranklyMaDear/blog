    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const videoPoster = document.getElementById('videoPoster');
            const playButton = document.getElementById('playButton');
            const firstFrameThumbnail = document.getElementById('firstFrameThumbnail');
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΑΥΤΟΜΑΤΟ START ΤΟΥ ΒΙΝΤΕΟ (ΜΕ ΑΣΦΑΛΕΙΑ ΓΙΑ ΚΙΝΗΤΑ)
            setTimeout(() => {
                if (window.innerWidth > 768) { // Αυτόματο play μόνο σε desktop
                    video.play().then(() => {
                        videoPoster.classList.add('hidden');
                        setTimeout(() => {
                            video.pause();
                            video.currentTime = 0;
                            showFirstFrame();
                        }, 100);
                    }).catch(e => {
                        console.log('Auto-play failed, showing poster');
                        showFirstFrame();
                    });
                } else {
                    // Σε κινητά, απλά δείξε το πρώτο καρέ
                    showFirstFrame();
                }
            }, 500);
            
            function showFirstFrame() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Περιμένουμε το βίντεο να είναι έτοιμο
                    if (video.readyState >= 2) {
                        canvas.width = video.videoWidth || 1280;
                        canvas.height = video.videoHeight || 720;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        firstFrameThumbnail.src = canvas.toDataURL('image/png');
                        firstFrameThumbnail.style.display = 'block';
                    } else {
                        // Fallback
                        firstFrameThumbnail.src = 'thumbnail116.png';
                        firstFrameThumbnail.style.display = 'block';
                    }
                } catch (e) {
                    console.log('Error showing first frame:', e);
                    firstFrameThumbnail.src = 'thumbnail116.png';
                    firstFrameThumbnail.style.display = 'block';
                }
            }
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ
            playButton.addEventListener('click', function() {
                video.play().then(() => {
                    videoPoster.classList.add('hidden');
                    firstFrameThumbnail.style.display = 'none';
                    
                    // Σε κινητά, βεβαιώσου ότι το βίντεο είναι ορατό
                    if ('ontouchstart' in window) {
                        video.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }).catch(e => {
                    console.log('Play error:', e);
                    // Fallback για iOS
                    videoPoster.classList.add('hidden');
                    firstFrameThumbnail.style.display = 'none';
                    video.controls = true;
                });
            });
            
            video.addEventListener('play', function() {
                firstFrameThumbnail.style.display = 'none';
                // Κλείσε τα controls μετά από λίγο για καλύτερη εμπειρία
                setTimeout(() => {
                    if (!video.paused) {
                        video.controls = true;
                    }
                }, 3000);
            });
            
            video.addEventListener('pause', function() {
                if (video.currentTime === 0) {
                    firstFrameThumbnail.style.display = 'block';
                }
            });
            
            // ΒΕΛΤΙΩΣΗ ΓΙΑ ΚΙΝΗΤΑ
            video.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    video.controls = true;
                }
            });
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 2000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων με καθυστέρηση για καλύτερη απόδοση
            setTimeout(LOAD_ALL_ADS, 1500);
            setInterval(LOAD_ALL_ADS, 30000);
            
            video.addEventListener('play', () => setTimeout(LOAD_ALL_ADS, 5000));
            video.addEventListener('ended', () => setTimeout(LOAD_ALL_ADS, 2000));
            
            // Βελτίωση απόδοσης για κινητά
            if ('ontouchstart' in window) {
                document.body.classList.add('touch-device');
                
                // Βελτιστοποίηση για χαμηλές ταχύτητες internet
                video.preload = 'auto';
            }
        });
        
        // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
        window.addEventListener('resize', function() {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                window.setTimeout(function() {
                    document.activeElement.scrollIntoView({ block: 'center' });
                }, 0);
            }
        });
    </script>
