    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const streamFrame = document.getElementById('streamFrame');
            const streamLoading = document.getElementById('streamLoading');
            const streamError = document.getElementById('streamError');
            const errorMessage = document.getElementById('errorMessage');
            const retryButton = document.getElementById('retryButton');
            const proxySelector = document.getElementById('proxySelector');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const streamAdOverlay = document.getElementById('streamAdOverlay');
            const closeStreamAdBtn = document.getElementById('closeStreamAdBtn');
            const streamAdContainer = document.getElementById('streamAdContainer');
            
            const TARGET_URL = 'https://www.camel1.live/football/fulham-vs-everton/live/1l4rjnh91xkwm7v';
            
            // Λίστα με διαθέσιμα proxies
            const proxies = {
                '1': 'https://cors-anywhere.herokuapp.com/',
                '2': 'https://api.allorigins.win/raw?url=',
                '3': 'https://thingproxy.freeboard.io/fetch/'
            };
            
            let currentProxy = '1';
            let adTimer;
            let adShown = false;
            let adLoaded = false;
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // ΦΟΡΤΩΣΗ ΤΟΥ STREAM
            function loadStream() {
                streamLoading.classList.remove('hidden');
                streamError.classList.remove('show');
                streamFrame.style.display = 'none';
                
                const proxyUrl = proxies[currentProxy] + encodeURIComponent(TARGET_URL);
                
                // Χρήση iframe με proxy
                streamFrame.src = proxyUrl;
                
                // Κρύψε το loading μετά από 5 δευτερόλεπτα
                setTimeout(() => {
                    streamLoading.classList.add('hidden');
                    streamFrame.style.display = 'block';
                    
                    // Εμφάνιση διαφήμισης μετά από 10 δευτερόλεπτα
                    setTimeout(showStreamAd, 10000);
                    
                }, 5000);
                
                // Έλεγχος για errors
                streamFrame.onload = function() {
                    streamLoading.classList.add('hidden');
                    console.log('Stream loaded successfully');
                };
                
                streamFrame.onerror = function() {
                    streamLoading.classList.add('hidden');
                    showError('Αποτυχία φόρτωσης. Παρακαλώ δοκιμάστε άλλο proxy.');
                };
            }
            
            // ΕΜΦΑΝΙΣΗ ΣΦΑΛΜΑΤΟΣ
            function showError(message) {
                errorMessage.textContent = message;
                streamError.classList.add('show');
            }
            
            // ΑΛΛΑΓΗ PROXY
            proxySelector.addEventListener('change', function(e) {
                currentProxy = e.target.value;
                loadStream();
            });
            
            // ΠΛΗΡΗ ΟΘΟΝΗ
            fullscreenBtn.addEventListener('click', function() {
                const streamContainer = document.querySelector('.stream-container');
                
                if (!document.fullscreenElement) {
                    if (streamContainer.requestFullscreen) {
                        streamContainer.requestFullscreen();
                    } else if (streamContainer.webkitRequestFullscreen) {
                        streamContainer.webkitRequestFullscreen();
                    } else if (streamContainer.msRequestFullscreen) {
                        streamContainer.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            });
            
            // RETRY BUTTON
            retryButton.addEventListener('click', loadStream);
            
            // ΣΥΝΑΡΤΗΣΗ ΕΜΦΑΝΙΣΗΣ ΔΙΑΦΗΜΙΣΗΣ ΣΤΟ STREAM
            function showStreamAd() {
                if (adShown) return;
                
                adShown = true;
                streamAdOverlay.classList.remove('hide');
                streamAdOverlay.classList.add('show');
                
                // Φόρτωση AdSense διαφήμισης
                if (!adLoaded) {
                    loadStreamAd();
                    adLoaded = true;
                }
                
                // Αυτόματο κλείσιμο μετά από 15 δευτερόλεπτα
                adTimer = setTimeout(hideStreamAd, 15000);
            }
            
            // ΦΟΡΤΩΣΗ AD SENSE ΔΙΑΦΗΜΙΣΗΣ
            function loadStreamAd() {
                try {
                    if (typeof adsbygoogle !== 'undefined') {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                        console.log('Stream ad loaded');
                    }
                } catch (e) {
                    console.log('Error loading stream ad:', e);
                }
            }
            
            // ΚΛΕΙΣΙΜΟ ΔΙΑΦΗΜΙΣΗΣ
            function hideStreamAd() {
                streamAdOverlay.classList.remove('show');
                streamAdOverlay.classList.add('hide');
                
                if (adTimer) {
                    clearTimeout(adTimer);
                }
            }
            
            // ΚΛΕΙΣΙΜΟ ΔΙΑΦΗΜΙΣΗΣ ΜΕ ΚΟΥΜΠΙ
            closeStreamAdBtn.addEventListener('click', hideStreamAd);
            
            // ΑΡΧΙΚΗ ΦΟΡΤΩΣΗ
            loadStream();
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 2000);
            setInterval(LOAD_ALL_ADS, 30000);
        });
        
        // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
        window.addEventListener('resize', function() {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                window.setTimeout(function() {
                    document.activeElement.scrollIntoView({ block: 'center' });
                }, 0);
            }
        });
    </script>
