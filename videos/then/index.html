    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            padding: 15px 10px;
            background: linear-gradient(135deg, #111 0%, #d32f2f 100%);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid #ff9800;
        }
        
        .header h1 {
            font-size: clamp(18px, 5vw, 24px);
            color: #fff;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.3;
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        
        /* STREAM CONTAINER */
        .stream-wrapper {
            width: 100%;
            margin-bottom: 25px;
            position: relative;
        }
        
        .stream-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            min-height: 600px;
            border: 3px solid #333;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }
        
        @media (max-width: 768px) {
            .stream-box {
                min-height: 400px;
            }
        }
        
        @media (max-width: 480px) {
            .stream-box {
                min-height: 300px;
            }
        }
        
        /* IFRAME */
        .live-iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        
        /* LOADING */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #333;
            border-top: 5px solid #d32f2f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ERROR */
        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 101;
        }
        
        .error-overlay.show {
            display: flex;
        }
        
        .error-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #ff9800;
        }
        
        .retry-btn {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        
        /* CONTROLS */
        .stream-controls {
            background: #222;
            padding: 15px;
            border-top: 2px solid #444;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-btn {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .control-btn.primary {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            border-color: #1976D2;
        }
        
        /* ADS SECTION */
        .ads-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        @media (max-width: 992px) {
            .ads-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 576px) {
            .ads-container {
                grid-template-columns: 1fr;
            }
        }
        
        .ad-box {
            background: #111;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #333;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .ad-content {
            width: 100%;
            height: 100%;
            min-height: 150px;
        }
        
        /* AD OVERLAY */
        .ad-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 25%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99;
            display: none;
            padding: 15px;
            border-top: 3px solid #ff9800;
        }
        
        .ad-overlay.show {
            display: block;
        }
        
        .close-ad {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #fff;
            color: #000;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔴 Ζωντανή Μετάδοση: Fulham vs Everton</h1>
    </div>
    
    <div class="main-container">
        <div class="stream-wrapper">
            <div class="stream-box">
                <!-- Loading -->
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                    <div style="text-align: center;">
                        <p>Φόρτωση ζωντανής μετάδοσης...</p>
                        <p style="font-size: 14px; color: #aaa; margin-top: 10px;">Μπορεί να χρειαστούν μερικά δευτερόλεπτα</p>
                    </div>
                </div>
                
                <!-- Error -->
                <div class="error-overlay" id="errorOverlay">
                    <div class="error-icon">⚠️</div>
                    <h3>Πρόβλημα φόρτωσης</h3>
                    <p id="errorText">Δεν μπορέσαμε να φορτώσουμε τη ζωντανή ροή.</p>
                    <button class="retry-btn" id="retryBtn">Δοκιμάστε Ξανά</button>
                    <p style="margin-top: 15px; font-size: 14px; color: #aaa;">
                        Εάν το πρόβλημα παραμένει, δοκιμάστε:<br>
                        1. Ανανέωση της σελίδας (F5)<br>
                        2. Διαφορετικό browser
                    </p>
                </div>
                
                <!-- IFRAME CONTAINER -->
                <div class="iframe-container">
                    <iframe 
                        class="live-iframe" 
                        id="liveStream"
                        allow="autoplay; fullscreen; picture-in-picture"
                        allowfullscreen
                        scrolling="no"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"
                        frameborder="0"
                        referrerpolicy="no-referrer"
                    ></iframe>
                </div>
                
                <!-- Ad Overlay -->
                <div class="ad-overlay" id="adOverlay">
                    <button class="close-ad" id="closeAdBtn">×</button>
                    <div class="ad-content">
                        <ins class="adsbygoogle"
                             style="display:block; width:100%; height:100%;"
                             data-ad-client="ca-pub-3186700611266549"
                             data-ad-slot="9660744817"
                             data-ad-format="auto"></ins>
                    </div>
                </div>
                
                <!-- Controls -->
                <div class="stream-controls">
                    <button class="control-btn" id="reloadBtn">🔄 Ανανέωση Ροής</button>
                    <button class="control-btn primary" id="fullscreenBtn">📺 Πλήρης Οθόνη</button>
                    <button class="control-btn" id="hideAdBtn">🚫 Κρύψε Διαφήμιση</button>
                </div>
            </div>
        </div>
        
        <!-- ADS -->
        <div class="ads-container">
            <div class="ad-box">
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"
                         data-ad-format="auto"></ins>
                </div>
            </div>
            
            <div class="ad-box">
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="3092455087"
                         data-ad-format="auto"></ins>
                </div>
            </div>
            
            <div class="ad-box">
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="6330498148"
                         data-ad-format="auto"></ins>
                </div>
            </div>
            
            <div class="ad-box">
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="6330498148"
                         data-ad-format="auto"></ins>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const liveStream = document.getElementById('liveStream');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const errorOverlay = document.getElementById('errorOverlay');
            const errorText = document.getElementById('errorText');
            const retryBtn = document.getElementById('retryBtn');
            const reloadBtn = document.getElementById('reloadBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const hideAdBtn = document.getElementById('hideAdBtn');
            const adOverlay = document.getElementById('adOverlay');
            const closeAdBtn = document.getElementById('closeAdBtn');
            const streamBox = document.querySelector('.stream-box');
            
            let streamLoaded = false;
            let adShown = false;
            let adTimer;
            
            // 1. ΛΟΓΙΚΗ ΤΩΝ PROXIES - ΕΛΕΓΧΟΣ
            const PROXY_METHODS = [
                // Μέθοδος 1: Server-side proxy (πιο σταθερή)
                { 
                    name: 'server-proxy',
                    url: 'proxy.php', // Η διαδρομή του proxy.php στον server σου
                    type: 'direct'
                },
                // Μέθοδος 2: CORS proxy (εφεδρική)
                { 
                    name: 'cors-proxy',
                    url: 'https://api.allorigins.win/get?url=',
                    type: 'json'
                },
                // Μέθοδος 3: Ανάμεσα proxy (εφεδρική)
                { 
                    name: 'mid-proxy',
                    url: 'https://thingproxy.freeboard.io/fetch/',
                    type: 'direct'
                }
            ];
            
            // 2. ΣΥΝΑΡΤΗΣΗ ΦΟΡΤΩΣΗΣ ΡΟΗΣ
            function loadStream() {
                console.log('Loading stream...');
                loadingOverlay.classList.remove('hidden');
                errorOverlay.classList.remove('show');
                streamLoaded = false;
                
                // Προσπάθεια με την πρώτη μέθοδο (server proxy)
                attemptLoad(0);
            }
            
            // 3. ΠΡΟΣΠΑΘΕΙΕΣ ΦΟΡΤΩΣΗΣ
            function attemptLoad(methodIndex) {
                if (methodIndex >= PROXY_METHODS.length) {
                    showError('Δεν βρέθηκε διαθέσιμη μέθοδος φόρτωσης.');
                    return;
                }
                
                const method = PROXY_METHODS[methodIndex];
                console.log(`Trying method ${methodIndex + 1}: ${method.name}`);
                
                const targetUrl = 'https://www.camel1.live/football/fulham-vs-everton/live/1l4rjnh91xkwm7v';
                
                // Διαφορετική λογική για κάθε μέθοδο
                if (method.type === 'direct') {
                    // Απευθείας φόρτωση μέσω proxy
                    const finalUrl = method.url + encodeURIComponent(targetUrl);
                    liveStream.src = finalUrl;
                    
                    // Set timeout για error
                    const timeout = setTimeout(() => {
                        if (!streamLoaded) {
                            console.log(`Method ${method.name} timeout, trying next...`);
                            attemptLoad(methodIndex + 1);
                        }
                    }, 8000);
                    
                    // On load success
                    liveStream.onload = function() {
                        clearTimeout(timeout);
                        streamLoaded = true;
                        loadingOverlay.classList.add('hidden');
                        console.log(`Stream loaded successfully via ${method.name}`);
                        
                        // Εμφάνιση διαφήμισης μετά από 5 δευτερόλεπτα
                        setTimeout(showAdOverlay, 5000);
                    };
                    
                    // On error
                    liveStream.onerror = function() {
                        clearTimeout(timeout);
                        console.log(`Method ${method.name} failed`);
                        attemptLoad(methodIndex + 1);
                    };
                    
                } else if (method.type === 'json') {
                    // Για JSON APIs όπως το allorigins
                    fetch(method.url + encodeURIComponent(targetUrl))
                        .then(response => response.json())
                        .then(data => {
                            if (data.contents) {
                                // Δημιουργία blob για να φορτωθεί στο iframe
                                const blob = new Blob([data.contents], { type: 'text/html' });
                                const url = URL.createObjectURL(blob);
                                liveStream.src = url;
                                streamLoaded = true;
                                loadingOverlay.classList.add('hidden');
                                setTimeout(showAdOverlay, 5000);
                            } else {
                                throw new Error('No content received');
                            }
                        })
                        .catch(error => {
                            console.log(`Method ${method.name} failed:`, error);
                            attemptLoad(methodIndex + 1);
                        });
                }
            }
            
            // 4. ΕΜΦΑΝΙΣΗ ΣΦΑΛΜΑΤΟΣ
            function showError(message) {
                errorText.textContent = message;
                loadingOverlay.classList.add('hidden');
                errorOverlay.classList.add('show');
            }
            
            // 5. ΕΜΦΑΝΙΣΗ ΔΙΑΦΗΜΙΣΗΣ
            function showAdOverlay() {
                if (!adShown) {
                    adShown = true;
                    adOverlay.classList.add('show');
                    
                    // Φόρτωση AdSense
                    if (typeof adsbygoogle !== 'undefined') {
                        try {
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        } catch(e) {
                            console.log('AdSense error:', e);
                        }
                    }
                    
                    // Αυτόματο κλείσιμο μετά από 15 δευτερόλεπτα
                    adTimer = setTimeout(hideAdOverlay, 15000);
                }
            }
            
            // 6. ΚΛΕΙΣΙΜΟ ΔΙΑΦΗΜΙΣΗΣ
            function hideAdOverlay() {
                adOverlay.classList.remove('show');
                if (adTimer) clearTimeout(adTimer);
            }
            
            // 7. EVENT LISTENERS
            retryBtn.addEventListener('click', loadStream);
            reloadBtn.addEventListener('click', loadStream);
            
            hideAdBtn.addEventListener('click', hideAdOverlay);
            closeAdBtn.addEventListener('click', hideAdOverlay);
            
            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    if (streamBox.requestFullscreen) {
                        streamBox.requestFullscreen();
                    } else if (streamBox.webkitRequestFullscreen) {
                        streamBox.webkitRequestFullscreen();
                    } else if (streamBox.msRequestFullscreen) {
                        streamBox.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            });
            
            // 8. ΑΥΤΟΜΑΤΗ ΑΝΑΝΕΩΣΗ ΚΑΘΕ 2 ΛΕΠΤΑ
            setInterval(() => {
                if (streamLoaded && !document.hidden) {
                    liveStream.contentWindow.location.reload();
                }
            }, 120000);
            
            // 9. ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function loadAds() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // 10. ΕΚΚΙΝΗΣΗ
            loadStream();
            setTimeout(loadAds, 2000);
            setInterval(loadAds, 30000);
            
            // 11. DETECT PAGE VISIBILITY
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && streamLoaded) {
                    liveStream.contentWindow.location.reload();
                }
            });
        });
    </script>
    
    <script>
        // ΒΟΗΘΗΤΙΚΟ: Διαχείριση zoom σε iOS
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
