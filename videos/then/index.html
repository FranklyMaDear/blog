    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const videoPoster = document.getElementById('videoPoster');
            const playButton = document.getElementById('playButton');
            const floatingAd = document.getElementById('floatingAd');
            const closeAdBtn = document.getElementById('closeAdBtn');
            
            let adTimer;
            let adShown = false;
            
            // ΑΠΟΤΡΟΠΗ ZOOM ΣΕ IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Προετοιμασία του βίντεο
            setTimeout(() => {
                video.load();
            }, 100);
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ - ΚΥΡΙΟ PLAY BUTTON
            playButton.addEventListener('click', function() {
                playVideo();
            });
            
            // Εναλλακτικός τρόπος play - κλικ στο poster
            videoPoster.addEventListener('click', function(e) {
                if (e.target !== playButton) {
                    playVideo();
                }
            });
            
            function playVideo() {
                // Απόκρυψη poster
                videoPoster.classList.add('hidden');
                
                // Προσπάθεια play
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('Video playing successfully');
                        
                        // Σε κινητά, βεβαιώσου ότι το βίντεο είναι ορατό
                        if ('ontouchstart' in window) {
                            setTimeout(() => {
                                video.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 300);
                        }
                        
                        // Εμφάνιση διαφήμισης μετά από 3 δευτερόλεπτα
                        setTimeout(showFloatingAd, 3000);
                        
                    }).catch(e => {
                        console.log('Play error:', e);
                        
                        // Αν αποτύχει λόγω αυστηρών περιορισμών, δοκίμασε με mute πρώτα
                        if (e.name === 'NotAllowedError') {
                            video.muted = true;
                            video.play().then(() => {
                                console.log('Video playing with mute');
                                // Ενεργοποίηση ήχου μετά από λίγο
                                setTimeout(() => {
                                    video.muted = false;
                                }, 1000);
                                
                                // Εμφάνιση διαφήμισης μετά από 3 δευτερόλεπτα
                                setTimeout(showFloatingAd, 3000);
                                
                            }).catch(e2 => {
                                console.log('Second play attempt failed:', e2);
                                // Εμφάνιση ελέγχων για χειροκίνητο play
                                video.controls = true;
                            });
                        } else {
                            // Για άλλα errors, εμφάνιση controls
                            video.controls = true;
                        }
                    });
                }
            }
            
            // ΣΥΝΑΡΤΗΣΗ ΕΜΦΑΝΙΣΗΣ ΔΙΑΦΗΜΙΣΗΣ
            function showFloatingAd() {
                // Ελέγχουμε αν η διαφήμιση έχει ήδη εμφανιστεί
                if (adShown) return;
                
                adShown = true;
                
                // Εμφανίζουμε την διαφήμιση
                floatingAd.classList.remove('hide');
                floatingAd.classList.add('show');
                
                // Εκκίνηση AdSense διαφήμισης
                loadFloatingAd();
                
                // Αυτόματο κλείσιμο μετά από 10 δευτερόλεπτα
                adTimer = setTimeout(hideFloatingAd, 10000);
                
                // Αποθήκευση στο localStorage ότι εμφανίστηκε για αυτή τη συνεδρία
                try {
                    sessionStorage.setItem('adShown', 'true');
                } catch (e) {
                    console.log('Session storage error:', e);
                }
            }
            
            // ΣΥΝΑΡΤΗΣΗ ΦΟΡΤΩΣΗΣ AD SENSE ΔΙΑΦΗΜΙΣΗΣ
            function loadFloatingAd() {
                try {
                    if (typeof adsbygoogle !== 'undefined') {
                        // Εκκίνηση AdSense για την floating διαφήμιση
                        (adsbygoogle = window.adsbygoogle || []).push({});
                        console.log('Floating ad loaded');
                    } else {
                        console.log('AdSense not loaded yet');
                        // Αν το AdSense δεν έχει φορτωθεί, προσπάθησε ξανά μετά από λίγο
                        setTimeout(loadFloatingAd, 1000);
                    }
                } catch (e) {
                    console.log('Error loading floating ad:', e);
                }
            }
            
            // ΣΥΝΑΡΤΗΣΗ ΚΛΕΙΣΙΜΟΥ ΔΙΑΦΗΜΙΣΗΣ
            function hideFloatingAd() {
                floatingAd.classList.remove('show');
                floatingAd.classList.add('hide');
                
                // Καθαρισμός timer
                if (adTimer) {
                    clearTimeout(adTimer);
                }
            }
            
            // ΚΛΕΙΣΙΜΟ ΔΙΑΦΗΜΙΣΗΣ ΜΕ ΚΟΥΜΠΙ
            closeAdBtn.addEventListener('click', hideFloatingAd);
            
            // Ενεργοποίηση controls μετά από λίγο που παίζει το βίντεο
            video.addEventListener('play', function() {
                setTimeout(() => {
                    if (!video.paused) {
                        video.controls = true;
                    }
                }, 2000);
            });
            
            // Όταν τελειώσει το βίντεο
            video.addEventListener('ended', function() {
                video.controls = false;
                video.currentTime = 0;
                videoPoster.classList.remove('hidden');
                
                // Εμφάνιση διαφήμισης και στο τέλος του βίντεο (μόνο αν δεν έχει ήδη εμφανιστεί)
                if (!adShown) {
                    setTimeout(showFloatingAd, 1000);
                }
            });
            
            // Επανεμφάνιση poster όταν το βίντεο είναι paused στο πρώτο frame
            video.addEventListener('pause', function() {
                if (video.currentTime === 0) {
                    videoPoster.classList.remove('hidden');
                }
            });
            
            // ΦΟΡΤΩΣΗ ΔΙΑΦΗΜΙΣΕΩΝ
            function LOAD_ALL_ADS() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 1000);
                        setTimeout(() => {
                            try { adsbygoogle.push({}); } catch(e) {}
                        }, 2000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Φόρτωση διαφημίσεων
            setTimeout(LOAD_ALL_ADS, 1500);
            setInterval(LOAD_ALL_ADS, 30000);
            
            video.addEventListener('play', () => setTimeout(LOAD_ALL_ADS, 5000));
            video.addEventListener('ended', () => setTimeout(LOAD_ALL_ADS, 2000));
            
            // Βελτιστοποίηση για κινητά
            if ('ontouchstart' in window) {
                video.preload = 'auto';
            }
            
            // Ελέγχουμε αν η διαφήμιση έχει ήδη εμφανιστεί σε αυτή τη συνεδρία
            try {
                if (sessionStorage.getItem('adShown') === 'true') {
                    adShown = true;
                }
            } catch (e) {
                console.log('Session storage check error:', e);
            }
        });
        
        // Αποτροπή αναδιάταξη λόγω πληκτρολογίου σε iOS
        window.addEventListener('resize', function() {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                window.setTimeout(function() {
                    document.activeElement.scrollIntoView({ block: 'center' });
                }, 0);
            }
        });
    </script>
