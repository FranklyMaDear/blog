    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* HEADER */
        .header {
            background: linear-gradient(135deg, #111 0%, #d32f2f 100%);
            padding: 15px;
            text-align: center;
            border-bottom: 3px solid #ff9800;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(211, 47, 47, 0.4);
        }
        
        .header h1 {
            font-size: clamp(18px, 5vw, 24px);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.3;
            font-weight: 700;
        }
        
        /* MAIN CONTAINER */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        
        /* STREAM SECTION */
        .stream-section {
            width: 100%;
            margin-bottom: 25px;
        }
        
        .stream-container {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #333;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
            min-height: 600px;
            position: relative;
        }
        
        @media (max-width: 768px) {
            .stream-container {
                min-height: 400px;
            }
        }
        
        @media (max-width: 480px) {
            .stream-container {
                min-height: 300px;
            }
        }
        
        /* IFRAME */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Ratio */
            height: 0;
            overflow: hidden;
        }
        
        .stream-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        
        /* LOADING */
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .loading.hidden {
            display: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #d32f2f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ERROR */
        .error {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 11;
        }
        
        .error.show {
            display: flex;
        }
        
        .error-btn {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        
        /* CONTROLS */
        .controls {
            background: #222;
            padding: 15px;
            border-top: 2px solid #444;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn.primary {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            border-color: #1976D2;
        }
        
        /* ADS OVERLAY */
        .ad-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 25%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9;
            display: none;
            border-top: 3px solid #ff9800;
            padding: 15px;
        }
        
        .ad-overlay.show {
            display: block;
        }
        
        .close-ad {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #fff;
            color: #000;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }
        
        /* ADS GRID */
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        @media (max-width: 992px) {
            .ads-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 576px) {
            .ads-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .ad-unit {
            background: #111;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #333;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

<body>
    <div class="header">
        <h1>🔴 Ζωντανή Μετάδοση: Fulham vs Everton</h1>
    </div>
    
    <div class="main-container">
        <!-- ΖΩΝΤΑΝΗ ΡΟΗ -->
        <div class="stream-section">
            <div class="stream-container">
                <!-- Loading -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px;">Φόρτωση ζωντανής μετάδοσης...</p>
                </div>
                
                <!-- Error -->
                <div class="error" id="error">
                    <div style="font-size: 48px; margin-bottom: 15px;">⚠️</div>
                    <h3>Πρόβλημα φόρτωσης</h3>
                    <p id="errorMsg">Δοκιμάστε ξανά ή ανανεώστε τη σελίδα</p>
                    <button class="error-btn" id="retryBtn">Δοκιμάστε Ξανά</button>
                </div>
                
                <!-- Stream Iframe -->
                <div class="iframe-wrapper">
                    <iframe 
                        class="stream-iframe" 
                        id="streamFrame"
                        allow="autoplay; fullscreen; picture-in-picture"
                        allowfullscreen
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                        referrerpolicy="no-referrer"
                    ></iframe>
                </div>
                
                <!-- Ad Overlay -->
                <div class="ad-overlay" id="adOverlay">
                    <button class="close-ad" id="closeAdBtn">×</button>
                    <ins class="adsbygoogle"
                         style="display:block; width:100%; height:100%;"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"
                         data-ad-format="auto"></ins>
                </div>
                
                <!-- Controls -->
                <div class="controls">
                    <button class="btn" id="reloadBtn">🔄 Ανανέωση</button>
                    <button class="btn primary" id="fullscreenBtn">📺 Πλήρης Οθόνη</button>
                    <button class="btn" id="toggleAdBtn">🚫 Κρύψε Διαφήμιση</button>
                </div>
            </div>
        </div>
        
        <!-- ΔΙΑΦΗΜΙΣΕΙΣ -->
        <div class="ads-grid">
            <div class="ad-unit">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="9660744817"
                     data-ad-format="auto"></ins>
            </div>
            
            <div class="ad-unit">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="3092455087"
                     data-ad-format="auto"></ins>
            </div>
            
            <div class="ad-unit">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="6330498148"
                     data-ad-format="auto"></ins>
            </div>
            
            <div class="ad-unit">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="6330498148"
                     data-ad-format="auto"></ins>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Στοιχεία DOM
            const streamFrame = document.getElementById('streamFrame');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const errorMsg = document.getElementById('errorMsg');
            const retryBtn = document.getElementById('retryBtn');
            const reloadBtn = document.getElementById('reloadBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const toggleAdBtn = document.getElementById('toggleAdBtn');
            const adOverlay = document.getElementById('adOverlay');
            const closeAdBtn = document.getElementById('closeAdBtn');
            const streamContainer = document.querySelector('.stream-container');
            
            // Κατάσταση
            let streamLoaded = false;
            let adShown = false;
            let adTimer;
            
            // 1. ΣΥΝΑΡΤΗΣΗ ΦΟΡΤΩΣΗΣ ΡΟΗΣ
            function loadStream() {
                console.log('Loading stream via proxy.php...');
                
                // Εμφάνιση loading
                loading.classList.remove('hidden');
                error.classList.remove('show');
                streamLoaded = false;
                
                // Χρήση του proxy.php στον ίδιο φάκελο
                const proxyUrl = 'proxy.php';
                
                // Φόρτωση στο iframe
                streamFrame.src = proxyUrl;
                
                // Timeout για error
                const timeout = setTimeout(() => {
                    if (!streamLoaded) {
                        showError('Παρατεταμένη φόρτωση. Δοκιμάστε ξανά.');
                    }
                }, 10000);
                
                // On load success
                streamFrame.onload = function() {
                    clearTimeout(timeout);
                    streamLoaded = true;
                    loading.classList.add('hidden');
                    console.log('Stream loaded successfully!');
                    
                    // Εμφάνιση διαφήμισης μετά από 5 δευτερόλεπτα
                    setTimeout(showAd, 5000);
                };
                
                // On error
                streamFrame.onerror = function() {
                    clearTimeout(timeout);
                    showError('Σφάλμα φόρτωσης. Ελέγξτε το proxy.php.');
                };
            }
            
            // 2. ΕΜΦΑΝΙΣΗ ΣΦΑΛΜΑΤΟΣ
            function showError(message) {
                errorMsg.textContent = message;
                loading.classList.add('hidden');
                error.classList.add('show');
            }
            
            // 3. ΕΜΦΑΝΙΣΗ ΔΙΑΦΗΜΙΣΗΣ
            function showAd() {
                if (!adShown && streamLoaded) {
                    adShown = true;
                    adOverlay.classList.add('show');
                    
                    // Φόρτωση AdSense
                    loadAdSense();
                    
                    // Αυτόματο κλείσιμο μετά από 15 δευτερόλεπτα
                    adTimer = setTimeout(hideAd, 15000);
                }
            }
            
            // 4. ΚΡΥΨΙΜΟ ΔΙΑΦΗΜΙΣΗΣ
            function hideAd() {
                adOverlay.classList.remove('show');
                if (adTimer) clearTimeout(adTimer);
            }
            
            // 5. ΦΟΡΤΩΣΗ ADSENSE
            function loadAdSense() {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch(e) {
                        console.log('AdSense error:', e);
                    }
                }
            }
            
            // 6. EVENT LISTENERS
            retryBtn.addEventListener('click', loadStream);
            reloadBtn.addEventListener('click', loadStream);
            
            toggleAdBtn.addEventListener('click', function() {
                if (adOverlay.classList.contains('show')) {
                    hideAd();
                    toggleAdBtn.textContent = '👁️ Εμφάνιση Διαφήμισης';
                } else {
                    showAd();
                    toggleAdBtn.textContent = '🚫 Κρύψε Διαφήμιση';
                }
            });
            
            closeAdBtn.addEventListener('click', hideAd);
            
            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    if (streamContainer.requestFullscreen) {
                        streamContainer.requestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });
            
            // 7. ΑΥΤΟΜΑΤΗ ΑΝΑΝΕΩΣΗ ΚΑΘΕ 3 ΛΕΠΤΑ
            setInterval(function() {
                if (streamLoaded && !document.hidden) {
                    console.log('Auto-refreshing stream...');
                    streamFrame.src = streamFrame.src;
                }
            }, 180000);
            
            // 8. ΑΡΧΙΚΗ ΦΟΡΤΩΣΗ
            loadStream();
            
            // 9. ΦΟΡΤΩΣΗ ΟΛΩΝ ΤΩΝ ΔΙΑΦΗΜΙΣΕΩΝ
            setTimeout(loadAdSense, 2000);
            setInterval(loadAdSense, 30000);
            
            // 10. DETECT PAGE VISIBILITY
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && streamLoaded) {
                    // Ανανέωση όταν επιστρέφει ο χρήστης
                    streamFrame.src = streamFrame.src;
                }
            });
            
            // 11. PREVENT ZOOM ON IOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) event.preventDefault();
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) event.preventDefault();
                lastTouchEnd = now;
            }, false);
        });
    </script>
</body>
