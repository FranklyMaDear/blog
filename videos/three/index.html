    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* Hide URL bar on mobile */
        @media (max-width: 768px) {
            body {
                height: 100vh;
                overflow: hidden;
            }
        }
        
        /* CENTER AD OVERLAY */
        .center-ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.98);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .ad-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        
        .close-ad-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: all 0.3s;
        }
        
        .close-ad-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            transform: rotate(90deg);
        }
        
        /* MAIN VIDEO CONTAINER */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .video-container.active {
            opacity: 1;
        }
        
        /* VIDEO */
        #mainVideo {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            background: #000;
            cursor: pointer;
        }
        
        /* Play button overlay on video */
        .video-play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(128, 128, 128, 0.7);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .video-play-overlay:hover {
            background: rgba(128, 128, 128, 0.9);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .video-play-overlay::after {
            content: '▶';
            color: white;
            font-size: 32px;
            margin-left: 5px;
            font-weight: bold;
        }
        
        /* Loading spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #1d9bf0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 6;
            display: none;
        }
        
        /* Video controls */
        .video-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }
        
        .video-controls.visible {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .ad-container {
                height: 400px;
                max-width: 90%;
            }
            
            .video-play-overlay {
                width: 70px;
                height: 70px;
            }
            
            .video-play-overlay::after {
                font-size: 28px;
            }
            
            .video-controls {
                bottom: 15px;
                padding: 8px 15px;
                gap: 10px;
            }
            
            .control-btn {
                font-size: 18px;
            }
            
            .time-display {
                font-size: 12px;
            }
            
            .close-ad-btn {
                width: 35px;
                height: 35px;
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .ad-container {
                height: 300px;
                max-width: 95%;
            }
            
            .video-play-overlay {
                width: 60px;
                height: 60px;
            }
            
            .video-play-overlay::after {
                font-size: 24px;
            }
            
            .video-controls {
                bottom: 10px;
                padding: 6px 12px;
                gap: 8px;
            }
            
            .control-btn {
                font-size: 16px;
            }
            
            .time-display {
                font-size: 11px;
            }
            
            .close-ad-btn {
                width: 30px;
                height: 30px;
                font-size: 18px;
            }
        }
    </style>
    
    <!-- JavaScript για απόκρυψη URL -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                document.body.style.height = window.innerHeight + 'px';
                
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });
    </script>
</head>
<body>
    <!-- CENTER AD OVERLAY - ENGLISH ONLY -->
    <div class="center-ad-overlay" id="centerAdOverlay">
        <div class="ad-container">
            <!-- AdSense Ad -->
            <ins class="adsbygoogle"
                 style="display:block; width:100%; height:100%;"
                 data-ad-layout="in-article"
                 data-ad-format="fluid"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="6330498148"></ins>
        </div>
        <button class="close-ad-btn" id="closeAdBtn">×</button>
    </div>

    <!-- MAIN VIDEO CONTAINER -->
    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- Play button overlay -->
        <div class="video-play-overlay" id="videoPlayOverlay"></div>
        
        <!-- Main video -->
        <video id="mainVideo" preload="none" playsinline>
            <source src="https://blog.franklymadear.com/videos/three/video99.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Video Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔇</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const centerAdOverlay = document.getElementById('centerAdOverlay');
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const closeAdBtn = document.getElementById('closeAdBtn');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoActive = false;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let adsenseAdLoaded = false;
        let adClosed = false;
        
        // Load AdSense ad
        function loadAdsenseAd() {
            if (!adsenseAdLoaded) {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log("AdSense ad loaded in center overlay");
                    adsenseAdLoaded = true;
                    
                    // Auto close ad after 10 seconds
                    setTimeout(() => {
                        if (!adClosed) {
                            startVideo();
                        }
                    }, 10000);
                    
                } catch (e) {
                    console.log("AdSense load error:", e);
                }
            }
        }
        
        // Start video
        function startVideo() {
            if (videoStarted) return;
            
            console.log('Starting video');
            videoStarted = true;
            adClosed = true;
            
            // Hide the ad overlay
            centerAdOverlay.style.opacity = '0';
            centerAdOverlay.style.pointerEvents = 'none';
            
            // Show video container
            setTimeout(() => {
                videoContainer.classList.add('active');
                
                // Start loading and playing the video
                mainVideo.load();
                
                mainVideo.play().then(() => {
                    console.log('Video playback started successfully');
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    
                    if (isMuted) {
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }
                    
                    showControls();
                    
                }).catch(e => {
                    console.error('Video play failed:', e);
                    // Try with muted as fallback
                    mainVideo.muted = true;
                    mainVideo.play().then(() => {
                        console.log('Video started with muted fallback');
                        isPlaying = true;
                        videoActive = true;
                        playPauseBtn.textContent = '⏸️';
                        muteBtn.textContent = '🔇';
                        showControls();
                    });
                });
                
            }, 500);
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
        });
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
            playPauseBtn.textContent = '▶️';
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            
            // Show error message in center
            centerAdOverlay.style.opacity = '1';
            centerAdOverlay.style.pointerEvents = 'auto';
            centerAdOverlay.innerHTML = `
                <div class="ad-container" style="display: flex; align-items: center; justify-content: center; background: #222;">
                    <div style="text-align: center; padding: 30px; color: white;">
                        <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                        <div style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Video Error</div>
                        <div style="font-size: 16px; margin-bottom: 20px; opacity: 0.9;">
                            Cannot load video
                        </div>
                        <button onclick="location.reload()" style="background: #1d9bf0; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer;">
                            Reload Page
                        </button>
                    </div>
                </div>
                <button class="close-ad-btn" onclick="location.reload()">×</button>
            `;
        });
        
        // Click handlers
        closeAdBtn.addEventListener('click', startVideo);
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', togglePlayPause);
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Show controls on mouse move
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying) {
                showControls();
            }
        });
        
        // Auto play video if user clicks anywhere on the ad container
        centerAdOverlay.addEventListener('click', (e) => {
            if (e.target === centerAdOverlay || e.target.classList.contains('ad-container')) {
                startVideo();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            // Load AdSense ad after page loads
            setTimeout(loadAdsenseAd, 500);
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - Center English Ad Only');
        
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - Exclusive Video');
        });
    </script>
</body>
