        #mainVideo {

        .video-play-overlay {

        .video-play-overlay:hover {

            transform: translate(-50%, -50%) scale(1.1);

        .video-play-overlay::after {

        .video-play-overlay.hidden {

        .loading-spinner {

        .video-controls {
            position: absolute;

            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            opacity: 0;

            z-index: 20;
            min-width: 300px;

        .video-controls.visible {

        .control-btn {

        @keyframes spin {

        @keyframes fadeIn {

        /* MOBILE OPTIMIZATIONS */

    <!-- GOOGLE ADSENSE GLOBAL SCRIPT - ΧΡΗΣΙΜΟΠΟΙΩ ΤΟ ΙΔΙΟ SCRIPT ΠΟΥ ΜΟΥ ΣΤΕΙΛΕΣ -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"

    <script>
        // DOM Elements
        const floatingAd1 = document.getElementById('floatingAd1');
        const floatingAd2 = document.getElementById('floatingAd2');
        const adClose1 = document.getElementById('adClose1');
        const adClose2 = document.getElementById('adClose2');
        
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        
        // AD SYSTEM STATE
        let isAd1Showing = false;
        let isAd2Showing = false;
        let adRotationInterval;
        let videoStartTime = 0;
        
        // ΠΛΑΝΟ ΔΙΑΦΗΜΙΣΕΩΝ
        const adPlan = {
            // ΧΡΟΝΟΔΙΑΓΡΑΜΜΑ ΕΜΦΑΝΙΣΗΣ
            schedule: [
                { time: 15, ad: 'ad1' },    // 15 δευτερόλεπτα: Ad 1
                { time: 30, ad: 'ad2' },    // 30 δευτερόλεπτα: Ad 2
                { time: 45, ad: 'ad1' },    // 45 δευτερόλεπτα: Ad 1
                { time: 60, ad: 'ad2' },    // 60 δευτερόλεπτα: Ad 2
                { time: 75, ad: 'ad1' },    // 75 δευτερόλεπτα: Ad 1
                { time: 90, ad: 'ad2' }     // 90 δευτερόλεπτα: Ad 2
            ],
            duration: 10,           // Διάρκεια κάθε διαφήμισης
            interval: 15,           // Χρόνος μεταξύ διαφημίσεων
            videoReloadTime: 120    // Επαναφορά βίντεο κάθε 2 λεπτά
        };

        // ================== AD SYSTEM FUNCTIONS ==================
        
        function startVideo() {
            console.log('🎬 Starting video...');
            videoPlayOverlay.classList.add('hidden');
            
            mainVideo.play().then(() => {
                console.log('✅ Video started playing');
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
                showControls();
                videoStarted = true;
                videoStartTime = Date.now();
                
                // Start ad system
                startAdSystem();
                
                // Start video reload timer
                startVideoReloadTimer();
                
            }).catch(e => {
                console.error('❌ Video play failed:', e);
                setTimeout(() => {
                    mainVideo.play();
                }, 1000);
            });
        }
        
        function startAdSystem() {
            console.log('📢 Starting ad system...');
            console.log('📋 Ad Plan:');
            console.log(`   - Duration: ${adPlan.duration} seconds`);
            console.log(`   - Interval: ${adPlan.interval} seconds`);
            console.log(`   - Video reload: ${adPlan.videoReloadTime} seconds`);
            
            // Schedule ads based on plan
            adPlan.schedule.forEach(item => {
                setTimeout(() => {
                    showAd(item.ad);
                }, item.time * 1000);
            });
            
            // Set up continuous rotation
            const totalScheduleTime = adPlan.schedule[adPlan.schedule.length - 1].time;
            adRotationInterval = setInterval(() => {
                // After the schedule ends, rotate ads every interval
                const randomAd = Math.random() > 0.5 ? 'ad1' : 'ad2';
                showAd(randomAd);
            }, (totalScheduleTime + adPlan.duration) * 1000);
        }
        
        function showAd(adId) {
            // Don't show if another ad is already showing
            if (isAd1Showing || isAd2Showing) return;
            
            console.log(`📢 Showing ${adId}...`);
            
            if (adId === 'ad1') {
                isAd1Showing = true;
                floatingAd1.classList.remove('hidden');
                floatingAd1.classList.add('visible');
                
                // Auto-hide after duration
                setTimeout(() => {
                    hideAd('ad1');
                }, adPlan.duration * 1000);
                
            } else if (adId === 'ad2') {
                isAd2Showing = true;
                floatingAd2.classList.remove('hidden');
                floatingAd2.classList.add('visible');
                
                // Auto-hide after duration
                setTimeout(() => {
                    hideAd('ad2');
                }, adPlan.duration * 1000);
            }
        }
        
        function hideAd(adId) {
            console.log(`📢 Hiding ${adId}...`);
            
            if (adId === 'ad1') {
                isAd1Showing = false;
                floatingAd1.classList.remove('visible');
                floatingAd1.classList.add('hidden');
            } else if (adId === 'ad2') {
                isAd2Showing = false;
                floatingAd2.classList.remove('visible');
                floatingAd2.classList.add('hidden');
            }
            
            // Reset hidden state after animation
            setTimeout(() => {
                if (adId === 'ad1') {
                    floatingAd1.classList.remove('hidden');
                } else {
                    floatingAd2.classList.remove('hidden');
                }
            }, 500);
        }
        
        function startVideoReloadTimer() {
            console.log(`⏰ Video will reload in ${adPlan.videoReloadTime} seconds`);
            
            setTimeout(() => {
                console.log('🔄 Reloading video...');
                reloadVideo();
            }, adPlan.videoReloadTime * 1000);
        }
        
        function reloadVideo() {
            // Pause video and reset
            mainVideo.pause();
            mainVideo.currentTime = 0;
            
            // Hide any showing ads
            if (isAd1Showing) hideAd('ad1');
            if (isAd2Showing) hideAd('ad2');
            
            // Reset state
            videoStarted = false;
            isPlaying = false;
            playPauseBtn.textContent = '▶️';
            
            // Clear intervals
            clearInterval(adRotationInterval);
            
            // Restart video
            setTimeout(() => {
                startVideo();
            }, 1000);
        }
        
        // ================== VIDEO SYSTEM FUNCTIONS ==================
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
        }
        
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isAd1Showing && !isAd2Showing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    videoPlayOverlay.classList.add('hidden');
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        // ================== EVENT LISTENERS ==================
        
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            
            // Start video immediately
            startVideo();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('waiting', () => {
