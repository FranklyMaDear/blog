<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ο γιος σου μου Χρωστάει 350€</title>
    
    <!-- Facebook Open Graph Meta Tags -->
    <meta property="og:title" content="Ο γιος σου μου Χρωστάει 350€">
    <meta property="og:description" content="Δείτε το βίντεο με όλες τις λεπτομέρειες">
    <meta property="og:image" content="https://yoursite.com/thumbnail99.png">
    <meta property="og:url" content="https://yoursite.com/index.html">
    <meta property="og:type" content="video.movie">
    <meta property="og:video" content="https://yoursite.com/video99.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="1280">
    <meta property="og:video:height" content="720">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Ο γιος σου μου Χρωστάει 350€">
    <meta name="twitter:description" content="Δείτε το βίντεο με όλες τις λεπτομέρειες">
    <meta name="twitter:image" content="https://yoursite.com/thumbnail99.png">
    <meta name="twitter:player" content="https://yoursite.com/index.html">
    <meta name="twitter:player:width" content="1280">
    <meta name="twitter:player:height" content="720">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="thumbnail99.png">
    <link rel="apple-touch-icon" href="thumbnail99.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            background-color: #111;
            border-bottom: 2px solid #d32f2f;
        }
        
        .header h1 {
            font-size: 24px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.3;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 80px);
        }
        
        @media (min-width: 1024px) {
            .container {
                flex-direction: row;
                padding: 30px;
                gap: 30px;
                height: calc(100vh - 80px);
            }
        }
        
        .video-container {
            flex: 3;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
            min-height: 300px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            display: block;
        }
        
        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        
        .video-poster img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .video-poster.hidden {
            display: none;
        }
        
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: rgba(211, 47, 47, 0.8);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }
        
        .play-button:hover {
            background-color: rgba(211, 47, 47, 1);
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 30px solid white;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            margin-left: 5px;
        }
        
        .ad-container {
            flex: 1;
            min-width: 300px;
            background-color: #111;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 250px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        .ad-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .ad-content {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Styles για δεύτερη διαφήμιση */
        .bottom-ad-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 20px auto;
            background-color: #111;
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        .bottom-ad-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .bottom-ad-content {
            width: 100%;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Social sharing buttons */
        .social-sharing {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .social-btn {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s;
        }
        
        .social-btn:hover {
            transform: translateY(-2px);
        }
        
        .facebook-btn {
            background-color: #3b5998;
            color: white;
        }
        
        .twitter-btn {
            background-color: #1da1f2;
            color: white;
        }
        
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
        }
        
        /* Styles για placeholder διαφημίσεων */
        .ad-placeholder {
            width: 100%;
            min-height: 200px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
            font-style: italic;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        
        .ad-placeholder .ad-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #888;
        }
        
        .ad-placeholder .ad-text {
            font-size: 12px;
            line-height: 1.4;
            max-width: 250px;
        }
        
        .bottom-ad-placeholder {
            width: 100%;
            min-height: 120px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-style: italic;
        }
        
        @media (max-width: 1023px) {
            .container {
                height: auto;
                min-height: calc(100vh - 80px);
            }
            
            .video-container {
                height: 60vh;
            }
            
            .ad-container {
                height: 30vh;
                min-height: 200px;
            }
            
            .bottom-ad-container {
                min-height: 120px;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 18px;
            }
            
            .container {
                padding: 10px;
                gap: 10px;
            }
            
            .video-container {
                height: 50vh;
            }
            
            .ad-container {
                height: 25vh;
                min-height: 150px;
                padding: 10px;
            }
            
            .play-button {
                width: 60px;
                height: 60px;
            }
            
            .play-button::after {
                border-left: 20px solid white;
                border-top: 15px solid transparent;
                border-bottom: 15px solid transparent;
            }
            
            .bottom-ad-container {
                padding: 10px;
                min-height: 100px;
            }
            
            .social-btn {
                padding: 6px 12px;
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 16px;
            }
            
            .social-sharing {
                gap: 10px;
            }
            
            .social-btn {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ο γιος σου μου Χρωστάει 350€</h1>
        
        <div class="social-sharing">
            <button class="social-btn facebook-btn" id="shareFacebook">
                <span>Facebook</span>
            </button>
            <button class="social-btn twitter-btn" id="shareTwitter">
                <span>Twitter</span>
            </button>
            <button class="social-btn whatsapp-btn" id="shareWhatsapp">
                <span>WhatsApp</span>
            </button>
        </div>
    </div>
    
    <div class="container">
        <div class="video-container">
            <div class="video-poster" id="videoPoster">
                <img src="thumbnail99.png" alt="Ο γιος σου μου Χρωστάει 350€" id="posterImage">
                <button class="play-button" id="playButton"></button>
            </div>
            <video id="mainVideo">
                <source src="video99.mp4" type="video/mp4">
                Το πρόγραμμα περιήγησής σας δεν υποστηρίζει βίντεο.
            </video>
        </div>
        
        <div class="ad-container">
            <div class="ad-label">Διαφήμιση</div>
            <div class="ad-content">
                <!-- Πρώτη διαφήμιση -->
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
                    crossorigin="anonymous"></script>
                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-format="fluid"
                    data-ad-layout-key="-fb+5w+4e-db+86"
                    data-ad-client="ca-pub-3186700611266549"
                    data-ad-slot="3969235710"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
                
                <div class="ad-placeholder" id="sideAdPlaceholder">
                    <div class="ad-title">Διαφήμιση</div>
                    <div class="ad-text">Η διαφήμιση θα εμφανιστεί εδώ</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="bottom-ad-container">
        <div class="bottom-ad-label">Διαφήμιση</div>
        <div class="bottom-ad-content">
            <!-- Δεύτερη διαφήμιση -->
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
                crossorigin="anonymous"></script>
            <ins class="adsbygoogle"
                style="display:block"
                data-ad-format="auto"
                data-full-width-responsive="true"
                data-ad-client="ca-pub-3186700611266549"
                data-ad-slot="4586034963"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
            
            <div class="bottom-ad-placeholder" id="bottomAdPlaceholder">
                Διαφήμιση
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const videoPoster = document.getElementById('videoPoster');
            const posterImage = document.getElementById('posterImage');
            const playButton = document.getElementById('playButton');
            const sideAdPlaceholder = document.getElementById('sideAdPlaceholder');
            const bottomAdPlaceholder = document.getElementById('bottomAdPlaceholder');
            const shareFacebook = document.getElementById('shareFacebook');
            const shareTwitter = document.getElementById('shareTwitter');
            const shareWhatsapp = document.getElementById('shareWhatsapp');
            
            const pageUrl = encodeURIComponent(window.location.href);
            const pageTitle = encodeURIComponent("Ο γιος σου μου Χρωστάει 350€ - Δείτε το βίντεο");
            
            // Προσθήκη ελέγχων στο βίντεο
            video.controls = true;
            
            // Συνάρτηση για να ξεκινήσει το βίντεο
            function startVideo() {
                video.play();
                videoPoster.classList.add('hidden');
            }
            
            // Κουμπί play
            playButton.addEventListener('click', startVideo);
            
            // Κάνε κλικ στην εικόνα για να ξεκινήσει
            posterImage.addEventListener('click', startVideo);
            
            // Όταν τελειώσει το βίντεο, δείξε ξανά το πρώτο καρέ
            video.addEventListener('ended', function() {
                videoPoster.classList.remove('hidden');
            });
            
            // Κάνε το βίντεο να παίξει όταν πατήθηκε play από τα controls
            video.addEventListener('play', function() {
                videoPoster.classList.add('hidden');
            });
            
            // Κοινή χρήση στο Facebook
            shareFacebook.addEventListener('click', function() {
                const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}&quote=${pageTitle}`;
                window.open(facebookUrl, '_blank', 'width=600,height=400');
            });
            
            // Κοινή χρήση στο Twitter
            shareTwitter.addEventListener('click', function() {
                const twitterUrl = `https://twitter.com/intent/tweet?url=${pageUrl}&text=${pageTitle}`;
                window.open(twitterUrl, '_blank', 'width=600,height=400');
            });
            
            // Κοινή χρήση στο WhatsApp
            shareWhatsapp.addEventListener('click', function() {
                const whatsappUrl = `https://api.whatsapp.com/send?text=${pageTitle}%20${pageUrl}`;
                window.open(whatsappUrl, '_blank', 'width=600,height=400');
            });
            
            // Έλεγχος αν το thumbnail φορτώθηκε
            posterImage.addEventListener('error', function() {
                console.log('Σφάλμα φόρτωσης thumbnail. Βεβαιωθείτε ότι το thumbnail99.png είναι στον ίδιο φάκελο.');
                posterImage.style.display = 'none';
                videoPoster.style.backgroundColor = '#222';
                videoPoster.innerHTML = '<div style="color: #fff; text-align: center; padding: 20px;"><div>Ο γιος σου μου Χρωστάει 350€</div><div style="margin-top: 10px; font-size: 14px; color: #aaa;">Κάντε κλικ για αναπαραγωγή</div></div>' + 
                                        '<button class="play-button"></button>';
                document.querySelector('.play-button').addEventListener('click', startVideo);
            });
            
            // Έλεγχος αν το βίντεο φορτώνεται
            video.addEventListener('error', function() {
                console.log('Σφάλμα φόρτωσης βίντεο. Βεβαιωθείτε ότι το video99.mp4 είναι στον ίδιο φάκελο.');
                videoPoster.innerHTML = '<div style="padding: 20px; text-align: center; color: #ff6b6b;">Σφάλμα φόρτωσης βίντεο</div>';
            });
            
            // Έλεγχος για διαφημίσεις
            function checkAds() {
                // Έλεγχος για πλευρική διαφήμιση
                setTimeout(function() {
                    const sideAds = document.querySelectorAll('ins.adsbygoogle');
                    let sideAdLoaded = false;
                    
                    sideAds.forEach(function(ad) {
                        if (ad.offsetHeight > 50 || ad.innerHTML.trim().length > 0) {
                            sideAdLoaded = true;
                        }
                    });
                    
                    if (!sideAdLoaded) {
                        sideAdPlaceholder.style.display = 'flex';
                    } else {
                        sideAdPlaceholder.style.display = 'none';
                    }
                }, 2000);
                
                // Έλεγχος για κάτω διαφήμιση
                setTimeout(function() {
                    const bottomAds = document.querySelectorAll('ins.adsbygoogle');
                    let bottomAdLoaded = false;
                    
                    bottomAds.forEach(function(ad) {
                        if (ad.offsetHeight > 30 || ad.innerHTML.trim().length > 0) {
                            bottomAdLoaded = true;
                        }
                    });
                    
                    if (!bottomAdLoaded) {
                        bottomAdPlaceholder.style.display = 'flex';
                    } else {
                        bottomAdPlaceholder.style.display = 'none';
                    }
                }, 2500);
            }
            
            // Εκτέλεση ελέγχου διαφημίσεων
            checkAds();
            setInterval(checkAds, 10000);
        });
    </script>
</body>
</html>
