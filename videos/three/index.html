        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';

        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                document.body.style.height = window.innerHeight + 'px';
                
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });

                bottomAdsenseLoaded = true;
                
                return true;
            } catch (e) {
                console.log("Bottom AdSense load error:", e);
                return false;
            }
        }
        
        // Show bottom ad
        function showBottomAd() {
            if (!bottomAdsActive || !isPlaying) return;
            
            console.log("🔄 Showing bottom ad (15% of screen)");
            
            // Load AdSense ad
            const adLoaded = loadBottomAdsenseAd();
            
            if (!adLoaded) {
                setTimeout(() => {
                    if (bottomAdsActive && isPlaying) {
                        showBottomAd();
                    }
                }, 2000);
                return;
            }
            
            // Show the ad
            bottomAdSlider.classList.add('show');
            
            // Start timer (10 δευτερόλεπτα)
            bottomAdTimerValue = 10;
            bottomTimerCount.textContent = bottomAdTimerValue;
            
            // Start countdown
            clearInterval(bottomAdTimerInterval);
            bottomAdTimerInterval = setInterval(() => {
                bottomAdTimerValue--;
                bottomTimerCount.textContent = bottomAdTimerValue;
                
                if (bottomAdTimerValue <= 0) {
                    clearInterval(bottomAdTimerInterval);
                    hideBottomAd();
                }
            }, 1000);
            
            // Auto hide after 10 seconds
            clearTimeout(bottomAdInterval);
            bottomAdInterval = setTimeout(() => {
                hideBottomAd();
            }, 10000);
        }
        
        // Hide bottom ad
        function hideBottomAd() {
            console.log("⬇️ Hiding bottom ad");
            bottomAdSlider.classList.remove('show');
            clearInterval(bottomAdTimerInterval);
            clearTimeout(bottomAdInterval);
            
            // Αν το βίντεο παίζει ακόμα, δείξε νέα διαφήμιση μετά από 5 δευτερόλεπτα
            if (bottomAdsActive && isPlaying) {
                console.log("⏱️ Waiting 5 seconds before next ad...");
                setTimeout(() => {
                    if (bottomAdsActive && isPlaying) {
                        console.log("🔄 Showing next ad");
                        showBottomAd();
                    }
                }, 5000);
            }
        }
        
        // Start bottom ad rotation
        function startBottomAds() {
            if (!bottomAdsActive) {
                bottomAdsActive = true;
                console.log("▶️ Starting bottom ad rotation");
                console.log("📋 Schedule: 10s ad → 5s break → 10s ad → 5s break → ...");
                
                // Περίμενε 3 δευτερόλεπτα πριν την πρώτη διαφήμιση
                setTimeout(() => {
                    if (bottomAdsActive && isPlaying) {
                        showBottomAd();
                    }
                }, 3000);
            }
        }
        
        // Stop bottom ads
        function stopBottomAds() {
            bottomAdsActive = false;
            bottomAdSlider.classList.remove('show');
            clearInterval(bottomAdTimerInterval);
            clearTimeout(bottomAdInterval);
            console.log("⏹️ Stopped bottom ads");
        }
        
        // Start video
        function startVideo() {
            if (videoStarted) return;
            
            console.log('▶️ Starting video with sound ON');
            videoStarted = true;
            adClosed = true;
            
            // Clear countdown
            clearInterval(countdownInterval);
            
            // Hide the large center ad
            largeCenterAd.style.opacity = '0';
            largeCenterAd.style.pointerEvents = 'none';
            
            // Show video container
            setTimeout(() => {
                videoContainer.classList.add('active');
                
                // Hide play overlay after 2 seconds
                setTimeout(() => {
                    videoPlayOverlay.classList.add('hidden');
                }, 2000);
                
                // Start loading and playing the video WITH SOUND ON
                mainVideo.muted = false;
                mainVideo.volume = 1.0;
                isMuted = false;
                muteBtn.textContent = '🔊';
                updateVolumeDisplay();
                
                mainVideo.play().then(() => {
                    console.log('✅ Video playback started successfully WITH SOUND');
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    
                    showControls();
                    
                    // Start bottom ads rotation
                    startBottomAds();
                    
                }).catch(e => {
                    console.error('❌ Video play failed:', e);
                    mainVideo.muted = true;
                    mainVideo.volume = 0;
                    isMuted = true;
                    muteBtn.textContent = '🔇';
                    updateVolumeDisplay();
                    mainVideo.play().then(() => {
                        console.log('✅ Video started with muted fallback');
                        isPlaying = true;
                        videoActive = true;
                        playPauseBtn.textContent = '⏸️';
                        showControls();
                        
                        // Start bottom ads rotation
                        startBottomAds();
                    });
                });
                
            }, 500);
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        // Update volume display
        function updateVolumeDisplay() {
            const volume = isMuted ? 0 : mainVideo.volume;
            volumeLevel.style.width = (volume * 100) + '%';
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0.5';
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 1000);
                    
                    if (!bottomAdsActive) {
                        startBottomAds();
                    }
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
                
                stopBottomAds();
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            updateVolumeDisplay();
            showControls();
        }
        
        // Set volume from slider
        function setVolume(event) {
            const rect = volumeSlider.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const volume = x / rect.width;
            
            mainVideo.volume = volume;
            mainVideo.muted = volume === 0;
            isMuted = volume === 0;
            muteBtn.textContent = volume === 0 ? '🔇' : '🔊';
            updateVolumeDisplay();
            showControls();
        }
        
        // Seek video
        function seekVideo(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const percent = x / rect.width;
            
            mainVideo.currentTime = percent * videoDuration;
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            updateVolumeDisplay();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
            playPauseBtn.textContent = '▶️';
            stopBottomAds();
            
            videoPlayOverlay.classList.remove('hidden');
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            stopBottomAds();
            
            largeCenterAd.style.opacity = '1';
            largeCenterAd.style.pointerEvents = 'auto';
            largeCenterAd.innerHTML = `
                <div class="large-ad-container" style="background: rgba(34, 34, 34, 0.9); display: flex; align-items: center; justify-content: center;">
                    <div style="text-align: center; padding: 40px; color: white;">
                        <div style="font-size: 60px; margin-bottom: 20px;">❌</div>
                        <div style="font-size: 24px; margin-bottom: 15px; font-weight: bold;">Video Error</div>
                        <div style="font-size: 18px; margin-bottom: 25px; opacity: 0.9;">
                            Cannot load video content
                        </div>
                        <button onclick="location.reload()" style="background: #1d9bf0; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 18px; cursor: pointer; font-weight: bold;">
                            Reload Page
                        </button>
                    </div>
                </div>
            `;
        });
        
        // Click handlers
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', togglePlayPause);
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Volume slider
        volumeSlider.addEventListener('click', setVolume);
        
        // Progress bar
        videoProgressContainer.addEventListener('click', seekVideo);
        
        // Bottom ad close button
        closeBottomAd.addEventListener('click', () => {
            hideBottomAd();
        });
        
        // Auto start video if user clicks on the large ad
        largeCenterAd.addEventListener('click', (e) => {
            if (e.target === largeCenterAd || e.target.closest('.large-ad-container')) {
                startVideo();
            }
        });
        
        // Show controls on mouse move
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying) {
                showControls();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            setTimeout(loadAdsenseAd, 500);
        });
        
        // Prevent right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('✅ FmD Video Player ready');
        console.log('📺 Features:');
        console.log('  - 100% Fullscreen Video');
        console.log('  - Sound ON by default');
        console.log('  - Progress Bar & Volume Control');
        console.log('  - Multi-language Text Rotation');
        console.log('  - Small Bottom Ads (15% of screen)');
        console.log('  - Ad Schedule: 10s ad → 5s break → 10s ad → ...');
        
        mainVideo.addEventListener('play', () => {
            console.log('🎬 Video started playing - Exclusive Video');
        });
    </script>
</body>
</html>
