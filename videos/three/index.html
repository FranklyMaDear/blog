        /* Video controls */

    <!-- JavaScript για απόκρυψη URL -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                document.body.style.height = window.innerHeight + 'px';
                
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });
    </script>

<body>
    <!-- PRE-VIDEO AD OVERLAY - ΚΕΝΤΡΟ ΤΗΣ ΟΘΟΝΗΣ -->
    <div class="pre-video-ad" id="preVideoAd">
        <div class="ad-wrapper">

                <button class="ad-cta-button" id="startVideoBtn">
                    <span>▶️ ΚΛΙΚ ΕΔΩ ΓΙΑ ΝΑ ΔΕΙΣ ΤΟ ΒΙΝΤΕΟ</span>

    <!-- MAIN VIDEO CONTAINER -->
    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- Play button overlay -->
        <div class="video-play-overlay" id="videoPlayOverlay"></div>
        
        <!-- Main video -->
        <video id="mainVideo" preload="none" playsinline>
            <source src="https://blog.franklymadear.com/videos/three/video99.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Video Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔇</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const preVideoAd = document.getElementById('preVideoAd');
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const startVideoBtn = document.getElementById('startVideoBtn');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoActive = false;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let adsenseAdLoaded = false;
        
        // Load AdSense ad
        function loadAdsenseAd() {
            if (!adsenseAdLoaded) {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log("AdSense ad loaded in pre-video overlay");
                    adsenseAdLoaded = true;
                } catch (e) {
                    console.log("AdSense load error:", e);
                }
            }
        }
        
        // Start video when user clicks the CTA button
        function startVideoFromAd() {
            if (videoStarted) return;
            
            console.log('User clicked ad CTA - starting video');
            videoStarted = true;
            
            // Hide the pre-video ad
            preVideoAd.classList.add('hidden');
            
            // Show video container
            setTimeout(() => {
                videoContainer.classList.add('active');
                
                // Start loading and playing the video
                mainVideo.load(); // Force load the video
                
                mainVideo.play().then(() => {
                    console.log('Video playback started successfully');
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    
                    if (isMuted) {
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }
                    
                    showControls();
                    
                }).catch(e => {
                    console.error('Video play failed:', e);
                    // Try with muted as fallback
                    mainVideo.muted = true;
                    mainVideo.play().then(() => {
                        console.log('Video started with muted fallback');
                        isPlaying = true;
                        videoActive = true;
                        playPauseBtn.textContent = '⏸️';
                        muteBtn.textContent = '🔇';
                        showControls();
                    });
                });
                
            }, 500);
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
        });
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
            playPauseBtn.textContent = '▶️';
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            
            // Show error message
            preVideoAd.classList.remove('hidden');
            preVideoAd.innerHTML = `
                <div class="ad-wrapper">
                    <div class="ad-header">
                        <div class="ad-badge" style="background: #ff4444;">❌ ΣΦΑΛΜΑ</div>
                        <h1 class="ad-title" style="color: #ff4444;">Πρόβλημα Φόρτωσης Βίντεο</h1>
                        <p class="ad-subtitle">Δυστυχώς το βίντεο δεν μπορεί να φορτωθεί</p>
                    </div>
                    
                    <div class="ad-content">
                        <div class="ad-instructions">
                            <p>⚠️ <strong>Σφάλμα:</strong> Το βίντεο δεν είναι διαθέσιμο</p>
                            <p>🔗 <strong>URL:</strong> https://blog.franklymadear.com/videos/three/video99.mp4</p>
                            <p>🔄 <strong>Δοκιμάστε:</strong> Επαναλάβετε τη φόρτωση της σελίδας</p>
                        </div>
                        
                        <button class="ad-cta-button" onclick="location.reload()">
                            <span>🔄 ΕΠΑΝΑΦΟΡΤΩΣΗ ΣΕΛΙΔΑΣ</span>
                        </button>
                    </div>
                </div>
            `;
        });
        
        // Click handlers
        startVideoBtn.addEventListener('click', startVideoFromAd);
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', togglePlayPause);
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Show controls on mouse move
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying) {
                showControls();
            }
        });
        
        // Try autoplay for X player (only if embedded)
        function tryAutoplayForX() {
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player - trying autoplay');
                startVideoFromAd();
            }
        }
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            // Load AdSense ad after page loads
            setTimeout(loadAdsenseAd, 1000);
            
            // Try autoplay if embedded in X
            tryAutoplayForX();
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - Click Ad to Start Video System');
        
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - Έχω πάει με πολλούς - FmD @FmD699');
        });
    </script>
