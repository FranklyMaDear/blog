        function startPreRollAd() {
            console.log('🎬 Starting Pre-roll Video Ad');
            console.log(`🎯 Ad Slot: ${adSlots.preroll} | Format: autorelaxed`);
            revenueOptimizer.logAdImpression('preroll', adSlots.preroll);
            
            let countdown = 5;
            prerollCountdown.textContent = countdown + 's';
            
            const timer = setInterval(() => {
                countdown--;
                prerollCountdown.textContent = countdown + 's';
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    hidePreRollAd();
                }
            }, 1000);
            
            adTimers.preroll = timer;
        }
        
        function hidePreRollAd() {
            prerollAd.style.opacity = '0';
            setTimeout(() => {
                prerollAd.style.display = 'none';
                startVideoPlayback();
                startAdSchedule();
            }, 500);
        }
        
        // ========== INTERSTITIAL AD SYSTEM ==========
        function showInterstitialAd() {
            console.log('🔄 Showing Interstitial Ad');
            console.log(`🎯 Ad Slot: ${adSlots.interstitial} | Format: autorelaxed`);
            revenueOptimizer.logAdImpression('interstitial', adSlots.interstitial);
            
            interstitialAd.classList.add('active');
            
            setTimeout(() => {
                interstitialAd.classList.remove('active');
            }, 10000);
        }
        
        // ========== FLOATING VIDEO AD SYSTEM ==========
        function showFloatingAd() {
            console.log('🎯 Showing Floating Video Ad');
            console.log(`🎯 Ad Slot: ${adSlots.floating} | Format: autorelaxed`);
            revenueOptimizer.logAdImpression('floating', adSlots.floating);
            
            floatingAd.classList.add('visible');
            
            setTimeout(() => {
                floatingAd.classList.remove('visible');
            }, 20000);
        }
        
        floatingClose.addEventListener('click', () => {
            floatingAd.classList.remove('visible');
        });
        
        // ========== MID-ROLL AD SYSTEM ==========
        function checkMidrollAds(currentTime) {
            if (currentMidrollIndex < midrollTriggers.length) {
                const triggerTime = midrollTriggers[currentMidrollIndex];
                
                if (currentTime >= triggerTime && currentTime < triggerTime + 2) {
                    showMidrollAd();
                    currentMidrollIndex++;
                }
            }
        }
        
        function showMidrollAd() {
            console.log('🔥 Showing Mid-roll Video Ad');
            console.log(`🎯 Ad Slot: ${adSlots.midroll} | Format: autorelaxed`);
            revenueOptimizer.logAdImpression('midroll', adSlots.midroll);
            
            midrollAd.classList.add('active');
            mainVideo.pause();
            
            let countdown = 15;
            midrollCountdown.textContent = countdown + 's';
            
            const timer = setInterval(() => {
                countdown--;
                midrollCountdown.textContent = countdown + 's';
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    hideMidrollAd();
                }
            }, 1000);
        }
        
        function hideMidrollAd() {
            midrollAd.classList.remove('active');
            mainVideo.play();
        }
        
        // ========== VIDEO OVERLAY AD SYSTEM (NEW) ==========
        function showVideoOverlayAd() {
            if (overlayActive) return;
            
            console.log('🎁 Showing Video Overlay Ad');
            console.log(`🎯 Ad Slot: ${adSlots.overlay} | Format: in-article fluid`);
            revenueOptimizer.logAdImpression('overlay', adSlots.overlay);
            
            overlayActive = true;
            videoOverlayAd.classList.add('visible');
            
            setTimeout(() => {
                hideVideoOverlayAd();
            }, 8000);
        }
        
        function hideVideoOverlayAd() {
            videoOverlayAd.classList.remove('visible');
            overlayActive = false;
            
            // Schedule next overlay randomly between 25-40 seconds
            setTimeout(() => {
                if (isPlaying) showVideoOverlayAd();
            }, 25000 + Math.random() * 15000);
        }
        
        overlayClose.addEventListener('click', hideVideoOverlayAd);
        
        // ========== SIDE BANNER AD SYSTEM (NEW) ==========
        function showSideBannerAd() {
            console.log('📊 Showing Side Banner Ad');
            console.log(`🎯 Ad Slot: ${adSlots.sidebanner} | Format: in-article fluid`);
            revenueOptimizer.logAdImpression('sidebanner', adSlots.sidebanner);
            
            sideBannerAd.classList.add('visible');
            
            setTimeout(() => {
                sideBannerAd.classList.remove('visible');
                
                // Schedule next side banner
                setTimeout(() => {
                    if (isPlaying) showSideBannerAd();
                }, 90000);
            }, 30000);
        }
        
        sideClose.addEventListener('click', () => {
            sideBannerAd.classList.remove('visible');
            
            // Reschedule
            setTimeout(() => {
                if (isPlaying) showSideBannerAd();
            }, 90000);
        });
        
        // ========== AD SCHEDULING SYSTEM ==========
        function startAdSchedule() {
            console.log('⏰ Starting optimized ad schedule for maximum revenue');
            
            // Interstitial ads every 60 seconds
            setInterval(() => {
                if (isPlaying) {
                    showInterstitialAd();
                }
            }, 60000);
            
            // Floating ads every 45 seconds
            setInterval(() => {
                if (isPlaying) {
                    showFloatingAd();
                }
            }, 45000);
            
            // First overlay ad after 20 seconds
            setTimeout(() => {
                if (isPlaying) showVideoOverlayAd();
            }, 20000);
            
            // First side banner after 40 seconds
            setTimeout(() => {
                if (isPlaying) showSideBannerAd();
            }, 40000);
            
            console.log('📊 Continuous ad rotation activated with 7 ad slots');
        }
        
        // ========== VIDEO PLAYBACK SYSTEM ==========
        function startVideoPlayback() {
            console.log('▶️ Starting video with maximum revenue optimization');
            
            videoPlayer.classList.add('active');
            
            mainVideo.muted = true;
            mainVideo.volume = 1.0;
            isMuted = true;
            muteBtn.textContent = '🔇';
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video started (muted for better ad viewability)');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    // Enable sound on interaction
                    const enableSound = () => {
                        console.log('🔊 Enabling sound (user interaction detected)');
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                        
                        document.removeEventListener('click', enableSound);
                        document.removeEventListener('touchstart', enableSound);
                    };
                    
                    document.addEventListener('click', enableSound, { once: true });
                    document.addEventListener('touchstart', enableSound, { once: true });
                });
            }
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
            videoCurrentTime = mainVideo.currentTime;
            
            checkMidrollAds(videoCurrentTime);
        }
        
        function showControls() {
            videoControls.classList.add('visible');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                }
            }, 3000);
        }
        
        // ========== EVENT LISTENERS ==========
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            // Load all ads
            loadAllAds();
            
            // Start pre-roll ad (highest CPM)
            setTimeout(() => {
                startPreRollAd();
            }, 1000);
        });
        
        mainVideo.addEventListener('timeupdate', updateTimeDisplay);
        
        mainVideo.addEventListener('ended', () => {
            console.log('🔄 Video ended - restarting for continuous ad revenue');
            mainVideo.currentTime = 0;
            mainVideo.play();
            currentMidrollIndex = 0;
        });
        
        mainVideo.addEventListener('click', () => {
            togglePlayPause();
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play();
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
            }
            showControls();
        }
        
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        });
        
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                videoPlayer.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
            showControls();
        });
        
        // Show controls on movement
        videoPlayer.addEventListener('mousemove', showControls);
        videoPlayer.addEventListener('touchstart', showControls);
        
        // ========== INITIALIZATION ==========
        window.addEventListener('load', () => {
            console.log('🚀 ULTIMATE REVENUE SYSTEM INITIALIZED');
            console.log('=======================================');
            console.log('💰 GOOGLE ADSENSE REVENUE OPTIMIZATION:');
            console.log(`  • Pre-roll Ad: Slot ${adSlots.preroll} (€12 CPM)`);
            console.log(`  • Interstitial: Slot ${adSlots.interstitial} (€8 CPM)`);
            console.log(`  • Floating: Slot ${adSlots.floating} (€6 CPM)`);
            console.log(`  • Banner: Slot ${adSlots.banner} (€4 CPM)`);
            console.log(`  • Mid-roll: Slot ${adSlots.midroll} (€10 CPM)`);
            console.log(`  • Overlay: Slot ${adSlots.overlay} (€7 CPM)`);
            console.log(`  • Side Banner: Slot ${adSlots.sidebanner} (€5 CPM)`);
            console.log('');
            console.log('🎯 FORMATS: autorelaxed + in-article fluid');
            console.log('');
            console.log('📈 EXPECTED REVENUE PER 1000 VIEWS:');
            console.log('  • Pre-roll: €12.00');
            console.log('  • Interstitial (x2): €8.00');
            console.log('  • Floating (x3): €12.00');
            console.log('  • Banner (continuous): €40.00');
            console.log('  • Mid-roll (x3): €10.00');
            console.log('  • Overlay (x4): €28.00');
            console.log('  • Side Banner (x2): €10.00');
            console.log('  --------------------');
            console.log('  💰 TOTAL: €120.00 - €160.00');
            console.log('');
            console.log('🔥 FEATURES:');
            console.log('  • 7 Premium AdSlots with optimal formats');
            console.log('  • Overlay ads during video playback');
            console.log('  • Side banner for continuous exposure');
            console.log('  • Smart Ad Scheduling');
            console.log('  • Real-time Revenue Tracking');
            console.log('  • Mobile Optimized');
            
            document.title = "Το Έψαξα Πάντως - Maximum Revenue System";
        });
        
        // Prevent context menu
        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
