        <button class="cookie-close" id="cookieClose">OK</button>
    </div>

    <!-- FIRST AD OVERLAY - BEFORE VIDEO (10 SECONDS) -->
    <div class="first-ad-overlay" id="firstAdOverlay">
        <div class="first-ad-container">
            <div class="first-ad-content">
                <!-- GOOGLE ADSENSE AD FOR FIRST OVERLAY -->
                <ins class="adsbygoogle adsbygoogle-first"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="3969235710"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
            <div class="first-ad-footer">
                <div class="countdown-text">
                    <span id="waitText">Please wait, video is starting...</span>
                    <div class="countdown-timer" id="countdownTimer">10</div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM SLIDE-UP AD - DURING VIDEO (1/4 ΤΗΣ ΟΘΟΝΗΣ ΑΠΟ ΚΑΤΩ) -->
    <div class="bottom-slide-ad" id="bottomSlideAd">
        <div class="slide-header">
            <div class="slide-title">
                <span>📢 Advertisement</span>
            </div>
            <div class="slide-timer" id="slideTimer">15s</div>
            <button class="slide-close" id="slideClose">×</button>
        </div>
        
        <div class="slide-content">
            <div class="slide-ad-container">
                <!-- Slide Ad 1 - GOOGLE ADSENSE BANNER AD -->
                <div class="ad-slot active" id="slideAd1">
                    <ins class="adsbygoogle adsbygoogle-banner"
                         style="display:block"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="3969235710"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
                
                <!-- Slide Ad 2 - ΑΛΛΗ ΒΙΝΤΕΟ ΔΙΑΦΗΜΙΣΗ -->
                <div class="ad-slot" id="slideAd2">
                    <ins class="adsbygoogle adsbygoogle-banner"
                         style="display:block"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="3969235710"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
            </div>
        </div>
        
        <div class="slide-footer">
            <div class="slide-footer-text" id="slideFooterText">
                Advertisement - Thank you for supporting our content
            </div>
        </div>
    </div>

    <!-- MAIN VIDEO CONTAINER -->
    <div class="video-container" id="videoContainer">
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <div class="video-play-overlay" id="videoPlayOverlay"></div>
        
        <video id="mainVideo" preload="auto" playsinline loop>
            <source src="https://blog.franklymadear.com/videos/three/video99.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-bar" id="videoProgressBar"></div>
            <div class="video-progress-handle" id="videoProgressHandle"></div>
        </div>
        
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔇</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
            crossorigin="anonymous"></script>

    <script>
        // DOM Elements
        const cookieBanner = document.getElementById('cookieBanner');
        const cookieClose = document.getElementById('cookieClose');
        const backgroundVideo = document.getElementById('backgroundVideo');
        
        const firstAdOverlay = document.getElementById('firstAdOverlay');
        const waitText = document.getElementById('waitText');
        const countdownTimer = document.getElementById('countdownTimer');
        
        const bottomSlideAd = document.getElementById('bottomSlideAd');
        const slideTimer = document.getElementById('slideTimer');
        const slideClose = document.getElementById('slideClose');
        const slideFooterText = document.getElementById('slideFooterText');
        
        const slideAd1 = document.getElementById('slideAd1');
        const slideAd2 = document.getElementById('slideAd2');
        
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        const videoProgressHandle = document.getElementById('videoProgressHandle');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let currentVolume = 1.0;
        let isDraggingProgress = false;
        
        // Video Title
        const VIDEO_TITLE = "Το Έψαξα Πάντως";
        
        // Ad System State
        let firstAdCountdown = 10;
        let firstAdInterval;
        let slideAdCountdown = 15;
        let slideInterval;
        let currentSlideAdIndex = 0;
        let isSlideShowing = false;
        let slideTimerInterval;
        let slideRotationInterval;
        let videoStartTime = 0;
        let adsInitialized = false;
        
        // Language System για τα ads
        const languages = [
            { 
                code: 'en', 
                text: 'Please wait, video is starting...',
                banner: 'Advertisement - Thank you for supporting our content'
            },
            { 
                code: 'el', 
                text: 'Παρακαλώ περιμένετε, ξεκινάει το βίντεο...',
                banner: 'Διαφήμιση - Ευχαριστούμε που υποστηρίζετε το περιεχόμενό μας'
            },
            { 
                code: 'de', 
                text: 'Bitte warten Sie, das Video startet...',
                banner: 'Werbung - Vielen Dank für Ihre Unterstützung unseres Inhalts'
            }
        ];
        let currentLangIndex = 0;
        
        // ================== INITIAL SETUP ==================
        
        // Hide cookie banner when video starts
        function hideCookieBanner() {
            cookieBanner.classList.add('hidden');
            console.log('🍪 Cookie banner hidden');
        }
        
        // Initialize AdSense ads
        function initializeAdSense() {
            if (adsInitialized) return;
            
            console.log('📢 Initializing Google AdSense ads...');
            adsInitialized = true;
            
            // Load first ad immediately
            loadGoogleAd('.adsbygoogle-first');
            console.log('✅ Google AdSense ready');
        }
        
        // Load Google AdSense ad
        function loadGoogleAd(selector) {
            try {
                const adElement = document.querySelector(selector);
                if (adElement && typeof adsbygoogle !== 'undefined') {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log('✅ Google AdSense ad loaded for: ' + selector);
                }
            } catch (e) {
                console.log('❌ Google AdSense load error:', e);
            }
        }
        
        // Update language text
        function updateLanguageText() {
            if (currentLangIndex >= languages.length) currentLangIndex = 0;
            waitText.textContent = languages[currentLangIndex].text;
            slideFooterText.textContent = languages[currentLangIndex].banner;
            currentLangIndex++;
        }
        
        // ================== AD SYSTEM FUNCTIONS ==================
        
        // Start first ad (10 seconds before video)
        function startFirstAd() {
            console.log('📢 Starting first Google AdSense ad (10 seconds)...');
            
            // Initialize AdSense
            initializeAdSense();
            
            // Set initial language
            updateLanguageText();
            
            // Start language rotation every 2 seconds
            setInterval(updateLanguageText, 2000);
            
            // Start 10-second countdown
            firstAdCountdown = 10;
            countdownTimer.textContent = firstAdCountdown;
            
            clearInterval(firstAdInterval);
            firstAdInterval = setInterval(() => {
                firstAdCountdown--;
                countdownTimer.textContent = firstAdCountdown;
                
                if (firstAdCountdown <= 0) {
                    clearInterval(firstAdInterval);
                    hideFirstAdAndStartVideo();
                }
            }, 1000);
        }
        
        // Hide first ad and start video
        function hideFirstAdAndStartVideo() {
            console.log('🎬 First ad finished, starting video...');
            
            // Hide cookie banner
            hideCookieBanner();
            
            // Hide first ad
            firstAdOverlay.style.opacity = '0';
            firstAdOverlay.style.pointerEvents = 'none';
            
            // Stop background video
            backgroundVideo.pause();
            
            setTimeout(() => {
                // Show main video
                videoContainer.classList.add('active');
                
                // Start video
                startVideoWithAudio();
                
                // Start slide ad system after 5 seconds
                setTimeout(() => {
                    startSlideAdSystem();
                }, 5000);
                
            }, 500);
        }
        
        // Slide Ad System
        function startSlideAdSystem() {
            console.log('🔄 Starting slide-up ad system...');
            
            // Show first slide ad
            showSlideAd();
            
            // Set up rotation: 15 seconds ad, 5 seconds pause, repeat
            slideRotationInterval = setInterval(() => {
                if (!isSlideShowing) {
                    showSlideAd();
                }
            }, 20000);
        }
        
        // Show slide ad
        function showSlideAd() {
            if (isSlideShowing) return;
            
            console.log(`📢 Showing slide-up ad ${currentSlideAdIndex + 1}...`);
            isSlideShowing = true;
            
            // Hide all ads
            document.querySelectorAll('.ad-slot').forEach(ad => {
                ad.classList.remove('active');
            });
            
            // Show current ad
            const currentAd = currentSlideAdIndex === 0 ? slideAd1 : slideAd2;
            currentAd.classList.add('active');
            
            // Load Google AdSense ad
            setTimeout(() => {
                loadGoogleAd('.adsbygoogle-banner');
            }, 100);
            
            // Show slide ad
            bottomSlideAd.classList.remove('hidden');
            setTimeout(() => {
                bottomSlideAd.classList.add('visible');
            }, 10);
            
            // Start 15-second countdown
            slideAdCountdown = 15;
            slideTimer.textContent = slideAdCountdown + 's';
            
            clearInterval(slideTimerInterval);
            slideTimerInterval = setInterval(() => {
                slideAdCountdown--;
                slideTimer.textContent = slideAdCountdown + 's';
                
                if (slideAdCountdown <= 0) {
                    hideSlideAd();
                }
            }, 1000);
            
            // Rotate to next ad for next time
            currentSlideAdIndex = (currentSlideAdIndex + 1) % 2;
        }
        
        // Hide slide ad
        function hideSlideAd() {
            console.log('📢 Hiding slide-up ad...');
            isSlideShowing = false;
            
            clearInterval(slideTimerInterval);
            
            bottomSlideAd.classList.remove('visible');
            setTimeout(() => {
                bottomSlideAd.classList.add('hidden');
            }, 500);
        }
        
        // ================== VIDEO SYSTEM FUNCTIONS ==================
        
        // Start video with audio
        function startVideoWithAudio() {
            if (videoStarted) return;
            
            console.log('▶️ Starting video with audio setup...');
            videoStarted = true;
            videoStartTime = Date.now();
            
            // Βασική ρύθμιση για audio
            mainVideo.muted = false;
            mainVideo.volume = 1.0;
            isMuted = false;
            muteBtn.textContent = '🔊';
            
            videoPlayOverlay.classList.add('hidden');
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video started playing');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                }).catch(e => {
                    console.error('❌ Video play failed:', e);
                });
            }
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isSlideShowing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Handle video progress click
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        // VIDEO LOOPING FUNCTIONALITY
        function handleVideoEnd() {
            console.log('🔄 Video ended - restarting from beginning');
            
            mainVideo.currentTime = 0;
            
            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('⚠️ Auto-restart failed:', e);
                });
            }
        }
        
        // ================== EVENT LISTENERS ==================
        
        // Cookie banner close
        cookieClose.addEventListener('click', hideCookieBanner);
        
        // Video events
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            // Βασικές ρυθμίσεις
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            
            // Start background video
            backgroundVideo.play().catch(e => console.log('Background video autoplay blocked'));
            
            // Start first ad
            startFirstAd();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
        });
        
        // Click handlers
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', (e) => {
            if (e.target === mainVideo) {
                togglePlayPause();
            }
        });
        
        // Progress bar events
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        videoProgressHandle.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });
        
        // Touch events for progress bar
        videoProgressContainer.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            handleProgressClick(e.touches[0]);
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e.touches[0]);
            }
        });
        
        document.addEventListener('touchend', () => {
            isDraggingProgress = false;
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Slide close button
        slideClose.addEventListener('click', hideSlideAd);
        
        // Show controls on touch/mouse move
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            console.log('🚀 Page loaded - Google AdSense system ready...');
            
            // Initialize AdSense
            initializeAdSense();
        });
        
        // Handle fullscreen change
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                console.log('📺 Entered fullscreen mode');
                if (isSlideShowing) {
                    hideSlideAd();
                }
            } else {
                console.log('📺 Exited fullscreen mode');
            }
        });
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ FmD Video Player ready with Google AdSense System');
        console.log('🎯 ΤΩΡΑ ΛΕΙΤΟΥΡΓΕΙ ΜΕ GOOGLE ADSENSE:');
        console.log('  - ΠΡΩΤΗ ΔΙΑΦΗΜΙΣΗ: GOOGLE ADSENSE');
        console.log('  - SLIDE-UP ADS: GOOGLE ADSENSE BANNERS');
        console.log('  - BACKGROUND VIDEO: ΕΜΦΑΝΙΖΕΤΑΙ ΠΙΣΩ ΑΠΟ ΤΗΝ ΠΡΩΤΗ ΔΙΑΦΗΜΙΣΗ');
        console.log('  - COOKIE BANNER: ΦΕΥΓΕΙ ΟΤΑΝ ΞΕΚΙΝΑΕΙ ΤΟ ΒΙΝΤΕΟ');
    </script>
</body>
</html>
