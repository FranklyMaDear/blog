    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Ad Container - Φιλική για το βίντεο */
        .ad-container {
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 0;
            z-index: 1000;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }
        
        .ad-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* Video Container - Takes remaining space */
        .video-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* VIDEO */
        #mainVideo {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            background: #000;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        #mainVideo.visible {
            opacity: 1;
        }
        
        /* Πρώτο καρέ preview */
        .first-frame-preview {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        
        .first-frame-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .first-frame-img.loaded {
            opacity: 1;
        }
        
        /* Play button */
        .play-button-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(128, 128, 128, 0.7);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .play-button-center:hover {
            background: rgba(128, 128, 128, 0.9);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .play-button-center::after {
            content: '▶';
            color: white;
            font-size: 28px;
            margin-left: 3px;
            font-weight: bold;
        }
        
        /* Loading spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #1d9bf0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 6;
            display: none;
        }
        
        /* Video controls */
        .video-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }
        
        .video-controls.visible {
            opacity: 1;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .play-button-center {
                width: 60px;
                height: 60px;
            }
            
            .play-button-center::after {
                font-size: 24px;
            }
            
            .video-controls {
                bottom: 10px;
                padding: 8px 15px;
                gap: 10px;
            }
            
            .control-btn {
                font-size: 18px;
            }
            
            .time-display {
                font-size: 12px;
            }
            
            .ad-container {
                padding: 8px 0;
            }
        }
        
        @media (max-width: 480px) {
            .play-button-center {
                width: 50px;
                height: 50px;
            }
            
            .play-button-center::after {
                font-size: 20px;
            }
            
            .video-controls {
                bottom: 5px;
                padding: 6px 12px;
                gap: 8px;
            }
            
            .control-btn {
                font-size: 16px;
            }
            
            .time-display {
                font-size: 11px;
            }
            
            .ad-container {
                padding: 5px 0;
            }
        }
    </style>
    
    <!-- JavaScript για απόκρυψη URL -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                document.body.style.height = window.innerHeight + 'px';
                
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });
    </script>
</head>
<body>
    <!-- ADSENSE AD - ΦΙΛΙΚΗ ΓΙΑ ΤΟ ΒΙΝΤΕΟ -->
    <div class="ad-container">
        <div class="ad-wrapper">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- Πρώτο καρέ από το βίντεο -->
        <div class="first-frame-preview" id="firstFramePreview">
            <canvas id="firstFrameCanvas" class="first-frame-img"></canvas>
        </div>
        
        <!-- Play button -->
        <button class="play-button-center" id="playButton"></button>
        
        <!-- Main video -->
        <video id="mainVideo" preload="auto" playsinline muted>
            <source src="https://blog.franklymadear.com/videos/three/video99.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Video Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔇</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const firstFramePreview = document.getElementById('firstFramePreview');
        const firstFrameCanvas = document.getElementById('firstFrameCanvas');
        const playButton = document.getElementById('playButton');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let hasAutoPlayed = false;
        let firstFrameExtracted = false;
        let videoActive = false;
        let videoDuration = 0;
        let controlsTimeout = null;
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                }
            }, 3000);
        }
        
        // Extract first frame from video
        function extractFirstFrame() {
            console.log('Extracting first frame from video...');
            
            const tempVideo = document.createElement('video');
            tempVideo.crossOrigin = 'anonymous';
            tempVideo.muted = true;
            tempVideo.preload = 'metadata';
            
            tempVideo.addEventListener('loadeddata', function() {
                console.log('Video metadata loaded for frame extraction');
                tempVideo.currentTime = 0.1;
            }, false);
            
            tempVideo.addEventListener('seeked', function() {
                console.log('Video seeked, capturing frame...');
                
                const canvas = firstFrameCanvas;
                const ctx = canvas.getContext('2d');
                canvas.width = tempVideo.videoWidth || 1280;
                canvas.height = tempVideo.videoHeight || 720;
                ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                
                console.log('First frame captured:', canvas.width, 'x', canvas.height);
                firstFrameCanvas.classList.add('loaded');
                
                tempVideo.src = '';
                tempVideo.load();
                firstFrameExtracted = true;
                mainVideo.classList.add('visible');
                
            }, false);
            
            tempVideo.addEventListener('error', function(e) {
                console.error('Error extracting first frame:', e);
                fallbackToThumbnail();
            }, false);
            
            tempVideo.src = 'https://blog.franklymadear.com/videos/three/video99.mp4';
            tempVideo.load();
            
            setTimeout(() => {
                if (!firstFrameExtracted) {
                    console.log('Frame extraction timeout, using fallback');
                    fallbackToThumbnail();
                }
            }, 3000);
        }
        
        function fallbackToThumbnail() {
            console.log('Using thumbnail as fallback');
            firstFramePreview.innerHTML = `
                <img src="https://blog.franklymadear.com/videos/three/thumbnail99.png" 
                     class="first-frame-img loaded"
                     alt="Έχω πάει με πολλούς - Video Thumbnail"
                     onerror="this.style.display='none';">
            `;
            firstFrameExtracted = true;
            mainVideo.classList.add('visible');
        }
        
        // Start video
        function startVideo() {
            console.log('Play button clicked - starting video');
            videoActive = true;
            playButton.style.display = 'none';
            
            firstFramePreview.style.opacity = '0';
            setTimeout(() => {
                firstFramePreview.style.display = 'none';
            }, 500);
            
            mainVideo.play().then(() => {
                console.log('Video playback started successfully');
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                    muteBtn.textContent = '🔊';
                }
                
                videoActive = true;
                showControls();
                
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
                
                mainVideo.muted = true;
                mainVideo.play().then(() => {
                    console.log('Video started with muted fallback');
                    isPlaying = true;
                    videoActive = true;
                    playButton.style.display = 'none';
                    firstFramePreview.style.opacity = '0';
                    playPauseBtn.textContent = '⏸️';
                    muteBtn.textContent = '🔇';
                    
                    setTimeout(() => {
                        firstFramePreview.style.display = 'none';
                    }, 500);
                    
                    showControls();
                });
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Try autoplay for X player
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                videoActive = true;
                playButton.style.display = 'none';
                firstFramePreview.style.opacity = '0';
                hasAutoPlayed = true;
                playPauseBtn.textContent = '⏸️';
                muteBtn.textContent = '🔇';
                
                setTimeout(() => {
                    firstFramePreview.style.display = 'none';
                }, 500);
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                    }
                }, 1000);
                
                showControls();
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            extractFirstFrame();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            }
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
        });
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
            playPauseBtn.textContent = '▶️';
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            
            firstFramePreview.innerHTML = `
                <div style="text-align: center; padding: 20px; color: white;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 10px; opacity: 0.9;">
                        Cannot load video: https://blog.franklymadear.com/videos/three/video99.mp4
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        mainVideo.addEventListener('click', togglePlayPause);
        firstFramePreview.addEventListener('click', startVideo);
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Show controls on mouse move
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying) {
                showControls();
            }
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - Video-friendly AdSense layout');
        
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - Έχω πάει με πολλούς - FmD @FmD699');
        });
    </script>
</body>
