            console.log('📢 Starting first ad (10 seconds) - Center of screen');

            // Start 10-second countdown
            firstAdCountdown = 10;
            countdownTimer.textContent = firstAdCountdown;
            
            clearInterval(firstAdInterval);
            firstAdInterval = setInterval(() => {
                firstAdCountdown--;
                countdownTimer.textContent = firstAdCountdown;
                
                if (firstAdCountdown <= 0) {
                    clearInterval(firstAdInterval);
                    hideFirstAdAndStartVideo();
                }
            }, 1000);
        }

        function hideFirstAdAndStartVideo() {
            console.log('🎬 First ad finished, starting video...');
            
            firstAdOverlay.style.opacity = '0';
            firstAdOverlay.style.pointerEvents = 'none';
            
            setTimeout(() => {
                videoContainer.classList.add('active');

                // Start popup ad system after 5 seconds

                    startPopupAdSystem();

        function showPopupAd() {
            if (isPopupShowing) return;
            
            console.log(`📢 Showing popup ad ${currentPopupAdIndex + 1}...`);
            isPopupShowing = true;
            
            // Hide all popup ads
            document.querySelectorAll('.popup-ad-slot').forEach(ad => {
                ad.classList.remove('active');
            });
            
            // Show current popup ad
            let currentAd;
            switch(currentPopupAdIndex) {
                case 0:
                    currentAd = popupAd1;
                    console.log('🎯 Using Ad Slot: 9660744818');
                    break;
                case 1:
                    currentAd = popupAd2;
                    console.log('🎯 Using Ad Slot: 9660744819');
                    break;
                case 2:
                    currentAd = popupAd3;
                    console.log('🎯 Using Ad Slot: 9660744820');
                    break;
            }
            
            if (currentAd) {
                currentAd.classList.add('active');
            }
            
            // Show popup ad (slide-up animation)
            bottomPopupAd.classList.remove('hidden');
            setTimeout(() => {
                bottomPopupAd.classList.add('visible');
            }, 10);
            
            // Start 15-second countdown
            popupAdCountdown = 15;
            popupTimer.textContent = popupAdCountdown + 's';
            
            clearInterval(popupTimerInterval);
            popupTimerInterval = setInterval(() => {
                popupAdCountdown--;
                popupTimer.textContent = popupAdCountdown + 's';
                
                if (popupAdCountdown <= 0) {
                    hidePopupAd();
                }
            }, 1000);
            
            // Rotate to next ad for next time
            currentPopupAdIndex = (currentPopupAdIndex + 1) % 3;
        }
        
        // Hide popup ad (slide-down)
        function hidePopupAd() {
            console.log('📢 Hiding popup ad (5 second pause)...');
            isPopupShowing = false;
            
            clearInterval(popupTimerInterval);
            
            bottomPopupAd.classList.remove('visible');
            setTimeout(() => {
                bottomPopupAd.classList.add('hidden');
            }, 400);
            
            // Next ad will show after 5 seconds (handled by rotation interval)
        }
        
        // ================== VIDEO SYSTEM FUNCTIONS ==================
        
        // Start video with audio
        function startVideoWithAudio() {
            if (videoStarted) return;
            
            console.log('▶️ Starting video with audio setup...');
            videoStarted = true;
            
            // Βασική ρύθμιση για audio
            mainVideo.muted = true;
            mainVideo.volume = 1.0;
            isMuted = true;
            muteBtn.textContent = '🔇';
            
            videoPlayOverlay.classList.add('hidden');
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video started playing (initially muted)');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    // Enable sound on first user interaction
                    const enableSound = () => {
                        console.log('🔊 User interacted - enabling sound!');
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                        
                        // Αφαίρεση listeners
                        document.removeEventListener('click', enableSound);
                        document.removeEventListener('touchstart', enableSound);
                        videoContainer.removeEventListener('click', enableSound);
                        playPauseBtn.removeEventListener('click', enableSound);
                        muteBtn.removeEventListener('click', enableSound);
                        fullscreenBtn.removeEventListener('click', enableSound);
                    };
                    
                    // Προσθήκη listeners για ενεργοποίηση ήχου
                    document.addEventListener('click', enableSound, { once: true });
                    document.addEventListener('touchstart', enableSound, { once: true });
                    videoContainer.addEventListener('click', enableSound, { once: true });
                    playPauseBtn.addEventListener('click', enableSound, { once: true });
                    muteBtn.addEventListener('click', enableSound, { once: true });
                    fullscreenBtn.addEventListener('click', enableSound, { once: true });
                    
                }).catch(e => {
                    console.error('❌ Video play failed:', e);
                });
            }
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        // Show/hide controls (adjusted for popup ad)
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isPopupShowing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Handle video progress click
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        // VIDEO LOOPING FUNCTIONALITY
        function handleVideoEnd() {
            console.log('🔄 Video ended - restarting from beginning');
            
            // Clear all ad intervals when video ends
            clearInterval(popupRotationInterval);
            clearInterval(popupTimerInterval);
            
            // Hide popup if showing
            if (isPopupShowing) {
                hidePopupAd();
            }
            
            mainVideo.currentTime = 0;
            
            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('⚠️ Auto-restart failed:', e);
                });
            }
            
            // Restart popup ad system after 5 seconds
            setTimeout(() => {
                startPopupAdSystem();
            }, 5000);
        }
        
        // ================== EVENT LISTENERS ==================
        
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            // ΒΑΣΙΚΗ ΡΥΘΜΙΣΗ
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            
            // ΑΥΤΟΜΑΤΗ ΕΚΚΙΝΗΣΗ ΠΡΩΤΗΣ ΔΙΑΦΗΜΙΣΗΣ
            startFirstAd();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            // Show error message
            firstAdOverlay.innerHTML = `
                <div style="text-align: center; padding: 30px; color: white; width: 100%;">
                    <div style="font-size: 50px; margin-bottom: 15px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 12px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 20px; opacity: 0.9;">
                        Cannot load video content
                    </div>
                    <button onclick="location.reload()" style="background: #1d9bf0; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; backdrop-filter: blur(10px);">
                        Reload Page
                    </button>
                </div>
            `;
        });
        
        // Click handlers
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', (e) => {
            if (e.target === mainVideo) {
                togglePlayPause();
            }
        });
        
        // Progress bar events
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        videoProgressHandle.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });
        
        // Touch events for progress bar
        videoProgressContainer.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            handleProgressClick(e.touches[0]);
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e.touches[0]);
            }
        });
        
        document.addEventListener('touchend', () => {
            isDraggingProgress = false;
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Popup close button
        popupClose.addEventListener('click', hidePopupAd);
        
        // Show controls on touch/mouse move
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            console.log('🚀 Page loaded - Video Player with Ad System ready');
            console.log('🎯 AD SYSTEM: NO BANNERS - ONLY ADS');
            console.log('  1. FIRST AD (10 seconds): Center screen');
            console.log('  2. POPUP ADS (15% from bottom): 15s → 5s pause → repeat');
            console.log('  3. 3 DIFFERENT AD SLOTS for variety');
            
            // Προσθήκη touch event listeners
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent zoom on double-tap
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Mobile Safari specific fix
            if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream) {
                document.documentElement.style.height = '100%';
                document.body.style.height = '100%';
                videoContainer.style.height = '100%';
            }
        });
        
        // Prevent right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        // Handle fullscreen change
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                console.log('📺 Entered fullscreen mode');
                // Hide popup ad when in fullscreen
                if (isPopupShowing) {
                    hidePopupAd();
                }
            } else {
                console.log('📺 Exited fullscreen mode');
            }
        });
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ Video Player ready - NO BANNERS, ONLY ADS');
        console.log('🎯 Clean ad system without banners');
        
        // Additional audio enabling
        document.addEventListener('click', function() {
            if (videoStarted && mainVideo.muted) {
                console.log("🔊 Enabling sound via document click");
                mainVideo.muted = false;
                isMuted = false;
                muteBtn.textContent = '🔊';
            }
        });
        
        mainVideo.addEventListener('play', () => {
            console.log('🎬 Video started playing');
        });
    </script>
</body>
</html>
