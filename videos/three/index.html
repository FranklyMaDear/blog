        .control-btn {

        .time-display {

        .video-progress-container {

        .video-progress-bar {

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }

        /* MOBILE OPTIMIZATIONS */

                gap: 10px;
            }
        }

    <!-- GOOGLE ADSENSE SCRIPT -->

    <script>
        // DOM Elements
        const firstAdOverlay = document.getElementById('firstAdOverlay');
        const countdownTimer = document.getElementById('countdownTimer');
        
        const cornerAdOverlay = document.getElementById('cornerAdOverlay');
        const cornerAdTimer = document.getElementById('cornerAdTimer');
        const cornerAdClose = document.getElementById('cornerAdClose');
        
        // Corner Ad Elements
        const cornerAd1 = document.getElementById('cornerAd1');
        const cornerAd2 = document.getElementById('cornerAd2');
        const cornerAd3 = document.getElementById('cornerAd3');
        
        // Reload Timer Elements
        const reloadTimerBar = document.getElementById('reloadTimerBar');
        const reloadTimerProgress = document.getElementById('reloadTimerProgress');
        const reloadCountdown = document.getElementById('reloadCountdown');
        
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        
        // AD SYSTEM STATE
        let firstAdCountdown = 10;
        let cornerAdCountdown = 10;
        let currentCornerAdIndex = 0;
        let isCornerAdShowing = false;
        let cornerAdTimerInterval;
        let cornerAdRotationInterval;
        let videoStartTime = 0;
        
        // RELOAD SYSTEM STATE
        let reloadCountdownValue = 60; // 60 seconds
        let reloadTimerInterval;
        let reloadProgressInterval;
        
        // AD CONFIGURATION
        const cornerAds = [cornerAd1, cornerAd2, cornerAd3];
        const cornerAdSlots = ["5407828554", "3969235710", "1234567890"];
        
        // ================== ADSENSE FUNCTIONS ==================
        
        function loadFirstAd() {
            console.log('Loading first ad...');
            const firstAd = document.querySelector('.first-ad');
            if (firstAd && typeof adsbygoogle !== 'undefined') {
                (adsbygoogle = window.adsbygoogle || []).push({});
            }
        }
        
        function loadCornerAd(adElement, adSlot) {
            if (!adElement) return;
            try {
                const adIns = adElement.querySelector('.adsbygoogle-corner');
                if (!adIns) return;
                
                if (adSlot) {
                    adIns.setAttribute('data-ad-slot', adSlot);
                }
                
                if (typeof adsbygoogle !== 'undefined') {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            } catch (e) {
                console.log('Ad load error:', e);
            }
        }
        
        // ================== AD SYSTEM FUNCTIONS ==================
        
        function startFirstAd() {
            console.log('Starting first ad (10 seconds)...');
            loadFirstAd();
            
            // Start 10-second countdown
            firstAdCountdown = 10;
            countdownTimer.textContent = firstAdCountdown;
            
            const firstAdInterval = setInterval(() => {
                firstAdCountdown--;
                countdownTimer.textContent = firstAdCountdown;
                
                if (firstAdCountdown <= 0) {
                    clearInterval(firstAdInterval);
                    hideFirstAdAndStartVideo();
                }
            }, 1000);
        }
        
        function hideFirstAdAndStartVideo() {
            console.log('First ad finished, starting video...');
            firstAdOverlay.style.display = 'none';
            startVideo();
        }
        
        function startVideo() {
            console.log('Starting video...');
            videoPlayOverlay.classList.add('hidden');
            
            mainVideo.play().then(() => {
                console.log('Video started playing');
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
                showControls();
                videoStarted = true;
                videoStartTime = Date.now();
                
                // Start corner ads system
                startCornerAdsSystem();
                
                // Start reload timer system
                startReloadTimer();
                
            }).catch(e => {
                console.error('Video play failed:', e);
            });
        }
        
        function startCornerAdsSystem() {
            console.log('Starting corner ads system...');
            
            // Show first corner ad after 15 seconds
            setTimeout(() => {
                showNextCornerAd();
            }, 15000);
            
            // Set up continuous rotation every 40 seconds (10s ad + 30s pause)
            cornerAdRotationInterval = setInterval(() => {
                if (!isCornerAdShowing) {
                    showNextCornerAd();
                }
            }, 40000);
        }
        
        function showNextCornerAd() {
            if (isCornerAdShowing) return;
            
            console.log(`Showing corner ad ${currentCornerAdIndex + 1}...`);
            isCornerAdShowing = true;
            
            // Hide all corner ads
            cornerAds.forEach(ad => {
                ad.classList.remove('active');
            });
            
            // Show current corner ad
            const currentAd = cornerAds[currentCornerAdIndex];
            currentAd.classList.add('active');
            
            // Load ad
            const adSlot = cornerAdSlots[currentCornerAdIndex];
            loadCornerAd(currentAd, adSlot);
            
            // Show corner ad with animation
            cornerAdOverlay.classList.remove('hidden');
            cornerAdOverlay.classList.add('visible');
            
            // Start 10-second countdown
            cornerAdCountdown = 10;
            cornerAdTimer.textContent = cornerAdCountdown;
            
            clearInterval(cornerAdTimerInterval);
            cornerAdTimerInterval = setInterval(() => {
                cornerAdCountdown--;
                cornerAdTimer.textContent = cornerAdCountdown;
                
                if (cornerAdCountdown <= 0) {
                    hideCornerAd();
                }
            }, 1000);
            
            // Rotate to next ad
            currentCornerAdIndex = (currentCornerAdIndex + 1) % cornerAds.length;
        }
        
        function hideCornerAd() {
            console.log('Hiding corner ad...');
            isCornerAdShowing = false;
            clearInterval(cornerAdTimerInterval);
            
            cornerAdOverlay.classList.remove('visible');
            cornerAdOverlay.classList.add('hidden');
            
            setTimeout(() => {
                cornerAdOverlay.classList.remove('hidden');
            }, 500);
        }
        
        // ================== RELOAD TIMER FUNCTIONS ==================
        
        function startReloadTimer() {
            console.log('Starting 60-second reload timer...');
            
            // Reset values
            reloadCountdownValue = 60;
            reloadTimerProgress.style.width = '0%';
            
            // Show reload elements
            reloadTimerBar.classList.add('active');
            reloadCountdown.classList.add('active');
            updateReloadDisplay();
            
            // Start countdown
            clearInterval(reloadTimerInterval);
            reloadTimerInterval = setInterval(() => {
                reloadCountdownValue--;
                updateReloadDisplay();
                
                // Update progress bar
                const progress = ((60 - reloadCountdownValue) / 60) * 100;
                reloadTimerProgress.style.width = progress + '%';
                
                if (reloadCountdownValue <= 0) {
                    reloadVideo();
                }
            }, 1000);
        }
        
        function updateReloadDisplay() {
            reloadCountdown.textContent = `Reload in: ${reloadCountdownValue}s`;
        }
        
        function reloadVideo() {
            console.log('Reloading video...');
            
            // Hide reload elements
            reloadTimerBar.classList.remove('active');
            reloadCountdown.classList.remove('active');
            
            // Pause video and reset
            mainVideo.pause();
            mainVideo.currentTime = 0;
            
            // Hide corner ad if showing
            if (isCornerAdShowing) {
                hideCornerAd();
            }
            
            // Show first ad again
            firstAdOverlay.style.display = 'flex';
            startFirstAd();
            
            // Reset state
            videoStarted = false;
            isPlaying = false;
            playPauseBtn.textContent = '▶️';
            
            // Clear intervals
            clearInterval(reloadTimerInterval);
            clearInterval(cornerAdRotationInterval);
        }
        
        // ================== VIDEO SYSTEM FUNCTIONS ==================
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
        }
        
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isCornerAdShowing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    videoPlayOverlay.classList.add('hidden');
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        // ================== EVENT LISTENERS ==================
        
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            startFirstAd();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
        });
        
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', togglePlayPause);
        
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Close button for corner ad
        cornerAdClose.addEventListener('click', hideCornerAd);
        
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initialize
        window.addEventListener('load', () => {
            console.log('Page loaded - New Ad System');
            document.title = "Το Έψαξα Πάντως - FmD @FmD699";
        });
        
        // Auto-enable sound on first interaction
        document.addEventListener('click', function() {
            if (videoStarted && mainVideo.muted) {
                mainVideo.muted = false;
                isMuted = false;
                muteBtn.textContent = '🔊';
            }
        });
    </script>
</body>
</html>
