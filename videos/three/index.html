            try {
                const adIns = adElement.querySelector('.adsbygoogle-ad');
                if (!adIns) return;
                
                if (adSlot) {
                    adIns.setAttribute('data-ad-slot', adSlot);
                }
                
                if (typeof adsbygoogle !== 'undefined') {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log('✅ Ad loaded for slot: ' + (adSlot || 'default'));
                    
                    setTimeout(() => {
                        if (adElement.offsetParent === null) {
                            console.log('⚠️ Ad retrying...');
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        }
                    }, 1000);
                }
            } catch (e) {
                console.log('❌ Ad load error:', e);
            }
        }
        
        // ================== AD SYSTEM FUNCTIONS ==================
        
        function startTopAd() {
            console.log('📢 Starting top slide-down ad (15 seconds)...');
            
            initializeAdSense();
            
            // Επιλογή τυχαίας top ad
            currentTopAdIndex = Math.floor(Math.random() * topAds.length);
            showTopAd();
        }
        
        function showTopAd() {
            if (isTopAdShowing) return;
            
            console.log(`📢 Showing top ad ${currentTopAdIndex + 1}...`);
            isTopAdShowing = true;
            
            // Hide all top ads
            topAds.forEach(ad => {
                ad.classList.remove('active');
            });
            
            // Show selected top ad
            const currentAd = topAds[currentTopAdIndex];
            currentAd.classList.add('active');
            
            // Load ad
            setTimeout(() => {
                const adSlot = topAdSlots[currentTopAdIndex];
                loadAd(currentAd, adSlot);
            }, 100);
            
            // Show top ad (slide-down animation)
            topSlideAd.classList.remove('hidden');
            setTimeout(() => {
                topSlideAd.classList.add('visible');
            }, 10);
            
            // Start 15-second countdown
            topAdCountdown = 15;
            topAdTimer.textContent = topAdCountdown + 's';
            
            clearInterval(topAdTimerInterval);
            topAdTimerInterval = setInterval(() => {
                topAdCountdown--;
                topAdTimer.textContent = topAdCountdown + 's';
                
                if (topAdCountdown <= 0) {
                    hideTopAd();
                }
            }, 1000);
        }
        
        function hideTopAd() {
            console.log('📢 Hiding top ad...');
            isTopAdShowing = false;
            
            clearInterval(topAdTimerInterval);
            
            topSlideAd.classList.remove('visible');
            setTimeout(() => {
                topSlideAd.classList.add('hidden');
            }, 500);
            
            // Start video after top ad
            setTimeout(() => {
                startVideo();
            }, 500);
        }
        
        function startVideo() {
            console.log('▶️ Starting video...');
            
            videoPlayOverlay.classList.add('hidden');
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video started playing');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    videoStarted = true;
                    
                    // Start bottom ads after 30 seconds
                    setTimeout(() => {
                        startBottomAds();
                    }, 30000); // 30 δευτερόλεπτα μετά την έναρξη του βίντεο
                    
                }).catch(e => {
                    console.error('❌ Video play failed:', e);
                });
            }
        }
        
        function startBottomAds() {
            console.log('🔄 Starting bottom ads system...');
            
            // Show first bottom ad
            showNextBottomAd();
        }
        
        function showNextBottomAd() {
            if (isBottomAdShowing || bottomAdsShown >= 3) return;
            
            console.log(`📢 Showing bottom ad ${bottomAdsShown + 1}...`);
            isBottomAdShowing = true;
            
            // Hide all bottom ads
            bottomAds.forEach(ad => {
                ad.classList.remove('active');
            });
            
            // Show current bottom ad
            const currentAd = bottomAds[currentBottomAdIndex];
            currentAd.classList.add('active');
            
            // Load ad
            setTimeout(() => {
                const adSlot = bottomAdSlots[currentBottomAdIndex];
                loadAd(currentAd, adSlot);
            }, 100);
            
            // Show bottom ad (slide-up animation)
            bottomSlideAd.classList.remove('hidden');
            setTimeout(() => {
                bottomSlideAd.classList.add('visible');
            }, 10);
            
            // Start 10-second countdown
            bottomAdCountdown = 10;
            bottomAdTimer.textContent = bottomAdCountdown + 's';
            
            clearInterval(bottomAdTimerInterval);
            bottomAdTimerInterval = setInterval(() => {
                bottomAdCountdown--;
                bottomAdTimer.textContent = bottomAdCountdown + 's';
                
                if (bottomAdCountdown <= 0) {
                    hideBottomAd();
                }
            }, 1000);
            
            // Increase counter
            bottomAdsShown++;
            
            // Rotate to next ad
            currentBottomAdIndex = (currentBottomAdIndex + 1) % bottomAds.length;
        }
        
        function hideBottomAd() {
            console.log('📢 Hiding bottom ad...');
            isBottomAdShowing = false;
            
            clearInterval(bottomAdTimerInterval);
            
            bottomSlideAd.classList.remove('visible');
            setTimeout(() => {
                bottomSlideAd.classList.add('hidden');
            }, 500);
            
            // Schedule next bottom ad if not all shown
            if (bottomAdsShown < 3) {
                const nextDelay = bottomAdsShown === 1 ? 60000 : 90000; // 1 λεπτό μετά την πρώτη, 1.5 λεπτό μετά τη δεύτερη
                setTimeout(() => {
                    showNextBottomAd();
                }, nextDelay);
            }
        }
        
        // ================== VIDEO SYSTEM FUNCTIONS ==================
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isTopAdShowing && !isBottomAdShowing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        function handleVideoEnd() {
            console.log('🔄 Video ended - restarting...');
            
            mainVideo.currentTime = 0;
            
            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('⚠️ Auto-restart failed:', e);
                });
            }
        }
        
        // ================== EVENT LISTENERS ==================
        
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            
            // Start top ad immediately
            startTopAd();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            alert('Video error. Please reload the page.');
        });
        
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', (e) => {
            if (e.target === mainVideo) {
                togglePlayPause();
            }
        });
        
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        videoProgressHandle.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });
        
        videoProgressContainer.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            handleProgressClick(e.touches[0]);
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e.touches[0]);
            }
        });
        
        document.addEventListener('touchend', () => {
            isDraggingProgress = false;
        });
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Close buttons
        topAdClose.addEventListener('click', hideTopAd);
        bottomAdClose.addEventListener('click', hideBottomAd);
        
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            console.log('🚀 Page loaded - Slide Ad System');
            console.log('🎯 ΝΕΟ ΣΥΣΤΗΜΑ:');
            console.log('  - Top Ad: Κατεβαίνει από πάνω (15 δευτερόλεπτα)');
            console.log('  - Χ button: Ο χρήστης μπορεί να κλείσει οποιαδήποτε ad');
            console.log('  - Bottom Ads: 3 διαφημίσεις κατά τη διάρκεια του βίντεο');
            console.log('  - Χρονοδιάγραμμα:');
            console.log('    • Top Ad: 15s (αμέσως)');
            console.log('    • Bottom Ad 1: 30s μετά το βίντεο (10s διάρκεια)');
            console.log('    • Bottom Ad 2: 90s μετά το βίντεο (10s διάρκεια)');
            console.log('    • Bottom Ad 3: 150s μετά το βίντεο (10s διάρκεια)');
            
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream) {
                document.documentElement.style.height = '100%';
                document.body.style.height = '100%';
                videoContainer.style.height = '100%';
            }
        });
        
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                console.log('📺 Entered fullscreen mode');
                if (isTopAdShowing) hideTopAd();
                if (isBottomAdShowing) hideBottomAd();
            } else {
                console.log('📺 Exited fullscreen mode');
            }
        });
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ Video Player with Slide Ads ready');
        
        document.addEventListener('click', function() {
            if (videoStarted && mainVideo.muted) {
                console.log("🔊 Enabling sound via document click");
                mainVideo.muted = false;
                isMuted = false;
                muteBtn.textContent = '🔊';
            }
        });
        
        mainVideo.addEventListener('play', () => {
            console.log('🎬 Video started playing');
        });
    </script>
</body>
</html>
