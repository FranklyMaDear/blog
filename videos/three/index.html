    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const closeSticky = document.getElementById('closeSticky');
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ

                video.play().then(() => {

            // STICKY AD

                setTimeout(() => {

            closeSticky.addEventListener('click', function() {

            // EXTREME AD LOADING SYSTEM

                console.log('=== LOADING ALL ADS ===');
                
                const adConfigs = [

                    { type: 'fluid', slot: '3969235710', layoutKey: '-fb+5w+4e-db+86' },

                    { type: 'fluid', slot: '3969235710', layoutKey: '-fb+5w+4e-db+86' }
                ];
                
                // LOAD IN BATCHES

                    setTimeout(() => {
                        try {
                            if (typeof adsbygoogle !== 'undefined') {
                                adsbygoogle.push({});
                                console.log(`Ad ${index + 1} loaded (${config.type})`);
                            }
                        } catch(e) {

                        }
                    }, index * 500); // 0.5 δευτερόλεπτα μεταξύ ads
                });

            // LOAD ADS IMMEDIATELY
            setTimeout(loadAllAds, 800);
            
            // AGGRESSIVE REFRESH SYSTEM

                    if (typeof adsbygoogle !== 'undefined') {
                        // Refresh autorelaxed ads
                        adsbygoogle.push({});
                        console.log('Ads refreshed (autorelaxed)');
                        
                        // Refresh fluid ads

                                console.log('Ads refreshed (fluid)');
                            } catch(e) {}

            }, 20000); // Κάθε 20 δευτερόλεπτα
            
            // VIDEO INTERACTION ADS

                            adsbygoogle.push({});
                            adsbygoogle.push({});
                            console.log('Video play ads loaded');

                    } catch(e) {}

            video.addEventListener('ended', () => {

                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            for(let i = 0; i < 3; i++) {
                                setTimeout(() => {
                                    adsbygoogle.push({});
                                }, i * 1000);
                            }
                            console.log('Post-video ads loaded');
                        }
                    } catch(e) {}
                }, 1500);
                
                // SHOW STICKY AD
                showStickyAd();
            });
            
            // CHECK AND FIX ADS
            function checkAndFixAds() {
                const allIns = document.querySelectorAll('ins.adsbygoogle');
                allIns.forEach((ad, index) => {
                    if (ad.offsetHeight < 30) {
                        console.log(`Fixing ad ${index + 1} (height: ${ad.offsetHeight}px)`);
                        ad.style.minHeight = '100px';
                        ad.style.backgroundColor = '#222';
                        ad.style.border = '1px solid #444';
                        
                        // TRY TO RELOAD
                        setTimeout(() => {

                                }
                            } catch(e) {}
                        }, 1000);
                    }

            // RUN AD CHECKS

            setTimeout(checkAndFixAds, 3000);
            
            // USER ENGAGEMENT ADS

            });
            
            // SCROLL ADS

                    lastScroll = now;
                    try {
