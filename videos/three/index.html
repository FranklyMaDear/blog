        /* SEEK BAR CONTAINER - ΑΝΕΒΗΚΕ 20px ΠΙΟ ΠΑΝΩ */

        /* AD OVERLAY - ΤΩΡΑ ΠΙΑΝΕΙ ΟΛΗ ΤΗΝ ΜΠΑΡΑ */

        .ad-text {

}

        /* Progress bar για seeking */
        .seek-bar {
            position: relative;

            background: rgba(255, 255, 255, 0.2);

            cursor: pointer;

        .seek-progress {
            position: absolute;
            height: 100%;

            background: linear-gradient(90deg, #1d9bf0, #1a8cd8);

        .seek-knob {
            position: absolute;

        /* SEEK TOOLTIP */

        /* Loading spinner */

            display: none;

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes shimmer {
            100% { left: 100%; }
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .play-button-center {

            .play-button-center::after {

        /* X/Twitter player specific */

            .ad-overlay {

        /* Fullscreen adjustments */
        .video-container:fullscreen .seek-container {

    <!-- JavaScript για απόκρυψη URL -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                // Προσθήκη αυτής της γραμμής για iOS
                document.body.style.height = window.innerHeight + 'px';
                
                // Αποτροπή zoom
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                // Αποτροπή κινητών URL bars
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });
    </script>

<body>

        <div class="loading-spinner" id="loadingSpinner"></div>

                 onerror="this.style.display='none';">

        <!-- Play button -->
        <button class="play-button-center" id="playButton"></button>
        
        <!-- Main video -->

        </video>
        
        <!-- SEEK BAR -->
        <div class="seek-container" id="seekContainer">
            <!-- AD OVERLAY ΠΙΑΝΕΙ ΟΛΗ ΤΗΝ ΜΠΑΡΑ -->

                <span class="ad-text" id="adText">Must Watch Exclusive Video - FmD</span>

            <!-- TIME DISPLAY -->
            <div class="time-display" id="timeDisplay">00:01 / 00:59</div>
            
            <!-- PROGRESS BAR -->
            <div class="progress-bar-container">
                <div class="seek-bar" id="seekBar">
                    <div class="seek-progress" id="seekProgress"></div>

                    <div class="seek-tooltip" id="seekTooltip">00:00</div>
                </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const playButton = document.getElementById('playButton');
        const seekContainer = document.getElementById('seekContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const adOverlay = document.getElementById('adOverlay');
        const adText = document.getElementById('adText');
        const timeDisplay = document.getElementById('timeDisplay');
        const seekBar = document.getElementById('seekBar');
        const seekProgress = document.getElementById('seekProgress');
        const seekTooltip = document.getElementById('seekTooltip');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let hasAutoPlayed = false;
        let isSeeking = false;
        let videoWidth = 0;
        let videoHeight = 0;
        let hideSeekBarTimeout = null;
        
        // Format time σε mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTime() {
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                const progress = (mainVideo.currentTime / mainVideo.duration) * 100;
                seekProgress.style.width = `${progress}%`;
                timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(mainVideo.duration)}`;
            }
        }
        
        // Show seek bar
        function showSeekBar() {
            seekContainer.classList.add('active');
            
            // Auto hide after 3 seconds if not seeking
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                if (!isSeeking) {
                    seekContainer.classList.remove('active');
                }
            }, 3000);
        }
        
        // Hide seek bar
        function hideSeekBar() {
            if (!isSeeking) {
                seekContainer.classList.remove('active');
            }
        }
        
        // Συνάρτηση για φόρτωση Monetag script
        function loadMonetagScript() {
            console.log('Loading Monetag ad script...');
            
            // Δημιουργία και προσθήκη του νέου script tag
            const scriptTag = document.createElement('script');
            scriptTag.src = 'https://quge5.com/88/tag.min.js';
            scriptTag.setAttribute('data-zone', '182432');
            scriptTag.async = true;
            scriptTag.setAttribute('data-cfasync', 'false');
            
            // Προσθήκη στο <head> της σελίδας
            document.head.appendChild(scriptTag);
            
            // Αφαίρεση του tag μετά από λίγο για καθαρισμό
            setTimeout(() => {
                if (scriptTag.parentNode) {
                    scriptTag.parentNode.removeChild(scriptTag);
                    console.log('Temporary script tag cleaned up.');
                }
            }, 10000);
        }
        
        // Update ad display
        function updateAdDisplay() {
            // Εμφάνιση του τίτλου του βίντεο στη μπάρα
            const adMessages = [
                "Watch Exclusive Video",
                "Exclusive Video Content",
            ];
            const randomAd = adMessages[Math.floor(Math.random() * adMessages.length)];
            adText.textContent = randomAd;
            
            // Αφαίρεση παλιών event listeners και προσθήκη νέων
            adOverlay.replaceWith(adOverlay.cloneNode(true));
            const newAdOverlay = document.getElementById('adOverlay');
            const newAdText = document.getElementById('adText');
            
            // Προσθήκη event listeners για κλικ
            newAdOverlay.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                loadMonetagScript();
            });
            
            newAdOverlay.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                loadMonetagScript();
            });
        }
        
        // Seek to specific time
        function seekToTime(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            
            // Ενημέρωση του βίντεο
            mainVideo.currentTime = time;
            
            // Εμφάνιση loading spinner αν το βίντεο δεν είναι σε buffered περιοχή
            if (mainVideo.readyState < 3) {
                loadingSpinner.style.display = 'block';
                
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                }, 500);
            }
            
            console.log(`Seeking to: ${formatTime(time)}`);
        }
        
        // Update seek tooltip
        function updateSeekTooltip(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * mainVideo.duration;
            seekTooltip.textContent = formatTime(time);
            seekTooltip.style.left = `${percent * 100}%`;
            seekTooltip.style.opacity = '1';
        }
        
        // Hide seek tooltip
        function hideSeekTooltip() {
            seekTooltip.style.opacity = '0';
        }
        
        // Start video
        function startVideo() {
            console.log('Play button clicked - starting video');
            playButton.style.display = 'none';
            
            mainVideo.play().then(() => {
                console.log('Video playback started successfully');
                isPlaying = true;
                thumbnailOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                }
                
                updateAdDisplay();
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
                
                // Fallback: Try with muted
                mainVideo.muted = true;
                mainVideo.play().then(() => {
                    console.log('Video started with muted fallback');
                    isPlaying = true;
                    playButton.style.display = 'none';
                    thumbnailOverlay.style.opacity = '0';
                    
                    setTimeout(() => {
                        thumbnailOverlay.style.display = 'none';
                    }, 500);
                });
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
            }
        }
        
        // Try autoplay for X player
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                hasAutoPlayed = true;
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                    }
                }, 1000);
                
                updateAdDisplay();
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Προσαρμογή thumbnail στο μέγεθος του βίντεο
        function adjustThumbnailSize() {
            if (videoWidth > 0 && videoHeight > 0) {
                thumbnailOverlay.style.width = `${videoWidth}px`;
                thumbnailOverlay.style.height = `${videoHeight}px`;
            }
        }
        
        // Mouse movement detection για εμφάνιση seek bar
        let mouseMoveTimeout;
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying) {
                showSeekBar();
                
                clearTimeout(mouseMoveTimeout);
                mouseMoveTimeout = setTimeout(hideSeekBar, 3000);
            }
        });
        
        videoContainer.addEventListener('mouseleave', () => {
            if (!isSeeking) {
                hideSeekBar();
            }
        });
        
        // Seek bar interaction
        seekBar.addEventListener('mousemove', (e) => {
            if (!mainVideo.duration || isNaN(mainVideo.duration)) return;
            updateSeekTooltip(e.clientX);
        });
        
        seekBar.addEventListener('mouseenter', () => {
            showSeekBar();
        });
        
        seekBar.addEventListener('mouseleave', () => {
            hideSeekTooltip();
            if (!isSeeking) {
                setTimeout(hideSeekBar, 1000);
            }
        });
        
        seekBar.addEventListener('click', (e) => {
            // Prevent ad click when seeking
            e.stopPropagation();
            seekToTime(e.clientX);
            
            // Keep seek bar visible for a bit after seeking
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                seekContainer.classList.remove('active');
            }, 2000);
        });
        
        seekBar.addEventListener('mousedown', () => {
            isSeeking = true;
            showSeekBar();
        });
        
        document.addEventListener('mouseup', () => {
            isSeeking = false;
        });
        
        // Touch support για seeking
        seekBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isSeeking = true;
            seekToTime(e.touches[0].clientX);
            showSeekBar();
        });
        
        seekBar.addEventListener('touchmove', (e) => {
            if (isSeeking) {
                e.preventDefault();
                updateSeekTooltip(e.touches[0].clientX);
                showSeekBar();
            }
        });
        
        seekBar.addEventListener('touchend', (e) => {
            e.stopPropagation();
            isSeeking = false;
            hideSeekTooltip();
            
            // Keep seek bar visible for a bit after seeking
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                seekContainer.classList.remove('active');
            }, 2000);
        });
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight);
            
            adjustThumbnailSize();
            updateTime();
            updateAdDisplay();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            }
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px; color: white;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 10px; opacity: 0.9;">
                        Cannot load video: https://blog.franklymadear.com/videos/three/video58.mp4
                    </div>
                    <div style="font-size: 14px; opacity: 0.7;">
                        Please check if the video file exists
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        mainVideo.addEventListener('click', togglePlayPause);
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Video click για εμφάνιση seek bar
        mainVideo.addEventListener('click', () => {
            if (isPlaying) {
                showSeekBar();
            }
        });
        
        // Keyboard shortcuts για seeking
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    showSeekBar();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(mainVideo.duration, mainVideo.currentTime + 5);
                    showSeekBar();
                    break;
            }
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            updateAdDisplay();
            
            // Απόκρυψη URL
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - Updated with Monetag Script (zone 182432)');
        
        // Track video views for analytics
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - FmD @FmD699');
        });
        
    </script>
</body>
</html>
