    <div class="bottom-slide-ad" id="bottomSlideAd">
        <div class="slide-header">
            <div class="slide-title">
                <span>📢 Advertisement</span>
            </div>
            <div class="slide-timer" id="slideTimer">15s</div>
            <button class="slide-close" id="slideClose">×</button>
        </div>
        
        <div class="slide-content">
            <div class="slide-ad-container">
                <!-- AdSense ads will be inserted here -->
                <div class="ad-slot active" id="slideAd1">
                    <ins class="adsbygoogle slide-ad-1"
                         style="display:block; width:100%; height:100%;"
                         data-ad-format="autorelaxed"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"></ins>
                </div>
            </div>
        </div>
        
        <div class="slide-footer">
            <div class="slide-footer-text">
                Advertisement - Supports our content
            </div>
        </div>
    </div>

    <!-- MAIN VIDEO CONTAINER -->
    <div class="video-container" id="videoContainer">
        <div class="loading-spinner" id="loadingSpinner"></div>
        <div class="video-play-overlay" id="videoPlayOverlay"></div>
        <video id="mainVideo" preload="auto" playsinline loop muted>
            <source src="https://blog.franklymadear.com/videos/three/video99.mp4" type="video/mp4">
        </video>
        <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-bar" id="videoProgressBar"></div>
            <div class="video-progress-handle" id="videoProgressHandle"></div>
        </div>
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔇</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
            crossorigin="anonymous"></script>

    <script>
        // DOM Elements
        const firstAdOverlay = document.getElementById('firstAdOverlay');
        const countdownTimer = document.getElementById('countdownTimer');
        const countdownMessage = document.getElementById('countdownMessage');
        const adVideoPreview = document.getElementById('adVideoPreview');
        const adPlayIcon = document.getElementById('adPlayIcon');
        
        const videoAdOverlay = document.getElementById('videoAdOverlay');
        const videoAdTimer = document.getElementById('videoAdTimer');
        const videoAdClose = document.getElementById('videoAdClose');
        const videoAdPlayer = document.getElementById('videoAdPlayer');
        
        const bottomSlideAd = document.getElementById('bottomSlideAd');
        const slideTimer = document.getElementById('slideTimer');
        const slideClose = document.getElementById('slideClose');
        const slideAd1 = document.getElementById('slideAd1');
        
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        const videoProgressHandle = document.getElementById('videoProgressHandle');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let currentVolume = 1.0;
        let isDraggingProgress = false;
        
        // Ad System State
        let countdownValue = 15;
        let countdownInterval;
        let isVideoAdShowing = false;
        let videoAdCountdown = 30;
        let videoAdInterval;
        let isSlideAdShowing = false;
        let slideAdCountdown = 15;
        let slideAdInterval;
        let videoAdStarted = false;
        
        // Video Title
        const VIDEO_TITLE = "Το Έψαξα Πάντως";
        
        // Countdown messages
        const messages = [
            "Please wait while we prepare your video experience",
            "Παρακαλώ περιμένετε ενώ προετοιμάζουμε το βίντεο",
            "Bitte warten Sie, während wir Ihr Video-Erlebnis vorbereiten"
        ];
        let messageIndex = 0;
        
        // ================== FIRST AD (15 SECONDS COUNTDOWN) ==================
        
        function startFirstAd() {
            console.log('⏱️ Starting 15-second countdown ad...');
            
            // Start playing the preview video
            adVideoPreview.play().catch(e => console.log('Preview video auto-play prevented'));
            
            // Set initial message
            countdownMessage.textContent = messages[0];
            
            // Rotate messages every 3 seconds
            setInterval(() => {
                messageIndex = (messageIndex + 1) % messages.length;
                countdownMessage.textContent = messages[messageIndex];
            }, 3000);
            
            // Start 15-second countdown
            countdownValue = 15;
            countdownTimer.textContent = countdownValue;
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                countdownValue--;
                countdownTimer.textContent = countdownValue;
                
                if (countdownValue <= 0) {
                    clearInterval(countdownInterval);
                    hideFirstAdAndStartVideo();
                }
            }, 1000);
            
            // Play icon click handler
            adPlayIcon.addEventListener('click', () => {
                console.log('⏩ User clicked play icon, skipping countdown');
                clearInterval(countdownInterval);
                hideFirstAdAndStartVideo();
            });
        }
        
        function hideFirstAdAndStartVideo() {
            console.log('🎬 Countdown finished, starting main video...');
            
            // Stop preview video
            adVideoPreview.pause();
            adVideoPreview.currentTime = 0;
            
            // Hide first ad
            firstAdOverlay.style.opacity = '0';
            firstAdOverlay.style.pointerEvents = 'none';
            
            setTimeout(() => {
                videoContainer.classList.add('active');
                
                // Start main video
                startVideoWithAudio();
                
                // Start ad system after 30 seconds
                setTimeout(() => {
                    startVideoAdSystem();
                }, 30000);
                
            }, 500);
        }
        
        // ================== VIDEO AD SYSTEM ==================
        
        function startVideoAdSystem() {
            console.log('📺 Starting video ad system...');
            
            // Show first video ad
            showVideoAd();
            
            // Set up slide ad system (every 45 seconds)
            setInterval(() => {
                if (!isVideoAdShowing && !isSlideAdShowing) {
                    showSlideAd();
                }
            }, 45000);
        }
        
        function showVideoAd() {
            if (isVideoAdShowing || videoAdStarted) return;
            
            console.log('🎥 Showing video advertisement...');
            isVideoAdShowing = true;
            
            // Pause main video
            mainVideo.pause();
            isPlaying = false;
            playPauseBtn.textContent = '▶️';
            
            // Load a sample video ad (in production this would be a real ad video)
            // For demo, we'll use a placeholder - in real use, you'd load actual ad content
            videoAdPlayer.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
            
            // Show video ad overlay
            videoAdOverlay.classList.add('active');
            
            // Start 30-second countdown
            videoAdCountdown = 30;
            videoAdTimer.textContent = videoAdCountdown + 's';
            
            // Play the ad video
            setTimeout(() => {
                videoAdPlayer.play().catch(e => {
                    console.log('Video ad auto-play prevented:', e);
                    // Try with muted
                    videoAdPlayer.muted = true;
                    videoAdPlayer.play();
                });
            }, 500);
            
            clearInterval(videoAdInterval);
            videoAdInterval = setInterval(() => {
                videoAdCountdown--;
                videoAdTimer.textContent = videoAdCountdown + 's';
                
                if (videoAdCountdown <= 0) {
                    hideVideoAd();
                }
            }, 1000);
            
            videoAdStarted = true;
        }
        
        function hideVideoAd() {
            console.log('📺 Hiding video advertisement...');
            isVideoAdShowing = false;
            
            clearInterval(videoAdInterval);
            
            // Pause ad video
            videoAdPlayer.pause();
            videoAdPlayer.currentTime = 0;
            
            // Hide overlay
            videoAdOverlay.classList.remove('active');
            
            // Resume main video
            setTimeout(() => {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                });
            }, 500);
            
            // Next video ad in 2 minutes
            setTimeout(() => {
                videoAdStarted = false;
            }, 120000);
        }
        
        // ================== SLIDE AD SYSTEM ==================
        
        function showSlideAd() {
            if (isSlideAdShowing || isVideoAdShowing) return;
            
            console.log('📢 Showing slide advertisement...');
            isSlideAdShowing = true;
            
            // Load AdSense ad
            try {
                if (typeof adsbygoogle !== 'undefined') {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            } catch (e) {
                console.log('AdSense error:', e);
            }
            
            // Show slide ad
            bottomSlideAd.classList.remove('hidden');
            setTimeout(() => {
                bottomSlideAd.classList.add('visible');
            }, 10);
            
            // Start 15-second countdown
            slideAdCountdown = 15;
            slideTimer.textContent = slideAdCountdown + 's';
            
            clearInterval(slideAdInterval);
            slideAdInterval = setInterval(() => {
                slideAdCountdown--;
                slideTimer.textContent = slideAdCountdown + 's';
                
                if (slideAdCountdown <= 0) {
                    hideSlideAd();
                }
            }, 1000);
        }
        
        function hideSlideAd() {
            console.log('📢 Hiding slide advertisement...');
            isSlideAdShowing = false;
            
            clearInterval(slideAdInterval);
            
            bottomSlideAd.classList.remove('visible');
            setTimeout(() => {
                bottomSlideAd.classList.add('hidden');
            }, 500);
        }
        
        // ================== VIDEO SYSTEM ==================
        
        function startVideoWithAudio() {
            if (videoStarted) return;
            
            console.log('▶️ Starting main video with audio...');
            videoStarted = true;
            
            mainVideo.muted = true;
            mainVideo.volume = 1.0;
            isMuted = true;
            muteBtn.textContent = '🔇';
            
            videoPlayOverlay.classList.add('hidden');
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Main video started (initially muted)');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    const enableSound = () => {
                        console.log('🔊 User interacted - enabling sound!');
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                        
                        document.removeEventListener('click', enableSound);
                        document.removeEventListener('touchstart', enableSound);
                        videoContainer.removeEventListener('click', enableSound);
                        playPauseBtn.removeEventListener('click', enableSound);
                        muteBtn.removeEventListener('click', enableSound);
                        fullscreenBtn.removeEventListener('click', enableSound);
                    };
                    
                    document.addEventListener('click', enableSound, { once: true });
                    document.addEventListener('touchstart', enableSound, { once: true });
                    videoContainer.addEventListener('click', enableSound, { once: true });
                    playPauseBtn.addEventListener('click', enableSound, { once: true });
                    muteBtn.addEventListener('click', enableSound, { once: true });
                    fullscreenBtn.addEventListener('click', enableSound, { once: true });
                    
                }).catch(e => {
                    console.error('❌ Main video play failed:', e);
                });
            }
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isVideoAdShowing && !isSlideAdShowing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        function togglePlayPause() {
            if (isVideoAdShowing) return;
            
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        function toggleMute() {
            if (isVideoAdShowing) return;
            
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        function handleProgressClick(event) {
            if (isVideoAdShowing) return;
            
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        function handleVideoEnd() {
            console.log('🔄 Video ended - restarting from beginning');
            
            mainVideo.currentTime = 0;
            
            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('⚠️ Auto-restart failed:', e);
                });
            }
        }
        
        // ================== EVENT LISTENERS ==================
        
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            
            // Start first ad with countdown
            startFirstAd();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', (e) => {
            if (e.target === mainVideo) {
                togglePlayPause();
            }
        });
        
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        videoAdClose.addEventListener('click', hideVideoAd);
        slideClose.addEventListener('click', hideSlideAd);
        
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Prevent right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            console.log('🚀 Page loaded - Premium Ad System ready');
        });
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ Premium Video Player with Advanced Ad System');
        console.log('🎯 ΣΥΣΤΗΜΑ ΔΙΑΦΗΜΙΣΕΩΝ:');
        console.log('  - ΠΡΩΤΗ ΔΙΑΦΗΜΙΣΗ: 15 δευτερόλεπτα αντίστροφη μέτρηση');
        console.log('  - ΣΧΕΔΙΟ: Διαφανές με βίντεο preview και φωτογραφίες');
        console.log('  - VIDEO ADS: Πλήρης διαφήμιση βίντεο κατά τη διάρκεια');
        console.log('  - SLIDE ADS: Banner διαφημίσεις κάθε 45 δευτερόλεπτα');
        console.log('  - AdSense: Πλήρη ενσωμάτωση με το script σου');
    </script>
</body>
