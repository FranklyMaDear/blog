<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Βίντεο</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            gap: 20px;
            flex: 1;
        }
        
        @media (min-width: 1024px) {
            .container {
                flex-direction: row;
                padding: 40px;
                gap: 40px;
            }
        }
        
        .video-container {
            flex: 3;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            min-height: 400px;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
        }
        
        .ad-container {
            flex: 1;
            min-width: 300px;
            background-color: #111;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .ad-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .ad-content {
            width: 100%;
            text-align: center;
        }
        
        .ad-placeholder {
            width: 100%;
            min-height: 250px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-style: italic;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #222;
            margin-top: 20px;
        }
        
        @media (max-width: 1023px) {
            .video-container {
                order: 1;
            }
            
            .ad-container {
                order: 2;
                min-height: 200px;
            }
            
            .ad-placeholder {
                min-height: 150px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
                gap: 10px;
            }
            
            .ad-container {
                padding: 15px;
            }
        }
        
        /* Video controls styling */
        video::-webkit-media-controls-panel {
            background-color: rgba(0, 0, 0, 0.7);
        }
        
        video::-webkit-media-controls-play-button {
            background-color: #fff;
            border-radius: 50%;
        }
        
        video::-webkit-media-controls-current-time-display,
        video::-webkit-media-controls-time-remaining-display {
            color: #fff;
        }
        
        video::-webkit-media-controls-timeline {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
        
        video::-webkit-media-controls-volume-slider {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <video controls poster="thumbnail99.png" id="mainVideo">
                <source src="video99.mp4" type="video/mp4">
                Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την αναπαραγωγή βίντεο.
                <a href="video99.mp4" style="color: #4a90e2;">Κάντε κλικ εδώ για να κατεβάσετε το βίντεο</a>
            </video>
        </div>
        
        <div class="ad-container">
            <div class="ad-label">Διαφήμιση</div>
            <div class="ad-content">
                <!-- Διαφήμιση -->
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
                    crossorigin="anonymous"></script>
                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-format="autorelaxed"
                    data-ad-client="ca-pub-3186700611266549"
                    data-ad-slot="9660744817"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
                
                <!-- Placeholder -->
                <div class="ad-placeholder" id="adPlaceholder">
                    <div>Διαφήμιση</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <div>© 2023</div>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const adPlaceholder = document.getElementById('adPlaceholder');
            
            // Απόκρυψη placeholder αν η διαφήμιση φορτώθηκε
            setTimeout(function() {
                const ads = document.querySelectorAll('ins.adsbygoogle');
                let adLoaded = false;
                
                ads.forEach(function(ad) {
                    if (ad.offsetHeight > 50 || ad.innerHTML.trim().length > 0) {
                        adLoaded = true;
                    }
                });
                
                if (adLoaded) {
                    adPlaceholder.style.display = 'none';
                }
            }, 3000);
            
            // Έλεγχος αν το βίντεο υπάρχει
            video.addEventListener('error', function() {
                const videoContainer = document.querySelector('.video-container');
                videoContainer.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #ff6b6b;">
                        <h3 style="margin-bottom: 20px;">Πρόβλημα με το βίντεο</h3>
                        <p style="margin-bottom: 10px;">Βεβαιωθείτε ότι το αρχείο <strong>video99.mp4</strong> βρίσκεται στον ίδιο φάκελο.</p>
                        <p>Επίσης βεβαιωθείτε ότι υπάρχει το αρχείο <strong>thumbnail99.png</strong> για το πρώτο πλάνο.</p>
                    </div>
                `;
            });
            
            // Προσθήκη event listener για πρώτο πάτημα play
            let firstPlay = true;
            video.addEventListener('play', function() {
                if (firstPlay) {
                    // Μπορείτε να προσθέσετε αναλυτικές πληροφορίες εδώ αν χρειαστεί
                    firstPlay = false;
                }
            });
        });
    </script>
</body>
</html>
