        <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-bar" id="videoProgressBar"></div>
            <div class="video-progress-handle" id="videoProgressHandle"></div>
        </div>
        
        <!-- Video Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔇</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <!-- Google AdSense Script (LOADED ONCE) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
            crossorigin="anonymous"></script>

    <script>
        // DOM Elements
        const clickableAdOverlay = document.getElementById('clickableAdOverlay');
        const clickableAdContainer = document.getElementById('clickableAdContainer');
        const adMessage = document.getElementById('adMessage');
        const clickInstruction = document.getElementById('clickInstruction');
        
        const bottomSlideAd = document.getElementById('bottomSlideAd');
        const slideTimer = document.getElementById('slideTimer');
        const slideClose = document.getElementById('slideClose');
        const slideFooterText = document.getElementById('slideFooterText');
        
        const slideAd1 = document.getElementById('slideAd1');
        const slideAd2 = document.getElementById('slideAd2');
        const slideAd3 = document.getElementById('slideAd3');
        
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        const videoProgressHandle = document.getElementById('videoProgressHandle');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let currentVolume = 1.0;
        let isDraggingProgress = false;
        
        // Video Title
        const VIDEO_TITLE = "Το Έψαξα Πάντως";
        
        // Ad System State
        let currentSlideAdIndex = 0;
        let isSlideShowing = false;
        let slideTimerInterval;
        let slideRotationInterval;
        let slideAdCountdown = 15;
        let adClicked = false;
        
        // Language messages for ads
        const adMessages = [
            "Click the ad to watch the video",
            "Κάντε κλικ στη διαφήμιση για να δείτε το βίντεο",
            "Klicken Sie auf die Werbung, um das Video anzusehen"
        ];
        
        const instructionMessages = [
            "👆 Click on the advertisement to start watching",
            "👆 Κάντε κλικ στη διαφήμιση για να ξεκινήσετε",
            "👆 Klicken Sie auf die Werbung, um zu beginnen"
        ];
        
        const footerMessages = [
            "Advertisement - Supports our content",
            "Διαφήμιση - Υποστηρίζει το περιεχόμενό μας",
            "Werbung - Unterstützt unseren Inhalt"
        ];
        
        let currentMessageIndex = 0;
        let adsInitialized = false;
        
        // ================== ADSENSE FUNCTIONS ==================
        
        // Initialize AdSense ads
        function initializeAdSense() {
            if (adsInitialized) return;
            
            console.log('📢 Initializing AdSense ads...');
            
            // Initialize the clickable ad
            const clickableAd = document.querySelector('.clickable-ad');
            if (clickableAd) {
                (adsbygoogle = window.adsbygoogle || []).push({});
                console.log('✅ Clickable ad initialized');
            }
            
            adsInitialized = true;
            console.log('✅ All AdSense ads ready');
        }
        
        // Load a specific AdSense ad
        function loadAdSenseAd(adClass) {
            const adElement = document.querySelector('.' + adClass);
            if (!adElement) return;
            
            try {
                if (typeof adsbygoogle !== 'undefined') {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log('✅ Loaded AdSense ad: ' + adClass);
                    
                    // Ensure ad is visible
                    setTimeout(() => {
                        if (adElement.offsetParent === null) {
                            console.log('⚠️ Retrying ad load for: ' + adClass);
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        }
                    }, 1000);
                } else {
                    setTimeout(() => {
                        if (typeof adsbygoogle !== 'undefined') {
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        }
                    }, 1500);
                }
            } catch (e) {
                console.log('❌ AdSense load error:', e);
            }
        }
        
        // Rotate message texts
        function rotateMessages() {
            currentMessageIndex = (currentMessageIndex + 1) % adMessages.length;
            adMessage.textContent = adMessages[currentMessageIndex];
            clickInstruction.textContent = instructionMessages[currentMessageIndex];
            slideFooterText.textContent = footerMessages[currentMessageIndex];
        }
        
        // ================== AD SYSTEM FUNCTIONS ==================
        
        // Start clickable ad system
        function startClickableAd() {
            console.log('🖱️ Starting clickable ad system...');
            
            // Initialize AdSense
            initializeAdSense();
            
            // Start rotating messages every 3 seconds
            setInterval(rotateMessages, 3000);
            
            // Add click handler to the ad container
            clickableAdContainer.addEventListener('click', handleAdClick);
            
            // Also allow clicking anywhere on the overlay to proceed
            clickableAdOverlay.addEventListener('click', function(e) {
                if (e.target === clickableAdOverlay) {
                    handleAdClick(e);
                }
            });
        }
        
        // Handle ad click
        function handleAdClick(event) {
            if (adClicked) return;
            adClicked = true;
            
            console.log('🎯 Ad clicked, opening video...');
            
            // Prevent default if it's an actual ad link
            event.preventDefault();
            event.stopPropagation();
            
            // If the click was on an actual ad link, open in new window
            if (event.target.closest('a') || event.target.tagName === 'A') {
                console.log('🔗 Ad link clicked, opening in new tab');
                // Let the default link behavior happen
                setTimeout(startVideo, 100);
                return;
            }
            
            // Otherwise start the video
            startVideo();
        }
        
        // Start video after ad click
        function startVideo() {
            console.log('▶️ Starting video...');
            
            // Hide the ad overlay
            clickableAdOverlay.style.opacity = '0';
            clickableAdOverlay.style.pointerEvents = 'none';
            
            setTimeout(() => {
                videoContainer.classList.add('active');
                
                // Start video with audio
                startVideoWithAudio();
                
                // Start slide ad system after 5 seconds
                setTimeout(() => {
                    startSlideAdSystem();
                }, 5000);
                
            }, 500);
        }
        
        // Slide Ad System (ΒΓΑΙΝΕΙ ΑΠΟ ΚΑΤΩ ΠΡΟΣ ΤΑ ΠΑΝΩ) - ΜΕ 3 ΔΙΑΦΟΡΕΤΙΚΕΣ ΔΙΑΦΗΜΙΣΕΙΣ
        function startSlideAdSystem() {
            console.log('🔄 Starting slide-up ad system with 3 different ads...');
            
            // Show first slide ad
            showSlideAd();
            
            // Set up rotation: 15 seconds ad, 5 seconds pause, repeat with DIFFERENT ADS
            slideRotationInterval = setInterval(() => {
                if (!isSlideShowing) {
                    showSlideAd();
                }
            }, 20000); // 15s ad + 5s pause = 20s total cycle
        }
        
        // Show slide ad (slide-up από κάτω) - ΜΕ 3 ΔΙΑΦΟΡΕΤΙΚΕΣ ΔΙΑΦΗΜΙΣΕΙΣ
        function showSlideAd() {
            if (isSlideShowing) return;
            
            console.log(`📢 Showing slide-up ad ${currentSlideAdIndex + 1}/3...`);
            isSlideShowing = true;
            
            // Hide all ads
            document.querySelectorAll('.ad-slot').forEach(ad => {
                ad.classList.remove('active');
            });
            
            // Show current ad (rotate between 3 different ads)
            let currentAd;
            let adClass;
            
            switch(currentSlideAdIndex) {
                case 0:
                    currentAd = slideAd1;
                    adClass = 'slide-ad-1';
                    break;
                case 1:
                    currentAd = slideAd2;
                    adClass = 'slide-ad-2';
                    break;
                case 2:
                    currentAd = slideAd3;
                    adClass = 'slide-ad-3';
                    break;
            }
            
            currentAd.classList.add('active');
            
            // Load the appropriate AdSense ad (DIFFERENT AD EACH TIME)
            setTimeout(() => {
                loadAdSenseAd(adClass);
            }, 100);
            
            // Show slide ad (slide-up animation)
            bottomSlideAd.classList.remove('hidden');
            setTimeout(() => {
                bottomSlideAd.classList.add('visible');
            }, 10);
            
            // Start 15-second countdown
            slideAdCountdown = 15;
            slideTimer.textContent = slideAdCountdown + 's';
            
            clearInterval(slideTimerInterval);
            slideTimerInterval = setInterval(() => {
                slideAdCountdown--;
                slideTimer.textContent = slideAdCountdown + 's';
                
                if (slideAdCountdown <= 0) {
                    hideSlideAd();
                }
            }, 1000);
            
            // Rotate to next ad for next time - 3 DIFFERENT ADS
            currentSlideAdIndex = (currentSlideAdIndex + 1) % 3;
        }
        
        // Hide slide ad (slide-down)
        function hideSlideAd() {
            console.log('📢 Hiding slide-up ad...');
            isSlideShowing = false;
            
            clearInterval(slideTimerInterval);
            
            bottomSlideAd.classList.remove('visible');
            setTimeout(() => {
                bottomSlideAd.classList.add('hidden');
            }, 500);
            
            // Ad will show again after 5 seconds (handled by rotation interval)
        }
        
        // ================== VIDEO SYSTEM FUNCTIONS ==================
        
        // Start video with audio
        function startVideoWithAudio() {
            if (videoStarted) return;
            
            console.log('▶️ Starting video with audio setup...');
            videoStarted = true;
            
            // Βασική ρύθμιση για audio
            mainVideo.muted = true;
            mainVideo.volume = 1.0;
            isMuted = true;
            muteBtn.textContent = '🔇';
            
            videoPlayOverlay.classList.add('hidden');
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video started playing (initially muted)');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    // Enable sound on first user interaction
                    const enableSound = () => {
                        console.log('🔊 User interacted - enabling sound!');
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                        
                        // Αφαίρεση listeners
                        document.removeEventListener('click', enableSound);
                        document.removeEventListener('touchstart', enableSound);
                        videoContainer.removeEventListener('click', enableSound);
                        playPauseBtn.removeEventListener('click', enableSound);
                        muteBtn.removeEventListener('click', enableSound);
                        fullscreenBtn.removeEventListener('click', enableSound);
                    };
                    
                    // Προσθήκη listeners για ενεργοποίηση ήχου
                    document.addEventListener('click', enableSound, { once: true });
                    document.addEventListener('touchstart', enableSound, { once: true });
                    videoContainer.addEventListener('click', enableSound, { once: true });
                    playPauseBtn.addEventListener('click', enableSound, { once: true });
                    muteBtn.addEventListener('click', enableSound, { once: true });
                    fullscreenBtn.addEventListener('click', enableSound, { once: true });
                    
                }).catch(e => {
                    console.error('❌ Video play failed:', e);
                });
            }
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        // Show/hide controls (adjusted for slide ad)
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isSlideShowing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Handle video progress click
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        // VIDEO LOOPING FUNCTIONALITY
        function handleVideoEnd() {
            console.log('🔄 Video ended - restarting from beginning');
            
            mainVideo.currentTime = 0;
            
            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('⚠️ Auto-restart failed:', e);
                });
            }
        }
        
        // ================== EVENT LISTENERS ==================
        
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            // ΒΑΣΙΚΗ ΡΥΘΜΙΣΗ
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            
            // ΑΥΤΟΜΑΤΗ ΕΚΚΙΝΗΣΗ CLICKABLE AD
            startClickableAd();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            // Show error message
            clickableAdOverlay.innerHTML = `
                <div style="text-align: center; padding: 30px; color: white; width: 100%;">
                    <div style="font-size: 50px; margin-bottom: 15px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 12px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 20px; opacity: 0.9;">
                        Cannot load video content
                    </div>
                    <button onclick="location.reload()" style="background: #1d9bf0; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; backdrop-filter: blur(10px);">
                        Reload Page
                    </button>
                </div>
            `;
        });
        
        // Click handlers
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', (e) => {
            if (e.target === mainVideo) {
                togglePlayPause();
            }
        });
        
        // Progress bar events
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        videoProgressHandle.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });
        
        // Touch events for progress bar
        videoProgressContainer.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            handleProgressClick(e.touches[0]);
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e.touches[0]);
            }
        });
        
        document.addEventListener('touchend', () => {
            isDraggingProgress = false;
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Slide close button
        slideClose.addEventListener('click', hideSlideAd);
        
        // Show controls on touch/mouse move
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            console.log('🚀 Page loaded - Clickable Ad System ready...');
            
            // Initialize AdSense immediately
            initializeAdSense();
            
            // Προσθήκη touch event listeners
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent zoom on double-tap
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Mobile Safari specific fix
            if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream) {
                document.documentElement.style.height = '100%';
                document.body.style.height = '100%';
                videoContainer.style.height = '100%';
            }
        });
        
        // Prevent right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        // Handle fullscreen change
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                console.log('📺 Entered fullscreen mode');
                // Hide slide ad when in fullscreen
                if (isSlideShowing) {
                    hideSlideAd();
                }
            } else {
                console.log('📺 Exited fullscreen mode');
            }
        });
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ FmD Video Player ready with NEW Clickable Ad System');
        console.log('🎯 ΝΕΑ ΣΥΣΤΗΜΑ ΔΙΑΦΗΜΙΣΕΩΝ:');
        console.log('  - CLICKABLE AD: Ο χρήστης κάνει κλικ στη διαφήμιση για να δει το βίντεο');
        console.log('  - SLIDE-UP ADS: 3 ΔΙΑΦΟΡΕΤΙΚΕΣ διαφημίσεις που εναλλάσσονται');
        console.log('  - ΜΕΓΕΘΟΣ: 1/4 της οθόνης (25vh) στη βάση');
        console.log('  - Ad Schedule: 15s διαφήμιση → 5s παύση → επόμενη διαφήμιση');
        console.log('  - ΓΛΩΣΣΕΣ: Αγγλικά, Ελληνικά, Γερμανικά (περιστρέφονται)');
        console.log('  - AdSense: Χρησιμοποιεί ΤΟ ΑΚΡΙΒΕΣ SCRIPT ΣΟΥ');
        console.log('  - ΚΑΘΕ ΦΟΡΑ ΔΙΑΦΟΡΕΤΙΚΗ ΔΙΑΦΗΜΙΣΗ στα slide ads');
        
        // Additional audio enabling
        document.addEventListener('click', function() {
            if (videoStarted && mainVideo.muted) {
                console.log("🔊 Enabling sound via document click");
                mainVideo.muted = false;
                isMuted = false;
                muteBtn.textContent = '🔊';
            }
        });
        
        mainVideo.addEventListener('play', () => {
            console.log('🎬 Video started playing');
        });
    </script>
</body>
