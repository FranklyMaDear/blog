    <!-- GOOGLE ADSENSE SCRIPT -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
            crossorigin="anonymous"></script>

    <script>
        // DOM Elements
        const firstAdOverlay = document.getElementById('firstAdOverlay');
        const countdownTimer = document.getElementById('countdownTimer');
        
        const bottomSlideAd = document.getElementById('bottomSlideAd');
        const bottomAdTimer = document.getElementById('bottomAdTimer');
        const bottomAdClose = document.getElementById('bottomAdClose');
        
        // Bottom Ad Elements
        const bottomAd1 = document.getElementById('bottomAd1');
        const bottomAd2 = document.getElementById('bottomAd2');
        const bottomAd3 = document.getElementById('bottomAd3');
        
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        
        // AD SYSTEM STATE
        let firstAdCountdown = 10;
        let bottomAdCountdown = 10;
        let currentBottomAdIndex = 0;
        let isBottomAdShowing = false;
        let bottomAdTimerInterval;
        let bottomAdRotationInterval;
        let videoStartTime = 0;
        
        // AD CONFIGURATION
        const bottomAds = [bottomAd1, bottomAd2, bottomAd3];
        const bottomAdSlots = ["5407828554", "3969235710", "1234567890"];
        
        // ================== ADSENSE FUNCTIONS ==================
        
        function loadFirstAd() {
            console.log('Loading first ad...');
            const firstAd = document.querySelector('.first-ad');
            if (firstAd && typeof adsbygoogle !== 'undefined') {
                (adsbygoogle = window.adsbygoogle || []).push({});
            }
        }
        
        function loadBottomAd(adElement, adSlot) {
            if (!adElement) return;
            try {
                const adIns = adElement.querySelector('.adsbygoogle-bottom');
                if (!adIns) return;
                
                if (adSlot) {
                    adIns.setAttribute('data-ad-slot', adSlot);
                }
                
                if (typeof adsbygoogle !== 'undefined') {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            } catch (e) {
                console.log('Ad load error:', e);
            }
        }
        
        // ================== AD SYSTEM FUNCTIONS ==================
        
        function startFirstAd() {
            console.log('Starting first ad (10 seconds)...');
            loadFirstAd();
            
            // Start 10-second countdown
            firstAdCountdown = 10;
            countdownTimer.textContent = firstAdCountdown;
            
            const firstAdInterval = setInterval(() => {
                firstAdCountdown--;
                countdownTimer.textContent = firstAdCountdown;
                
                if (firstAdCountdown <= 0) {
                    clearInterval(firstAdInterval);
                    hideFirstAdAndStartVideo();
                }
            }, 1000);
        }
        
        function hideFirstAdAndStartVideo() {
            console.log('First ad finished, starting video...');
            firstAdOverlay.style.display = 'none';
            startVideo();
        }
        
        function startVideo() {
            console.log('Starting video...');
            videoPlayOverlay.classList.add('hidden');
            
            mainVideo.play().then(() => {
                console.log('Video started playing');
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
                showControls();
                videoStarted = true;
                videoStartTime = Date.now();
                
                // Show cookie compliance message at bottom (NOT over video)
                setTimeout(() => {
                    document.getElementById('cookie-compliance').style.display = 'block';
                }, 2000);
                
                // Start bottom ads system - ΚΑΘΕ 10 ΔΕΥΤΕΡΟΛΕΠΤΑ
                startBottomAdsSystem();
                
            }).catch(e => {
                console.error('Video play failed:', e);
            });
        }
        
        function startBottomAdsSystem() {
            console.log('Starting bottom ads system (every 10 seconds)...');
            
            // Show first bottom ad after 10 seconds
            setTimeout(() => {
                showNextBottomAd();
            }, 10000);
            
            // Set up continuous rotation every 20 seconds (10s ad + 10s pause)
            bottomAdRotationInterval = setInterval(() => {
                if (!isBottomAdShowing) {
                    showNextBottomAd();
                }
            }, 20000);
        }
        
        function showNextBottomAd() {
            if (isBottomAdShowing) return;
            
            console.log(`Showing bottom ad ${currentBottomAdIndex + 1}...`);
            isBottomAdShowing = true;
            
            // Hide all bottom ads
            bottomAds.forEach(ad => {
                ad.classList.remove('active');
            });
            
            // Show current bottom ad
            const currentAd = bottomAds[currentBottomAdIndex];
            currentAd.classList.add('active');
            
            // Load ad
            const adSlot = bottomAdSlots[currentBottomAdIndex];
            loadBottomAd(currentAd, adSlot);
            
            // Show bottom ad (slide-up animation)
            bottomSlideAd.classList.remove('hidden');
            setTimeout(() => {
                bottomSlideAd.classList.add('visible');
            }, 10);
            
            // Start 10-second countdown
            bottomAdCountdown = 10;
            bottomAdTimer.textContent = bottomAdCountdown;
            
            clearInterval(bottomAdTimerInterval);
            bottomAdTimerInterval = setInterval(() => {
                bottomAdCountdown--;
                bottomAdTimer.textContent = bottomAdCountdown;
                
                if (bottomAdCountdown <= 0) {
                    hideBottomAd();
                }
            }, 1000);
            
            // Rotate to next ad
            currentBottomAdIndex = (currentBottomAdIndex + 1) % bottomAds.length;
        }
        
        function hideBottomAd() {
            console.log('Hiding bottom ad...');
            isBottomAdShowing = false;
            clearInterval(bottomAdTimerInterval);
            
            bottomSlideAd.classList.remove('visible');
            setTimeout(() => {
                bottomSlideAd.classList.add('hidden');
            }, 500);
        }
        
        // ================== VIDEO SYSTEM FUNCTIONS ==================
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
        }
        
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying && !isBottomAdShowing) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    videoPlayOverlay.classList.add('hidden');
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        function handleVideoEnd() {
            mainVideo.currentTime = 0;
            mainVideo.play().catch(e => {
                console.log('Auto-restart failed:', e);
            });
        }
        
        // ================== EVENT LISTENERS ==================
        
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            mainVideo.volume = 1.0;
            mainVideo.loop = true;
            startFirstAd();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
        });
        
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', togglePlayPause);
        
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Close button for bottom ad
        bottomAdClose.addEventListener('click', hideBottomAd);
        
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initialize
        window.addEventListener('load', () => {
            console.log('Page loaded - Fixed Ad System');
            document.title = "Το Έψαξα Πάντως - FmD @FmD699";
        });
        
        // Auto-enable sound on first interaction
        document.addEventListener('click', function() {
            if (videoStarted && mainVideo.muted) {
                mainVideo.muted = false;
                isMuted = false;
                muteBtn.textContent = '🔊';
            }
        });
        
        // Fullscreen change handler
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement && isBottomAdShowing) {
                hideBottomAd();
            }
        });
    </script>
</body>
</html>
