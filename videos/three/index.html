    <!-- Google AdSense Script (LOADED ONCE IN HEAD) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: 10px;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #111 0%, #d32f2f 100%);
            position: sticky;
            top: 0;
            z-index: 1000;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(211, 47, 47, 0.4);
            border-bottom: 3px solid #ff9800;
        }
        
        .header h1 {
            font-size: clamp(18px, 5vw, 24px);
            color: #fff;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.3;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        
        .video-section {
            width: 100%;
            margin-bottom: 25px;
        }
        
        .video-container {
            background-color: #111;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
            min-height: 400px;
            border: 3px solid #333;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            display: block;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        
        .video-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .video-poster.hidden {
            display: none;
        }
        
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #d32f2f 0%, #b71c1c 100%);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            touch-action: manipulation;
            box-shadow: 0 4px 20px rgba(211, 47, 47, 0.6);
        }
        
        .play-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 6px 25px rgba(211, 47, 47, 0.8);
        }
        
        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 30px solid white;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            margin-left: 5px;
        }
        
        /* ADS GRID - 4 DIFFERENT ADS */
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .ad-item {
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 2px solid;
            min-height: 250px;
            display: flex;
            flex-direction: column;
        }
        
        .ad-item:nth-child(1) {
            border-color: #4fc3f7;
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.3);
        }
        
        .ad-item:nth-child(2) {
            border-color: #69f0ae;
            box-shadow: 0 4px 20px rgba(105, 240, 174, 0.3);
        }
        
        .ad-item:nth-child(3) {
            border-color: #ff9800;
            box-shadow: 0 4px 20px rgba(255, 152, 0, 0.3);
        }
        
        .ad-item:nth-child(4) {
            border-color: #9c27b0;
            box-shadow: 0 4px 20px rgba(156, 39, 176, 0.3);
        }
        
        .ad-label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 2px solid #444;
        }
        
        .ad-item:nth-child(1) .ad-label {
            color: #4fc3f7;
        }
        
        .ad-item:nth-child(2) .ad-label {
            color: #69f0ae;
        }
        
        .ad-item:nth-child(3) .ad-label {
            color: #ff9800;
        }
        
        .ad-item:nth-child(4) .ad-label {
            color: #9c27b0;
        }
        
        .ad-content {
            flex: 1;
            width: 100%;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* STICKY AD AT BOTTOM */
        .sticky-bottom-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(17, 17, 17, 0.95);
            padding: 12px;
            z-index: 9999;
            border-top: 3px solid #d32f2f;
            display: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }
        
        .sticky-bottom-ad.active {
            display: block;
            animation: slideUp 0.4s ease-out;
        }
        
        @keyframes slideUp {
            from { bottom: -100px; }
            to { bottom: 0; }
        }
        
        .sticky-ad-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }
        
        .close-sticky {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* RESPONSIVE */
        @media (max-width: 767px) {
            .main-container {
                padding: 10px;
            }
            
            .ads-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-top: 20px;
            }
            
            .ad-item {
                min-height: 200px;
                padding: 15px;
            }
            
            .play-button {
                width: 70px;
                height: 70px;
            }
            
            .play-button::after {
                border-left: 25px solid white;
                border-top: 15px solid transparent;
                border-bottom: 15px solid transparent;
            }
            
            .header {
                padding: 12px 10px;
            }
        }
        
        @media (min-width: 768px) and (max-width: 1023px) {
            .ads-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (min-width: 1024px) {
            .ads-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ο ΓΙΟΣ ΣΟΥ ΜΟΥ ΧΡΩΣΤΑΕΙ 350 ΕΥΡΩ ΚΑΙ ΔΕΝ ΜΟΥ ΤΑ ΕΧΕΙ ΔΩΣΕΙ</h1>
    </div>
    
    <div class="main-container">
        <div class="video-section">
            <div class="video-container">
                <div class="video-poster" id="videoPoster">
                    <img src="thumbnail99.png" alt="Ο γιος σου μου Χρωστάει 350€" id="posterImage" crossorigin="anonymous">
                    <button class="play-button" id="playButton" aria-label="Play video"></button>
                </div>
                <video id="mainVideo" playsinline webkit-playsinline controls>
                    <source src="video99.mp4" type="video/mp4">
                    Το πρόγραμμα περιήγησής σας δεν υποστηρίζει βίντεο.
                </video>
            </div>
        </div>
        
        <!-- 4 ΔΙΑΦΗΜΙΣΕΙΣ ΜΕ ΤΑ ΣΚΡΙΠΤ ΣΟΥ -->
        <div class="ads-grid">
            <!-- ΔΙΑΦΗΜΙΣΗ 1: AUTORELAXED -->
            <div class="ad-item">
                <div class="ad-label">🔵 AUTORELAXED AD 1</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-format="autorelaxed"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </div>
            
            <!-- ΔΙΑΦΗΜΙΣΗ 2: FLUID LAYOUT -->
            <div class="ad-item">
                <div class="ad-label">🟢 FLUID LAYOUT AD</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-format="fluid"
                         data-ad-layout-key="-fb+5w+4e-db+86"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="3969235710"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </div>
            
            <!-- ΔΙΑΦΗΜΙΣΗ 3: AUTORELAXED 2 -->
            <div class="ad-item">
                <div class="ad-label">🟠 AUTORELAXED AD 2</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-format="autorelaxed"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </div>
            
            <!-- ΔΙΑΦΗΜΙΣΗ 4: FLUID LAYOUT 2 -->
            <div class="ad-item">
                <div class="ad-label">🟣 FLUID LAYOUT AD 2</div>
                <div class="ad-content">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-format="fluid"
                         data-ad-layout-key="-fb+5w+4e-db+86"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="3969235710"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </div>
        </div>
    </div>
    
    <!-- STICKY BOTTOM AD -->
    <div class="sticky-bottom-ad" id="stickyAd">
        <div class="sticky-ad-content">
            <ins class="adsbygoogle"
                 style="display:block; width: 100%; min-height: 80px;"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
        <button class="close-sticky" id="closeSticky">×</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const videoPoster = document.getElementById('videoPoster');
            const playButton = document.getElementById('playButton');
            const stickyAd = document.getElementById('stickyAd');
            const closeSticky = document.getElementById('closeSticky');
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ
            playButton.addEventListener('click', function() {
                video.play().then(() => {
                    videoPoster.classList.add('hidden');
                    // Εμφάνιση sticky ad μετά από 10 δευτερόλεπτα
                    setTimeout(showStickyAd, 10000);
                }).catch(e => {
                    console.log('Video error:', e);
                });
            });
            
            // STICKY AD FUNCTION
            function showStickyAd() {
                if (!stickyAd.classList.contains('active')) {
                    stickyAd.classList.add('active');
                    console.log('Sticky ad shown');
                }
            }
            
            closeSticky.addEventListener('click', function() {
                stickyAd.classList.remove('active');
            });
            
            // LOAD ALL 4 ADS
            function loadAdsSequentially() {
                console.log('Loading 4 ads sequentially...');
                
                // Ad 1 - Autorelaxed
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                            console.log('Ad 1 (Autorelaxed) loaded');
                        }
                    } catch(e) {}
                }, 500);
                
                // Ad 2 - Fluid
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                            console.log('Ad 2 (Fluid) loaded');
                        }
                    } catch(e) {}
                }, 1500);
                
                // Ad 3 - Autorelaxed 2
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                            console.log('Ad 3 (Autorelaxed 2) loaded');
                        }
                    } catch(e) {}
                }, 2500);
                
                // Ad 4 - Fluid 2
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                            console.log('Ad 4 (Fluid 2) loaded');
                        }
                    } catch(e) {}
                }, 3500);
                
                // Sticky Ad
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                            console.log('Sticky ad loaded');
                        }
                    } catch(e) {}
                }, 4500);
            }
            
            // ΕΚΚΙΝΗΣΗ ΦΟΡΤΩΣΗΣ ADS
            setTimeout(loadAdsSequentially, 1000);
            
            // REFRESH ADS EVERY 30 SECONDS
            setInterval(() => {
                try {
                    if (typeof adsbygoogle !== 'undefined') {
                        // Refresh all ads
                        adsbygoogle.push({});
                        console.log('All ads refreshed');
                    }
                } catch(e) {
                    console.log('Refresh error:', e);
                }
            }, 30000);
            
            // VIDEO EVENTS FOR ADS
            video.addEventListener('play', function() {
                // Refresh ads when video starts
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                        }
                    } catch(e) {}
                }, 5000);
            });
            
            video.addEventListener('ended', function() {
                // Show sticky ad after video ends
                showStickyAd();
                
                // Refresh ads after video ends
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                            adsbygoogle.push({});
                        }
                    } catch(e) {}
                }, 2000);
            });
            
            // CHECK ADS VISIBILITY
            function checkAds() {
                const adContainers = document.querySelectorAll('.ad-content ins.adsbygoogle');
                adContainers.forEach((ad, index) => {
                    if (ad.offsetHeight < 50) {
                        console.log(`Ad ${index + 1} needs fixing (height: ${ad.offsetHeight}px)`);
                        ad.style.minHeight = '150px';
                        ad.style.backgroundColor = '#222';
                    }
                });
            }
            
            // RUN CHECKS
            setTimeout(checkAds, 4000);
            setInterval(checkAds, 15000);
            
            // USER INTERACTION ADS
            document.addEventListener('click', function() {
                setTimeout(() => {
                    try {
                        if (typeof adsbygoogle !== 'undefined') {
                            adsbygoogle.push({});
                        }
                    } catch(e) {}
                }, 800);
            });
        });
    </script>
</body>
</html>
