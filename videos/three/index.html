            Your browser does not support the video tag.
        </video>
        
        <!-- Video Progress Bar -->
        <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-bar" id="videoProgressBar"></div>
            <div class="video-progress-handle" id="videoProgressHandle"></div>
        </div>
        
        <!-- Video Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔊</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const largeCenterAd = document.getElementById('largeCenterAd');
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const countdownTimer = document.getElementById('countdownTimer');
        const waitText = document.getElementById('waitText');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        const videoProgressHandle = document.getElementById('videoProgressHandle');
        const videoTitle = document.getElementById('videoTitle');
        
        // Bottom Ad Elements
        const bottomAdSlider = document.getElementById('bottomAdSlider');
        const bottomAdTimer = document.getElementById('bottomAdTimer');
        const bottomTimerCount = document.getElementById('bottomTimerCount');
        const closeBottomAd = document.getElementById('closeBottomAd');
        const bottomAdsenseContainer = document.getElementById('bottomAdsenseContainer');
        
        // Volume Slider Elements
        const volumeSliderVertical = document.getElementById('volumeSliderVertical');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeSliderTrack = document.getElementById('volumeSliderTrack');
        const volumeSliderFill = document.getElementById('volumeSliderFill');
        const volumeSliderHandle = document.getElementById('volumeSliderHandle');
        const volumePercentage = document.getElementById('volumePercentage');
        
        // State
        let isPlaying = false;
        let isMuted = false;
        let videoActive = false;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let adsenseAdLoaded = false;
        let bottomAdsenseLoaded = false;
        let adClosed = false;
        let countdownValue = 8;
        let countdownInterval;
        let languageIndex = 0;
        const languages = [
            { code: 'en', text: 'Please wait while the video starts...' },
            { code: 'el', text: 'Παρακαλώ περιμένετε ενώ ξεκινά το βίντεο...' },
            { code: 'de', text: 'Bitte warten Sie, während das Video startet...' }
        ];
        
        // Video Title - Consistent across all platforms
        const VIDEO_TITLE = "Exclusive Live Performance - Watch Now";
        const VIDEO_DESCRIPTION = "Don't miss this exclusive live performance video. Must watch content!";
        const SHARE_URL = "https://blog.franklymadear.com/videos/three/index.html";
        
        // Ad Variables
        let bottomAdInterval;
        let bottomAdTimerInterval;
        let bottomAdTimerValue = 15; // 15 δευτερόλεπτα για bottom ad
        let bottomAdsActive = false;
        
        // Volume state
        let currentVolume = 1.0;
        let isDraggingVolume = false;
        
        // Set video title everywhere
        function setVideoTitleEverywhere() {
            // Set page title
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            // Set title in overlay
            videoTitle.textContent = VIDEO_TITLE;
            
            // Update meta tags
            updateMetaTags();
        }
        
        // Update meta tags
        function updateMetaTags() {
            // Update Open Graph tags
            document.querySelector('meta[property="og:title"]').setAttribute('content', VIDEO_TITLE);
            document.querySelector('meta[property="og:description"]').setAttribute('content', VIDEO_DESCRIPTION);
            
            // Update Twitter tags
            document.querySelector('meta[name="twitter:title"]').setAttribute('content', VIDEO_TITLE);
            document.querySelector('meta[name="twitter:description"]').setAttribute('content', "Check out this exclusive live performance video.");
        }
        
        // FORCE SOUND ON - ΑΥΤΟΜΑΤΗ ΕΝΕΡΓΟΠΟΙΗΣΗ ΗΧΟΥ
        function forceAudioEnabled() {
            console.log("🔊 Force enabling audio...");
            
            // Set video to unmuted with max volume
            mainVideo.muted = false;
            mainVideo.volume = currentVolume;
            isMuted = false;
            
            // Update UI
            muteBtn.textContent = '🔊';
            updateVerticalVolumeSlider();
            
            // Try to play with sound
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log("✅ Audio successfully enabled and playing");
                }).catch(error => {
                    console.log("⚠️ Auto-play with sound blocked, trying muted...");
                    mainVideo.muted = true;
                    mainVideo.play().then(() => {
                        console.log("✅ Video playing muted due to browser restrictions");
                        isMuted = true;
                        muteBtn.textContent = '🔇';
                        updateVerticalVolumeSlider();
                    });
                });
            }
        }
        
        // Start countdown timer
        function startCountdown() {
            countdownValue = 8;
            countdownTimer.textContent = countdownValue;
            
            // Start language rotation
            rotateLanguages();
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                countdownValue--;
                countdownTimer.textContent = countdownValue;
                
                if (countdownValue <= 0) {
                    clearInterval(countdownInterval);
                    if (!adClosed) {
                        startVideo();
                    }
                }
            }, 1000);
        }
        
        // Rotate languages
        function rotateLanguages() {
            if (languageIndex >= languages.length) languageIndex = 0;
            waitText.textContent = languages[languageIndex].text;
            languageIndex++;
            
            setInterval(() => {
                if (languageIndex >= languages.length) languageIndex = 0;
                waitText.textContent = languages[languageIndex].text;
                languageIndex++;
            }, 2000);
        }
        
        // Load AdSense ad for center overlay
        function loadAdsenseAd() {
            if (!adsenseAdLoaded) {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log("AdSense ad loaded in center overlay");
                    adsenseAdLoaded = true;
                    
                    startCountdown();
                    
                } catch (e) {
                    console.log("AdSense load error:", e);
                }
            }
        }
        
        // Load AdSense ad for bottom
        function loadBottomAdsenseAd() {
            try {
                bottomAdsenseContainer.innerHTML = '';
                
                const adContainer = document.createElement('ins');
                adContainer.className = 'adsbygoogle';
                adContainer.style.display = 'block';
                adContainer.style.width = '100%';
                adContainer.style.height = '100%';
                adContainer.setAttribute('data-ad-client', 'ca-pub-3186700611266549');
                adContainer.setAttribute('data-ad-slot', '6330498148');
                adContainer.setAttribute('data-ad-format', 'auto');
                adContainer.setAttribute('data-full-width-responsive', 'true');
                
                bottomAdsenseContainer.appendChild(adContainer);
                (adsbygoogle = window.adsbygoogle || []).push({});
                
                console.log("AdSense ad loaded in bottom (8% height)");
                bottomAdsenseLoaded = true;
                
                return true;
            } catch (e) {
                console.log("Bottom AdSense load error:", e);
                return false;
            }
        }
        
        // Show bottom ad
        function showBottomAd() {
            if (!bottomAdsActive || !isPlaying) return;
            
            console.log("⬆️ Showing bottom ad (8% height)");
            
            const adLoaded = loadBottomAdsenseAd();
            
            if (!adLoaded) {
                setTimeout(() => {
                    if (bottomAdsActive && isPlaying) {
                        showBottomAd();
                    }
                }, 2000);
                return;
            }
            
            bottomAdSlider.classList.add('show');
            
            bottomAdTimerValue = 15;
            bottomTimerCount.textContent = bottomAdTimerValue;
            
            clearInterval(bottomAdTimerInterval);
            bottomAdTimerInterval = setInterval(() => {
                bottomAdTimerValue--;
                bottomTimerCount.textContent = bottomAdTimerValue;
                
                if (bottomAdTimerValue <= 0) {
                    clearInterval(bottomAdTimerInterval);
                    hideBottomAd();
                }
            }, 1000);
            
            clearTimeout(bottomAdInterval);
            bottomAdInterval = setTimeout(() => {
                hideBottomAd();
            }, 15000);
        }
        
        // Hide bottom ad
        function hideBottomAd() {
            console.log("⬇️ Hiding bottom ad");
            bottomAdSlider.classList.remove('show');
            clearInterval(bottomAdTimerInterval);
            clearTimeout(bottomAdInterval);
            
            if (bottomAdsActive && isPlaying) {
                setTimeout(() => {
                    if (bottomAdsActive && isPlaying) {
                        showBottomAd();
                    }
                }, 0); // ΑΜΕΣΑ ΜΕΤΑ την παύση
            }
        }
        
        // Start bottom ad rotation
        function startAds() {
            if (!bottomAdsActive) {
                bottomAdsActive = true;
                console.log("▶️ Starting bottom ad rotation (15s on, 0s off, continuous) - 8% height");
                
                setTimeout(() => {
                    if (bottomAdsActive && isPlaying) {
                        showBottomAd();
                    }
                }, 3000);
            }
        }
        
        // Stop all ads
        function stopAds() {
            bottomAdsActive = false;
            
            bottomAdSlider.classList.remove('show');
            
            clearInterval(bottomAdTimerInterval);
            clearTimeout(bottomAdInterval);
            
            console.log("⏹️ Stopped all ads");
        }
        
        // Update vertical volume slider
        function updateVerticalVolumeSlider() {
            const volume = isMuted ? 0 : currentVolume;
            const height = volume * 100 + '%';
            volumeSliderFill.style.height = height;
            
            const handlePosition = (1 - volume) * 100;
            volumeSliderHandle.style.bottom = handlePosition + '%';
            
            volumePercentage.textContent = Math.round(volume * 100) + '%';
            volumeIcon.textContent = volume === 0 ? '🔇' : volume < 0.5 ? '🔉' : '🔊';
            
            // Update mute button
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Set volume from vertical slider
        function setVolumeFromVertical(event) {
            const rect = volumeSliderTrack.getBoundingClientRect();
            let y = event.clientY - rect.top;
            y = Math.max(0, Math.min(y, rect.height));
            
            const volume = 1 - (y / rect.height);
            currentVolume = volume;
            
            mainVideo.volume = currentVolume;
            mainVideo.muted = currentVolume === 0;
            isMuted = currentVolume === 0;
            
            updateVerticalVolumeSlider();
            showControls();
        }
        
        // Start video - WITH SOUND AUTOMATICALLY ENABLED
        function startVideo() {
            if (videoStarted) return;
            
            console.log('▶️ Starting video WITH SOUND AUTOMATICALLY ENABLED');
            videoStarted = true;
            adClosed = true;
            
            clearInterval(countdownInterval);
            
            largeCenterAd.style.opacity = '0';
            largeCenterAd.style.pointerEvents = 'none';
            
            setTimeout(() => {
                videoContainer.classList.add('active');
                
                setTimeout(() => {
                    videoPlayOverlay.classList.add('hidden');
                }, 1500);
                
                // FORCE AUDIO TO BE ENABLED IMMEDIATELY
                forceAudioEnabled();
                
                const playPromise = mainVideo.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('✅ Video playback started successfully');
                        isPlaying = true;
                        videoActive = true;
                        playPauseBtn.textContent = '⏸️';
                        
                        showControls();
                        startAds();
                        
                    }).catch(e => {
                        console.error('❌ Video play failed:', e);
                        mainVideo.muted = true;
                        mainVideo.play().then(() => {
                            console.log('✅ Video started muted (user can unmute)');
                            isPlaying = true;
                            videoActive = true;
                            playPauseBtn.textContent = '⏸️';
                            showControls();
                            startAds();
                        });
                    });
                }
                
            }, 400);
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '0.9';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0.5';
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                    if (!bottomAdsActive) {
                        startAds();
                    }
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
                stopAds();
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            updateVerticalVolumeSlider();
            showControls();
        }
        
        // Seek video
        function seekVideo(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const percent = x / rect.width;
            
            mainVideo.currentTime = percent * videoDuration;
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            updateVerticalVolumeSlider();
            
            forceAudioEnabled();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
            playPauseBtn.textContent = '▶️';
            stopAds();
            
            videoPlayOverlay.classList.remove('hidden');
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            stopAds();
            
            largeCenterAd.style.opacity = '1';
            largeCenterAd.style.pointerEvents = 'auto';
            largeCenterAd.innerHTML = `
                <div class="large-ad-container" style="background: rgba(34, 34, 34, 0.95); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);">
                    <div style="text-align: center; padding: 30px; color: white;">
                        <div style="font-size: 50px; margin-bottom: 15px;">❌</div>
                        <div style="font-size: 20px; margin-bottom: 12px; font-weight: bold;">Video Error</div>
                        <div style="font-size: 16px; margin-bottom: 20px; opacity: 0.9;">
                            Cannot load video content
                        </div>
                        <button onclick="location.reload()" style="background: #1d9bf0; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; backdrop-filter: blur(10px);">
                            Reload Page
                        </button>
                    </div>
                </div>
            `;
        });
        
        // Click handlers
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', togglePlayPause);
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Bottom ad close button
        closeBottomAd.addEventListener('click', () => {
            hideBottomAd();
        });
        
        // Volume slider events
        volumeSliderTrack.addEventListener('click', setVolumeFromVertical);
        
        volumeSliderHandle.addEventListener('mousedown', (e) => {
            isDraggingVolume = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingVolume) {
                setVolumeFromVertical(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingVolume = false;
        });
        
        // Touch events for volume slider
        volumeSliderTrack.addEventListener('touchstart', (e) => {
            isDraggingVolume = true;
            setVolumeFromVertical(e.touches[0]);
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingVolume) {
                setVolumeFromVertical(e.touches[0]);
            }
        });
        
        document.addEventListener('touchend', () => {
            isDraggingVolume = false;
        });
        
        // Auto start video if user clicks on the large ad
        largeCenterAd.addEventListener('click', (e) => {
            if (e.target === largeCenterAd || e.target.closest('.large-ad-container')) {
                startVideo();
            }
        });
        
        // Show controls on touch/mouse move
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            // Set video title everywhere
            setVideoTitleEverywhere();
            
            // Load AdSense ad after page loads
            setTimeout(loadAdsenseAd, 300);
            
            document.addEventListener('touchmove', function(e) {
                if(e.scale !== 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        });
        
        // Prevent right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ FmD Video Player ready');
        console.log('🎯 Features:');
        console.log('  - Video Title: "' + VIDEO_TITLE + '"');
        console.log('  - NO Social Share Buttons (removed)');
        console.log('  - Bottom Ad: 8% height (50% smaller), 15s continuous');
        console.log('  - Automatic Sound ON');
        console.log('  - Vertical Volume Slider on right side');
        
        // Add user gesture handler for audio
        document.addEventListener('click', function() {
            if (videoStarted && isMuted) {
                mainVideo.muted = false;
                isMuted = false;
                updateVerticalVolumeSlider();
            }
        });
        
        mainVideo.addEventListener('play', () => {
            console.log('🎬 Video started playing - Sound should be ON');
        });
    </script>
</body>
</html>
