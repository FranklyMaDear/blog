    <!-- JavaScript για απόκρυψη URL και block popups -->
    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        
        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                document.body.style.height = window.innerHeight + 'px';
                
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
                
                // Αποτροπή cookie popups
                blockConsentPopups();
                
                // Monitor για νέα popups
                monitorForPopups();
            }, 0);
        });
        
        // Function to block consent popups
        function blockConsentPopups() {
            // Remove existing popups
            document.querySelectorAll('.fc-consent-root, .fc-dialog-container, .as-oil, .cc_banner-wrapper, .cookie-consent, .privacy-banner, [class*="consent"], [class*="cookie"], [class*="privacy"]').forEach(el => {
                el.remove();
            });
            
            // Block Google CMP
            window.__tcfapi = function() {};
            window.__cmp = function() {};
            window.tcfApi = {};
            
            // Block TikTok and other ad consent popups
            const style = document.createElement('style');
            style.textContent = `
                .fc-consent-root,
                .fc-dialog-container,
                .as-oil,
                .cc_banner-wrapper,
                .cookie-consent,
                .privacy-banner,
                .tiktok-consent,
                [class*="consent"],
                [class*="cookie"],
                [class*="privacy"],
                [id*="consent"],
                [id*="cookie"],
                [id*="privacy"],
                iframe[src*="tiktok"],
                iframe[src*="consent"],
                iframe[src*="cookie"],
                iframe[src*="privacy"] {
                    display: none !important;
                    visibility: hidden !important;
                    opacity: 0 !important;
                    height: 0 !important;
                    width: 0 !important;
                    overflow: hidden !important;
                    position: fixed !important;
                    top: -9999px !important;
                    left: -9999px !important;
                    pointer-events: none !important;
                }
                
                /* Block Privacy and cookie settings text */
                div:has(> div:contains("Privacy and cookie settings")),
                div:contains("Managed by Google"),
                div:contains("Complies with IAB TCF"),
                div:contains("CMP ID:"),
                div:contains("Privacy settings"),
                div:contains("Cookie settings") {
                    display: none !important;
                    visibility: hidden !important;
                    opacity: 0 !important;
                }
            `;
            document.head.appendChild(style);
        }
        
        // Monitor for new popups
        function monitorForPopups() {
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1) {
                            const el = node;
                            if (el.classList) {
                                const classList = Array.from(el.classList);
                                if (classList.some(cls => 
                                    cls.includes('consent') || 
                                    cls.includes('cookie') || 
                                    cls.includes('privacy') ||
                                    cls.includes('fc-') ||
                                    cls.includes('as-oil') ||
                                    cls.includes('cc_')
                                )) {
                                    el.remove();
                                }
                            }
                            
                            if (el.tagName === 'IFRAME') {
                                const src = el.src || '';
                                if (src.includes('tiktok') || 
                                    src.includes('consent') || 
                                    src.includes('cookie') || 
                                    src.includes('privacy')) {
                                    el.remove();
                                }
                            }
                            
                            // Check text content for privacy messages
                            if (el.textContent && (
                                el.textContent.includes('Privacy and cookie settings') ||
                                el.textContent.includes('Managed by Google') ||
                                el.textContent.includes('Complies with IAB TCF') ||
                                el.textContent.includes('CMP ID:')
                            )) {
                                el.remove();
                            }
                        }
                    });
                });
            });
            
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        }
    </script>

        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const firstFramePreview = document.getElementById('firstFramePreview');
        const firstFrameCanvas = document.getElementById('firstFrameCanvas');
        const playButton = document.getElementById('playButton');
        const seekContainer = document.getElementById('seekContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const adOverlay = document.getElementById('adOverlay');
        const adText = document.getElementById('adText');
        const timeDisplay = document.getElementById('timeDisplay');
        const seekBar = document.getElementById('seekBar');
        const seekProgress = document.getElementById('seekProgress');
        const seekTooltip = document.getElementById('seekTooltip');
        
        // Banner Ad Elements
        const bannerAd = document.getElementById("bannerAd");
        const closeBannerAd = document.getElementById("closeBannerAd");
        const bannerTimerCount = document.getElementById("bannerTimerCount");
        const adCta = document.getElementById("adCta");
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let hasAutoPlayed = false;
        let isSeeking = false;
        let videoWidth = 0;
        let videoHeight = 0;
        let hideSeekBarTimeout = null;
        let firstFrameExtracted = false;
        
        // Ad Variables
        let adShown = false;
        let bannerAdShown = false;
        let videoStartTime = null;
        let bannerTimer;
        let bannerCountdownTimer;
        let bannerCountdownValue = 10;
        let videoActive = false;
        let videoDuration = 59;
        
        // Extract first frame from video
        function extractFirstFrame() {
            console.log('Extracting first frame from video...');
            
            const tempVideo = document.createElement('video');
            tempVideo.crossOrigin = 'anonymous';
            tempVideo.muted = true;
            tempVideo.preload = 'metadata';
            
            tempVideo.addEventListener('loadeddata', function() {
                console.log('Video metadata loaded for frame extraction');
                tempVideo.currentTime = 0.1;
            }, false);
            
            tempVideo.addEventListener('seeked', function() {
                console.log('Video seeked, capturing frame...');
                
                const canvas = firstFrameCanvas;
                const ctx = canvas.getContext('2d');
                canvas.width = tempVideo.videoWidth || 1280;
                canvas.height = tempVideo.videoHeight || 720;
                ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                
                console.log('First frame captured:', canvas.width, 'x', canvas.height);
                firstFrameCanvas.classList.add('loaded');
                
                tempVideo.src = '';
                tempVideo.load();
                firstFrameExtracted = true;
                mainVideo.classList.add('visible');
                
            }, false);
            
            tempVideo.addEventListener('error', function(e) {
                console.error('Error extracting first frame:', e);
                fallbackToThumbnail();
            }, false);
            
            tempVideo.src = 'https://blog.franklymadear.com/videos/three/video99.mp4';
            tempVideo.load();
            
            setTimeout(() => {
                if (!firstFrameExtracted) {
                    console.log('Frame extraction timeout, using fallback');
                    fallbackToThumbnail();
                }
            }, 3000);
        }
        
        function fallbackToThumbnail() {
            console.log('Using thumbnail as fallback');
            firstFramePreview.innerHTML = `
                <img src="https://blog.franklymadear.com/videos/three/thumbnail99.png" 
                     class="first-frame-img loaded"
                     alt="Έχω πάει με πολλούς - Video Thumbnail"
                     onerror="this.style.display='none';">
            `;
            firstFrameExtracted = true;
            mainVideo.classList.add('visible');
        }
        
        // BANNER AD FUNCTIONS - 25% της οθόνης
        function showBannerAd() {
            bannerAdShown = true;
            bannerCountdownValue = 10;
            bannerTimerCount.textContent = bannerCountdownValue;
            bannerAd.classList.add('show');
            startBannerCountdown();
            
            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                closeBannerAdFunc();
            }, 10000);
            
            // Load AdSense ad - MANUAL PUSH ONLY
            setTimeout(() => {
                try {
                    // ΜΟΝΟ αν δεν υπάρχουν cookie popups
                    if (!document.querySelector('.fc-consent-root, .fc-dialog-container, .as-oil')) {
                        const adContainer = document.createElement('div');
                        adContainer.style.cssText = 'width:100%;height:100%;';
                        adContainer.innerHTML = `
                            <ins class="adsbygoogle"
                                 style="display:block"
                                 data-ad-format="autorelaxed"
                                 data-ad-client="ca-pub-3186700611266549"
                                 data-ad-slot="9660744817"></ins>
                        `;
                        
                        const bannerContent = document.querySelector('.ad-content-mini');
                        if (bannerContent && !document.querySelector('.adsbygoogle')) {
                            bannerContent.appendChild(adContainer);
                            (adsbygoogle = window.adsbygoogle || []).push({});
                            console.log("AdSense autorelaxed ad loaded");
                        }
                    }
                } catch (e) {
                    console.log("Ad load error:", e);
                }
            }, 500);
            
            console.log("Banner ad shown for 10 seconds (25% of screen)");
        }
        
        function startBannerCountdown() {
            clearInterval(bannerCountdownTimer);
            bannerCountdownTimer = setInterval(() => {
                bannerCountdownValue--;
                bannerTimerCount.textContent = bannerCountdownValue;
                
                if (bannerCountdownValue <= 0) {
                    clearInterval(bannerCountdownTimer);
                }
            }, 1000);
        }
        
        function closeBannerAdFunc() {
            bannerAd.classList.remove('show');
            clearInterval(bannerCountdownTimer);
            clearTimeout(bannerTimer);
            
            console.log("Banner ad closed");
            
            // Επόμενη διαφήμιση μετά από 20 δευτερόλεπτα
            setTimeout(() => {
                if (videoActive && isPlaying) {
                    showBannerAd();
                }
            }, 20000);
        }
        
        // VIDEO PLAYER FUNCTIONS
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTime() {
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                videoDuration = mainVideo.duration;
                const progress = (mainVideo.currentTime / videoDuration) * 100;
                seekProgress.style.width = `${progress}%`;
                timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
            } else {
                timeDisplay.textContent = `00:01 / ${formatTime(videoDuration)}`;
            }
        }
        
        function showSeekBar() {
            seekContainer.classList.add('active');
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                if (!isSeeking) {
                    seekContainer.classList.remove('active');
                }
            }, 3000);
        }
        
        function hideSeekBar() {
            if (!isSeeking) {
                seekContainer.classList.remove('active');
            }
        }
        
        function updateAdDisplay() {
            adText.textContent = "Έχω πάει με πολλούς";
            
            adOverlay.replaceWith(adOverlay.cloneNode(true));
            const newAdOverlay = document.getElementById('adOverlay');
            
            newAdOverlay.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('Ad overlay clicked');
            });
            
            newAdOverlay.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('Ad overlay touched');
            });
        }
        
        function seekToTime(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * (videoDuration || 59);
            mainVideo.currentTime = time;
            
            if (mainVideo.readyState < 3) {
                loadingSpinner.style.display = 'block';
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                }, 500);
            }
            
            console.log(`Seeking to: ${formatTime(time)}`);
        }
        
        function updateSeekTooltip(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * (videoDuration || 59);
            seekTooltip.textContent = formatTime(time);
            seekTooltip.style.left = `${percent * 100}%`;
            seekTooltip.style.opacity = '1';
        }
        
        function hideSeekTooltip() {
            seekTooltip.style.opacity = '0';
        }
        
        function startVideo() {
            console.log('Play button clicked - starting video');
            videoActive = true;
            playButton.style.display = 'none';
            
            firstFramePreview.style.opacity = '0';
            setTimeout(() => {
                firstFramePreview.style.display = 'none';
            }, 500);
            
            mainVideo.play().then(() => {
                console.log('Video playback started successfully');
                isPlaying = true;
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                }
                
                updateAdDisplay();
                videoStartTime = Date.now();
                
                if (!adShown) {
                    setTimeout(() => {
                        showBannerAd();
                        adShown = true;
                    }, 2000);
                }
                
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
                
                mainVideo.muted = true;
                mainVideo.play().then(() => {
                    console.log('Video started with muted fallback');
                    isPlaying = true;
                    videoActive = true;
                    playButton.style.display = 'none';
                    firstFramePreview.style.opacity = '0';
                    
                    setTimeout(() => {
                        firstFramePreview.style.display = 'none';
                    }, 500);
                    
                    videoStartTime = Date.now();
                    
                    if (!adShown) {
                        setTimeout(() => {
                            showBannerAd();
                            adShown = true;
                        }, 2000);
                    }
                });
            });
        }
        
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
            }
        }
        
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                videoActive = true;
                playButton.style.display = 'none';
                firstFramePreview.style.opacity = '0';
                hasAutoPlayed = true;
                
                setTimeout(() => {
                    firstFramePreview.style.display = 'none';
                }, 500);
                
                videoStartTime = Date.now();
                
                if (!adShown) {
                    setTimeout(() => {
                        showBannerAd();
                        adShown = true;
                    }, 2000);
                }
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                    }
                }, 1000);
                
                updateAdDisplay();
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            videoDuration = mainVideo.duration;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight, 'Duration:', videoDuration);
            
            updateTime();
            updateAdDisplay();
            extractFirstFrame();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            }
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            
            firstFramePreview.innerHTML = `
                <div style="text-align: center; padding: 20px; color: white;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 10px; opacity: 0.9;">
                        Cannot load video: https://blog.franklymadear.com/videos/three/video99.mp4
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        mainVideo.addEventListener('click', togglePlayPause);
        firstFramePreview.addEventListener('click', startVideo);
        
        mainVideo.addEventListener('click', () => {
            if (isPlaying) {
                showSeekBar();
            }
        });
        
        // Banner Ad Close Handler
        closeBannerAd.addEventListener("click", () => {
            closeBannerAdFunc();
        });
        
        bannerAd.addEventListener("click", (e) => {
            if (e.target === bannerAd) {
                closeBannerAdFunc();
            }
        });
        
        // CTA Button click
        adCta.addEventListener("click", (e) => {
            e.preventDefault();
            console.log("CTA clicked - redirecting to blog");
            window.open("https://blog.franklymadear.com", "_blank");
            closeBannerAdFunc();
        });
        
        // PAGE VISIBILITY TRACKING
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                videoActive = false;
                if (isPlaying) {
                    mainVideo.pause();
                    isPlaying = false;
                }
            } else {
                videoActive = true;
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    showSeekBar();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(videoDuration, mainVideo.currentTime + 5);
                    showSeekBar();
                    break;
            }
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            updateAdDisplay();
            
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            // Extra protection against popups
            setInterval(() => {
                document.querySelectorAll('.fc-consent-root, .fc-dialog-container, .as-oil, .cc_banner-wrapper, [class*="consent"], [class*="cookie"], [class*="privacy"], iframe[src*="tiktok"]').forEach(el => {
                    el.remove();
                });
            }, 1000);
        });
        
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - No popups, 25% banner ad');
        
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - Έχω πάει με πολλούς - FmD @FmD699');
        });
    </script>
</body>
</html>
