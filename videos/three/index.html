    <script>
        // Απόκρυψη URL bar σε mobile
        if ('scrollRestoration' in history) {

        // Αποτροπή εμφάνισης URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
                
                // Προσθήκη αυτής της γραμμής για iOS
                document.body.style.height = window.innerHeight + 'px';
                
                // Αποτροπή zoom
                document.addEventListener('touchmove', function(e) {
                    if(e.scale !== 1) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                // Αποτροπή κινητών URL bars
                var currentScroll = 0;
                window.addEventListener('scroll', function() {
                    currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                    window.scrollTo(0, currentScroll === 0 ? 1 : currentScroll);
                });
            }, 0);
        });

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const thumbnailOverlay = document.getElementById('thumbnailOverlay');
        const playButton = document.getElementById('playButton');
        const seekContainer = document.getElementById('seekContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const adOverlay = document.getElementById('adOverlay');
        const adText = document.getElementById('adText');
        const timeDisplay = document.getElementById('timeDisplay');
        const seekBar = document.getElementById('seekBar');
        const seekProgress = document.getElementById('seekProgress');
        const seekTooltip = document.getElementById('seekTooltip');
        
        // Banner Ad Elements
        const bannerAd = document.getElementById("bannerAd");
        const closeBannerAd = document.getElementById("closeBannerAd");
        const bannerTimerCount = document.getElementById("bannerTimerCount");
        const adCta = document.getElementById("adCta");
        
        // State
        let isPlaying = false;
        let isMuted = true;
        let hasAutoPlayed = false;
        let isSeeking = false;
        let videoWidth = 0;
        let videoHeight = 0;
        let hideSeekBarTimeout = null;
        
        // Ad Variables
        let adShown = false;
        let bannerAdShown = false;
        let videoStartTime = null;
        let bannerTimer;
        let bannerCountdownTimer;
        let nextAdCountdownTimer;
        let bannerCountdownValue = 10; // 10 δευτερόλεπτα για πρώτη διαφήμιση
        let nextAdCountdownValue = 20; // 20 δευτερόλεπτα για επόμενη διαφήμιση
        let videoActive = false;
        let videoDuration = 59;
        
        // BANNER AD FUNCTIONS
        function showBannerAd() {
            // Μάρκαρε ότι εμφανίστηκε
            bannerAdShown = true;
            
            // Reset countdown
            bannerCountdownValue = 10;
            bannerTimerCount.textContent = bannerCountdownValue;
            
            // Εμφάνιση banner (από ΚΑΤΩ προς ΠΑΝΩ)
            bannerAd.classList.add('show');
            
            // Start countdown
            startBannerCountdown();
            
            // Auto-close μετά από 10 δευτερόλεπτα
            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                closeBannerAdFunc();
            }, 10000);
            
            // Track ad impression
            console.log("Banner ad shown for 10 seconds");
        }
        
        function startBannerCountdown() {
            clearInterval(bannerCountdownTimer);
            bannerCountdownTimer = setInterval(() => {
                bannerCountdownValue--;
                bannerTimerCount.textContent = bannerCountdownValue;
                
                if (bannerCountdownValue <= 0) {
                    clearInterval(bannerCountdownTimer);
                }
            }, 1000);
        }
        
        function closeBannerAdFunc() {
            bannerAd.classList.remove('show');
            clearInterval(bannerCountdownTimer);
            clearTimeout(bannerTimer);
            
            console.log("Banner ad closed");
            
            // Προγραμματισμός επόμενης διαφήμισης μετά από 20 δευτερόλεπτα
            setTimeout(() => {
                if (videoActive && isPlaying) {
                    showBannerAd();
                }
            }, 20000); // 20 δευτερόλεπτα για επόμενη διαφήμιση
        }
        
        // VIDEO PLAYER FUNCTIONS
        // Format time σε mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTime() {
            if (mainVideo.duration && !isNaN(mainVideo.duration)) {
                videoDuration = mainVideo.duration;
                const progress = (mainVideo.currentTime / videoDuration) * 100;
                seekProgress.style.width = `${progress}%`;
                timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
            } else {
                timeDisplay.textContent = `00:01 / ${formatTime(videoDuration)}`;
            }
        }
        
        // Show seek bar
        function showSeekBar() {
            seekContainer.classList.add('active');
            
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                if (!isSeeking) {
                    seekContainer.classList.remove('active');
                }
            }, 3000);
        }
        
        // Hide seek bar
        function hideSeekBar() {
            if (!isSeeking) {
                seekContainer.classList.remove('active');
            }
        }
        
        // Update ad display
        function updateAdDisplay() {
            adText.textContent = "Έχω πάει με πολλούς";
            
            adOverlay.replaceWith(adOverlay.cloneNode(true));
            const newAdOverlay = document.getElementById('adOverlay');
            
            newAdOverlay.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('Ad overlay clicked');
            });
            
            newAdOverlay.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('Ad overlay touched');
            });
        }
        
        // Seek to specific time
        function seekToTime(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * (videoDuration || 59);
            
            mainVideo.currentTime = time;
            
            if (mainVideo.readyState < 3) {
                loadingSpinner.style.display = 'block';
                
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                }, 500);
            }
            
            console.log(`Seeking to: ${formatTime(time)}`);
        }
        
        // Update seek tooltip
        function updateSeekTooltip(clientX) {
            const rect = seekBar.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            const time = percent * (videoDuration || 59);
            seekTooltip.textContent = formatTime(time);
            seekTooltip.style.left = `${percent * 100}%`;
            seekTooltip.style.opacity = '1';
        }
        
        // Hide seek tooltip
        function hideSeekTooltip() {
            seekTooltip.style.opacity = '0';
        }
        
        // Start video
        function startVideo() {
            console.log('Play button clicked - starting video');
            videoActive = true;
            playButton.style.display = 'none';
            
            mainVideo.play().then(() => {
                console.log('Video playback started successfully');
                isPlaying = true;
                thumbnailOverlay.style.opacity = '0';
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                if (isMuted) {
                    mainVideo.muted = false;
                    isMuted = false;
                }
                
                updateAdDisplay();
                videoStartTime = Date.now();
                
                // Εμφάνιση πρώτης BANNER AD μετά από 2 δευτερόλεπτα (10 δευτερόλεπτα διάρκεια)
                if (!adShown) {
                    setTimeout(() => {
                        showBannerAd();
                        adShown = true;
                    }, 2000);
                }
                
            }).catch(e => {
                console.error('Manual play failed:', e);
                playButton.style.display = 'flex';
                
                // Fallback: Try with muted
                mainVideo.muted = true;
                mainVideo.play().then(() => {
                    console.log('Video started with muted fallback');
                    isPlaying = true;
                    videoActive = true;
                    playButton.style.display = 'none';
                    thumbnailOverlay.style.opacity = '0';
                    
                    setTimeout(() => {
                        thumbnailOverlay.style.display = 'none';
                    }, 500);
                    
                    videoStartTime = Date.now();
                    
                    if (!adShown) {
                        setTimeout(() => {
                            showBannerAd();
                            adShown = true;
                        }, 2000);
                    }
                });
            });
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
            }
        }
        
        // Try autoplay for X player
        function tryAutoplay() {
            mainVideo.muted = true;
            mainVideo.play().then(() => {
                console.log('Autoplay successful for X player');
                isPlaying = true;
                videoActive = true;
                playButton.style.display = 'none';
                thumbnailOverlay.style.opacity = '0';
                hasAutoPlayed = true;
                
                setTimeout(() => {
                    thumbnailOverlay.style.display = 'none';
                }, 500);
                
                videoStartTime = Date.now();
                
                // Εμφάνιση startup ad
                if (!adShown) {
                    setTimeout(() => {
                        showBannerAd();
                        adShown = true;
                    }, 2000);
                }
                
                setTimeout(() => {
                    if (isPlaying) {
                        mainVideo.muted = false;
                        isMuted = false;
                    }
                }, 1000);
                
                updateAdDisplay();
                
            }).catch(e => {
                console.log('Autoplay failed:', e.message);
                playButton.style.display = 'flex';
            });
        }
        
        // Προσαρμογή thumbnail στο μέγεθος του βίντεο
        function adjustThumbnailSize() {
            if (videoWidth > 0 && videoHeight > 0) {
                thumbnailOverlay.style.width = `${videoWidth}px`;
                thumbnailOverlay.style.height = `${videoHeight}px`;
            }
        }
        
        // Mouse movement detection για εμφάνιση seek bar
        let mouseMoveTimeout;
        videoContainer.addEventListener('mousemove', () => {
            if (isPlaying) {
                showSeekBar();
                
                clearTimeout(mouseMoveTimeout);
                mouseMoveTimeout = setTimeout(hideSeekBar, 3000);
            }
        });
        
        videoContainer.addEventListener('mouseleave', () => {
            if (!isSeeking) {
                hideSeekBar();
            }
        });
        
        // Seek bar interaction
        seekBar.addEventListener('mousemove', (e) => {
            if (!mainVideo.duration || isNaN(mainVideo.duration)) return;
            updateSeekTooltip(e.clientX);
        });
        
        seekBar.addEventListener('mouseenter', () => {
            showSeekBar();
        });
        
        seekBar.addEventListener('mouseleave', () => {
            hideSeekTooltip();
            if (!isSeeking) {
                setTimeout(hideSeekBar, 1000);
            }
        });
        
        seekBar.addEventListener('click', (e) => {
            e.stopPropagation();
            seekToTime(e.clientX);
            
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                seekContainer.classList.remove('active');
            }, 2000);
        });
        
        seekBar.addEventListener('mousedown', () => {
            isSeeking = true;
            showSeekBar();
        });
        
        document.addEventListener('mouseup', () => {
            isSeeking = false;
        });
        
        // Touch support για seeking
        seekBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isSeeking = true;
            seekToTime(e.touches[0].clientX);
            showSeekBar();
        });
        
        seekBar.addEventListener('touchmove', (e) => {
            if (isSeeking) {
                e.preventDefault();
                updateSeekTooltip(e.touches[0].clientX);
                showSeekBar();
            }
        });
        
        seekBar.addEventListener('touchend', (e) => {
            e.stopPropagation();
            isSeeking = false;
            hideSeekTooltip();
            
            clearTimeout(hideSeekBarTimeout);
            hideSeekBarTimeout = setTimeout(() => {
                seekContainer.classList.remove('active');
            }, 2000);
        });
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            videoWidth = mainVideo.videoWidth;
            videoHeight = mainVideo.videoHeight;
            videoDuration = mainVideo.duration;
            
            console.log('Video dimensions:', videoWidth, 'x', videoHeight, 'Duration:', videoDuration);
            
            adjustThumbnailSize();
            updateTime();
            updateAdDisplay();
            
            const isEmbedded = window.self !== window.top;
            if (isEmbedded) {
                console.log('Running in X (Twitter) Player');
                tryAutoplay();
            }
        });
        
        mainVideo.addEventListener('timeupdate', updateTime);
        
        mainVideo.addEventListener('ended', () => {
            isPlaying = false;
            videoActive = false;
        });
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            
            thumbnailOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px; color: white;">
                    <div style="font-size: 50px; margin-bottom: 20px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 10px; opacity: 0.9;">
                        Cannot load video: https://blog.franklymadear.com/videos/three/video99.mp4
                    </div>
                    <div style="font-size: 14px; opacity: 0.7;">
                        Please check if the video file exists
                    </div>
                </div>
            `;
            playButton.style.display = 'none';
        });
        
        // Click handlers
        playButton.addEventListener('click', startVideo);
        mainVideo.addEventListener('click', togglePlayPause);
        thumbnailOverlay.addEventListener('click', startVideo);
        
        // Video click για εμφάνιση seek bar
        mainVideo.addEventListener('click', () => {
            if (isPlaying) {
                showSeekBar();
            }
        });
        
        // Banner Ad Close Handler
        closeBannerAd.addEventListener("click", () => {
            closeBannerAdFunc();
        });
        
        // Close banner by clicking outside
        bannerAd.addEventListener("click", (e) => {
            if (e.target === bannerAd) {
                closeBannerAdFunc();
            }
        });
        
        // CTA Button click
        adCta.addEventListener("click", (e) => {
            e.preventDefault();
            console.log("CTA clicked - redirecting to blog");
            window.open("https://blog.franklymadear.com", "_blank");
            closeBannerAdFunc();
        });
        
        // PAGE VISIBILITY TRACKING
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                videoActive = false;
                
                if (isPlaying) {
                    mainVideo.pause();
                    isPlaying = false;
                }
            } else {
                videoActive = true;
            }
        });
        
        // Keyboard shortcuts για seeking
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!hasAutoPlayed) startVideo();
                    else togglePlayPause();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 5);
                    showSeekBar();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    mainVideo.currentTime = Math.min(videoDuration, mainVideo.currentTime + 5);
                    showSeekBar();
                    break;
            }
        });
        
        // Auto play on interaction
        document.addEventListener('click', () => {
            if (!hasAutoPlayed && !isPlaying) {
                tryAutoplay();
            }
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            updateAdDisplay();
            
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
        });
        
        // Αποτροπή αντιγραφής URL
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('FmD Video Player ready - Mini banner ad system');
        
        // Track video views
        mainVideo.addEventListener('play', () => {
            console.log('Video started playing - Έχω πάει με πολλούς - FmD @FmD699');
        });
    </script>
</body>
</html>
