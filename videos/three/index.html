    <!-- ========== MAXIMUM REVENUE AD SYSTEM SCRIPT ========== -->
    <script>
        // ========== REVENUE TRACKING SYSTEM ==========
        class RevenueOptimizer {
            constructor() {
                this.revenueData = {
                    totalEarnings: 0,
                    adImpressions: 0,
                    activeAdSlots: 6,
                    estimatedCPM: {
                        preroll: 10,    // €10 CPM
                        interstitial: 7, // €7 CPM
                        floating: 6,    // €6 CPM
                        banner: 3,      // €3 CPM
                        midroll: 9      // €9 CPM
                    }
                };
                
                this.adSchedule = {
                    preroll: { duration: 5, active: true },
                    interstitial: { interval: 60000, duration: 10, active: true }, // Every 60s
                    floating: { interval: 45000, duration: 20, active: true },     // Every 45s
                    banner: { continuous: true, active: true },
                    midroll: { triggers: [30, 90, 150], duration: 15, active: true } // At 30s, 90s, 150s
                };
            }
            
            calculateEarnings() {
                let total = 0;
                total += (this.revenueData.adImpressions * this.revenueData.estimatedCPM.preroll) / 1000;
                total += (this.revenueData.adImpressions * this.revenueData.estimatedCPM.interstitial) / 2000;
                total += (this.revenueData.adImpressions * this.revenueData.estimatedCPM.floating) / 1500;
                total += (this.revenueData.adImpressions * this.revenueData.estimatedCPM.banner) / 100;
                total += (this.revenueData.adImpressions * this.revenueData.estimatedCPM.midroll) / 3000;
                
                this.revenueData.totalEarnings = total;
                return total;
            }
            
            logAdImpression(adType) {
                this.revenueData.adImpressions++;
                console.log(`💰 Ad Impression: ${adType} | Total: ${this.revenueData.adImpressions}`);
                console.log(`📈 Estimated Earnings: €${this.calculateEarnings().toFixed(2)}`);
            }
        }

        // ========== AD SYSTEM INITIALIZATION ==========
        const revenueOptimizer = new RevenueOptimizer();
        
        // DOM Elements
        const prerollAd = document.getElementById('prerollAd');
        const prerollCountdown = document.getElementById('prerollCountdown');
        
        const interstitialAd = document.getElementById('interstitialAd');
        const floatingAd = document.getElementById('floatingAd');
        const floatingClose = document.getElementById('floatingClose');
        const bottomBannerAd = document.getElementById('bottomBannerAd');
        const midrollAd = document.getElementById('midrollAd');
        const midrollCountdown = document.getElementById('midrollCountdown');
        
        const videoPlayer = document.getElementById('videoPlayer');
        const mainVideo = document.getElementById('mainVideo');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // State Variables
        let isPlaying = false;
        let isMuted = true;
        let videoDuration = 0;
        let videoCurrentTime = 0;
        let controlsTimeout;
        let adTimers = {};
        let midrollTriggers = [30, 90, 150]; // Show mid-roll ads at these seconds
        let currentMidrollIndex = 0;
        
        // ========== AD LOADING SYSTEM ==========
        function loadAllAds() {
            console.log('🚀 Loading all premium ad slots for maximum revenue...');
            
            // Load Pre-roll Ad
            setTimeout(() => loadAdSenseAd('prerollAd'), 500);
            
            // Load Interstitial Ad
            setTimeout(() => loadAdSenseAd('interstitialAd'), 1000);
            
            // Load Floating Ad
            setTimeout(() => loadAdSenseAd('floatingAd'), 1500);
            
            // Load Banner Ad
            setTimeout(() => loadAdSenseAd('bottomBannerAd'), 2000);
            
            // Load Mid-roll Ad
            setTimeout(() => loadAdSenseAd('midrollAd'), 2500);
            
            console.log('✅ All premium ad slots loaded');
            console.log('🎯 Revenue Strategy: Multi-layer ad stacking');
        }
        
        function loadAdSenseAd(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const adElement = container.querySelector('ins.adsbygoogle');
            if (!adElement) return;
            
            try {
                if (typeof adsbygoogle !== 'undefined') {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log(`✅ Ad loaded: ${containerId}`);
                }
            } catch (e) {
                console.log(`⚠️ Error loading ad in ${containerId}:`, e);
            }
        }
        
        // ========== PRE-ROLL AD SYSTEM (HIGHEST CPM) ==========
        function startPreRollAd() {
            console.log('🎬 Starting Pre-roll Video Ad (€10-15 CPM)');
            revenueOptimizer.logAdImpression('preroll');
            
            let countdown = 5;
            prerollCountdown.textContent = countdown + 's';
            
            const timer = setInterval(() => {
                countdown--;
                prerollCountdown.textContent = countdown + 's';
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    hidePreRollAd();
                }
            }, 1000);
            
            adTimers.preroll = timer;
        }
        
        function hidePreRollAd() {
            prerollAd.style.opacity = '0';
            setTimeout(() => {
                prerollAd.style.display = 'none';
                startVideoPlayback();
                startAdSchedule();
            }, 500);
        }
        
        // ========== INTERSTITIAL AD SYSTEM ==========
        function showInterstitialAd() {
            console.log('🔄 Showing Interstitial Ad (€5-10 CPM)');
            revenueOptimizer.logAdImpression('interstitial');
            
            interstitialAd.classList.add('active');
            
            setTimeout(() => {
                interstitialAd.classList.remove('active');
            }, 10000); // 10 seconds
        }
        
        // ========== FLOATING VIDEO AD SYSTEM ==========
        function showFloatingAd() {
            console.log('🎯 Showing Floating Video Ad (€4-8 CPM)');
            revenueOptimizer.logAdImpression('floating');
            
            floatingAd.classList.add('visible');
            
            // Auto-hide after 20 seconds
            setTimeout(() => {
                floatingAd.classList.remove('visible');
            }, 20000);
        }
        
        floatingClose.addEventListener('click', () => {
            floatingAd.classList.remove('visible');
        });
        
        // ========== MID-ROLL AD SYSTEM ==========
        function checkMidrollAds(currentTime) {
            if (currentMidrollIndex < midrollTriggers.length) {
                const triggerTime = midrollTriggers[currentMidrollIndex];
                
                if (currentTime >= triggerTime && currentTime < triggerTime + 2) {
                    showMidrollAd();
                    currentMidrollIndex++;
                }
            }
        }
        
        function showMidrollAd() {
            console.log('🔥 Showing Mid-roll Video Ad (€6-12 CPM)');
            revenueOptimizer.logAdImpression('midroll');
            
            midrollAd.classList.add('active');
            mainVideo.pause();
            
            let countdown = 15;
            midrollCountdown.textContent = countdown + 's';
            
            const timer = setInterval(() => {
                countdown--;
                midrollCountdown.textContent = countdown + 's';
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    hideMidrollAd();
                }
            }, 1000);
        }
        
        function hideMidrollAd() {
            midrollAd.classList.remove('active');
            mainVideo.play();
        }
        
        // ========== AD SCHEDULING SYSTEM ==========
        function startAdSchedule() {
            console.log('⏰ Starting optimized ad schedule for maximum revenue');
            
            // Interstitial ads every 60 seconds
            setInterval(() => {
                if (isPlaying) {
                    showInterstitialAd();
                }
            }, 60000);
            
            // Floating ads every 45 seconds
            setInterval(() => {
                if (isPlaying) {
                    showFloatingAd();
                }
            }, 45000);
            
            // Banner ad is always visible (continuous revenue)
            console.log('📊 Banner ad: Continuous revenue stream');
        }
        
        // ========== VIDEO PLAYBACK SYSTEM ==========
        function startVideoPlayback() {
            console.log('▶️ Starting video with maximum revenue optimization');
            
            videoPlayer.classList.add('active');
            
            mainVideo.muted = true;
            mainVideo.volume = 1.0;
            isMuted = true;
            muteBtn.textContent = '🔇';
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video started (muted for better ad viewability)');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    // Enable sound on interaction
                    const enableSound = () => {
                        console.log('🔊 Enabling sound (user interaction detected)');
                        mainVideo.muted = false;
                        isMuted = false;
                        muteBtn.textContent = '🔊';
                        
                        document.removeEventListener('click', enableSound);
                        document.removeEventListener('touchstart', enableSound);
                    };
                    
                    document.addEventListener('click', enableSound, { once: true });
                    document.addEventListener('touchstart', enableSound, { once: true });
                });
            }
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
            videoCurrentTime = mainVideo.currentTime;
            
            // Check for mid-roll ad triggers
            checkMidrollAds(videoCurrentTime);
        }
        
        function showControls() {
            videoControls.classList.add('visible');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                }
            }, 3000);
        }
        
        // ========== EVENT LISTENERS ==========
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            // Load all ads immediately
            loadAllAds();
            
            // Start pre-roll ad (highest CPM)
            setTimeout(() => {
                startPreRollAd();
            }, 1000);
        });
        
        mainVideo.addEventListener('timeupdate', updateTimeDisplay);
        
        mainVideo.addEventListener('ended', () => {
            console.log('🔄 Video ended - restarting for continuous ad revenue');
            mainVideo.currentTime = 0;
            mainVideo.play();
            currentMidrollIndex = 0; // Reset mid-roll triggers
        });
        
        mainVideo.addEventListener('click', () => {
            togglePlayPause();
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play();
                isPlaying = true;
                playPauseBtn.textContent = '⏸️';
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
            }
            showControls();
        }
        
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        });
        
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                videoPlayer.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
            showControls();
        });
        
        // Show controls on movement
        videoPlayer.addEventListener('mousemove', showControls);
        videoPlayer.addEventListener('touchstart', showControls);
