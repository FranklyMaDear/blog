    <style>
        * {

        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* MAIN VIDEO CONTAINER - FIXED FOR MOBILE */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 1;
        }
        
        /* VIDEO - OPTIMIZED FOR MOBILE DISPLAY */
        #mainVideo {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Αλλάξαμε από cover σε contain για να βλέπουμε όλο το βίντεο */
            z-index: 1;
            background: #000;
            cursor: pointer;
        }
        
        /* TRANSPARENT Play button overlay */
        .video-play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(128, 128, 128, 0.25);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            opacity: 0.7;
        }
        
        .video-play-overlay:hover {
            background: rgba(128, 128, 128, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .video-play-overlay::after {
            content: '▶';
            color: white;
            font-size: 28px;
            margin-left: 4px;
            font-weight: bold;
            opacity: 0.8;
        }
        
        .video-play-overlay.hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translate(-50%, -50%) scale(0.5) !important;
        }
        
        /* Loading spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #1d9bf0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 6;
            display: none;
        }
        
        /* IMPROVED VIDEO CONTROLS - CENTERED FOR MOBILE */
        .video-controls {
            position: absolute;
            bottom: 50%; /* Αλλάξαμε από bottom: 20px σε 50% */
            left: 50%;
            transform: translate(-50%, 50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 30px;
            border-radius: 30px;
            backdrop-filter: blur(30px);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 20;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .video-controls.visible {
            opacity: 1;
            transform: translate(-50%, 50%) scale(1);
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px; /* Μεγαλύτερα εικονίδια */
            cursor: pointer;
            padding: 12px;
            border-radius: 50%;
            transition: all 0.3s;
            min-width: 60px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 20px; /* Μεγαλύτερα γράμματα */
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            text-align: center;
            padding: 0 20px;
            min-width: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* VIDEO PROGRESS BAR - CENTERED FOR MOBILE */
        .video-progress-container {
            position: absolute;
            top: 50%; /* Τοποθετούμε στη μέση της οθόνης */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            height: 8px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            z-index: 20;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: linear-gradient(to right, #1d9bf0, #ffcb2e);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 10px rgba(29, 155, 240, 0.5);
        }
        
        .video-progress-handle {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 15px rgba(29, 155, 240, 0.7);
            border: 2px solid #1d9bf0;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* VOLUME CONTROL FOR MOBILE - NEW POSITION */
        .volume-control-mobile {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9996;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s;

        .volume-control-mobile:hover {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.7);

        .volume-icon-mobile {
            font-size: 24px;
            color: white;
        }
        
        /* TABLET OPTIMIZATIONS */
        @media (min-width: 769px) and (max-width: 1024px) {

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 768px) {

            }
            
            .video-play-overlay {

            }
            
            .video-play-overlay::after {

            }
            
            .video-controls {

            }
            
            .control-btn {

                min-height: 50px;

            }
            
            .time-display {
                font-size: 16px;
                min-width: 150px;
                padding: 10px 15px;
            }
            
            .video-progress-container {
                top: 60%; /* Προσαρμογή θέσης για κινητά */
                width: 85%;
                height: 6px;
            }
            
            .video-progress-handle {
                width: 16px;
                height: 16px;
            }
            
            .volume-control-mobile {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 15px;
            }
            
            .volume-icon-mobile {
                font-size: 22px;
            }
        }
        
        /* VERY SMALL MOBILE */
        @media (max-width: 480px) {
            #mainVideo {
                object-fit: contain; /* Σε πολύ μικρές οθόνες, το contain είναι καλύτερο */
            }
            
            .video-play-overlay {
                width: 50px;
                height: 50px;
            }
            
            .video-play-overlay::after {
                font-size: 20px;
            }
            
            .video-controls {
                padding: 12px 15px;
                gap: 10px;
                bottom: 50%;
                width: 95%;
                max-width: 350px;
                border-radius: 25px;
            }
            
            .control-btn {
                font-size: 22px;
                min-width: 45px;
                min-height: 45px;
                padding: 6px;
            }
            
            .time-display {
                font-size: 14px;
                min-width: 130px;
                padding: 8px 12px;
                border-radius: 12px;
            }
            
            .video-progress-container {
                top: 65%; /* Σε πολύ μικρές οθόνες, μετακινείται πιο κάτω */
                width: 90%;
                height: 5px;
            }
            
            .video-progress-handle {
                width: 14px;
                height: 14px;
            }
            
            .volume-control-mobile {
                width: 40px;
                height: 40px;
                top: 10px;
                right: 10px;
            }
            
            .volume-icon-mobile {
                font-size: 20px;
            }
        }
        
        /* SAFARI SPECIFIC FIXES */
        @supports (-webkit-touch-callout: none) {
            .video-container {
                height: -webkit-fill-available;
            }
            
            #mainVideo {
                object-fit: contain;
            }
            
            .video-controls {
                -webkit-backdrop-filter: blur(30px);
                backdrop-filter: blur(30px);
            }
        }
        
        /* CHROME SPECIFIC FIXES */
        @media screen and (-webkit-min-device-pixel-ratio: 0) and (min-resolution: 0.001dpcm) {
            #mainVideo {
                object-fit: contain;
            }
        }
        
        /* LANDSCAPE MODE */
        @media (orientation: landscape) and (max-height: 500px) {
            #mainVideo {
                object-fit: contain; /* Στο landscape, κρατάμε το contain */
            }
            
            .video-controls {
                bottom: 30%;
                padding: 10px 15px;
                width: 80%;
            }
            
            .video-progress-container {
                top: 70%;
                width: 70%;
                height: 5px;
            }
            
            .control-btn {
                font-size: 20px;
                min-width: 40px;
                min-height: 40px;
                padding: 5px;
            }
            
            .time-display {
                font-size: 14px;
                min-width: 120px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- VOLUME CONTROL FOR MOBILE -->
    <div class="volume-control-mobile" id="volumeControlMobile">
        <div class="volume-icon-mobile" id="volumeIconMobile">🔊</div>
    </div>

    <!-- MAIN VIDEO CONTAINER -->
    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- TRANSPARENT Play button overlay that disappears -->
        <div class="video-play-overlay" id="videoPlayOverlay"></div>
        
        <!-- Main video -->
        <video id="mainVideo" preload="auto" playsinline loop>
            <source src="https://blog.franklymadear.com/videos/three/video99.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Video Progress Bar - NOW CENTERED -->
        <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-bar" id="videoProgressBar"></div>
            <div class="video-progress-handle" id="videoProgressHandle"></div>
        </div>
        
        <!-- Video Controls - NOW CENTERED -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔊</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        const videoProgressHandle = document.getElementById('videoProgressHandle');
        const volumeControlMobile = document.getElementById('volumeControlMobile');
        const volumeIconMobile = document.getElementById('volumeIconMobile');
        
        // State
        let isPlaying = false;
        let isMuted = false;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let currentVolume = 1.0; // 100% volume
        let isDraggingProgress = false;
        
        // Video Title
        const VIDEO_TITLE = "Το Έψαξα Πάντως";
        
        // FORCE SOUND ON - ΑΥΤΟΜΑΤΗ ΕΝΕΡΓΟΠΟΙΗΣΗ ΗΧΟΥ
        function forceAudioEnabled() {
            console.log("🔊 Force enabling audio at 100% volume...");
            
            mainVideo.muted = false;
            mainVideo.volume = 1.0;
            currentVolume = 1.0;
            isMuted = false;
            
            // Update UI
            muteBtn.textContent = '🔊';
            volumeIconMobile.textContent = '🔊';
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log("✅ Audio successfully enabled and playing at 100% volume");
                }).catch(error => {
                    console.log("⚠️ Auto-play with sound blocked");
                    
                    // Επιπλέον προσπάθεια με Audio Context
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        if (audioContext.state === 'suspended') {
                            audioContext.resume();
                        }
                    } catch (e) {
                        console.log("Audio Context not supported");
                    }
                    
                    // Προσπαθούμε πάλι να παίξουμε
                    mainVideo.play().then(() => {
                        console.log("✅ Video playing after retry");
                    }).catch(e2 => {
                        console.log("❌ Final play failed, user must interact");
                    });
                });
            }
        }
        
        // Start video
        function startVideo() {
            if (videoStarted) return;
            
            console.log('▶️ Starting video WITH SOUND AUTOMATICALLY ENABLED at 100% volume');
            videoStarted = true;
            
            videoPlayOverlay.classList.add('hidden');
            
            forceAudioEnabled();
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video playback started successfully with sound');
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    
                    showControls();
                    
                }).catch(e => {
                    console.error('❌ Video play failed:', e);
                    
                    mainVideo.muted = true;
                    mainVideo.play().then(() => {
                        console.log('✅ Video started muted');
                        isPlaying = true;
                        playPauseBtn.textContent = '⏸️';
                        showControls();
                        
                        document.addEventListener('click', enableSoundOnUserClick, { once: true });
                    });
                });
            }
        }
        
        // Enable sound on user click
        function enableSoundOnUserClick() {
            console.log('👆 User clicked, enabling sound...');
            mainVideo.muted = false;
            mainVideo.volume = 1.0;
            isMuted = false;
            muteBtn.textContent = '🔊';
            volumeIconMobile.textContent = '🔊';
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            
            // Update UI
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            volumeIconMobile.textContent = isMuted ? '🔇' : '🔊';
            
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // Handle video progress click
        function handleProgressClick(event) {
            const rect = videoProgressContainer.getBoundingClientRect();
            let x = event.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percent = x / rect.width;
            mainVideo.currentTime = percent * videoDuration;
            
            updateProgressBar();
            updateTimeDisplay();
            showControls();
        }
        
        // VIDEO LOOPING FUNCTIONALITY
        function handleVideoEnd() {
            console.log('🔄 Video ended - restarting from beginning');
            
            mainVideo.currentTime = 0;
            
            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('⚠️ Auto-restart failed:', e);
                });
            }
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            
            // ΒΕΒΑΙΩΝΟΥΜΕ Ο ΗΧΟΣ ΕΙΝΑΙ ΑΝΟΙΧΤΟΣ
            forceAudioEnabled();
            
            // Set video to loop
            mainVideo.loop = true;
            
            // Αυτόματη εκκίνηση
            startVideo();
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            
            videoContainer.innerHTML = `
                <div style="text-align: center; padding: 30px; color: white; width: 100%;">
                    <div style="font-size: 50px; margin-bottom: 15px;">❌</div>
                    <div style="font-size: 20px; margin-bottom: 12px; font-weight: bold;">Video Error</div>
                    <div style="font-size: 16px; margin-bottom: 20px; opacity: 0.9;">
                        Cannot load video content
                    </div>
                    <button onclick="location.reload()" style="background: #1d9bf0; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; backdrop-filter: blur(10px);">
                        Reload Page
                    </button>
                </div>
            `;
        });
        
        // Click handlers
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', (e) => {
            if (e.target === mainVideo) {
                togglePlayPause();
            }
        });
        
        // Progress bar events
        videoProgressContainer.addEventListener('click', handleProgressClick);
        
        videoProgressHandle.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });
        
        // Touch events for progress bar
        videoProgressContainer.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            handleProgressClick(e.touches[0]);
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) {
                handleProgressClick(e.touches[0]);
            }
        });
        
        document.addEventListener('touchend', () => {
            isDraggingProgress = false;
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Volume control for mobile
        volumeControlMobile.addEventListener('click', toggleMute);
        
        // Show controls on touch/mouse move
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            console.log('🎵 Ensuring audio will be ON when video starts');
            
            // Προσθήκη touch event listeners
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent zoom on double-tap
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
            
            // Mobile Safari specific fix
            if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream) {
                document.documentElement.style.height = '100%';
                document.body.style.height = '100%';
                videoContainer.style.height = '100%';
            }
        });
        
        // Prevent right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        // Handle fullscreen change
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                console.log('📺 Entered fullscreen mode');
            } else {
                console.log('📺 Exited fullscreen mode');
            }
        });
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ FmD Video Player ready - OPTIMIZED FOR MOBILE');
        console.log('🎯 Features:');
        console.log('  - Video Title: "' + VIDEO_TITLE + '"');
        console.log('  - Ηχος: ΑΝΟΙΧΤΟΣ 100% από την αρχή');
        console.log('  - Video Looping: Αυτόματη επανεκκίνηση');
        console.log('  - Optimized για Chrome & Safari στα κινητά');
        console.log('  - Μπάρα προόδου στη μέση της οθόνης');
        console.log('  - Όλο το βίντεο φαίνεται (object-fit: contain)');
        console.log('  - Controls centered για καλύτερη προσβασιμότητα');
        
        // Additional audio enabling attempts
        document.addEventListener('click', function() {
            if (videoStarted && isMuted) {
                mainVideo.muted = false;
                isMuted = false;
                muteBtn.textContent = '🔊';
                volumeIconMobile.textContent = '🔊';
                console.log('🔊 Sound enabled via user click');
            }
        });
        
        mainVideo.addEventListener('play', () => {
            console.log('🎬 Video started playing - Sound is ON at 100%');
        });
    </script>
</body>
</html>
