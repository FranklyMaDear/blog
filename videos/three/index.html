                     style="display:block; width:100%; height:100%;"
                     data-ad-format="autorelaxed"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="9660744817"></ins>
            </div>
            <div class="ad-footer-large">
                <div class="countdown-text">
                    <span id="waitText">Please wait while the video starts...</span>
                    <div class="countdown-timer" id="countdownTimer">8</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ΝΕΟ MOBILE-FRIENDLY POP-UP AD -->
    <div class="mobile-popup-ad" id="mobilePopupAd">
        <div class="popup-header">
            <div class="popup-title">
                <span>📢 Advertisement</span>
            </div>
            <div class="popup-timer" id="popupTimer">15s</div>
            <button class="popup-close" id="popupClose">×</button>
        </div>
        
        <div class="popup-content">
            <div class="ad-container">
                <!-- Πρώτη διαφήμιση AdSense με το νέο slot -->
                <div class="ad-slot active" id="mobileAd1">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-format="autorelaxed"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"></ins>
                </div>
                
                <!-- Δεύτερη διαφήμιση AdSense με το νέο slot -->
                <div class="ad-slot" id="mobileAd2">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-format="autorelaxed"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"></ins>
                </div>
                
                <!-- Τρίτη διαφήμιση AdSense με το νέο slot -->
                <div class="ad-slot" id="mobileAd3">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-format="autorelaxed"
                         data-ad-client="ca-pub-3186700611266549"
                         data-ad-slot="9660744817"></ins>
                </div>
            </div>
        </div>
        
        <div class="popup-footer">
            <div class="popup-footer-text" id="popupFooterText">
                Support our content by viewing this ad
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE VOLUME SLIDER - ΔΙΑΦΑΝΕΣ -->
    <div class="volume-slider-vertical" id="volumeSliderVertical">
        <div class="volume-icon" id="volumeIcon">🔊</div>
        <div class="volume-slider-track" id="volumeSliderTrack">
            <div class="volume-slider-fill" id="volumeSliderFill"></div>
            <div class="volume-slider-handle" id="volumeSliderHandle"></div>
        </div>
        <div class="volume-percentage" id="volumePercentage">100%</div>
    </div>

    <!-- MAIN VIDEO CONTAINER -->
    <div class="video-container" id="videoContainer">
        <!-- Loading spinner -->
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <!-- TRANSPARENT Play button overlay that disappears -->
        <div class="video-play-overlay" id="videoPlayOverlay"></div>
        
        <!-- Main video -->
        <video id="mainVideo" preload="auto" playsinline loop>
            <source src="https://blog.franklymadear.com/videos/three/video99.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Video Progress Bar (Original - hidden) -->
        <div class="video-progress-container" id="videoProgressContainer">
            <div class="video-progress-bar" id="videoProgressBar"></div>
            <div class="video-progress-handle" id="videoProgressHandle"></div>
        </div>
        
        <!-- Video Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="playPauseBtn">⏸️</button>
            <button class="control-btn" id="muteBtn">🔊</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
            <button class="control-btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const largeCenterAd = document.getElementById('largeCenterAd');
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        const videoPlayOverlay = document.getElementById('videoPlayOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const videoControls = document.getElementById('videoControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const countdownTimer = document.getElementById('countdownTimer');
        const waitText = document.getElementById('waitText');
        const videoProgressContainer = document.getElementById('videoProgressContainer');
        const videoProgressBar = document.getElementById('videoProgressBar');
        const videoProgressHandle = document.getElementById('videoProgressHandle');
        
        // Νέο Mobile Pop-up Elements
        const mobilePopupAd = document.getElementById('mobilePopupAd');
        const popupClose = document.getElementById('popupClose');
        const popupTimer = document.getElementById('popupTimer');
        const popupFooterText = document.getElementById('popupFooterText');
        
        // Ad Elements για rotation
        const mobileAds = [
            document.getElementById('mobileAd1'),
            document.getElementById('mobileAd2'),
            document.getElementById('mobileAd3')
        ];
        
        // Volume Slider Elements
        const volumeSliderVertical = document.getElementById('volumeSliderVertical');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeSliderTrack = document.getElementById('volumeSliderTrack');
        const volumeSliderFill = document.getElementById('volumeSliderFill');
        const volumeSliderHandle = document.getElementById('volumeSliderHandle');
        const volumePercentage = document.getElementById('volumePercentage');
        
        // State
        let isPlaying = false;
        let isMuted = false;
        let videoActive = false;
        let videoDuration = 0;
        let controlsTimeout = null;
        let videoStarted = false;
        let adsenseAdLoaded = false;
        let adClosed = false;
        let countdownValue = 8;
        let countdownInterval;
        let languageIndex = 0;
        const languages = [
            { code: 'en', text: 'Please wait while the video starts...' },
            { code: 'el', text: 'Παρακαλώ περιμένετε ενώ ξεκινά το βίντεο...' },
            { code: 'de', text: 'Bitte warten Sie, während das Video startet...' }
        ];
        
        // Ad System State
        let isAdShowing = false;
        let adInterval;
        let adTimer = 15;
        let adTimerInterval;
        let adCounter = 0;
        
        // Ad Rotation State
        let currentMobileAdIndex = 0;
        
        // Video Title - Consistent across all platforms
        const VIDEO_TITLE = "Το Έψαξα Πάντως";
        
        // Volume state - ΑΡΧΙΚΑ ΑΝΟΙΧΤΟΣ ΗΧΟΣ
        let currentVolume = 1.0; // 100% volume από την αρχή
        let isDraggingVolume = false;
        
        // FORCE SOUND ON - ΑΥΤΟΜΑΤΗ ΕΝΕΡΓΟΠΟΙΗΣΗ ΗΧΟΥ (100% ΒΕΒΑΙΟ)
        function forceAudioEnabled() {
            console.log("🔊 Force enabling audio at 100% volume...");
            
            // ΒΕΒΑΙΩΝΟΥΜΕ ΟΤΙ Ο ΗΧΟΣ ΕΙΝΑΙ ΑΝΟΙΧΤΟΣ
            mainVideo.muted = false;
            mainVideo.volume = 1.0; // 100% volume
            currentVolume = 1.0; // Ενημερώνουμε το state
            isMuted = false; // ΣΙΓΟΥΡΑ ΟΧΙ MUTED
            
            // Update UI
            muteBtn.textContent = '🔊';
            updateVerticalVolumeSlider();
            
            // Προσπαθούμε να παίξουμε με ήχο
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log("✅ Audio successfully enabled and playing at 100% volume");
                }).catch(error => {
                    console.log("⚠️ Auto-play with sound blocked, trying with audio context...");
                    
                    // Επιπλέον προσπάθεια με Audio Context
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        if (audioContext.state === 'suspended') {
                            audioContext.resume();
                        }
                    } catch (e) {
                        console.log("Audio Context not supported");
                    }
                    
                    // Προσπαθούμε πάλι να παίξουμε
                    mainVideo.play().then(() => {
                        console.log("✅ Video playing after retry");
                    }).catch(e2 => {
                        console.log("❌ Final play failed, user must interact");
                    });
                });
            }
        }
        
        // Rotate mobile ad
        function rotateMobileAd() {
            // Απενεργοποιούμε όλες τις διαφημίσεις
            mobileAds.forEach(ad => ad.classList.remove('active'));
            
            // Επιλέγουμε την επόμενη διαφήμιση
            currentMobileAdIndex = (currentMobileAdIndex + 1) % mobileAds.length;
            
            // Ενεργοποιούμε την νέα διαφήμιση
            mobileAds[currentMobileAdIndex].classList.add('active');
            
            // Φορτώνουμε την νέα AdSense διαφήμιση με το νέο slot
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
                console.log(`🔄 Rotated to mobile ad ${currentMobileAdIndex + 1} with new AdSense slot`);
            } catch (e) {
                console.log("Ad rotation error:", e);
            }
        }
        
        // Start countdown timer
        function startCountdown() {
            countdownValue = 8;
            countdownTimer.textContent = countdownValue;
            
            // Start language rotation
            rotateLanguages();
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                countdownValue--;
                countdownTimer.textContent = countdownValue;
                
                if (countdownValue <= 0) {
                    clearInterval(countdownInterval);
                    if (!adClosed) {
                        startVideo();
                    }
                }
            }, 1000);
        }
        
        // Rotate languages
        function rotateLanguages() {
            if (languageIndex >= languages.length) languageIndex = 0;
            waitText.textContent = languages[languageIndex].text;
            languageIndex++;
            
            setInterval(() => {
                if (languageIndex >= languages.length) languageIndex = 0;
                waitText.textContent = languages[languageIndex].text;
                languageIndex++;
            }, 2000);
        }
        
        // Load AdSense ad for center overlay με το νέο slot
        function loadAdsenseAd() {
            if (!adsenseAdLoaded) {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log("AdSense ad loaded in center overlay with new slot (9660744817)");
                    adsenseAdLoaded = true;
                    
                    startCountdown();
                    
                } catch (e) {
                    console.log("AdSense load error:", e);
                }
            }
        }
        
        // Update vertical volume slider
        function updateVerticalVolumeSlider() {
            const volume = isMuted ? 0 : currentVolume;
            const height = volume * 100 + '%';
            volumeSliderFill.style.height = height;
            
            const handlePosition = (1 - volume) * 100;
            volumeSliderHandle.style.bottom = handlePosition + '%';
            
            volumePercentage.textContent = Math.round(volume * 100) + '%';
            volumeIcon.textContent = volume === 0 ? '🔇' : volume < 0.5 ? '🔉' : '🔊';
            
            // Update mute button
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        
        // Set volume from vertical slider
        function setVolumeFromVertical(event) {
            const rect = volumeSliderTrack.getBoundingClientRect();
            let y = event.clientY - rect.top;
            y = Math.max(0, Math.min(y, rect.height));
            
            const volume = 1 - (y / rect.height);
            currentVolume = volume;
            
            mainVideo.volume = currentVolume;
            mainVideo.muted = currentVolume === 0;
            isMuted = currentVolume === 0;
            
            updateVerticalVolumeSlider();
            showControls();
        }
        
        // Start video - WITH SOUND AUTOMATICALLY ENABLED (100% ΒΕΒΑΙΟ)
        function startVideo() {
            if (videoStarted) return;
            
            console.log('▶️ Starting video WITH SOUND AUTOMATICALLY ENABLED at 100% volume');
            videoStarted = true;
            adClosed = true;
            
            clearInterval(countdownInterval);
            
            largeCenterAd.style.opacity = '0';
            largeCenterAd.style.pointerEvents = 'none';
            
            setTimeout(() => {
                videoContainer.classList.add('active');
                
                setTimeout(() => {
                    videoPlayOverlay.classList.add('hidden');
                }, 1500);
                
                // FORCE AUDIO TO BE ENABLED IMMEDIATELY AT 100% VOLUME
                forceAudioEnabled();
                
                const playPromise = mainVideo.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('✅ Video playback started successfully with sound');
                        isPlaying = true;
                        videoActive = true;
                        playPauseBtn.textContent = '⏸️';
                        
                        showControls();
                        
                        // Start ad system after 5 seconds
                        setTimeout(() => {
                            startAdSystem();
                        }, 5000);
                        
                    }).catch(e => {
                        console.error('❌ Video play failed:', e);
                        
                        // Προσπαθούμε με muted και μετά enable sound
                        mainVideo.muted = true;
                        mainVideo.play().then(() => {
                            console.log('✅ Video started muted (will enable sound on user interaction)');
                            isPlaying = true;
                            videoActive = true;
                            playPauseBtn.textContent = '⏸️';
                            showControls();
                            
                            // Προσθέτουμε event listener για user interaction
                            document.addEventListener('click', enableSoundOnUserClick, { once: true });
                            
                            // Start ad system after 5 seconds
                            setTimeout(() => {
                                startAdSystem();
                            }, 5000);
                        });
                    });
                }
                
            }, 400);
        }
        
        // Enable sound on user click (fallback)
        function enableSoundOnUserClick() {
            console.log('👆 User clicked, enabling sound...');
            mainVideo.muted = false;
            mainVideo.volume = 1.0;
            isMuted = false;
            updateVerticalVolumeSlider();
        }
        
        // Format time function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update time display
        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(videoDuration)}`;
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progress = (mainVideo.currentTime / videoDuration) * 100;
            videoProgressBar.style.width = progress + '%';
            videoProgressHandle.style.left = progress + '%';
        }
        
        // Show/hide controls
        function showControls() {
            videoControls.classList.add('visible');
            videoProgressContainer.style.opacity = '0.5';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    videoControls.classList.remove('visible');
                    videoProgressContainer.style.opacity = '0';
                }
            }, 3000);
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (mainVideo.paused) {
                mainVideo.play().then(() => {
                    isPlaying = true;
                    videoActive = true;
                    playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    videoPlayOverlay.classList.remove('hidden');
                    setTimeout(() => {
                        if (isPlaying) {
                            videoPlayOverlay.classList.add('hidden');
                        }
                    }, 800);
                    
                });
            } else {
                mainVideo.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
                showControls();
                
                videoPlayOverlay.classList.remove('hidden');
            }
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            mainVideo.muted = isMuted;
            updateVerticalVolumeSlider();
            showControls();
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
            showControls();
        }
        
        // VIDEO LOOPING FUNCTIONALITY
        function handleVideoEnd() {
            console.log('🔄 Video ended - restarting from beginning');
            
            // Reset video to beginning
            mainVideo.currentTime = 0;
            
            // Play again
            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('⚠️ Auto-restart failed:', e);
                });
            }
            
            // Reset ad system
            stopAdSystem();
            setTimeout(() => {
                startAdSystem();
            }, 5000);
        }
        
        // ADVERTISEMENT SYSTEM
        function startAdSystem() {
            console.log('🔄 Starting ad system with mobile-friendly popup...');
            
            // Clear any existing intervals
            clearInterval(adInterval);
            clearInterval(adTimerInterval);
            
            // Show first ad after 5 seconds
            adInterval = setInterval(() => {
                if (!isAdShowing && isPlaying) {
                    showAdvertisement();
                }
            }, 5000); // Show ad every 5 seconds
        }
        
        function stopAdSystem() {
            console.log('🛑 Stopping ad system...');
            clearInterval(adInterval);
            clearInterval(adTimerInterval);
            hideAdvertisement();
        }
        
        function showAdvertisement() {
            isAdShowing = true;
            
            // ROTATE TO NEXT AD - Διαφορετική διαφήμιση κάθε φορά
            rotateMobileAd();
            
            // Show ad
            mobilePopupAd.classList.remove('hidden');
            setTimeout(() => {
                mobilePopupAd.classList.add('visible');
            }, 10);
            
            // Start ad timer
            adTimer = 15;
            popupTimer.textContent = adTimer + 's';
            
            clearInterval(adTimerInterval);
            adTimerInterval = setInterval(() => {
                adTimer--;
                popupTimer.textContent = adTimer + 's';
                
                if (adTimer <= 0) {
                    hideAdvertisement();
                }
            }, 1000);
            
            console.log(`📱 Mobile popup ad shown (25% of screen) - Ad ${currentMobileAdIndex + 1}`);
        }
        
        function hideAdvertisement() {
            isAdShowing = false;
            clearInterval(adTimerInterval);
            
            mobilePopupAd.classList.remove('visible');
            setTimeout(() => {
                mobilePopupAd.classList.add('hidden');
            }, 500);
            
            console.log('📱 Advertisement hidden');
        }
        
        // Event Listeners
        mainVideo.addEventListener('loadedmetadata', () => {
            console.log('📊 Video metadata loaded');
            videoDuration = mainVideo.duration;
            updateTimeDisplay();
            updateVerticalVolumeSlider();
            
            // ΒΕΒΑΙΩΝΟΥΜΕ Ο ΗΧΟΣ ΕΙΝΑΙ ΑΝΟΙΧΤΟΣ ΑΠΟ ΤΗΝ ΑΡΧΗ
            forceAudioEnabled();
            
            // Set video to loop
            mainVideo.loop = true;
        });
        
        mainVideo.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updateProgressBar();
        });
        
        mainVideo.addEventListener('ended', handleVideoEnd);
        
        mainVideo.addEventListener('waiting', () => {
            loadingSpinner.style.display = 'block';
        });
        
        mainVideo.addEventListener('playing', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('seeked', () => {
            loadingSpinner.style.display = 'none';
        });
        
        mainVideo.addEventListener('error', (e) => {
            console.error('❌ Video error:', mainVideo.error);
            loadingSpinner.style.display = 'none';
            videoActive = false;
            
            largeCenterAd.style.opacity = '1';
            largeCenterAd.style.pointerEvents = 'auto';
            largeCenterAd.innerHTML = `
                <div class="large-ad-container" style="background: rgba(34, 34, 34, 0.95); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);">
                    <div style="text-align: center; padding: 30px; color: white;">
                        <div style="font-size: 50px; margin-bottom: 15px;">❌</div>
                        <div style="font-size: 20px; margin-bottom: 12px; font-weight: bold;">Video Error</div>
                        <div style="font-size: 16px; margin-bottom: 20px; opacity: 0.9;">
                            Cannot load video content
                        </div>
                        <button onclick="location.reload()" style="background: #1d9bf0; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; backdrop-filter: blur(10px);">
                            Reload Page
                        </button>
                    </div>
                </div>
            `;
        });
        
        // Click handlers
        videoPlayOverlay.addEventListener('click', togglePlayPause);
        mainVideo.addEventListener('click', (e) => {
            if (e.target === mainVideo) {
                togglePlayPause();
            }
        });
        
        // Control buttons
        playPauseBtn.addEventListener('click', togglePlayPause);
        muteBtn.addEventListener('click', toggleMute);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Volume slider events
        volumeSliderTrack.addEventListener('click', setVolumeFromVertical);
        
        volumeSliderHandle.addEventListener('mousedown', (e) => {
            isDraggingVolume = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingVolume) {
                setVolumeFromVertical(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingVolume = false;
        });
        
        // Touch events for volume slider
        volumeSliderTrack.addEventListener('touchstart', (e) => {
            isDraggingVolume = true;
            setVolumeFromVertical(e.touches[0]);
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingVolume) {
                setVolumeFromVertical(e.touches[0]);
            }
        });
        
        document.addEventListener('touchend', () => {
            isDraggingVolume = false;
        });
        
        // Auto start video if user clicks on the large ad
        largeCenterAd.addEventListener('click', (e) => {
            if (e.target === largeCenterAd || e.target.closest('.large-ad-container')) {
                startVideo();
            }
        });
        
        // Close ad button για το νέο mobile popup
        popupClose.addEventListener('click', hideAdvertisement);
        
        // Show controls on touch/mouse move
        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('touchstart', showControls);
        
        // Initial setup
        window.addEventListener('load', () => {
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.pathname);
            }
            
            // Set page title with video title
            document.title = VIDEO_TITLE + " - FmD @FmD699";
            
            // ΒΕΒΑΙΩΝΟΥΜΕ ΟΤΙ Ο ΗΧΟΣ ΘΑ ΕΙΝΑΙ ΑΝΟΙΧΤΟΣ
            console.log('🎵 Ensuring audio will be ON when video starts');
            
            // Load AdSense ad after page loads
            setTimeout(loadAdsenseAd, 300);
            
            // Προσθήκη touch event listeners για καλύτερη συμβατότητα
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent zoom on double-tap
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        });
        
        // Prevent right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);
        
        console.log('🎬 ' + VIDEO_TITLE);
        console.log('✅ FmD Video Player ready');
        console.log('🎯 Features:');
        console.log('  - Video Title: "' + VIDEO_TITLE + '" (παντού)');
        console.log('  - Ηχος: ΑΝΟΙΧΤΟΣ 100% από την αρχή');
        console.log('  - Video Looping: Αυτόματη επανεκκίνηση');
        console.log('  - ΝΕΟ Mobile Pop-up Ad: 25% της οθόνης, φιλικό για κινητά/ταμπλετ');
        console.log('  - 3 ΔΙΑΦΟΡΕΤΙΚΕΣ διαφημίσεις AdSense με νέο slot (9660744817)');
        console.log('  - Center Ad: Google AdSense διαφήμιση με νέο slot');
        console.log('  - Συμβατό με Chrome, Safari, Firefox');
        console.log('  - Transparent Volume Slider στα δεξιά');
        
        // Additional audio enabling attempts
        document.addEventListener('click', function() {
            if (videoStarted && isMuted) {
                mainVideo.muted = false;
                isMuted = false;
                updateVerticalVolumeSlider();
                console.log('🔊 Sound enabled via user click');
            }
        });
        
        mainVideo.addEventListener('play', () => {
            console.log('🎬 Video started playing - Sound is ON at 100%');
        });
    </script>
</body>
</html>
