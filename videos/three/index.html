            if (currentMidrollIndex < midrollTriggers.length) {
                const triggerTime = midrollTriggers[currentMidrollIndex];
                if (currentTime >= triggerTime && currentTime < triggerTime + 2) {

        function hideOverlayAd(id) {
            elements.overlayAd1.classList.remove('visible');

            if (currentPopupIndex < popupTriggers.length) {
                const triggerTime = popupTriggers[currentPopupIndex];
                if (currentTime >= triggerTime && currentTime < triggerTime + 2) {
                    showPopupAd();
                    currentPopupIndex++;
                }
            }
        }
        
        function showPopupAd() {
            revenueOptimizer.logAdImpression('popup', adSlots.popup);
            elements.popupAd.classList.add('visible');
            elements.mainVideo.pause();
            
            setTimeout(() => {
                hidePopupAd();
            }, 6000);
        }
        
        function hidePopupAd() {
            elements.popupAd.classList.remove('visible');
            elements.mainVideo.play();
        }
        
        elements.popupClose.addEventListener('click', hidePopupAd);
        
        // ========== TOP BANNER ==========
        function showTopBanner() {
            revenueOptimizer.logAdImpression('topbanner', adSlots.topbanner);
            elements.topBannerAd.classList.add('visible');
            
            setTimeout(() => {
                elements.topBannerAd.classList.remove('visible');
            }, 5000);
        }
        
        // ========== AGGRESSIVE AD SCHEDULE ==========
        function startAggressiveAdSchedule() {
            console.log('⏰ STARTING AGGRESSIVE AD SCHEDULE FOR 60-90s VIDEOS');
            
            // Interstitial every 20 seconds
            setInterval(() => {
                if (isPlaying) showInterstitialAd();
            }, 20000);
            
            // Floating every 15 seconds
            setInterval(() => {
                if (isPlaying) showFloatingAd();
            }, 15000);
            
            // Overlay every 10 seconds
            setInterval(() => {
                if (isPlaying) showOverlayAd();
            }, 10000);
            
            // Side banner every 12 seconds
            setInterval(() => {
                if (isPlaying) showSideBanner();
            }, 12000);
            
            // Top banner every 25 seconds
            setInterval(() => {
                if (isPlaying) showTopBanner();
            }, 25000);
            
            console.log('📊 MAXIMUM AD DENSITY ACTIVATED');
        }
        
        // ========== VIDEO PLAYBACK ==========
        function startVideoPlayback() {
            console.log('▶️ STARTING SHORT VIDEO WITH MAXIMUM ADS');
            
            elements.videoPlayer.classList.add('active');
            elements.mainVideo.muted = true;
            elements.mainVideo.volume = 1.0;
            isMuted = true;
            elements.muteBtn.textContent = '🔇';
            
            const playPromise = elements.mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Video playing (muted for ad optimization)');
                    isPlaying = true;
                    elements.playPauseBtn.textContent = '⏸️';
                    showControls();
                    
                    // Enable sound on interaction
                    const enableSound = () => {
                        console.log('🔊 Sound enabled');
                        elements.mainVideo.muted = false;
                        isMuted = false;
                        elements.muteBtn.textContent = '🔊';
                        document.removeEventListener('click', enableSound);
                        document.removeEventListener('touchstart', enableSound);
                    };
                    
                    document.addEventListener('click', enableSound, { once: true });
                    document.addEventListener('touchstart', enableSound, { once: true });
                });
            }
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimeDisplay() {
            const currentTime = elements.mainVideo.currentTime;
            elements.timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(videoDuration)}`;
            
            checkMidrollAds(currentTime);
            checkPopupAds(currentTime);
        }
        
        function showControls() {
            elements.videoControls.classList.add('visible');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    elements.videoControls.classList.remove('visible');
                }
            }, 2000);
        }
        
        // ========== EVENT LISTENERS ==========
        elements.mainVideo.addEventListener('loadedmetadata', () => {
            videoDuration = elements.mainVideo.duration;
            console.log(`📊 Video duration: ${Math.round(videoDuration)}s`);
            updateTimeDisplay();
            loadAllAds();
            
            setTimeout(() => {
                startPreRollAd();
            }, 1000);
        });
        
        elements.mainVideo.addEventListener('timeupdate', updateTimeDisplay);
        
        elements.mainVideo.addEventListener('ended', () => {
            console.log('🔄 Restarting video for continuous ad revenue');
            elements.mainVideo.currentTime = 0;
            elements.mainVideo.play();
            currentMidrollIndex = 0;
            currentPopupIndex = 0;
        });
        
        elements.mainVideo.addEventListener('click', togglePlayPause);
        
        function togglePlayPause() {
            if (elements.mainVideo.paused) {
                elements.mainVideo.play();
                isPlaying = true;
                elements.playPauseBtn.textContent = '⏸️';
            } else {
                elements.mainVideo.pause();
                isPlaying = false;
                elements.playPauseBtn.textContent = '▶️';
            }
            showControls();
        }
        
        elements.playPauseBtn.addEventListener('click', togglePlayPause);
        
        elements.muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            elements.mainVideo.muted = isMuted;
            elements.muteBtn.textContent = isMuted ? '🔇' : '🔊';
            showControls();
        });
        
        elements.fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                elements.videoPlayer.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
            showControls();
        });
        
        elements.videoPlayer.addEventListener('mousemove', showControls);
        elements.videoPlayer.addEventListener('touchstart', showControls);
