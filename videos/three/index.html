<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Βίντεο</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
            height: 100vh;
        }
        
        @media (min-width: 1024px) {
            .container {
                flex-direction: row;
                padding: 30px;
                gap: 30px;
                height: calc(100vh - 40px);
            }
        }
        
        .video-container {
            flex: 3;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
            min-height: 300px;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            display: block;
        }
        
        .ad-container {
            flex: 1;
            min-width: 300px;
            background-color: #111;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 250px;
        }
        
        .ad-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .ad-content {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .ad-placeholder {
            width: 100%;
            height: 100%;
            min-height: 200px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-style: italic;
            font-size: 14px;
        }
        
        @media (max-width: 1023px) {
            .container {
                height: auto;
                min-height: 100vh;
            }
            
            .video-container {
                height: 60vh;
            }
            
            .ad-container {
                height: 30vh;
                min-height: 200px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
                gap: 10px;
            }
            
            .video-container {
                height: 50vh;
            }
            
            .ad-container {
                height: 25vh;
                min-height: 150px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <video controls poster="thumbnail99.png" id="mainVideo">
                <source src="video99.mp4" type="video/mp4">
                Το πρόγραμμα περιήγησής σας δεν υποστηρίζει βίντεο.
            </video>
        </div>
        
        <div class="ad-container">
            <div class="ad-label">Διαφήμιση</div>
            <div class="ad-content">
                <!-- Το script διαφήμισης που ζητήσατε -->
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
                    crossorigin="anonymous"></script>
                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-format="autorelaxed"
                    data-ad-client="ca-pub-3186700611266549"
                    data-ad-slot="9660744817"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
                
                <!-- Placeholder για την διαφήμιση -->
                <div class="ad-placeholder" id="adPlaceholder">
                    Διαφήμιση
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const adPlaceholder = document.getElementById('adPlaceholder');
            
            // Απόκρυψη placeholder αν η διαφήμιση φορτώθηκε
            setTimeout(function() {
                const adElement = document.querySelector('ins.adsbygoogle');
                if (adElement && adElement.offsetHeight > 50) {
                    adPlaceholder.style.display = 'none';
                }
            }, 2000);
            
            // Έλεγχος αν το βίντεο φορτώνεται
            video.addEventListener('error', function() {
                console.log('Σφάλμα φόρτωσης βίντεο. Βεβαιωθείτε ότι το video99.mp4 είναι στον ίδιο φάκελο.');
            });
        });
    </script>
</body>
</html>
