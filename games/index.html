<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cube Snake 2048</title>
    <!-- Three.js για 3D γραφικά -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Socket.io για multiplayer -->
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        body { margin:0; overflow:hidden; background: #1a2a6c; font-family: sans-serif; touch-action:none; user-select:none; }
        #game-container { width:100vw; height:100vh; position:relative; }
        
        /* UI Πάνω αριστερά (Exit, Ήχος) */
        .top-left { position:absolute; top:10px; left:10px; z-index:10; display:flex; gap:8px; }
        .btn-ui { background:#4a5d9e; border:2px solid #7a8fc0; color:#fff; padding:5px 12px; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer; }
        
        /* Leaderboard Πάνω δεξιά */
        #leaderboard { position:absolute; top:10px; right:10px; z-index:10; background:rgba(0,0,0,0.6); padding:5px 10px; border-radius:10px; color:#fff; font-size:12px; width:120px; text-align:right; }
        .lb-row { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
        .lb-row.me { color:#00e5ff; font-weight:bold; }
        .lb-row .arrow { color:#ff7043; margin-right:5px; }

        /* Boost Button (Κάτω δεξιά) */
        #boostBtn { 
            position:absolute; bottom:40px; right:40px; z-index:20; 
            width:75px; height:75px; border-radius:50%; 
            background: rgba(0,0,0,0.6); border: 4px solid #2ecc71; color:#2ecc71; 
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-weight:bold; font-size:12px; cursor:pointer; box-shadow: 0 0 15px rgba(46,204,113,0.3);
        }
        #boostBtn:active { transform:scale(0.9); }
        #boostBtn svg { width:30px; height:30px; fill:#2ecc71; margin-bottom:2px; }

        /* Μενού Skins (Κάτω μέρος) */
        #skinMenu { position:absolute; bottom:0; left:0; width:100%; z-index:30; background:rgba(255,255,255,0.95); border-top-left-radius:20px; border-top-right-radius:20px; padding:15px; display:none; flex-direction:column; max-height:40vh; overflow-y:auto; }
        #skinMenu.open { display:flex; }
        .skin-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
        .skin-item { background:#e0e0e0; border-radius:12px; padding:10px; text-align:center; display:flex; flex-direction:column; align-items:center; }
        .skin-item img { width:40px; height:40px; border-radius:8px; margin-bottom:5px; }
        .skin-item button { background:#2ecc71; border:none; color:#fff; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer; }

        #exitBtn { cursor:pointer; }
        @media (max-width:600px) { .btn-ui { font-size:12px; padding:4px 8px; } #leaderboard { width:90px; font-size:10px; } #boostBtn { width:65px; height:65px; } }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Canvas του Three.js -->
    <div id="three-canvas"></div>

    <!-- UI -->
    <div class="top-left">
        <button class="btn-ui" id="exitBtn">🚪 Exit</button>
        <button class="btn-ui" id="soundBtn">🔊</button>
    </div>

    <div id="leaderboard">
        <div style="font-size:10px; color:#aaa; margin-bottom:5px; text-align:center;">LEADERBOARD</div>
        <div id="lb-content"></div>
    </div>

    <div id="boostBtn">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2z"/></svg>
        BOOST
    </div>

    <!-- Μενού Skins (κάτω) -->
    <div id="skinMenu">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span style="font-weight:bold;">Select Skin</span>
            <button id="closeSkinMenu" style="background:none; border:none; font-size:18px;">✖</button>
        </div>
        <div class="skin-grid">
            <div class="skin-item"><div style="width:40px; height:40px; background:#e74c3c; border-radius:8px;"></div><button>EQUIP</button></div>
            <div class="skin-item"><div style="width:40px; height:40px; background:#3498db; border-radius:8px;"></div><button>EQUIP</button></div>
            <div class="skin-item"><div style="width:40px; height:40px; background:#f1c40f; border-radius:8px;"></div><button>EQUIP</button></div>
            <div class="skin-item"><div style="width:40px; height:40px; background:#2ecc71; border-radius:8px;"></div><button>EQUIP</button></div>
        </div>
    </div>
</div>

<script>
// --- Ρύθμιση Telegram ---
if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }

// --- Σύνδεση με Server (ΑΛΛΑΞΕ ΑΥΤΟ) ---
const SERVER_URL = 'https://το-όνομα-σου-cubes2048-server.hf.space';
const socket = io(SERVER_URL);

// --- Three.js Setup ---
const container = document.getElementById('three-canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2a6c);

// Κάμερα (Ισομετρική)
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(15, 15, 15);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Φωτισμός
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// Δάπεδο με κουκκίδες (όπως η εικόνα)
const floorGeo = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a2a6c });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
scene.add(floor);

// --- Λογική Παιχνιδιού ---
let myId = null;
let snake = []; // [{mesh, value}]
let headMesh = null;
let moveSpeed = 5;
let isBoosting = false;
let boostTimer = 0;
let direction = new THREE.Vector3(1, 0, 0); // Αρχική κατεύθυνση
let targetDir = new THREE.Vector3(1, 0, 0);
let touchX = 0, touchY = 0;

// Μαζεύοντας μπλοκ (από τον server)
let worldBlocks = [];

// Δημιουργία κύβου με αριθμό (Texture)
function createTextCube(value, colorHex) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = `#${colorHex.toString(16).padStart(6, '0')}`;
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'Bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(value.toString(), 32, 32);
    
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.MeshStandardMaterial({ map: texture });
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    return new THREE.Mesh(geometry, material);
}

// Εκκίνηση του φιδιού
function initSnake(value) {
    // Καθαρισμός παλιού φιδιού
    snake.forEach(s => scene.remove(s.mesh));
    snake = [];
    
    const colors = [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71, 0xe67e22, 0x9b59b6];
    for(let i=0; i<3; i++) { // 3 κομμάτια
        let val = Math.max(2, value - i * 2);
        let mesh = createTextCube(val, colors[val % colors.length]);
        mesh.position.set(-i, 0, 0); // Απλωμένο στον άξονα Χ
        scene.add(mesh);
        snake.push({ mesh: mesh, value: val });
    }
    headMesh = snake[0].mesh;
}

// Κίνηση φιδιού
function moveSnake(delta) {
    let currentSpeed = isBoosting ? moveSpeed * 2.5 : moveSpeed;
    let step = currentSpeed * delta;

    // Κατεύθυνση στόχου
    let dx = touchX - headMesh.position.x;
    let dz = touchY - headMesh.position.z;
    if (Math.abs(dx) > 1 || Math.abs(dz) > 1) {
        targetDir.set(dx, 0, dz).normalize();
    }

    // Ομαλή στροφή
    direction.lerp(targetDir, 0.1).normalize();

    // Μετακίνηση κεφαλιού
    headMesh.position.x += direction.x * step;
    headMesh.position.z += direction.z * step;
    headMesh.rotation.y = Math.atan2(direction.x, direction.z);

    // Μετακίνηση σώματος (ακολουθώντας το κεφάλι)
    for(let i=1; i<snake.length; i++) {
        let prev = snake[i-1].mesh.position;
        let curr = snake[i].mesh.position;
        let dx2 = prev.x - curr.x;
        let dz2 = prev.z - curr.z;
        let dist = Math.hypot(dx2, dz2);
        if(dist > 0.9) {
            let move = (dist - 0.9) / dist;
            curr.x += dx2 * move;
            curr.z += dz2 * move;
        }
    }

    // Αποστολή θέσης στον server
    if(myId) {
        socket.emit('update', {
            id: myId,
            x: headMesh.position.x,
            z: headMesh.position.z,
            value: snake[0].value
        });
    }
}

// Σύγκρουση με μπλοκ (απλή local για δοκιμή)
function checkCollisions() {
    let headPos = headMesh.position;
    for(let i=worldBlocks.length-1; i>=0; i--) {
        let b = worldBlocks[i];
        let dist = Math.hypot(headPos.x - b.x, headPos.z - b.z);
        if(dist < 1.5) {
            if(b.value < snake[0].value) {
                // Φαγητό!
                snake[0].value += b.value;
                updateHeadTexture();
                // Πρόσθεσε έναν κύβο στο τέλος της ουράς
                let last = snake[snake.length-1].mesh.position;
                let newMesh = createTextCube(b.value, 0xe74c3c);
                newMesh.position.copy(last);
                scene.add(newMesh);
                snake.push({ mesh: newMesh, value: b.value });
                worldBlocks.splice(i,1);
                spawnBlock();
            } else if(b.value === snake[0].value) {
                // Συγχώνευση!
                snake[0].value *= 2;
                updateHeadTexture();
                worldBlocks.splice(i,1);
                spawnBlock();
            }
        }
    }
}

function updateHeadTexture() {
    let val = snake[0].value;
    let colorHex = 0xe74c3c;
    if(val >= 4) colorHex = 0x3498db;
    if(val >= 8) colorHex = 0xf1c40f;
    if(val >= 16) colorHex = 0x2ecc71;
    if(val >= 32) colorHex = 0xe67e22;
    if(val >= 64) colorHex = 0x9b59b6;
    if(val >= 128) colorHex = 0xe91e63;
    // Αλλάζουμε το texture του κεφαλιού (για ευκολία αντικαθιστούμε το mesh)
    let newMesh = createTextCube(val, colorHex);
    newMesh.position.copy(headMesh.position);
    scene.add(newMesh);
    scene.remove(headMesh);
    snake[0].mesh = newMesh;
    headMesh = newMesh;
}

function spawnBlock() {
    let val = Math.pow(2, Math.floor(Math.random() * 4) + 1);
    worldBlocks.push({
        x: (Math.random() - 0.5) * 40,
        z: (Math.random() - 0.5) * 40,
        value: val
    });
}

// Δημιουργία αρχικών μπλοκ
for(let i=0; i<15; i++) spawnBlock();
initSnake(2);

// --- Loop ---
let lastTime = performance.now();
function animate(time) {
    requestAnimationFrame(animate);
    let delta = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    if(myId) {
        moveSnake(delta);
        checkCollisions();
        
        // Boost timer
        if(isBoosting) {
            boostTimer -= delta;
            if(boostTimer <= 0) { isBoosting = false; document.getElementById('boostBtn').style.borderColor = '#2ecc71'; }
        }
    }

    // Σχεδίαση μπλοκ στον κόσμο
    worldBlocks.forEach(b => {
        // Χρησιμοποιούμε ένα απλό green box για απλότητα
        // (στην πραγματικότητα θα πρέπει να έχουν textures)
    });

    renderer.render(scene, camera);
}
animate();

// --- Socket Events ---
socket.on('connect', () => {
    myId = socket.id;
    socket.emit('update', { id: myId, x: headMesh.position.x, z: headMesh.position.z, value: snake[0].value });
});

socket.on('players', (data) => {
    // Ενημέρωση Leaderboard
    let lbContainer = document.getElementById('lb-content');
    lbContainer.innerHTML = '';
    let sorted = Object.values(data).sort((a,b) => b.value - a.value);
    sorted.forEach((p, idx) => {
        let row = document.createElement('div');
        row.className = 'lb-row' + (p.id === myId ? ' me' : '');
        row.innerHTML = (p.id === myId ? `<span class="arrow">➤</span>` : '') + `<span>${idx+1}. ${p.id.slice(0,6)}</span><span>${p.value}</span>`;
        lbContainer.appendChild(row);
    });
});

// --- Touch / Mouse Controls ---
const targetElem = renderer.domElement;
targetElem.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    touchX = (t.clientX / window.innerWidth) * 20 - 10; // Mapping σε κλίμακα παιχνιδιού (-10 με 10)
    touchY = (t.clientY / window.innerHeight) * -20 + 10;
});

targetElem.addEventListener('mousemove', (e) => {
    touchX = (e.clientX / window.innerWidth) * 20 - 10;
    touchY = (e.clientY / window.innerHeight) * -20 + 10;
});

// --- Boost Button ---
document.getElementById('boostBtn').addEventListener('click', () => {
    if(!isBoosting) {
        isBoosting = true;
        boostTimer = 2; // 2 δευτερόλεπτα boost
        document.getElementById('boostBtn').style.borderColor = '#f1c40f';
    }
});

// --- Menu Buttons ---
document.getElementById('exitBtn').addEventListener('click', () => {
    if(window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close();
});

// --- Resize ---
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
