<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cubes 2048.io</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        body { margin:0; background:#111; overflow:hidden; touch-action:none; font-family:sans-serif; }
        canvas { display:block; width:100vw; height:100vh; background:#222; }
        #ui { position:absolute; top:10px; left:10px; color:#fff; font-size:18px; z-index:10; }
        #boostBtn { 
            position:absolute; bottom:30px; right:30px; 
            width:80px; height:80px; border-radius:50%; 
            background:#ff5722; color:#fff; font-weight:bold; font-size:16px; 
            border:3px solid #fff; box-shadow: 0 0 20px #ff5722;
            z-index:20; touch-action:none; user-select:none;
        }
        #boostBtn:active { background:#d84315; transform:scale(0.95); }
        #boostStatus { position:absolute; bottom:30px; left:30px; color:#aaa; font-size:14px; z-index:10; }
        @media (max-width: 600px) { #ui { font-size:14px; } #boostBtn { width:70px; height:70px; font-size:14px; } }
    </style>
</head>
<body>

<div id="ui">
    <div>Αξία: <span id="score">2</span></div>
    <div>Παίκτες: <span id="playerCount">1</span></div>
</div>
<div id="boostStatus">Boost: Έτοιμο</div>
<button id="boostBtn">⚡ BOOST</button>
<canvas id="gameCanvas"></canvas>

<script>
// --- Ρύθμιση canvas για κινητά ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
function resizeCanvas() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr, dpr);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- Telegram Mini App έτοιμο ---
if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
}

// --- Σύνδεση με τον server (άλλαξε την URL στην πραγματική σου) ---
const SERVER_URL = 'https://το-όνομα-σου-cubes2048-server.hf.space'; // <-- ΑΛΛΑΞΕ ΑΥΤΟ
const socket = io(SERVER_URL);

// --- Μεταβλητές παιχνιδιού ---
let player = {
  x: window.innerWidth / 2,
  y: window.innerHeight / 2,
  value: 2,
  speed: 4,
  radius: 20,
  id: null // θα το πάρει από τον server
};

let isBoosting = false;
let boostTimeLeft = 0;
let boostCooldown = 0;
const BOOST_DURATION = 2;
const BOOST_COOLDOWN = 6;

let blocks = [];
const NUM_BLOCKS = 25;

// Αντίπαλοι παίκτες (από server)
let otherPlayers = {};

// Touch / Mouse
let touchX = player.x;
let touchY = player.y;
let isTouching = false;

// --- Δημιουργία μπλοκ στο χάρτη ---
function spawnBlock() {
  let val = Math.pow(2, Math.floor(Math.random() * 4) + 1);
  blocks.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    value: val,
    radius: 10 + val * 1.2
  });
}
for (let i = 0; i < NUM_BLOCKS; i++) spawnBlock();

// --- UI ---
function updateUI() {
  document.getElementById('score').innerText = player.value;
  document.getElementById('playerCount').innerText = Object.keys(otherPlayers).length + 1;
  let status = 'Έτοιμο';
  if (isBoosting) status = 'Ενεργό (' + boostTimeLeft.toFixed(1) + 's)';
  else if (boostCooldown > 0) status = 'Ψύξη (' + boostCooldown.toFixed(1) + 's)';
  document.getElementById('boostStatus').innerText = 'Boost: ' + status;
}

// --- Σύγκρουση κύκλων ---
function collides(x1, y1, r1, x2, y2, r2) {
  return Math.hypot(x1 - x2, y1 - y2) < r1 + r2;
}

// --- Κύρια ενημέρωση ---
function update(delta) {
  // Κίνηση
  if (isTouching) {
    let dx = touchX - player.x;
    let dy = touchY - player.y;
    let dist = Math.hypot(dx, dy);
    if (dist > 2) {
      let currentSpeed = player.speed * (isBoosting ? 3 : 1);
      let step = Math.min(currentSpeed, dist);
      player.x += (dx / dist) * step;
      player.y += (dy / dist) * step;
    }
  }

  // Boost timers
  if (isBoosting) {
    boostTimeLeft -= delta;
    if (boostTimeLeft <= 0) { isBoosting = false; boostCooldown = BOOST_COOLDOWN; }
  }
  if (boostCooldown > 0) {
    boostCooldown -= delta;
    if (boostCooldown < 0) boostCooldown = 0;
  }

  // Σύγκρουση με μπλοκ (τοπική λογική)
  for (let i = blocks.length - 1; i >= 0; i--) {
    let b = blocks[i];
    if (collides(player.x, player.y, player.radius, b.x, b.y, b.radius)) {
      if (b.value < player.value) { 
        player.value += b.value; 
        blocks.splice(i,1); 
        spawnBlock(); 
        // Ενημέρωση server για νέο value
        socket.emit('update', { x: player.x, y: player.y, value: player.value });
      }
      else if (b.value === player.value) { 
        player.value *= 2; 
        blocks.splice(i,1); 
        spawnBlock();
        socket.emit('update', { x: player.x, y: player.y, value: player.value });
      }
    }
  }

  // Ενημέρωση μεγέθους
  player.radius = 20 + player.value * 0.5;
  updateUI();
}

// --- Σχεδίαση ---
function draw() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  // Σχεδίαση μπλοκ
  blocks.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
    ctx.fillStyle = '#4CAF50'; ctx.fill(); ctx.strokeStyle = '#2E7D32'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.value, b.x, b.y);
  });

  // Σχεδίαση άλλων παικτών
  for (let id in otherPlayers) {
    let p = otherPlayers[id];
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius || 20, 0, Math.PI*2);
    ctx.fillStyle = '#e74c3c'; // κόκκινο για άλλους
    ctx.fill(); ctx.strokeStyle = '#c0392b'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 16px Arial';
    ctx.fillText(p.value, p.x, p.y);
  }

  // Σχεδίαση εαυτού
  ctx.shadowBlur = 20; ctx.shadowColor = '#FFD700';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
  let grad = ctx.createRadialGradient(player.x-5, player.y-5, 5, player.x, player.y, player.radius);
  grad.addColorStop(0, '#FFD700'); grad.addColorStop(1, '#FF8C00');
  ctx.fillStyle = grad; ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle='#fff'; ctx.font='bold 22px Arial'; ctx.fillText(player.value, player.x, player.y);
}

// --- Game Loop ---
let lastTime = performance.now();
function loop(time) {
  let delta = Math.min((time - lastTime)/1000, 0.05); lastTime = time;
  update(delta); draw(); requestAnimationFrame(loop);
}

// --- Socket Events ---
socket.on('connect', () => {
  console.log('Συνδέθηκες με ID:', socket.id);
  player.id = socket.id;
  // Στείλε αρχική θέση
  socket.emit('update', { x: player.x, y: player.y, value: player.value });
});

socket.on('players', (data) => {
  // Ενημέρωση λίστας παικτών (αφαίρεσε τον εαυτό σου)
  otherPlayers = {};
  for (let id in data) {
    if (id !== socket.id) {
      otherPlayers[id] = data[id];
    }
  }
});

socket.on('player_eaten', (data) => {
  // Αν φας κάποιον (ή σε φάνε) – εδώ μπορείς να κάνεις εφέ
  console.log('Συνέβη σύγκρουση:', data);
});

// --- Touch Events (κινητά) ---
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  touchX = t.clientX; touchY = t.clientY;
  isTouching = true;
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  touchX = t.clientX; touchY = t.clientY;
});
canvas.addEventListener('touchend', (e) => { e.preventDefault(); isTouching = false; });

// Mouse Events (δοκιμή σε PC)
canvas.addEventListener('mousemove', (e) => { touchX = e.clientX; touchY = e.clientY; isTouching = true; });
canvas.addEventListener('mouseleave', () => { isTouching = false; });

// Boost Button
document.getElementById('boostBtn').addEventListener('touchstart', (e) => {
  e.preventDefault(); 
  if (boostCooldown <= 0 && !isBoosting) { isBoosting = true; boostTimeLeft = BOOST_DURATION; }
});
document.getElementById('boostBtn').addEventListener('mousedown', (e) => {
  e.preventDefault();
  if (boostCooldown <= 0 && !isBoosting) { isBoosting = true; boostTimeLeft = BOOST_DURATION; }
});

// Εκκίνηση
requestAnimationFrame(loop);
</script>
</body>
</html>
