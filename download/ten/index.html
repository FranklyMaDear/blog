            const size = isMobile ? 70 : 85;
            const left = Math.random() * (windowWidth - size - 20) + 10;
            const top = Math.random() * (windowHeight - size - 100) + 50;
            balloon.style.position = 'fixed';
            balloon.style.left = left + 'px';
            balloon.style.top = top + 'px';
            balloon.style.right = 'auto';
            balloon.style.bottom = 'auto';
        }
        
        setRandomBalloonPosition();
        
        let moveInterval = setInterval(() => {
            if (balloon) {
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const isMobile = window.innerWidth <= 600;
                const size = isMobile ? 70 : 85;
                const newLeft = Math.random() * (windowWidth - size - 20) + 10;
                const newTop = Math.random() * (windowHeight - size - 100) + 50;
                balloon.style.transition = 'left 0.8s cubic-bezier(0.4, 0, 0.2, 1), top 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                balloon.style.left = newLeft + 'px';
                balloon.style.top = newTop + 'px';
                setTimeout(() => {
                    if (balloon) balloon.style.transition = '';
                }, 800);
            }
        }, 15000);
        
        window.addEventListener('resize', () => {
            setRandomBalloonPosition();
        });
        
        balloon.addEventListener('click', () => {
            console.log('Flying balloon clicked - Amazon My Store');
        });
        
        // ========== VIDEO PLAYER (video10.mp4) ==========
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const videoContainer = document.getElementById('videoContainer');
        let videoStarted = false;
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            video.play().catch(e => {
                console.log('Autoplay blocked, retrying:', e);
                video.muted = false;
                video.play().catch(err => console.log('Still blocked:', err));
            });
        }
        
        playOverlay.addEventListener('click', startVideo);
        videoContainer.addEventListener('click', startVideo);
        
        video.addEventListener('play', () => {
            playOverlay.classList.add('hidden');
        });
        
        video.addEventListener('ended', () => {
            videoStarted = false;
            playOverlay.classList.remove('hidden');
        });
        
        // ========== STICKY AD LOGIC ==========
        const stickyAd = document.getElementById('stickyAd');
        const closeStickyBtn = document.getElementById('closeStickyBtn');
        let stickyShown = false;
        
        const stickyClosedBefore = localStorage.getItem('stickyAdClosed_ten');
        if (stickyClosedBefore === 'true') {
            stickyAd.classList.add('collapsed');
            stickyShown = true;
        }
        
        closeStickyBtn.addEventListener('click', () => {
            stickyAd.classList.add('collapsed');
            localStorage.setItem('stickyAdClosed_ten', 'true');
        });
        
        if (!stickyShown && localStorage.getItem('stickyAdClosed_ten') !== 'true') {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && !stickyShown) {
                        stickyShown = true;
                        stickyAd.classList.remove('collapsed');
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.5 });
            
            observer.observe(videoContainer);
            
            setTimeout(() => {
                if (!stickyShown && localStorage.getItem('stickyAdClosed_ten') !== 'true') {
                    stickyShown = true;
                    stickyAd.classList.remove('collapsed');
                }
            }, 10000);
        }
        
        // ========== LAZY LOAD ADS ==========
        const adCards = document.querySelectorAll('.ad-card');
        const loadedAds = new Set();
        
        const loadAdIfNeeded = (card) => {
            const adIns = card.querySelector('ins.adsbygoogle');
            if (adIns && !loadedAds.has(card)) {
                loadedAds.add(card);
                setTimeout(() => {
                    if (typeof adsbygoogle !== 'undefined') {
                        try { 
                            (adsbygoogle = window.adsbygoogle || []).push({}); 
                            console.log('Ad loaded for card:', card.getAttribute('data-ad-index'));
                        } catch(e) {
                            console.log('Ad push error:', e);
                        }
                    }
                }, 50);
            }
        };
        
        const adObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    loadAdIfNeeded(entry.target);
                    adObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '100px' });
        
        adCards.forEach(card => adObserver.observe(card));
        
        const stickyContent = document.querySelector('.sticky-content ins');
        let stickyAdLoaded = false;
        
        const stickyObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !stickyAdLoaded && !stickyAd.classList.contains('collapsed')) {
                    stickyAdLoaded = true;
                    setTimeout(() => {
                        if (typeof adsbygoogle !== 'undefined') {
                            try { 
                                (adsbygoogle = window.adsbygoogle || []).push({});
                                console.log('Sticky ad loaded');
                            } catch(e) {}
                        }
                    }, 100);
                }
            });
        }, { threshold: 0.1 });
        
        if (stickyContent) {
            stickyObserver.observe(stickyContent);
        }
        
        window.addEventListener('load', () => {
            adCards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const isVisible = rect.top < window.innerHeight + 100 && rect.bottom > -100;
                if (isVisible && !loadedAds.has(card)) {
                    loadAdIfNeeded(card);
                }
            });
            
            console.log('✅ Page Loaded: https://blog.franklymadear.com/download/ten/index.html');
            console.log('📹 Video URL: https://blog.franklymadear.com/download/ten/video10.mp4');
            console.log('🖼️ Poster/OG Image: https://blog.franklymadear.com/download/ten/photo10.png');
            console.log('🎈 Flying Balloon "Amazon My Store" is active!');
            console.log('🐦 Twitter/X card configured with video title: Το πηγάδι του Διαβόλου');
        });
        
        // ========== IOS FIX ==========
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
        }
        
        window.addEventListener('beforeunload', () => {
            if (moveInterval) clearInterval(moveInterval);
        });
    })();
</script>
</body>
</html>
