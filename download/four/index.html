<script>

        function forcePlay() {
            video.muted = true;
            video.loop = true;
            video.autoplay = true;
            
            const promise = video.play();
            if (promise !== undefined) {
                promise.then(() => {
                    console.log('✅ Αυτόματη αναπαραγωγή επιτυχής');
                    document.addEventListener('click', function unmute() {
                        video.muted = false;
                        document.removeEventListener('click', unmute);
                    });
                }).catch(err => {
                    console.log('⚠️ Autoplay blocked, retry on click');
                    document.addEventListener('click', function retry() {
                        video.muted = false;
                        video.play().catch(e => console.log('Still blocked'));
                        document.removeEventListener('click', retry);
                    });
                });
            }
        }
        
        window.addEventListener('load', function() {
            setTimeout(forcePlay, 100);
            setTimeout(forcePlay, 300);
            setTimeout(forcePlay, 600);
        });
