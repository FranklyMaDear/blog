<script>
    (function() {
        'use strict';
        
        // ========== TOP ROLL-UP BANNER LOGIC ==========
        const topRollupBanner = document.getElementById('topRollupBanner');
        const topRollupCloseBtn = document.getElementById('topRollupCloseBtn');
        
        // Εμφάνιση του top roll-up banner μετά από 3 δευτερόλεπτα

        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            video.play().catch(e => {
                console.log('Autoplay blocked, retrying:', e);
                video.muted = false;
                video.play().catch(err => console.log('Still blocked:', err));
            });
        }
        
        playOverlay.addEventListener('click', startVideo);
        videoContainer.addEventListener('click', startVideo);
        
        video.addEventListener('play', () => {
            playOverlay.classList.add('hidden');
        });
        
        video.addEventListener('ended', () => {
            videoStarted = false;
            playOverlay.classList.remove('hidden');
        });
