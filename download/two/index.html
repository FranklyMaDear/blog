        /* ========== POP-UP AD OVERLAY (ΠΙΑΝΕΙ ΤΟ ΜΙΣΟ ΤΗΣ ΟΘΟΝΗΣ) ========== */
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        
        .ad-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .ad-popup {
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            max-height: 55vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,200,100,0.3);
            position: relative;
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .ad-popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
            z-index: 2;
            border-radius: 24px 24px 0 0;
        }
        
        .ad-popup-title {
            color: #FFB347;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .ad-close-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        
        .ad-close-btn:hover {
            background: rgba(255, 101, 132, 0.5);
            border-color: #FF6584;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 101, 132, 0.4);
        }
        
        .ad-popup-body {
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }
        
        .ad-popup-body ins {

            width: 300px !important;

        }
        
        .ad-skip-text {
            text-align: center;
            padding: 8px 16px 16px;
            color: rgba(255,255,255,0.5);
            font-size: 0.7rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .ad-skip-text:hover {
            color: rgba(255,255,255,0.9);
        }
        
        .ad-skip-text i {
            margin-right: 6px;
            animation: bounceDown 1.5s ease-in-out infinite;
        }
        
        @keyframes bounceDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }

        /* ========== AD CONTAINER (ΚΑΝΟΝΙΚΕΣ ΔΙΑΦΗΜΙΣΕΙΣ) ========== */

<!-- 📢 AD 1: POP-UP OVERLAY (ΠΙΑΝΕΙ ΤΟ ΜΙΣΟ ΤΗΣ ΟΘΟΝΗΣ) -->
<!-- ========================================== -->
<div class="ad-overlay" id="adOverlay">
    <div class="ad-popup">
        <div class="ad-popup-header">
            <span class="ad-popup-title">
                <i class="fas fa-crown" style="color: #FFD966;"></i>
                Υποστηρίξτε μας
            </span>
            <button class="ad-close-btn" id="adCloseBtn" title="Κλείσιμο διαφήμισης">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="ad-popup-body">
            <ins class="adsbygoogle"
                 style="display:inline-block;width:300px;height:600px"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="8243966497"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
        <div class="ad-skip-text" id="adSkipText">
            <i class="fas fa-chevron-down"></i> Κλείσιμο διαφήμισης
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';
        
        const video = document.getElementById('mainVideo');
        const adOverlay = document.getElementById('adOverlay');
        const adCloseBtn = document.getElementById('adCloseBtn');
        const adSkipText = document.getElementById('adSkipText');
        
        // ===== VIDEO AUTOPLAY =====
        video.muted = true;
        video.loop = true;
        video.autoplay = true;
        
        const playPromise = video.play();
        
        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log('✅ Video autoplay started');
            }).catch(error => {
                console.log('❌ Autoplay blocked, waiting for interaction', error);
            });
        }
        
        // ===== POP-UP AD FUNCTIONALITY =====
        function closeAdOverlay() {
            adOverlay.classList.add('hidden');
            
            // Ξεκίνα το βίντεο όταν κλείσει η διαφήμιση
            video.muted = false;
            video.play().catch(e => console.log('Play after ad close:', e));
            
            console.log('✅ Ad overlay closed, video unmuted');
        }
        
        // Κλείσιμο με το κουμπί X
        adCloseBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeAdOverlay();
        });
        
        // Κλείσιμο με το "Κλείσιμο διαφήμισης"
        adSkipText.addEventListener('click', function(e) {
            e.stopPropagation();
            closeAdOverlay();
        });
        
        // Κλείσιμο με κλικ έξω από το popup (στο σκοτεινό φόντο)
        adOverlay.addEventListener('click', function(e) {
            if (e.target === adOverlay) {
                closeAdOverlay();
            }
        });
        
        // Αυτόματο κλείσιμο μετά από 15 δευτερόλεπτα (ως fallback)
        setTimeout(() => {
            if (!adOverlay.classList.contains('hidden')) {
                closeAdOverlay();
                console.log('⏰ Ad overlay auto-closed after 15 seconds');
            }
        }, 15000);
        
        console.log('✅ Page Loaded - Ad overlay ready');
        
        // ===== ADSENSE: ΦΟΡΤΩΣΗ ΟΛΩΝ ΤΩΝ ADS =====
        if (window.adsbygoogle) {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
                console.log('✅ All AdSense ads pushed');
            } catch (e) {
                console.log('⚠️ AdSense push error:', e);
            }
        }
    })();
</script>
