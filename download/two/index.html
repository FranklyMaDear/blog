<!-- ========== VIDEO AUTOPLAY (Ενισχυμένο) ========== -->
<script>
    (function() {
        const video = document.getElementById('mainVideo');
        function forcePlay() {
            video.muted = true;
            video.loop = true;
            video.autoplay = true;
            video.play().then(() => {
                document.addEventListener('click', () => { video.muted = false; }, { once: true });
            }).catch(() => {
                document.addEventListener('click', () => { video.muted = false; video.play(); }, { once: true });
            });
        }
        window.addEventListener('load', () => {
            setTimeout(forcePlay, 100);
            setTimeout(forcePlay, 300);
        });
    })();
</script>
