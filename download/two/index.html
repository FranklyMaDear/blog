<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Άλλα λέει η Θειαμ - Βίντεο</title>
    <link rel="icon" type="image/png" href="https://blog.franklymadear.com/download/photo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter', sans-serif; background:#f4f7f9; display:flex; flex-direction:column; align-items:center; padding:20px; color:#1a1a2e; }
        .main-container { width:100%; max-width:480px; background:#fff; border-radius:24px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.08); }
        .video-section { margin:0 0 20px 0; background:#f8fafc; border-radius:20px; border:1px solid #e9edf4; overflow:hidden; }
        .video-wrapper { position:relative; width:100%; aspect-ratio:9/16; background:#000; border-radius:12px; overflow:hidden; }
        .video-wrapper iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
        .yt-cta { margin-top:16px; text-align:center; }
        .yt-cta a { display:inline-flex; align-items:center; gap:8px; background:#ff0000; color:#fff; padding:12px 28px; border-radius:60px; font-weight:700; text-decoration:none; }
        .comments-section { margin:24px 0; background:#fff; border:1px solid #eef2f6; border-radius:20px; padding:20px 16px; }
        .comments-header { margin-bottom:18px; border-bottom:2px solid #f1f5f9; padding-bottom:12px; }
        .comments-header h3 { color:#0f172a; font-size:1.2rem; font-weight:700; display:flex; align-items:center; gap:8px; }
        .games-section { margin:24px 0; background:#f8fafc; padding:18px; border-radius:20px; border:1px solid #eef2f6; text-align:center; }
        .game-card { display:flex; align-items:center; gap:14px; background:#fff; padding:12px 16px; border-radius:18px; margin-bottom:12px; text-decoration:none; color:#1e293b; border:1px solid #e9edf4; }
        .game-icon { width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; color:#fff; }
        .game-info { text-align:left; flex-grow:1; }
        .game-title { font-size:0.9rem; font-weight:600; }
        .game-desc { font-size:0.75rem; color:#64748b; }
        .play-now-btn { font-size:0.75rem; background:#3b82f6; color:#fff; padding:6px 16px; border-radius:30px; font-weight:600; }
        .footer-credit { text-align:center; padding:20px 0 5px; font-size:0.75rem; color:#94a3b8; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="video-section">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/TbaBf4SOMEk?rel=0" allowfullscreen loading="lazy"></iframe>
        </div>
        <div class="yt-cta"><a href="https://www.youtube.com/@zamanfou67?sub_confirmation=1" target="_blank"><i class="fab fa-youtube"></i> Κάνε Εγγραφή</a></div>
    </div>

    <!-- ============ FACEBOOK COMMENTS ============ -->
    <div class="comments-section">
        <div class="comments-header"><h3><i class="far fa-comment-dots"></i> Σχολίασε εδώ</h3></div>
        
        <!-- Facebook SDK -->
        <div id="fb-root"></div>
        <script async defer crossorigin="anonymous" src="https://connect.facebook.net/el_GR/sdk.js#xfbml=1&version=v18.0&appId=1379848579991113"></script>
        
        <!-- Το κουτί των σχολίων -->
        <div class="fb-comments" 
             data-href="https://franklymadear.com/" 
             data-width="100%" 
             data-numposts="10" 
             data-order-by="reverse_time"
             data-colorscheme="light">
        </div>
    </div>
    <!-- ========================================== -->

    <div class="games-section">
        <h2><i class="fas fa-gamepad"></i> Παίξε Δωρεάν</h2>
        <a href="https://t.me/lifeline2026_bot?profile" class="game-card" target="_blank">
            <div class="game-icon" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);"><i class="fas fa-hand-holding-magic"></i></div>
            <div class="game-info"><div class="game-title">Χειρομαντεία Bot</div><div class="game-desc">Μάθε τι κρύβουν οι γραμμές σου!</div></div>
            <div class="play-now-btn">Έναρξη</div>
        </a>
        <a href="https://t.me/omenread_bot?profile" class="game-card" target="_blank">
            <div class="game-icon" style="background:linear-gradient(135deg,#d97706,#b45309);"><i class="fas fa-coffee"></i></div>
            <div class="game-info"><div class="game-title">Καφεμαντεία Bot</div><div class="game-desc">Διάβασε το φλιτζάνι σου!</div></div>
            <div class="play-now-btn">Έναρξη</div>
        </a>
        <div class="footer-credit">© FranklyMadeAr Games</div>
    </div>
</div>
</body>
</html>
