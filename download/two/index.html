<script>
    (function() {
        'use strict';
        
        // ===== BACKGROUND PARTICLES =====
        function createBgParticles() {
            const container = document.getElementById('bgParticles');
            const colors = ['#FFB347', '#FF6584', '#6C63FF', '#00D4FF', '#FFD700'];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('bg-particle');
                
                const size = Math.random() * 4 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const duration = Math.random() * 20 + 15;
                const delay = Math.random() * 15;
                
                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    left: ${left}%;
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    box-shadow: 0 0 ${size * 3}px ${color};
                `;
                
                container.appendChild(particle);
            }
        }
        
        createBgParticles();
        
        // ===== NOTIFICATION BANNER =====
        const banner = document.getElementById('notificationBanner');
        const closeBtn = document.getElementById('notificationClose');
        const timerBar = document.getElementById('notificationTimer');
        const subtitle = banner.querySelector('.notification-subtitle');
        
        let timeLeft = 5;
        let timerInterval;
        let bannerTimeout;
        
        function showBanner() {
            banner.classList.add('show');
            banner.classList.remove('hide');
            timeLeft = 5;
            timerBar.style.width = '100%';
            subtitle.textContent = 'Φορτώνει... 5 δευτερόλεπτα';
            
            // Ενημέρωση timer bar
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                const widthPercent = (timeLeft / 5) * 100;
                timerBar.style.width = widthPercent + '%';
                subtitle.textContent = `Φορτώνει... ${Math.ceil(timeLeft)} δευτερόλεπτα`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    hideBanner();
                }
            }, 100);
            
            // Αυτόματη απόκρυψη μετά από 5 δευτερόλεπτα
            bannerTimeout = setTimeout(() => {
                hideBanner();
            }, 5000);
        }
        
        function hideBanner() {
            clearInterval(timerInterval);
            clearTimeout(bannerTimeout);
            banner.classList.add('hide');
            banner.classList.remove('show');
            console.log('🔔 Notification banner hidden');
        }
        
        // Κλείσιμο με το κουμπί X
        closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            hideBanner();
        });
        
        // ===== ΦΟΡΤΩΣΗ SCRIPT ΣΤΟ BANNER =====
        function loadScript() {
            showBanner();
            
            // Φόρτωση του script
            try {
                (function(s){
                    s.dataset.zone='10416274',
                    s.src='https://al5sm.com/tag.min.js'
                })(
                    [document.documentElement, document.body]
                        .filter(Boolean)
                        .pop()
                        .appendChild(document.createElement('script'))
                );
                console.log('📡 Script loaded in notification banner');
            } catch (e) {
                console.log('⚠️ Script load error:', e);
                subtitle.textContent = 'Το περιεχόμενο είναι έτοιμο';
            }
        }
        
        // Έναρξη μετά από 2 δευτερόλεπτα (να προλάβει να φορτώσει η σελίδα)
        setTimeout(() => {
            loadScript();
        }, 2000);
        
        console.log('✅ Page Loaded - Professional Layout Ready');
    })();
</script>
