<!-- ========== VIDEO PLAY SCRIPT ========== -->
<script>
    (function() {
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const playBtn = document.getElementById('playBtn');
        
        function startVideo(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            video.load();
            
            const playPromise = video.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Βίντεο ξεκίνησε');
                    playOverlay.classList.add('hidden');
                    video.muted = false;
                }).catch(err => {
                    console.log('⚠️ Δοκιμή με mute...');
                    video.muted = true;
                    video.play().then(() => {
                        console.log('✅ Βίντεο ξεκίνησε (muted)');
                        playOverlay.classList.add('hidden');
                    }).catch(err2 => {
                        console.error('❌ Σφάλμα:', err2);
                    });
                });
            }
        }
        
        playBtn.addEventListener('click', startVideo);
        playOverlay.addEventListener('click', startVideo);
        
        video.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.paused) {
                startVideo(e);
            } else {
                video.pause();
                playOverlay.classList.remove('hidden');
            }
        });
        
        video.addEventListener('ended', () => {
            playOverlay.classList.remove('hidden');
        });
        
        console.log('✅ Σελίδα έτοιμη - Περιμένει κλικ για play');
    })();
</script>
