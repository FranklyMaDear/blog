<!-- ========== MANUAL PLAY SCRIPT (Πατάει play ο χρήστης) ========== -->
<script>
    (function() {
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const playBtn = document.getElementById('playBtn');
        
        function startVideo() {
            video.play().then(() => {
                playOverlay.classList.add('hidden');
                console.log('✅ Βίντεο ξεκίνησε από τον χρήστη');
            }).catch(err => {
                console.log('⚠️ Play error:', err);
            });
        }
        
        // Κλικ στο κουμπί play
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startVideo();
        });
        
        // Κλικ οπουδήποτε στο overlay
        playOverlay.addEventListener('click', startVideo);
        
        // Αν ο χρήστης κάνει κλικ στο ίδιο το βίντεο (πέφτει πάνω του)
        video.addEventListener('click', () => {
            if (video.paused) {
                startVideo();
            } else {
                video.pause();
                playOverlay.classList.remove('hidden');
            }
        });
        
        // Όταν τελειώσει το βίντεο, δείξε ξανά το overlay
        video.addEventListener('ended', () => {
            playOverlay.classList.remove('hidden');
        });
        
        console.log('✅ Σελίδα έτοιμη - Ο χρήστης πρέπει να πατήσει play');
    })();
</script>

<!-- ========== ΛΕΙΤΟΥΡΓΙΑ POP‑UP & SLIDE‑UP ========== -->
<script>
    // Pop-up Modal (Εμφάνιση μετά από 3 δευτ.)
    const modal = document.getElementById('popupModal');
    const closeModal = document.getElementById('closeModalBtn');
    
    setTimeout(() => {

    }, 3000);
    
    closeModal.addEventListener('click', () => {

    // Κλείσιμο modal με κλικ έξω από αυτό
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.remove('active');

    });

    // Slide-up από κάτω (Εμφάνιση μετά από 8 δευτ.)
    const slideup = document.getElementById('slideupAd');

</script>
