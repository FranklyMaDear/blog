<script>
    document.addEventListener('DOMContentLoaded', function() {
        const wrapper = document.getElementById('videoWrapper');
        const playBtn = document.getElementById('playBtn');

        function loadVideo() {
            const iframe = document.createElement('iframe');
            // Χρησιμοποιούμε το embed URL με autoplay=1 και κρατάμε την παράμετρο is όπως δόθηκε
            iframe.src = 'https://www.youtube.com/embed/aKThxZMyV2o?autoplay=1&is=ghRHsTP_3W-_L8wZ';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.border = '0';
            wrapper.innerHTML = '';
            wrapper.appendChild(iframe);
        }

        playBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            loadVideo();
        });

        // Προαιρετικά: κλικ οπουδήποτε στο wrapper (εκτός από το κουμπί) ξεκινά το βίντεο
        wrapper.addEventListener('click', function(e) {
            if (e.target === wrapper || e.target.classList.contains('video-thumbnail')) {
                loadVideo();
            }
        });
    });
</script>
