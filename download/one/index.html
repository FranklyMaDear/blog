    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
        }
        
        .main-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: transparent;
        }
        
        .content-wrapper { padding: 10px; }
        
        /* ===== ΔΙΑΦΗΜΙΣΕΙΣ ===== */
        .ad-section {
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ad-section ins {
            border-radius: 12px;
            display: block;
            width: 100%;
        }
        
        /* ===== ΕΙΚΟΝΑ + PLAY BUTTON ===== */
        .thumbnail-section {
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        
        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            aspect-ratio: 9 / 16; /* αναλογία για Shorts */
            background: #000;
        }
        
        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            transition: background 0.3s ease;
            text-decoration: none;
        }
        
        .play-overlay:hover {
            background: rgba(0, 0, 0, 0.55);
        }
        
        .play-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease;
        }
        
        .play-overlay:hover .play-btn {
            transform: scale(1.08);
        }
        
        .play-btn i {
            font-size: 2.8rem;
            color: #fff;
            margin-left: 8px; /* οπτικό κέντρο */
        }
        
        /* ===== ΠΑΙΧΝΙΔΙΑ ===== */
        .games-section {
            margin-top: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.04);
            padding: 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        
        .games-section h2 {
            font-size: 1.05rem;
            color: #FFF;
            margin-bottom: 14px;
            font-weight: 700;
        }
        
        .game-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            padding: 12px;
            border-radius: 18px;
            margin-bottom: 10px;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.03);
        }
        
        .game-card:hover { background: rgba(0, 0, 0, 0.5); }
        
        .game-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #fff;
        }
        
        .game-info {
            text-align: left;
            flex-grow: 1;
        }
        
        .game-title { font-size: 0.88rem; font-weight: 600; }
        .game-desc { font-size: 0.72rem; color: rgba(255,255,255,0.5); }
        
        .play-now-btn {
            font-size: 0.75rem;
            background: #0088cc;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .all-games-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #FFB347, #FFCC33);

            text-decoration: none;
            padding: 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 14px;
        }
        
        .footer-credit {
            text-align: center;
            padding: 15px 0 5px;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.2);
        }
    </style>
</head>
