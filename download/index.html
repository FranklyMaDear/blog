    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            border-radius: 44px;
            overflow: hidden;
        }
        
        /* Content Wrapper */
        .content-wrapper {
            padding: 20px 20px 30px;
            position: relative;
        }
        
        /* Premium Title Section */
        .title-section {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 20px;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 12px;
            font-size: 0.7rem;
            color: #FFB347;
            border: 1px solid rgba(255, 200, 100, 0.3);
        }
        
        .title-section h1 {
            font-size: clamp(1.8rem, 8vw, 2.4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4, #FFD966);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        
        /* Install Prompt */
        .install-prompt {
            background: linear-gradient(135deg, rgba(255,153,0,0.2), rgba(255,105,180,0.2));
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,200,100,0.3);
            backdrop-filter: blur(10px);
            animation: slideDown 0.5s ease;
        }
        
        .install-prompt.hidden {
            display: none;
        }
        
        .install-text {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 0.85rem;
        }
        
        .install-text i {
            font-size: 1.5rem;
            color: #FFB347;
        }
        
        .install-btn {
            background: #FFB347;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .install-btn:active {
            transform: scale(0.95);
        }
        
        .close-install {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Video Container */
        .video-wrapper {
            position: relative;
            margin: 16px 0 20px;
            border-radius: 28px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,200,100,0.2);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            cursor: pointer;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        
        /* Single Play Button */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .play-overlay.hidden {
            display: none;
        }
        
        .play-btn {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
            backdrop-filter: blur(20px);

            align-items: center;
            justify-content: center;

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }
        
        .play-btn:active {
            transform: scale(0.92);
        }
        
        .play-btn i {
            font-size: 3rem;
            color: white;
            margin-left: 8px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));

            font-weight: 600;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);

            backdrop-filter: blur(10px);
            border-radius: 24px;

        }
        
        .amazon-card:active {
            transform: scale(0.98);
        }
        
        .amazon-card-header {
            background: linear-gradient(135deg, #ff9900, #ffad33);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        
        .amazon-card-header i {

            color: #232f3e;
        }
        
        .amazon-card-header span {
            font-size: 1.1rem;
            font-weight: 800;
            color: #232f3e;
        }
        
        .amazon-card-body {
            padding: 20px;
            text-align: center;
        }
        
        .amazon-card-body p {
            color: #e0e0e0;
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .amazon-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ff9900;
            color: #232f3e;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        
        .footer-credit {
            text-align: center;
            padding: 20px 0 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }
        
        /* Sticky Bottom Ad */
        .sticky-ad-container {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }
        
        .sticky-ad-inner {
            max-width: 450px;
            width: 90%;
            background: rgba(18, 22, 45, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 200, 100, 0.3);
            overflow: hidden;
            pointer-events: auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        
        .sticky-ad-inner.collapsed {
            transform: translateY(150%);
        }
        
        .sticky-header {
            display: flex;
            justify-content: flex-end;
            padding: 8px 12px 0;
        }
        
        .close-sticky {
            background: rgba(255, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        
        .close-sticky:active {
            transform: scale(0.94);
        }
        
        .sticky-content {
            padding: 10px 14px 14px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .ad-card {
            animation: fadeInUp 0.5s ease forwards;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-bottom: 100px;
            }
            .play-btn {
                width: 80px;
                height: 80px;
            }
            .play-btn i {
                font-size: 2.5rem;
            }
            .play-text {
                font-size: 0.8rem;
                padding: 6px 16px;
            }
            .content-wrapper {
                padding: 16px 16px 24px;
            }
            .sticky-ad-inner {
                width: 95%;
            }
            .install-prompt {
                padding: 10px 12px;
            }
            .install-text {
                font-size: 0.75rem;
            }
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        /* Facebook Debugger Helper */
        .fb-debug-info {
            display: none;
        }
    </style>
</head>

<script>
    (function() {
        'use strict';
        
        // ========== VIDEO PLAYER ==========
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const videoContainer = document.getElementById('videoContainer');
        let videoStarted = false;
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            video.play().catch(e => console.log('Play blocked:', e));
        }
        
        playOverlay.addEventListener('click', startVideo);
        videoContainer.addEventListener('click', startVideo);
        
        video.addEventListener('play', () => {
            playOverlay.classList.add('hidden');
        });
        
        video.addEventListener('ended', () => {
            videoStarted = false;
            playOverlay.classList.remove('hidden');
        });
        
        // ========== INSTALL TO HOME SCREEN ==========
        const installPrompt = document.getElementById('installPrompt');
        const installBtn = document.getElementById('installBtn');
        const closeInstallBtn = document.getElementById('closeInstallBtn');
        
        if (!sessionStorage.getItem('installPromptClosed')) {
            setTimeout(() => {
                installPrompt.classList.remove('hidden');
            }, 2000);
        }
        
        closeInstallBtn.addEventListener('click', () => {
            installPrompt.classList.add('hidden');
            sessionStorage.setItem('installPromptClosed', 'true');
        });
        
        installBtn.addEventListener('click', () => {
            let message = '';
            if (navigator.userAgent.includes('iPhone') || navigator.userAgent.includes('iPad')) {
                message = 'Πάτα το κουμπί "Share" (τετράγωνο με βέλος) και μετά "Προσθήκη στην Αρχική Οθόνη"';
            } else if (navigator.userAgent.includes('Android')) {
                message = 'Πάτα το μενού (⋮) και μετά "Προσθήκη στην αρχική οθόνη"';
            } else {
                message = 'Από το μενού του browser σου, επέλεξε "Προσθήκη στην αρχική οθόνη"';
            }
            alert(message);
            installPrompt.classList.add('hidden');
            sessionStorage.setItem('installPromptClosed', 'true');
        });
        
        // ========== STICKY AD ==========
        const stickyAd = document.getElementById('stickyAd');
        const closeStickyBtn = document.getElementById('closeStickyBtn');
        let stickyShown = false;
        
        closeStickyBtn.addEventListener('click', () => {
            stickyAd.classList.add('collapsed');
            sessionStorage.setItem('stickyClosed', 'true');
        });
        
        if (sessionStorage.getItem('stickyClosed') !== 'true') {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && !stickyShown) {
                        stickyShown = true;
                        stickyAd.classList.remove('collapsed');
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.3 });
            
            observer.observe(videoContainer);
            
            setTimeout(() => {
                if (!stickyShown && sessionStorage.getItem('stickyClosed') !== 'true') {
                    stickyShown = true;
                    stickyAd.classList.remove('collapsed');
                }
            }, 8000);
        } else {
            stickyAd.classList.add('collapsed');
        }
        
        // ========== LAZY LOAD ADS ==========
        const adCards = document.querySelectorAll('.ad-card');
        const adObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const adIns = card.querySelector('ins.adsbygoogle');
                    if (adIns && !adIns.getAttribute('data-loaded')) {
                        adIns.setAttribute('data-loaded', 'true');
                        setTimeout(() => {
                            if (typeof adsbygoogle !== 'undefined') {
                                try { 
                                    (adsbygoogle = window.adsbygoogle || []).push({}); 
                                } catch(e) {}
                            }
                        }, 100);
                    }
                }
            });
        }, { threshold: 0.1, rootMargin: '50px' });
        
        adCards.forEach(card => adObserver.observe(card));
        
        window.addEventListener('load', () => {
            if (typeof adsbygoogle !== 'undefined') {
                try { 
                    (adsbygoogle = window.adsbygoogle || []).push({}); 
                } catch(e) {}
            }
        });

        console.log('4. Η εικόνα photo.png θα εμφανιστεί στα previews');
    })();
