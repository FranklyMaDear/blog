<script>
    (function() {
        'use strict';
        
        // ========== FULLSCREEN AD WITH 5-SECOND COUNTDOWN ==========
        const fullscreenAd = document.getElementById('fullscreenAd');
        const mainContent = document.getElementById('mainContent');
        const countdownSpan = document.getElementById('countdownNumber');
        const skipBtn = document.getElementById('skipAdBtn');
        
        let countdown = 5;
        let countdownInterval;
        
        function closeAd() {
            fullscreenAd.classList.add('closed');
            mainContent.classList.add('visible');
            if (countdownInterval) clearInterval(countdownInterval);
        }
        
        function updateCountdown() {
            countdownSpan.textContent = countdown;
            if (countdown <= 0) {
                closeAd();
            }
            countdown--;
        }
        
        // Start countdown
        countdownInterval = setInterval(updateCountdown, 1000);
        
        // Skip button
        skipBtn.addEventListener('click', closeAd);
        
        // ========== VIDEO PLAYER - STARTS ONLY ON USER CLICK ==========
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const videoContainer = document.getElementById('videoContainer');
        
        let videoStarted = false;
        
        function updatePlayIcon() {
            if (video.paused) {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        }
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            video.play().catch(e => console.log('Play blocked:', e));
            updatePlayIcon();
        }
        
        function togglePlayPause() {
            if (!videoStarted) {
                startVideo();
                return;
            }
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
            updatePlayIcon();
        }
        
        function toggleMute() {
            if (!videoStarted) return;
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        }
        
        playOverlay.addEventListener('click', startVideo);
        
        videoContainer.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            if (!videoStarted) {
                startVideo();
            } else {
                togglePlayPause();
            }
        });
        
        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlayPause();
        });
        
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });
        
        video.addEventListener('play', updatePlayIcon);
        video.addEventListener('pause', updatePlayIcon);
        
        // ========== STICKY AD WITH SCROLL DETECTION ==========
        const stickyAd = document.getElementById('stickyAd');
        const closeSticky = document.getElementById('closeStickyBtn');
        let stickyShown = false;
        
        closeSticky.addEventListener('click', () => {
            stickyAd.classList.add('collapsed');
            sessionStorage.setItem('stickyClosed', 'true');
        });
        
        if (sessionStorage.getItem('stickyClosed') === 'true') {
            stickyAd.classList.add('collapsed');
        } else {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && !stickyShown) {
                        stickyShown = true;
                        stickyAd.classList.remove('collapsed');
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.5 });
            
            observer.observe(videoContainer);
            
            setTimeout(() => {
                if (!stickyShown && sessionStorage.getItem('stickyClosed') !== 'true') {
                    stickyShown = true;
                    stickyAd.classList.remove('collapsed');
                }
            }, 8000);
        }
        
        // ========== LAZY LOAD DEEP ADS ==========
        const contentCards = document.querySelectorAll('.content-card');
        const adObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const adIns = card.querySelector('ins.adsbygoogle');
                    if (adIns && !adIns.getAttribute('data-loaded')) {
                        adIns.setAttribute('data-loaded', 'true');
                        if (typeof adsbygoogle !== 'undefined') {
                            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                        }
                    }
                }
            });
        }, { threshold: 0.1, rootMargin: '100px' });
        
        contentCards.forEach(card => adObserver.observe(card));
        
        // ========== BACKGROUND AD FOR EXTRA REVENUE ==========
        setTimeout(() => {
            const bgAd = document.createElement('div');
            bgAd.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
            bgAd.innerHTML = `
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="autorelaxed"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="9660744817"
                     data-full-width-responsive="true"></ins>
            `;
            document.body.appendChild(bgAd);
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
            setTimeout(() => bgAd.remove(), 12000);
        }, 5000);
        
        // ========== FINAL AD PUSH ==========
        window.addEventListener('load', () => {
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        });
        
        console.log('Page loaded - Sticky ad reduced by 50% for mobile');
    })();
</script>
</body>
</html>
