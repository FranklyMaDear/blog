    <meta property="og:description" content="Δες το βίντεο και ανακάλυψε το κατάστημά μας στο Amazon!">

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            border-radius: 44px;
            overflow: hidden;
        }
        
        /* Content Wrapper */
        .content-wrapper {
            padding: 20px 20px 30px;
            position: relative;
        }
        
        /* Premium Title Section */
        .title-section {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 20px;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 12px;
            font-size: 0.7rem;
            color: #FFB347;
            border: 1px solid rgba(255, 200, 100, 0.3);
        }
        
        .title-section h1 {
            font-size: clamp(1.8rem, 8vw, 2.4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4, #FFD966);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        
        /* Video Container */
        .video-wrapper {
            position: relative;
            margin: 16px 0 20px;
            border-radius: 28px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,200,100,0.2);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            cursor: pointer;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        
        /* Single Play Button - Centered */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .play-overlay.hidden {
            display: none;
        }
        
        .play-btn {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
            backdrop-filter: blur(20px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2.5px solid rgba(255, 215, 0, 0.9);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }
        
        .play-btn:active {
            transform: scale(0.92);
        }
        
        .play-btn i {
            font-size: 3rem;
            color: white;
            margin-left: 8px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }
        
        .play-text {
            margin-top: 20px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 40px;
            letter-spacing: 0.5px;
        }
        
        /* Amazon Store Card - Premium Style */
        .amazon-card {
            background: linear-gradient(135deg, rgba(35, 47, 62, 0.95), rgba(26, 37, 50, 0.95));
            backdrop-filter: blur(10px);
            border-radius: 24px;
            margin: 20px 0;
            border: 1px solid rgba(255, 153, 0, 0.4);
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        
        .amazon-card:active {
            transform: scale(0.98);
        }
        
        .amazon-card-header {
            background: linear-gradient(135deg, #ff9900, #ffad33);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .amazon-card-header i {
            font-size: 1.6rem;
            color: #232f3e;
        }
        
        .amazon-card-header span {
            font-size: 1.1rem;
            font-weight: 800;
            color: #232f3e;
        }
        
        .amazon-card-body {
            padding: 20px;
            text-align: center;
        }
        
        .amazon-card-body p {
            color: #e0e0e0;
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .amazon-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ff9900;
            color: #232f3e;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        
        .footer-credit {
            text-align: center;
            padding: 20px 0 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }
        
        /* iPhone Optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .play-btn {
                width: 80px;
                height: 80px;
            }
            .play-btn i {
                font-size: 2.5rem;
            }
            .play-text {
                font-size: 0.8rem;
                padding: 6px 16px;
            }
            .content-wrapper {
                padding: 16px 16px 24px;
            }
        }
        
        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="content-wrapper">
        
        <!-- Title Section -->
        <div class="title-section">
            <div class="badge">
                <i class="fas fa-play-circle"></i>
                <span>Νέο Βίντεο</span>
            </div>
            <h1>Άλλα λέει η Θειαμ</h1>
            <div class="subtitle">
                <i class="fas fa-star" style="color: #FFD966;"></i>
                <i class="fas fa-star" style="color: #FFD966;"></i>
                <i class="fas fa-star" style="color: #FFD966;"></i>
                <i class="fas fa-star" style="color: #FFD966;"></i>
                <i class="fas fa-star" style="color: #FFD966;"></i>
            </div>
        </div>
        
        <!-- Video Section with Single Play Button -->
        <div class="video-wrapper">
            <div class="video-container" id="videoContainer">
                <video id="mainVideo" poster="https://blog.franklymadear.com/download/photo.png" playsinline webkit-playsinline preload="metadata">
                    <source src="https://blog.franklymadear.com/download/video.mp4" type="video/mp4">
                </video>
                <div class="play-overlay" id="playOverlay">
                    <div class="play-btn">
                        <i class="fas fa-play"></i>
                    </div>
                    <div class="play-text">
                        <i class="fas fa-hand-pointer"></i> Πάτα για αναπαραγωγή
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Amazon Store Card - Only Store -->
        <a href="https://www.amazon.de/shop/exoumethemata/list/28PPEU66U03KT?ref_=cm_sw_r_cp_ud_aipsflist_3S3RRSGE6FTD34XN7AFR" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="amazon-card">
            <div class="amazon-card-header">
                <i class="fab fa-amazon"></i>
                <span>Το κατάστημά μας στο Amazon</span>
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="amazon-card-body">
                <p>✨ Ανακάλυψε τα προϊόντα που αγαπάμε και προτείνουμε! ✨</p>
                <div class="amazon-cta">
                    <i class="fas fa-store"></i> Επισκέψου το κατάστημα
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>
        </a>
        
        <div class="footer-credit">
            <i class="fas fa-heart" style="color: #ff69b4;"></i> Ευχαριστούμε που μας υποστηρίζεις
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';
        
        // Video Player - Single Play Button
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const videoContainer = document.getElementById('videoContainer');
        
        let videoStarted = false;
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            video.play().catch(e => console.log('Play blocked:', e));
        }
        
        // Start video when clicking the play button or video container
        playOverlay.addEventListener('click', startVideo);
        videoContainer.addEventListener('click', startVideo);
        
        // Auto-hide overlay when video starts playing
        video.addEventListener('play', () => {
            playOverlay.classList.add('hidden');
        });
        
        // Optional: Show overlay again if video ends (user can replay)
        video.addEventListener('ended', () => {
            videoStarted = false;
            playOverlay.classList.remove('hidden');
        });
        
        console.log('Page Loaded - Single Play Button, Amazon Store Only');
    })();
</script>
</body>
</html>
