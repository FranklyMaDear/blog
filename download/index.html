<script>
    (function() {
        'use strict';
        
        // ========== FULLSCREEN AD WITH 5-SECOND COUNTDOWN ==========
        const fullscreenAd = document.getElementById('fullscreenAd');
        const mainContent = document.getElementById('mainContent');
        const countdownSpan = document.getElementById('countdownNumber');
        const skipBtn = document.getElementById('skipAdBtn');
        
        let countdown = 5;
        let countdownInterval;
        
        function closeAd() {
            fullscreenAd.classList.add('closed');
            mainContent.classList.add('visible');
            if (countdownInterval) clearInterval(countdownInterval);
        }
        
        function updateCountdown() {
            countdownSpan.textContent = countdown;
            if (countdown <= 0) {
                closeAd();
            }
            countdown--;
        }
        
        countdownInterval = setInterval(updateCountdown, 1000);
        skipBtn.addEventListener('click', closeAd);
        
        // ========== VIDEO PLAYER - SINGLE CENTRAL PLAY BUTTON ==========
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const muteBtn = document.getElementById('muteBtn');
        const videoContainer = document.getElementById('videoContainer');
        
        let videoStarted = false;
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            video.play().catch(e => console.log('Play blocked:', e));
        }
        
        function toggleMute() {
            if (!videoStarted) return;
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        }
        
        // Click on overlay starts video
        playOverlay.addEventListener('click', startVideo);
        
        // Click on video container (but not on buttons) does nothing - only overlay starts video
        videoContainer.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            if (!videoStarted) {
                startVideo();
            }
        });
        
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });
        
        // ========== POPUP ADS - Appear at specific moments ==========
        function showPopupAd() {
            // Check if popup already exists
            if (document.querySelector('.popup-overlay')) return;
            
            const popupOverlay = document.createElement('div');
            popupOverlay.className = 'popup-overlay';
            popupOverlay.innerHTML = `
                <div class="popup-ad">
                    <div class="popup-header">
                        <h3><i class="fas fa-gift"></i> Ειδική Προσφορά</h3>
                        <button class="popup-close" id="popupCloseBtn"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="popup-body">
                        <ins class="adsbygoogle"
                             style="display:block; width:100%;"
                             data-ad-format="autorelaxed"
                             data-ad-client="ca-pub-3186700611266549"
                             data-ad-slot="9660744817"
                             data-full-width-responsive="true"></ins>
                        <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
                    </div>
                    <div class="popup-footer">
                        Διαφήμιση - Κλείστε για να συνεχίσετε
                    </div>
                </div>
            `;
            document.body.appendChild(popupOverlay);
            
            const popupClose = document.getElementById('popupCloseBtn');
            const closePopup = () => {
                popupOverlay.remove();
            };
            popupClose.addEventListener('click', closePopup);
            popupOverlay.addEventListener('click', (e) => {
                if (e.target === popupOverlay) closePopup();
            });
        }
        
        // Show popup ad when video starts
        function showVideoStartPopup() {
            setTimeout(() => {
                if (!document.querySelector('.popup-overlay')) {
                    showPopupAd();
                }
            }, 800);
        }
        
        // Show popup ad when user scrolls past video
        function setupScrollPopup() {
            let popupShown = false;
            window.addEventListener('scroll', () => {
                if (!popupShown && window.scrollY > 300) {
                    popupShown = true;
                    setTimeout(() => {
                        if (!document.querySelector('.popup-overlay')) {
                            showPopupAd();
                        }
                    }, 500);
                }
            });
        }
        
        // Show popup after 15 seconds of page interaction
        function setupTimedPopup() {
            setTimeout(() => {
                if (!document.querySelector('.popup-overlay')) {
                    showPopupAd();
                }
            }, 18000);
        }
        
        // Show popup when clicking on Amazon store (exit intent style)
        const amazonStore = document.querySelector('.amazon-store');
        if (amazonStore) {
            amazonStore.addEventListener('click', () => {
                setTimeout(() => {
                    if (!document.querySelector('.popup-overlay')) {
                        showPopupAd();
                    }
                }, 100);
            });
        }
        
        // ========== TRIGGER POPUPS ON VIDEO START ==========
        const originalStartVideo = startVideo;
        window.startVideo = startVideo;
        
        // Override startVideo to also trigger popup
        video.addEventListener('play', () => {
            if (videoStarted) {
                showVideoStartPopup();
            }
        });
        
        // Also trigger on first user interaction with video
        const observerForVideoStart = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    if (playOverlay.classList.contains('hidden') && !videoStarted) {
                        videoStarted = true;
                        showVideoStartPopup();
                    }
                }
            });
        });
        observerForVideoStart.observe(playOverlay, { attributes: true });
        
        // ========== STICKY AD ==========
        const stickyAd = document.getElementById('stickyAd');
        const closeSticky = document.getElementById('closeStickyBtn');
        let stickyShown = false;
        
        closeSticky.addEventListener('click', () => {
            stickyAd.classList.add('collapsed');
            sessionStorage.setItem('stickyClosed', 'true');
        });
        
        if (sessionStorage.getItem('stickyClosed') === 'true') {
            stickyAd.classList.add('collapsed');
        } else {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && !stickyShown) {
                        stickyShown = true;
                        stickyAd.classList.remove('collapsed');
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.5 });
            observer.observe(videoContainer);
            setTimeout(() => {
                if (!stickyShown && sessionStorage.getItem('stickyClosed') !== 'true') {
                    stickyShown = true;
                    stickyAd.classList.remove('collapsed');
                }
            }, 8000);
        }
        
        // ========== LAZY LOAD ADS ==========
        const contentCards = document.querySelectorAll('.content-card');
        const adObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const adIns = card.querySelector('ins.adsbygoogle');
                    if (adIns && !adIns.getAttribute('data-loaded')) {
                        adIns.setAttribute('data-loaded', 'true');
                        if (typeof adsbygoogle !== 'undefined') {
                            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                        }
                    }
                }
            });
        }, { threshold: 0.1, rootMargin: '100px' });
        contentCards.forEach(card => adObserver.observe(card));
        
        // ========== EXTRA POPUP TRIGGERS ==========
        setupScrollPopup();
        setupTimedPopup();
        
        // Additional popup when user clicks on any content card
        const contentCardsClick = document.querySelectorAll('.content-card');
        contentCardsClick.forEach(card => {
            card.addEventListener('click', () => {
                setTimeout(() => {
                    if (!document.querySelector('.popup-overlay')) {
                        showPopupAd();
                    }
                }, 200);
            });
        });
        
        // ========== BACKGROUND AD ==========
        setTimeout(() => {
            const bgAd = document.createElement('div');
            bgAd.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
            bgAd.innerHTML = `
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="autorelaxed"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="9660744817"
                     data-full-width-responsive="true"></ins>
            `;
            document.body.appendChild(bgAd);
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
            setTimeout(() => bgAd.remove(), 12000);
        }, 5000);
        
        window.addEventListener('load', () => {
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        });
        
        console.log('Page loaded - Single play button, popup ads integrated');
    })();
</script>
</body>
</html>
