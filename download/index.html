<script>
    (function() {
        'use strict';
        
        // ========== FULLSCREEN AD WITH COUNTDOWN ==========
        const fullscreenAd = document.getElementById('fullscreenAd');
        const mainContent = document.getElementById('mainContent');
        const countdownSpan = document.getElementById('countdownNumber');
        const skipBtn = document.getElementById('skipAdBtn');
        
        let countdown = 5;
        let countdownInterval;
        let popupShown = false;
        
        function closeAd() {
            fullscreenAd.classList.add('closed');
            mainContent.classList.add('visible');
            if (countdownInterval) clearInterval(countdownInterval);
            
            // Show popup ad after 3 seconds
            setTimeout(() => {
                if (!popupShown) {
                    showPopupAd();
                }
            }, 3000);
        }
        
        function updateCountdown() {
            countdownSpan.textContent = countdown;
            if (countdown <= 0) {
                closeAd();
            }
            countdown--;
        }
        
        countdownInterval = setInterval(updateCountdown, 1000);
        skipBtn.addEventListener('click', closeAd);
        
        // ========== POPUP AD SYSTEM ==========
        function showPopupAd() {
            popupShown = true;
            
            const popupHtml = `
                <div class="popup-overlay" id="popupOverlay">
                    <div class="popup-container">
                        <div class="popup-header">
                            <div class="popup-title">
                                <i class="fas fa-gift"></i> Προσφορά
                            </div>
                            <button class="popup-close" id="popupCloseBtn">
                                <i class="fas fa-times"></i> Κλείσιμο
                            </button>
                        </div>
                        <div class="popup-body">
                            <div class="popup-image">
                                <img src="https://blog.franklymadear.com/download/photo.png" alt="Διαφήμιση" style="width:100%; border-radius:16px;">
                            </div>
                            <div class="popup-text">
                                <strong>✨ Ειδική Προσφορά! ✨</strong><br>
                                Ανακάλυψε μοναδικές εκπτώσεις στο κατάστημά μας!
                            </div>
                            <a href="https://www.amazon.de/shop/exoumethemata/list/28PPEU66U03KT" target="_blank" class="popup-button" id="popupButton">
                                <i class="fab fa-amazon"></i> Δες τώρα
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', popupHtml);
            
            const popupOverlay = document.getElementById('popupOverlay');
            const popupClose = document.getElementById('popupCloseBtn');
            const popupButton = document.getElementById('popupButton');
            
            function closePopup() {
                popupOverlay.classList.add('closed');
                setTimeout(() => popupOverlay.remove(), 300);
            }
            
            popupClose.addEventListener('click', closePopup);
            popupOverlay.addEventListener('click', (e) => {
                if (e.target === popupOverlay) closePopup();
            });
            
            // Show second popup after 15 seconds
            setTimeout(() => {
                if (document.getElementById('popupOverlay') === null && !popupShown) {
                    showSecondPopup();
                }
            }, 15000);
        }
        
        function showSecondPopup() {
            const secondPopupHtml = `
                <div class="popup-overlay" id="popupOverlay2">
                    <div class="popup-container">
                        <div class="popup-header">
                            <div class="popup-title">
                                <i class="fas fa-video"></i> Βίντεο Προσφοράς
                            </div>
                            <button class="popup-close" id="popupCloseBtn2">
                                <i class="fas fa-times"></i> Κλείσιμο
                            </button>
                        </div>
                        <div class="popup-body">
                            <div class="popup-video">
                                <video controls playsinline style="width:100%; border-radius:16px;">
                                    <source src="https://blog.franklymadear.com/download/video.mp4" type="video/mp4">
                                </video>
                            </div>
                            <div class="popup-text">
                                <strong>🎬 Δες το βίντεο!</strong><br>
                                Μάθε περισσότερα για τις προσφορές μας.
                            </div>
                            <a href="https://www.amazon.de/shop/exoumethemata/list/28PPEU66U03KT" target="_blank" class="popup-button">
                                <i class="fab fa-amazon"></i> Επισκέψου το κατάστημα
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', secondPopupHtml);
            
            const popupOverlay = document.getElementById('popupOverlay2');
            const popupClose = document.getElementById('popupCloseBtn2');
            
            function closePopup() {
                popupOverlay.classList.add('closed');
                setTimeout(() => popupOverlay.remove(), 300);
            }
            
            popupClose.addEventListener('click', closePopup);
            popupOverlay.addEventListener('click', (e) => {
                if (e.target === popupOverlay) closePopup();
            });
        }
        
        // ========== VIDEO PLAYER - PLAY BUTTON STARTS VIDEO ==========
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const videoContainer = document.getElementById('videoContainer');
        
        let videoStarted = false;
        
        function updatePlayIcon() {
            if (video.paused) {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        }
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            video.play().catch(e => console.log('Play blocked:', e));
            updatePlayIcon();
        }
        
        function togglePlayPause() {
            if (!videoStarted) {
                startVideo();
                return;
            }
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
            updatePlayIcon();
        }
        
        function toggleMute() {
            if (!videoStarted) return;
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        }
        
        // Play button starts video
        playOverlay.addEventListener('click', startVideo);
        
        videoContainer.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            if (!videoStarted) {
                startVideo();
            } else {
                togglePlayPause();
            }
        });
        
        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlayPause();
        });
        
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });
        
        video.addEventListener('play', updatePlayIcon);
        video.addEventListener('pause', updatePlayIcon);
        
        // ========== STICKY AD ==========
        const stickyAd = document.getElementById('stickyAd');
        const closeSticky = document.getElementById('closeStickyBtn');
        let stickyShown = false;
        
        closeSticky.addEventListener('click', () => {
            stickyAd.classList.add('collapsed');
            sessionStorage.setItem('stickyClosed', 'true');
        });
        
        if (sessionStorage.getItem('stickyClosed') === 'true') {
            stickyAd.classList.add('collapsed');
        } else {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && !stickyShown) {
                        stickyShown = true;
                        stickyAd.classList.remove('collapsed');
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.5 });
            observer.observe(videoContainer);
            
            setTimeout(() => {
                if (!stickyShown && sessionStorage.getItem('stickyClosed') !== 'true') {
                    stickyShown = true;
                    stickyAd.classList.remove('collapsed');
                }
            }, 8000);
        }
        
        // ========== BACKGROUND AD ==========
        setTimeout(() => {
            const bgAd = document.createElement('div');
            bgAd.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
            bgAd.innerHTML = `<ins class="adsbygoogle" style="display:block" data-ad-format="autorelaxed" data-ad-client="ca-pub-3186700611266549" data-ad-slot="9660744817"></ins>`;
            document.body.appendChild(bgAd);
            if (typeof adsbygoogle !== 'undefined') (adsbygoogle = window.adsbygoogle || []).push({});
            setTimeout(() => bgAd.remove(), 12000);
        }, 5000);
        
        window.addEventListener('load', () => {
            if (typeof adsbygoogle !== 'undefined') (adsbygoogle = window.adsbygoogle || []).push({});
        });
    })();
</script>
</body>
</html>
