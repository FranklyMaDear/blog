    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #0f0c1f, #1e1a35);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        
        /* Title styling - only title visible */
        .page-title {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .page-title h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #ffb6c1, #ff69b4, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 15px #ff99cc;
            letter-spacing: 1px;
        }
        
        /* Reels style video - vertical 9:16 aspect ratio */
        .video-reels {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 0 3px rgba(255, 200, 100, 0.5);
            margin: 0 auto;
        }
        
        .video-reels video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #000;
        }
        
        /* Simple video controls overlay */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-reels:hover .video-controls {
            opacity: 1;
        }
        
        .video-controls button {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 1.4rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-controls button:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.5);
        }
        
        /* Ad boxes */
        .ad-box {
            margin: 16px auto;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 2px solid #fcba5c;
            background: #181e34;
        }
        
        .ad-box ins {
            display: block;
            width: 100%;
        }
        
        /* Top ad spacing */
        .ad-top {
            margin-bottom: 16px;
        }
        
        .ad-bottom {
            margin-top: 16px;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .page-title h1 {
                font-size: 1.6rem;
            }
            .video-reels {
                border-radius: 20px;
            }
            .video-controls button {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
            .ad-box {
                border-radius: 18px;
                margin: 12px auto;
            }
        }
    </style>
</head>
<body>
<div class="container">
    
    <!-- Only Title -->
    <div class="page-title">
        <h1>Άλλα λέει η Θειαμ</h1>

    <!-- Top Ad -->

        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="fluid"
             data-ad-layout-key="-fb+5w+4e-db+86"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="3969235710"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    
    <!-- VIDEO - REELS STYLE (vertical 9:16) -->
    <div class="video-reels">
        <video id="mainVideo" poster="https://blog.franklymadear.com/download/photo.png" playsinline>
            <source src="https://blog.franklymadear.com/download/video.mp4" type="video/mp4">
            Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την προβολή βίντεο.
        </video>
        <div class="video-controls">
            <button id="playPauseBtn" aria-label="Play/Pause">
                <i class="fas fa-play"></i>
            </button>
            <button id="muteBtn" aria-label="Mute/Unmute">

    <!-- Third Ad -->

        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="fluid"
             data-ad-layout-key="-fb+5w+4e-db+86"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="3969235710"></ins>

<!-- Font Awesome for icons (only needed for controls) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script>
    // Video player controls
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    
    // Function to update play/pause icon
    function updatePlayPauseIcon() {
        if (video.paused) {
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        } else {
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }
    }
    
    // Play/Pause toggle
    function togglePlayPause() {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
        updatePlayPauseIcon();
    }
    
    // Mute/Unmute toggle
    function toggleMute() {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }
    
    // Event listeners
    playPauseBtn.addEventListener('click', togglePlayPause);
    muteBtn.addEventListener('click', toggleMute);
    
    video.addEventListener('play', updatePlayPauseIcon);
    video.addEventListener('pause', updatePlayPauseIcon);
    
    // Initialize: try autoplay muted (better UX)
    video.muted = true;
    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
    video.play().catch(function(e) {
        // Autoplay was prevented; user will click play
        console.log("Autoplay prevented:", e);
    });
    
    // When user taps anywhere on video, toggle play/pause (easier mobile interaction)
    const videoContainer = document.querySelector('.video-reels');
    videoContainer.addEventListener('click', function(e) {
        // Avoid triggering when clicking on buttons
        if (e.target.closest('button')) return;
        togglePlayPause();
    });
    
    // Load any remaining AdSense ads
    if (typeof adsbygoogle !== 'undefined') {
        (adsbygoogle = window.adsbygoogle || []).push({});
    }
    
    // Ensure all AdSense ads are pushed again for dynamically loaded ones
    window.addEventListener('load', function() {
        if (typeof adsbygoogle !== 'undefined') {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch(e) {}
        }
    });
</script>
