            -webkit-background-clip: text;

        /* Reels video */
        .video-reels {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 200, 100, 0.5);
            margin: 0 auto;
            cursor: pointer;
        }
        
        .video-reels video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        
        /* Video controls - subtle but accessible */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-reels:hover .video-controls,
        .video-reels:active .video-controls {
            opacity: 1;
        }
        
        .video-controls button {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);

        }

        }
        
        /* Ad content */
        .ad-content {
            width: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ad-content ins {

        }
        
        /* In-feed ad - natural placement */
        .in-feed-ad {
            margin: 20px 0;
        }
        
        /* Optional video ad (non-intrusive, loads only if user scrolls) */
        .optional-video-ad {
            margin: 16px 0;
            border-radius: 20px;
            overflow: hidden;
            background: #1a1f3a;
            border: 1px solid rgba(255, 180, 100, 0.3);
            transition: all 0.3s;
        }
        
        .optional-video-ad .ad-content {
            min-height: 250px;
        }
        
        /* Sticky footer ad - small and non-intrusive */
        .smart-sticky {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #0f0c1f, transparent);
            padding: 10px 12px 8px;
            z-index: 999;
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            pointer-events: none;
        }
        
        .smart-sticky .sticky-inner {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(20, 25, 45, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            border: 1px solid rgba(255, 200, 100, 0.4);
            overflow: hidden;
            pointer-events: auto;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }
        
        .smart-sticky.collapsed {
            transform: translateY(100%);
        }
        
        .sticky-header {
            display: flex;
            justify-content: flex-end;
            padding: 6px 10px 0;
        }
        
        .close-sticky {
            background: rgba(255, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .close-sticky:active {
            transform: scale(0.95);
        }
        
        .sticky-ad-content {

        /* Lazy load indicator */
        .lazy-placeholder {
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
        }
        
        /* User-friendly spacing */
        .content-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,200,100,0.3), transparent);
            margin: 20px 0 10px;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 10px;

            }

            }

            }

            }
        }
        
        @media (min-width: 768px) {
            .smart-sticky .sticky-inner {
                max-width: 500px;
            }
        }
        
        /* Animation */
        @keyframes gentleFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .ad-wrapper {
            animation: gentleFade 0.5s ease-out;
        }

                 style="display:block"

<script>
    // ========== VIDEO PLAYER ==========
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    
    function updatePlayIcon() {
        playPauseBtn.innerHTML = video.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
    }
    
    function togglePlayPause() {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
        updatePlayIcon();
    }
    
    function toggleMute() {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }
    
    playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });
    muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });
    video.addEventListener('play', updatePlayIcon);
    video.addEventListener('pause', updatePlayIcon);
    
    // Tap video to play/pause
    document.querySelector('.video-reels').addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        togglePlayPause();
    });
    
    // Enable sound on first interaction (user-friendly)
    let soundEnabled = false;
    function enableSound() {
        if (!soundEnabled && video.muted) {
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            soundEnabled = true;
            document.removeEventListener('click', enableSound);
            document.removeEventListener('touchstart', enableSound);
        }
    }
    document.addEventListener('click', enableSound);
    document.addEventListener('touchstart', enableSound);
    
    // ========== LAZY LOAD DEEP AD (User-friendly: only loads if user scrolls) ==========
    const lazyAd = document.getElementById('ad6');
    let lazyLoaded = false;
    
    function loadLazyAd() {
        if (lazyLoaded) return;
        lazyLoaded = true;
        
        const lazyContent = document.getElementById('lazyAdContent');
        lazyContent.innerHTML = `
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"
                 data-full-width-responsive="true"></ins>
        `;
        if (typeof adsbygoogle !== 'undefined') {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }
    }
    
    // Intersection Observer for lazy loading
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                loadLazyAd();
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.3 });
    
    observer.observe(lazyAd);
    
    // ========== SMART STICKY AD (Non-intrusive, appears after scroll) ==========
    const sticky = document.getElementById('smartSticky');
    const closeSticky = document.getElementById('closeStickyBtn');
    let stickyShown = false;
    let stickyTimeout;
    
    closeSticky.addEventListener('click', () => {
        sticky.classList.add('collapsed');
        // Remember user preference for this session
        sessionStorage.setItem('stickyClosed', 'true');
    });
    
    // Check if user already closed sticky
    if (sessionStorage.getItem('stickyClosed') === 'true') {
        sticky.classList.add('collapsed');
    } else {
        // Show sticky after user scrolls past video (non-intrusive)
        window.addEventListener('scroll', function onScroll() {
            if (stickyShown) return;
            const videoRect = document.querySelector('.video-reels').getBoundingClientRect();
            if (videoRect.bottom < 100) {
                stickyShown = true;
                sticky.classList.remove('collapsed');
                window.removeEventListener('scroll', onScroll);
            }
        });
        
        // Fallback: show after 10 seconds if no scroll
        stickyTimeout = setTimeout(() => {
            if (!stickyShown && sessionStorage.getItem('stickyClosed') !== 'true') {
                stickyShown = true;
                sticky.classList.remove('collapsed');
            }
        }, 10000);
    }
    
    // ========== GENTLE AD REFRESH (Only when user is idle) ==========
    let refreshTimer;
    let refreshCount = 0;
    const MAX_REFRESH = 2;
    
    function gentleAdRefresh() {
        if (refreshCount >= MAX_REFRESH) return;
        if (typeof adsbygoogle !== 'undefined') {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
                refreshCount++;
            } catch(e) {}
        }
    }
    
    // Refresh only when user is idle (non-intrusive)
    let idleTimer;
    window.addEventListener('scroll', () => {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            gentleAdRefresh();
        }, 5000);
    });
    
    // Refresh after video ends
    video.addEventListener('ended', () => {
        setTimeout(gentleAdRefresh, 3000);
    });
    
    // ========== EXTRA BACKGROUND AD (Hidden - increases revenue without affecting UX) ==========
    setTimeout(() => {
        const bgAd = document.createElement('div');
        bgAd.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
        bgAd.innerHTML = `
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"></ins>
        `;
        document.body.appendChild(bgAd);
        if (typeof adsbygoogle !== 'undefined') {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }
        setTimeout(() => bgAd.remove(), 10000);
    }, 8000);
    
    // ========== INITIALIZE ALL ADS ==========
    window.addEventListener('load', () => {
        if (typeof adsbygoogle !== 'undefined') {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }
    });
</script>
