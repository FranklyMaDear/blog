<script>
    (function() {
        'use strict';
        
        // Fullscreen Ad with Countdown
        const fullscreenAd = document.getElementById('fullscreenAd');
        const mainContainer = document.querySelector('.main-container');
        const countdownSpan = document.getElementById('countdownNumber');
        const skipBtn = document.getElementById('skipAdBtn');
        
        let countdown = 5;
        let countdownInterval;
        
        function closeFullscreenAd() {
            fullscreenAd.classList.add('closed');
            if (countdownInterval) clearInterval(countdownInterval);
        }
        
        function updateCountdown() {
            countdownSpan.textContent = countdown;
            if (countdown <= 0) {
                closeFullscreenAd();
            }
            countdown--;
        }
        
        countdownInterval = setInterval(updateCountdown, 1000);
        skipBtn.addEventListener('click', closeFullscreenAd);
        
        // Video Player - Premium Play Button
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const videoContainer = document.getElementById('videoContainer');
        
        let videoStarted = false;
        
        function updatePlayIcon() {
            if (video.paused) {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        }
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            video.play().catch(e => console.log('Play blocked:', e));
            updatePlayIcon();
        }
        
        function togglePlayPause() {
            if (!videoStarted) {
                startVideo();
                return;
            }
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
            updatePlayIcon();
        }
        
        function toggleMute() {
            if (!videoStarted) return;
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        }
        
        playOverlay.addEventListener('click', startVideo);
        
        videoContainer.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            if (!videoStarted) {
                startVideo();
            } else {
                togglePlayPause();
            }
        });
        
        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlayPause();
        });
        
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });
        
        video.addEventListener('play', updatePlayIcon);
        video.addEventListener('pause', updatePlayIcon);
        
        // Sticky Banner with Scroll Detection
        const stickyBanner = document.getElementById('stickyBanner');
        const closeBanner = document.getElementById('closeBannerBtn');
        let bannerShown = false;
        
        closeBanner.addEventListener('click', () => {
            stickyBanner.classList.add('collapsed');
            sessionStorage.setItem('bannerClosed', 'true');
        });
        
        if (sessionStorage.getItem('bannerClosed') === 'true') {
            stickyBanner.classList.add('collapsed');
        } else {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && !bannerShown) {
                        bannerShown = true;
                        stickyBanner.classList.remove('collapsed');
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.5 });
            
            observer.observe(videoContainer);
            
            setTimeout(() => {
                if (!bannerShown && sessionStorage.getItem('bannerClosed') !== 'true') {
                    bannerShown = true;
                    stickyBanner.classList.remove('collapsed');
                }
            }, 8000);
        }
        
        // Lazy Load Ads
        const adCards = document.querySelectorAll('.ad-card');
        const adObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const adIns = card.querySelector('ins.adsbygoogle');
                    if (adIns && !adIns.getAttribute('data-loaded')) {
                        adIns.setAttribute('data-loaded', 'true');
                        if (typeof adsbygoogle !== 'undefined') {
                            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                        }
                    }
                }
            });
        }, { threshold: 0.1, rootMargin: '100px' });
        
        adCards.forEach(card => adObserver.observe(card));
        
        // Final Ad Push
        window.addEventListener('load', () => {
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        });
        
        console.log('iOS Optimized Project Loaded - Premium Play Button Active');
    })();
</script>
</body>
</html>
