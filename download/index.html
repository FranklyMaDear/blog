    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: 110px; /* Χώρος για το sticky ad */
        }
        
        .main-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            border-radius: 44px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .content-wrapper {
            padding: 20px 20px 30px;
        }
        
        .title-section {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 20px;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 12px;
            font-size: 0.7rem;
            color: #FFB347;
            border: 1px solid rgba(255, 200, 100, 0.3);
        }
        
        .title-section h1 {
            font-size: clamp(1.8rem, 8vw, 2.4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4, #FFD966);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        .video-wrapper {
            position: relative;
            margin: 16px 0 20px;
            border-radius: 28px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,200,100,0.2);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            cursor: pointer;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        
        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(0,0,0,0.6));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
        }
        
        .play-overlay.hidden {
            display: none;
        }
        
        .play-btn {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
            backdrop-filter: blur(20px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2.5px solid rgba(255, 215, 0, 0.9);
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }
        
        .play-btn i {
            font-size: 3rem;
            color: white;
            margin-left: 8px;
        }
        
        .play-text {
            margin-top: 20px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 40px;
        }
        
        /* Ad Cards */
        .ad-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 200, 100, 0.2);
            overflow: hidden;
        }
        
        .ad-card-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 10px 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .ad-card-content {
            padding: 12px 16px 16px;
            min-height: 250px; /* Δίνουμε ένα ελάχιστο ύψος για να φαίνονται οι διαφημίσεις */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .footer-credit {
            text-align: center;
            padding: 20px 0 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }
        
        /* Sticky Bottom Ad */
        .sticky-ad-container {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
        }
        
        .sticky-ad-inner {
            max-width: 450px;
            width: 92%;
            background: rgba(18, 22, 45, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 200, 100, 0.3);
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        
        .sticky-ad-inner.hidden {
            display: none;
        }
        
        .sticky-header {
            display: flex;
            justify-content: flex-end;
            padding: 6px 12px 2px;
        }
        
        .close-sticky {
            background: rgba(255, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .sticky-content {
            padding: 4px 12px 12px;
            min-height: 60px;
        }

        @media (max-width: 480px) {
            body { padding: 10px; padding-bottom: 110px; }
            .play-btn { width: 80px; height: 80px; }
            .play-btn i { font-size: 2.5rem; }
            .content-wrapper { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="content-wrapper">
        
        <!-- Title -->
        <div class="title-section">
            <div class="badge">
                <i class="fas fa-play-circle"></i>
                <span>Νέο Βίντεο</span>
            </div>
            <h1>Άλλα λέει η Θειαμ</h1>
        </div>
        
        <!-- Video Player -->
        <div class="video-wrapper">
            <div class="video-container" id="videoContainer">
                <video id="mainVideo" poster="https://blog.franklymadear.com/download/photo.png" playsinline preload="metadata">
                    <source src="https://blog.franklymadear.com/download/video.mp4" type="video/mp4">
                </video>
                <div class="play-overlay" id="playOverlay">
                    <div class="play-btn">
                        <i class="fas fa-play"></i>
                    </div>
                    <div class="play-text">Πάτα για αναπαραγωγή</div>
                </div>
            </div>
        </div>
        
        <!-- AD 1 -->
        <div class="ad-card">
            <div class="ad-card-label"><i class="fas fa-ad"></i> Διαφήμιση 1</div>
            <div class="ad-card-content">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="3092455087"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </div>
        
        <!-- AD 2 -->
        <div class="ad-card">
            <div class="ad-card-label"><i class="fas fa-ad"></i> Διαφήμιση 2</div>
            <div class="ad-card-content">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="3092455087"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </div>
        
        <!-- AD 3 -->
        <div class="ad-card">
            <div class="ad-card-label"><i class="fas fa-ad"></i> Διαφήμιση 3</div>
            <div class="ad-card-content">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="3092455087"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </div>
        
        <div class="footer-credit">Ευχαριστούμε για την επίσκεψη!</div>
    </div>
</div>

<!-- Sticky Bottom Ad -->
<div class="sticky-ad-container">
    <div class="sticky-ad-inner" id="stickyAd">
        <div class="sticky-header">
            <button class="close-sticky" id="closeStickyBtn">Κλείσιμο</button>
        </div>
        <div class="sticky-content">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="3092455087"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';
        
        // Video Logic
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const videoContainer = document.getElementById('videoContainer');
        
        function handleVideoPlay() {
            playOverlay.classList.add('hidden');
            video.muted = false;
            video.play().catch(err => {
                console.log("Play error, playing muted", err);
                video.muted = true;
                video.play();
            });
        }
        
        playOverlay.addEventListener('click', handleVideoPlay);
        videoContainer.addEventListener('click', handleVideoPlay);
        video.addEventListener('ended', () => { playOverlay.classList.remove('hidden'); });

        // Sticky Close Logic
        const stickyAd = document.getElementById('stickyAd');
        document.getElementById('closeStickyBtn').addEventListener('click', () => {
            stickyAd.classList.add('hidden');
        });

        // Απλό και άμεσο φόρτωμα διαφημίσεων για αποφυγή κενών πλαισίων
        window.addEventListener('load', () => {
            try {
                const totalAds = document.querySelectorAll('ins.adsbygoogle').length;
                for (let i = 0; i < totalAds; i++) {
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                }
            } catch (e) {
                console.error("AdSense execution error:", e);
            }
        });
    })();
</script>
</body>
