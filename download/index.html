        * {

        body {

        .container {

        /* Title styling */
        .page-title {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .page-title h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #ffb6c1, #ff69b4, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 15px #ff99cc;
            letter-spacing: 1px;
        }
        
        /* Reels style video - vertical 9:16 */
        .video-reels {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 0 3px rgba(255, 200, 100, 0.5);
            margin: 0 auto;
        }
        
        .video-reels video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #000;
        }
        
        /* Video controls overlay */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-reels:hover .video-controls {
            opacity: 1;
        }
        
        .video-controls button {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 1.4rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-controls button:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.5);
        }
        
        /* Ad boxes - multiple formats */
        .ad-box {
            margin: 16px auto;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 2px solid #fcba5c;
            background: #181e34;
            min-height: 100px;
        }
        
        .ad-box ins, .ad-box .ad-container {
            display: block;
            width: 100%;
        }
        
        /* In-article video ad container */
        .video-ad-container {
            margin: 16px auto;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #ff69b4;
            background: #0a0c1a;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-ad-container div {
            width: 100%;
        }
        
        /* Sticky ad at bottom */
        .sticky-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            border-top: 3px solid #ffd700;
            z-index: 1000;
            transform: translateY(0);
            transition: transform 0.3s;
            max-height: 100px;
            overflow: hidden;
        }
        
        .sticky-ad.collapsed {
            transform: translateY(100%);
        }
        
        .close-sticky {
            position: absolute;
            top: -30px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 8px;
                padding-bottom: 110px;
            }
            .page-title h1 {
                font-size: 1.6rem;
            }

                margin: 12px auto;
            }
            .video-ad-container {
                border-radius: 18px;
                min-height: 250px;
            }
        }
        
        /* Animation for ads */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .ad-box, .video-ad-container {
            animation: fadeIn 0.5s ease-out;
        }
    </style>

<script>
    // ==================== VIDEO PLAYER WITH SOUND ENABLED ====================
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    
    // Force sound ON - unmute by default
    video.muted = false;
    
    // Update icon function
    function updatePlayPauseIcon() {
        if (video.paused) {
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        } else {
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }
    }
    
    // Play/Pause toggle
    function togglePlayPause() {
        if (video.paused) {
            // Play with sound
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            video.play();
        } else {
            video.pause();
        }
        updatePlayPauseIcon();
    }
    
    // Mute/Unmute toggle
    function toggleMute() {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }
    
    // Event listeners
    playPauseBtn.addEventListener('click', togglePlayPause);
    muteBtn.addEventListener('click', toggleMute);
    
    video.addEventListener('play', updatePlayPauseIcon);
    video.addEventListener('pause', updatePlayPauseIcon);
    
    // Ensure sound is ON and video plays automatically with sound
    // Chrome allows autoplay with sound only if user has interacted with the site
    // We'll try to play, and if blocked, show a tap-to-unmute message
    let autoplayAttempted = false;
    
    function attemptAutoplay() {
        video.muted = false;
        video.play().then(() => {
            console.log("Autoplay with sound succeeded");
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
        }).catch((error) => {
            console.log("Autoplay with sound failed:", error);
            // Fallback: try muted autoplay first, then enable sound on first user interaction
            video.muted = true;
            muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
            video.play().catch(e => console.log("Muted autoplay also failed:", e));
            
            // Add one-time interaction to unmute
            const enableSound = () => {
                video.muted = false;
                muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                document.removeEventListener('click', enableSound);
                document.removeEventListener('touchstart', enableSound);
            };
            document.addEventListener('click', enableSound);
            document.addEventListener('touchstart', enableSound);
        });
    }
    
    // Try autoplay immediately
    attemptAutoplay();
    
    // Tap on video to toggle play/pause
    const videoContainer = document.querySelector('.video-reels');
    videoContainer.addEventListener('click', function(e) {
        if (e.target.closest('button')) return;
        togglePlayPause();
    });
    
    // ==================== GPT VIDEO AD (HIGH CPM) ====================
    // Define GPT ad slot for video ad
    window.googletag = window.googletag || {cmd: []};
    googletag.cmd.push(function() {
        // Video ad unit
        var videoAdSlot = googletag.defineSlot('/63554191/Travel/Europe/France/Paris', [300, 250], 'gpt-video-ad')
            .addService(googletag.pubads());
        googletag.pubads().enableSingleRequest();
        googletag.enableServices();
        googletag.display('gpt-video-ad');
    });
    
    // ==================== STICKY AD HANDLER ====================
    const stickyAd = document.getElementById('stickyAd');
    const closeStickyBtn = document.getElementById('closeStickyBtn');
    
    closeStickyBtn.addEventListener('click', function() {
        stickyAd.classList.add('collapsed');
        // Optional: refresh ads after closing
        setTimeout(() => {
            if (typeof adsbygoogle !== 'undefined') {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                } catch(e) {}
            }
        }, 100);
    });
    
    // Show sticky ad after 3 seconds
    setTimeout(() => {
        stickyAd.classList.remove('collapsed');
    }, 3000);
    
    // ==================== REFRESH ALL ADS FOR BETTER REVENUE ====================
    // Refresh ads periodically to increase impressions
    let adRefreshCount = 0;
    const maxRefreshes = 3;
    
    function refreshAds() {
        if (adRefreshCount >= maxRefreshes) return;
        adRefreshCount++;
        
        // Push new AdSense ads
        if (typeof adsbygoogle !== 'undefined') {
            try {
                // Get all ad ins elements and refresh
                document.querySelectorAll('.ad-box ins.adsbygoogle').forEach(ad => {
                    if (ad.getAttribute('data-ad-status') !== 'filled') {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    }
                });
            } catch(e) {}
        }
        
        // Refresh GPT ad
        if (window.googletag && googletag.pubads) {
            googletag.cmd.push(function() {
                googletag.pubads().refresh();
            });
        }
    }
    
    // Refresh ads on scroll and after video completion
    let refreshTimeout;
    window.addEventListener('scroll', function() {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(refreshAds, 3000);
    });
    
    // Refresh when video ends (increased engagement)
    video.addEventListener('ended', function() {
        setTimeout(refreshAds, 2000);
    });
    
    // ==================== ADDITIONAL AD SLOTS (INTERSTITIAL STYLE) ====================
    // Create an invisible iframe for additional ad loading
    function loadExtraAd() {
        const extraAdDiv = document.createElement('div');
        extraAdDiv.style.position = 'absolute';
        extraAdDiv.style.left = '-9999px';
        extraAdDiv.style.top = '-9999px';
        extraAdDiv.innerHTML = `
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="fluid"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="3969235710"></ins>
        `;
        document.body.appendChild(extraAdDiv);
        if (typeof adsbygoogle !== 'undefined') {
            (adsbygoogle = window.adsbygoogle || []).push({});
        }
        setTimeout(() => extraAdDiv.remove(), 5000);
    }
    
    // Load extra ad after page load
    setTimeout(loadExtraAd, 5000);
    
    // ==================== ANALYTICS FOR AD PERFORMANCE ====================
    // Track ad impressions (for better optimization)
    if (typeof gtag !== 'undefined') {
        gtag('config', 'G-MEASUREMENT_ID', {
            'send_page_view': true
        });
    }
    
    // Log that page is ready
    console.log('Page loaded with max ad placements for optimal revenue');
    
    // Ensure all AdSense ads are initialized
    window.addEventListener('load', function() {
        if (typeof adsbygoogle !== 'undefined') {
            try {
                // Final push for any remaining ads
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch(e) {}
        }
        
        // Refresh GPT ad after load
        if (window.googletag && googletag.cmd) {
            googletag.cmd.push(function() {
                googletag.pubads().refresh();
            });
        }
    });
</script>

</script>
