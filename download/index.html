    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #0f0c1f, #1e1a35);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            padding-bottom: 100px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        
        /* Title */
        .page-title {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .page-title h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #ffb6c1, #ff69b4, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 15px #ff99cc;
        }
        
        /* Reels video - 9:16 */
        .video-reels {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 0 3px rgba(255, 200, 100, 0.5);
            margin: 0 auto;
        }
        
        .video-reels video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #000;
        }
        
        /* Video controls */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-reels:hover .video-controls {
            opacity: 1;
        }
        
        .video-controls button {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 1.4rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-controls button:active {
            transform: scale(0.92);
        }
        
        /* Ad boxes */
        .ad-box {
            margin: 16px auto;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 2px solid #fcba5c;
            background: #181e34;
            animation: fadeIn 0.5s ease-out;
        }
        
        .ad-box ins {
            display: block;
            width: 100%;
        }
        
        /* Video ad container */
        .video-ad-container {
            margin: 16px auto;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #ff69b4;
            background: #0a0c1a;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Sticky bottom ad */
        .sticky-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            border-top: 3px solid #ffd700;
            z-index: 1000;
            transform: translateY(0);
            transition: transform 0.3s;
            max-height: 100px;
            overflow: hidden;
        }
        
        .sticky-ad.collapsed {
            transform: translateY(100%);
        }
        
        .close-sticky {
            position: absolute;
            top: -30px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 8px;
                padding-bottom: 110px;
            }
            .page-title h1 {
                font-size: 1.6rem;
            }
            .video-reels {
                border-radius: 20px;
            }
            .video-controls button {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
            .ad-box {
                border-radius: 18px;
                margin: 12px auto;
            }
            .video-ad-container {
                border-radius: 18px;
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    
    <!-- TITLE -->
    <div class="page-title">
        <h1>Άλλα λέει η Θειαμ</h1>
    </div>
    
    <!-- AD 1 - TOP (autorelaxed) -->
    <div class="ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="autorelaxed"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    
    <!-- VIDEO REELS -->
    <div class="video-reels">
        <video id="mainVideo" poster="https://blog.franklymadear.com/download/photo.png" playsinline autoplay muted>
            <source src="https://blog.franklymadear.com/download/video.mp4" type="video/mp4">
        </video>
        <div class="video-controls">
            <button id="playPauseBtn"><i class="fas fa-play"></i></button>
            <button id="muteBtn"><i class="fas fa-volume-mute"></i></button>
        </div>
    </div>
    
    <!-- AD 2 - AFTER VIDEO (autorelaxed) -->
    <div class="ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="autorelaxed"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    
    <!-- VIDEO AD (GPT - high CPM) -->
    <div class="video-ad-container">
        <div id="gpt-video-ad" style="min-height: 250px; width: 100%;"></div>
    </div>
    
    <!-- AD 3 - MIDDLE (autorelaxed) -->
    <div class="ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="autorelaxed"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    
    <!-- AD 4 - MIDDLE 2 (autorelaxed) -->
    <div class="ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="autorelaxed"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"></ins>

    <!-- AD 5 - BOTTOM (autorelaxed) -->
    <div class="ad-box">

             style="display:block"

             data-ad-slot="9660744817"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="autorelaxed"
             data-ad-client="ca-pub-3186700611266549"
             data-ad-slot="9660744817"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
</div>

<!-- STICKY BOTTOM AD -->
<div class="sticky-ad" id="stickyAd">
    <button class="close-sticky" id="closeStickyBtn">×</button>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-format="autorelaxed"
         data-ad-client="ca-pub-3186700611266549"
         data-ad-slot="9660744817"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<script>
    // ========== VIDEO PLAYER (with sound attempt) ==========
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    
    function updatePlayIcon() {
        playPauseBtn.innerHTML = video.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
    }
    
    function togglePlayPause() {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
        updatePlayIcon();
    }
    
    function toggleMute() {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }
    
    playPauseBtn.addEventListener('click', togglePlayPause);
    muteBtn.addEventListener('click', toggleMute);
    video.addEventListener('play', updatePlayIcon);
    video.addEventListener('pause', updatePlayIcon);
    
    // Try to unmute on first user interaction
    document.body.addEventListener('click', function unmuteOnce() {
        video.muted = false;
        muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
        document.body.removeEventListener('click', unmuteOnce);
    }, { once: true });
    
    // Tap video to play/pause
    document.querySelector('.video-reels').addEventListener('click', function(e) {
        if (e.target.closest('button')) return;
        togglePlayPause();
    });
    
    // ========== GPT VIDEO AD (High CPM) ==========
    window.googletag = window.googletag || {cmd: []};
    googletag.cmd.push(function() {
        var videoAdSlot = googletag.defineSlot('/63554191/Travel/Europe/France/Paris', [300, 250], 'gpt-video-ad')
            .addService(googletag.pubads());
        googletag.pubads().enableSingleRequest();
        googletag.enableServices();
        googletag.display('gpt-video-ad');
    });
    
    // ========== STICKY AD ==========
    const stickyAd = document.getElementById('stickyAd');
    document.getElementById('closeStickyBtn').addEventListener('click', function() {
        stickyAd.classList.add('collapsed');
    });
    
    // Show sticky ad after 3 seconds
    setTimeout(() => stickyAd.classList.remove('collapsed'), 3000);
    
    // ========== AD REFRESH ON SCROLL ==========
    let refreshTimeout;
    window.addEventListener('scroll', function() {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => {
            if (typeof adsbygoogle !== 'undefined') {
                document.querySelectorAll('.ad-box ins.adsbygoogle').forEach(() => {
                    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                });
            }
        }, 3000);
    });
    
    // Refresh on video end
    video.addEventListener('ended', () => {
        setTimeout(() => {
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        }, 2000);
    });
    
    // Load extra invisible ad
    setTimeout(() => {
        const extra = document.createElement('div');
        extra.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
        extra.innerHTML = `<ins class="adsbygoogle" style="display:block" data-ad-format="autorelaxed" data-ad-client="ca-pub-3186700611266549" data-ad-slot="9660744817"></ins>`;
        document.body.appendChild(extra);
        if (typeof adsbygoogle !== 'undefined') (adsbygoogle = window.adsbygoogle || []).push({});
        setTimeout(() => extra.remove(), 5000);
    }, 5000);
    
    // Final ad push on load
    window.addEventListener('load', () => {
        if (typeof adsbygoogle !== 'undefined') {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }
        if (window.googletag?.cmd) {
            googletag.cmd.push(() => googletag.pubads().refresh());
        }
    });
</script>
