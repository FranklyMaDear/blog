    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #0f0c1f, #1e1a35);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            padding-bottom: 85px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        
        /* Title - Mobile optimized */
        .page-title {
            text-align: center;
            margin-bottom: 12px;
        }
        
        .page-title h1 {
            font-size: clamp(1.4rem, 6vw, 2rem);
            font-weight: 800;
            background: linear-gradient(145deg, #ffb6c1, #ff69b4, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 15px #ff99cc;
            padding: 0 10px;
        }
        
        /* Reels video - 9:16 with touch optimization */
        .video-reels {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 200, 100, 0.6);
            margin: 0 auto;
            cursor: pointer;
        }
        
        .video-reels video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #000;
        }
        
        /* Video controls - Touch friendly */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            padding: 15px 16px 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-reels:active .video-controls,
        .video-reels:hover .video-controls {
            opacity: 1;
        }
        
        .video-controls button {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 1.3rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        
        .video-controls button:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.3);
        }
        
        /* Ad containers - Mobile first responsive */
        .ad-container {
            margin: 14px auto;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: transparent;
            text-align: center;
        }
        
        /* Responsive ad boxes */
        .ad-box {
            width: 100%;
            min-height: 80px;
            background: rgba(24, 30, 52, 0.6);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ad-box ins,
        .ad-box .ad-slot {
            display: block;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }
        
        /* Mobile optimized ad spacing */
        .ad-spacing {
            margin: 12px 0;
        }
        
        /* Sticky bottom ad - Mobile friendly */
        .sticky-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 12, 26, 0.98);
            border-top: 3px solid #ffd700;
            z-index: 1000;
            transform: translateY(0);
            transition: transform 0.3s ease;
            padding: 8px 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
        }
        
        .sticky-ad.collapsed {
            transform: translateY(100%);
        }
        
        .close-sticky {
            position: absolute;
            top: -32px;
            right: 12px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .close-sticky:active {
            transform: scale(0.92);
        }
        
        /* In-feed ad container */
        .in-feed-ad {
            width: 100%;
            margin: 14px 0;
            border-radius: 20px;
            overflow: hidden;
            background: #181e34;
            border: 1px solid rgba(255, 200, 100, 0.4);
        }
        
        /* Tablet optimization */
        @media (min-width: 768px) and (max-width: 1024px) {
            body {
                padding: 16px;
                padding-bottom: 100px;
            }
            .container {
                max-width: 600px;
            }
            .video-reels {
                border-radius: 24px;
                max-width: 500px;
                margin: 0 auto;
            }
            .ad-box {
                min-height: 100px;
            }
            .video-controls button {
                width: 55px;
                height: 55px;
                font-size: 1.5rem;
            }
        }
        
        /* Large tablets landscape */
        @media (min-width: 1024px) {
            .container {
                max-width: 500px;
            }
        }
        
        /* Small phones */
        @media (max-width: 480px) {
            body {
                padding: 8px;
                padding-bottom: 90px;
            }
            .video-reels {
                border-radius: 18px;
                border-width: 1.5px;
            }
            .video-controls button {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
            .ad-container {
                margin: 10px auto;
            }
            .sticky-ad {
                padding: 6px 8px;
            }
            .close-sticky {
                top: -28px;
                right: 8px;
                width: 26px;
                height: 26px;
                font-size: 16px;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .ad-container {
            animation: fadeIn 0.4s ease-out;
        }
        
        /* Prevent content shift */
        img, video, ins, iframe {
            max-width: 100%;
        }

<!-- STICKY BOTTOM AD - Mobile Optimized -->
<div class="sticky-ad" id="stickyAd">
    <button class="close-sticky" id="closeStickyBtn" aria-label="Κλείσιμο διαφήμισης">×</button>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-format="autorelaxed"
         data-ad-client="ca-pub-3186700611266549"
         data-ad-slot="9660744817"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<script>
    // ========== VIDEO PLAYER (Touch Optimized) ==========
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    
    function updatePlayIcon() {
        if (video.paused) {
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        } else {
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }
    }
    
    function togglePlayPause() {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
        updatePlayIcon();
    }
    
    function toggleMute() {
        video.muted = !video.muted;
        if (video.muted) {
            muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        } else {
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
        }
    }
    
    playPauseBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        togglePlayPause();
    });
    
    muteBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleMute();
    });
    
    video.addEventListener('play', updatePlayIcon);
    video.addEventListener('pause', updatePlayIcon);
    
    // Touch-friendly: tap video to play/pause
    const videoContainer = document.querySelector('.video-reels');
    videoContainer.addEventListener('click', function(e) {
        if (e.target.closest('button')) return;
        togglePlayPause();
    });
    
    // Try to enable sound on first user interaction (better mobile UX)
    let soundEnabled = false;
    function enableSound() {
        if (!soundEnabled) {
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            soundEnabled = true;
            document.removeEventListener('click', enableSound);
            document.removeEventListener('touchstart', enableSound);
        }
    }
    document.addEventListener('click', enableSound);
    document.addEventListener('touchstart', enableSound);
    
    // ========== STICKY AD (Mobile Friendly) ==========
    const stickyAd = document.getElementById('stickyAd');
    const closeStickyBtn = document.getElementById('closeStickyBtn');
    
    closeStickyBtn.addEventListener('click', function(e) {
        e.preventDefault();
        stickyAd.classList.add('collapsed');
    });
    
    // Show sticky ad after 4 seconds
    setTimeout(() => {
        stickyAd.classList.remove('collapsed');
    }, 4000);
    
    // ========== AD REFRESH ON SCROLL (Mobile Optimized) ==========
    let refreshTimeout;
    let refreshCount = 0;
    const MAX_REFRESH = 2;
    
    window.addEventListener('scroll', function() {
        if (refreshCount >= MAX_REFRESH) return;
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => {
            if (typeof adsbygoogle !== 'undefined') {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    refreshCount++;
                } catch(e) {}
            }
        }, 4000);
    });
    
    // Refresh on video end
    video.addEventListener('ended', function() {
        setTimeout(() => {
            if (typeof adsbygoogle !== 'undefined' && refreshCount < MAX_REFRESH) {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    refreshCount++;
                } catch(e) {}
            }
        }, 2000);
    });
    
    // ========== EXTRA AD LOADING (Background) ==========
    setTimeout(() => {
        const extraAdDiv = document.createElement('div');
        extraAdDiv.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden';
        extraAdDiv.innerHTML = `
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"></ins>
        `;
        document.body.appendChild(extraAdDiv);
        if (typeof adsbygoogle !== 'undefined') {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
        }
        setTimeout(() => extraAdDiv.remove(), 8000);
    }, 6000);
    
    // ========== INITIALIZE ALL ADS ==========
    window.addEventListener('load', function() {
        if (typeof adsbygoogle !== 'undefined') {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch(e) {}
        }
        
        // Force viewport check for mobile
        if (window.innerWidth <= 768) {
            document.querySelectorAll('.ad-box ins').forEach(ad => {
                ad.setAttribute('data-full-width-responsive', 'true');
            });
        }
    });
    
    // Handle orientation change (tablet/phone rotation)
    window.addEventListener('orientationchange', function() {
        setTimeout(() => {
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        }, 300);
    });
    
    // Prevent accidental zoom on double tap (better UX for mobile)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, false);
</script>
