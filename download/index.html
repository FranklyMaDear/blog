    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #12122e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            padding-bottom: 90px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        
        /* Title */
        .page-title {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .page-title h1 {
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4, #FFD966);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Pre-roll Ad Card */
        .ad-card {
            background: rgba(18, 22, 45, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 200, 100, 0.25);
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }
        
        .ad-card.closed {
            display: none;
        }
        
        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 200, 100, 0.2);
        }
        
        .ad-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #FFB347;
        }
        
        .skip-btn {
            background: rgba(255, 68, 68, 0.85);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        
        .skip-btn:active {
            transform: scale(0.95);
        }
        
        .ad-body {
            padding: 16px;
            min-height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1e3a, #12152f);
        }
        
        .ad-body ins {
            display: block;
            width: 100%;
        }
        
        /* Video Container */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 200, 100, 0.3);
            margin: 0 auto 20px;
            cursor: pointer;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        
        /* Play Overlay */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(3px);
        }
        
        .play-overlay.hidden {
            display: none;
        }
        
        .play-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 215, 0, 0.9);
            transition: all 0.2s;
        }
        
        .play-btn:active {
            transform: scale(0.92);
        }
        
        .play-btn i {
            font-size: 2.8rem;
            color: white;
            margin-left: 6px;
        }
        
        .play-text {
            margin-top: 18px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
        }
        
        /* Video Controls */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            padding: 18px 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 15;
        }
        
        .video-container:hover .video-controls,
        .video-container:active .video-controls {
            opacity: 1;
        }
        
        .video-controls button {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            font-size: 1.2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .video-controls button:active {
            transform: scale(0.92);
            background: rgba(255,215,0,0.4);
        }
        
        /* Amazon Store Card */
        .amazon-store {
            background: linear-gradient(135deg, #232f3e, #1a2532);
            border-radius: 24px;
            margin: 16px 0;
            border: 1px solid rgba(255, 153, 0, 0.5);
            overflow: hidden;
            transition: all 0.2s;
        }
        
        .amazon-store:active {
            transform: scale(0.98);
        }
        
        .amazon-header {
            background: #ff9900;
            padding: 14px 16px;
            display: flex;

            justify-content: center;

        }
        
        .amazon-header i {

        }
        
        .amazon-header span {

        }
        
        .amazon-body {

            text-align: center;
        }
        
        .amazon-body p {
            color: #ddd;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        
        .amazon-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ff9900;
            color: #232f3e;
            text-decoration: none;
            padding: 14px 28px;

            font-weight: 700;

            cursor: pointer;
        }
        
        .amazon-btn:active {
            transform: scale(0.96);
            background: #ffaa33;
        }
        
        /* Content Cards for Ads */
        .content-card {
            background: rgba(18, 22, 45, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            margin: 16px 0;
            border: 1px solid rgba(255, 200, 100, 0.2);
            overflow: hidden;

        .card-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            padding: 8px 0 4px;
            letter-spacing: 0.5px;
        }
        
        .card-content {
            padding: 12px 16px 16px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card-content ins {
            display: block;
            width: 100%;
        }
        
        /* Sticky Bottom Ad */
        .sticky-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #0a0a1a, transparent);
            padding: 12px 16px;
            z-index: 1000;
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            pointer-events: none;
        }
        
        .sticky-ad.collapsed {
            transform: translateY(100%);
        }
        
        .sticky-inner {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(18, 22, 45, 0.98);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 200, 100, 0.35);
            overflow: hidden;
            pointer-events: auto;
        }
        
        .sticky-header {
            display: flex;
            justify-content: flex-end;
            padding: 8px 12px 0;
        }
        
        .close-sticky {
            background: rgba(255, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .sticky-content {
            padding: 8px 12px 14px;
        }
        
        .sticky-content ins {
            display: block;
            width: 100%;
        }
        
        .footer-note {
            text-align: center;
            padding: 24px 0 20px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            body { padding: 12px; padding-bottom: 100px; }
            .play-btn { width: 70px; height: 70px; }
            .play-btn i { font-size: 2.2rem; }
            .play-text { font-size: 0.8rem; padding: 6px 16px; }
            .video-controls button { width: 42px; height: 42px; font-size: 1rem; }
            .amazon-header span { font-size: 1rem; }
            .amazon-btn { padding: 12px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<!-- STICKY BOTTOM AD -->
<div class="sticky-ad" id="stickyAd">
    <div class="sticky-inner">
        <div class="sticky-header">
            <button class="close-sticky" id="closeStickyBtn">
                <i class="fas fa-times"></i> Κλείσιμο
            </button>
        </div>
        <div class="sticky-content">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3186700611266549"
                 data-ad-slot="9660744817"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';
        
        // ========== PRE-ROLL AD CLOSE ==========
        const closePreRoll = document.getElementById('closePreRollBtn');
        const preRollAd = document.getElementById('preRollAd');
        
        closePreRoll.addEventListener('click', () => {
            preRollAd.classList.add('closed');
        });
        
        // ========== VIDEO PLAYER - STARTS ONLY ON USER CLICK ==========
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const videoContainer = document.getElementById('videoContainer');
        
        let videoStarted = false;
        
        function updatePlayIcon() {
            if (video.paused) {
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        }
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            playOverlay.classList.add('hidden');
            video.muted = false;
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            video.play().catch(e => console.log('Play blocked:', e));
            updatePlayIcon();
        }
        
        function togglePlayPause() {
            if (!videoStarted) {
                startVideo();
                return;
            }
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
            updatePlayIcon();
        }
        
        function toggleMute() {
            if (!videoStarted) return;
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        }
        
        playOverlay.addEventListener('click', startVideo);
        
        videoContainer.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            if (!videoStarted) {
                startVideo();
            } else {
                togglePlayPause();
            }
        });
        
        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlayPause();
        });
        
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });
        
        video.addEventListener('play', updatePlayIcon);
        video.addEventListener('pause', updatePlayIcon);
        
        // ========== STICKY AD WITH SCROLL DETECTION ==========
        const stickyAd = document.getElementById('stickyAd');
        const closeSticky = document.getElementById('closeStickyBtn');
        let stickyShown = false;
        
        closeSticky.addEventListener('click', () => {
            stickyAd.classList.add('collapsed');
            sessionStorage.setItem('stickyClosed', 'true');
        });
        
        if (sessionStorage.getItem('stickyClosed') === 'true') {
            stickyAd.classList.add('collapsed');
        } else {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && !stickyShown) {
                        stickyShown = true;
                        stickyAd.classList.remove('collapsed');
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.5 });
            
            observer.observe(videoContainer);
            
            setTimeout(() => {
                if (!stickyShown && sessionStorage.getItem('stickyClosed') !== 'true') {
                    stickyShown = true;
                    stickyAd.classList.remove('collapsed');
                }
            }, 8000);
        }
        
        // ========== LAZY LOAD DEEP ADS ==========
        const contentCards = document.querySelectorAll('.content-card');
        const adObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const adIns = card.querySelector('ins.adsbygoogle');
                    if (adIns && !adIns.getAttribute('data-loaded')) {
                        adIns.setAttribute('data-loaded', 'true');
                        if (typeof adsbygoogle !== 'undefined') {
                            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                        }
                    }
                }
            });
        }, { threshold: 0.1, rootMargin: '100px' });
        
        contentCards.forEach(card => adObserver.observe(card));
        
        // ========== BACKGROUND AD FOR EXTRA REVENUE ==========
        setTimeout(() => {
            const bgAd = document.createElement('div');
            bgAd.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
            bgAd.innerHTML = `
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="autorelaxed"
                     data-ad-client="ca-pub-3186700611266549"
                     data-ad-slot="9660744817"
                     data-full-width-responsive="true"></ins>
            `;
            document.body.appendChild(bgAd);
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
            setTimeout(() => bgAd.remove(), 12000);
        }, 5000);
        
        // ========== FINAL AD PUSH ==========
        window.addEventListener('load', () => {
            if (typeof adsbygoogle !== 'undefined') {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            }
        });
        
        // Handle orientation change
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (typeof adsbygoogle !== 'undefined') {
                    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                }
            }, 300);
        });
        
        console.log('Page loaded - Amazon store integrated');
    })();
</script>
