        * {

        body {

        .content-wrapper {

        .title-section {

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        /* ΜΕΓΑΛΥΤΕΡΟ ΒΙΝΤΕΟ (Αυξήθηκε σε 55vh) */
        .video-wrapper {
            position: relative;
            margin: 10px 0 15px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            max-height: 55vh;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 55vh;
            background: #000;
            cursor: pointer;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        
        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        
        .play-overlay.hidden {
            display: none;
        }
        
        .play-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));

            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 215, 0, 0.9);
        }
        
        .play-btn i {
            font-size: 2rem;
            color: white;
            margin-left: 5px;
        }
        
        .play-text {
            margin-top: 12px;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 40px;
        }

        /* ΤΑ ΠΑΙΧΝΙΔΙΑ ΜΠΗΚΑΝ ΑΚΡΙΒΩΣ ΚΑΤΩ ΑΠΟ ΤΟ ΒΙΝΤΕΟ */

            padding: 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);

        }
        
        .games-section h2 {
            font-size: 1.05rem;
            color: #FFF;
            margin-bottom: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .game-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            padding: 12px;
            border-radius: 18px;
            margin-bottom: 10px;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.03);
        }
        
        .game-card:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: translateY(-1px);
        }
        
        .game-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .game-info {
            text-align: left;
            flex-grow: 1;
        }
        
        .game-title {
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .game-desc {

        .play-now-btn {

<script>
    (function() {
        'use strict';
        
        const video = document.getElementById('mainVideo');
        const playOverlay = document.getElementById('playOverlay');
        const videoContainer = document.getElementById('videoContainer');
        
        function handleVideoPlay() {
            playOverlay.classList.add('hidden');
            video.muted = false;
            video.play().catch(err => {
                video.muted = true;
                video.play();
            });
        }
        
        playOverlay.addEventListener('click', handleVideoPlay);
        videoContainer.addEventListener('click', handleVideoPlay);
        video.addEventListener('ended', () => { playOverlay.classList.remove('hidden'); });
    })();
</script>
