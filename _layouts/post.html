---
layout: default
---
<article class="post-article" style="max-width: 800px; margin: 50px auto; padding: 30px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    
    <header style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-size: 2.5rem; color: #333; margin-bottom: 10px;">{{ page.title }}</h1>
        <p style="color: #888; font-size: 1rem;">📅 {{ page.date | date: "%d %B %Y" }}</p>
    </header>

    {% if page.cover_image %}
    <div style="text-align: center; margin-bottom: 30px;">
        <img src="{{ page.cover_image | relative_url }}" alt="{{ page.title }}" style="max-width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
    </div>
    {% endif %}

    {% if page.video_url %}
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
        <iframe src="{{ page.video_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen></iframe>
    </div>
    {% endif %}

    <div class="post-content" style="line-height: 1.8; font-size: 1.1rem; color: #444;">
        {{ content }}
    </div>

</article>
