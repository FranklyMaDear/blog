<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* ===== GAME CONTAINER ===== */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ===== GAME AREA ===== */
        .game-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: auto !important;
        }
        
        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.5rem;
            color: #4cc9f0;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            color: #b8b8b8;
            font-size: 1rem;
            text-align: center;
            max-width: 300px;
        }
        
        /* ===== BOTTOM AD BAR (POPUP) ===== */
        .bottom-ad-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 10px;
            border-top: 3px solid #4cc9f0;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            transition: transform 0.5s ease;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
        }
        
        .ad-label {
            position: absolute;
            top: -25px;
            left: 20px;
            background: #4cc9f0;
            color: white;
            padding: 5px 15px;
            border-radius: 15px 15px 0 0;
            font-size: 0.8rem;
            font-weight: 700;
        }
        
        .close-ad-btn {
            position: absolute;
            top: -25px;
            right: 20px;
            background: #ff4161;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .close-ad-btn:hover {
            background: #ff2a4d;
        }
        
        .ad-content {
            width: 100%;
            max-width: 728px;
            margin: 0 auto;
            text-align: center;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* ===== AD BAR STATES ===== */
        .bottom-ad-bar.hidden {
            transform: translateY(100%);
            display: none;
        }
        
        .bottom-ad-bar.visible {
            transform: translateY(0);
            display: flex;
        }
        
        /* ===== MONETAG AD CONTAINER ===== */
        .monetag-container {
            width: 100%;
            height: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }
        
        .ad-placeholder {
            color: #666;
            font-size: 0.9rem;
            padding: 20px;
            text-align: center;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .bottom-ad-bar {
                min-height: 80px;
                padding: 8px;
            }
            
            .ad-label {
                top: -20px;
                left: 10px;
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            
            .close-ad-btn {
                top: -20px;
                right: 10px;
                width: 22px;
                height: 22px;
                font-size: 0.7rem;
            }
            
            .monetag-container {
                min-height: 70px;
            }
        }
        
        @media (max-width: 480px) {
            .bottom-ad-bar {
                min-height: 60px;
                padding: 5px;
            }
            
            .ad-label {
                top: -18px;
                left: 5px;
                padding: 3px 8px;
                font-size: 0.65rem;
            }
            
            .close-ad-btn {
                top: -18px;
                right: 5px;
                width: 20px;
                height: 20px;
                font-size: 0.65rem;
            }
            
            .monetag-container {
                min-height: 50px;
            }
        }
        
        /* ===== UTILITY CLASSES ===== */
        .hidden {
            display: none !important;
        }
        
        .fade-out {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <!-- GAME AREA -->
        <div class="game-area">
            <!-- LOADING SCREEN -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div class="loading-text">Φόρτωση Royal Garden Match 2...</div>
                <div class="loading-subtext">Το παιχνίδι φορτώνεται, παρακαλώ περιμένετε</div>
            </div>
            
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- BOTTOM AD BAR (POPUP) -->
    <div class="bottom-ad-bar hidden" id="bottomAdBar">
        <div class="ad-label">Υποστήριξη</div>
        <button class="close-ad-btn" id="closeAdBtn" title="Κλείσιμο διαφήμισης">×</button>
        <div class="ad-content" id="bottomAdContent">
            <!-- Monetag ads will load here -->
            <div class="monetag-container" id="monetagContainer">
                <div class="ad-placeholder">Διαφήμιση φορτώνεται...</div>
            </div>
        </div>
    </div>

    <script>
        // ===== DOM ELEMENTS =====
        const loadingScreen = document.getElementById('loadingScreen');
        const gameFrame = document.getElementById('gameFrame');
        const bottomAdBar = document.getElementById('bottomAdBar');
        const monetagContainer = document.getElementById('monetagContainer');
        const closeAdBtn = document.getElementById('closeAdBtn');
        
        // ===== GAME STATE =====
        let gameLoaded = false;
        let isAdShowing = false;
        let adInterval = null;
        let currentAdTimeout = null;
        let adDisplayDuration = 10000; // 10 seconds
        let adCooldown = 60000; // 60 seconds between ads
        let monetagScriptLoaded = false;
        
        // ===== LOAD MONETAG AD =====
        function loadMonetagAd() {
            if (isAdShowing) return;
            
            console.log('🔄 Φόρτωση Monetag διαφήμισης...');
            
            // Clear previous ad content
            monetagContainer.innerHTML = '<div class="ad-placeholder">Διαφήμιση φορτώνεται...</div>';
            
            // Show the ad bar
            bottomAdBar.classList.remove('hidden');
            bottomAdBar.classList.add('visible');
            isAdShowing = true;
            
            // Create and load Monetag script
            const monetagScript = document.createElement('script');
            monetagScript.type = 'text/javascript';
            monetagScript.async = true;
            monetagScript.src = 'https://otieu.com/4/10266494';
            
            // Add script to container
            monetagContainer.appendChild(monetagScript);
            
            monetagScript.onload = function() {
                console.log('✅ Monetag script loaded successfully');
                monetagScriptLoaded = true;
            };
            
            monetagScript.onerror = function() {
                console.log('❌ Failed to load Monetag script');
                monetagContainer.innerHTML = '<div class="ad-placeholder">Διαφήμιση - Ευχαριστούμε για την υποστήριξη!</div>';
            };
            
            // Set timeout to auto-close the ad
            if (currentAdTimeout) {
                clearTimeout(currentAdTimeout);
            }
            
            currentAdTimeout = setTimeout(() => {
                hideAdBar();
            }, adDisplayDuration);
        }
        
        // ===== HIDE AD BAR =====
        function hideAdBar() {
            if (!isAdShowing) return;
            
            console.log('👋 Κλείσιμο διαφήμισης');
            
            // Hide the ad bar
            bottomAdBar.classList.remove('visible');
            bottomAdBar.classList.add('hidden');
            isAdShowing = false;
            
            // Clear ad container
            setTimeout(() => {
                monetagContainer.innerHTML = '<div class="ad-placeholder">Διαφήμιση φορτώνεται...</div>';
            }, 500);
            
            // Clear current timeout
            if (currentAdTimeout) {
                clearTimeout(currentAdTimeout);
                currentAdTimeout = null;
            }
            
            // Schedule next ad
            scheduleNextAd();
        }
        
        // ===== SCHEDULE NEXT AD =====
        function scheduleNextAd() {
            // Clear any existing interval
            if (adInterval) {
                clearTimeout(adInterval);
            }
            
            // Schedule next ad (every 60-90 seconds)
            const nextAdDelay = adCooldown + Math.floor(Math.random() * 30000);
            
            console.log(`⏰ Επόμενη διαφήμιση σε ${Math.round(nextAdDelay/1000)} δευτερόλεπτα`);
            
            adInterval = setTimeout(() => {
                if (gameLoaded && !isAdShowing) {
                    loadMonetagAd();
                }
            }, nextAdDelay);
        }
        
        // ===== SHOW AD AT LEVEL COMPLETION =====
        function showAdOnLevelComplete() {
            // This function should be called when a level is completed
            console.log('🏆 Επίπεδο ολοκληρώθηκε - Εμφάνιση διαφήμισης');
            
            // Don't show ad if one is already showing
            if (isAdShowing) {
                console.log('ℹ️ Διαφήμιση ήδη εμφανίζεται, παραλείπεται');
                return;
            }
            
            // Wait a moment before showing ad
            setTimeout(() => {
                loadMonetagAd();
            }, 1000);
        }
        
        // ===== SIMULATE GAME EVENTS (FOR TESTING) =====
        function simulateGameEvents() {
            // Simulate level completion every 45-75 seconds for testing
            setInterval(() => {
                if (gameLoaded && !isAdShowing) {
                    const shouldShowAd = Math.random() > 0.3; // 70% chance
                    if (shouldShowAd) {
                        showAdOnLevelComplete();
                    }
                }
            }, 45000 + Math.floor(Math.random() * 30000));
        }
        
        // ===== INITIALIZE GAME =====
        function initGame() {
            console.log('🎮 Royal Garden Match 2 - Αρχικοποίηση...');
            
            gameLoaded = true;
            
            // Show first ad after short delay
            setTimeout(() => {
                if (!isAdShowing) {
                    loadMonetagAd();
                }
            }, 3000);
            
            // Start simulating game events (remove this in production)
            simulateGameEvents();
            
            // Initialize ad scheduling
            scheduleNextAd();
        }
        
        // ===== EVENT LISTENERS =====
        
        // Game loaded
        gameFrame.addEventListener('load', function() {
            console.log('✅ Το παιχνίδι φορτώθηκε επιτυχώς');
            
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    initGame();
                }, 500);
            }, 2000);
        });
        
        // Game error
        gameFrame.addEventListener('error', function() {
            console.log('❌ Αποτυχία φόρτωσης παιχνιδιού');
            loadingScreen.innerHTML = `
                <div style="text-align: center; padding: 20px; max-width: 400px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff4161; margin-bottom: 20px;"></i>
                    <div style="color: #ff4161; font-size: 1.3rem; font-weight: 700; margin-bottom: 20px;">
                        Σφάλμα φόρτωσης
                    </div>
                    <div style="margin-bottom: 25px; color: #b8b8b8;">
                        Το παιχνίδι δεν μπορεί να φορτωθεί. Παρακαλώ ανανεώστε τη σελίδα.
                    </div>
                    <button onclick="location.reload()" 
                            style="background: #ff4161; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer;">
                        <i class="fas fa-sync-alt"></i> Ανανέωση Σελίδας
                    </button>
                </div>
            `;
        });
        
        // Close ad button
        closeAdBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            hideAdBar();
        });
        
        // Prevent clicking inside ad from closing it
        monetagContainer.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Prevent clicks on ad content from propagating
        bottomAdContent.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Initial console message
        console.log('🎮 ================================');
        console.log('🎮 ROYAL GARDEN MATCH 2');
        console.log('🎮 Monetag διαφημίσεις ΜΟΝΟ στο banner');
        console.log('🎮 Χωρίς popups, χωρίς διακοπές στο gameplay');
        console.log('🎮 ================================');
        
        // Auto-hide loading screen after timeout
        setTimeout(() => {
            if (!loadingScreen.classList.contains('hidden')) {
                loadingScreen.classList.add('hidden');
                initGame();
            }
        }, 8000);
    </script>
</body>
</html>
