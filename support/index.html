    <title>Foxy Eco Sort - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.3s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Leaves Container */
        #floatingLeaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Game Leaves Objects */
        .leaf-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            z-index: 51;
            opacity: 0.95;
            will-change: transform, opacity;
            filter: drop-shadow(2px 2px 6px rgba(0,0,0,0.4));
            transition: transform 0.2s ease;
            width: 70px;
            height: 70px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        .leaf-object:active {
            transform: scale(1.2) !important;
            opacity: 1;
        }

        /* Ad text overlay */
        .ad-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
        }
        
        .ad-text {
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            padding: 8px;
            line-height: 1.2;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }
        
        /* Animations */
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.95;
            }
            90% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.95;
            }
            90% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatSide {
            0% {
                transform: translateX(-100px) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.95;
            }
            90% {
                opacity: 0.95;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes leafGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 5px rgba(76, 175, 80, 0.5));
            }
            50% { 
                filter: drop-shadow(0 0 15px rgba(76, 175, 80, 0.8));
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .leaf-object { width: 60px; height: 60px; }
            .ad-text { font-size: 10px; }
            .loader-text { font-size: 20px; }
        }
        
        @media (max-width: 480px) {
            .leaf-object { width: 55px; height: 55px; }
            .ad-text { font-size: 9px; }
            .loader-text { font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/e0c6fbe378ad4ed5a1325176324a79dd/?gd_sdk_referrer_url=https://gamedistribution.com/games/foxy-eco-sort/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">Loading Foxy Eco Sort...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Leaves Container -->
    <div id="floatingLeaves"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingLeaves = document.getElementById('floatingLeaves');
        
        // Game State
        let gameLoaded = false;
        let leavesStarted = false;
        let activeLeaves = 0;
        const MAX_LEAVES = 4;
        let leavesInterval;
        
        // Configuration - 30 δευτερόλεπτα αναμονή
        const LEAVES_START_DELAY = 30000; // 30 δευτερόλεπτα
        const MONETAG_LINK = 'https://otieu.com/4/10021790';
        
        // Initialize - Optimized for fast loading
        function init() {
            console.log('🍃 Initializing Foxy Eco Sort...');
            
            // Set game to full screen
            setupFullScreenGame();
            
            // Hide loader quickly - don't wait for game to fully load
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    gameLoaded = true;
                    
                    // Start leaves after 30 seconds
                    console.log(`⏰ Game leaves will appear in ${LEAVES_START_DELAY/1000} seconds`);
                    setTimeout(startFloatingLeaves, LEAVES_START_DELAY);
                }, 300);
            }, 1500);
            
            // Game frame error handling
            gameFrame.addEventListener('error', () => {
                console.log('⚠️ Game frame error');
            });
            
            // Prevent context menu
            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.leaf-object')) {
                    e.preventDefault();
                }
            });
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
            };
            
            updateSize();
            
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateSize, 100);
            });
            
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 150);
            });
        }
        
        // Create game leaf with ad text
        function createGameLeaf() {
            if (activeLeaves >= MAX_LEAVES || !leavesStarted) return;
            
            const leafTypes = [
                { 
                    class: 'leaf-1',
                    animation: 'floatDown',
                    duration: 15 + Math.random() * 10,
                    adText: 'Click for\nAD'
                },
                { 
                    class: 'leaf-2',
                    animation: 'floatUp', 
                    duration: 18 + Math.random() * 8,
                    adText: 'Watch\nAD'
                },
                { 
                    class: 'leaf-3',
                    animation: 'floatDown',
                    duration: 16 + Math.random() * 9,
                    adText: 'AD Here'
                },
                { 
                    class: 'leaf-4',
                    animation: 'floatSide',
                    duration: 20 + Math.random() * 5,
                    adText: 'Support\nUs'
                }
            ];
            
            const leafType = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            
            const leafObject = document.createElement('div');
            leafObject.className = `leaf-object ${leafType.class}`;
            leafObject.style.cursor = 'pointer';
            
            // Add glow animation
            leafObject.style.animation = `leafGlow 3s infinite alternate, ${leafType.animation} ${leafType.duration}s linear forwards`;
            
            // Add AD text overlay
            const adOverlay = document.createElement('div');
            adOverlay.className = 'ad-overlay';
            
            const adText = document.createElement('div');
            adText.className = 'ad-text';
            adText.textContent = leafType.adText;
            adOverlay.appendChild(adText);
            
            leafObject.appendChild(adOverlay);
            
            // Set position and animation
            if (leafType.animation === 'floatDown' || leafType.animation === 'floatUp') {
                const startX = Math.random() * window.innerWidth;
                const endX = startX + (Math.random() * 80 - 40);
                leafObject.style.setProperty('--start-x', `${startX}px`);
                leafObject.style.setProperty('--end-x', `${endX}px`);
            } else {
                const startY = Math.random() * window.innerHeight;
                const endY = startY + (Math.random() * 80 - 40);
                leafObject.style.setProperty('--start-y', `${startY}px`);
                leafObject.style.setProperty('--end-y', `${endY}px`);
            }
            
            leafObject.style.left = '0px';
            leafObject.style.top = '0px';
            
            // Click event for Monetag ad
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                leafObject.style.transform = 'scale(1.3) rotate(10deg)';
                leafObject.style.opacity = '0.7';
                leafObject.style.transition = 'all 0.2s ease';
                
                // Open Monetag ad in new tab
                window.open(MONETAG_LINK, '_blank');
                
                // Remove leaf after animation
                setTimeout(() => {
                    if (leafObject.parentNode) {
                        leafObject.style.opacity = '0';
                        leafObject.style.transform = 'scale(0.5)';
                        setTimeout(() => {
                            if (leafObject.parentNode) {
                                leafObject.remove();
                                activeLeaves--;
                            }
                        }, 200);
                    }
                }, 300);
            };
            
            leafObject.addEventListener('click', handleClick);
            leafObject.addEventListener('touchstart', handleClick, { passive: false });
            
            // Touch feedback
            leafObject.addEventListener('touchstart', function() {
                this.style.transform = 'scale(1.15)';
            }, { passive: true });
            
            leafObject.addEventListener('touchend', function() {
                this.style.transform = '';
            }, { passive: true });
            
            // Remove when animation completes
            setTimeout(() => {
                if (leafObject.parentNode) {
                    leafObject.remove();
                    activeLeaves--;
                }
            }, leafType.duration * 1000);
            
            floatingLeaves.appendChild(leafObject);
            activeLeaves++;
        }
        
        // Start floating leaves after 30 seconds
        function startFloatingLeaves() {
            if (leavesStarted) return;
            
            leavesStarted = true;
            console.log('🍃 Starting game leaves with ads...');
            
            // Initial leaves
            setTimeout(() => createGameLeaf(), 0);
            setTimeout(() => createGameLeaf(), 800);
            setTimeout(() => createGameLeaf(), 1600);
            
            // Continuous spawn every 8-12 seconds
            leavesInterval = setInterval(() => {
                if (leavesStarted && activeLeaves < MAX_LEAVES) {
                    createGameLeaf();
                }
            }, 8000 + Math.random() * 4000);
        }
        
        // Start everything immediately
        document.addEventListener('DOMContentLoaded', init);
        
        // Fallback for fast loading
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
