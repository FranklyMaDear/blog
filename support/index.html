<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Sharp Turn - Δωρεάν Παιχνίδι</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-frame {
            border: none;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Floating Objects - Smaller */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            z-index: 81;
            animation: floatDiagonal 35s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .floating-object:hover {
            transform: scale(1.2);
            filter: brightness(1.3) drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }
        
        @keyframes floatDiagonal {
            0% {
                transform: translateY(100vh) translateX(-80px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(80px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Fruit Objects - Smaller */
        .fruit-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        
        .fruit-shape {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            position: relative;
        }
        
        .fruit-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
        }
        
        .fruit-label {
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }
        
        /* Apple */
        .fruit-apple .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3333, #cc0000);
        }
        
        /* Orange */
        .fruit-orange .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff9800, #ff5722);
        }
        
        /* Strawberry */
        .fruit-strawberry .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3366, #cc0066);
        }
        
        /* Balloon Objects - Smaller with "ads" text */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        
        .balloon-shape {
            width: 50px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, var(--balloon-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Balloon with "ads" text */
        .balloon-ads .balloon-shape:after {
            content: 'ads';
            position: absolute;
            font-size: 10px;
            font-weight: bold;
        }
        
        .balloon-shape:before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 25px;
            background: #666;
        }
        
        .balloon-label {
            background: rgba(0, 0, 0, 0.85);
            color: var(--balloon-text-color);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Flower Objects - Smaller */
        .flower-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        
        .flower-shape {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 50% 50%, var(--flower-color));
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .flower-center {
            width: 15px;
            height: 15px;
            background: #ffcc00;
            border-radius: 50%;
            position: absolute;
        }
        
        .flower-label {
            background: rgba(0, 0, 0, 0.85);
            color: var(--flower-text-color);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Object Glow Effect */
        .object-glow {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: inherit;
            border-radius: inherit;
            filter: blur(8px);
            opacity: 0.3;
            z-index: -1;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME - Rescue Sharp Turn -->
            <iframe 
                src="https://html5.gamedistribution.com/67b7fb2c6f594ef3a4fcb241e902ce1d/?gd_sdk_referrer_url=https://gamedistribution.com/games/rescue-sharp-turn/" 
                class="game-frame" 
                id="gameFrame"
                width="750"
                height="1334"
                scrolling="none"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <!-- YOUR SCRIPT WILL BE LOADED HERE -->
    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameLoaded = true;
        let floatingInterval;
        let activeObjects = 0;
        const MAX_OBJECTS = 3;
        
        // Load Monetag script
        function loadMonetagScript() {
            console.log('📢 Φόρτωση Monetag script (Zone: 10021853)...');
            
            // Create and load Monetag script
            const monetagScript = document.createElement('script');
            monetagScript.src = 'https://3nbf4.com/act/files/tag.min.js?z=10021853';
            monetagScript.setAttribute('data-cfasync', 'false');
            monetagScript.async = true;
            
            monetagScript.onload = function() {
                console.log('✅ Monetag script φορτώθηκε επιτυχώς');
            };
            
            monetagScript.onerror = function() {
                console.log('❌ Σφάλμα φόρτωσης Monetag script');
            };
            
            document.body.appendChild(monetagScript);
        }
        
        // Show Monetag ad when clicking on floating objects
        function showMonetagAd() {
            console.log('🎯 Προβολή Monetag διαφήμισης');
            
            // Check if monetag is available
            if (typeof monetag !== 'undefined') {
                try {
                    // Try to display ad
                    monetag.displayAd();
                } catch (error) {
                    console.log('⚠️ Σφάλμα προβολής διαφήμισης:', error);
                }
            } else {
                console.log('ℹ️ Monetag δεν είναι διαθέσιμο, προσπάθεια ανανέωσης');
                // Try to reload the script
                loadMonetagScript();
                
                // Fallback: Open new tab with ad
                setTimeout(() => {
                    window.open('https://example.com', '_blank');
                }, 500);
            }
        }
        
        // Create floating objects - Smaller with "ads" text
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS) return;
            
            const objectTypes = [
                { 
                    type: 'fruit', 
                    subtype: 'apple', 
                    label: '🎯 Κλικ', 
                    color: '#ff3333, #cc0000',
                    textColor: '#ffcc00'
                },
                { 
                    type: 'fruit', 
                    subtype: 'orange', 
                    label: '✨ Διαφήμιση', 
                    color: '#ff9800, #ff5722',
                    textColor: '#ffcc00'
                },
                { 
                    type: 'fruit', 
                    subtype: 'strawberry', 
                    label: '⭐ Παίξε', 
                    color: '#ff3366, #cc0066',
                    textColor: '#ffcc00'
                },
                { 
                    type: 'balloon', 
                    subtype: 'red-ads', 
                    label: 'Κλικ εδώ', 
                    color: '#ff3333, #cc0000',
                    textColor: '#ff9999',
                    hasAdsText: true
                },
                { 
                    type: 'balloon', 
                    subtype: 'blue-ads', 
                    label: 'Διαφήμιση', 
                    color: '#4cc9f0, #1a5fb4',
                    textColor: '#99ccff',
                    hasAdsText: true
                },
                { 
                    type: 'balloon', 
                    subtype: 'green', 
                    label: '🎈 Παίξε', 
                    color: '#4CAF50, #2E7D32',
                    textColor: '#99ff99'
                },
                { 
                    type: 'flower', 
                    subtype: 'pink', 
                    label: '🌸 Κλικ', 
                    color: '#e91e63, #c2185b',
                    textColor: '#ff99cc'
                },
                { 
                    type: 'flower', 
                    subtype: 'purple', 
                    label: '🌺 Διαφήμιση', 
                    color: '#9c27b0, #7b1fa2',
                    textColor: '#cc99ff'
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            
            const object = document.createElement('div');
            const className = objType.hasAdsText ? 
                `floating-object ${objType.type}-object balloon-ads ${objType.type}-${objType.subtype}` :
                `floating-object ${objType.type}-object ${objType.type}-${objType.subtype}`;
            
            object.className = className;
            
            // Set CSS variables for colors
            if (objType.type === 'balloon') {
                object.style.setProperty('--balloon-color', objType.color);
                object.style.setProperty('--balloon-text-color', objType.textColor);
            } else if (objType.type === 'flower') {
                object.style.setProperty('--flower-color', objType.color);
                object.style.setProperty('--flower-text-color', objType.textColor);
            }
            
            // Random position
            const startX = Math.random() * (window.innerWidth - 80);
            const delay = Math.random() * 3;
            const duration = 30 + Math.random() * 15;
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Create object content
            let shapeDiv, labelDiv;
            
            if (objType.type === 'fruit') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'fruit-shape';
                
                const iconDiv = document.createElement('div');
                iconDiv.className = 'fruit-icon';
                iconDiv.textContent = objType.label.split(' ')[0];
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'fruit-label';
                labelDiv.textContent = objType.label;
                
                shapeDiv.appendChild(iconDiv);
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'balloon') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'balloon-shape';
                
                // Add "ads" text to balloons with hasAdsText
                if (objType.hasAdsText) {
                    const adsText = document.createElement('div');
                    adsText.textContent = 'ads';
                    adsText.style.cssText = `
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        font-size: 10px;
                        font-weight: bold;
                        color: white;
                        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
                    `;
                    shapeDiv.appendChild(adsText);
                }
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'balloon-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'flower') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'flower-shape';
                
                const centerDiv = document.createElement('div');
                centerDiv.className = 'flower-center';
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'flower-label';
                labelDiv.textContent = objType.label;
                
                shapeDiv.appendChild(centerDiv);
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
            }
            
            // Add glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Click event - SHOW MONETAG AD
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                this.style.transform = 'scale(1.3)';
                this.style.opacity = '0.6';
                
                // Show Monetag ad
                showMonetagAd();
                
                // Remove object
                setTimeout(() => {
                    if (this.parentNode) {
                        this.remove();
                        activeObjects--;
                    }
                }, 300);
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Schedule floating objects
        function scheduleFloatingObjects() {
            // Create objects every 20-30 seconds
            floatingInterval = setInterval(() => {
                if (gameLoaded && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                    createFloatingObject();
                }
            }, 20000 + Math.random() * 10000);
            
            // Create initial objects
            setTimeout(() => createFloatingObject(), 3000);
            setTimeout(() => createFloatingObject(), 8000);
            setTimeout(() => createFloatingObject(), 13000);
        }
        
        // Initialize
        function init() {
            console.log('🎮 Rescue Sharp Turn');
            
            // Start floating objects
            scheduleFloatingObjects();
            
            // Load Monetag script
            loadMonetagScript();
        }
        
        // Event Listeners
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Start everything
        init();
    </script>
</body>
</html>
