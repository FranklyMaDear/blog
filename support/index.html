<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foxy Eco Sort - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #0a1929;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1929 0%, #1a3b5a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .loader-subtitle {
            color: #FFD700;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .loader-dots {
            display: flex;
            gap: 12px;
        }
        
        .dot {
            width: 14px;
            height: 14px;
            background: #FF5252;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { background: #4CAF50; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); }
            40% { transform: scale(1.2); }
        }
        
        /* Floating Leaves Container */
        #floatingLeaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Leaf Objects */
        .leaf-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            z-index: 51;
            opacity: 0.9;
            will-change: transform, opacity;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        .leaf-object:active {
            transform: scale(1.25) !important;
            opacity: 1;
        }
        
        /* Different Leaf Designs */
        .leaf {
            width: 60px;
            height: 60px;
            position: relative;
            background: var(--leaf-color);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            transform: rotate(var(--rotation));
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .leaf:before {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #8B4513;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Leaf Veins */
        .leaf-veins {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .vein {
            position: absolute;
            background: rgba(139, 69, 19, 0.4);
            border-radius: 1px;
        }
        
        .vein-main {
            width: 3px;
            height: 70%;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .vein-side {
            width: 2px;
            height: 40%;
            top: 30%;
        }
        
        .vein-side:nth-child(2) { left: 30%; transform: rotate(-20deg); }
        .vein-side:nth-child(3) { right: 30%; transform: rotate(20deg); }
        .vein-side:nth-child(4) { left: 20%; transform: rotate(-35deg); top: 35%; }
        .vein-side:nth-child(5) { right: 20%; transform: rotate(35deg); top: 35%; }
        
        /* Eco Leaf - Different Shape */
        .eco-leaf {
            width: 55px;
            height: 55px;
            position: relative;
            background: var(--leaf-color);
            clip-path: polygon(50% 0%, 100% 30%, 85% 100%, 15% 100%, 0% 30%);
            transform: rotate(var(--rotation));
        }
        
        /* Maple Leaf */
        .maple-leaf {
            width: 65px;
            height: 65px;
            position: relative;
            background: var(--leaf-color);
            clip-path: polygon(50% 0%, 70% 20%, 100% 30%, 85% 60%, 90% 100%, 50% 80%, 10% 100%, 15% 60%, 0% 30%, 30% 20%);
            transform: rotate(var(--rotation));
        }
        
        /* Simple Leaf */
        .simple-leaf {
            width: 50px;
            height: 50px;
            position: relative;
            background: var(--leaf-color);
            clip-path: ellipse(50% 40% at 50% 50%);
            transform: rotate(var(--rotation));
        }
        
        /* Leaf Animations */
        @keyframes leafFloat {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(720deg);
                opacity: 0;
            }
        }
        
        @keyframes leafFloatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(720deg);
                opacity: 0;
            }
        }
        
        @keyframes leafFloatSide {
            0% {
                transform: translateX(-100px) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y)) rotate(720deg);
                opacity: 0;
            }
        }
        
        @keyframes leafFloatSideReverse {
            0% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(-100px) translateY(var(--end-y)) rotate(720deg);
                opacity: 0;
            }
        }
        
        @keyframes leafWobble {
            0%, 100% { transform: rotate(var(--rotation)) scale(1); }
            25% { transform: rotate(calc(var(--rotation) + 5deg)) scale(1.05); }
            50% { transform: rotate(var(--rotation)) scale(1.1); }
            75% { transform: rotate(calc(var(--rotation) - 5deg)) scale(1.05); }
        }
        
        /* Leaf Colors */
        .leaf-green { --leaf-color: #4CAF50; }
        .leaf-yellow { --leaf-color: #FFD700; }
        .leaf-orange { --leaf-color: #FF9800; }
        .leaf-red { --leaf-color: #FF5252; }
        .leaf-brown { --leaf-color: #8B4513; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .leaf, .eco-leaf, .maple-leaf, .simple-leaf {
                width: 50px;
                height: 50px;
            }
            
            .maple-leaf {
                width: 55px;
                height: 55px;
            }
            
            .loader-text {
                font-size: 28px;
            }
            
            .loader-subtitle {
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .leaf, .eco-leaf, .simple-leaf {
                width: 45px;
                height: 45px;
            }
            
            .maple-leaf {
                width: 50px;
                height: 50px;
            }
            
            .loader-text {
                font-size: 24px;
                margin-bottom: 20px;
            }
            
            .loader-subtitle {
                font-size: 14px;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/e0c6fbe378ad4ed5a1325176324a79dd/?gd_sdk_referrer_url=https://gamedistribution.com/games/foxy-eco-sort/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">🍃 Foxy Eco Sort 🍃</div>
        <div class="loader-subtitle">Loading Eco Adventure...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Leaves Container -->
    <div id="floatingLeaves"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingLeaves = document.getElementById('floatingLeaves');
        
        // Game State
        let gameLoaded = false;
        let leavesStarted = false;
        let activeLeaves = 0;
        const MAX_LEAVES = 4;
        let leavesInterval;
        
        // Configuration
        const LEAVES_START_DELAY = 60000; // 1 λεπτό = 60 δευτερόλεπτα
        const MONETAG_LINK = 'https://otieu.com/4/10274068';
        
        // Initialize
        function init() {
            console.log('🍃 Initializing Foxy Eco Sort...');
            
            // Set game to full screen
            setupFullScreenGame();
            
            // Game load handler
            const loadGame = () => {
                if (!gameLoaded) {
                    gameLoaded = true;
                    console.log('✅ Game ready');
                    
                    // Hide loader after 2 seconds
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                            
                            // Start leaves after 1 minute
                            console.log(`⏰ Leaves will appear in ${LEAVES_START_DELAY/1000} seconds`);
                            setTimeout(startFloatingLeaves, LEAVES_START_DELAY);
                        }, 500);
                    }, 2000);
                }
            };
            
            // Multiple load detection methods
            gameFrame.addEventListener('load', loadGame);
            setTimeout(loadGame, 3000);
            gameFrame.addEventListener('error', loadGame);
            
            // Prevent context menu
            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.leaf-object')) {
                    e.preventDefault();
                }
            });
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
            };
            
            updateSize();
            window.addEventListener('resize', updateSize);
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 100);
            });
        }
        
        // Create floating leaf
        function createFloatingLeaf() {
            if (activeLeaves >= MAX_LEAVES || !leavesStarted) return;
            
            const leafTypes = [
                { type: 'leaf', color: 'leaf-green' },
                { type: 'leaf', color: 'leaf-yellow' },
                { type: 'leaf', color: 'leaf-orange' },
                { type: 'leaf', color: 'leaf-red' },
                { type: 'leaf', color: 'leaf-brown' },
                { type: 'eco-leaf', color: 'leaf-green' },
                { type: 'maple-leaf', color: 'leaf-red' },
                { type: 'simple-leaf', color: 'leaf-yellow' }
            ];
            
            const animations = ['leafFloat', 'leafFloatUp', 'leafFloatSide', 'leafFloatSideReverse'];
            const leafType = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            const animation = animations[Math.floor(Math.random() * animations.length)];
            const duration = 18 + Math.random() * 12;
            const rotation = Math.random() * 360;
            
            const leafObject = document.createElement('div');
            leafObject.className = `leaf-object ${leafType.color}`;
            leafObject.style.setProperty('--rotation', `${rotation}deg`);
            
            // Create leaf element
            const leaf = document.createElement('div');
            leaf.className = leafType.type;
            leaf.style.animation = `leafWobble 3s infinite ease-in-out`;
            
            // Add veins for regular leaf type
            if (leafType.type === 'leaf') {
                const veins = document.createElement('div');
                veins.className = 'leaf-veins';
                
                const mainVein = document.createElement('div');
                mainVein.className = 'vein vein-main';
                veins.appendChild(mainVein);
                
                for (let i = 0; i < 4; i++) {
                    const sideVein = document.createElement('div');
                    sideVein.className = 'vein vein-side';
                    veins.appendChild(sideVein);
                }
                
                leaf.appendChild(veins);
            }
            
            leafObject.appendChild(leaf);
            
            // Set position and animation
            if (animation === 'leafFloat' || animation === 'leafFloatUp') {
                const startX = Math.random() * window.innerWidth;
                const endX = startX + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-x', `${startX}px`);
                leafObject.style.setProperty('--end-x', `${endX}px`);
            } else {
                const startY = Math.random() * window.innerHeight;
                const endY = startY + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-y', `${startY}px`);
                leafObject.style.setProperty('--end-y', `${endY}px`);
            }
            
            leafObject.style.animation = `${animation} ${duration}s linear forwards`;
            leafObject.style.left = '0px';
            leafObject.style.top = '0px';
            
            // Click event for Monetag ad
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                leafObject.style.transform = 'scale(1.3)';
                leafObject.style.opacity = '0.7';
                leafObject.style.filter = 'drop-shadow(0 0 10px gold) brightness(1.5)';
                
                // Open Monetag ad in new tab
                setTimeout(() => {
                    window.open(MONETAG_LINK, '_blank');
                }, 100);
                
                // Remove leaf
                setTimeout(() => {
                    if (leafObject.parentNode) {
                        leafObject.remove();
                        activeLeaves--;
                    }
                }, 400);
            };
            
            leafObject.addEventListener('click', handleClick);
            leafObject.addEventListener('touchstart', handleClick, { passive: false });
            
            // Touch feedback
            leafObject.addEventListener('touchstart', function() {
                this.style.transform = 'scale(1.15)';
            }, { passive: true });
            
            // Remove when animation completes
            setTimeout(() => {
                if (leafObject.parentNode) {
                    leafObject.remove();
                    activeLeaves--;
                }
            }, duration * 1000);
            
            floatingLeaves.appendChild(leafObject);
            activeLeaves++;
            
            console.log('🍃 New leaf created');
        }
        
        // Start floating leaves after 1 minute
        function startFloatingLeaves() {
            if (leavesStarted) return;
            
            leavesStarted = true;
            console.log('🍃 Starting floating leaves...');
            
            // Initial leaves
            setTimeout(() => createFloatingLeaf(), 0);
            setTimeout(() => createFloatingLeaf(), 1000);
            setTimeout(() => createFloatingLeaf(), 2000);
            
            // Continuous spawn every 8-15 seconds
            leavesInterval = setInterval(() => {
                if (leavesStarted && activeLeaves < MAX_LEAVES) {
                    createFloatingLeaf();
                }
            }, 8000 + Math.random() * 7000);
        }
        
        // Start everything
        document.addEventListener('DOMContentLoaded', init);
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
