<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krismas Mahjong 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #2c3e50;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-100percent {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #2c3e50;
        }
        
        .tiny-top-bar {
            background: #e74c3c;
            padding: 8px 12px;
            text-align: center;
            border-bottom: 3px solid #f1c40f;
            flex-shrink: 0;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .compact-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-bottom: 3px;
        }
        
        .compact-subtitle {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
        }
        
        .game-full-area {
            flex: 1;
            background: #34495e;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        
        .game-frame-100percent {
            width: 100%;
            height: 100%;
            border: none;
            background: #2c3e50;
        }
        
        .loading-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(241, 196, 15, 0.3);
            border-radius: 50%;
            border-top-color: #f1c40f;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .loading-msg {
            color: #f1c40f;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .small-bottom-bar {
            background: #e74c3c;
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 3px solid #f1c40f;
            flex-shrink: 0;
            height: 70px;
        }
        
        .small-btn {
            padding: 8px 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 0 #219653;
            min-width: 100px;
        }
        
        .small-reload {
            background: #e67e22;
            box-shadow: 0 3px 0 #d35400;
        }
        
        .small-sound {
            background: #3498db;
            box-shadow: 0 3px 0 #2980b9;
        }
        
        @media (max-width: 768px) {
            .tiny-top-bar {
                padding: 6px 10px;
                height: 60px;
            }
            
            .compact-title {
                font-size: 1.1rem;
            }
            
            .compact-subtitle {
                font-size: 0.7rem;
            }
            
            .small-bottom-bar {
                padding: 8px 12px;
                height: 60px;
            }
            
            .small-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
                min-width: 80px;
            }
        }
        
        @media (max-width: 480px) {
            .tiny-top-bar {
                height: 55px;
                padding: 5px 8px;
            }
            
            .compact-title {
                font-size: 1rem;
                margin-bottom: 2px;
            }
            
            .compact-subtitle {
                font-size: 0.65rem;
            }
            
            .small-bottom-bar {
                height: 55px;
                padding: 6px 10px;
                gap: 8px;
            }
            
            .small-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
                min-width: 70px;
                gap: 4px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="game-100percent">
        <div class="tiny-top-bar">
            <div class="compact-title">Krismas Mahjong 2</div>
            <div class="compact-subtitle">Χριστουγεννιάτικο παιχνίδι Mahjong - Βρες τα ίδια πλακάκια!</div>
        </div>
        
        <div class="game-full-area">
            <div class="loading-full" id="loadingScreen">
                <div class="spinner"></div>
                <div class="loading-msg">Φόρτωση παιχνιδιού...</div>
            </div>
            
            <iframe 
                src="https://html5.gamedistribution.com/176415ef4cf84473b7942ab1a0ff3730/?gd_sdk_referrer_url=https://gamedistribution.com/games/krismas-mahjong-2" 
                class="game-frame-100percent" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay"
                allowfullscreen>
            </iframe>
        </div>
        
        <div class="small-bottom-bar">
            <button class="small-btn small-reload" id="reloadBtn">
                <i class="fas fa-redo-alt"></i> Ανανέωση
            </button>
            <button class="small-btn small-sound" id="soundBtn">
                <i class="fas fa-volume-up"></i> Ήχος
            </button>
        </div>
    </div>

    <!-- OTIΕΥ Script -->
    <script type="text/javascript">
        atOptions = {
            'key' : '10274068',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
        };
    </script>
    <script type="text/javascript" src="https://otieu.com/4/10274068"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gameFrame = document.getElementById('gameFrame');
            const loadingScreen = document.getElementById('loadingScreen');
            const reloadBtn = document.getElementById('reloadBtn');
            const soundBtn = document.getElementById('soundBtn');
            
            let soundEnabled = true;
            
            gameFrame.addEventListener('load', function() {
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 300);
                }, 1500);
            });
            
            reloadBtn.addEventListener('click', function() {
                loadingScreen.style.display = 'flex';
                loadingScreen.style.opacity = '1';
                setTimeout(() => {
                    gameFrame.src = gameFrame.src;
                }, 300);
                
                reloadBtn.style.transform = 'rotate(180deg)';
                setTimeout(() => {
                    reloadBtn.style.transform = '';
                }, 300);
            });
            
            soundBtn.addEventListener('click', function() {
                soundEnabled = !soundEnabled;
                
                if (soundEnabled) {
                    soundBtn.innerHTML = '<i class="fas fa-volume-up"></i> Ήχος';
                    soundBtn.style.background = '#3498db';
                } else {
                    soundBtn.innerHTML = '<i class="fas fa-volume-mute"></i> Ήχος';
                    soundBtn.style.background = '#7f8c8d';
                }
                
                soundBtn.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    soundBtn.style.transform = '';
                }, 200);
            });
            
            gameFrame.addEventListener('error', function() {
                loadingScreen.innerHTML = `
                    <div style="text-align: center; padding: 20px; max-width: 400px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #f1c40f; margin-bottom: 15px;"></i>
                        <div style="color: #f1c40f; font-size: 1.2rem; font-weight: 700; margin-bottom: 20px;">
                            Σφάλμα φόρτωσης
                        </div>
                        <button class="small-btn" onclick="location.reload()" style="background: #e67e22;">
                            <i class="fas fa-sync-alt"></i> Ανανέωση
                        </button>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
