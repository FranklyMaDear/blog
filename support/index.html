<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        /* Ad balloon during game */
        .ad-balloon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff4161;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 50;
            box-shadow: 0 4px 12px rgba(255, 65, 97, 0.4);
            animation: float 3s ease-in-out infinite;
            display: none;
            cursor: pointer;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .ad-balloon:hover {
            background: #ff2a4d;
            box-shadow: 0 6px 16px rgba(255, 65, 97, 0.6);
        }
        
        /* Fullscreen ad overlay between levels */
        .level-complete-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .ad-loading-text {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }
        
        .countdown {
            font-size: 24px;
            color: #4cc9f0;
            font-weight: bold;
            margin-top: 20px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- LOADING SCREEN -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div>Φόρτωση Royal Garden Match 2...</div>
            </div>
            
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- AD BALLOON DURING GAME -->
    <div class="ad-balloon" id="adBalloon">ads</div>
    
    <!-- FULLSCREEN AD BETWEEN LEVELS -->
    <div class="level-complete-overlay" id="levelCompleteOverlay">
        <div class="ad-loading-text">Φόρτωση διαφήμισης...</div>
        <div class="countdown" id="countdown">3</div>
    </div>

    <script>
        // DOM Elements
        const loadingScreen = document.getElementById('loadingScreen');
        const gameFrame = document.getElementById('gameFrame');
        const adBalloon = document.getElementById('adBalloon');
        const levelCompleteOverlay = document.getElementById('levelCompleteOverlay');
        const countdownElement = document.getElementById('countdown');
        
        // Game State
        let gameLoaded = false;
        let adScriptLoaded = false;
        let currentLevel = 1;
        let adBalloonTimeout;
        
        // Show ad balloon during gameplay
        function showAdBalloon() {
            adBalloon.style.display = 'block';
            
            // Hide after 5 seconds
            setTimeout(() => {
                adBalloon.style.display = 'none';
            }, 5000);
            
            // Show again after random interval (30-60 seconds)
            adBalloonTimeout = setTimeout(() => {
                if (gameLoaded) {
                    showAdBalloon();
                }
            }, 30000 + Math.random() * 30000);
        }
        
        // Show fullscreen ad between levels
        function showLevelCompleteAd() {
            console.log(`🏆 Πίστα ${currentLevel} ολοκληρώθηκε - Εμφάνιση διαφήμισης`);
            
            // Pause the game
            gameFrame.style.pointerEvents = 'none';
            gameFrame.style.opacity = '0.5';
            
            // Show overlay
            levelCompleteOverlay.style.display = 'flex';
            
            // Start countdown
            let countdown = 3;
            countdownElement.textContent = countdown;
            
            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    countdownElement.textContent = '';
                    
                    // Load the ad script
                    loadAdScript();
                } else {
                    countdownElement.textContent = countdown;
                }
            }, 1000);
        }
        
        // Load the ad script
        function loadAdScript() {
            if (adScriptLoaded) return;
            
            console.log('📢 Φόρτωση διαφημιστικού script...');
            
            const adScript = document.createElement('script');
            adScript.src = 'https://3nbf4.com/act/files/tag.min.js?z=10021853';
            adScript.setAttribute('data-cfasync', 'false');
            adScript.async = true;
            
            adScript.onload = function() {
                console.log('✅ Διαφημιστικό script φορτώθηκε');
                adScriptLoaded = true;
                
                // Hide ad after 10 seconds
                setTimeout(() => {
                    hideAdOverlay();
                    currentLevel++;
                    
                    // Schedule next level completion simulation
                    scheduleNextLevelCompletion();
                }, 10000);
            };
            
            adScript.onerror = function() {
                console.log('❌ Σφάλμα φόρτωσης script');
                // Hide overlay anyway after 5 seconds
                setTimeout(() => {
                    hideAdOverlay();
                    scheduleNextLevelCompletion();
                }, 5000);
            };
            
            document.body.appendChild(adScript);
        }
        
        // Hide ad overlay and resume game
        function hideAdOverlay() {
            levelCompleteOverlay.style.display = 'none';
            gameFrame.style.pointerEvents = 'auto';
            gameFrame.style.opacity = '1';
        }
        
        // Simulate level completion (every 60-120 seconds)
        function scheduleNextLevelCompletion() {
            const nextLevelTime = 60000 + Math.random() * 60000; // 60-120 seconds
            
            console.log(`⏰ Επόμενη πίστα σε ${Math.round(nextLevelTime/1000)} δευτερόλεπτα`);
            
            setTimeout(() => {
                if (gameLoaded) {
                    showLevelCompleteAd();
                }
            }, nextLevelTime);
        }
        
        // Initialize game
        function initGame() {
            console.log('🎮 Παιχνίδι έτοιμο!');
            gameLoaded = true;
            
            // Start showing ad balloon
            setTimeout(() => {
                showAdBalloon();
            }, 10000);
            
            // Schedule first level completion
            setTimeout(() => {
                scheduleNextLevelCompletion();
            }, 30000);
            
            // Click on balloon loads ad immediately
            adBalloon.addEventListener('click', function() {
                showLevelCompleteAd();
                adBalloon.style.display = 'none';
                clearTimeout(adBalloonTimeout);
            });
        }
        
        // Game loaded event
        gameFrame.addEventListener('load', function() {
            console.log('✅ Παιχνίδι φορτώθηκε');
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                initGame();
            }, 2000);
        });
        
        // Game error
        gameFrame.addEventListener('error', function() {
            console.log('❌ Σφάλμα φόρτωσης παιχνιδιού');
            loadingScreen.innerHTML = `
                <div style="text-align: center;">
                    <div style="color: #ff4161; font-size: 20px; margin-bottom: 20px;">
                        Σφάλμα φόρτωσης
                    </div>
                    <button onclick="location.reload()" 
                            style="background: #4cc9f0; color: white; border: none; 
                                   padding: 10px 20px; border-radius: 20px; cursor: pointer;">
                        Ανανέωση Σελίδας
                    </button>
                </div>
            `;
        });
        
        // Initial message
        console.log('🎮 Royal Garden Match 2');
        console.log('📢 Διαφημίσεις μεταξύ πιστών');
        
        // Auto-hide loading screen after 5 seconds max
        setTimeout(() => {
            if (!gameLoaded) {
                loadingScreen.classList.add('hidden');
                initGame();
            }
        }, 5000);
    </script>
</body>
</html>
