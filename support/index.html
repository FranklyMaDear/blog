<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Improved Bottom Popup Banner - Larger and better design */
        .bottom-popup {
            position: fixed;
            bottom: -150px;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #1a5fb4 0%, #26a269 100%);
            color: white;
            padding: 20px 25px;
            z-index: 90;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
            border-top: 5px solid #ffcc00;
            transition: bottom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        
        .bottom-popup.show {
            bottom: 0;
        }
        
        .popup-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        
        .popup-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }
        
        .popup-icon {
            background: #ffcc00;
            color: #1a5fb4;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            animation: pulseIcon 2s infinite;
        }
        
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 204, 0, 0); }
        }
        
        .popup-text {
            text-align: left;
            flex-shrink: 0;
        }
        
        .popup-title {
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 5px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .popup-subtitle {
            font-size: 16px;
            color: #ffcc00;
            font-weight: 500;
        }
        
        .popup-ad-container {
            flex: 1;
            min-height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(255, 204, 0, 0.3);
        }
        
        .ad-placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }
        
        .close-popup {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            transition: all 0.3s;
            margin-left: 15px;
        }
        
        .close-popup:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Floating Objects - More and better */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            z-index: 81;
            animation: floatDiagonal 30s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .floating-object:hover {
            transform: scale(1.3);
            filter: brightness(1.4) drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
        }
        
        @keyframes floatDiagonal {
            0% {
                transform: translateY(100vh) translateX(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Different Floating Objects */
        .fruit-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .fruit-shape {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            position: relative;
        }
        
        .fruit-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        .fruit-label {
            background: rgba(0, 0, 0, 0.8);
            color: #ffcc00;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 204, 0, 0.3);
            margin-top: 5px;
        }
        
        /* Apple */
        .fruit-apple .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3333, #cc0000);
        }
        
        .fruit-apple .fruit-icon {
            content: '🍎';
        }
        
        /* Orange */
        .fruit-orange .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff9800, #ff5722);
        }
        
        .fruit-orange .fruit-icon {
            content: '🍊';
        }
        
        /* Banana */
        .fruit-banana .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ffcc00, #ff9900);
            border-radius: 50% 50% 30% 70% / 60% 40% 60% 40%;
        }
        
        .fruit-banana .fruit-icon {
            content: '🍌';
        }
        
        /* Balloon */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .balloon-shape {
            width: 65px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, var(--balloon-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
        }
        
        .balloon-shape:before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 35px;
            background: #666;
        }
        
        .balloon-label {
            background: rgba(0, 0, 0, 0.8);
            color: #4cc9f0;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(76, 201, 240, 0.3);
            margin-top: 5px;
        }
        
        /* Flower */
        .flower-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .flower-shape {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 50% 50%, var(--flower-color));
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .flower-center {
            width: 20px;
            height: 20px;
            background: #ffcc00;
            border-radius: 50%;
            position: absolute;
        }
        
        .flower-label {
            background: rgba(0, 0, 0, 0.8);
            color: #e91e63;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(233, 30, 99, 0.3);
            margin-top: 5px;
        }
        
        /* Object Glow Effect */
        .object-glow {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: inherit;
            border-radius: inherit;
            filter: blur(12px);
            opacity: 0.4;
            z-index: -1;
            animation: gentleGlow 3s infinite alternate;
        }
        
        @keyframes gentleGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.6; transform: scale(1.05); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME - NO LOADING SCREEN -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- BOTTOM POPUP BANNER WITH EMBEDDED AD -->
    <div class="bottom-popup" id="bottomPopup">
        <div class="popup-content">
            <div class="popup-left">
                <div class="popup-icon">!</div>
                <div class="popup-text">
                    <div class="popup-title">🎮 Υποστηρίξτε το Παιχνίδι</div>
                    <div class="popup-subtitle">Η διαφήμιση παρακάτω βοηθάει να παραμείνει δωρεάν!</div>
                </div>
            </div>
            
            <div class="popup-ad-container" id="popupAdContainer">
                <div class="ad-placeholder">📢 Διαφήμιση φορτώνεται...</div>
            </div>
            
            <button class="close-popup" id="closePopup">×</button>
        </div>
    </div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const bottomPopup = document.getElementById('bottomPopup');
        const closePopup = document.getElementById('closePopup');
        const popupAdContainer = document.getElementById('popupAdContainer');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameLoaded = true; // Game loads immediately
        let popupTimeout;
        let floatingInterval;
        let adScriptLoaded = false;
        let isAdShowing = false;
        let activeObjects = 0;
        const MAX_OBJECTS = 3; // 3 floating objects at once
        
        // Load your Vignette script (Zone: 10113668)
        function loadVignetteScript() {
            if (adScriptLoaded) return;
            
            console.log('📢 Φόρτωση Vignette script (Zone: 10113668)...');
            
            // Use the exact script you provided
            (function(s){
                s.dataset.zone='10113668',
                s.src='https://groleegni.net/vignette.min.js'
            })([document.documentElement, document.body]
                .filter(Boolean).pop()
                .appendChild(document.createElement('script')));
            
            adScriptLoaded = true;
            console.log('✅ Vignette script φορτώθηκε');
        }
        
        // Show ad in popup banner (embedded)
        function showEmbeddedAd() {
            if (isAdShowing) return;
            
            console.log('🎯 Εμφάνιση ενσωματωμένης διαφήμισης στο banner');
            isAdShowing = true;
            
            // Clear container
            popupAdContainer.innerHTML = '<div class="ad-placeholder">📢 Διαφήμιση φορτώνεται...</div>';
            
            // Load script if not loaded
            if (!adScriptLoaded) {
                loadVignetteScript();
            }
            
            // Create ad element for vignette
            const adElement = document.createElement('div');
            adElement.id = 'vignette-ad-' + Date.now();
            adElement.style.width = '100%';
            adElement.style.height = '100%';
            adElement.style.minHeight = '100px';
            popupAdContainer.innerHTML = '';
            popupAdContainer.appendChild(adElement);
            
            // Try to trigger vignette ad
            setTimeout(() => {
                try {
                    // Check if vignette is loaded
                    if (typeof window.Vignette !== 'undefined') {
                        console.log('🔄 Vignette API διαθέσιμο');
                        // Vignette should auto-show in the container
                    }
                } catch(e) {
                    console.log('⚠️ Vignette error:', e);
                }
            }, 1000);
            
            // Auto-hide banner after 30 seconds
            setTimeout(() => {
                hideBottomPopup();
                isAdShowing = false;
            }, 30000);
        }
        
        // Show/Hide Bottom Popup - STARTS AFTER 2 MINUTES
        function showBottomPopup() {
            console.log('🕒 Εμφάνιση popup banner (μετά από 2 λεπτά)');
            bottomPopup.classList.add('show');
            
            // Show embedded ad in popup
            setTimeout(() => {
                showEmbeddedAd();
            }, 500);
            
            // Auto-hide after 30 seconds
            popupTimeout = setTimeout(() => {
                hideBottomPopup();
            }, 30000);
        }
        
        function hideBottomPopup() {
            bottomPopup.classList.remove('show');
            if (popupTimeout) clearTimeout(popupTimeout);
            isAdShowing = false;
        }
        
        // Schedule popup to appear AFTER 2 MINUTES
        function schedulePopup() {
            // Show first popup after 2 minutes (120000ms)
            setTimeout(() => {
                if (gameLoaded) {
                    showBottomPopup();
                }
            }, 120000);
            
            // Then show every 5-7 minutes
            setInterval(() => {
                if (gameLoaded && !isAdShowing) {
                    showBottomPopup();
                }
            }, 300000 + Math.random() * 120000);
        }
        
        // Create floating objects - Various types
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS) return;
            
            const objectTypes = [
                { type: 'fruit', subtype: 'apple', label: '🍎 Κλικ εδώ!', color: '#ff3333, #cc0000' },
                { type: 'fruit', subtype: 'orange', label: '🍊 Υποστήριξη', color: '#ff9800, #ff5722' },
                { type: 'fruit', subtype: 'banana', label: '🍌 Παίξε Δωρεάν', color: '#ffcc00, #ff9900' },
                { type: 'balloon', subtype: 'red', label: '🎈 Υποστήριξη', color: '#ff3333, #cc0000' },
                { type: 'balloon', subtype: 'blue', label: '🎈 Κλικ εδώ', color: '#4cc9f0, #1a5fb4' },
                { type: 'flower', subtype: 'pink', label: '🌸 Παίξε Δωρεάν', color: '#e91e63, #c2185b' },
                { type: 'flower', subtype: 'purple', label: '🌺 Υποστήριξη', color: '#9c27b0, #7b1fa2' }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            
            const object = document.createElement('div');
            object.className = `floating-object ${objType.type}-object ${objType.type}-${objType.subtype}`;
            
            // Random position
            const startX = Math.random() * (window.innerWidth - 100);
            const delay = Math.random() * 3;
            const duration = 25 + Math.random() * 15;
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Create object content based on type
            let shapeDiv, iconDiv, labelDiv;
            
            if (objType.type === 'fruit') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'fruit-shape';
                
                iconDiv = document.createElement('div');
                iconDiv.className = 'fruit-icon';
                iconDiv.textContent = objType.label.split(' ')[0]; // Get emoji
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'fruit-label';
                labelDiv.textContent = objType.label;
                
                shapeDiv.appendChild(iconDiv);
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'balloon') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'balloon-shape';
                shapeDiv.style.setProperty('--balloon-color', objType.color);
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'balloon-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'flower') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'flower-shape';
                shapeDiv.style.setProperty('--flower-color', objType.color);
                
                const centerDiv = document.createElement('div');
                centerDiv.className = 'flower-center';
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'flower-label';
                labelDiv.textContent = objType.label;
                
                shapeDiv.appendChild(centerDiv);
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
            }
            
            // Add glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Click event to open ad
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                if (!isAdShowing) {
                    // Visual feedback
                    this.style.transform = 'scale(1.5) rotate(20deg)';
                    this.style.opacity = '0.7';
                    
                    // Show embedded ad
                    showBottomPopup();
                    
                    // Remove object after click
                    setTimeout(() => {
                        if (this.parentNode) {
                            this.remove();
                            activeObjects--;
                        }
                    }, 300);
                }
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Schedule floating objects
        function scheduleFloatingObjects() {
            // Create objects every 15-25 seconds
            floatingInterval = setInterval(() => {
                if (gameLoaded && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                    createFloatingObject();
                }
            }, 15000 + Math.random() * 10000);
            
            // Create initial objects
            setTimeout(() => createFloatingObject(), 5000);
            setTimeout(() => createFloatingObject(), 10000);
            setTimeout(() => createFloatingObject(), 15000);
        }
        
        // Initialize everything
        function init() {
            console.log('🎮 Παιχνίδι φορτώνεται κατευθείαν!');
            
            // Load Vignette script after a delay
            setTimeout(loadVignetteScript, 30000);
            
            // Schedule popup to appear AFTER 2 MINUTES
            schedulePopup();
            
            // Start floating objects immediately
            scheduleFloatingObjects();
            
            // Game loaded event (just in case)
            gameFrame.addEventListener('load', function() {
                console.log('✅ Παιχνίδι φορτώθηκε πλήρως');
            });
        }
        
        // Event Listeners
        closePopup.addEventListener('click', function() {
            hideBottomPopup();
        });
        
        // Prevent clicks on game frame
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Initial message
        console.log('🎮 Royal Garden Match 2');
        console.log('🎯 Παιχνίδι ανοίγει κατευθείαν!');
        console.log('⏰ Διαφημίσεις ξεκινούν μετά από 2 λεπτά');
        console.log('📢 Vignette Script Zone: 10113668');
        
        // Start everything
        init();
        
        // Handle visibility change
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && gameLoaded) {
                console.log('👁️ Η σελίδα είναι τώρα ορατή');
            }
        });
    </script>
</body>
</html>
