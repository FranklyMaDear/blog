<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Sharp Turn - Δωρεάν Παιχνίδι</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-frame {
            border: none;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        
        /* Game Loader */
        .game-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .loader-text {
            color: #ffcc00;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 15px;
            height: 15px;
            background: #ffcc00;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Floating Objects - Smaller */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            z-index: 81;
            animation: floatDiagonal 35s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .floating-object:hover {
            transform: scale(1.2);
            filter: brightness(1.3) drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }
        
        @keyframes floatDiagonal {
            0% {
                transform: translateY(100vh) translateX(-80px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(80px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Fruit Objects */
        .fruit-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .fruit-shape {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .fruit-label {
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 204, 0, 0.4);
            text-align: center;
        }
        
        /* Apple */
        .fruit-apple .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3333, #cc0000);
            box-shadow: 0 5px 15px rgba(255, 50, 50, 0.4);
        }
        
        /* Orange */
        .fruit-orange .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff9800, #ff5722);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }
        
        /* Strawberry */
        .fruit-strawberry .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3366, #cc0066);
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
        }
        
        /* Banana */
        .fruit-banana .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ffcc00, #ff9800);
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
        }
        
        /* Grapes */
        .fruit-grapes .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #9c27b0, #7b1fa2);
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.4);
        }
        
        /* Balloon Objects with "ads" text */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .balloon-shape {
            width: 55px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, var(--balloon-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .ads-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .balloon-shape:before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: linear-gradient(to bottom, #888, #666);
        }
        
        .balloon-label {
            background: rgba(0, 0, 0, 0.85);
            color: var(--balloon-text-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Flower Objects */
        .flower-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .flower-shape {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 50% 50%, var(--flower-color));
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .flower-petals {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .flower-petal {
            position: absolute;
            width: 20px;
            height: 30px;
            background: var(--flower-petal-color);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }
        
        .flower-center {
            width: 18px;
            height: 18px;
            background: #ffcc00;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        
        .flower-label {
            background: rgba(0, 0, 0, 0.85);
            color: var(--flower-text-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Object Glow Effect */
        .object-glow {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: inherit;
            border-radius: inherit;
            filter: blur(12px);
            opacity: 0.4;
            z-index: -1;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- GAME LOADER -->
    <div class="game-loader" id="gameLoader">
        <div class="loader-text">Φόρτωση παιχνιδιού...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME - Rescue Sharp Turn -->
            <iframe 
                src="https://html5.gamedistribution.com/67b7fb2c6f594ef3a4fcb241e902ce1d/?gd_sdk_referrer_url=https://gamedistribution.com/games/rescue-sharp-turn/" 
                class="game-frame" 
                id="gameFrame"
                width="750"
                height="1334"
                scrolling="none"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <!-- YOUR SCRIPT WILL BE LOADED HERE -->
    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const gameLoader = document.getElementById('gameLoader');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameStarted = false;
        let floatingInterval;
        let activeObjects = 0;
        const MAX_OBJECTS = 4;
        let adScriptLoaded = false;
        
        // Load Vignette script
        function loadVignetteScript() {
            if (adScriptLoaded) return;
            
            console.log('📢 Φόρτωση Vignette script...');
            
            (function(s){
                s.dataset.zone='10021677';
                s.src='https://gizokraijaw.net/vignette.min.js';
            })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
            
            adScriptLoaded = true;
        }
        
        // Show Vignette ad when clicking on floating objects
        function showVignetteAd() {
            console.log('🎯 Προβολή Vignette διαφήμισης');
            
            // Check if vignette is available
            if (typeof vignette !== 'undefined') {
                try {
                    // Try to display ad
                    vignette.showAd();
                } catch (error) {
                    console.log('⚠️ Σφάλμα προβολής διαφήμισης:', error);
                    showFallbackAd();
                }
            } else {
                console.log('ℹ️ Vignette δεν είναι διαθέσιμο');
                showFallbackAd();
            }
        }
        
        // Fallback ad
        function showFallbackAd() {
            // Open new tab with ad URL
            window.open('https://example.com', '_blank');
        }
        
        // Hide loader when game loads
        function hideLoader() {
            setTimeout(() => {
                gameLoader.style.opacity = '0';
                setTimeout(() => {
                    gameLoader.style.display = 'none';
                    startFloatingObjects();
                }, 500);
            }, 2000);
        }
        
        // Create floating objects - Various shapes with ads
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS || !gameStarted) return;
            
            const objectTypes = [
                // Balloons with ADS text
                { 
                    type: 'balloon', 
                    subtype: 'red-ads', 
                    label: 'Κλικ για διαφήμιση', 
                    color: '#ff3333, #cc0000',
                    textColor: '#ff9999'
                },
                { 
                    type: 'balloon', 
                    subtype: 'blue-ads', 
                    label: 'Δείτε διαφήμιση', 
                    color: '#4cc9f0, #1a5fb4',
                    textColor: '#99ccff'
                },
                { 
                    type: 'balloon', 
                    subtype: 'green-ads', 
                    label: 'Υποστήριξη', 
                    color: '#4CAF50, #2E7D32',
                    textColor: '#99ff99'
                },
                { 
                    type: 'balloon', 
                    subtype: 'purple-ads', 
                    label: 'Κλικ εδώ', 
                    color: '#9c27b0, #7b1fa2',
                    textColor: '#cc99ff'
                },
                // Fruits
                { 
                    type: 'fruit', 
                    subtype: 'apple', 
                    label: '🍎 Κλικ', 
                    text: '🍎'
                },
                { 
                    type: 'fruit', 
                    subtype: 'orange', 
                    label: '🍊 Διαφήμιση', 
                    text: '🍊'
                },
                { 
                    type: 'fruit', 
                    subtype: 'strawberry', 
                    label: '🍓 Υποστήριξη', 
                    text: '🍓'
                },
                { 
                    type: 'fruit', 
                    subtype: 'banana', 
                    label: '🍌 Κλικ εδώ', 
                    text: '🍌'
                },
                { 
                    type: 'fruit', 
                    subtype: 'grapes', 
                    label: '🍇 Δείτε ad', 
                    text: '🍇'
                },
                // Flowers
                { 
                    type: 'flower', 
                    subtype: 'pink', 
                    label: '🌸 Κλικ', 
                    color: '#e91e63, #c2185b',
                    petalColor: '#ff80ab',
                    textColor: '#ff99cc'
                },
                { 
                    type: 'flower', 
                    subtype: 'yellow', 
                    label: '🌼 Διαφήμιση', 
                    color: '#ffeb3b, #fbc02d',
                    petalColor: '#fff59d',
                    textColor: '#ffff99'
                },
                { 
                    type: 'flower', 
                    subtype: 'blue', 
                    label: '🌺 Υποστήριξη', 
                    color: '#2196F3, #1976D2',
                    petalColor: '#90caf9',
                    textColor: '#99ccff'
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            const object = document.createElement('div');
            object.className = `floating-object ${objType.type}-object ${objType.type}-${objType.subtype}`;
            
            // Set CSS variables for colors
            if (objType.type === 'balloon') {
                object.style.setProperty('--balloon-color', objType.color);
                object.style.setProperty('--balloon-text-color', objType.textColor);
            } else if (objType.type === 'flower') {
                object.style.setProperty('--flower-color', objType.color);
                object.style.setProperty('--flower-petal-color', objType.petalColor);
                object.style.setProperty('--flower-text-color', objType.textColor);
            }
            
            // Random position and animation
            const startX = Math.random() * (window.innerWidth - 100);
            const delay = Math.random() * 5;
            const duration = 25 + Math.random() * 20;
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Create object content based on type
            if (objType.type === 'fruit') {
                const fruitDiv = document.createElement('div');
                fruitDiv.className = 'fruit-shape';
                fruitDiv.textContent = objType.text;
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'fruit-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(fruitDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'balloon') {
                const balloonDiv = document.createElement('div');
                balloonDiv.className = 'balloon-shape';
                
                // Add "ads" text
                const adsDiv = document.createElement('div');
                adsDiv.className = 'ads-text';
                adsDiv.textContent = 'ADS';
                balloonDiv.appendChild(adsDiv);
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'balloon-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(balloonDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'flower') {
                const flowerDiv = document.createElement('div');
                flowerDiv.className = 'flower-shape';
                
                // Create petals
                const petalsDiv = document.createElement('div');
                petalsDiv.className = 'flower-petals';
                
                for (let i = 0; i < 8; i++) {
                    const petalDiv = document.createElement('div');
                    petalDiv.className = 'flower-petal';
                    petalDiv.style.transform = `translate(-50%, -50%) rotate(${i * 45}deg) translateX(25px)`;
                    petalsDiv.appendChild(petalDiv);
                }
                
                flowerDiv.appendChild(petalsDiv);
                
                // Add center
                const centerDiv = document.createElement('div');
                centerDiv.className = 'flower-center';
                flowerDiv.appendChild(centerDiv);
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'flower-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(flowerDiv);
                object.appendChild(labelDiv);
            }
            
            // Add glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Click event - SHOW VIGNETTE AD
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                this.style.transform = 'scale(1.3)';
                this.style.opacity = '0.7';
                this.style.filter = 'brightness(1.5) drop-shadow(0 0 20px gold)';
                
                // Show Vignette ad
                showVignetteAd();
                
                // Remove object
                setTimeout(() => {
                    if (this.parentNode) {
                        this.remove();
                        activeObjects--;
                    }
                }, 400);
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Start floating objects after game starts
        function startFloatingObjects() {
            gameStarted = true;
            
            // Create objects every 15-25 seconds
            floatingInterval = setInterval(() => {
                if (gameStarted && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                    createFloatingObject();
                }
            }, 15000 + Math.random() * 10000);
            
            // Create initial objects with delay
            setTimeout(() => createFloatingObject(), 1000);
            setTimeout(() => createFloatingObject(), 4000);
            setTimeout(() => createFloatingObject(), 7000);
        }
        
        // Initialize
        function init() {
            console.log('🎮 Rescue Sharp Turn - Αρχικοποίηση');
            
            // Hide loader after game loads
            hideLoader();
            
            // Load Vignette script after 30 seconds
            setTimeout(loadVignetteScript, 30000);
            
            // Start listening for game interactions
            gameFrame.addEventListener('load', function() {
                console.log('✅ Παιχνίδι φορτώθηκε');
            });
        }
        
        // Event Listeners
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Start everything
        init();
    </script>
</body>
</html>
