<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* ===== GAME CONTAINER ===== */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ===== GAME AREA ===== */
        .game-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: auto !important;
        }
        
        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.5rem;
            color: #4cc9f0;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            color: #b8b8b8;
            font-size: 1rem;
            text-align: center;
            max-width: 300px;
        }
        
        /* ===== BOTTOM AD BAR ===== */
        .bottom-ad-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 10px;
            border-top: 3px solid #4cc9f0;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            transition: transform 0.5s ease;
        }
        
        .ad-label {
            position: absolute;
            top: -25px;
            left: 20px;
            background: #4cc9f0;
            color: white;
            padding: 5px 15px;
            border-radius: 15px 15px 0 0;
            font-size: 0.8rem;
            font-weight: 700;
        }
        
        .ad-content {
            width: 100%;
            max-width: 728px;
            margin: 0 auto;
            text-align: center;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* ===== AD BAR STATES ===== */
        .bottom-ad-bar.hidden {
            transform: translateY(100%);
            display: none;
        }
        
        .bottom-ad-bar.visible {
            transform: translateY(0);
            display: flex;
        }
        
        /* ===== AD INSIDE BANNER ===== */
        .ad-inside-banner {
            width: 100%;
            height: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }
        
        .ad-placeholder {
            color: #666;
            font-size: 0.9rem;
            padding: 20px;
            text-align: center;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .bottom-ad-bar {
                min-height: 80px;
                padding: 8px;
            }
            
            .ad-label {
                top: -20px;
                left: 10px;
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            
            .ad-inside-banner {
                min-height: 70px;
            }
        }
        
        @media (max-width: 480px) {
            .bottom-ad-bar {
                min-height: 60px;
                padding: 5px;
            }
            
            .ad-label {
                top: -18px;
                left: 5px;
                padding: 3px 8px;
                font-size: 0.65rem;
            }
            
            .ad-inside-banner {
                min-height: 50px;
            }
        }
        
        /* ===== UTILITY CLASSES ===== */
        .hidden {
            display: none !important;
        }
        
        .fade-out {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <!-- GAME AREA -->
        <div class="game-area">
            <!-- LOADING SCREEN -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div class="loading-text">Φόρτωση Royal Garden Match 2...</div>
                <div class="loading-subtext">Το παιχνίδι φορτώνεται, παρακαλώ περιμένετε</div>
            </div>
            
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- BOTTOM AD BAR -->
    <div class="bottom-ad-bar hidden" id="bottomAdBar">
        <div class="ad-label">Υποστήριξη</div>
        <div class="ad-content" id="bottomAdContent">
            <!-- Ad will be loaded here inside the banner -->
            <div class="ad-inside-banner" id="adInsideBanner">
                <div class="ad-placeholder">Διαφήμιση φορτώνεται...</div>
            </div>
        </div>
    </div>

    <script>
        // ===== DOM ELEMENTS =====
        const loadingScreen = document.getElementById('loadingScreen');
        const gameFrame = document.getElementById('gameFrame');
        const bottomAdBar = document.getElementById('bottomAdBar');
        const adInsideBanner = document.getElementById('adInsideBanner');
        
        // ===== GAME STATE =====
        let gameLoaded = false;
        let isAdShowing = false;
        let adInterval = null;
        let adDisplayDuration = 10000; // 10 seconds
        let adCooldown = 60000; // 60 seconds between ads
        
        // ===== LOAD MONETAG AD =====
        function loadMonetagAd() {
            if (isAdShowing) return;
            
            console.log('🔄 Φόρτωση Monetag διαφήμισης...');
            
            // Clear previous ad content
            adInsideBanner.innerHTML = '<div class="ad-placeholder">Διαφήμιση φορτώνεται...</div>';
            
            // Show the banner
            bottomAdBar.classList.remove('hidden');
            bottomAdBar.classList.add('visible');
            isAdShowing = true;
            
            // Create Monetag script element
            const monetagScript = document.createElement('script');
            monetagScript.dataset.zone = '10274195';
            monetagScript.src = 'https://al5sm.com/tag.min.js';
            monetagScript.async = true;
            
            // Add error handling
            monetagScript.onerror = function() {
                console.log('⚠️ Monetag script failed to load');
                setTimeout(() => {
                    // Try alternative method
                    try {
                        const fallbackScript = document.createElement('script');
                        fallbackScript.innerHTML = `
                            (function(s){
                                s.dataset.zone='10274195',
                                s.src='https://al5sm.com/tag.min.js'
                            })(document.createElement('script'));
                        `;
                        adInsideBanner.appendChild(fallbackScript);
                    } catch(e) {
                        console.log('❌ Could not load ad');
                        hideAdBanner();
                    }
                }, 500);
            };
            
            // Add to banner container
            adInsideBanner.appendChild(monetagScript);
            
            // Auto-hide after duration
            setTimeout(() => {
                hideAdBanner();
            }, adDisplayDuration);
            
            // Schedule next ad
            scheduleNextAd();
        }
        
        // ===== HIDE AD BANNER =====
        function hideAdBanner() {
            if (!isAdShowing) return;
            
            console.log('👋 Απόκρυψη διαφήμισης');
            
            // Hide the banner
            bottomAdBar.classList.remove('visible');
            bottomAdBar.classList.add('hidden');
            isAdShowing = false;
            
            // Clear ad content
            setTimeout(() => {
                adInsideBanner.innerHTML = '<div class="ad-placeholder">Διαφήμιση φορτώνεται...</div>';
            }, 500);
        }
        
        // ===== SCHEDULE NEXT AD =====
        function scheduleNextAd() {
            // Clear any existing interval
            if (adInterval) {
                clearTimeout(adInterval);
            }
            
            // Schedule next ad (every 60-90 seconds)
            const nextAdDelay = adCooldown + Math.floor(Math.random() * 30000);
            
            console.log(`⏰ Επόμενη διαφήμιση σε ${Math.round(nextAdDelay/1000)} δευτερόλεπτα`);
            
            adInterval = setTimeout(() => {
                if (gameLoaded && !isAdShowing) {
                    loadMonetagAd();
                }
            }, nextAdDelay);
        }
        
        // ===== CHECK IF USER IS PLAYING =====
        function isUserPlaying() {
            // Check if game frame is focused or user is interacting
            return document.activeElement === gameFrame;
        }
        
        // ===== INITIALIZE GAME =====
        function initGame() {
            console.log('🎮 Royal Garden Match 2 - Αρχικοποίηση...');
            
            gameLoaded = true;
            
            // Show first ad after short delay
            setTimeout(() => {
                if (!isAdShowing) {
                    loadMonetagAd();
                }
            }, 5000);
            
            // Prevent ads from appearing when user is actively playing
            let lastInteraction = Date.now();
            
            // Track user interaction
            document.addEventListener('click', function() {
                lastInteraction = Date.now();
            });
            
            document.addEventListener('keydown', function() {
                lastInteraction = Date.now();
            });
            
            // Check if user is playing before showing ads
            setInterval(() => {
                if (isAdShowing) return;
                
                const timeSinceInteraction = Date.now() - lastInteraction;
                // Only show ad if user hasn't interacted for at least 30 seconds
                if (timeSinceInteraction > 30000) {
                    // This would be called from scheduleNextAd, so no need to call here
                }
            }, 10000);
        }
        
        // ===== EVENT LISTENERS =====
        
        // Game loaded
        gameFrame.addEventListener('load', function() {
            console.log('✅ Το παιχνίδι φορτώθηκε επιτυχώς');
            
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    initGame();
                }, 500);
            }, 2000);
        });
        
        // Game error
        gameFrame.addEventListener('error', function() {
            console.log('❌ Αποτυχία φόρτωσης παιχνιδιού');
            loadingScreen.innerHTML = `
                <div style="text-align: center; padding: 20px; max-width: 400px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff4161; margin-bottom: 20px;"></i>
                    <div style="color: #ff4161; font-size: 1.3rem; font-weight: 700; margin-bottom: 20px;">
                        Σφάλμα φόρτωσης
                    </div>
                    <div style="margin-bottom: 25px; color: #b8b8b8;">
                        Το παιχνίδι δεν μπορεί να φορτωθεί. Παρακαλώ ανανεώστε τη σελίδα.
                    </div>
                    <button onclick="location.reload()" 
                            style="background: #ff4161; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer;">
                        <i class="fas fa-sync-alt"></i> Ανανέωση Σελίδας
                    </button>
                </div>
            `;
        });
        
        // Initial console message
        console.log('🎮 ================================');
        console.log('🎮 ROYAL GARDEN MATCH 2');
        console.log('🎮 Μόνιμες διαφημίσεις ΜΟΝΟ στο banner');
        console.log('🎮 Χωρίς popups, χωρίς διακοπές στο gameplay');
        console.log('🎮 ================================');
        
        // Auto-hide loading screen after timeout
        setTimeout(() => {
            if (!loadingScreen.classList.contains('hidden')) {
                loadingScreen.classList.add('hidden');
                initGame();
            }
        }, 8000);
    </script>
</body>
</html>
