<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Xmas Balls - Free Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-frame {
            border: none;
            display: block;
            background: #000;
        }
        
        /* Game Loader */
        .game-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 90;
        }
        
        /* Floating Objects */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 91;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
        }
        
        .floating-object:hover {
            transform: scale(1.1);
            opacity: 1;
            z-index: 92;
        }
        
        /* Balloon Objects */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .balloon-shape {
            width: 50px;
            height: 60px;
            background: var(--balloon-color);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .balloon-text {
            color: white;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            padding: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            line-height: 1.2;
        }
        
        .balloon-string {
            width: 2px;
            height: 20px;
            background: #888;
            margin-top: -2px;
        }
        
        /* Gift Objects */
        .gift-object {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .gift-shape {
            width: 45px;
            height: 45px;
            background: var(--gift-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .gift-ribbon {
            position: absolute;
            width: 100%;
            height: 8px;
            background: var(--ribbon-color);
            top: 50%;
            transform: translateY(-50%);
        }
        
        .gift-text {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 9px;
            margin-top: 5px;
            font-weight: bold;
            text-align: center;
            max-width: 60px;
            line-height: 1.2;
        }
        
        /* Star Objects */
        .star-object {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .star-shape {
            width: 45px;
            height: 45px;
            background: var(--star-color);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: gold;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }
        
        .star-text {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 9px;
            margin-top: 5px;
            font-weight: bold;
            text-align: center;
            max-width: 60px;
            line-height: 1.2;
        }
        
        /* Object Animations */
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x));
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x));
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x));
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x));
                opacity: 0;
            }
        }
        
        @keyframes floatLeft {
            0% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--start-y));
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(-100px) translateY(var(--end-y));
                opacity: 0;
            }
        }
        
        @keyframes floatRight {
            0% {
                transform: translateX(-100px) translateY(var(--start-y));
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y));
                opacity: 0;
            }
        }
        
        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            text-align: center;
            z-index: 92;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .instructions.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- GAME LOADER -->
    <div class="game-loader" id="gameLoader">
        <div class="loader-text">Loading Sorting Xmas Balls...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME - Sorting Xmas Balls -->
            <iframe 
                src="https://html5.gamedistribution.com/a508edbaeb1d4213aecebbe4115670c2/?gd_sdk_referrer_url=https://gamedistribution.com/games/sorting-xmas-balls/" 
                class="game-frame" 
                id="gameFrame"
                width="800"
                height="600"
                scrolling="none"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- INSTRUCTIONS -->
    <div class="instructions" id="instructions">Game Ready • Click floating objects for rewards</div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const gameLoader = document.getElementById('gameLoader');
        const floatingObjects = document.getElementById('floatingObjects');
        const instructions = document.getElementById('instructions');
        
        // Game State
        let gameStarted = false;
        let activeObjects = 0;
        const MAX_OBJECTS = 4;
        let objectInterval;
        
        // Configuration
        const GAME_AREA_PADDING = 60;
        const START_DELAY = 3000; // 3 seconds after game starts
        const SPAWN_INTERVAL_MIN = 8000;
        const SPAWN_INTERVAL_MAX = 15000;
        
        // Hide loader when game loads
        function hideLoader() {
            setTimeout(() => {
                gameLoader.style.opacity = '0';
                setTimeout(() => {
                    gameLoader.style.display = 'none';
                    showInstructions();
                    
                    // Start objects after delay
                    setTimeout(startFloatingObjects, START_DELAY);
                }, 500);
            }, 2000);
        }
        
        // Show instructions
        function showInstructions() {
            instructions.classList.add('show');
            setTimeout(() => {
                instructions.classList.remove('show');
            }, 3000);
        }
        
        // Get game area boundaries
        function getGameAreaBounds() {
            const frameRect = gameFrame.getBoundingClientRect();
            return {
                left: frameRect.left + GAME_AREA_PADDING,
                right: frameRect.right - GAME_AREA_PADDING,
                top: frameRect.top + GAME_AREA_PADDING,
                bottom: frameRect.bottom - GAME_AREA_PADDING,
                width: frameRect.width,
                height: frameRect.height
            };
        }
        
        // Create floating object
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS || !gameStarted) return;
            
            const objectTypes = [
                // Balloons (downward/upward movement)
                { 
                    type: 'balloon', 
                    color: 'linear-gradient(135deg, #4CAF50, #2E7D32)',
                    text: 'AD\nClick',
                    animation: 'floatDown'
                },
                { 
                    type: 'balloon', 
                    color: 'linear-gradient(135deg, #2196F3, #1976D2)',
                    text: 'Win\nPrize',
                    animation: 'floatUp'
                },
                { 
                    type: 'balloon', 
                    color: 'linear-gradient(135deg, #FF9800, #F57C00)',
                    text: 'Free\nBonus',
                    animation: 'floatDown'
                },
                { 
                    type: 'balloon', 
                    color: 'linear-gradient(135deg, #9C27B0, #7B1FA2)',
                    text: 'Gift\nClick',
                    animation: 'floatUp'
                },
                // Gifts (left/right movement)
                { 
                    type: 'gift', 
                    color: '#FF5722',
                    ribbon: '#FFC107',
                    text: 'Open me',
                    animation: 'floatLeft'
                },
                { 
                    type: 'gift', 
                    color: '#E91E63',
                    ribbon: '#00BCD4',
                    text: 'Get gift',
                    animation: 'floatRight'
                },
                // Stars (downward/upward movement)
                { 
                    type: 'star', 
                    color: 'radial-gradient(circle, #FFD700, #FFA500)',
                    text: '⭐ Star',
                    animation: 'floatDown'
                },
                { 
                    type: 'star', 
                    color: 'radial-gradient(circle, #C0C0C0, #808080)',
                    text: '✨ Bonus',
                    animation: 'floatUp'
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            const object = document.createElement('div');
            object.className = `floating-object ${objType.type}-object`;
            
            // Get game area bounds
            const gameBounds = getGameAreaBounds();
            
            // Calculate position based on animation type
            let startX, endX, startY, endY;
            
            switch(objType.animation) {
                case 'floatDown':
                    startX = gameBounds.left - 20 + Math.random() * (gameBounds.width + 40);
                    endX = startX + (Math.random() * 60 - 30);
                    object.style.setProperty('--start-x', `${startX}px`);
                    object.style.setProperty('--end-x', `${endX}px`);
                    break;
                    
                case 'floatUp':
                    startX = gameBounds.left - 20 + Math.random() * (gameBounds.width + 40);
                    endX = startX + (Math.random() * 60 - 30);
                    object.style.setProperty('--start-x', `${startX}px`);
                    object.style.setProperty('--end-x', `${endX}px`);
                    break;
                    
                case 'floatLeft':
                    startY = gameBounds.top - 20 + Math.random() * (gameBounds.height + 40);
                    endY = startY + (Math.random() * 60 - 30);
                    object.style.setProperty('--start-y', `${startY}px`);
                    object.style.setProperty('--end-y', `${endY}px`);
                    break;
                    
                case 'floatRight':
                    startY = gameBounds.top - 20 + Math.random() * (gameBounds.height + 40);
                    endY = startY + (Math.random() * 60 - 30);
                    object.style.setProperty('--start-y', `${startY}px`);
                    object.style.setProperty('--end-y', `${endY}px`);
                    break;
            }
            
            // Set position and animation
            object.style.left = '0px';
            object.style.top = '0px';
            object.style.animation = `${objType.animation} ${18 + Math.random() * 12}s linear forwards`;
            
            // Create object content
            if (objType.type === 'balloon') {
                object.style.setProperty('--balloon-color', objType.color);
                
                const balloonDiv = document.createElement('div');
                balloonDiv.className = 'balloon-shape';
                
                const textDiv = document.createElement('div');
                textDiv.className = 'balloon-text';
                textDiv.textContent = objType.text;
                balloonDiv.appendChild(textDiv);
                
                const stringDiv = document.createElement('div');
                stringDiv.className = 'balloon-string';
                
                object.appendChild(balloonDiv);
                object.appendChild(stringDiv);
                
            } else if (objType.type === 'gift') {
                object.style.setProperty('--gift-color', objType.color);
                object.style.setProperty('--ribbon-color', objType.ribbon);
                
                const giftDiv = document.createElement('div');
                giftDiv.className = 'gift-shape';
                
                const ribbonDiv = document.createElement('div');
                ribbonDiv.className = 'gift-ribbon';
                giftDiv.appendChild(ribbonDiv);
                
                const textDiv = document.createElement('div');
                textDiv.className = 'gift-text';
                textDiv.textContent = objType.text;
                
                object.appendChild(giftDiv);
                object.appendChild(textDiv);
                
            } else if (objType.type === 'star') {
                object.style.setProperty('--star-color', objType.color);
                
                const starDiv = document.createElement('div');
                starDiv.className = 'star-shape';
                starDiv.textContent = '★';
                
                const textDiv = document.createElement('div');
                textDiv.className = 'star-text';
                textDiv.textContent = objType.text;
                
                object.appendChild(starDiv);
                object.appendChild(textDiv);
            }
            
            // Click event
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                this.style.transform = 'scale(1.2)';
                this.style.opacity = '0.7';
                
                // Open ad in new tab
                window.open('https://otieu.com/4/10000770', '_blank');
                
                // Remove object
                setTimeout(() => {
                    if (this.parentNode) {
                        this.remove();
                        activeObjects--;
                    }
                }, 300);
            });
            
            // Remove when animation completes
            const animationDuration = parseFloat(object.style.animation.match(/(\d+\.?\d*)s/)[1]) * 1000;
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, animationDuration);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Start floating objects
        function startFloatingObjects() {
            gameStarted = true;
            
            // Initial spawns with delays
            setTimeout(() => createFloatingObject(), 0);
            setTimeout(() => createFloatingObject(), 3000);
            setTimeout(() => createFloatingObject(), 6000);
            
            // Continuous spawning
            objectInterval = setInterval(() => {
                if (gameStarted && activeObjects < MAX_OBJECTS) {
                    createFloatingObject();
                }
            }, SPAWN_INTERVAL_MIN + Math.random() * (SPAWN_INTERVAL_MAX - SPAWN_INTERVAL_MIN));
        }
        
        // Initialize
        function init() {
            console.log('🎮 Sorting Xmas Balls - Loading...');
            
            // Center game frame
            function centerGameFrame() {
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                // Calculate centered position
                const left = Math.max(0, (windowWidth - 800) / 2);
                const top = Math.max(0, (windowHeight - 600) / 2);
                
                gameFrame.style.position = 'absolute';
                gameFrame.style.left = `${left}px`;
                gameFrame.style.top = `${top}px`;
            }
            
            // Center on load and resize
            centerGameFrame();
            window.addEventListener('resize', centerGameFrame);
            
            // Hide loader when game loads
            gameFrame.addEventListener('load', function() {
                console.log('✅ Game Loaded');
                hideLoader();
            });
            
            // Also hide loader after timeout (fallback)
            setTimeout(hideLoader, 5000);
        }
        
        // Event Listeners
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Start everything
        init();
    </script>
</body>
</html>
