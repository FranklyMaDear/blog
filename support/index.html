<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-3186700611266549">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* ===== GAME CONTAINER ===== */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ===== GAME AREA ===== */
        .game-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.5rem;
            color: #4cc9f0;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            color: #b8b8b8;
            font-size: 1rem;
            text-align: center;
            max-width: 300px;
        }
        
        /* ===== BOTTOM AD BAR ===== */
        .bottom-ad-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 10px;
            border-top: 3px solid #4cc9f0;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            transition: transform 0.5s ease;
        }
        
        .ad-label {
            position: absolute;
            top: -25px;
            left: 20px;
            background: #4cc9f0;
            color: white;
            padding: 5px 15px;
            border-radius: 15px 15px 0 0;
            font-size: 0.8rem;
            font-weight: 700;
        }
        
        .ad-content {
            width: 100%;
            max-width: 728px;
            margin: 0 auto;
            text-align: center;
        }
        
        .ad-countdown {
            position: absolute;
            top: -25px;
            right: 20px;
            background: #ff4161;
            color: white;
            padding: 5px 15px;
            border-radius: 15px 15px 0 0;
            font-size: 0.8rem;
            font-weight: 700;
            display: none;
        }
        
        /* ===== RELOAD BUTTON ===== */
        .reload-btn-container {
            position: fixed;
            bottom: 120px;
            right: 20px;
            z-index: 90;
        }
        
        .reload-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 65, 97, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 65, 97, 0.4);
        }
        
        .reload-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 65, 97, 0.6);
            background: rgba(255, 65, 97, 1);
        }
        
        .reload-btn:active {
            transform: scale(0.95);
        }
        
        /* ===== MONETAG AD CONTAINER ===== */
        .monetag-ad-container {
            width: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* ===== AD BAR STATES ===== */
        .bottom-ad-bar.hidden {
            transform: translateY(100%);
        }
        
        .bottom-ad-bar.visible {
            transform: translateY(0);
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .bottom-ad-bar {
                min-height: 80px;
                padding: 8px;
            }
            
            .ad-label {
                top: -20px;
                left: 10px;
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            
            .ad-countdown {
                top: -20px;
                right: 10px;
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            
            .reload-btn-container {
                bottom: 100px;
                right: 15px;
            }
            
            .monetag-ad-container {
                min-height: 70px;
            }
        }
        
        @media (max-width: 480px) {
            .bottom-ad-bar {
                min-height: 60px;
                padding: 5px;
            }
            
            .ad-label {
                top: -18px;
                left: 5px;
                padding: 3px 8px;
                font-size: 0.65rem;
            }
            
            .ad-countdown {
                top: -18px;
                right: 5px;
                padding: 3px 8px;
                font-size: 0.65rem;
            }
            
            .reload-btn-container {
                bottom: 80px;
                right: 10px;
            }
            
            .reload-btn {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
            
            .monetag-ad-container {
                min-height: 50px;
            }
        }
        
        /* ===== UTILITY CLASSES ===== */
        .hidden {
            display: none !important;
        }
        
        .fade-out {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <!-- GAME AREA -->
        <div class="game-area">
            <!-- LOADING SCREEN -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div class="loading-text">Φόρτωση Royal Garden Match 2...</div>
                <div class="loading-subtext">Το παιχνίδι φορτώνεται, παρακαλώ περιμένετε</div>
            </div>
            
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- BOTTOM AD BAR -->
    <div class="bottom-ad-bar hidden" id="bottomAdBar">
        <div class="ad-label">Υποστήριξη</div>
        <div class="ad-countdown" id="adCountdown">Κλείνει σε 10</div>
        <div class="ad-content" id="bottomAdContent">
            <!-- Monetag Ad Container -->
            <div class="monetag-ad-container" id="monetagAdContainer">
                <div style="color: #666; font-size: 0.9rem;">
                    Διαφήμιση φορτώνεται...
                </div>
            </div>
        </div>
    </div>
    
    <!-- RELOAD BUTTON -->
    <div class="reload-btn-container">
        <button class="reload-btn" id="reloadBtn" title="Ανανέωση Παιχνιδιού">
            <i class="fas fa-redo"></i>
        </button>
    </div>

    <script>
        // ===== DOM ELEMENTS =====
        const loadingScreen = document.getElementById('loadingScreen');
        const gameFrame = document.getElementById('gameFrame');
        const bottomAdBar = document.getElementById('bottomAdBar');
        const bottomAdContent = document.getElementById('bottomAdContent');
        const monetagAdContainer = document.getElementById('monetagAdContainer');
        const adCountdown = document.getElementById('adCountdown');
        const reloadBtn = document.getElementById('reloadBtn');
        
        // ===== GAME STATE =====
        let gameLoaded = false;
        let isAdShowing = false;
        let adInterval = null;
        let adTimer = null;
        let adDisplayDuration = 10000; // 10 seconds in milliseconds
        
        // ===== MONETAG SCRIPT =====
        function loadMonetagScript() {
            try {
                // Create and load Monetag script
                const script = document.createElement('script');
                script.dataset.zone = '10274195';
                script.src = 'https://al5sm.com/tag.min.js';
                script.async = true;
                
                script.onload = function() {
                    console.log('✅ Monetag script loaded successfully');
                    showAdBar();
                };
                
                script.onerror = function() {
                    console.log('⚠️ Monetag script failed to load');
                    // Try alternative loading method
                    setTimeout(() => {
                        try {
                            (function(s){
                                s.dataset.zone='10274195',
                                s.src='https://al5sm.com/tag.min.js'
                            })([document.documentElement, document.body]
                                .filter(Boolean).pop()
                                .appendChild(document.createElement('script')));
                        } catch(e) {
                            console.log('❌ Both Monetag loading methods failed');
                        }
                    }, 1000);
                };
                
                monetagAdContainer.appendChild(script);
            } catch(e) {
                console.log('❌ Error loading Monetag:', e);
            }
        }
        
        // ===== AD BAR FUNCTIONS =====
        function showAdBar() {
            if (!isAdShowing) {
                isAdShowing = true;
                bottomAdBar.classList.remove('hidden');
                bottomAdBar.classList.add('visible');
                
                // Start countdown timer
                startAdCountdown();
                
                // Auto-hide after duration
                adTimer = setTimeout(() => {
                    hideAdBar();
                }, adDisplayDuration);
            }
        }
        
        function hideAdBar() {
            if (isAdShowing) {
                isAdShowing = false;
                bottomAdBar.classList.remove('visible');
                bottomAdBar.classList.add('hidden');
                
                // Clear timers
                clearTimeout(adTimer);
                adCountdown.style.display = 'none';
                
                // Schedule next ad
                scheduleNextAd();
            }
        }
        
        function startAdCountdown() {
            let secondsLeft = adDisplayDuration / 1000;
            adCountdown.style.display = 'block';
            adCountdown.textContent = `Κλείνει σε ${secondsLeft}`;
            
            const countdownInterval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    adCountdown.style.display = 'none';
                } else {
                    adCountdown.textContent = `Κλείνει σε ${secondsLeft}`;
                }
            }, 1000);
        }
        
        function scheduleNextAd() {
            // Random interval between ads: 2-5 minutes
            const nextAdDelay = Math.floor(Math.random() * (300000 - 120000 + 1)) + 120000;
            
            console.log(`⏰ Next ad scheduled in ${Math.round(nextAdDelay/1000)} seconds`);
            
            adInterval = setTimeout(() => {
                if (gameLoaded && !isAdShowing) {
                    loadMonetagScript();
                }
            }, nextAdDelay);
        }
        
        // ===== GAME EVENT HANDLERS =====
        function simulateLevelCompletion() {
            // This function simulates level completion
            // In a real scenario, you would integrate this with the game's actual events
            console.log('🎮 Level completed - showing ad');
            if (!isAdShowing) {
                loadMonetagScript();
            }
        }
        
        // ===== INITIALIZE GAME =====
        function initGame() {
            console.log('🎮 Royal Garden Match 2 - Initializing...');
            
            // Show bottom ad bar after initial delay
            setTimeout(() => {
                loadMonetagScript();
            }, 3000);
            
            // Schedule periodic ads
            scheduleNextAd();
            
            // Simulate level completions (for demo purposes)
            // Remove this in production and integrate with actual game events
            setInterval(() => {
                simulateLevelCompletion();
            }, 60000); // Simulate level completion every minute
            
            gameLoaded = true;
        }
        
        // ===== EVENT LISTENERS =====
        
        // Game loaded
        gameFrame.addEventListener('load', function() {
            console.log('✅ Game loaded successfully');
            
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    initGame();
                }, 500);
            }, 2000);
        });
        
        // Game error
        gameFrame.addEventListener('error', function() {
            console.log('❌ Game failed to load');
            loadingScreen.innerHTML = `
                <div style="text-align: center; padding: 20px; max-width: 400px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff4161; margin-bottom: 20px;"></i>
                    <div style="color: #ff4161; font-size: 1.3rem; font-weight: 700; margin-bottom: 20px;">
                        Σφάλμα φόρτωσης
                    </div>
                    <div style="margin-bottom: 25px; color: #b8b8b8;">
                        Το παιχνίδι δεν μπορεί να φορτωθεί. Δοκιμάστε ξανά.
                    </div>
                    <button class="reload-btn" onclick="location.reload()" 
                            style="background: #ff4161; width: auto; padding: 10px 20px; border-radius: 25px;">
                        <i class="fas fa-sync-alt"></i> Ανανέωση Σελίδας
                    </button>
                </div>
            `;
        });
        
        // Reload game button
        reloadBtn.addEventListener('click', function() {
            // Hide ad bar if showing
            if (isAdShowing) {
                hideAdBar();
            }
            
            loadingScreen.classList.remove('hidden');
            loadingScreen.style.opacity = '1';
            
            // Reset game
            gameFrame.src = gameFrame.src;
            
            // Button animation
            reloadBtn.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                reloadBtn.style.transform = '';
            }, 300);
        });
        
        // Close ad bar on click (optional user control)
        bottomAdBar.addEventListener('click', function(e) {
            if (e.target.classList.contains('ad-label') || e.target.classList.contains('ad-countdown')) {
                hideAdBar();
            }
        });
        
        // Initial console message
        console.log('🎮 ================================');
        console.log('🎮 ROYAL GARDEN MATCH 2');
        console.log('🎮 Monetag ads with timed intervals');
        console.log('🎮 ================================');
        
        // Auto-hide loading screen after timeout
        setTimeout(() => {
            if (!loadingScreen.classList.contains('hidden')) {
                loadingScreen.classList.add('hidden');
                initGame();
            }
        }, 8000);
    </script>
</body>
</html>
