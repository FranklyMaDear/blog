<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorting Xmas Balls - Christmas Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #0a1929;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader with Christmas theme */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1929 0%, #1a3b5a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .loader-subtitle {
            color: #FFD700;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .loader-dots {
            display: flex;
            gap: 12px;
        }
        
        .dot {
            width: 14px;
            height: 14px;
            background: #FF5252;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { background: #4CAF50; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); }
            40% { transform: scale(1.2); }
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Christmas Ball Objects */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            z-index: 51;
            opacity: 0.9;
            will-change: transform, opacity;
        }
        
        .floating-object:active {
            transform: scale(1.25) !important;
            opacity: 1;
        }
        
        /* Christmas Ball Base */
        .christmas-ball {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.4),
                inset 0 -10px 20px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Ball Top Hook */
        .ball-hook {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 15px;
            background: #FFD700;
            border-radius: 4px 4px 0 0;
            z-index: 2;
        }
        
        /* Ball Patterns */
        .ball-pattern {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pattern-stripe {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.4);
            position: absolute;
        }
        
        .pattern-stripe:nth-child(1) { transform: rotate(0deg); }
        .pattern-stripe:nth-child(2) { transform: rotate(45deg); }
        .pattern-stripe:nth-child(3) { transform: rotate(90deg); }
        .pattern-stripe:nth-child(4) { transform: rotate(135deg); }
        
        /* Ball Center Decor */
        .ball-center {
            width: 15px;
            height: 15px;
            background: #FFD700;
            border-radius: 50%;
            position: absolute;
            z-index: 1;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkleTwinkle 2s infinite;
        }
        
        .sparkle:nth-child(1) { top: 10px; left: 10px; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 10px; right: 10px; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 10px; left: 10px; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 10px; right: 10px; animation-delay: 1.5s; }
        
        /* Christmas Star */
        .christmas-star {
            width: 50px;
            height: 50px;
            background: #FFD700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            position: relative;
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.6),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        /* Gift Box */
        .christmas-gift {
            width: 50px;
            height: 50px;
            background: #FF5252;
            position: relative;
            border-radius: 8px;
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.3),
                inset 0 -5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .gift-ribbon {
            position: absolute;
            width: 100%;
            height: 12px;
            background: #4CAF50;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        
        .gift-ribbon:before {
            content: '';
            position: absolute;
            width: 12px;
            height: 100%;
            background: #4CAF50;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Animations */
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        @keyframes ballGlow {
            0%, 100% { 
                box-shadow: 
                    0 6px 15px rgba(0, 0, 0, 0.4),
                    inset 0 -10px 20px rgba(0, 0, 0, 0.2),
                    0 0 0px rgba(255, 255, 255, 0);
            }
            50% { 
                box-shadow: 
                    0 6px 15px rgba(0, 0, 0, 0.4),
                    inset 0 -10px 20px rgba(0, 0, 0, 0.2),
                    0 0 15px rgba(255, 255, 255, 0.6);
            }
        }
        
        @keyframes floatSlow {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) rotate(10deg);
            }
            50% {
                transform: translateY(-40px) rotate(0deg);
            }
            75% {
                transform: translateY(-20px) rotate(-10deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }
        
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .christmas-ball {
                width: 50px;
                height: 50px;
            }
            
            .christmas-star, .christmas-gift {
                width: 45px;
                height: 45px;
            }
            
            .loader-text {
                font-size: 28px;
            }
            
            .loader-subtitle {
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .christmas-ball {
                width: 45px;
                height: 45px;
            }
            
            .christmas-star, .christmas-gift {
                width: 40px;
                height: 40px;
            }
            
            .loader-text {
                font-size: 24px;
                margin-bottom: 20px;
            }
            
            .loader-subtitle {
                font-size: 14px;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/a508edbaeb1d4213aecebbe4115670c2/?gd_sdk_referrer_url=https://gamedistribution.com/games/sorting-xmas-balls/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">🎄 Sorting Xmas Balls 🎄</div>
        <div class="loader-subtitle">Loading Christmas Adventure...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Objects Container -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameLoaded = false;
        let objectsStarted = false;
        let activeObjects = 0;
        const MAX_OBJECTS = 4;
        let objectInterval;
        
        // Configuration
        const OBJECT_START_DELAY = 90000; // 1.5 λεπτά = 90 δευτερόλεπτα
        
        // Initialize - Fixed for all browsers
        function init() {
            console.log('🎄 Initializing Christmas game...');
            
            // Set game to full screen for all browsers
            setupFullScreenGame();
            
            // For browsers that don't trigger load event properly
            const loadGame = () => {
                if (!gameLoaded) {
                    gameLoaded = true;
                    console.log('✅ Game ready');
                    
                    // Hide loader after 2 seconds
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                            
                            // Start objects after 1.5 minutes
                            console.log(`⏰ Christmas balls will appear in ${OBJECT_START_DELAY/1000} seconds`);
                            setTimeout(startFloatingObjects, OBJECT_START_DELAY);
                        }, 500);
                    }, 2000);
                }
            };
            
            // Multiple load detection methods
            gameFrame.addEventListener('load', loadGame);
            
            // Fallback for browsers that don't fire load event
            setTimeout(loadGame, 3000);
            
            // Additional fallback
            gameFrame.addEventListener('error', () => {
                console.log('⚠️ Game load error, using fallback');
                loadGame();
            });
        }
        
        // Setup full screen game for all browsers
        function setupFullScreenGame() {
            // Ensure game takes full screen
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
            };
            
            updateSize();
            
            // Handle orientation changes and resize
            window.addEventListener('resize', updateSize);
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 100);
            });
        }
        
        // Create Christmas floating object
        function createChristmasObject() {
            if (activeObjects >= MAX_OBJECTS || !objectsStarted) return;
            
            const objectTypes = [
                {
                    type: 'ball',
                    color: 'radial-gradient(circle at 30% 30%, #ff3333, #cc0000)',
                    animation: 'floatDown',
                    duration: 20 + Math.random() * 15
                },
                {
                    type: 'ball',
                    color: 'radial-gradient(circle at 30% 30%, #4CAF50, #2E7D32)',
                    animation: 'floatUp',
                    duration: 22 + Math.random() * 12
                },
                {
                    type: 'ball',
                    color: 'radial-gradient(circle at 30% 30%, #2196F3, #1976D2)',
                    animation: 'floatDown',
                    duration: 18 + Math.random() * 14
                },
                {
                    type: 'ball',
                    color: 'radial-gradient(circle at 30% 30%, #FFD700, #FFA500)',
                    animation: 'floatUp',
                    duration: 16 + Math.random() * 16
                },
                {
                    type: 'star',
                    animation: 'floatDown',
                    duration: 24 + Math.random() * 10
                },
                {
                    type: 'gift',
                    animation: 'floatUp',
                    duration: 21 + Math.random() * 13
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            const object = document.createElement('div');
            object.className = 'floating-object';
            
            // Create object content based on type
            if (objType.type === 'ball') {
                const ball = document.createElement('div');
                ball.className = 'christmas-ball';
                ball.style.background = objType.color;
                ball.style.animation = 'ballGlow 3s infinite alternate, floatSlow 4s infinite ease-in-out';
                
                // Add hook
                const hook = document.createElement('div');
                hook.className = 'ball-hook';
                ball.appendChild(hook);
                
                // Add pattern
                const pattern = document.createElement('div');
                pattern.className = 'ball-pattern';
                for (let i = 0; i < 4; i++) {
                    const stripe = document.createElement('div');
                    stripe.className = 'pattern-stripe';
                    pattern.appendChild(stripe);
                }
                ball.appendChild(pattern);
                
                // Add center
                const center = document.createElement('div');
                center.className = 'ball-center';
                ball.appendChild(center);
                
                // Add sparkles
                for (let i = 0; i < 4; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    ball.appendChild(sparkle);
                }
                
                object.appendChild(ball);
                
            } else if (objType.type === 'star') {
                const star = document.createElement('div');
                star.className = 'christmas-star';
                star.style.animation = 'floatSlow 3s infinite ease-in-out';
                object.appendChild(star);
                
            } else if (objType.type === 'gift') {
                const gift = document.createElement('div');
                gift.className = 'christmas-gift';
                gift.style.animation = 'floatSlow 3.5s infinite ease-in-out';
                object.appendChild(gift);
                
                const ribbon = document.createElement('div');
                ribbon.className = 'gift-ribbon';
                gift.appendChild(ribbon);
            }
            
            // Set position and float animation
            const startX = Math.random() * window.innerWidth;
            const endX = startX + (Math.random() * 100 - 50);
            
            object.style.setProperty('--start-x', `${startX}px`);
            object.style.setProperty('--end-x', `${endX}px`);
            object.style.animation = `${objType.animation} ${objType.duration}s linear forwards`;
            object.style.left = '0px';
            object.style.top = '0px';
            
            // Click event
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                object.style.transform = 'scale(1.3)';
                object.style.opacity = '0.7';
                
                // Open ad in new tab
                setTimeout(() => {
                    window.open('https://otieu.com/4/10000770', '_blank');
                }, 100);
                
                // Remove object
                setTimeout(() => {
                    if (object.parentNode) {
                        object.remove();
                        activeObjects--;
                    }
                }, 300);
            };
            
            object.addEventListener('click', handleClick);
            object.addEventListener('touchstart', handleClick, { passive: false });
            
            // Touch feedback
            object.addEventListener('touchstart', function() {
                this.style.transform = 'scale(1.15)';
            }, { passive: true });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, objType.duration * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Start floating objects after 1.5 minutes
        function startFloatingObjects() {
            if (objectsStarted) return;
            
            objectsStarted = true;
            console.log('🎄 Starting Christmas balls and objects...');
            
            // Initial objects
            setTimeout(() => createChristmasObject(), 0);
            setTimeout(() => createChristmasObject(), 1500);
            setTimeout(() => createChristmasObject(), 3000);
            
            // Continuous spawn every 8-12 seconds
            objectInterval = setInterval(() => {
                if (objectsStarted && activeObjects < MAX_OBJECTS) {
                    createChristmasObject();
                }
            }, 8000 + Math.random() * 4000);
        }
        
        // Start everything when page loads
        document.addEventListener('DOMContentLoaded', init);
        
        // Fallback for browsers that don't fire DOMContentLoaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Prevent context menu on objects
        document.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.floating-object')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
