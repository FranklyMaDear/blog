<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capybara Xmas Merge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #2c3e50;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #2c3e50;
        }
        
        .game-header {
            background: #e74c3c;
            padding: 8px 12px;
            text-align: center;
            border-bottom: 3px solid #f1c40f;
            flex-shrink: 0;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .game-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-bottom: 3px;
        }
        
        .game-subtitle {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
        }
        
        .main-game-area {
            flex: 1;
            background: #34495e;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #2c3e50;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(241, 196, 15, 0.3);
            border-radius: 50%;
            border-top-color: #f1c40f;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #f1c40f;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .game-footer {
            background: #e74c3c;
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 3px solid #f1c40f;
            flex-shrink: 0;
            height: 70px;
        }
        
        .game-btn {
            padding: 8px 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 0 #219653;
            min-width: 100px;
        }
        
        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #219653;
        }
        
        .game-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #219653;
        }
        
        .reload-btn {
            background: #e67e22;
            box-shadow: 0 3px 0 #d35400;
        }
        
        .reload-btn:hover {
            box-shadow: 0 4px 0 #d35400;
        }
        
        .sound-btn {
            background: #3498db;
            box-shadow: 0 3px 0 #2980b9;
        }
        
        .sound-btn:hover {
            box-shadow: 0 4px 0 #2980b9;
        }
        
        /* Ad Container */
        .ad-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid #f1c40f;
            display: none;
            animation: slideInUp 0.5s ease;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        
        .ad-title {
            color: #2c3e50;
            font-size: 0.9rem;
            font-weight: 700;
        }
        
        .close-ad-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .close-ad-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }
        
        #al5smAd {
            min-width: 300px;
            min-height: 250px;
            background: #f8f9fa;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ad-timer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #f1c40f;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 99;
            display: none;
            border: 2px solid #f1c40f;
        }
        
        /* Ad Blocker Warning */
        .adblock-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.95);
            color: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            z-index: 1001;
            display: none;
            text-align: center;
            border: 4px solid #f1c40f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .warning-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 15px;
        }
        
        .warning-text {
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .warning-btn {
            padding: 10px 25px;
            background: #f1c40f;
            color: #2c3e50;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .warning-btn:hover {
            background: #f39c12;
            transform: scale(1.05);
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .game-header {
                padding: 6px 10px;
                height: 60px;
            }
            
            .game-title {
                font-size: 1.1rem;
            }
            
            .game-subtitle {
                font-size: 0.7rem;
            }
            
            .game-footer {
                padding: 8px 12px;
                height: 60px;
            }
            
            .game-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
                min-width: 80px;
            }
            
            .ad-container {
                right: 10px;
                bottom: 70px;
                padding: 8px;
            }
            
            #al5smAd {
                min-width: 250px;
                min-height: 200px;
            }
        }
        
        @media (max-width: 480px) {
            .game-header {
                height: 55px;
                padding: 5px 8px;
            }
            
            .game-title {
                font-size: 1rem;
                margin-bottom: 2px;
            }
            
            .game-subtitle {
                font-size: 0.65rem;
            }
            
            .game-footer {
                height: 55px;
                padding: 6px 10px;
                gap: 8px;
            }
            
            .game-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
                min-width: 70px;
                gap: 4px;
            }
            
            .ad-container {
                display: none !important;
            }
            
            .ad-timer {
                bottom: 10px;
                right: 10px;
                font-size: 0.8rem;
                padding: 6px 12px;
            }
        }
        
        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .game-btn:hover, .warning-btn:hover {
                transform: none;
            }
            
            .game-btn:active, .warning-btn:active {
                transform: scale(0.96);
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main Game Container -->
    <div class="game-container">
        <!-- Game Header -->
        <div class="game-header">
            <div class="game-title">Capybara Xmas Merge</div>
            <div class="game-subtitle">Χριστουγεννιάτικο παιχνίδι Συγχώνευσης με Καπιβάρα!</div>
        </div>
        
        <!-- Main Game Area -->
        <div class="main-game-area">
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div class="loading-text">Φόρτωση Capybara Xmas Merge...</div>
            </div>
            
            <iframe 
                src="https://html5.gamedistribution.com/1a09e82198a8432da4f0a9c103187f7e/?gd_sdk_referrer_url=https://gamedistribution.com/games/capybara-xmas-merge" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay"
                allowfullscreen>
            </iframe>
        </div>
        
        <!-- Game Footer -->
        <div class="game-footer">
            <button class="game-btn reload-btn" id="reloadBtn">
                <i class="fas fa-redo-alt"></i> Ανανέωση
            </button>
            <button class="game-btn sound-btn" id="soundBtn">
                <i class="fas fa-volume-up"></i> Ήχος
            </button>
        </div>
        
        <!-- Next Ad Timer -->
        <div class="ad-timer" id="adTimer">
            Επόμενη διαφήμιση: <span id="timerDisplay">03:00</span>
        </div>
    </div>
    
    <!-- Floating Ad Container -->
    <div class="ad-container" id="floatingAd">
        <div class="ad-header">
            <div class="ad-title">Διαφήμιση</div>
            <button class="close-ad-btn" id="closeFloatingAd">×</button>
        </div>
        <div id="al5smAd">
            <!-- Al5sm ad will load here -->
            <div style="text-align: center; padding: 20px; color: #666;">
                <i class="fas fa-ad" style="font-size: 2rem; color: #3498db; margin-bottom: 10px;"></i>
                <div>Διαφήμιση φόρτωσης...</div>
            </div>
        </div>
    </div>
    
    <!-- Ad Blocker Warning -->
    <div class="adblock-warning" id="adblockWarning">
        <div class="warning-title">⚠️ AdBlocker Ανιχνεύθηκε</div>
        <div class="warning-text">
            Παρακαλώ απενεργοποιήστε το AdBlocker για να συνεχίσετε.<br>
            Οι διαφημίσεις υποστηρίζουν το δωρεάν παιχνίδι.
        </div>
        <button class="warning-btn" id="continueBtn">Συνέχεια</button>
    </div>

    <!-- Νέο Al5sm Ad Script με Zone 10274195 -->
    <script>
        (function(s){
            s.dataset.zone='10274195',
            s.src='https://al5sm.com/tag.min.js'
        })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gameFrame = document.getElementById('gameFrame');
            const loadingScreen = document.getElementById('loadingScreen');
            const reloadBtn = document.getElementById('reloadBtn');
            const soundBtn = document.getElementById('soundBtn');
            const floatingAd = document.getElementById('floatingAd');
            const closeFloatingAd = document.getElementById('closeFloatingAd');
            const adTimer = document.getElementById('adTimer');
            const timerDisplay = document.getElementById('timerDisplay');
            const adblockWarning = document.getElementById('adblockWarning');
            const continueBtn = document.getElementById('continueBtn');
            const al5smAdContainer = document.getElementById('al5smAd');
            
            // Game state
            let soundEnabled = true;
            let adInterval = 180; // 3 minutes in seconds
            let adIntervalId;
            let isAdShowing = false;
            
            // Initialize game
            function initGame() {
                // Start ad timer
                startAdTimer();
                
                // Show floating ad after 60 seconds
                setTimeout(() => {
                    showFloatingAd();
                }, 60000);
            }
            
            // Start ad countdown timer
            function startAdTimer() {
                adInterval = 180; // 3 minutes
                updateTimerDisplay();
                adTimer.style.display = 'block';
                
                adIntervalId = setInterval(() => {
                    adInterval--;
                    updateTimerDisplay();
                    
                    if (adInterval <= 0 && !isAdShowing) {
                        showFullscreenAd();
                        adInterval = 180; // Reset to 3 minutes
                    }
                }, 1000);
            }
            
            // Update timer display
            function updateTimerDisplay() {
                const minutes = Math.floor(adInterval / 60);
                const seconds = adInterval % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            
            // Show floating ad
            function showFloatingAd() {
                if (window.innerWidth > 480 && !isAdShowing) { // Only show on larger screens
                    isAdShowing = true;
                    
                    // Create Al5sm ad container
                    createAl5smAd();
                    
                    floatingAd.style.display = 'block';
                    
                    // Auto-hide after 30 seconds
                    setTimeout(() => {
                        closeFloatingAdFunc();
                    }, 30000);
                }
            }
            
            // Show fullscreen ad
            function showFullscreenAd() {
                isAdShowing = true;
                
                // Pause game timer
                clearInterval(adIntervalId);
                adTimer.style.display = 'none';
                
                // Show floating ad as fullscreen
                floatingAd.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    width: 90%;
                    max-width: 500px;
                    max-height: 80vh;
                    z-index: 1000;
                    display: block;
                    animation: popIn 0.5s ease;
                `;
                
                // Create larger Al5sm ad
                createAl5smAd('large');
                
                // Auto-close after 30 seconds
                setTimeout(() => {
                    closeFullscreenAd();
                }, 30000);
                
                // Check for ad blocker
                setTimeout(checkAdBlocker, 2000);
            }
            
            // Create Al5sm ad
            function createAl5smAd(size = 'small') {
                // Clear container
                al5smAdContainer.innerHTML = '';
                
                // Create ad placeholder
                const placeholder = document.createElement('div');
                placeholder.style.cssText = `
                    width: 100%;
                    height: ${size === 'large' ? '400px' : '250px'};
                    background: #f8f9fa;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    color: #666;
                `;
                
                placeholder.innerHTML = `
                    <i class="fas fa-ad" style="font-size: ${size === 'large' ? '3rem' : '2rem'}; color: #3498db; margin-bottom: 15px;"></i>
                    <div style="font-size: ${size === 'large' ? '1.2rem' : '1rem'}; margin-bottom: 10px;">Al5sm Διαφήμιση (Zone: 10274195)</div>
                    <div style="font-size: 0.9rem; text-align: center; padding: 0 20px;">
                        Αυτή η διαφήμιση υποστηρίζει το δωρεάν παιχνίδι
                    </div>
                `;
                
                al5smAdContainer.appendChild(placeholder);
                
                // Try to load Al5sm ad dynamically
                setTimeout(() => {
                    if (typeof window.al5sm !== 'undefined') {
                        console.log('Al5sm script loaded successfully (Zone: 10274195)');
                    } else {
                        console.log('Al5sm script not loaded, showing fallback');
                        showAdBlockWarning();
                    }
                }, 1000);
            }
            
            // Check for ad blocker
            function checkAdBlocker() {
                const adContainer = document.getElementById('al5smAd');
                if (adContainer && (adContainer.offsetHeight < 50 || adContainer.innerHTML.includes('Al5sm Διαφήμιση'))) {
                    // Possible ad blocker
                    showAdBlockWarning();
                }
            }
            
            // Show ad blocker warning
            function showAdBlockWarning() {
                adblockWarning.style.display = 'block';
            }
            
            // Close floating ad
            function closeFloatingAdFunc() {
                floatingAd.style.display = 'none';
                isAdShowing = false;
            }
            
            // Close fullscreen ad
            function closeFullscreenAd() {
                // Reset floating ad position
                floatingAd.style.cssText = `
                    position: fixed;
                    bottom: 80px;
                    right: 20px;
                    z-index: 100;
                    background: rgba(255, 255, 255, 0.95);
                    border-radius: 10px;
                    padding: 10px;
                    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
                    border: 3px solid #f1c40f;
                    display: none;
                `;
                
                floatingAd.style.display = 'none';
                isAdShowing = false;
                
                // Hide ad blocker warning
                adblockWarning.style.display = 'none';
                
                // Restart ad timer
                startAdTimer();
                
                // Show notification
                showNotification('Διαφήμιση ολοκληρώθηκε');
            }
            
            // Show notification
            function showNotification(message) {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: linear-gradient(to right, #2ecc71, #27ae60);
                    color: white;
                    padding: 15px 25px;
                    border-radius: 10px;
                    font-size: 1rem;
                    font-weight: 700;
                    z-index: 1001;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    animation: slideInRight 0.5s ease, fadeOut 0.5s ease 2.5s;
                `;
                
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes slideInRight {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                    @keyframes fadeOut {
                        to { opacity: 0; }
                    }
                    @keyframes popIn {
                        from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
                        to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    }
                `;
                document.head.appendChild(style);
                
                notification.innerHTML = `✅ ${message}`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    if (notification.parentNode) {
                        document.body.removeChild(notification);
                    }
                }, 3000);
            }
            
            // Event Listeners
            
            // Game loaded
            gameFrame.addEventListener('load', function() {
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        // Initialize game after loading
                        initGame();
                    }, 300);
                }, 1500);
            });
            
            // Reload game
            reloadBtn.addEventListener('click', function() {
                loadingScreen.style.display = 'flex';
                loadingScreen.style.opacity = '1';
                
                // Reset ad system
                clearInterval(adIntervalId);
                floatingAd.style.display = 'none';
                adblockWarning.style.display = 'none';
                adTimer.style.display = 'none';
                isAdShowing = false;
                
                setTimeout(() => {
                    gameFrame.src = gameFrame.src;
                }, 300);
                
                // Animation
                reloadBtn.style.transform = 'rotate(180deg)';
                setTimeout(() => {
                    reloadBtn.style.transform = '';
                }, 300);
            });
            
            // Sound toggle
            soundBtn.addEventListener('click', function() {
                soundEnabled = !soundEnabled;
                
                if (soundEnabled) {
                    soundBtn.innerHTML = '<i class="fas fa-volume-up"></i> Ήχος';
                    soundBtn.style.background = '#3498db';
                } else {
                    soundBtn.innerHTML = '<i class="fas fa-volume-mute"></i> Ήχος';
                    soundBtn.style.background = '#7f8c8d';
                }
                
                // Animation
                soundBtn.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    soundBtn.style.transform = '';
                }, 200);
            });
            
            // Close floating ad
            closeFloatingAd.addEventListener('click', function() {
                closeFloatingAdFunc();
            });
            
            // Continue button for ad blocker warning
            continueBtn.addEventListener('click', function() {
                adblockWarning.style.display = 'none';
                closeFullscreenAd();
            });
            
            // Error handling
            gameFrame.addEventListener('error', function() {
                loadingScreen.innerHTML = `
                    <div style="text-align: center; padding: 20px; max-width: 400px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #f1c40f; margin-bottom: 15px;"></i>
                        <div style="color: #f1c40f; font-size: 1.2rem; font-weight: 700; margin-bottom: 20px;">
                            Σφάλμα φόρτωσης
                        </div>
                        <button class="game-btn" onclick="location.reload()" style="background: #e67e22;">
                            <i class="fas fa-sync-alt"></i> Ανανέωση
                        </button>
                    </div>
                `;
            });
            
            // Console message
            console.log("🎮 Capybara Xmas Merge με Al5sm Ads (Νέα Zone: 10274195)");
        });
    </script>
</body>
</html>
