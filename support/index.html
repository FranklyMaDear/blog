<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        /* Bottom Popup Banner */
        .bottom-popup {
            position: fixed;
            bottom: -120px;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #1a5fb4 0%, #26a269 50%, #1a5fb4 100%);
            color: white;
            padding: 15px 20px;
            z-index: 90;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
            border-top: 4px solid #ffcc00;
            transition: bottom 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            text-align: center;
        }
        
        .bottom-popup.show {
            bottom: 0;
        }
        
        .popup-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            gap: 15px;
        }
        
        .popup-icon {
            background: #ffcc00;
            color: #1a5fb4;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            flex-shrink: 0;
            animation: gentleBounce 2s infinite;
        }
        
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .popup-text {
            flex: 1;
            text-align: center;
        }
        
        .popup-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .popup-subtitle {
            font-size: 14px;
            color: #ffcc00;
            font-weight: 500;
        }
        
        .popup-button {
            background: linear-gradient(90deg, #ff4161, #ff8c00);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(255, 65, 97, 0.3);
        }
        
        .popup-button:hover:not(:disabled) {
            background: linear-gradient(90deg, #ff2a4d, #ff7700);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 65, 97, 0.4);
        }
        
        .popup-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .close-popup {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        
        .close-popup:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Floating Objects */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            z-index: 81;
            animation: floatPath 35s linear infinite;
        }
        
        .floating-object:hover {
            transform: scale(1.4);
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
        }
        
        @keyframes floatPath {
            0% {
                transform: translateY(100vh) translateX(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Balloon Objects */
        .balloon {
            width: 50px;
            height: 62px;
            background: radial-gradient(circle at 30% 30%, var(--balloon-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
        }
        
        .balloon:before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 25px;
            background: #666;
        }
        
        .balloon:after {
            content: '🎯';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
        }
        
        /* Object Glow Effect */
        .object-glow {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: inherit;
            border-radius: inherit;
            filter: blur(8px);
            opacity: 0.3;
            z-index: -1;
        }
        
        /* Cooldown Indicator */
        .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: inherit;
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }
        
        .hidden {
            display: none;
        }
        
        /* Ad Blocker Warning */
        .ad-block-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 65, 97, 0.95);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 9999;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- LOADING SCREEN -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div>Φόρτωση Royal Garden Match 2...</div>
            </div>
            
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- BOTTOM POPUP BANNER -->
    <div class="bottom-popup" id="bottomPopup">
        <div class="popup-content">
            <div class="popup-icon">!</div>
            <div class="popup-text">
                <div class="popup-title">🎮 Υποστηρίξτε το Παιχνίδι</div>
                <div class="popup-subtitle">Κάθε διαφήμιση βοηθάει να παραμείνει δωρεάν</div>
            </div>
            <button class="popup-button" id="popupButton">Προβολή Διαφήμισης</button>
            <button class="close-popup" id="closePopup">×</button>
        </div>
    </div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>
    
    <!-- AD BLOCKER WARNING -->
    <div class="ad-block-warning" id="adBlockWarning">
        <div style="font-size: 18px; margin-bottom: 10px; font-weight: bold;">⚠️ Προσοχή!</div>
        <div style="margin-bottom: 15px;">Φαίνεται να έχετε ad blocker. Παρακαλώ απενεργοποιήστε το για να υποστηρίξετε το παιχνίδι.</div>
        <button onclick="document.getElementById('adBlockWarning').style.display='none'" 
                style="background: white; color: #ff4161; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold;">
            Κατάλαβα
        </button>
    </div>

    <script>
        // DOM Elements
        const loadingScreen = document.getElementById('loadingScreen');
        const gameFrame = document.getElementById('gameFrame');
        const bottomPopup = document.getElementById('bottomPopup');
        const closePopup = document.getElementById('closePopup');
        const popupButton = document.getElementById('popupButton');
        const floatingObjects = document.getElementById('floatingObjects');
        const adBlockWarning = document.getElementById('adBlockWarning');
        
        // Game State - FIX FOR DUPLICATE ADS
        let gameLoaded = false;
        let popupTimeout;
        let floatingInterval;
        let adScriptLoaded = false;
        let isAdShowing = false;
        let lastAdTime = 0;
        const AD_COOLDOWN = 30000; // 30 seconds cooldown between ads
        let activeObjects = 0;
        const MAX_OBJECTS = 2;
        
        // Load your ad script - SINGLE INSTANCE
        function loadAdScript() {
            if (adScriptLoaded) {
                console.log('📢 Script already loaded, skipping');
                return;
            }
            
            console.log('📢 Φόρτωση διαφημιστικού script...');
            
            // Remove any existing script first
            const existingScript = document.querySelector('script[src*="quge5.com"]');
            if (existingScript) {
                existingScript.remove();
                console.log('🗑️ Αφαίρεση παλιού script');
            }
            
            // Create new script element
            const adScript = document.createElement('script');
            adScript.src = 'https://quge5.com/88/tag.min.js';
            adScript.setAttribute('data-zone', '182432');
            adScript.setAttribute('data-cfasync', 'false');
            adScript.async = true;
            adScript.defer = true;
            
            // Add unique ID to track
            adScript.id = 'monetag-script-' + Date.now();
            
            adScript.onload = function() {
                console.log('✅ Διαφημιστικό script φορτώθηκε');
                adScriptLoaded = true;
                
                // Small delay before showing ads
                setTimeout(() => {
                    console.log('⏳ Script ready for ads');
                }, 1000);
            };
            
            adScript.onerror = function() {
                console.log('❌ Σφάλμα φόρτωσης script');
                adScriptLoaded = false;
            };
            
            // Append to body (not head) for better compatibility
            document.body.appendChild(adScript);
        }
        
        // Check if ad blocker is active
        function checkAdBlocker() {
            const testAd = document.createElement('div');
            testAd.className = 'adsbox';
            testAd.style.cssText = 'position: absolute; top: -1000px; left: -1000px; height: 1px; width: 1px;';
            document.body.appendChild(testAd);
            
            setTimeout(() => {
                const isBlocked = testAd.offsetHeight === 0 || 
                                 testAd.offsetWidth === 0 || 
                                 testAd.style.display === 'none';
                
                if (isBlocked) {
                    console.log('🛡️ Ad blocker detected');
                    adBlockWarning.style.display = 'block';
                }
                
                testAd.remove();
            }, 100);
        }
        
        // Open ad with cooldown protection
        function openAd() {
            const now = Date.now();
            const timeSinceLastAd = now - lastAdTime;
            
            // Check cooldown
            if (timeSinceLastAd < AD_COOLDOWN) {
                const remainingSeconds = Math.ceil((AD_COOLDOWN - timeSinceLastAd) / 1000);
                showTempMessage(`⏳ Παρακαλώ περιμένετε ${remainingSeconds} δευτερόλεπτα`);
                return false;
            }
            
            // Check if ad is already showing
            if (isAdShowing) {
                console.log('⚠️ Ad already showing, skipping');
                showTempMessage('📢 Διαφήμιση ήδη εμφανίζεται');
                return false;
            }
            
            console.log('🎯 Άνοιγμα διαφήμισης');
            isAdShowing = true;
            lastAdTime = now;
            
            // Update button state
            popupButton.disabled = true;
            popupButton.textContent = 'Φόρτωση...';
            
            // Ensure script is loaded
            if (!adScriptLoaded) {
                loadAdScript();
            }
            
            // Try multiple methods to show ad
            showAdWithMultipleMethods();
            
            return true;
        }
        
        // Try different methods to show ad
        function showAdWithMultipleMethods() {
            let adShown = false;
            
            // Method 1: Direct ad trigger
            try {
                if (typeof window._mSdk !== 'undefined') {
                    console.log('🔄 Method 1: Using _mSdk');
                    window._mSdk.showAd();
                    adShown = true;
                }
            } catch(e) {}
            
            // Method 2: Monetag global object
            if (!adShown) {
                try {
                    if (typeof window.Monetag !== 'undefined') {
                        console.log('🔄 Method 2: Using Monetag');
                        window.Monetag.showAd();
                        adShown = true;
                    }
                } catch(e) {}
            }
            
            // Method 3: Dispatch custom event
            if (!adShown) {
                console.log('🔄 Method 3: Dispatching event');
                const event = new CustomEvent('monetag:show-ad');
                document.dispatchEvent(event);
                adShown = true;
            }
            
            // Reset button after delay
            setTimeout(() => {
                popupButton.disabled = false;
                popupButton.textContent = 'Προβολή Διαφήμισης';
                isAdShowing = false;
                
                // Log if no method worked
                if (!adShown) {
                    console.log('ℹ️ No ad method worked, showing fallback');
                    showTempMessage('🎮 Ευχαριστούμε για την υποστήριξη!');
                }
            }, 5000);
            
            // Auto-hide popup
            hideBottomPopup();
        }
        
        // Show temporary message
        function showTempMessage(message) {
            const msgDiv = document.createElement('div');
            msgDiv.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(26, 95, 180, 0.95);
                color: white;
                padding: 12px 25px;
                border-radius: 10px;
                z-index: 10000;
                font-weight: bold;
                text-align: center;
                box-shadow: 0 5px 20px rgba(0,0,0,0.4);
                border: 2px solid #ffcc00;
                font-size: 15px;
                max-width: 300px;
            `;
            msgDiv.textContent = message;
            document.body.appendChild(msgDiv);
            
            setTimeout(() => {
                if (msgDiv.parentNode) {
                    msgDiv.parentNode.removeChild(msgDiv);
                }
            }, 3000);
        }
        
        // Show/Hide Bottom Popup
        function showBottomPopup() {
            bottomPopup.classList.add('show');
            
            // Auto-hide after 20 seconds
            popupTimeout = setTimeout(() => {
                hideBottomPopup();
            }, 20000);
        }
        
        function hideBottomPopup() {
            bottomPopup.classList.remove('show');
            if (popupTimeout) clearTimeout(popupTimeout);
        }
        
        // Schedule popup appearances
        function schedulePopup() {
            // Show first popup after 45 seconds
            setTimeout(() => {
                if (gameLoaded) {
                    showBottomPopup();
                }
            }, 45000);
            
            // Then show every 6-8 minutes
            setInterval(() => {
                if (gameLoaded) {
                    showBottomPopup();
                }
            }, 360000 + Math.random() * 120000);
        }
        
        // Create floating objects
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS) return;
            
            const colors = [
                '#ff3333, #cc0000',
                '#4cc9f0, #1a5fb4',
                '#4CAF50, #2E7D32',
                '#FF9800, #FF5722'
            ];
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const object = document.createElement('div');
            object.className = 'floating-object balloon';
            object.style.setProperty('--balloon-color', color);
            
            // Random position
            const startX = Math.random() * (window.innerWidth - 100);
            const delay = Math.random() * 5;
            const duration = 30 + Math.random() * 15;
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Add glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Add cooldown overlay
            const cooldownOverlay = document.createElement('div');
            cooldownOverlay.className = 'cooldown-overlay';
            cooldownOverlay.textContent = '...';
            object.appendChild(cooldownOverlay);
            
            // Update cooldown display
            const updateCooldown = () => {
                const now = Date.now();
                const timeSinceLastAd = now - lastAdTime;
                
                if (timeSinceLastAd < AD_COOLDOWN) {
                    const remaining = Math.ceil((AD_COOLDOWN - timeSinceLastAd) / 1000);
                    cooldownOverlay.style.display = 'flex';
                    cooldownOverlay.textContent = `${remaining}s`;
                } else {
                    cooldownOverlay.style.display = 'none';
                }
            };
            
            // Click event
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                updateCooldown();
                
                if (openAd()) {
                    // Remove object on successful ad open
                    setTimeout(() => {
                        if (this.parentNode) {
                            this.remove();
                            activeObjects--;
                        }
                    }, 300);
                }
            });
            
            // Update cooldown every second
            const cooldownInterval = setInterval(updateCooldown, 1000);
            
            // Remove when animation completes
            setTimeout(() => {
                clearInterval(cooldownInterval);
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Schedule floating objects - START AFTER 1 MINUTE
        function scheduleFloatingObjects() {
            setTimeout(() => {
                console.log('⏰ Ξεκινάνε τα ιπτάμενα αντικείμενα');
                
                createFloatingObject();
                
                floatingInterval = setInterval(() => {
                    if (gameLoaded && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                        createFloatingObject();
                    }
                }, 30000 + Math.random() * 20000);
                
            }, 60000);
        }
        
        // Initialize game
        function initGame() {
            console.log('🎮 Παιχνίδι έτοιμο!');
            gameLoaded = true;
            
            // Check for ad blocker
            setTimeout(checkAdBlocker, 5000);
            
            // Load ad script with delay
            setTimeout(loadAdScript, 3000);
            
            // Start schedules
            schedulePopup();
            scheduleFloatingObjects();
            
            // Periodic script refresh (every 10 minutes)
            setInterval(() => {
                if (!isAdShowing) {
                    console.log('🔄 Refreshing ad script');
                    adScriptLoaded = false;
                    loadAdScript();
                }
            }, 600000);
        }
        
        // Event Listeners
        gameFrame.addEventListener('load', function() {
            console.log('✅ Παιχνίδι φορτώθηκε');
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                initGame();
            }, 2000);
        });
        
        gameFrame.addEventListener('error', function() {
            console.log('❌ Σφάλμα φόρτωσης παιχνιδιού');
            loadingScreen.innerHTML = `
                <div style="text-align: center;">
                    <div style="color: #ff4161; font-size: 20px; margin-bottom: 20px;">
                        Σφάλμα φόρτωσης
                    </div>
                    <button onclick="location.reload()" 
                            style="background: #4cc9f0; color: white; border: none; 
                                   padding: 10px 20px; border-radius: 20px; cursor: pointer;">
                        Ανανέωση Σελίδας
                    </button>
                </div>
            `;
        });
        
        // Popup button event
        popupButton.addEventListener('click', function() {
            if (!this.disabled) {
                openAd();
            }
        });
        
        closePopup.addEventListener('click', function() {
            hideBottomPopup();
        });
        
        // Prevent clicks on game frame
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Prevent double-click
        let lastClickTime = 0;
        document.addEventListener('click', function(e) {
            const now = Date.now();
            if (now - lastClickTime < 1000) {
                e.preventDefault();
                e.stopPropagation();
            }
            lastClickTime = now;
        }, true);
        
        // Initial message
        console.log('🎮 Royal Garden Match 2');
        console.log('🎯 Bottom Popup + Floating Objects');
        console.log('🛡️ Cooldown: 30 seconds between ads');
        console.log('⚠️ Duplicate ad protection active');
        
        // Auto-hide loading screen
        setTimeout(() => {
            if (!gameLoaded) {
                loadingScreen.classList.add('hidden');
                initGame();
            }
        }, 5000);
    </script>
</body>
</html>
