<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foxy Eco Sort - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.3s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Leaves Container - ΑΛΛΑΓΗ: removed pointer-events: none */
        #floatingLeaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; /* ΑΛΛΑΓΗ: Πολύ ψηλό z-index */
        }
        
        /* Leaf Objects */
        .leaf-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            z-index: 10000; /* ΑΛΛΑΓΗ: Ακόμα ψηλότερο */
            opacity: 1; /* ΑΛΛΑΓΗ: Από 0.9 σε 1 */
            will-change: transform, opacity;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)); /* ΑΛΛΑΓΗ: Πιο έντονη σκιά */
            transition: transform 0.2s ease;
        }
        
        .leaf-object:active, .leaf-object:hover {
            transform: scale(1.2) !important;
            opacity: 1;
        }
        
        /* Green Leaf Styles */
        .green-leaf {
            width: 80px; /* ΑΛΛΑΓΗ: Από 70 σε 80px */
            height: 80px;
            position: relative;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 50% 0 50% 50%;
            transform: rotate(var(--rotation)) scale(1);
            border: 3px solid rgba(255, 255, 255, 0.3); /* ΑΛΛΑΓΗ: Πιο φωτεινό border */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            overflow: hidden;
            animation: leafGlow 2s infinite alternate; /* ΑΛΛΑΓΗ: Προσθήκη animation σε όλα */
        }
        
        /* Ad text inside leaf */
        .ad-text {
            color: white;
            font-size: 12px; /* ΑΛΛΑΓΗ: Από 11 σε 12px */
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); /* ΑΛΛΑΓΗ: Πιο έντονο shadow */
            padding: 5px;
            line-height: 1.2;
            z-index: 2;
            position: relative;
        }
        
        /* Leaf stem */
        .leaf-stem {
            position: absolute;
            width: 4px;
            height: 25px;
            background: linear-gradient(to bottom, #8B4513, #5D4037);
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        
        /* Leaf veins */
        .leaf-veins {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.5; /* ΑΛΛΑΓΗ: Από 0.4 σε 0.5 */
        }
        
        .vein {
            position: absolute;
            background: #1B5E20;
            border-radius: 1px;
        }
        
        .vein-main {
            width: 3px;
            height: 70%;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .vein-side {
            width: 2px;
            height: 40%;
            background: #2E7D32;
        }
        
        .vein-side:nth-child(2) { top: 25%; left: 30%; transform: rotate(-30deg); }
        .vein-side:nth-child(3) { top: 25%; right: 30%; transform: rotate(30deg); }
        .vein-side:nth-child(4) { top: 40%; left: 20%; transform: rotate(-45deg); }
        .vein-side:nth-child(5) { top: 40%; right: 20%; transform: rotate(45deg); }
        
        /* Simple Green Orb */
        .green-orb {
            width: 75px; /* ΑΛΛΑΓΗ: Από 65 σε 75px */
            height: 75px;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #66BB6A, #388E3C);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3); /* ΑΛΛΑΓΗ */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 25px rgba(102, 187, 106, 0.8), /* ΑΛΛΑΓΗ: Πιο φωτεινό */
                inset 0 0 20px rgba(255, 255, 255, 0.2); /* ΑΛΛΑΓΗ */
            animation: leafGlow 2s infinite alternate; /* Προσθήκη animation */
        }
        
        /* Eco Badge */
        .eco-badge {
            width: 70px; /* ΑΛΛΑΓΗ */
            height: 70px;
            position: relative;
            background: linear-gradient(135deg, #43A047, #1B5E20);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 3px solid #C8E6C9; /* ΑΛΛΑΓΗ */
            display: flex;
            align-items: center;
            justify-content: center;
            animation: leafGlow 2s infinite alternate; /* Προσθήκη animation */
        }
        
        /* Simple Green Square */
        .green-square {
            width: 65px; /* ΑΛΛΑΓΗ */
            height: 65px;
            position: relative;
            background: linear-gradient(45deg, #81C784, #4CAF50);
            border-radius: 15px; /* ΑΛΛΑΓΗ: Από 10 σε 15px */
            border: 3px solid rgba(255, 255, 255, 0.3); /* ΑΛΛΑΓΗ */
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(var(--rotation));
            animation: leafGlow 2s infinite alternate; /* Προσθήκη animation */
        }
        
        /* Animations */
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            5% {
                opacity: 1; /* ΑΛΛΑΓΗ: Πιο γρήγορη εμφάνιση */
            }
            95% {
                opacity: 1; /* ΑΛΛΑΓΗ */
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatSide {
            0% {
                transform: translateX(-100px) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes leafGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 15px rgba(76, 175, 80, 0.6), /* ΑΛΛΑΓΗ */
                    inset 0 0 15px rgba(255, 255, 255, 0.2); /* ΑΛΛΑΓΗ */
            }
            50% { 
                box-shadow: 
                    0 0 25px rgba(76, 175, 80, 0.9), /* ΑΛΛΑΓΗ */
                    inset 0 0 25px rgba(255, 255, 255, 0.3); /* ΑΛΛΑΓΗ */
            }
        }
        
        /* TEST MODE - For debugging */
        .test-leaf {
            position: fixed;
            top: 50px;
            left: 50px;
            width: 100px;
            height: 100px;
            background: red;
            z-index: 99999;
            display: none;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .green-leaf, .green-orb { width: 70px; height: 70px; }
            .eco-badge, .green-square { width: 65px; height: 65px; }
            .ad-text { font-size: 11px; }
            .loader-text { font-size: 20px; }
        }
        
        @media (max-width: 480px) {
            .green-leaf, .green-orb { width: 65px; height: 65px; }
            .eco-badge, .green-square { width: 60px; height: 60px; }
            .ad-text { font-size: 10px; }
            .loader-text { font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/e0c6fbe378ad4ed5a1325176324a79dd/?gd_sdk_referrer_url=https://gamedistribution.com/games/foxy-eco-sort/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">Loading Foxy Eco Sort...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Leaves Container -->
    <div id="floatingLeaves"></div>
    
    <!-- Test element for debugging -->
    <div class="test-leaf" id="testLeaf"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingLeaves = document.getElementById('floatingLeaves');
        const testLeaf = document.getElementById('testLeaf');
        
        // Game State
        let gameLoaded = false;
        let leavesStarted = false;
        let activeLeaves = 0;
        const MAX_LEAVES = 5; /* ΑΛΛΑΓΗ: Από 4 σε 5 */
        let leavesInterval;
        
        // Configuration - TEST MODE: 3 seconds instead of 30
        const LEAVES_START_DELAY = 3000; // TEST: 3 δευτερόλεπτα (μετά θα το αλλάξουμε σε 30000)
        const MONETAG_LINK = 'https://otieu.com/4/10021790';
        
        // Debug function
        function debugLog(message) {
            console.log(`🍃 DEBUG: ${message}`);
            // Also show alert for first debug message
            if (!window.debugShown) {
                window.debugShown = true;
                setTimeout(() => {
                    alert(`DEBUG: ${message}\n\nLeaves will start in ${LEAVES_START_DELAY/1000} seconds`);
                }, 1000);
            }
        }
        
        // Initialize - Optimized for fast loading
        function init() {
            debugLog('Initializing Foxy Eco Sort...');
            
            // Test if container is visible
            testLeaf.style.display = 'block';
            testLeaf.style.background = 'green';
            testLeaf.innerHTML = 'TEST';
            
            // Set game to full screen
            setupFullScreenGame();
            
            // Hide loader quickly
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    gameLoaded = true;
                    
                    debugLog(`Loader hidden. Leaves will start in ${LEAVES_START_DELAY/1000} seconds`);
                    
                    // TEST: Create one leaf immediately for testing
                    setTimeout(() => {
                        createTestLeaf();
                    }, 1000);
                    
                    // Start leaves after delay
                    setTimeout(startFloatingLeaves, LEAVES_START_DELAY);
                }, 300);
            }, 1500);
            
            // Game frame error handling
            gameFrame.addEventListener('load', () => {
                debugLog('Game frame loaded successfully');
            });
            
            gameFrame.addEventListener('error', () => {
                debugLog('Game frame error - but leaves should still work');
            });
        }
        
        // Create a test leaf immediately
        function createTestLeaf() {
            debugLog('Creating test leaf...');
            
            const testLeaf = document.createElement('div');
            testLeaf.className = 'leaf-object green-leaf';
            testLeaf.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 99999;
                width: 100px;
                height: 100px;
                background: red;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                border: 3px solid yellow;
            `;
            testLeaf.innerHTML = 'TEST LEAF<br>Should be visible';
            testLeaf.onclick = () => {
                debugLog('Test leaf clicked!');
                window.open(MONETAG_LINK, '_blank');
                testLeaf.remove();
            };
            
            floatingLeaves.appendChild(testLeaf);
            
            // Remove after 5 seconds
            setTimeout(() => {
                if (testLeaf.parentNode) {
                    testLeaf.remove();
                    debugLog('Test leaf removed');
                }
            }, 5000);
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
                debugLog(`Window size: ${window.innerWidth}x${window.innerHeight}`);
            };
            
            updateSize();
            
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateSize, 100);
            });
            
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 150);
            });
        }
        
        // Create green leaf with ad text
        function createGreenLeaf() {
            if (activeLeaves >= MAX_LEAVES || !leavesStarted) return;
            
            debugLog(`Creating leaf ${activeLeaves + 1}/${MAX_LEAVES}`);
            
            const leafTypes = [
                { 
                    type: 'green-leaf', 
                    name: 'Green Leaf',
                    animation: 'floatDown',
                    duration: 12 + Math.random() * 8, /* ΑΛΛΑΓΗ: Πιο γρήγορα */
                    adText: 'Click for\nAD'
                },
                { 
                    type: 'green-leaf', 
                    name: 'Green Leaf',
                    animation: 'floatUp', 
                    duration: 14 + Math.random() * 6,
                    adText: 'Watch\nAD'
                },
                { 
                    type: 'green-orb', 
                    name: 'Green Orb',
                    animation: 'floatDown',
                    duration: 13 + Math.random() * 7,
                    adText: 'AD Here'
                },
                { 
                    type: 'eco-badge', 
                    name: 'Eco Badge',
                    animation: 'floatSide',
                    duration: 16 + Math.random() * 4,
                    adText: 'Support\nUs'
                },
                { 
                    type: 'green-square', 
                    name: 'Green Square',
                    animation: 'floatUp',
                    duration: 11 + Math.random() * 9,
                    adText: 'Click\nMe'
                }
            ];
            
            const leafType = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            const rotation = Math.random() * 360;
            
            const leafObject = document.createElement('div');
            leafObject.className = `leaf-object ${leafType.type}`;
            leafObject.style.setProperty('--rotation', `${rotation}deg`);
            leafObject.style.cursor = 'pointer';
            
            // Create leaf element
            const leaf = document.createElement('div');
            leaf.className = leafType.type;
            
            // Add AD text inside ALL leaves
            const adText = document.createElement('div');
            adText.className = 'ad-text';
            adText.textContent = leafType.adText;
            leaf.appendChild(adText);
            
            leafObject.appendChild(leaf);
            
            // Set position and animation
            if (leafType.animation === 'floatDown' || leafType.animation === 'floatUp') {
                const startX = Math.random() * window.innerWidth;
                const endX = startX + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-x', `${startX}px`);
                leafObject.style.setProperty('--end-x', `${endX}px`);
                debugLog(`Leaf path: X ${startX.toFixed(0)} -> ${endX.toFixed(0)}`);
            } else {
                const startY = Math.random() * window.innerHeight;
                const endY = startY + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-y', `${startY}px`);
                leafObject.style.setProperty('--end-y', `${endY}px`);
                debugLog(`Leaf path: Y ${startY.toFixed(0)} -> ${endY.toFixed(0)}`);
            }
            
            leafObject.style.animation = `${leafType.animation} ${leafType.duration}s linear forwards`;
            leafObject.style.left = '0px';
            leafObject.style.top = '0px';
            
            // Click event for Monetag ad
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                debugLog('Leaf clicked! Opening Monetag...');
                
                // Visual feedback
                leafObject.style.transform = 'scale(1.4) rotate(15deg)';
                leafObject.style.opacity = '0.8';
                leafObject.style.transition = 'all 0.3s ease';
                leafObject.style.filter = 'drop-shadow(0 0 10px gold)';
                
                // Open Monetag ad in new tab
                window.open(MONETAG_LINK, '_blank');
                
                // Remove leaf after animation
                setTimeout(() => {
                    if (leafObject.parentNode) {
                        leafObject.style.opacity = '0';
                        leafObject.style.transform = 'scale(0.3)';
                        setTimeout(() => {
                            if (leafObject.parentNode) {
                                leafObject.remove();
                                activeLeaves--;
                                debugLog(`Leaf removed. Active: ${activeLeaves}`);
                            }
                        }, 300);
                    }
                }, 400);
            };
            
            leafObject.addEventListener('click', handleClick);
            leafObject.addEventListener('touchstart', handleClick, { passive: false });
            
            // Remove when animation completes
            setTimeout(() => {
                if (leafObject.parentNode) {
                    leafObject.remove();
                    activeLeaves--;
                    debugLog(`Leaf animation ended. Active: ${activeLeaves}`);
                }
            }, leafType.duration * 1000);
            
            floatingLeaves.appendChild(leafObject);
            activeLeaves++;
            
            debugLog(`Leaf created. Total active: ${activeLeaves}`);
        }
        
        // Start floating leaves
        function startFloatingLeaves() {
            if (leavesStarted) return;
            
            leavesStarted = true;
            debugLog('🍃 STARTING FLOATING LEAVES NOW! 🍃');
            
            // Create more leaves initially
            createGreenLeaf();
            setTimeout(() => createGreenLeaf(), 500);
            setTimeout(() => createGreenLeaf(), 1000);
            setTimeout(() => createGreenLeaf(), 1500);
            setTimeout(() => createGreenLeaf(), 2000);
            
            // Continuous spawn
            leavesInterval = setInterval(() => {
                if (leavesStarted && activeLeaves < MAX_LEAVES) {
                    createGreenLeaf();
                }
            }, 5000 + Math.random() * 3000); /* ΑΛΛΑΓΗ: Πιο συχνά */
        }
        
        // Start everything immediately
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Global debug function
        window.showLeavesDebug = function() {
            debugLog('Manual debug trigger');
            console.log({
                gameLoaded,
                leavesStarted,
                activeLeaves,
                MAX_LEAVES,
                floatingLeaves: document.getElementById('floatingLeaves'),
                windowSize: `${window.innerWidth}x${window.innerHeight}`
            });
            
            if (!leavesStarted) {
                startFloatingLeaves();
            } else {
                createGreenLeaf();
            }
        };
        
        // Press 'L' key to manually trigger leaves (for debugging)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'l' || e.key === 'L') {
                debugLog('L key pressed - manually triggering leaves');
                if (!leavesStarted) {
                    startFloatingLeaves();
                } else {
                    createGreenLeaf();
                }
            }
        });
    </script>
</body>
</html>
