<!DOCTYPE html>
<html>
<head>
    <title>🎮 Play Games - MY Ads Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- MONETAG SCRIPT -->
    <script>
    (function(s){
        s.dataset.zone = '10266501';
        s.src = 'https://al5sm.com/tag.min.js';
    })(document.body.appendChild(document.createElement('script')));
    </script>
    
    <style>
        body {
            font-family: Arial;
            background: #1a1a1a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .game-container {
            margin: 20px auto;
            position: relative;
            display: inline-block;
        }
        
        .ad-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        .ad-message {
            background: #4CAF50;
            padding: 30px;
            border-radius: 10px;
            font-size: 24px;
        }
        
        .game-options {
            margin: 20px;
        }
        
        .game-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>🎮 PLAY GAMES - ONLY MY ADS</h1>
    <p>Every 3 minutes: MY ad appears. Game ends: MY ad appears.</p>
    
    <div class="game-options">
        <button class="game-btn" onclick="loadGame('solitaire')">♠️ Solitaire</button>
        <button class="game-btn" onclick="loadGame('2048')">🔢 2048</button>
        <button class="game-btn" onclick="loadGame('tetris')">🧱 Tetris</button>
        <button class="game-btn" onclick="loadGame('snake')">🐍 Snake</button>
    </div>
    
    <div class="game-container">
        <iframe id="gameFrame" width="800" height="600" style="border: 3px solid #4CAF50; border-radius: 10px;"></iframe>
        
        <div class="ad-overlay" id="adOverlay">
            <div class="ad-message" id="adMessage">
                📺 MY AD IS PLAYING<br>
                +3 Points for you!<br>
                <span id="adTimer">5</span> seconds...
            </div>
        </div>
    </div>
    
    <div style="margin-top: 30px;">
        <p>Points: <span id="points">0</span> / 50 for coffee</p>
        <button onclick="redeemCoffee()" style="background: #9C27B0; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px;">
            ☕ Redeem Coffee
        </button>
    </div>

    <script>
        // Simple points system
        let points = parseInt(localStorage.getItem('myPoints')) || 0;
        let gameTimer = null;
        let adTimer = null;
        let gameActive = false;
        
        document.getElementById('points').textContent = points;
        
        // Games database
        const GAMES = {
            'solitaire': 'https://www.solitr.com/embed',
            '2048': 'https://play2048.co/',
            'tetris': 'https://tetris.com/play-tetris',
            'snake': 'https://playsnake.org/'
        };
        
        function loadGame(gameName) {
            const url = GAMES[gameName];
            if (!url) return;
            
            // Reset any existing timer
            if (gameTimer) clearInterval(gameTimer);
            if (adTimer) clearInterval(adTimer);
            
            // Load game
            document.getElementById('gameFrame').src = url;
            gameActive = true;
            
            // Hide ad if shown
            document.getElementById('adOverlay').style.display = 'none';
            
            // Start 3-minute timer for ad
            gameTimer = setTimeout(showMyAd, 180000); // 3 minutes = 180000 ms
            
            alert('Game loaded! My ad will appear in 3 minutes.');
        }
        
        function showMyAd() {
            if (!gameActive) return;
            
            // Show MY ad
            document.getElementById('adOverlay').style.display = 'flex';
            
            // Start 5-second countdown
            let seconds = 5;
            document.getElementById('adTimer').textContent = seconds;
            
            adTimer = setInterval(() => {
                seconds--;
                document.getElementById('adTimer').textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(adTimer);
                    closeAd();
                }
            }, 1000);
            
            // Trigger Monetag ad
            triggerMonetagAd();
        }
        
        function closeAd() {
            // Hide ad
            document.getElementById('adOverlay').style.display = 'none';
            
            // Award points
            points += 3;
            localStorage.setItem('myPoints', points);
            document.getElementById('points').textContent = points;
            
            alert('+3 Points! My ad completed.');
            
            // Restart 3-minute timer
            if (gameActive) {
                gameTimer = setTimeout(showMyAd, 180000);
            }
        }
        
        function triggerMonetagAd() {
            // Monetag will auto-trigger popunder
            console.log('My Monetag ad triggered');
            
            // Force popunder
            try {
                const w = window.open('', '_blank');
                if (w) w.close();
            } catch(e) {}
        }
        
        function redeemCoffee() {
            if (points >= 50) {
                points -= 50;
                localStorage.setItem('myPoints', points);
                document.getElementById('points').textContent = points;
                alert('Coffee redeemed! Show this message in store.');
            } else {
                alert(`Need ${50-points} more points!`);
            }
        }
        
        // Detect when user leaves game (simplified)
        window.addEventListener('blur', function() {
            if (gameActive) {
                // User switched tab/window - show ad
                setTimeout(showMyAd, 1000);
            }
        });
        
        // Load first game by default
        loadGame('solitaire');
    </script>
</body>
</html>
