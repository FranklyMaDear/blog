<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Bottom Popup Banner with Embedded Ad */
        .bottom-popup {
            position: fixed;
            bottom: -140px;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #1a5fb4 0%, #26a269 100%);
            color: white;
            padding: 15px 20px;
            z-index: 90;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
            border-top: 4px solid #ffcc00;
            transition: bottom 0.5s ease;
            text-align: center;
        }
        
        .bottom-popup.show {
            bottom: 0;
        }
        
        .popup-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            gap: 15px;
        }
        
        .popup-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .popup-icon {
            background: #ffcc00;
            color: #1a5fb4;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            animation: gentlePulse 2s infinite;
        }
        
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .popup-text {
            text-align: left;
            flex-shrink: 0;
        }
        
        .popup-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 3px;
            color: white;
        }
        
        .popup-subtitle {
            font-size: 14px;
            color: #ffcc00;
            font-weight: 500;
        }
        
        .popup-ad-container {
            flex: 1;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 204, 0, 0.2);
        }
        
        .ad-placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
            padding: 15px;
        }
        
        .close-popup {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            transition: all 0.3s;
            margin-left: 10px;
        }
        
        .close-popup:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Floating Objects - Smaller */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            z-index: 81;
            animation: floatDiagonal 35s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .floating-object:hover {
            transform: scale(1.2);
            filter: brightness(1.3) drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }
        
        @keyframes floatDiagonal {
            0% {
                transform: translateY(100vh) translateX(-80px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(80px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Fruit Objects - Smaller */
        .fruit-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        
        .fruit-shape {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            position: relative;
        }
        
        .fruit-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
        }
        
        .fruit-label {
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }
        
        /* Apple */
        .fruit-apple .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3333, #cc0000);
        }
        
        /* Orange */
        .fruit-orange .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff9800, #ff5722);
        }
        
        /* Strawberry */
        .fruit-strawberry .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3366, #cc0066);
        }
        
        /* Balloon Objects - Smaller with "ads" text */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        
        .balloon-shape {
            width: 50px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, var(--balloon-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Balloon with "ads" text */
        .balloon-ads .balloon-shape:after {
            content: 'ads';
            position: absolute;
            font-size: 10px;
            font-weight: bold;
        }
        
        .balloon-shape:before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 25px;
            background: #666;
        }
        
        .balloon-label {
            background: rgba(0, 0, 0, 0.85);
            color: var(--balloon-text-color);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Flower Objects - Smaller */
        .flower-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        
        .flower-shape {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 50% 50%, var(--flower-color));
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .flower-center {
            width: 15px;
            height: 15px;
            background: #ffcc00;
            border-radius: 50%;
            position: absolute;
        }
        
        .flower-label {
            background: rgba(0, 0, 0, 0.85);
            color: var(--flower-text-color);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Object Glow Effect */
        .object-glow {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: inherit;
            border-radius: inherit;
            filter: blur(8px);
            opacity: 0.3;
            z-index: -1;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- BOTTOM POPUP BANNER WITH EMBEDDED AD -->
    <div class="bottom-popup" id="bottomPopup">
        <div class="popup-content">
            <div class="popup-left">
                <div class="popup-icon">!</div>
                <div class="popup-text">
                    <div class="popup-title">🎮 Υποστηρίξτε το Παιχνίδι</div>
                    <div class="popup-subtitle">Η διαφήμιση παρακάτω βοηθάει!</div>
                </div>
            </div>
            
            <div class="popup-ad-container" id="popupAdContainer">
                <div class="ad-placeholder">📢 Διαφήμιση φορτώνεται...</div>
            </div>
            
            <button class="close-popup" id="closePopup">×</button>
        </div>
    </div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <!-- YOUR SCRIPT WILL BE LOADED HERE -->
    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const bottomPopup = document.getElementById('bottomPopup');
        const closePopup = document.getElementById('closePopup');
        const popupAdContainer = document.getElementById('popupAdContainer');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameLoaded = true;
        let popupTimeout;
        let floatingInterval;
        let adScriptLoaded = false;
        let isAdShowing = false;
        let activeObjects = 0;
        const MAX_OBJECTS = 3;
        
        // Load your script (Zone: 10021853)
        function loadAdScript() {
            if (adScriptLoaded) return;
            
            console.log('📢 Φόρτωση διαφημιστικού script (Zone: 10021853)...');
            
            // Create and load your script
            const adScript = document.createElement('script');
            adScript.src = 'https://3nbf4.com/act/files/tag.min.js?z=10021853';
            adScript.setAttribute('data-cfasync', 'false');
            adScript.async = true;
            
            adScript.onload = function() {
                console.log('✅ Διαφημιστικό script φορτώθηκε (Zone: 10021853)');
                adScriptLoaded = true;
                
                // After script loads, try to show ad
                setTimeout(() => {
                    showAdInContainer();
                }, 1000);
            };
            
            adScript.onerror = function() {
                console.log('❌ Σφάλμα φόρτωσης script');
                showFallbackAd();
            };
            
            document.body.appendChild(adScript);
        }
        
        // Show ad in the popup container
        function showAdInContainer() {
            if (!adScriptLoaded) return;
            
            console.log('🎯 Προσπάθεια εμφάνισης διαφήμισης στο container');
            
            try {
                // Clear container first
                popupAdContainer.innerHTML = '<div class="ad-placeholder">📢 Διαφήμιση φορτώνεται...</div>';
                
                // The script should automatically inject ads into the page
                // We'll create a specific container for the ad
                const adDiv = document.createElement('div');
                adDiv.id = 'monetag-ad-container';
                adDiv.style.width = '100%';
                adDiv.style.height = '100%';
                adDiv.style.minHeight = '90px';
                
                popupAdContainer.innerHTML = '';
                popupAdContainer.appendChild(adDiv);
                
                // Some ad networks automatically fill divs with ads
                // If not, we'll show a fallback
                setTimeout(() => {
                    if (popupAdContainer.innerHTML.includes('ad-placeholder') || 
                        popupAdContainer.textContent.includes('Διαφήμιση φορτώνεται')) {
                        showFallbackAd();
                    }
                }, 3000);
                
            } catch(error) {
                console.log('⚠️ Σφάλμα εμφάνισης διαφήμισης:', error);
                showFallbackAd();
            }
        }
        
        // Fallback ad if script doesn't work
        function showFallbackAd() {
            console.log('🔄 Εμφάνιση fallback διαφήμισης');
            
            popupAdContainer.innerHTML = `
                <div style="text-align: center; color: white; padding: 10px; width: 100%;">
                    <div style="font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #ffcc00;">🎮 Ευχαριστούμε!</div>
                    <div style="font-size: 12px; margin-bottom: 10px;">Η υποστήριξή σας βοηθάει το παιχνίδι</div>
                    <div style="background: rgba(255,255,255,0.1); padding: 8px; border-radius: 5px; font-size: 11px;">
                        📢 Διαφημιστικό περιεχόμενο
                    </div>
                </div>
            `;
        }
        
        // Show/Hide Bottom Popup with embedded ad
        function showBottomPopup() {
            console.log('🕒 Εμφάνιση popup banner με ενσωματωμένη διαφήμιση');
            bottomPopup.classList.add('show');
            
            // Load ad script and show ad
            loadAdScript();
            
            // Auto-hide after 25 seconds
            popupTimeout = setTimeout(() => {
                hideBottomPopup();
            }, 25000);
        }
        
        function hideBottomPopup() {
            bottomPopup.classList.remove('show');
            if (popupTimeout) clearTimeout(popupTimeout);
            isAdShowing = false;
        }
        
        // Schedule popup to appear AFTER 2 MINUTES
        function schedulePopup() {
            // Show first popup after 2 minutes (120000ms)
            setTimeout(() => {
                if (gameLoaded) {
                    showBottomPopup();
                }
            }, 120000);
            
            // Then show every 4-6 minutes
            setInterval(() => {
                if (gameLoaded && !isAdShowing) {
                    showBottomPopup();
                }
            }, 240000 + Math.random() * 120000);
        }
        
        // Create floating objects - Smaller with "ads" text
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS) return;
            
            const objectTypes = [
                { 
                    type: 'fruit', 
                    subtype: 'apple', 
                    label: '🎯 Κλικ', 
                    color: '#ff3333, #cc0000',
                    textColor: '#ffcc00'
                },
                { 
                    type: 'fruit', 
                    subtype: 'orange', 
                    label: '✨ Υποστήριξη', 
                    color: '#ff9800, #ff5722',
                    textColor: '#ffcc00'
                },
                { 
                    type: 'fruit', 
                    subtype: 'strawberry', 
                    label: '⭐ Παίξε', 
                    color: '#ff3366, #cc0066',
                    textColor: '#ffcc00'
                },
                { 
                    type: 'balloon', 
                    subtype: 'red-ads', 
                    label: 'Κλικ εδώ', 
                    color: '#ff3333, #cc0000',
                    textColor: '#ff9999',
                    hasAdsText: true
                },
                { 
                    type: 'balloon', 
                    subtype: 'blue-ads', 
                    label: 'Υποστήριξη', 
                    color: '#4cc9f0, #1a5fb4',
                    textColor: '#99ccff',
                    hasAdsText: true
                },
                { 
                    type: 'balloon', 
                    subtype: 'green', 
                    label: '🎈 Παίξε', 
                    color: '#4CAF50, #2E7D32',
                    textColor: '#99ff99'
                },
                { 
                    type: 'flower', 
                    subtype: 'pink', 
                    label: '🌸 Διαφήμιση', 
                    color: '#e91e63, #c2185b',
                    textColor: '#ff99cc'
                },
                { 
                    type: 'flower', 
                    subtype: 'purple', 
                    label: '🌺 Κλικ', 
                    color: '#9c27b0, #7b1fa2',
                    textColor: '#cc99ff'
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            
            const object = document.createElement('div');
            const className = objType.hasAdsText ? 
                `floating-object ${objType.type}-object balloon-ads ${objType.type}-${objType.subtype}` :
                `floating-object ${objType.type}-object ${objType.type}-${objType.subtype}`;
            
            object.className = className;
            
            // Set CSS variables for colors
            if (objType.type === 'balloon') {
                object.style.setProperty('--balloon-color', objType.color);
                object.style.setProperty('--balloon-text-color', objType.textColor);
            } else if (objType.type === 'flower') {
                object.style.setProperty('--flower-color', objType.color);
                object.style.setProperty('--flower-text-color', objType.textColor);
            }
            
            // Random position
            const startX = Math.random() * (window.innerWidth - 80);
            const delay = Math.random() * 3;
            const duration = 30 + Math.random() * 15;
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Create object content
            let shapeDiv, labelDiv;
            
            if (objType.type === 'fruit') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'fruit-shape';
                
                const iconDiv = document.createElement('div');
                iconDiv.className = 'fruit-icon';
                iconDiv.textContent = objType.label.split(' ')[0];
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'fruit-label';
                labelDiv.textContent = objType.label;
                
                shapeDiv.appendChild(iconDiv);
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'balloon') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'balloon-shape';
                
                // Add "ads" text to balloons with hasAdsText
                if (objType.hasAdsText) {
                    const adsText = document.createElement('div');
                    adsText.textContent = 'ads';
                    adsText.style.cssText = `
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        font-size: 10px;
                        font-weight: bold;
                        color: white;
                        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
                    `;
                    shapeDiv.appendChild(adsText);
                }
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'balloon-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'flower') {
                shapeDiv = document.createElement('div');
                shapeDiv.className = 'flower-shape';
                
                const centerDiv = document.createElement('div');
                centerDiv.className = 'flower-center';
                
                labelDiv = document.createElement('div');
                labelDiv.className = 'flower-label';
                labelDiv.textContent = objType.label;
                
                shapeDiv.appendChild(centerDiv);
                object.appendChild(shapeDiv);
                object.appendChild(labelDiv);
            }
            
            // Add glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Click event
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                if (!isAdShowing) {
                    // Visual feedback
                    this.style.transform = 'scale(1.3)';
                    this.style.opacity = '0.6';
                    
                    // Show popup with ad
                    showBottomPopup();
                    isAdShowing = true;
                    
                    // Remove object
                    setTimeout(() => {
                        if (this.parentNode) {
                            this.remove();
                            activeObjects--;
                        }
                    }, 300);
                }
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Schedule floating objects
        function scheduleFloatingObjects() {
            // Create objects every 20-30 seconds
            floatingInterval = setInterval(() => {
                if (gameLoaded && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                    createFloatingObject();
                }
            }, 20000 + Math.random() * 10000);
            
            // Create initial objects
            setTimeout(() => createFloatingObject(), 3000);
            setTimeout(() => createFloatingObject(), 8000);
            setTimeout(() => createFloatingObject(), 13000);
        }
        
        // Initialize
        function init() {
            console.log('🎮 Royal Garden Match 2');
            
            // Schedule popup after 2 minutes
            schedulePopup();
            
            // Start floating objects
            scheduleFloatingObjects();
            
            // Preload ad script after 30 seconds
            setTimeout(loadAdScript, 30000);
        }
        
        // Event Listeners
        closePopup.addEventListener('click', function() {
            hideBottomPopup();
        });
        
        // Prevent clicks on game frame
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Start everything
        init();
    </script>
</body>
</html>
