<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Sharp Turn - Free Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-frame {
            border: none;
            display: block;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 90vh;
        }
        
        /* Game Loader */
        .game-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 90;
        }
        
        /* Floating Objects - Top to Bottom */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 91;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
        }
        
        .floating-object:hover {
            transform: scale(1.1);
            opacity: 1;
        }
        
        /* Balloon Objects - Discrete Design */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .balloon-shape {
            width: 50px;
            height: 60px;
            background: var(--balloon-color);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .balloon-text {
            color: white;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            padding: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            line-height: 1.2;
        }
        
        .balloon-string {
            width: 2px;
            height: 20px;
            background: #888;
            margin-top: -2px;
        }
        
        /* Fruit Objects - Discrete Design */
        .fruit-object {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .fruit-shape {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .fruit-text {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 9px;
            margin-top: 5px;
            font-weight: bold;
            text-align: center;
            max-width: 60px;
            line-height: 1.2;
        }
        
        /* Object Animations - Top to Bottom */
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x));
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x));
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x));
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x));
                opacity: 0;
            }
        }
        
        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            text-align: center;
            z-index: 92;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- GAME LOADER -->
    <div class="game-loader" id="gameLoader">
        <div class="loader-text">Loading Game...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME - Rescue Sharp Turn -->
            <iframe 
                src="https://html5.gamedistribution.com/67b7fb2c6f594ef3a4fcb241e902ce1d/?gd_sdk_referrer_url=https://gamedistribution.com/games/rescue-sharp-turn/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="none"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- INSTRUCTIONS -->
    <div class="instructions">Game Ready • Click floating objects for rewards</div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const gameLoader = document.getElementById('gameLoader');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameStarted = false;
        let activeObjects = 0;
        const MAX_OBJECTS = 4; // Fewer objects, more discrete
        let objectInterval;
        
        // Configuration
        const GAME_AREA_PADDING = 50; // Keep objects away from game edges
        
        // Hide loader when game loads
        function hideLoader() {
            setTimeout(() => {
                gameLoader.style.opacity = '0';
                setTimeout(() => {
                    gameLoader.style.display = 'none';
                    startGameObjects();
                }, 500);
            }, 1500);
        }
        
        // Get game area boundaries
        function getGameAreaBounds() {
            const frameRect = gameFrame.getBoundingClientRect();
            return {
                left: frameRect.left + GAME_AREA_PADDING,
                right: frameRect.right - GAME_AREA_PADDING,
                top: frameRect.top + GAME_AREA_PADDING,
                bottom: frameRect.bottom - GAME_AREA_PADDING
            };
        }
        
        // Create discrete floating object
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS || !gameStarted) return;
            
            const objectTypes = [
                // Balloons with text inside
                { 
                    type: 'balloon', 
                    color: 'linear-gradient(135deg, #4CAF50, #2E7D32)',
                    text: 'AD\nClick',
                    animation: 'floatDown',
                    direction: 'down'
                },
                { 
                    type: 'balloon', 
                    color: 'linear-gradient(135deg, #2196F3, #1976D2)',
                    text: 'Win\nPrize',
                    animation: 'floatUp',
                    direction: 'up'
                },
                { 
                    type: 'balloon', 
                    color: 'linear-gradient(135deg, #FF9800, #F57C00)',
                    text: 'Free\nBonus',
                    animation: 'floatDown',
                    direction: 'down'
                },
                // Fruits with text below
                { 
                    type: 'fruit', 
                    emoji: '🍎',
                    text: 'Click me',
                    animation: 'floatDown',
                    direction: 'down'
                },
                { 
                    type: 'fruit', 
                    emoji: '🍊',
                    text: 'Reward',
                    animation: 'floatUp',
                    direction: 'up'
                },
                { 
                    type: 'fruit', 
                    emoji: '🍇',
                    text: 'Bonus',
                    animation: 'floatDown',
                    direction: 'down'
                },
                { 
                    type: 'fruit', 
                    emoji: '🍓',
                    text: 'Win now',
                    animation: 'floatUp',
                    direction: 'up'
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            const object = document.createElement('div');
            object.className = `floating-object ${objType.type}-object`;
            
            // Get game area bounds
            const gameBounds = getGameAreaBounds();
            
            // Random position near game edges but not overlapping
            let startX, endX;
            const isLeftSide = Math.random() > 0.5;
            
            if (isLeftSide) {
                startX = gameBounds.left - 30 + Math.random() * 30;
                endX = startX + (Math.random() * 40 - 20);
            } else {
                startX = gameBounds.right + 10 - Math.random() * 30;
                endX = startX + (Math.random() * 40 - 20);
            }
            
            // Set CSS variables for animation
            object.style.setProperty('--start-x', `${startX}px`);
            object.style.setProperty('--end-x', `${endX}px`);
            
            // Set position and animation
            object.style.left = '0px';
            object.style.top = '0px';
            object.style.animation = `${objType.animation} ${15 + Math.random() * 10}s linear forwards`;
            
            // Create object content
            if (objType.type === 'balloon') {
                object.style.setProperty('--balloon-color', objType.color);
                
                const balloonDiv = document.createElement('div');
                balloonDiv.className = 'balloon-shape';
                
                const textDiv = document.createElement('div');
                textDiv.className = 'balloon-text';
                textDiv.textContent = objType.text;
                balloonDiv.appendChild(textDiv);
                
                const stringDiv = document.createElement('div');
                stringDiv.className = 'balloon-string';
                
                object.appendChild(balloonDiv);
                object.appendChild(stringDiv);
                
            } else if (objType.type === 'fruit') {
                const fruitDiv = document.createElement('div');
                fruitDiv.className = 'fruit-shape';
                fruitDiv.textContent = objType.emoji;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'fruit-text';
                textDiv.textContent = objType.text;
                
                object.appendChild(fruitDiv);
                object.appendChild(textDiv);
            }
            
            // Click event - OPEN AD
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Subtle visual feedback
                this.style.transform = 'scale(1.2)';
                this.style.opacity = '0.7';
                
                // Open ad in new tab
                window.open('https://otieu.com/4/10000770', '_blank');
                
                // Remove object
                setTimeout(() => {
                    if (this.parentNode) {
                        this.remove();
                        activeObjects--;
                    }
                }, 300);
            });
            
            // Remove when animation completes
            const animationDuration = parseFloat(object.style.animation.match(/(\d+\.?\d*)s/)[1]) * 1000;
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, animationDuration);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Start game objects with delay between spawns
        function startGameObjects() {
            gameStarted = true;
            
            // Create objects one by one with delays
            let spawnDelay = 3000; // Start after 3 seconds
            
            // Initial spawns
            setTimeout(() => createFloatingObject(), spawnDelay);
            setTimeout(() => createFloatingObject(), spawnDelay + 4000);
            setTimeout(() => createFloatingObject(), spawnDelay + 8000);
            
            // Continuous spawning with random intervals
            objectInterval = setInterval(() => {
                if (gameStarted && activeObjects < MAX_OBJECTS) {
                    createFloatingObject();
                }
            }, 8000 + Math.random() * 7000); // 8-15 seconds between spawns
        }
        
        // Initialize
        function init() {
            console.log('🎮 Rescue Sharp Turn - Clean Version');
            
            // Hide loader after game loads
            hideLoader();
            
            // Adjust iframe size for better gameplay
            gameFrame.addEventListener('load', function() {
                console.log('✅ Game Loaded - Enjoy!');
                
                // Adjust iframe size based on window
                const resizeGame = () => {
                    const width = Math.min(window.innerWidth - 40, 800);
                    const height = Math.min(window.innerHeight - 60, 600);
                    gameFrame.style.width = `${width}px`;
                    gameFrame.style.height = `${height}px`;
                };
                
                resizeGame();
                window.addEventListener('resize', resizeGame);
            });
        }
        
        // Event Listeners
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Prevent objects from spawning over game area on hover
        gameFrame.addEventListener('mouseenter', function() {
            // Could add logic here if needed
        });
        
        // Start everything
        init();
    </script>
</body>
</html>
