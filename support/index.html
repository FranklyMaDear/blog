<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Καφετέρια Rewards</title>
    
    <!-- ADSTERRA CODE (Βάλε το ΔΙΚΟ ΣΟΥ key) -->
    <script type="text/javascript">
    atOptions = {
        'key' : '5443658', <!-- ΑΛΛΑΞΕ ΑΥΤΟ -->
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
    };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/5443658/invoke.js"></script>
    
    <style>
        /* Ίδια CSS όπως πριν */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(90deg, #8B4513 0%, #D2691E 100%); color: white; padding: 40px 20px; text-align: center; }
        .points-display { font-size: 5rem; color: #D2691E; font-weight: bold; margin: 20px 0; }
        .action-btn { background: #4CAF50; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☕ Καφετέρια Rewards</h1>
            <p>Κέρδισε πόντους για δωρεάν καφέδες!</p>
        </div>
        
        <div style="padding: 30px; text-align: center;">
            <div class="points-display" id="pointsDisplay">0</div>
            <p>Πόντοι: <span id="points">0</span>/50 για καφέ</p>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 30px;">
            <div style="background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center;">
                <div style="font-size: 3rem;">📺</div>
                <h3 style="color: #8B4513;">Δες Βίντεο</h3>
                <p style="background: #FFD700; padding: 5px 15px; border-radius: 20px; display: inline-block; margin: 10px 0;">+1 Πόντος</p>
                <button class="action-btn" onclick="watchVideoAd()">▶️ Ξεκίνα Βίντεο</button>
            </div>
            
            <div style="background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center;">
                <div style="font-size: 3rem;">📝</div>
                <h3 style="color: #8B4513;">Έρευνα</h3>
                <p style="background: #FFD700; padding: 5px 15px; border-radius: 20px; display: inline-block; margin: 10px 0;">+3 Πόντοι</p>
                <button class="action-btn" onclick="completeSurvey()">✏️ Ξεκίνα Έρευνα</button>
            </div>
        </div>
        
        <button id="redeemBtn" style="background: #2E7D32; color: white; padding: 20px; font-size: 1.5rem; border: none; width: 100%; cursor: pointer;" onclick="redeemCoffee()" disabled>
            ☕ ΕΞΑΡΓΥΡΩΣΗ ΚΑΦΕ (50 πόντοι)
        </button>
    </div>

    <script>
        let points = parseInt(localStorage.getItem('coffeePoints')) || 0;
        
        // ΒΑΛΕ ΤΑ ΔΙΚΑ ΣΟΥ LINKS ΕΔΩ:
        const LINKS = {
            video: 'https://adsterra.com/video-offer', // Βάλε το δικό σου video link
            survey: 'https://adsterra.com/survey-offer', // Βάλε το δικό σου survey link
            game: 'https://adsterra.com/cpa/game123' // Βάλε το δικό σου CPA link
        };
        
        function watchVideoAd() {
            // Άνοιγμα πραγματικού video ad
            window.open(LINKS.video, '_blank');
            
            setTimeout(() => {
                const confirmed = confirm('Ολοκλήρωσες το βίντεο; (OK για +1 πόντο)');
                if (confirmed) {
                    points += 1;
                    savePoints();
                    alert('+1 Πόντος! Σύνολο: ' + points);
                }
            }, 35000);
        }
        
        function completeSurvey() {
            // Άνοιγμα πραγματικού survey
            window.open(LINKS.survey, '_blank');
            
            setTimeout(() => {
                const confirmed = confirm('Ολοκλήρωσες την έρευνα; (OK για +3 πόντους)');
                if (confirmed) {
                    points += 3;
                    savePoints();
                    alert('+3 Πόντοι! Σύνολο: ' + points);
                }
            }, 120000);
        }
        
        function savePoints() {
            localStorage.setItem('coffeePoints', points);
            document.getElementById('pointsDisplay').textContent = points;
            document.getElementById('points').textContent = points;
            document.getElementById('redeemBtn').disabled = points < 50;
        }
        
        function redeemCoffee() {
            if (points >= 50) {
                points -= 50;
                savePoints();
                alert('✅ Εξαργύρωση επιτυχής! Στείλε μας μήνυμα στο Instagram για να παραλάβεις τον καφέ σου.');
            }
        }
        
        // Αρχικοποίηση
        savePoints();
    </script>
</body>
</html>
