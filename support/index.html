<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorting Xmas Balls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Minimal Floating Objects */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 51;
            opacity: 0.85;
            will-change: transform;
        }
        
        .floating-object:active {
            transform: scale(1.2);
            opacity: 1;
        }
        
        /* Simple Balloon */
        .balloon {
            width: 50px;
            height: 60px;
            background: var(--balloon-color);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .balloon:after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: #666;
        }
        
        /* Simple Star */
        .star {
            width: 45px;
            height: 45px;
            background: var(--star-color);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        
        /* Simple Gift Box */
        .gift {
            width: 50px;
            height: 50px;
            background: var(--gift-color);
            position: relative;
            border-radius: 5px;
        }
        
        .gift:before {
            content: '';
            position: absolute;
            width: 100%;
            height: 10px;
            background: var(--ribbon-color);
            top: 50%;
            transform: translateY(-50%);
        }
        
        .gift:after {
            content: '';
            position: absolute;
            width: 10px;
            height: 100%;
            background: var(--ribbon-color);
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Object Animations */
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x));
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            90% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x));
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x));
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            90% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x));
                opacity: 0;
            }
        }
        
        @keyframes floatLeft {
            0% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--start-y));
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            90% {
                opacity: 0.85;
            }
            100% {
                transform: translateX(-100px) translateY(var(--end-y));
                opacity: 0;
            }
        }
        
        @keyframes floatRight {
            0% {
                transform: translateX(-100px) translateY(var(--start-y));
                opacity: 0;
            }
            10% {
                opacity: 0.85;
            }
            90% {
                opacity: 0.85;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y));
                opacity: 0;
            }
        }
        
        /* Hide on mobile if game is playing */
        @media (max-width: 768px) {
            .balloon {
                width: 45px;
                height: 55px;
            }
            
            .star, .gift {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/a508edbaeb1d4213aecebbe4115670c2/?gd_sdk_referrer_url=https://gamedistribution.com/games/sorting-xmas-balls/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen *"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">Sorting Xmas Balls</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Objects Container -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameLoaded = false;
        let objectsStarted = false;
        let activeObjects = 0;
        const MAX_OBJECTS = 3;
        let objectInterval;
        
        // Configuration
        const OBJECT_START_DELAY = 90000; // 1.5 λεπτά = 90 δευτερόλεπτα
        
        // Initialize
        function init() {
            console.log('🎮 Initializing game...');
            
            // Set game to full screen
            setupFullScreenGame();
            
            // Game frame loaded
            gameFrame.addEventListener('load', () => {
                console.log('✅ Game loaded');
                gameLoaded = true;
                
                // Hide loader after 2 seconds
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        
                        // Start objects after 1.5 minutes
                        setTimeout(startFloatingObjects, OBJECT_START_DELAY);
                        console.log(`⏰ Objects will start in ${OBJECT_START_DELAY/1000} seconds`);
                    }, 500);
                }, 2000);
            });
            
            // Fallback - hide loader after 5 seconds
            setTimeout(() => {
                if (!gameLoaded) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        gameLoaded = true;
                        
                        // Start objects after 1.5 minutes
                        setTimeout(startFloatingObjects, OBJECT_START_DELAY);
                    }, 500);
                }
            }, 5000);
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            // Ensure game takes full screen
            gameFrame.style.width = '100vw';
            gameFrame.style.height = '100vh';
            
            // Handle orientation changes
            window.addEventListener('resize', () => {
                gameFrame.style.width = '100vw';
                gameFrame.style.height = '100vh';
            });
        }
        
        // Create floating object
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS || !objectsStarted) return;
            
            const objectTypes = [
                {
                    type: 'balloon',
                    color: 'radial-gradient(circle at 30% 30%, #ff3333, #cc0000)',
                    animation: 'floatDown',
                    duration: 20 + Math.random() * 15
                },
                {
                    type: 'balloon',
                    color: 'radial-gradient(circle at 30% 30%, #4CAF50, #2E7D32)',
                    animation: 'floatUp',
                    duration: 22 + Math.random() * 12
                },
                {
                    type: 'balloon',
                    color: 'radial-gradient(circle at 30% 30%, #2196F3, #1976D2)',
                    animation: 'floatDown',
                    duration: 18 + Math.random() * 14
                },
                {
                    type: 'star',
                    color: 'radial-gradient(circle at 50% 50%, #FFD700, #FFA500)',
                    animation: 'floatUp',
                    duration: 16 + Math.random() * 16
                },
                {
                    type: 'gift',
                    color: '#FF5722',
                    ribbon: '#FFC107',
                    animation: 'floatLeft',
                    duration: 24 + Math.random() * 10
                },
                {
                    type: 'gift',
                    color: '#E91E63',
                    ribbon: '#00BCD4',
                    animation: 'floatRight',
                    duration: 21 + Math.random() * 13
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            const object = document.createElement('div');
            object.className = `floating-object ${objType.type}`;
            
            // Set colors based on type
            if (objType.type === 'balloon' || objType.type === 'star') {
                object.style.cssText = `--${objType.type}-color: ${objType.color}`;
            } else if (objType.type === 'gift') {
                object.style.cssText = `--gift-color: ${objType.color}; --ribbon-color: ${objType.ribbon}`;
            }
            
            // Random position and animation parameters
            let styleProperties = '';
            
            switch(objType.animation) {
                case 'floatDown':
                case 'floatUp':
                    const startX = Math.random() * window.innerWidth;
                    const endX = startX + (Math.random() * 100 - 50);
                    object.style.setProperty('--start-x', `${startX}px`);
                    object.style.setProperty('--end-x', `${endX}px`);
                    break;
                    
                case 'floatLeft':
                case 'floatRight':
                    const startY = Math.random() * window.innerHeight;
                    const endY = startY + (Math.random() * 100 - 50);
                    object.style.setProperty('--start-y', `${startY}px`);
                    object.style.setProperty('--end-y', `${endY}px`);
                    break;
            }
            
            // Set animation
            object.style.left = '0px';
            object.style.top = '0px';
            object.style.animation = `${objType.animation} ${objType.duration}s linear forwards`;
            
            // Click event
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                this.style.transform = 'scale(1.3)';
                this.style.opacity = '0.7';
                
                // Open ad
                window.open('https://otieu.com/4/10000770', '_blank');
                
                // Remove object
                setTimeout(() => {
                    if (this.parentNode) {
                        this.remove();
                        activeObjects--;
                    }
                }, 300);
            });
            
            // Touch feedback
            object.addEventListener('touchstart', function() {
                this.style.transform = 'scale(1.1)';
            });
            
            object.addEventListener('touchend', function() {
                this.style.transform = 'scale(1.2)';
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, objType.duration * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Start floating objects after 1.5 minutes
        function startFloatingObjects() {
            objectsStarted = true;
            console.log('🎈 Starting floating objects after 1.5 minutes...');
            
            // Initial objects
            setTimeout(() => createFloatingObject(), 0);
            setTimeout(() => createFloatingObject(), 2000);
            
            // Continuous spawn every 10-15 seconds
            objectInterval = setInterval(() => {
                if (objectsStarted && activeObjects < MAX_OBJECTS) {
                    createFloatingObject();
                }
            }, 10000 + Math.random() * 5000);
        }
        
        // Start everything
        init();
    </script>
</body>
</html>
