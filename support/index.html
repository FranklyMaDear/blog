<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        /* Popup Banner - Slides down from top */
        .popup-banner {
            position: fixed;
            top: -100px;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #ff4161, #ff8c00);
            color: white;
            padding: 15px 20px;
            z-index: 90;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-bottom: 3px solid #ffcc00;
            transition: top 0.5s ease;
            text-align: center;
        }
        
        .popup-banner.show {
            top: 0;
        }
        
        .banner-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        
        .banner-icon {
            background: #ffcc00;
            color: #ff4161;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .banner-text {
            flex: 1;
            text-align: center;
        }
        
        .banner-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 3px;
            color: white;
        }
        
        .banner-subtitle {
            font-size: 14px;
            opacity: 0.9;
            color: #ffcc00;
        }
        
        .banner-button {
            background: #1a5fb4;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .banner-button:hover {
            background: #26a269;
            transform: scale(1.05);
        }
        
        .close-banner {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        
        .close-banner:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Floating Objects - Fewer and more stylish */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            z-index: 81;
            animation: floatUp 25s linear infinite;
        }
        
        .floating-object:hover {
            transform: scale(1.4);
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Balloon Objects */
        .balloon-red {
            width: 60px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, #ff3333, #cc0000);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
        }
        
        .balloon-red:before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 40px;
            background: #666;
        }
        
        .balloon-blue {
            width: 60px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, #4cc9f0, #1a5fb4);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
        }
        
        .balloon-blue:before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 40px;
            background: #666;
        }
        
        .balloon-green {
            width: 60px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, #4CAF50, #2E7D32);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
        }
        
        .balloon-green:before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 40px;
            background: #666;
        }
        
        /* Simple Fruit Objects */
        .fruit-simple {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #FF9800, #FF5722);
            border-radius: 50%;
            position: relative;
        }
        
        .fruit-simple:after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        
        /* Simple Flower */
        .flower-simple {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #E91E63, #C2185B);
            border-radius: 50%;
            position: relative;
        }
        
        .flower-simple:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #FFEB3B;
            border-radius: 50%;
        }
        
        /* Object Glow Effect */
        .object-glow {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: inherit;
            border-radius: inherit;
            filter: blur(12px);
            opacity: 0.4;
            z-index: -1;
            animation: gentlePulse 2s infinite alternate;
        }
        
        @keyframes gentlePulse {
            from { opacity: 0.3; transform: scale(1); }
            to { opacity: 0.5; transform: scale(1.05); }
        }
        
        /* Object Label */
        .object-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffcc00;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .floating-object:hover .object-label {
            opacity: 1;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- LOADING SCREEN -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div>Φόρτωση Royal Garden Match 2...</div>
            </div>
            
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- POPUP BANNER -->
    <div class="popup-banner" id="popupBanner">
        <div class="banner-content">
            <div class="banner-icon">!</div>
            <div class="banner-text">
                <div class="banner-title">🎮 Διαφημίσεις για να Συνεχίσει το Παιχνίδι Δωρεάν!</div>
                <div class="banner-subtitle">Κάθε διαφήμιση βοηθάει στη συντήρηση και βελτίωση του παιχνιδιού</div>
            </div>
            <button class="banner-button" id="bannerButton">Υποστηρίξτε τώρα</button>
            <button class="close-banner" id="closeBanner">×</button>
        </div>
    </div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const loadingScreen = document.getElementById('loadingScreen');
        const gameFrame = document.getElementById('gameFrame');
        const popupBanner = document.getElementById('popupBanner');
        const closeBanner = document.getElementById('closeBanner');
        const bannerButton = document.getElementById('bannerButton');
        const floatingObjects = document.getElementById('floatingObjects');
        
        // Game State
        let gameLoaded = false;
        let bannerInterval;
        let floatingInterval;
        let adScriptLoaded = false;
        let activeObjects = 0;
        const MAX_OBJECTS = 3; // Fewer floating objects
        
        // Load your ad script (Zone: 182432)
        function loadAdScript() {
            if (adScriptLoaded) return;
            
            console.log('📢 Φόρτωση διαφημιστικού script (Zone: 182432)...');
            
            const adScript = document.createElement('script');
            adScript.src = 'https://quge5.com/88/tag.min.js';
            adScript.setAttribute('data-zone', '182432');
            adScript.setAttribute('data-cfasync', 'false');
            adScript.async = true;
            
            adScript.onload = function() {
                console.log('✅ Διαφημιστικό script φορτώθηκε (Zone: 182432)');
                adScriptLoaded = true;
            };
            
            adScript.onerror = function() {
                console.log('❌ Σφάλμα φόρτωσης script');
            };
            
            document.head.appendChild(adScript);
        }
        
        // Open ad in new window
        function openAdInNewWindow() {
            console.log('🎯 Άνοιγμα διαφήμισης σε νέο παράθυρο');
            
            // Load the script first if not loaded
            if (!adScriptLoaded) {
                loadAdScript();
            }
            
            // Open in new window (popup)
            const popupWindow = window.open('', '_blank', 'width=728,height=400,left=100,top=100');
            
            if (popupWindow) {
                // Create HTML with your script and ad content
                popupWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Υποστήριξη Παιχνιδιού</title>
                        <meta charset="UTF-8">
                        <style>
                            body { 
                                margin: 0; 
                                padding: 0; 
                                background: linear-gradient(135deg, #1a1a2e, #16213e);
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                min-height: 100vh;
                                font-family: Arial, sans-serif;
                                color: white;
                            }
                            .ad-container {
                                text-align: center;
                                padding: 30px;
                                background: rgba(255, 255, 255, 0.1);
                                backdrop-filter: blur(10px);
                                border-radius: 15px;
                                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                                max-width: 700px;
                                margin: 20px;
                            }
                            .thank-you {
                                color: #4cc9f0;
                                font-size: 24px;
                                margin-bottom: 15px;
                                font-weight: bold;
                            }
                            .support-text {
                                color: #b8b8b8;
                                margin-bottom: 25px;
                                line-height: 1.6;
                                font-size: 16px;
                            }
                            .ad-box {
                                background: rgba(255, 255, 255, 0.05);
                                padding: 20px;
                                border-radius: 10px;
                                margin: 20px 0;
                                min-height: 250px;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                            }
                            .close-btn {
                                background: linear-gradient(90deg, #ff4161, #ff8c00);
                                color: white;
                                border: none;
                                padding: 12px 40px;
                                border-radius: 25px;
                                cursor: pointer;
                                font-weight: bold;
                                font-size: 16px;
                                transition: transform 0.3s;
                                margin-top: 20px;
                            }
                            .close-btn:hover {
                                transform: scale(1.05);
                            }
                            .auto-close {
                                color: #4cc9f0;
                                font-size: 14px;
                                margin-top: 15px;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="ad-container">
                            <div class="thank-you">🎮 Ευχαριστούμε για την Υποστήριξη!</div>
                            <div class="support-text">
                                Κάθε διαφήμιση που βλέπετε βοηθάει να παραμείνει το παιχνίδι<br>
                                <strong>δωρεάν για όλους</strong> και να αναπτύσσονται νέα features!
                            </div>
                            <div class="ad-box" id="adBox">
                                <div style="color: #4cc9f0;">
                                    📢 Η διαφήμιση φορτώνεται...<br>
                                    <small>Παρακαλώ περιμένετε λίγα δευτερόλεπτα</small>
                                </div>
                            </div>
                            <button class="close-btn" onclick="window.close()">Κλείσιμο & Επιστροφή στο Παιχνίδι</button>
                            <div class="auto-close">⏰ Αυτόματο κλείσιμο σε 25 δευτερόλεπτα</div>
                        </div>
                        <script src="https://quge5.com/88/tag.min.js" data-zone="182432" async data-cfasync="false"><\/script>
                        <script>
                            // Auto-close after 25 seconds
                            setTimeout(() => {
                                window.close();
                            }, 25000);
                        <\/script>
                    </body>
                    </html>
                `);
                
                // Focus on the popup
                popupWindow.focus();
                
            } else {
                // If popup blocked, try to show a subtle notification
                console.log('⚠️ Popup blocked');
                showTempMessage('🎯 Παρακαλώ επιτρέψτε τα pop-ups για να υποστηρίξετε το παιχνίδι!');
            }
        }
        
        // Show temporary message
        function showTempMessage(message) {
            const msgDiv = document.createElement('div');
            msgDiv.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(255, 65, 97, 0.9);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                z-index: 10000;
                font-weight: bold;
                text-align: center;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            `;
            msgDiv.textContent = message;
            document.body.appendChild(msgDiv);
            
            setTimeout(() => {
                if (msgDiv.parentNode) {
                    msgDiv.parentNode.removeChild(msgDiv);
                }
            }, 3000);
        }
        
        // Show/Hide Popup Banner
        function showPopupBanner() {
            popupBanner.classList.add('show');
            
            // Auto-hide after 20 seconds
            setTimeout(() => {
                hidePopupBanner();
            }, 20000);
        }
        
        function hidePopupBanner() {
            popupBanner.classList.remove('show');
        }
        
        // Schedule banner appearances
        function scheduleBanner() {
            // Show first banner after 15 seconds
            setTimeout(() => {
                if (gameLoaded) {
                    showPopupBanner();
                }
            }, 15000);
            
            // Then show every 4-6 minutes
            bannerInterval = setInterval(() => {
                if (gameLoaded) {
                    showPopupBanner();
                }
            }, 240000 + Math.random() * 120000);
        }
        
        // Create floating objects (fewer)
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS) return;
            
            const objectTypes = ['balloon-red', 'balloon-blue', 'balloon-green', 'fruit-simple', 'flower-simple'];
            const type = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            
            const object = document.createElement('div');
            object.className = `floating-object ${type}`;
            
            // Random position and animation
            const startX = Math.random() * (window.innerWidth - 100);
            const delay = Math.random() * 5;
            const duration = 20 + Math.random() * 10;
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Add label
            const label = document.createElement('div');
            label.className = 'object-label';
            label.textContent = '🎯 Κλικ για υποστήριξη';
            object.appendChild(label);
            
            // Add glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Click event to open ad
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Add click animation
                this.style.transform = 'scale(1.6) rotate(45deg)';
                this.style.opacity = '0.5';
                
                // Open ad in new window
                setTimeout(() => {
                    openAdInNewWindow();
                    this.remove();
                    activeObjects--;
                }, 300);
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Schedule floating objects creation (fewer)
        function scheduleFloatingObjects() {
            // Create objects every 20-30 seconds
            floatingInterval = setInterval(() => {
                if (gameLoaded && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                    // Create only 1 object at a time
                    createFloatingObject();
                }
            }, 20000 + Math.random() * 10000);
        }
        
        // Initialize game
        function initGame() {
            console.log('🎮 Παιχνίδι έτοιμο!');
            gameLoaded = true;
            
            // Load your ad script (Zone: 182432)
            loadAdScript();
            
            // Start banner schedule
            scheduleBanner();
            
            // Start floating objects (fewer)
            scheduleFloatingObjects();
            
            // Create initial objects (only 2)
            setTimeout(() => {
                createFloatingObject();
            }, 5000);
            
            setTimeout(() => {
                createFloatingObject();
            }, 10000);
        }
        
        // Event Listeners
        gameFrame.addEventListener('load', function() {
            console.log('✅ Παιχνίδι φορτώθηκε');
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                initGame();
            }, 2000);
        });
        
        gameFrame.addEventListener('error', function() {
            console.log('❌ Σφάλμα φόρτωσης παιχνιδιού');
            loadingScreen.innerHTML = `
                <div style="text-align: center;">
                    <div style="color: #ff4161; font-size: 20px; margin-bottom: 20px;">
                        Σφάλμα φόρτωσης
                    </div>
                    <button onclick="location.reload()" 
                            style="background: #4cc9f0; color: white; border: none; 
                                   padding: 10px 20px; border-radius: 20px; cursor: pointer;">
                        Ανανέωση Σελίδας
                    </button>
                </div>
            `;
        });
        
        // Banner button events
        bannerButton.addEventListener('click', function() {
            openAdInNewWindow();
            hidePopupBanner();
        });
        
        closeBanner.addEventListener('click', function() {
            hidePopupBanner();
        });
        
        // Prevent clicks on game frame from bubbling
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Initial message
        console.log('🎮 Royal Garden Match 2');
        console.log('🎯 Popup Banner + Λιγότερα Ιπτάμενα Αντικείμενα');
        console.log('📢 Ad Script Zone: 182432');
        
        // Auto-hide loading screen
        setTimeout(() => {
            if (!gameLoaded) {
                loadingScreen.classList.add('hidden');
                initGame();
            }
        }, 5000);
        
        // Handle visibility change
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && gameLoaded) {
                // Resume creating objects when tab becomes visible
                scheduleFloatingObjects();
            }
        });
    </script>
</body>
</html>
