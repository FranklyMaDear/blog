<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foxy Eco Sort - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Play Button - Νέα προσθήκη */
        .play-button-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
            transition: opacity 0.5s ease;
        }
        
        .play-button {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 20px 50px;
            cursor: pointer;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(76, 175, 80, 0.6);
        }
        
        .play-button:active {
            transform: scale(0.95);
        }
        
        .play-instruction {
            color: #fff;
            font-size: 16px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
            opacity: 0.8;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.3s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Leaves Container */
        #floatingLeaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
        }
        
        /* Leaf Objects - ΒΕΛΤΙΩΜΕΝΑ */
        .leaf-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: manipulation;
            z-index: 51;
            opacity: 0.9;
            will-change: transform, opacity, filter;
            filter: drop-shadow(2px 2px 8px rgba(0,0,0,0.4));
            
            /* Νέα 3D εφέ */
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 0.3s ease,
                        filter 0.3s ease;
            
            /* Αναλαμπή */
            animation: leafPulse 4s infinite alternate ease-in-out;
        }
        
        /* Εφέ hover για desktop */
        .leaf-object:hover {
            transform: scale(1.15) rotateY(15deg) rotateX(8deg) !important;
            filter: drop-shadow(0 10px 15px rgba(76, 175, 80, 0.5)) brightness(1.1);
            z-index: 52;
        }
        
        /* Εφέ πατήματος */
        .leaf-object:active {
            transform: scale(1.3) rotateY(25deg) !important;
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(76, 175, 80, 0.8));
            animation: clickPulse 0.4s ease-out;
        }
        
        /* ΒΕΛΤΙΩΜΕΝΑ Green Leaf Styles */
        .green-leaf {
            width: 80px;
            height: 80px;
            position: relative;
            background: linear-gradient(135deg, #4CAF50, #2E7D32, #1B5E20);
            border-radius: 50% 0 50% 50%;
            transform: rotate(var(--rotation)) scale(1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            overflow: hidden;
            
            /* Διαφανές στρώμα για βάθος */
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.1),
                inset 0 0 40px rgba(0, 0, 0, 0.2),
                0 5px 15px rgba(0, 0, 0, 0.3);
            
            /* Βελτιωμένη υφή */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.2) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.1) 0%, transparent 20%);
        }
        
        /* Ad text inside leaf - ΒΕΛΤΙΩΜΕΝΟ */
        .ad-text {
            color: white;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            text-shadow: 
                1px 1px 3px rgba(0,0,0,0.8),
                0 0 10px rgba(255,255,255,0.3);
            padding: 8px;
            line-height: 1.3;
            z-index: 3;
            position: relative;
            letter-spacing: 0.5px;
            
            /* Γραμμική κινούμενη κάρτα εφέ */
            display: inline-block;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            text-transform: uppercase;
        }
        
        .leaf-object:hover .ad-text {
            transform: translateZ(20px) scale(1.1);
        }
        
        /* Βελτιωμένο leaf stem */
        .leaf-stem {
            position: absolute;
            width: 5px;
            height: 30px;
            background: linear-gradient(to bottom, #8B4513, #5D4037, #3E2723);
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
            box-shadow: 
                inset 0 0 5px rgba(0,0,0,0.3),
                0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* Βελτιωμένα leaf veins */
        .leaf-veins {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            z-index: 1;
        }
        
        .vein {
            position: absolute;
            background: linear-gradient(to right, #1B5E20, #4CAF50);
            border-radius: 1px;
            box-shadow: 0 0 3px rgba(27, 94, 32, 0.5);
        }
        
        .vein-main {
            width: 4px;
            height: 75%;
            top: 12.5%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, #1B5E20, #81C784);
        }
        
        .vein-side {
            width: 2px;
            height: 45%;
            background: linear-gradient(to bottom, #388E3C, #81C784);
        }
        
        .vein-side:nth-child(2) { 
            top: 20%; 
            left: 25%; 
            transform: rotate(-25deg); 
            height: 40%;
        }
        .vein-side:nth-child(3) { 
            top: 20%; 
            right: 25%; 
            transform: rotate(25deg); 
            height: 40%;
        }
        .vein-side:nth-child(4) { 
            top: 45%; 
            left: 15%; 
            transform: rotate(-40deg); 
            height: 35%;
        }
        .vein-side:nth-child(5) { 
            top: 45%; 
            right: 15%; 
            transform: rotate(40deg); 
            height: 35%;
        }
        
        /* Βελτιωμένο Simple Green Orb */
        .green-orb {
            width: 70px;
            height: 70px;
            position: relative;
            background: 
                radial-gradient(circle at 25% 25%, #66BB6A, #388E3C 45%, #1B5E20 80%);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 30px rgba(102, 187, 106, 0.6),
                inset 0 0 25px rgba(255, 255, 255, 0.15);
        }
        
        /* Βελτιωμένο Eco Badge */
        .eco-badge {
            width: 65px;
            height: 65px;
            position: relative;
            background: linear-gradient(135deg, #43A047, #1B5E20);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 3px solid #C8E6C9;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(67, 160, 71, 0.4);
        }
        
        /* Βελτιωμένο Simple Green Square */
        .green-square {
            width: 60px;
            height: 60px;
            position: relative;
            background: linear-gradient(45deg, #81C784, #4CAF50);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(var(--rotation));
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }
        
        /* ΒΕΛΤΙΩΜΕΝΕΣ ΚΙΝΗΣΕΙΣ ΚΑΙ ΕΦΕ */
        
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatSide {
            0% {
                transform: translateX(-100px) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y)) rotate(180deg);
                opacity: 0;
            }
        }
        
        /* Αναλαμπή (pulse glow) */
        @keyframes leafPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 10px rgba(76, 175, 80, 0.3));
            }
            50% { 
                filter: drop-shadow(0 0 25px rgba(76, 175, 80, 0.7));
            }
        }
        
        /* Κλικ animation */
        @keyframes clickPulse {
            0% { 
                transform: scale(1.1); 
                filter: drop-shadow(0 0 15px rgba(76, 175, 80, 0.5));
            }
            50% { 
                transform: scale(1.3); 
                filter: drop-shadow(0 0 30px rgba(76, 175, 80, 0.9));
            }
            100% { 
                transform: scale(1.4); 
                opacity: 0.8;
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .green-leaf { width: 70px; height: 70px; }
            .green-orb { width: 65px; height: 65px; }
            .eco-badge { width: 60px; height: 60px; }
            .green-square { width: 55px; height: 55px; }
            .ad-text { font-size: 11px; padding: 6px; }
            .loader-text { font-size: 20px; }
            .play-button { font-size: 20px; padding: 15px 40px; }
            
            .leaf-object:hover {
                transform: scale(1.1) !important;
            }
        }
        
        @media (max-width: 480px) {
            .green-leaf { width: 65px; height: 65px; }
            .green-orb { width: 60px; height: 60px; }
            .eco-badge { width: 55px; height: 55px; }
            .green-square { width: 50px; height: 50px; }
            .ad-text { font-size: 10px; padding: 5px; }
            .loader-text { font-size: 18px; }
            .play-button { font-size: 18px; padding: 12px 30px; }
            .play-instruction { font-size: 14px; }
            
            .leaf-stem {
                height: 25px;
                bottom: -25px;
            }
        }
    </style>
</head>
<body>
    <!-- Play Button Container - Νέα προσθήκη -->
    <div class="play-button-container" id="playButtonContainer">
        <button class="play-button" id="playButton">
            ▶ PLAY GAME
        </button>
        <div class="play-instruction">
            Click PLAY to start the game. Green bonus leaves will appear during gameplay!
        </div>
    </div>
    
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="about:blank" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">Loading Foxy Eco Sort...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Leaves Container -->
    <div id="floatingLeaves"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingLeaves = document.getElementById('floatingLeaves');
        const playButtonContainer = document.getElementById('playButtonContainer');
        const playButton = document.getElementById('playButton');
        
        // Game State
        let gameLoaded = false;
        let leavesStarted = false;
        let activeLeaves = 0;
        const MAX_LEAVES = 4;
        let leavesInterval;
        
        // Configuration
        const LEAVES_START_DELAY = 30000; // 30 δευτερόλεπτα
        const MONETAG_LINK = 'https://otieu.com/4/10274068';
        
        // Game URLs - Πιθανά URLs για το παιχνίδι
        const GAME_URLS = [
            'https://html5.gamedistribution.com/e0c6fbe378ad4ed5a1325176324a79dd/',
            'https://cdn.htmlgames.com/FoxyEcoSort/',
            'https://games.cdn.famobi.com/html5games/f/foxy-eco-sort/v230/?fg_domain=play.famobi.com&fg_aid=A-T10020',
            'https://play.famobi.com/foxy-eco-sort',
            'https://www.gamezoo.com/games/foxy-eco-sort/play/'
        ];
        
        // Initialize
        function init() {
            console.log('🎮 Initializing Foxy Eco Sort Game...');
            
            // Setup full screen
            setupFullScreenGame();
            
            // Show play button
            playButtonContainer.style.display = 'flex';
            
            // Play button click event
            playButton.addEventListener('click', startGame);
            
            // Also allow clicking the container
            playButtonContainer.addEventListener('click', function(e) {
                if (e.target === this) {
                    startGame();
                }
            });
            
            // Keyboard support
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    startGame();
                }
            });
            
            // Game frame error handling
            gameFrame.addEventListener('error', handleGameError);
            gameFrame.addEventListener('load', handleGameLoad);
        }
        
        // Start game function
        function startGame() {
            console.log('🚀 Starting game...');
            
            // Hide play button
            playButtonContainer.style.opacity = '0';
            setTimeout(() => {
                playButtonContainer.style.display = 'none';
            }, 500);
            
            // Show loader
            loader.style.display = 'flex';
            
            // Try to load game from different sources
            loadGameFromSource(0);
        }
        
        // Try different game sources
        function loadGameFromSource(index) {
            if (index >= GAME_URLS.length) {
                // All sources failed, show error
                handleGameError();
                return;
            }
            
            const gameUrl = GAME_URLS[index];
            console.log(`🔄 Trying game source ${index + 1}: ${gameUrl}`);
            
            // Set iframe src
            gameFrame.src = gameUrl;
            
            // Set timeout for this source
            const timeoutId = setTimeout(() => {
                console.log(`⏱️ Timeout for source ${index + 1}, trying next...`);
                loadGameFromSource(index + 1);
            }, 5000);
            
            // Clear timeout if game loads
            gameFrame.onload = function() {
                clearTimeout(timeoutId);
                console.log(`✅ Game loaded successfully from source ${index + 1}`);
            };
        }
        
        // Handle game load
        function handleGameLoad() {
            console.log('✅ Game iframe loaded');
            
            // Hide loader after short delay
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    gameLoaded = true;
                    
                    // Start leaves after 30 seconds
                    console.log(`⏰ Green bonus leaves will appear in ${LEAVES_START_DELAY/1000} seconds`);
                    setTimeout(startFloatingLeaves, LEAVES_START_DELAY);
                }, 300);
            }, 2000);
        }
        
        // Handle game error
        function handleGameError() {
            console.log('❌ Game failed to load from all sources');
            
            // Hide loader
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                
                // Show play button again with error message
                playButtonContainer.style.display = 'flex';
                setTimeout(() => {
                    playButtonContainer.style.opacity = '1';
                }, 50);
                
                // Update button text
                playButton.textContent = '🔄 RETRY GAME';
                playButton.style.background = 'linear-gradient(135deg, #FF9800, #F57C00)';
                
                // Update instruction
                document.querySelector('.play-instruction').innerHTML = 
                    'Game failed to load. Please check your internet connection and try again.<br>' +
                    'Or play directly at: <a href="https://play.famobi.com/foxy-eco-sort" style="color:#4CAF50;text-decoration:underline;" target="_blank">play.famobi.com/foxy-eco-sort</a>';
            }, 300);
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
            };
            
            updateSize();
            
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateSize, 100);
            });
            
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 150);
            });
        }
        
        // Create green leaf with ad
        function createGreenLeaf() {
            if (activeLeaves >= MAX_LEAVES || !leavesStarted) return;
            
            const leafTypes = [
                { 
                    type: 'green-leaf', 
                    animation: 'floatDown',
                    duration: 18 + Math.random() * 12,
                    adText: 'Click for\nBONUS'
                },
                { 
                    type: 'green-leaf', 
                    animation: 'floatUp', 
                    duration: 20 + Math.random() * 10,
                    adText: 'Watch\nREWARD'
                },
                { 
                    type: 'green-orb', 
                    animation: 'floatDown',
                    duration: 16 + Math.random() * 11,
                    adText: 'GET\nAD'
                },
                { 
                    type: 'eco-badge', 
                    animation: 'floatSide',
                    duration: 22 + Math.random() * 8,
                    adText: 'TAP\nHERE'
                }
            ];
            
            const leafType = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            const rotation = Math.random() * 360;
            
            const leafObject = document.createElement('div');
            leafObject.className = `leaf-object ${leafType.type}`;
            leafObject.style.setProperty('--rotation', `${rotation}deg`);
            
            // Create leaf element
            const leaf = document.createElement('div');
            leaf.className = leafType.type;
            
            // Add details for green leaf
            if (leafType.type === 'green-leaf') {
                leaf.style.animation = 'leafPulse 3s infinite alternate';
                
                // Add veins
                const veins = document.createElement('div');
                veins.className = 'leaf-veins';
                
                const mainVein = document.createElement('div');
                mainVein.className = 'vein vein-main';
                veins.appendChild(mainVein);
                
                for (let i = 0; i < 4; i++) {
                    const sideVein = document.createElement('div');
                    sideVein.className = 'vein vein-side';
                    veins.appendChild(sideVein);
                }
                
                leaf.appendChild(veins);
                
                // Add stem
                const stem = document.createElement('div');
                stem.className = 'leaf-stem';
                leaf.appendChild(stem);
            }
            
            // Add AD text
            const adText = document.createElement('div');
            adText.className = 'ad-text';
            adText.textContent = leafType.adText;
            leaf.appendChild(adText);
            
            leafObject.appendChild(leaf);
            
            // Set position and animation
            if (leafType.animation === 'floatDown' || leafType.animation === 'floatUp') {
                const startX = Math.random() * window.innerWidth;
                const endX = startX + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-x', `${startX}px`);
                leafObject.style.setProperty('--end-x', `${endX}px`);
            } else {
                const startY = Math.random() * window.innerHeight;
                const endY = startY + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-y', `${startY}px`);
                leafObject.style.setProperty('--end-y', `${endY}px`);
            }
            
            leafObject.style.animation = `${leafType.animation} ${leafType.duration}s linear forwards`;
            leafObject.style.left = '0px';
            leafObject.style.top = '0px';
            
            // Click event
            leafObject.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                console.log('🍃 Leaf clicked! Opening ad...');
                
                // Visual feedback
                this.style.animation = 'clickPulse 0.4s ease-out forwards';
                this.style.pointerEvents = 'none';
                
                // Open ad after animation
                setTimeout(() => {
                    window.open(MONETAG_LINK, '_blank', 'noopener,noreferrer');
                    
                    // Remove leaf
                    this.style.opacity = '0';
                    this.style.transform = 'scale(0)';
                    
                    setTimeout(() => {
                        if (this.parentNode) {
                            this.remove();
                            activeLeaves--;
                        }
                    }, 300);
                }, 200);
                
                return false;
            });
            
            // Touch events for mobile
            leafObject.addEventListener('touchstart', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(1.15)';
            }, { passive: false });
            
            // Remove when animation completes
            setTimeout(() => {
                if (leafObject.parentNode) {
                    leafObject.remove();
                    activeLeaves--;
                }
            }, leafType.duration * 1000);
            
            floatingLeaves.appendChild(leafObject);
            activeLeaves++;
        }
        
        // Start floating leaves
        function startFloatingLeaves() {
            if (leavesStarted) return;
            
            leavesStarted = true;
            console.log('🍃 Starting green bonus leaves with ads...');
            
            // Initial leaves
            createGreenLeaf();
            setTimeout(() => createGreenLeaf(), 1000);
            setTimeout(() => createGreenLeaf(), 2000);
            
            // Continuous spawn
            leavesInterval = setInterval(() => {
                if (leavesStarted && activeLeaves < MAX_LEAVES) {
                    createGreenLeaf();
                }
            }, 10000 + Math.random() * 5000);
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Debug info
        console.log('🎮 Foxy Eco Sort Game initialized');
        console.log('🔗 Monetag ad link:', MONETAG_LINK);
        console.log('⏰ Leaves start after:', LEAVES_START_DELAY/1000, 'seconds');
