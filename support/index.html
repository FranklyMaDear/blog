<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foxy Eco Sort - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #0a1929;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1929 0%, #1a3b5a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .loader-subtitle {
            color: #FFD700;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .loader-dots {
            display: flex;
            gap: 12px;
        }
        
        .dot {
            width: 14px;
            height: 14px;
            background: #FF5252;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { background: #4CAF50; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); }
            40% { transform: scale(1.2); }
        }
        
        /* Floating Leaves Container */
        #floatingLeaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Leaf Objects */
        .leaf-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            z-index: 51;
            opacity: 0.9;
            will-change: transform, opacity;
            filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.4));
        }
        
        .leaf-object:active {
            transform: scale(1.3) !important;
            opacity: 1;
            filter: drop-shadow(0 0 15px gold) brightness(1.3);
        }
        
        /* MODERN LEAF STYLES */
        
        /* Crystal Leaf */
        .crystal-leaf {
            width: 70px;
            height: 70px;
            position: relative;
            background: linear-gradient(45deg, 
                rgba(76, 175, 80, 0.9), 
                rgba(76, 175, 80, 0.6),
                rgba(139, 195, 74, 0.8));
            clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);
            transform: rotate(var(--rotation));
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.2),
                0 0 30px rgba(76, 175, 80, 0.3);
        }
        
        .crystal-leaf:before {
            content: '';
            position: absolute;
            width: 3px;
            height: 25px;
            background: linear-gradient(to bottom, #FFD700, #8B4513);
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        
        /* Neon Leaf */
        .neon-leaf {
            width: 65px;
            height: 65px;
            position: relative;
            background: rgba(0, 255, 136, 0.1);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            transform: rotate(var(--rotation));
            border: 3px solid #00ff88;
            box-shadow: 
                0 0 20px #00ff88,
                inset 0 0 15px rgba(0, 255, 136, 0.3);
        }
        
        /* Geometric Leaf */
        .geometric-leaf {
            width: 60px;
            height: 60px;
            position: relative;
            background: linear-gradient(135deg, #FF9800, #FF5722);
            clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 80% 100%, 20% 100%, 0% 50%);
            transform: rotate(var(--rotation));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .geometric-leaf:before {
            content: 'AD';
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        
        .geometric-leaf:after {
            content: '';
            position: absolute;
            width: 3px;
            height: 20px;
            background: #795548;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Sparkle Leaf */
        .sparkle-leaf {
            width: 75px;
            height: 75px;
            position: relative;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 82, 82, 0.9), 
                rgba(255, 82, 82, 0.6));
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            transform: rotate(var(--rotation));
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        
        .sparkle-leaf .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }
        
        .sparkle-leaf .sparkle:nth-child(1) { top: 15px; left: 15px; animation-delay: 0s; }
        .sparkle-leaf .sparkle:nth-child(2) { top: 15px; right: 15px; animation-delay: 0.5s; }
        .sparkle-leaf .sparkle:nth-child(3) { bottom: 15px; left: 15px; animation-delay: 1s; }
        .sparkle-leaf .sparkle:nth-child(4) { bottom: 15px; right: 15px; animation-delay: 1.5s; }
        
        /* Glowing Orb */
        .orb-leaf {
            width: 55px;
            height: 55px;
            position: relative;
            background: radial-gradient(circle at 30% 30%, 
                rgba(33, 150, 243, 0.9), 
                rgba(33, 150, 243, 0.4));
            border-radius: 50%;
            transform: rotate(var(--rotation));
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 0 25px rgba(33, 150, 243, 0.6),
                inset 0 0 15px rgba(255, 255, 255, 0.2);
        }
        
        .orb-leaf:before {
            content: '🎯';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
        }
        
        /* Animations */
        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        
        @keyframes glowPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 20px rgba(76, 175, 80, 0.3),
                    inset 0 0 20px rgba(255, 255, 255, 0.2);
            }
            50% { 
                box-shadow: 
                    0 0 30px rgba(76, 175, 80, 0.6),
                    inset 0 0 30px rgba(255, 255, 255, 0.3);
            }
        }
        
        @keyframes neonPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 15px #00ff88,
                    inset 0 0 15px rgba(0, 255, 136, 0.3);
                border-color: #00ff88;
            }
            50% { 
                box-shadow: 
                    0 0 25px #00ff88,
                    inset 0 0 25px rgba(0, 255, 136, 0.5);
                border-color: #00ffaa;
            }
        }
        
        /* Floating Animations */
        @keyframes floatGentle {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes floatRise {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes floatWave {
            0% {
                transform: translateX(-100px) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y)) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes floatWaveReverse {
            0% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(-100px) translateY(var(--end-y)) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Leaf specific animations */
        .crystal-leaf {
            animation: glowPulse 3s infinite alternate;
        }
        
        .neon-leaf {
            animation: neonPulse 2s infinite alternate;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .crystal-leaf { width: 60px; height: 60px; }
            .neon-leaf { width: 55px; height: 55px; }
            .geometric-leaf { width: 50px; height: 50px; }
            .sparkle-leaf { width: 65px; height: 65px; }
            .orb-leaf { width: 50px; height: 50px; }
            
            .loader-text { font-size: 28px; }
            .loader-subtitle { font-size: 16px; }
        }
        
        @media (max-width: 480px) {
            .crystal-leaf { width: 55px; height: 55px; }
            .neon-leaf { width: 50px; height: 50px; }
            .geometric-leaf { width: 45px; height: 45px; }
            .sparkle-leaf { width: 60px; height: 60px; }
            .orb-leaf { width: 45px; height: 45px; }
            
            .loader-text { font-size: 24px; margin-bottom: 20px; }
            .loader-subtitle { font-size: 14px; margin-bottom: 25px; }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/e0c6fbe378ad4ed5a1325176324a79dd/?gd_sdk_referrer_url=https://gamedistribution.com/games/foxy-eco-sort/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">✨ Foxy Eco Sort ✨</div>
        <div class="loader-subtitle">Loading Eco Adventure...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Leaves Container -->
    <div id="floatingLeaves"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingLeaves = document.getElementById('floatingLeaves');
        
        // Game State
        let gameLoaded = false;
        let leavesStarted = false;
        let activeLeaves = 0;
        const MAX_LEAVES = 5;
        let leavesInterval;
        
        // Configuration
        const LEAVES_START_DELAY = 60000; // 1 λεπτό = 60 δευτερόλεπτα
        const MONETAG_LINK = 'https://otieu.com/4/10274068';
        
        // Initialize
        function init() {
            console.log('✨ Initializing Foxy Eco Sort...');
            
            // Set game to full screen
            setupFullScreenGame();
            
            // Game load handler
            const loadGame = () => {
                if (!gameLoaded) {
                    gameLoaded = true;
                    console.log('✅ Game ready');
                    
                    // Hide loader after 2 seconds
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                            
                            // Start leaves after 1 minute
                            console.log(`⏰ Modern leaves will appear in ${LEAVES_START_DELAY/1000} seconds`);
                            setTimeout(startFloatingLeaves, LEAVES_START_DELAY);
                        }, 500);
                    }, 2000);
                }
            };
            
            // Multiple load detection methods
            gameFrame.addEventListener('load', loadGame);
            setTimeout(loadGame, 3000);
            gameFrame.addEventListener('error', loadGame);
            
            // Prevent context menu
            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.leaf-object')) {
                    e.preventDefault();
                }
            });
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
            };
            
            updateSize();
            window.addEventListener('resize', updateSize);
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 100);
            });
        }
        
        // Create modern floating leaf
        function createModernLeaf() {
            if (activeLeaves >= MAX_LEAVES || !leavesStarted) return;
            
            const leafTypes = [
                { 
                    type: 'crystal-leaf', 
                    name: 'Crystal Leaf',
                    animation: 'floatGentle',
                    duration: 20 + Math.random() * 10
                },
                { 
                    type: 'neon-leaf', 
                    name: 'Neon Leaf',
                    animation: 'floatRise',
                    duration: 18 + Math.random() * 12
                },
                { 
                    type: 'geometric-leaf', 
                    name: 'Geometric AD',
                    animation: 'floatWave',
                    duration: 22 + Math.random() * 8
                },
                { 
                    type: 'sparkle-leaf', 
                    name: 'Sparkle Star',
                    animation: 'floatWaveReverse',
                    duration: 16 + Math.random() * 14
                },
                { 
                    type: 'orb-leaf', 
                    name: 'Target Orb',
                    animation: 'floatGentle',
                    duration: 19 + Math.random() * 11
                }
            ];
            
            const leafType = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            const rotation = Math.random() * 360;
            
            const leafObject = document.createElement('div');
            leafObject.className = `leaf-object ${leafType.type}`;
            leafObject.style.setProperty('--rotation', `${rotation}deg`);
            
            // Create leaf element
            const leaf = document.createElement('div');
            leaf.className = leafType.type;
            
            // Add sparkles for sparkle leaf
            if (leafType.type === 'sparkle-leaf') {
                for (let i = 0; i < 4; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    leaf.appendChild(sparkle);
                }
            }
            
            leafObject.appendChild(leaf);
            
            // Set position and animation
            if (leafType.animation === 'floatGentle' || leafType.animation === 'floatRise') {
                const startX = Math.random() * window.innerWidth;
                const endX = startX + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-x', `${startX}px`);
                leafObject.style.setProperty('--end-x', `${endX}px`);
            } else {
                const startY = Math.random() * window.innerHeight;
                const endY = startY + (Math.random() * 100 - 50);
                leafObject.style.setProperty('--start-y', `${startY}px`);
                leafObject.style.setProperty('--end-y', `${endY}px`);
            }
            
            leafObject.style.animation = `${leafType.animation} ${leafType.duration}s linear forwards`;
            leafObject.style.left = '0px';
            leafObject.style.top = '0px';
            
            // Click event for Monetag ad
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                // Enhanced visual feedback
                leafObject.style.transform = 'scale(1.4) rotate(15deg)';
                leafObject.style.opacity = '0.8';
                leafObject.style.filter = 'drop-shadow(0 0 20px gold) brightness(1.8)';
                
                // Open Monetag ad in new tab
                setTimeout(() => {
                    window.open(MONETAG_LINK, '_blank');
                }, 150);
                
                // Remove leaf with effect
                setTimeout(() => {
                    if (leafObject.parentNode) {
                        leafObject.style.transition = 'all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
                        leafObject.style.transform = 'scale(0) rotate(180deg)';
                        leafObject.style.opacity = '0';
                        
                        setTimeout(() => {
                            if (leafObject.parentNode) {
                                leafObject.remove();
                                activeLeaves--;
                            }
                        }, 500);
                    }
                }, 300);
            };
            
            leafObject.addEventListener('click', handleClick);
            leafObject.addEventListener('touchstart', handleClick, { passive: false });
            
            // Touch feedback
            leafObject.addEventListener('touchstart', function() {
                this.style.transform = 'scale(1.2)';
            }, { passive: true });
            
            leafObject.addEventListener('touchend', function() {
                this.style.transform = 'scale(1.3)';
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (leafObject.parentNode) {
                    leafObject.remove();
                    activeLeaves--;
                }
            }, leafType.duration * 1000);
            
            floatingLeaves.appendChild(leafObject);
            activeLeaves++;
            
            console.log(`🍃 New ${leafType.name} created`);
        }
        
        // Start floating leaves after 1 minute
        function startFloatingLeaves() {
            if (leavesStarted) return;
            
            leavesStarted = true;
            console.log('✨ Starting modern floating leaves...');
            
            // Initial leaves with staggered timing
            setTimeout(() => createModernLeaf(), 0);
            setTimeout(() => createModernLeaf(), 800);
            setTimeout(() => createModernLeaf(), 1600);
            setTimeout(() => createModernLeaf(), 2400);
            
            // Continuous spawn every 7-12 seconds
            leavesInterval = setInterval(() => {
                if (leavesStarted && activeLeaves < MAX_LEAVES) {
                    createModernLeaf();
                }
            }, 7000 + Math.random() * 5000);
        }
        
        // Start everything
        document.addEventListener('DOMContentLoaded', init);
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
