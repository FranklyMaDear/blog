<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foxy Eco Sort - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.3s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Leaves Container */
        #floatingLeaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Leaf Objects */
        .leaf-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            z-index: 51;
            opacity: 0.9;
            will-change: transform, opacity;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        .leaf-object:active {
            transform: scale(1.2) !important;
            opacity: 1;
        }
        
        /* Green Leaf Styles */
        .green-leaf {
            width: 70px;
            height: 70px;
            position: relative;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 50% 0 50% 50%;
            transform: rotate(var(--rotation)) scale(1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        /* Ad text inside leaf */
        .ad-text {
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
            padding: 5px;
            line-height: 1.2;
            z-index: 2;
            position: relative;
        }
        
        /* Leaf stem */
        .leaf-stem {
            position: absolute;
            width: 4px;
            height: 25px;
            background: linear-gradient(to bottom, #8B4513, #5D4037);
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        
        /* Leaf veins */
        .leaf-veins {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.4;
        }
        
        .vein {
            position: absolute;
            background: #1B5E20;
            border-radius: 1px;
        }
        
        .vein-main {
            width: 3px;
            height: 70%;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .vein-side {
            width: 2px;
            height: 40%;
            background: #2E7D32;
        }
        
        .vein-side:nth-child(2) { top: 25%; left: 30%; transform: rotate(-30deg); }
        .vein-side:nth-child(3) { top: 25%; right: 30%; transform: rotate(30deg); }
        .vein-side:nth-child(4) { top: 40%; left: 20%; transform: rotate(-45deg); }
        .vein-side:nth-child(5) { top: 40%; right: 20%; transform: rotate(45deg); }
        
        /* Simple Green Orb */
        .green-orb {
            width: 65px;
            height: 65px;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #66BB6A, #388E3C);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 20px rgba(102, 187, 106, 0.5),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
        }
        
        /* Eco Badge */
        .eco-badge {
            width: 60px;
            height: 60px;
            position: relative;
            background: linear-gradient(135deg, #43A047, #1B5E20);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 2px solid #C8E6C9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Simple Green Square */
        .green-square {
            width: 55px;
            height: 55px;
            position: relative;
            background: linear-gradient(45deg, #81C784, #4CAF50);
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(var(--rotation));
        }
        
        /* Animations */
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatSide {
            0% {
                transform: translateX(-100px) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes leafGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 10px rgba(76, 175, 80, 0.3),
                    inset 0 0 10px rgba(255, 255, 255, 0.1);
            }
            50% { 
                box-shadow: 
                    0 0 20px rgba(76, 175, 80, 0.6),
                    inset 0 0 20px rgba(255, 255, 255, 0.2);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .green-leaf, .green-orb { width: 60px; height: 60px; }
            .eco-badge, .green-square { width: 55px; height: 55px; }
            .ad-text { font-size: 10px; }
            .loader-text { font-size: 20px; }
        }
        
        @media (max-width: 480px) {
            .green-leaf, .green-orb { width: 55px; height: 55px; }
            .eco-badge, .green-square { width: 50px; height: 50px; }
            .ad-text { font-size: 9px; }
            .loader-text { font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/e0c6fbe378ad4ed5a1325176324a79dd/?gd_sdk_referrer_url=https://gamedistribution.com/games/foxy-eco-sort/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">Loading Foxy Eco Sort...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Leaves Container -->
    <div id="floatingLeaves"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingLeaves = document.getElementById('floatingLeaves');
        
        // Game State
        let gameLoaded = false;
        let leavesStarted = false;
        let activeLeaves = 0;
        const MAX_LEAVES = 4;
        let leavesInterval;
        
        // Configuration
        const LEAVES_START_DELAY = 60000; // 1 λεπτό = 60 δευτερόλεπτα
        const MONETAG_LINK = 'https://otieu.com/4/10274068';
        
        // Initialize - Optimized for fast loading
        function init() {
            console.log('🍃 Initializing Foxy Eco Sort...');
            
            // Set game to full screen
            setupFullScreenGame();
            
            // Hide loader quickly - don't wait for game to fully load
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    gameLoaded = true;
                    
                    // Start leaves after 1 minute
                    console.log(`⏰ Green leaves will appear in ${LEAVES_START_DELAY/1000} seconds`);
                    setTimeout(startFloatingLeaves, LEAVES_START_DELAY);
                }, 300);
            }, 1500); // Faster loader (1.5 seconds instead of 2)
            
            // Game frame error handling
            gameFrame.addEventListener('error', () => {
                console.log('⚠️ Game frame error');
            });
            
            // Prevent context menu
            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.leaf-object')) {
                    e.preventDefault();
                }
            });
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
            };
            
            updateSize();
            
            // Throttle resize events
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateSize, 100);
            });
            
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 150);
            });
        }
        
        // Create green leaf with ad text
        function createGreenLeaf() {
            if (activeLeaves >= MAX_LEAVES || !leavesStarted) return;
            
            const leafTypes = [
                { 
                    type: 'green-leaf', 
                    name: 'Green Leaf',
                    animation: 'floatDown',
                    duration: 15 + Math.random() * 10,
                    adText: 'Click for\nAD'
                },
                { 
                    type: 'green-leaf', 
                    name: 'Green Leaf',
                    animation: 'floatUp', 
                    duration: 18 + Math.random() * 8,
                    adText: 'Watch\nAD'
                },
                { 
                    type: 'green-orb', 
                    name: 'Green Orb',
                    animation: 'floatDown',
                    duration: 16 + Math.random() * 9,
                    adText: 'AD Here'
                },
                { 
                    type: 'eco-badge', 
                    name: 'Eco Badge',
                    animation: 'floatSide',
                    duration: 20 + Math.random() * 5,
                    adText: 'Support\nUs'
                },
                { 
                    type: 'green-square', 
                    name: 'Green Square',
                    animation: 'floatUp',
                    duration: 14 + Math.random() * 11,
                    adText: 'Click\nMe'
                }
            ];
            
            const leafType = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            const rotation = Math.random() * 360;
            
            const leafObject = document.createElement('div');
            leafObject.className = `leaf-object ${leafType.type}`;
            leafObject.style.setProperty('--rotation', `${rotation}deg`);
            
            // Create leaf element
            const leaf = document.createElement('div');
            leaf.className = leafType.type;
            
            // Add glow animation to green leaf
            if (leafType.type === 'green-leaf') {
                leaf.style.animation = 'leafGlow 3s infinite alternate';
                
                // Add veins
                const veins = document.createElement('div');
                veins.className = 'leaf-veins';
                
                const mainVein = document.createElement('div');
                mainVein.className = 'vein vein-main';
                veins.appendChild(mainVein);
                
                for (let i = 0; i < 4; i++) {
                    const sideVein = document.createElement('div');
                    sideVein.className = 'vein vein-side';
                    veins.appendChild(sideVein);
                }
                
                leaf.appendChild(veins);
                
                // Add stem
                const stem = document.createElement('div');
                stem.className = 'leaf-stem';
                leaf.appendChild(stem);
            }
            
            // Add AD text inside ALL leaves
            const adText = document.createElement('div');
            adText.className = 'ad-text';
            adText.textContent = leafType.adText;
            leaf.appendChild(adText);
            
            leafObject.appendChild(leaf);
            
            // Set position and animation
            if (leafType.animation === 'floatDown' || leafType.animation === 'floatUp') {
                const startX = Math.random() * window.innerWidth;
                const endX = startX + (Math.random() * 80 - 40);
                leafObject.style.setProperty('--start-x', `${startX}px`);
                leafObject.style.setProperty('--end-x', `${endX}px`);
            } else {
                const startY = Math.random() * window.innerHeight;
                const endY = startY + (Math.random() * 80 - 40);
                leafObject.style.setProperty('--start-y', `${startY}px`);
                leafObject.style.setProperty('--end-y', `${endY}px`);
            }
            
            leafObject.style.animation = `${leafType.animation} ${leafType.duration}s linear forwards`;
            leafObject.style.left = '0px';
            leafObject.style.top = '0px';
            
            // Click event for Monetag ad
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual feedback
                leafObject.style.transform = 'scale(1.25)';
                leafObject.style.opacity = '0.8';
                
                // Open Monetag ad in new tab
                window.open(MONETAG_LINK, '_blank');
                
                // Remove leaf
                setTimeout(() => {
                    if (leafObject.parentNode) {
                        leafObject.remove();
                        activeLeaves--;
                    }
                }, 300);
            };
            
            leafObject.addEventListener('click', handleClick);
            leafObject.addEventListener('touchstart', handleClick, { passive: false });
            
            // Touch feedback
            leafObject.addEventListener('touchstart', function() {
                this.style.transform = 'scale(1.15)';
            }, { passive: true });
            
            // Remove when animation completes
            setTimeout(() => {
                if (leafObject.parentNode) {
                    leafObject.remove();
                    activeLeaves--;
                }
            }, leafType.duration * 1000);
            
            floatingLeaves.appendChild(leafObject);
            activeLeaves++;
        }
        
        // Start floating leaves after 1 minute
        function startFloatingLeaves() {
            if (leavesStarted) return;
            
            leavesStarted = true;
            console.log('🍃 Starting green leaves with ads...');
            
            // Initial leaves
            setTimeout(() => createGreenLeaf(), 0);
            setTimeout(() => createGreenLeaf(), 1000);
            
            // Continuous spawn every 10-15 seconds
            leavesInterval = setInterval(() => {
                if (leavesStarted && activeLeaves < MAX_LEAVES) {
                    createGreenLeaf();
                }
            }, 10000 + Math.random() * 5000);
        }
        
        // Start everything immediately
        document.addEventListener('DOMContentLoaded', init);
        
        // Fallback for fast loading
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
