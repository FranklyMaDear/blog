<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Παιχνίδι με Διαφημίσεις</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }
    .container {
      display: grid;
      grid-template-areas: 
        "top top top"
        "left game right"
        "bottom bottom bottom";
      grid-template-columns: 200px auto 200px;
      grid-template-rows: 100px auto 100px;
      gap: 10px;
      width: 100%;
      max-width: 1200px;
    }
    .ad {
      background-color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #333;
    }
    .top { grid-area: top; }
    .left { grid-area: left; }
    .right { grid-area: right; }
    .bottom { grid-area: bottom; }
    .game {
      grid-area: game;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fff;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="ad top">Διαφήμιση Πάνω</div>
    <div class="ad left">Διαφήμιση Αριστερά</div>
    <div class="game">
      <iframe src="https://html5.gamedistribution.com/5aac1802c4a5449cb57aa14c55731faf/?gd_sdk_referrer_url=https://www.example.com/games/{game-path}" 
              width="800" height="600" scrolling="no" frameborder="0"></iframe>
    </div>
    <div class="ad right">Διαφήμιση Δεξιά</div>
    <div class="ad bottom">Διαφήμιση Κάτω</div>
  </div>
</body>
</html>
