<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Sharp Turn - Free Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c2e 0%, #1a1a4e 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-frame {
            border: none;
            display: block;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.4);
            border-radius: 12px;
            border: 3px solid rgba(0, 200, 255, 0.2);
        }
        
        /* Game Loader */
        .game-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.8s ease-out;
        }
        
        .loader-text {
            color: #00ffea;
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 15px rgba(0, 255, 234, 0.7);
            font-weight: bold;
            animation: textGlow 2s infinite alternate;
        }
        
        @keyframes textGlow {
            0% { text-shadow: 0 0 10px rgba(0, 255, 234, 0.5); }
            100% { text-shadow: 0 0 20px rgba(0, 255, 234, 0.9), 0 0 30px rgba(0, 255, 234, 0.6); }
        }
        
        .loader-dots {
            display: flex;
            gap: 20px;
        }
        
        .dot {
            width: 25px;
            height: 25px;
            background: #00ffea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 0 15px rgba(0, 255, 234, 0.8);
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { 
                transform: scale(0.3);
                opacity: 0.3;
            }
            40% { 
                transform: scale(1.5);
                opacity: 1;
            }
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Center AD Text */
        .center-ad-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 0 30px #ff00ff,
                0 0 40px #ff00ff;
            z-index: 79;
            animation: adPulse 3s infinite alternate;
            pointer-events: none;
            background: linear-gradient(45deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 400% 400%;
            animation: adPulse 3s infinite, gradientMove 8s infinite linear;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 20px 40px;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.1);
        }
        
        @keyframes adPulse {
            0% { 
                transform: translate(-50%, -50%) scale(0.95);
                opacity: 0.8;
            }
            100% { 
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 1;
            }
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Floating Objects - New enhanced style */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 81;
            animation: floatEnhanced 18s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        @keyframes floatEnhanced {
            0% {
                transform: translateY(115vh) translateX(-150px) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) translateX(-100px) rotate(10deg) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(-100px) translateX(100px) rotate(350deg) scale(1);
            }
            100% {
                transform: translateY(-150px) translateX(150px) rotate(360deg) scale(0.8);
                opacity: 0;
            }
        }
        
        .floating-object:hover {
            transform: scale(1.4) rotate(8deg) !important;
            filter: brightness(1.8) drop-shadow(0 0 25px rgba(255, 255, 255, 0.9)) !important;
            animation-play-state: paused;
            z-index: 85;
        }
        
        /* Enhanced Balloon Objects with Flower Effects */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: balloonFloat 12s ease-in-out infinite;
        }
        
        @keyframes balloonFloat {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        .balloon-shape {
            width: 80px;
            height: 90px;
            background: radial-gradient(circle at 30% 30%, var(--balloon-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 -10px 20px rgba(255, 255, 255, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        /* Flower decorations on balloons */
        .flower-decoration {
            position: absolute;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, var(--flower-color));
            border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.5);
        }
        
        .decoration-1 { top: 15px; left: 15px; }
        .decoration-2 { top: 20px; right: 20px; }
        .decoration-3 { bottom: 25px; left: 25px; }
        .decoration-4 { bottom: 15px; right: 15px; }
        
        .balloon-object:hover .balloon-shape {
            transform: scale(1.2);
            box-shadow: 
                inset 0 -10px 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(255, 255, 100, 0.8);
        }
        
        .ads-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-shadow: 
                2px 2px 4px rgba(0,0,0,0.8),
                0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 2px;
            z-index: 2;
        }
        
        .balloon-string {
            position: relative;
            bottom: -5px;
            width: 3px;
            height: 45px;
            background: linear-gradient(to bottom, #aaa, #666);
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .balloon-string:after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: -6px;
            width: 15px;
            height: 15px;
            background: #ddd;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .balloon-label {
            background: linear-gradient(135deg, 
                rgba(0,0,0,0.95) 0%, 
                rgba(50,50,50,0.95) 100%);
            color: var(--balloon-text-color);
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }
        
        /* Fruit Objects - Enhanced */
        .fruit-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fruitBob 8s ease-in-out infinite;
        }
        
        @keyframes fruitBob {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        
        .fruit-shape {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 
                inset 0 -5px 15px rgba(255, 255, 255, 0.3),
                0 8px 25px rgba(0, 0, 0, 0.4);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .fruit-label {
            background: linear-gradient(135deg, 
                rgba(0,0,0,0.95) 0%, 
                rgba(50,50,50,0.95) 100%);
            color: var(--fruit-text-color);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            text-transform: uppercase;
        }
        
        /* Watermelon */
        .fruit-watermelon .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #4CAF50, #2E7D32);
            border: 3px solid #1B5E20;
        }
        
        /* Pineapple */
        .fruit-pineapple .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
            border: 3px solid #FF8C00;
        }
        
        /* Apple */
        .fruit-apple .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3333, #cc0000);
            border: 3px solid #990000;
        }
        
        /* Orange */
        .fruit-orange .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff9800, #ff5722);
            border: 3px solid #E64A19;
        }
        
        /* Strawberry */
        .fruit-strawberry .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #ff3366, #cc0066);
            border: 3px solid #B3005E;
        }
        
        /* Grape */
        .fruit-grape .fruit-shape {
            background: radial-gradient(circle at 30% 30%, #9c27b0, #7b1fa2);
            border: 3px solid #6A1B9A;
        }
        
        /* Glow Effect for all objects */
        .object-glow {
            position: absolute;
            top: -25px;
            left: -25px;
            right: -25px;
            bottom: -25px;
            background: inherit;
            border-radius: inherit;
            filter: blur(30px);
            opacity: 0.4;
            z-index: -1;
            animation: pulseGlow 4s infinite alternate;
        }
        
        @keyframes pulseGlow {
            0% { 
                opacity: 0.2; 
                transform: scale(0.9);
                filter: blur(25px);
            }
            100% { 
                opacity: 0.6; 
                transform: scale(1.1);
                filter: blur(35px);
            }
        }
        
        /* Sound indicator */
        .sound-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            color: white;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            z-index: 90;
            display: none;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        /* Instructions */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: center;
            z-index: 90;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- GAME LOADER -->
    <div class="game-loader" id="gameLoader">
        <div class="loader-text">ADVENTURE AWAITS!</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- CENTER AD TEXT -->
    <div class="center-ad-text">ADVERTISEMENT</div>
    
    <!-- SOUND INDICATOR -->
    <div class="sound-indicator" id="soundIndicator">🎵 Sound Playing</div>
    
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME - Rescue Sharp Turn -->
            <iframe 
                src="https://html5.gamedistribution.com/67b7fb2c6f594ef3a4fcb241e902ce1d/?gd_sdk_referrer_url=https://gamedistribution.com/games/rescue-sharp-turn/" 
                class="game-frame" 
                id="gameFrame"
                width="750"
                height="1334"
                scrolling="none"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- INSTRUCTIONS -->
    <div class="instructions">Click on floating objects to discover surprises!</div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const gameLoader = document.getElementById('gameLoader');
        const floatingObjects = document.getElementById('floatingObjects');
        const soundIndicator = document.getElementById('soundIndicator');
        const centerAdText = document.querySelector('.center-ad-text');
        
        // Game State
        let gameStarted = false;
        let floatingInterval;
        let activeObjects = 0;
        const MAX_OBJECTS = 12; // Even more objects!
        let soundPlayed = false;
        
        // Audio effects
        const balloonPopSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-balloon-pop-2928.mp3');
        const fruitCollectSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3');
        balloonPopSound.volume = 0.3;
        fruitCollectSound.volume = 0.4;
        
        // Hide loader when game loads
        function hideLoader() {
            setTimeout(() => {
                gameLoader.style.opacity = '0';
                setTimeout(() => {
                    gameLoader.style.display = 'none';
                    startFloatingObjects();
                }, 800);
            }, 1800);
        }
        
        // Play sound with indicator
        function playSound(soundType = 'balloon') {
            if (!soundPlayed) {
                if (soundType === 'balloon') {
                    balloonPopSound.currentTime = 0;
                    balloonPopSound.play().catch(e => console.log("Sound autoplay prevented"));
                } else {
                    fruitCollectSound.currentTime = 0;
                    fruitCollectSound.play().catch(e => console.log("Sound autoplay prevented"));
                }
                
                soundPlayed = true;
                
                // Show sound indicator
                soundIndicator.style.display = 'block';
                soundIndicator.textContent = soundType === 'balloon' ? '🎈 Balloon Pop!' : '🍎 Fruit Collected!';
                setTimeout(() => {
                    soundIndicator.style.display = 'none';
                }, 1500);
                
                // Reset sound flag after delay
                setTimeout(() => {
                    soundPlayed = false;
                }, 1000);
            }
        }
        
        // Create enhanced floating objects
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS || !gameStarted) return;
            
            const objectTypes = [
                // Balloons with Flower Decorations
                { 
                    type: 'balloon', 
                    subtype: 'rainbow-balloon', 
                    label: 'CLICK ME!', 
                    color: 'linear-gradient(45deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff)',
                    textColor: '#ffffff',
                    flowerColor: '#ff00ff'
                },
                { 
                    type: 'balloon', 
                    subtype: 'sunset-balloon', 
                    label: 'GET REWARD', 
                    color: 'linear-gradient(45deg, #FF512F, #F09819)',
                    textColor: '#FFD700',
                    flowerColor: '#FF9800'
                },
                { 
                    type: 'balloon', 
                    subtype: 'ocean-balloon', 
                    label: 'WIN PRIZE', 
                    color: 'linear-gradient(45deg, #00B4DB, #0083B0)',
                    textColor: '#00ffff',
                    flowerColor: '#00BCD4'
                },
                { 
                    type: 'balloon', 
                    subtype: 'spring-balloon', 
                    label: 'FREE BONUS', 
                    color: 'linear-gradient(45deg, #FF5E62, #FF9966)',
                    textColor: '#ffcccb',
                    flowerColor: '#FF4081'
                },
                // Fresh Fruits
                { 
                    type: 'fruit', 
                    subtype: 'watermelon', 
                    label: 'WATERMELON', 
                    textColor: '#4CAF50',
                    emoji: '🍉'
                },
                { 
                    type: 'fruit', 
                    subtype: 'pineapple', 
                    label: 'PINEAPPLE', 
                    textColor: '#FFD700',
                    emoji: '🍍'
                },
                { 
                    type: 'fruit', 
                    subtype: 'apple', 
                    label: 'RED APPLE', 
                    textColor: '#ff3333',
                    emoji: '🍎'
                },
                { 
                    type: 'fruit', 
                    subtype: 'orange', 
                    label: 'JUICY ORANGE', 
                    textColor: '#ff9800',
                    emoji: '🍊'
                },
                { 
                    type: 'fruit', 
                    subtype: 'strawberry', 
                    label: 'SWEET STRAWBERRY', 
                    textColor: '#ff3366',
                    emoji: '🍓'
                },
                { 
                    type: 'fruit', 
                    subtype: 'grape', 
                    label: 'GRAPE BUNCH', 
                    textColor: '#9c27b0',
                    emoji: '🍇'
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            const object = document.createElement('div');
            object.className = `floating-object ${objType.type}-object ${objType.type}-${objType.subtype}`;
            
            // Set CSS variables
            if (objType.type === 'balloon') {
                object.style.setProperty('--balloon-color', objType.color);
                object.style.setProperty('--balloon-text-color', objType.textColor);
                object.style.setProperty('--flower-color', objType.flowerColor);
            } else if (objType.type === 'fruit') {
                object.style.setProperty('--fruit-text-color', objType.textColor);
            }
            
            // Random position with varied paths
            const startX = Math.random() * (window.innerWidth - 120);
            const delay = Math.random() * 3;
            const duration = 15 + Math.random() * 8; // Faster for more action
            const startXOffset = -120 + Math.random() * 240;
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Create object based on type
            if (objType.type === 'balloon') {
                const balloonDiv = document.createElement('div');
                balloonDiv.className = 'balloon-shape';
                
                // Add flower decorations
                for (let i = 1; i <= 4; i++) {
                    const flowerDiv = document.createElement('div');
                    flowerDiv.className = `flower-decoration decoration-${i}`;
                    balloonDiv.appendChild(flowerDiv);
                }
                
                const adsDiv = document.createElement('div');
                adsDiv.className = 'ads-text';
                adsDiv.textContent = 'ADS';
                balloonDiv.appendChild(adsDiv);
                
                const stringDiv = document.createElement('div');
                stringDiv.className = 'balloon-string';
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'balloon-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(balloonDiv);
                object.appendChild(stringDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'fruit') {
                const fruitDiv = document.createElement('div');
                fruitDiv.className = 'fruit-shape';
                fruitDiv.textContent = objType.emoji;
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'fruit-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(fruitDiv);
                object.appendChild(labelDiv);
            }
            
            // Add enhanced glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Click event - OPEN MONETAG AD
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Enhanced visual effects
                this.style.transform = 'scale(1.6) rotate(15deg)';
                this.style.opacity = '0.9';
                this.style.filter = 'brightness(2.5) drop-shadow(0 0 40px gold)';
                
                // Play appropriate sound
                playSound(objType.type === 'balloon' ? 'balloon' : 'fruit');
                
                // Open Monetag ad in new tab
                window.open('https://otieu.com/4/10000770', '_blank');
                
                // Enhanced removal effect
                setTimeout(() => {
                    if (this.parentNode) {
                        this.style.transition = 'all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
                        this.style.transform = 'scale(0) rotate(360deg)';
                        this.style.opacity = '0';
                        
                        setTimeout(() => {
                            if (this.parentNode) {
                                this.remove();
                                activeObjects--;
                            }
                        }, 600);
                    }
                }, 400);
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Start floating objects after game starts
        function startFloatingObjects() {
            gameStarted = true;
            
            // Animate center text
            centerAdText.style.animation = 'adPulse 3s infinite alternate, gradientMove 8s infinite linear';
            
            // Create objects very frequently for constant action
            floatingInterval = setInterval(() => {
                if (gameStarted && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                    // Create 2-3 objects at once sometimes
                    const createCount = Math.random() > 0.5 ? 1 : (Math.random() > 0.7 ? 2 : 3);
                    
                    for (let i = 0; i < createCount && activeObjects < MAX_OBJECTS; i++) {
                        setTimeout(() => createFloatingObject(), i * 200);
                    }
                }
            }, 4000 + Math.random() * 3000); // Very frequent!
            
            // Create initial flood of objects
            setTimeout(() => {
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => createFloatingObject(), i * 300);
                }
            }, 500);
        }
        
        // Initialize
        function init() {
            console.log('🎮 Rescue Sharp Turn - Immersive Experience');
            
            // Hide loader after game loads
            hideLoader();
            
            // Start listening for game interactions
            gameFrame.addEventListener('load', function() {
                console.log('✅ Game Loaded - Enjoy the Spectacle!');
            });
        }
        
        // Event Listeners
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Start everything
        init();
    </script>
</body>
</html>
