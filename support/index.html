<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Sharp Turn - Free Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-frame {
            border: none;
            display: block;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
            border-radius: 10px;
        }
        
        /* Game Loader */
        .game-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.8s ease-out;
        }
        
        .loader-text {
            color: #00ffea;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 234, 0.5);
            font-weight: bold;
        }
        
        .loader-dots {
            display: flex;
            gap: 15px;
        }
        
        .dot {
            width: 20px;
            height: 20px;
            background: #00ffea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 0 10px rgba(0, 255, 234, 0.7);
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { 
                transform: scale(0);
                opacity: 0.3;
            }
            40% { 
                transform: scale(1.2);
                opacity: 1;
            }
        }
        
        /* Floating Objects Container */
        #floatingObjects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 80;
        }
        
        /* Floating Objects */
        .floating-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.4s, filter 0.4s;
            z-index: 81;
            animation: floatDiagonal 20s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .floating-object:hover {
            transform: scale(1.3) rotate(5deg);
            filter: brightness(1.5) drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
            animation-play-state: paused;
        }
        
        @keyframes floatDiagonal {
            0% {
                transform: translateY(110vh) translateX(-120px) rotate(0deg);
                opacity: 0;
            }
            8% {
                opacity: 1;
            }
            92% {
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) translateX(120px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Balloon Objects with special effects */
        .balloon-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: balloonFloat 15s ease-in-out infinite;
        }
        
        @keyframes balloonFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .balloon-shape {
            width: 65px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, var(--balloon-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        
        .balloon-object:hover .balloon-shape {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(255, 255, 100, 0.6);
        }
        
        .ads-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }
        
        .balloon-string {
            position: relative;
            bottom: -5px;
            width: 2px;
            height: 35px;
            background: linear-gradient(to bottom, #888, #666);
            border-radius: 1px;
        }
        
        .balloon-string:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -3px;
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
        }
        
        .balloon-label {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(50,50,50,0.9));
            color: var(--balloon-text-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Star Objects */
        .star-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: starTwinkle 3s infinite alternate;
        }
        
        @keyframes starTwinkle {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        
        .star-shape {
            width: 50px;
            height: 50px;
            background: var(--star-color);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .star-label {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(50,50,50,0.9));
            color: var(--star-text-color);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        /* Flower Objects */
        .flower-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: flowerSway 8s ease-in-out infinite;
        }
        
        @keyframes flowerSway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        
        .flower-shape {
            width: 60px;
            height: 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .flower-petals {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .flower-petal {
            position: absolute;
            width: 25px;
            height: 35px;
            background: var(--flower-petal-color);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }
        
        .flower-center {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, #ffcc00, #ff9900);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.7);
            z-index: 2;
        }
        
        .flower-label {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(50,50,50,0.9));
            color: var(--flower-text-color);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Diamond Objects */
        .diamond-object {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: diamondSparkle 2s infinite alternate;
        }
        
        @keyframes diamondSparkle {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.5) drop-shadow(0 0 10px cyan); }
        }
        
        .diamond-shape {
            width: 50px;
            height: 50px;
            background: var(--diamond-color);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transform: rotate(45deg);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
        }
        
        .diamond-shape i {
            transform: rotate(-45deg);
        }
        
        .diamond-label {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(50,50,50,0.9));
            color: var(--diamond-text-color);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        /* Glow Effect for all objects */
        .object-glow {
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            background: inherit;
            border-radius: inherit;
            filter: blur(20px);
            opacity: 0.3;
            z-index: -1;
            animation: pulseGlow 3s infinite alternate;
        }
        
        @keyframes pulseGlow {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(1.1); }
        }
        
        /* Sound indicator */
        .sound-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 15px;
            z-index: 90;
            display: none;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- GAME LOADER -->
    <div class="game-loader" id="gameLoader">
        <div class="loader-text">LOADING GAME...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- SOUND INDICATOR -->
    <div class="sound-indicator" id="soundIndicator">🔊 Sound Playing</div>
    
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-area">
            <!-- GAME IFRAME - Rescue Sharp Turn -->
            <iframe 
                src="https://html5.gamedistribution.com/67b7fb2c6f594ef3a4fcb241e902ce1d/?gd_sdk_referrer_url=https://gamedistribution.com/games/rescue-sharp-turn/" 
                class="game-frame" 
                id="gameFrame"
                width="750"
                height="1334"
                scrolling="none"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- FLOATING OBJECTS CONTAINER -->
    <div id="floatingObjects"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const gameLoader = document.getElementById('gameLoader');
        const floatingObjects = document.getElementById('floatingObjects');
        const soundIndicator = document.getElementById('soundIndicator');
        
        // Game State
        let gameStarted = false;
        let floatingInterval;
        let activeObjects = 0;
        const MAX_OBJECTS = 8; // More objects on screen
        let soundPlayed = false;
        
        // Audio for balloon pop
        const balloonPopSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-balloon-pop-2928.mp3');
        balloonPopSound.volume = 0.3;
        
        // Hide loader when game loads
        function hideLoader() {
            setTimeout(() => {
                gameLoader.style.opacity = '0';
                setTimeout(() => {
                    gameLoader.style.display = 'none';
                    startFloatingObjects();
                }, 800);
            }, 1500);
        }
        
        // Play sound with indicator
        function playSound() {
            if (!soundPlayed) {
                balloonPopSound.play().catch(e => console.log("Sound autoplay prevented"));
                soundPlayed = true;
                
                // Show sound indicator
                soundIndicator.style.display = 'block';
                setTimeout(() => {
                    soundIndicator.style.display = 'none';
                }, 2000);
            }
        }
        
        // Create floating objects - Various designs
        function createFloatingObject() {
            if (activeObjects >= MAX_OBJECTS || !gameStarted) return;
            
            const objectTypes = [
                // Balloons with ADS
                { 
                    type: 'balloon', 
                    subtype: 'gold-ads', 
                    label: 'CLICK FOR AD', 
                    color: '#FFD700, #FFA500',
                    textColor: '#FFD700'
                },
                { 
                    type: 'balloon', 
                    subtype: 'neon-ads', 
                    label: 'WATCH AD', 
                    color: '#00ffea, #0080ff',
                    textColor: '#00ffea'
                },
                { 
                    type: 'balloon', 
                    subtype: 'pink-ads', 
                    label: 'SUPPORT US', 
                    color: '#ff00ff, #cc00cc',
                    textColor: '#ff99ff'
                },
                // Stars
                { 
                    type: 'star', 
                    subtype: 'gold-star', 
                    label: 'GET REWARD', 
                    color: 'radial-gradient(circle, #FFD700, #FFA500)',
                    textColor: '#FFD700',
                    icon: '⭐'
                },
                { 
                    type: 'star', 
                    subtype: 'silver-star', 
                    label: 'FREE BONUS', 
                    color: 'radial-gradient(circle, #C0C0C0, #808080)',
                    textColor: '#C0C0C0',
                    icon: '✴️'
                },
                // Flowers
                { 
                    type: 'flower', 
                    subtype: 'rose', 
                    label: 'CLICK HERE', 
                    petalColor: '#ff3366',
                    textColor: '#ff6699'
                },
                { 
                    type: 'flower', 
                    subtype: 'sunflower', 
                    label: 'WIN PRIZE', 
                    petalColor: '#FFD700',
                    textColor: '#FFCC00'
                },
                { 
                    type: 'flower', 
                    subtype: 'orchid', 
                    label: 'PLAY MORE', 
                    petalColor: '#9933ff',
                    textColor: '#cc99ff'
                },
                // Diamonds
                { 
                    type: 'diamond', 
                    subtype: 'blue-diamond', 
                    label: 'GET GEMS', 
                    color: 'radial-gradient(circle, #00ffff, #0080ff)',
                    textColor: '#00ffff',
                    icon: '💎'
                },
                { 
                    type: 'diamond', 
                    subtype: 'red-diamond', 
                    label: 'EARN COINS', 
                    color: 'radial-gradient(circle, #ff3333, #cc0000)',
                    textColor: '#ff6666',
                    icon: '♦️'
                }
            ];
            
            const objType = objectTypes[Math.floor(Math.random() * objectTypes.length)];
            const object = document.createElement('div');
            object.className = `floating-object ${objType.type}-object ${objType.type}-${objType.subtype}`;
            
            // Set CSS variables
            if (objType.type === 'balloon') {
                object.style.setProperty('--balloon-color', objType.color);
                object.style.setProperty('--balloon-text-color', objType.textColor);
            } else if (objType.type === 'star') {
                object.style.setProperty('--star-color', objType.color);
                object.style.setProperty('--star-text-color', objType.textColor);
            } else if (objType.type === 'flower') {
                object.style.setProperty('--flower-petal-color', objType.petalColor);
                object.style.setProperty('--flower-text-color', objType.textColor);
            } else if (objType.type === 'diamond') {
                object.style.setProperty('--diamond-color', objType.color);
                object.style.setProperty('--diamond-text-color', objType.textColor);
            }
            
            // Random position with faster movement
            const startX = Math.random() * (window.innerWidth - 100);
            const delay = Math.random() * 2;
            const duration = 15 + Math.random() * 10; // Faster movement
            
            object.style.left = `${startX}px`;
            object.style.animationDelay = `${delay}s`;
            object.style.animationDuration = `${duration}s`;
            
            // Create object based on type
            if (objType.type === 'balloon') {
                const balloonDiv = document.createElement('div');
                balloonDiv.className = 'balloon-shape';
                
                const adsDiv = document.createElement('div');
                adsDiv.className = 'ads-text';
                adsDiv.textContent = 'ADS';
                balloonDiv.appendChild(adsDiv);
                
                const stringDiv = document.createElement('div');
                stringDiv.className = 'balloon-string';
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'balloon-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(balloonDiv);
                object.appendChild(stringDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'star') {
                const starDiv = document.createElement('div');
                starDiv.className = 'star-shape';
                starDiv.textContent = objType.icon;
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'star-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(starDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'flower') {
                const flowerDiv = document.createElement('div');
                flowerDiv.className = 'flower-shape';
                
                const petalsDiv = document.createElement('div');
                petalsDiv.className = 'flower-petals';
                
                // Create 8 petals
                for (let i = 0; i < 8; i++) {
                    const petalDiv = document.createElement('div');
                    petalDiv.className = 'flower-petal';
                    petalDiv.style.transform = `translate(-50%, -50%) rotate(${i * 45}deg) translateX(30px)`;
                    petalsDiv.appendChild(petalDiv);
                }
                
                flowerDiv.appendChild(petalsDiv);
                
                const centerDiv = document.createElement('div');
                centerDiv.className = 'flower-center';
                flowerDiv.appendChild(centerDiv);
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'flower-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(flowerDiv);
                object.appendChild(labelDiv);
                
            } else if (objType.type === 'diamond') {
                const diamondDiv = document.createElement('div');
                diamondDiv.className = 'diamond-shape';
                
                const iconDiv = document.createElement('div');
                iconDiv.textContent = objType.icon;
                diamondDiv.appendChild(iconDiv);
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'diamond-label';
                labelDiv.textContent = objType.label;
                
                object.appendChild(diamondDiv);
                object.appendChild(labelDiv);
            }
            
            // Add glow effect
            const glow = document.createElement('div');
            glow.className = 'object-glow';
            object.appendChild(glow);
            
            // Click event - OPEN MONETAG AD
            object.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Visual and sound effects
                this.style.transform = 'scale(1.4)';
                this.style.opacity = '0.8';
                this.style.filter = 'brightness(2) drop-shadow(0 0 25px gold)';
                
                // Play sound
                playSound();
                
                // Open Monetag ad in new tab
                window.open('https://otieu.com/4/10000770', '_blank');
                
                // Remove object with effect
                setTimeout(() => {
                    if (this.parentNode) {
                        this.style.transition = 'all 0.5s';
                        this.style.transform = 'scale(0) rotate(180deg)';
                        this.style.opacity = '0';
                        
                        setTimeout(() => {
                            if (this.parentNode) {
                                this.remove();
                                activeObjects--;
                            }
                        }, 500);
                    }
                }, 300);
            });
            
            // Remove when animation completes
            setTimeout(() => {
                if (object.parentNode) {
                    object.remove();
                    activeObjects--;
                }
            }, (duration + delay) * 1000);
            
            floatingObjects.appendChild(object);
            activeObjects++;
        }
        
        // Start floating objects after game starts
        function startFloatingObjects() {
            gameStarted = true;
            
            // Create more objects more frequently
            floatingInterval = setInterval(() => {
                if (gameStarted && document.visibilityState === 'visible' && activeObjects < MAX_OBJECTS) {
                    // Sometimes create 2 at once
                    createFloatingObject();
                    if (Math.random() > 0.7 && activeObjects < MAX_OBJECTS - 1) {
                        setTimeout(createFloatingObject, 300);
                    }
                }
            }, 8000 + Math.random() * 7000); // More frequent
            
            // Create initial objects faster
            setTimeout(() => createFloatingObject(), 500);
            setTimeout(() => createFloatingObject(), 1500);
            setTimeout(() => createFloatingObject(), 2500);
            setTimeout(() => createFloatingObject(), 3500);
        }
        
        // Initialize
        function init() {
            console.log('🎮 Rescue Sharp Turn - Initializing');
            
            // Hide loader after game loads
            hideLoader();
            
            // Start listening for game interactions
            gameFrame.addEventListener('load', function() {
                console.log('✅ Game Loaded');
            });
        }
        
        // Event Listeners
        gameFrame.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // Start everything
        init();
    </script>
</body>
</html>
