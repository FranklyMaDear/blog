<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Garden Match 2 - Δωρεάν Παιχνίδι</title>
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-3186700611266549">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549" crossorigin="anonymous"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* ===== GAME CONTAINER ===== */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ===== GAME AREA ===== */
        .game-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.5rem;
            color: #4cc9f0;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            color: #b8b8b8;
            font-size: 1rem;
            text-align: center;
            max-width: 300px;
        }
        
        /* ===== BOTTOM AD BAR ===== */
        .bottom-ad-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 10px;
            border-top: 3px solid #4cc9f0;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        
        .ad-label {
            position: absolute;
            top: -25px;
            left: 20px;
            background: #4cc9f0;
            color: white;
            padding: 5px 15px;
            border-radius: 15px 15px 0 0;
            font-size: 0.8rem;
            font-weight: 700;
        }
        
        .ad-content {
            width: 100%;
            max-width: 728px;
            margin: 0 auto;
        }
        
        /* ===== END GAME AD POPUP ===== */
        .ad-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .popup-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 600px;
            position: relative;
            border: 5px solid #4cc9f0;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
        }
        
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .popup-title {
            color: #1a1a2e;
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .popup-timer {
            background: #4cc9f0;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .close-popup {
            background: #ff4161;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .close-popup:hover {
            background: #d1344e;
            transform: rotate(90deg);
        }
        
        .popup-content {
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        
        .popup-message {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
            padding: 20px;
        }
        
        .popup-message i {
            font-size: 3rem;
            color: #4cc9f0;
            margin-bottom: 15px;
            display: block;
        }
        
        /* ===== GAME CONTROLS ===== */
        .game-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 90;
        }
        
        .control-btn {
            padding: 10px 20px;
            background: #4cc9f0;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.4);
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(76, 201, 240, 0.6);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .btn-reload {
            background: #ff4161;
        }
        
        .btn-reload:hover {
            box-shadow: 0 6px 20px rgba(255, 65, 97, 0.6);
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .bottom-ad-bar {
                min-height: 80px;
                padding: 8px;
            }
            
            .ad-label {
                top: -20px;
                left: 10px;
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            
            .popup-container {
                padding: 20px;
                width: 95%;
            }
            
            .popup-title {
                font-size: 1.2rem;
            }
            
            .popup-timer {
                font-size: 1rem;
                padding: 6px 12px;
            }
            
            .close-popup {
                width: 35px;
                height: 35px;
                font-size: 1.3rem;
            }
            
            .game-controls {
                top: 10px;
                right: 10px;
                flex-direction: column;
            }
            
            .control-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }
        }
        
        @media (max-width: 480px) {
            .bottom-ad-bar {
                display: none; /* Κρύβουμε το bottom ad σε πολύ μικρές οθόνες */
            }
            
            .popup-container {
                padding: 15px;
            }
            
            .popup-content {
                min-height: 200px;
                padding: 15px;
            }
            
            .popup-message {
                font-size: 1rem;
                padding: 15px;
            }
            
            .popup-message i {
                font-size: 2.5rem;
            }
            
            .game-controls {
                top: 5px;
                right: 5px;
            }
        }
        
        /* ===== UTILITY CLASSES ===== */
        .hidden {
            display: none !important;
        }
        
        .fade-out {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <!-- GAME CONTAINER -->
    <div class="game-container">
        <!-- GAME AREA -->
        <div class="game-area">
            <!-- LOADING SCREEN -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div class="loading-text">Φόρτωση Royal Garden Match 2...</div>
                <div class="loading-subtext">Το παιχνίδι φορτώνεται, παρακαλώ περιμένετε</div>
            </div>
            
            <!-- GAME IFRAME -->
            <iframe 
                src="https://html5.gamedistribution.com/6416456afd5147b489069f061ea00699/?gd_sdk_referrer_url=https://gamedistribution.com/games/royal-garden-match-2/" 
                class="game-frame" 
                id="gameFrame"
                scrolling="no"
                frameborder="0"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <!-- BOTTOM AD BAR -->
    <div class="bottom-ad-bar" id="bottomAdBar">
        <div class="ad-label">Υποστήριξη</div>
        <div class="ad-content" id="bottomAdContent">
            <!-- AdSense Bottom Ad -->
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
                crossorigin="anonymous"></script>
            <!-- Royal Garden Bottom -->
            <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-pub-3186700611266549"
                data-ad-slot="6125539150"
                data-ad-format="horizontal"
                data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>
    
    <!-- END GAME AD POPUP -->
    <div class="ad-popup" id="adPopup">
        <div class="popup-container">
            <div class="popup-header">
                <div class="popup-title">
                    <i class="fas fa-crown"></i>
                    Μπράβο! Τελείωσες το επίπεδο!
                </div>
                <div class="popup-timer" id="popupTimer">30</div>
                <button class="close-popup" id="closePopupBtn">×</button>
            </div>
            <div class="popup-content" id="popupAdContent">
                <!-- AdSense Popup Ad -->
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
                    crossorigin="anonymous"></script>
                <!-- Royal Garden Popup -->
                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-client="ca-pub-3186700611266549"
                    data-ad-slot="4586034963"
                    data-ad-format="auto"
                    data-full-width-responsive="true"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
    </div>
    
    <!-- GAME CONTROLS -->
    <div class="game-controls">
        <button class="control-btn" id="reloadBtn">
            <i class="fas fa-redo"></i> Ανανέωση
        </button>
        <button class="control-btn btn-reload" id="fullscreenBtn">
            <i class="fas fa-expand"></i> Πλήρης
        </button>
    </div>

    <script>
        // ===== DOM ELEMENTS =====
        const loadingScreen = document.getElementById('loadingScreen');
        const gameFrame = document.getElementById('gameFrame');
        const bottomAdBar = document.getElementById('bottomAdBar');
        const bottomAdContent = document.getElementById('bottomAdContent');
        const adPopup = document.getElementById('adPopup');
        const popupTimer = document.getElementById('popupTimer');
        const closePopupBtn = document.getElementById('closePopupBtn');
        const popupAdContent = document.getElementById('popupAdContent');
        const reloadBtn = document.getElementById('reloadBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // ===== GAME STATE =====
        let isFullscreen = false;
        let gameLoaded = false;
        let popupCountdown = 30;
        let popupCountdownInterval = null;
        let levelEnded = false;
        
        // ===== INITIALIZE GAME =====
        function initGame() {
            console.log('🎮 Royal Garden Match 2 - Initializing...');
            
            // Load AdSense ads immediately
            loadAdsenseAds();
            
            // Show bottom ad bar
            bottomAdBar.style.display = 'flex';
            
            // Enter fullscreen automatically
            setTimeout(enterFullscreen, 1000);
            
            // Simulate level completion after 60 seconds (for testing)
            // ΣΕ ΠΡΑΓΜΑΤΙΚΗ ΧΡΗΣΗ, ΑΥΤΟ ΘΑ ΕΙΝΑΙ ΑΠΟ ΤΟ GAME IFRAME
            setTimeout(() => {
                if (!levelEnded) {
                    showEndGamePopup();
                }
            }, 60000); // 60 seconds for testing
            
            gameLoaded = true;
        }
        
        // ===== FULLSCREEN FUNCTIONS =====
        function enterFullscreen() {
            const container = document.querySelector('.game-container');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                
                isFullscreen = true;
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Έξοδος';
            }
        }
        
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
            
            isFullscreen = false;
            fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Πλήρης';
        }
        
        // ===== AD FUNCTIONS =====
        function loadAdsenseAds() {
            try {
                if (typeof adsbygoogle !== 'undefined') {
                    adsbygoogle = window.adsbygoogle || [];
                    
                    // Load bottom ad
                    setTimeout(() => {
                        try {
                            adsbygoogle.push({});
                            console.log('✅ AdSense ads loaded');
                        } catch(e) {
                            console.log('ℹ️ AdSense may not be ready yet');
                        }
                    }, 1000);
                }
            } catch(e) {
                console.log('⚠️ Error loading AdSense:', e);
            }
        }
        
        function showEndGamePopup() {
            if (levelEnded) return;
            
            levelEnded = true;
            adPopup.style.display = 'flex';
            
            // Start countdown
            popupCountdown = 30;
            popupTimer.textContent = popupCountdown;
            
            // Load fresh ad
            loadPopupAd();
            
            popupCountdownInterval = setInterval(() => {
                popupCountdown--;
                popupTimer.textContent = popupCountdown;
                
                if (popupCountdown <= 0) {
                    closePopup();
                }
            }, 1000);
            
            console.log('🎯 Level completed - Showing ad popup');
        }
        
        function loadPopupAd() {
            // Clear previous content
            popupAdContent.innerHTML = '';
            
            // Add new AdSense ad
            const adScript = document.createElement('script');
            adScript.async = true;
            adScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549';
            adScript.crossOrigin = 'anonymous';
            
            const adIns = document.createElement('ins');
            adIns.className = 'adsbygoogle';
            adIns.style.display = 'block';
            adIns.setAttribute('data-ad-client', 'ca-pub-3186700611266549');
            adIns.setAttribute('data-ad-slot', '4586034963');
            adIns.setAttribute('data-ad-format', 'auto');
            adIns.setAttribute('data-full-width-responsive', 'true');
            
            const adScript2 = document.createElement('script');
            adScript2.textContent = '(adsbygoogle = window.adsbygoogle || []).push({});';
            
            popupAdContent.appendChild(adScript);
            popupAdContent.appendChild(adIns);
            popupAdContent.appendChild(adScript2);
            
            // Force AdSense to load
            setTimeout(() => {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        adsbygoogle.push({});
                    } catch(e) {
                        // Fallback content if ad fails
                        showFallbackPopup();
                    }
                }
            }, 500);
        }
        
        function showFallbackPopup() {
            popupAdContent.innerHTML = `
                <div class="popup-message">
                    <i class="fas fa-trophy"></i>
                    <h3 style="color: #1a1a2e; margin-bottom: 10px;">Συγχαρητήρια!</h3>
                    <p>Τελειώσατε το επίπεδο με επιτυχία!</p>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #888;">
                        Το επόμενο επίπεδο ξεκινά σε <strong>${popupCountdown}</strong> δευτερόλεπτα...
                    </p>
                </div>
            `;
        }
        
        function closePopup() {
            clearInterval(popupCountdownInterval);
            adPopup.style.display = 'none';
            levelEnded = false;
            
            // Reset for next level (simulated)
            setTimeout(() => {
                // In real game, this would trigger when next level loads
                setTimeout(() => {
                    if (!levelEnded) {
                        showEndGamePopup();
                    }
                }, 60000); // Next level in 60 seconds
            }, 1000);
        }
        
        // ===== EVENT LISTENERS =====
        
        // Game loaded
        gameFrame.addEventListener('load', function() {
            console.log('✅ Game loaded successfully');
            
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    initGame();
                }, 500);
            }, 2000);
        });
        
        // Game error
        gameFrame.addEventListener('error', function() {
            console.log('❌ Game failed to load');
            loadingScreen.innerHTML = `
                <div style="text-align: center; padding: 20px; max-width: 400px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff4161; margin-bottom: 20px;"></i>
                    <div style="color: #ff4161; font-size: 1.3rem; font-weight: 700; margin-bottom: 20px;">
                        Σφάλμα φόρτωσης
                    </div>
                    <div style="margin-bottom: 25px; color: #b8b8b8;">
                        Το παιχνίδι δεν μπορεί να φορτωθεί. Δοκιμάστε ξανά.
                    </div>
                    <button class="control-btn" onclick="location.reload()" 
                            style="background: #ff4161;">
                        <i class="fas fa-sync-alt"></i> Ανανέωση Σελίδας
                    </button>
                </div>
            `;
        });
        
        // Reload game
        reloadBtn.addEventListener('click', function() {
            loadingScreen.classList.remove('hidden');
            loadingScreen.style.opacity = '1';
            
            // Close popup if open
            if (adPopup.style.display === 'flex') {
                closePopup();
            }
            
            // Reset game
            gameFrame.src = gameFrame.src;
            levelEnded = false;
            
            // Button animation
            reloadBtn.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                reloadBtn.style.transform = '';
            }, 300);
        });
        
        // Fullscreen toggle
        fullscreenBtn.addEventListener('click', function() {
            if (isFullscreen) {
                exitFullscreen();
            } else {
                enterFullscreen();
            }
        });
        
        // Close popup button
        closePopupBtn.addEventListener('click', function() {
            closePopup();
        });
        
        // Fullscreen change
        document.addEventListener('fullscreenchange', function() {
            isFullscreen = !!document.fullscreenElement;
            fullscreenBtn.innerHTML = isFullscreen ? 
                '<i class="fas fa-compress"></i> Έξοδος' : 
                '<i class="fas fa-expand"></i> Πλήρης';
        });
        
        // Escape key closes popup
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (adPopup.style.display === 'flex') {
                    closePopup();
                }
            }
        });
        
        // Listen for game messages (for real implementation)
        window.addEventListener('message', function(event) {
            // This would be used to detect when level ends in real game
            if (event.data && event.data.type === 'level_complete') {
                showEndGamePopup();
            }
        });
        
        // Send test message to iframe (simulate level complete)
        function simulateLevelComplete() {
            // This is for testing - in real game, the iframe would send this message
            setTimeout(() => {
                window.postMessage({ type: 'level_complete', score: 1000 }, '*');
            }, 30000);
        }
        
        // Initial console message
        console.log('🎮 ================================');
        console.log('🎮 ROYAL GARDEN MATCH 2');
        console.log('🎮 Bottom ad + End game popup ads');
        console.log('🎮 ================================');
        
        // Auto-hide loading screen after timeout
        setTimeout(() => {
            if (!loadingScreen.classList.contains('hidden')) {
                loadingScreen.classList.add('hidden');
                initGame();
            }
        }, 8000);
        
        // Start simulation (for testing)
        setTimeout(simulateLevelComplete, 10000);
    </script>
</body>
</html>
