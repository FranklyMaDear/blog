<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Παίξε & Κέρδισε Πόντοι - Δωρεάν Παιχνίδια</title>
    <style>
        /* Modern Design */
        :root {
            --primary: #4A6FFF;
            --secondary: #FF6B8B;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --success: #00C896;
            --warning: #FFD166;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--dark) 0%, #16213E 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .points-card {
            background: linear-gradient(135deg, var(--primary), #6A5AF9);
            padding: 15px 25px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(74, 111, 255, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .points-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--warning);
        }
        
        /* Game Tabs */
        .games-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .game-tab {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .game-tab:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
        
        .game-tab.active {
            background: var(--primary);
            border-color: white;
            box-shadow: 0 5px 20px rgba(74, 111, 255, 0.4);
        }
        
        /* Ad Container */
        .ad-container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin: 30px auto;
            max-width: 800px;
            display: none;
            animation: fadeIn 0.5s ease;
            border: 2px solid var(--warning);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .countdown {
            font-size: 48px;
            color: var(--warning);
            margin: 20px 0;
            font-weight: bold;
        }
        
        .skip-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        /* Game Container */
        .game-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            height: 600px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Progress Bar */
        .progress-container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            width: 0%;
            transition: width 1s ease;
        }
        
        /* Notifications */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Instructions */
        .instructions {
            text-align: center;
            margin: 30px auto;
            max-width: 600px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        
        .coin-animation {
            position: absolute;
            font-size: 24px;
            animation: fly 2s linear forwards;
        }
        
        @keyframes fly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Header με Πόντοι -->
    <div class="header">
        <h1>🎮 Δωρεάν Παιχνίδια</h1>
        <div class="points-card">
            <span>Πόντοι:</span>
            <span class="points-value" id="points">0</span>
            <div>💰</div>
        </div>
    </div>

    <!-- Επιλογή Παιχνιδιών -->
    <div class="games-tabs">
        <div class="game-tab active" onclick="selectGame('game1', this)">
            🎱 8 Ball Pool
        </div>
        <div class="game-tab" onclick="selectGame('game2', this)">
            🚗 Racing Game
        </div>
    </div>

    <!-- Οδηγίες -->
    <div class="instructions">
        <h3>🎯 Πώς Λειτουργεί:</h3>
        <p>1. Δες διαφήμιση 30 δευτερόλεπτα</p>
        <p>2. Κέρδισε <strong>1 Πόντο</strong></p>
        <p>3. Παίξε το παιχνίδι <strong>2 λεπτά</strong></p>
        <p>4. Ξαναδές διαφήμιση για νέους πόντους!</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Container για Διαφημίσεις -->
    <div class="ad-container" id="adContainer">
        <h2>🎉 Κέρδισε 1 Πόντο!</h2>
        <p>Δες αυτή τη διαφήμιση για <span id="adSeconds">30</span> δευτερόλεπτα</p>
        
        <div class="countdown" id="countdown">30</div>
        
        <!-- ΕΔΩ ΜΠΑΙΝΕΙ Ο ΚΩΔΙΚΑΣ ΤΩΝ ΔΙΑΦΗΜΙΣΕΩΝ ΣΟΥ -->
        <div id="adSpace">
            <!-- AdMaven Code -->
            <script data-cfasync="false" src="//dcbbwymp1bhlf.cloudfront.net/?wbbcd=1228431"></script>
            <meta name='admaven-placement' content='BqjwFpjU5'>
            
            <!-- Εναλλακτική: Google AdSense -->
            <div id="adSenseContainer">
                <!-- Θα μπει αυτόματα από το script -->
            </div>
        </div>
        
        <button class="skip-btn" id="skipBtn" onclick="skipAd()">
            Παράλειψη σε <span id="skipTimer">10</span>s
        </button>
    </div>

    <!-- Container για Παιχνίδια -->
    <div class="game-container" id="gameContainer">
        <iframe class="game-frame" id="gameFrame" 
                frameborder="0" 
                allowfullscreen></iframe>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        ✅ Κέρδισες 1 Πόντο!
    </div>

    <script>
        // =====================
        // ΚΟΙΝΟΣ ΚΩΔΙΚΑΣ
        // =====================
        
        // User Points System
        let userPoints = localStorage.getItem('gamePoints') ? 
                         parseInt(localStorage.getItem('gamePoints')) : 0;
        document.getElementById('points').textContent = userPoints;
        
        // Game Variables
        let currentGame = '';
        let adTimer, skipTimer, gameTimer;
        let adSeconds = 30;
        let skipSeconds = 10;
        let gameDuration = 120; // 2 λεπτά
        
        // Game URLs
        const games = {
            game1: "https://html5.gamedistribution.com/34b3dd35505444f282a9e35a7ceb4a93/",
            game2: "https://html5.gamedistribution.com/80ddf44c832b44d69d72392d9453ca00/"
        };
        
        // =====================
        // 1. ΕΠΙΛΟΓΗ ΠΑΙΧΝΙΔΙΟΥ
        // =====================
        function selectGame(gameId, element) {
            // Update active tab
            document.querySelectorAll('.game-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            element.classList.add('active');
            
            currentGame = gameId;
            
            // Show ad before game
            showAd();
        }
        
        // =====================
        // 2. ΕΜΦΑΝΙΣΗ ΔΙΑΦΗΜΙΣΗΣ
        // =====================
        function showAd() {
            // Hide game
            document.getElementById('gameContainer').style.display = 'none';
            
            // Show ad container
            const adContainer = document.getElementById('adContainer');
            adContainer.style.display = 'block';
            
            // Reset counters
            adSeconds = 30;
            skipSeconds = 10;
            document.getElementById('countdown').textContent = adSeconds;
            document.getElementById('adSeconds').textContent = adSeconds;
            document.getElementById('skipBtn').style.opacity = '0';
            
            // Start countdown
            clearInterval(adTimer);
            adTimer = setInterval(updateAdCountdown, 1000);
            
            // Load ad code dynamically
            loadAds();
        }
        
        function updateAdCountdown() {
            adSeconds--;
            document.getElementById('countdown').textContent = adSeconds;
            document.getElementById('adSeconds').textContent = adSeconds;
            
            // Show skip button after 20 seconds
            if (adSeconds <= 10) {
                document.getElementById('skipBtn').style.opacity = '1';
                skipSeconds--;
                document.getElementById('skipTimer').textContent = skipSeconds;
            }
            
            // Ad finished
            if (adSeconds <= 0) {
                clearInterval(adTimer);
                givePoint();
            }
        }
        
        function skipAd() {
            clearInterval(adTimer);
            givePoint();
        }
        
        // =====================
        // 3. ΚΕΡΔΙΣΕ ΠΟΝΤΟ
        // =====================
        function givePoint() {
            userPoints++;
            localStorage.setItem('gamePoints', userPoints);
            document.getElementById('points').textContent = userPoints;
            
            // Show notification with animation
            const notification = document.getElementById('notification');
            notification.style.display = 'block';
            
            // Create flying coin animation
            createCoinAnimation();
            
            // Hide notification after 3 seconds
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
            
            // Hide ad container
            document.getElementById('adContainer').style.display = 'none';
            
            // Start game
            startGame();
        }
        
        function createCoinAnimation() {
            const coin = document.createElement('div');
            coin.className = 'coin-animation';
            coin.textContent = '💰';
            coin.style.left = Math.random() * window.innerWidth + 'px';
            coin.style.top = window.innerHeight + 'px';
            document.body.appendChild(coin);
            
            setTimeout(() => {
                coin.remove();
            }, 2000);
        }
        
        // =====================
        // 4. ΞΕΚΙΝΗΜΑ ΠΑΙΧΝΙΔΙΟΥ
        // =====================
        function startGame() {
            const gameContainer = document.getElementById('gameContainer');
            const gameFrame = document.getElementById('gameFrame');
            
            // Set game URL
            gameFrame.src = games[currentGame];
            
            // Show game
            gameContainer.style.display = 'block';
            
            // Start game timer (2 minutes)
            startGameTimer();
            
            // Setup completion detection
            setupGameCompletion();
        }
        
        function startGameTimer() {
            let timeLeft = gameDuration;
            updateProgressBar(0);
            
            gameTimer = setInterval(() => {
                timeLeft--;
                
                // Update progress bar
                const progress = ((gameDuration - timeLeft) / gameDuration) * 100;
                updateProgressBar(progress);
                
                // Game finished
                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    gameCompleted();
                }
            }, 1000);
        }
        
        function updateProgressBar(percentage) {
            document.getElementById('progressBar').style.width = percentage + '%';
        }
        
        // =====================
        // 5. ΤΕΛΟΣ ΠΑΙΧΝΙΔΙΟΥ
        // =====================
        function gameCompleted() {
            // Clear timers
            clearInterval(gameTimer);
            
            // Hide game
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('gameFrame').src = '';
            
            // Show ad again
            setTimeout(() => {
                showAd();
            }, 1000);
        }
        
        // =====================
        // 6. ΑΝΙΧΝΕΥΣΗ ΤΕΛΟΥΣ ΠΑΙΧΝΙΔΙΟΥ
        // =====================
        function setupGameCompletion() {
            // Method 1: PostMessage communication (if game supports it)
            window.addEventListener('message', handleGameMessage);
            
            // Method 2: Auto-complete after 2 minutes (fallback)
            setTimeout(() => {
                if (document.getElementById('gameContainer').style.display !== 'none') {
                    gameCompleted();
                }
            }, gameDuration * 1000);
        }
        
        function handleGameMessage(event) {
            // Check if message is from game distribution
            if (event.origin.includes('gamedistribution.com')) {
                const data = event.data;
                
                // Game events
                if (data && data.type) {
                    switch(data.type) {
                        case 'gameOver':
                        case 'levelComplete':
                        case 'gameComplete':
                            gameCompleted();
                            break;
                    }
                }
            }
        }
        
        // =====================
        // 7. ΔΙΑΦΗΜΙΣΕΙΣ
        // =====================
        function loadAds() {
            const adSpace = document.getElementById('adSpace');
            
            // Clear previous ads
            adSpace.innerHTML = '';
            
            // Method 1: Your AdMaven code
            adSpace.innerHTML += `
                <script data-cfasync="false" src="//dcbbwymp1bhlf.cloudfront.net/?wbbcd=1228431"><\/script>
                <meta name='admaven-placement' content='BqjwFpjU5'>
            `;
            
            // Method 2: Google AdSense (if you have it)
            const adSenseContainer = document.getElementById('adSenseContainer');
            if (typeof adsbygoogle !== 'undefined') {
                adSenseContainer.innerHTML = `
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-YOUR_PUBLISHER_ID"
                         data-ad-slot="YOUR_SLOT_ID"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    <\/script>
                `;
            }
            
            // Method 3: Additional ad networks
            loadAdditionalAds();
        }
        
        function loadAdditionalAds() {
            // Add more ad networks here for maximum revenue
            const networks = [
                // PropellerAds
                '<script type="text/javascript" src="//partner.pub.network/core/ad/your-code"><\/script>',
                
                // Media.net
                '<script type="text/javascript">window._mNHandle = window._mNHandle || {};<\/script>',
                
                // RevContent
                '<div id="rc-widget-12345" data-rc-widget data-widget-host="habu" data-endpoint="//trends.revcontent.com"><\/div>'
            ];
            
            // Rotate ads randomly
            const randomAd = networks[Math.floor(Math.random() * networks.length)];
            document.getElementById('adSpace').innerHTML += randomAd;
        }
        
        // =====================
        // 8. MONETIZATION STRATEGY
        // =====================
        function calculateRevenue() {
            // Estimated revenue per 1000 views (RPM)
            const rpm = {
                admaven: 3.50,  // $3.50 per 1000 views
                adsense: 2.00,  // $2.00 per 1000 views
                others: 1.50    // $1.50 per 1000 views
            };
            
            // With this system:
            // - 1 user = 4 ads per session (2 games × 2 ads)
            // - 1000 users = 4000 ad views
            // - Estimated revenue: $14 - $28 per 1000 users
        }
        
        // =====================
        // 9. INITIALIZE
        // =====================
        window.onload = function() {
            // Auto-select first game
            selectGame('game1', document.querySelector('.game-tab'));
            
            // Show welcome message
            setTimeout(() => {
                if (userPoints === 0) {
                    alert("🎉 Καλώς ήρθες! Κέρδισε πόντους παίζοντας παιχνίδια!");
                }
            }, 1000);
        };
        
        // =====================
        // 10. SHARE & REFERRAL SYSTEM
        // =====================
        function shareGame() {
            // User gets extra points for sharing
            if (navigator.share) {
                navigator.share({
                    title: 'Παίξε & Κέρδισε Πόντοι',
                    text: 'Παίξε δωρεάν παιχνίδια και κέρδισε πόντους!',
                    url: window.location.href
                }).then(() => {
                    userPoints += 5;
                    localStorage.setItem('gamePoints', userPoints);
                    document.getElementById('points').textContent = userPoints;
                });
            }
        }
        
    </script>

    <!-- Share Button -->
    <div style="position: fixed; bottom: 20px; right: 20px;">
        <button onclick="shareGame()" style="
            background: linear-gradient(135deg, #FF6B8B, #FF8E53);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 139, 0.4);
        ">
            📢 Κέρδισε 5 Πόντοι με Κοινή χρήση
        </button>
    </div>

</body>
</html>
