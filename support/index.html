<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foxy Eco Sort - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Game takes full screen */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            z-index: 1;
            background: #000;
        }
        
        /* Simple Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.3s ease-out;
        }
        
        .loader-text {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .loader-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Floating Leaves Container */
        #floatingLeaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* ΑΦΑΙΡΩ pointer-events: none; */
            z-index: 50;
        }
        
        /* Leaf Objects - ΒΕΛΤΙΩΜΕΝΑ */
        .leaf-object {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            touch-action: manipulation;
            z-index: 51;
            opacity: 0.9;
            will-change: transform, opacity, filter;
            filter: drop-shadow(2px 2px 8px rgba(0,0,0,0.4));
            
            /* Νέα 3D εφέ */
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 0.3s ease,
                        filter 0.3s ease;
            
            /* Αναλαμπή */
            animation: leafPulse 4s infinite alternate ease-in-out;
        }
        
        /* Εφέ hover για desktop */
        .leaf-object:hover {
            transform: scale(1.15) rotateY(15deg) rotateX(8deg) !important;
            filter: drop-shadow(0 10px 15px rgba(76, 175, 80, 0.5)) brightness(1.1);
            z-index: 52;
        }
        
        /* Εφέ πατήματος */
        .leaf-object:active {
            transform: scale(1.3) rotateY(25deg) !important;
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(76, 175, 80, 0.8));
            animation: clickPulse 0.4s ease-out;
        }
        
        /* ΒΕΛΤΙΩΜΕΝΑ Green Leaf Styles */
        .green-leaf {
            width: 80px;
            height: 80px;
            position: relative;
            background: linear-gradient(135deg, #4CAF50, #2E7D32, #1B5E20);
            border-radius: 50% 0 50% 50%;
            transform: rotate(var(--rotation)) scale(1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            overflow: hidden;
            
            /* Διαφανές στρώμα για βάθος */
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.1),
                inset 0 0 40px rgba(0, 0, 0, 0.2),
                0 5px 15px rgba(0, 0, 0, 0.3);
            
            /* Βελτιωμένη υφή */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.2) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.1) 0%, transparent 20%);
        }
        
        /* Ad text inside leaf - ΒΕΛΤΙΩΜΕΝΟ */
        .ad-text {
            color: white;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            text-shadow: 
                1px 1px 3px rgba(0,0,0,0.8),
                0 0 10px rgba(255,255,255,0.3);
            padding: 8px;
            line-height: 1.3;
            z-index: 3;
            position: relative;
            letter-spacing: 0.5px;
            
            /* Γραμμική κινούμενη κάρτα εφέ */
            display: inline-block;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            text-transform: uppercase;
        }
        
        .leaf-object:hover .ad-text {
            transform: translateZ(20px) scale(1.1);
        }
        
        /* Βελτιωμένο leaf stem */
        .leaf-stem {
            position: absolute;
            width: 5px;
            height: 30px;
            background: linear-gradient(to bottom, #8B4513, #5D4037, #3E2723);
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
            box-shadow: 
                inset 0 0 5px rgba(0,0,0,0.3),
                0 2px 5px rgba(0,0,0,0.2);
            
            /* Μικρή ανωμαλία */
            &::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 10px;
                background: linear-gradient(to bottom, #A1887F, #8B4513);
                border-radius: 3px 3px 0 0;
            }
        }
        
        /* Βελτιωμένα leaf veins */
        .leaf-veins {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            z-index: 1;
        }
        
        .vein {
            position: absolute;
            background: linear-gradient(to right, #1B5E20, #4CAF50);
            border-radius: 1px;
            box-shadow: 0 0 3px rgba(27, 94, 32, 0.5);
        }
        
        .vein-main {
            width: 4px;
            height: 75%;
            top: 12.5%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, #1B5E20, #81C784);
            
            /* Λεπτομέρειες */
            &::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 15px;
                background: linear-gradient(to bottom, #388E3C, #1B5E20);
                border-radius: 2px 2px 0 0;
            }
        }
        
        .vein-side {
            width: 2px;
            height: 45%;
            background: linear-gradient(to bottom, #388E3C, #81C784);
        }
        
        .vein-side:nth-child(2) { 
            top: 20%; 
            left: 25%; 
            transform: rotate(-25deg); 
            height: 40%;
        }
        .vein-side:nth-child(3) { 
            top: 20%; 
            right: 25%; 
            transform: rotate(25deg); 
            height: 40%;
        }
        .vein-side:nth-child(4) { 
            top: 45%; 
            left: 15%; 
            transform: rotate(-40deg); 
            height: 35%;
        }
        .vein-side:nth-child(5) { 
            top: 45%; 
            right: 15%; 
            transform: rotate(40deg); 
            height: 35%;
        }
        .vein-side:nth-child(6) { 
            top: 65%; 
            left: 20%; 
            transform: rotate(-50deg); 
            height: 30%;
        }
        .vein-side:nth-child(7) { 
            top: 65%; 
            right: 20%; 
            transform: rotate(50deg); 
            height: 30%;
        }
        
        /* Βελτιωμένο Simple Green Orb */
        .green-orb {
            width: 70px;
            height: 70px;
            position: relative;
            background: 
                radial-gradient(circle at 25% 25%, #66BB6A, #388E3C 45%, #1B5E20 80%),
                radial-gradient(circle at 70% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 30px rgba(102, 187, 106, 0.6),
                inset 0 0 25px rgba(255, 255, 255, 0.15),
                inset 0 -10px 20px rgba(0, 0, 0, 0.2);
            
            /* Γυαλάδα */
            &::before {
                content: '';
                position: absolute;
                top: 15%;
                left: 15%;
                width: 20%;
                height: 20%;
                background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
                border-radius: 50%;
                filter: blur(1px);
            }
        }
        
        /* Βελτιωμένο Eco Badge */
        .eco-badge {
            width: 65px;
            height: 65px;
            position: relative;
            background: 
                linear-gradient(135deg, #43A047, #1B5E20),
                repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.1) 5px, rgba(255,255,255,0.1) 10px);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 3px solid #C8E6C9;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 5px 20px rgba(67, 160, 71, 0.4),
                inset 0 0 15px rgba(200, 230, 201, 0.3);
            
            /* Γωνιακή γυαλάδα */
            &::before {
                content: '';
                position: absolute;
                top: 5px;
                left: 5px;
                right: 5px;
                bottom: 5px;
                border: 1px solid rgba(255,255,255,0.2);
                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            }
        }
        
        /* Βελτιωμένο Simple Green Square */
        .green-square {
            width: 60px;
            height: 60px;
            position: relative;
            background: 
                linear-gradient(45deg, #81C784, #4CAF50, #388E3C),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(var(--rotation));
            box-shadow: 
                0 8px 25px rgba(76, 175, 80, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            
            /* Κομψές γωνίες */
            &::after {
                content: '';
                position: absolute;
                top: 3px;
                left: 3px;
                right: 3px;
                bottom: 3px;
                border: 1px solid rgba(255,255,255,0.15);
                border-radius: 8px;
                pointer-events: none;
            }
        }
        
        /* ΒΕΛΤΙΩΜΕΝΕΣ ΚΙΝΗΣΕΙΣ ΚΑΙ ΕΦΕ */
        
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                animation-timing-function: cubic-bezier(0.2, 0.8, 0.8, 0.2);
            }
            50% {
                transform: translateY(calc(50vh - 50px)) translateX(calc(var(--start-x) + var(--sway))) rotate(90deg);
                filter: drop-shadow(0 5px 15px rgba(76, 175, 80, 0.4));
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(calc(100vh + 100px)) translateX(var(--start-x)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                animation-timing-function: cubic-bezier(0.2, 0.8, 0.8, 0.2);
            }
            50% {
                transform: translateY(calc(50vh - 50px)) translateX(calc(var(--start-x) + var(--sway))) rotate(90deg);
                filter: drop-shadow(0 5px 15px rgba(76, 175, 80, 0.4));
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100px) translateX(var(--end-x)) rotate(180deg);
                opacity: 0;
            }
        }
        
        @keyframes floatSide {
            0% {
                transform: translateX(-100px) translateY(var(--start-y)) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                animation-timing-function: cubic-bezier(0.2, 0.8, 0.8, 0.2);
            }
            50% {
                transform: translateX(calc(50vw - 50px)) translateY(calc(var(--start-y) + var(--sway))) rotate(90deg);
                filter: drop-shadow(5px 0 15px rgba(76, 175, 80, 0.4));
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(var(--end-y)) rotate(180deg);
                opacity: 0;
            }
        }
        
        /* Κυματιστό εφέ (wobble) */
        @keyframes wobble {
            0%, 100% { transform: rotate(var(--rotation)) scale(1); }
            25% { transform: rotate(calc(var(--rotation) - 1deg)) scale(1.02); }
            50% { transform: rotate(calc(var(--rotation) + 1deg)) scale(1); }
            75% { transform: rotate(calc(var(--rotation) - 0.5deg)) scale(1.01); }
        }
        
        /* Αναλαμπή (pulse glow) */
        @keyframes leafPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 10px rgba(76, 175, 80, 0.3));
            }
            50% { 
                filter: drop-shadow(0 0 25px rgba(76, 175, 80, 0.7));
            }
        }
        
        /* Κλικ animation */
        @keyframes clickPulse {
            0% { 
                transform: scale(1.1); 
                filter: drop-shadow(0 0 15px rgba(76, 175, 80, 0.5));
            }
            50% { 
                transform: scale(1.3); 
                filter: drop-shadow(0 0 30px rgba(76, 175, 80, 0.9));
            }
            100% { 
                transform: scale(1.4); 
                opacity: 0.8;
            }
        }
        
        /* Bounce effect */
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .green-leaf { width: 70px; height: 70px; }
            .green-orb { width: 65px; height: 65px; }
            .eco-badge { width: 60px; height: 60px; }
            .green-square { width: 55px; height: 55px; }
            .ad-text { font-size: 11px; padding: 6px; }
            .loader-text { font-size: 20px; }
            
            /* Λιγότερο intense animations για mobile */
            .leaf-object:hover {
                transform: scale(1.1) !important;
            }
        }
        
        @media (max-width: 480px) {
            .green-leaf { width: 65px; height: 65px; }
            .green-orb { width: 60px; height: 60px; }
            .eco-badge { width: 55px; height: 55px; }
            .green-square { width: 50px; height: 50px; }
            .ad-text { font-size: 10px; padding: 5px; }
            .loader-text { font-size: 18px; }
            
            .leaf-stem {
                height: 25px;
                bottom: -25px;
            }
            
            /* Απλοποιημένα animations για χαμηλές επιδόσεις */
            .leaf-object {
                animation: leafPulse 6s infinite alternate;
            }
        }
        
        /* Χαμηλή ταχύτητα συσκευές */
        @media (prefers-reduced-motion: reduce) {
            .leaf-object {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Game Frame - Full Screen -->
    <iframe 
        src="https://html5.gamedistribution.com/e0c6fbe378ad4ed5a1325176324a79dd/?gd_sdk_referrer_url=https://gamedistribution.com/games/foxy-eco-sort/" 
        id="gameFrame"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-text">Loading Foxy Eco Sort...</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Floating Leaves Container -->
    <div id="floatingLeaves"></div>

    <script>
        // DOM Elements
        const gameFrame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');
        const floatingLeaves = document.getElementById('floatingLeaves');
        
        // Game State
        let gameLoaded = false;
        let leavesStarted = false;
        let activeLeaves = 0;
        const MAX_LEAVES = 4;
        let leavesInterval;
        
        // Configuration - ΑΛΛΑΓΗ: Φύλλα εμφανίζονται νωρίτερα (30 δευτ. αντί για 60)
        const LEAVES_START_DELAY = 30000; // 30 δευτερόλεπτα
        const MONETAG_LINK = 'https://otieu.com/4/10274068';
        
        // Initialize - Optimized for fast loading
        function init() {
            console.log('🍃 Initializing Foxy Eco Sort with enhanced leaves...');
            
            // Set game to full screen
            setupFullScreenGame();
            
            // Hide loader quickly
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    gameLoaded = true;
                    
                    // Start leaves after 30 seconds
                    console.log(`⏰ Enhanced green leaves will appear in ${LEAVES_START_DELAY/1000} seconds`);
                    setTimeout(startFloatingLeaves, LEAVES_START_DELAY);
                }, 300);
            }, 1500);
            
            // Game frame error handling
            gameFrame.addEventListener('error', () => {
                console.log('⚠️ Game frame error');
            });
        }
        
        // Setup full screen game
        function setupFullScreenGame() {
            const updateSize = () => {
                gameFrame.style.width = window.innerWidth + 'px';
                gameFrame.style.height = window.innerHeight + 'px';
            };
            
            updateSize();
            
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateSize, 100);
            });
            
            window.addEventListener('orientationchange', () => {
                setTimeout(updateSize, 150);
            });
        }
        
        // Create enhanced green leaf with ad text
        function createGreenLeaf() {
            if (activeLeaves >= MAX_LEAVES || !leavesStarted) return;
            
            const leafTypes = [
                { 
                    type: 'green-leaf', 
                    name: 'Green Leaf',
                    animation: 'floatDown',
                    duration: 18 + Math.random() * 12,
                    adText: 'Click for\nBONUS',
                    sway: Math.random() * 100 - 50
                },
                { 
                    type: 'green-leaf', 
                    name: 'Green Leaf',
                    animation: 'floatUp', 
                    duration: 20 + Math.random() * 10,
                    adText: 'Watch\nREWARD',
                    sway: Math.random() * 80 - 40
                },
                { 
                    type: 'green-orb', 
                    name: 'Green Orb',
                    animation: 'floatDown',
                    duration: 16 + Math.random() * 11,
                    adText: 'GET\nAD',
                    sway: Math.random() * 60 - 30
                },
                { 
                    type: 'eco-badge', 
                    name: 'Eco Badge',
                    animation: 'floatSide',
                    duration: 22 + Math.random() * 8,
                    adText: 'TAP\nHERE',
                    sway: Math.random() * 70 - 35
                },
                { 
                    type: 'green-square', 
                    name: 'Green Square',
                    animation: 'floatUp',
                    duration: 17 + Math.random() * 13,
                    adText: 'CLICK\nME',
                    sway: Math.random() * 90 - 45
                }
            ];
            
            const leafType = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            const rotation = Math.random() * 360;
            
            const leafObject = document.createElement('div');
            leafObject.className = `leaf-object ${leafType.type}`;
            leafObject.style.setProperty('--rotation', `${rotation}deg`);
            
            // Add wobble effect for green leaves
            if (leafType.type === 'green-leaf') {
                leafObject.style.animation += ', wobble 3s infinite ease-in-out';
            }
            
            // Create leaf element
            const leaf = document.createElement('div');
            leaf.className = leafType.type;
            
            // Enhanced features for green leaf
            if (leafType.type === 'green-leaf') {
                // Add glow animation
                leaf.style.animation = 'leafPulse 3s infinite alternate';
                
                // Add detailed veins
                const veins = document.createElement('div');
                veins.className = 'leaf-veins';
                
                const mainVein = document.createElement('div');
                mainVein.className = 'vein vein-main';
                veins.appendChild(mainVein);
                
                // More veins for better detail
                for (let i = 0; i < 6; i++) {
                    const sideVein = document.createElement('div');
                    sideVein.className = 'vein vein-side';
                    veins.appendChild(sideVein);
                }
                
                leaf.appendChild(veins);
                
                // Add stem
                const stem = document.createElement('div');
                stem.className = 'leaf-stem';
                leaf.appendChild(stem);
            }
            
            // Enhanced AD text with 3D effect
            const adText = document.createElement('div');
            adText.className = 'ad-text';
            adText.textContent = leafType.adText;
            
            // Add subtle animation to text
            if (Math.random() > 0.5) {
                adText.style.animation = 'gentleBounce 2s infinite ease-in-out';
            }
            
            leaf.appendChild(adText);
            
            leafObject.appendChild(leaf);
            
            // Set position and enhanced animation
            if (leafType.animation === 'floatDown' || leafType.animation === 'floatUp') {
                const startX = Math.random() * window.innerWidth;
                const endX = startX + leafType.sway;
                leafObject.style.setProperty('--start-x', `${startX}px`);
                leafObject.style.setProperty('--end-x', `${endX}px`);
                leafObject.style.setProperty('--sway', `${leafType.sway}px`);
            } else {
                const startY = Math.random() * window.innerHeight;
                const endY = startY + leafType.sway;
                leafObject.style.setProperty('--start-y', `${startY}px`);
                leafObject.style.setProperty('--end-y', `${endY}px`);
                leafObject.style.setProperty('--sway', `${leafType.sway}px`);
            }
            
            // Enhanced animation with cubic-bezier timing
            leafObject.style.animation = 
                `${leafType.type === 'green-leaf' ? 'wobble 3s infinite ease-in-out, ' : ''}${leafType.animation} ${leafType.duration}s cubic-bezier(0.2, 0.8, 0.8, 0.2) forwards`;
            
            leafObject.style.left = '0px';
            leafObject.style.top = '0px';
            
            // Enhanced click event with feedback
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                console.log('🍃 Leaf clicked! Opening Monetag ad...');
                
                // Enhanced visual feedback
                leafObject.style.animation = 'clickPulse 0.4s ease-out forwards';
                leafObject.style.pointerEvents = 'none';
                
                // Vibrate if available (mobile)
                if (navigator.vibrate) {
                    navigator.vibrate([50, 30, 50]);
                }
                
                // Open Monetag ad in new tab after animation
                setTimeout(() => {
                    console.log('🔗 Opening:', MONETAG_LINK);
                    window.open(MONETAG_LINK, '_blank', 'noopener,noreferrer');
                    
                    // Remove leaf with fade out
                    leafObject.style.opacity = '0';
                    leafObject.style.transform = 'scale(0) rotate(180deg)';
                    
                    setTimeout(() => {
                        if (leafObject.parentNode) {
                            leafObject.remove();
                            activeLeaves--;
                        }
                    }, 300);
                }, 200);
                
                return false;
            };
            
            // Add both click and touch events - ΒΕΛΤΙΩΜΕΝΟ
            leafObject.addEventListener('click', handleClick, false);
            
            // Enhanced touch events
            leafObject.addEventListener('touchstart', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(1.2)';
            }, { passive: false });
            
            leafObject.addEventListener('touchend', function(e) {
                e.preventDefault();
                handleClick(e);
            }, { passive: false });
            
            // Remove when animation completes
            setTimeout(() => {
                if (leafObject.parentNode) {
                    leafObject.style.opacity = '0';
                    leafObject.style.transform = 'scale(0.5)';
                    
                    setTimeout(() => {
                        if (leafObject.parentNode) {
                            leafObject.remove();
                            activeLeaves--;
                        }
                    }, 500);
                }
            }, leafType.duration * 1000 - 1000);
            
            floatingLeaves.appendChild(leafObject);
            activeLeaves++;
            
            // Add hover effect for desktop
            if (!('ontouchstart' in window)) {
                leafObject.addEventListener('mouseenter', () => {
                    leafObject.style.animation += ', gentleBounce 1s infinite';
                });
                
                leafObject.addEventListener('mouseleave', () => {
                    leafObject.style.animation = leafObject.style.animation.replace(', gentleBounce 1s infinite', '');
                });
            }
        }
        
        // Start enhanced floating leaves after 30 seconds
        function startFloatingLeaves() {
            if (leavesStarted) return;
            
            leavesStarted = true;
            console.log('🍃 Starting ENHANCED green leaves with Monetag ads...');
            
            // Initial leaves with delay
            setTimeout(() => createGreenLeaf(), 0);
            setTimeout(() => createGreenLeaf(), 1500);
            setTimeout(() => createGreenLeaf(), 3000);
            
            // Continuous spawn with variable timing
            leavesInterval = setInterval(() => {
                if (leavesStarted && activeLeaves < MAX_LEAVES) {
                    createGreenLeaf();
                    
                    // Sometimes spawn two at once
                    if (Math.random() > 0.7 && activeLeaves < MAX_LEAVES - 1) {
                        setTimeout(() => createGreenLeaf(), 500);
                    }
                }
            }, 8000 + Math.random() * 7000);
        }
        
        // Start everything immediately
        document.addEventListener('DOMContentLoaded', init);
        
        // Fallback for fast loading
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Add vibration support check
        if (!navigator.vibrate) {
            console.log('📱 Vibration not supported on this device');
        }
        
        // Debug info
        console.log('✅ Monetag ad link:', MONETAG_LINK);
        console.log('⏰ Leaves start delay:', LEAVES_START_DELAY/1000, 'seconds');
    </script>
</body>
