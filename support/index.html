<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capybara Xmas Merge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #2c3e50;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #2c3e50;
        }
        
        .game-header {
            background: #e74c3c;
            padding: 8px 12px;
            text-align: center;
            border-bottom: 3px solid #f1c40f;
            flex-shrink: 0;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .game-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-bottom: 3px;
        }
        
        .game-subtitle {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
        }
        
        .main-game-area {
            flex: 1;
            background: #34495e;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #2c3e50;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(241, 196, 15, 0.3);
            border-radius: 50%;
            border-top-color: #f1c40f;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #f1c40f;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .game-footer {
            background: #e74c3c;
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 3px solid #f1c40f;
            flex-shrink: 0;
            height: 70px;
        }
        
        .game-btn {
            padding: 8px 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 0 #219653;
            min-width: 100px;
        }
        
        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #219653;
        }
        
        .game-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #219653;
        }
        
        .reload-btn {
            background: #e67e22;
            box-shadow: 0 3px 0 #d35400;
        }
        
        .reload-btn:hover {
            box-shadow: 0 4px 0 #d35400;
        }
        
        .sound-btn {
            background: #3498db;
            box-shadow: 0 3px 0 #2980b9;
        }
        
        .sound-btn:hover {
            box-shadow: 0 4px 0 #2980b9;
        }
        
        /* Ad Container */
        .ad-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid #f1c40f;
            display: none;
            animation: slideInUp 0.5s ease;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        
        .ad-title {
            color: #2c3e50;
            font-size: 0.9rem;
            font-weight: 700;
        }
        
        .close-ad-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .close-ad-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }
        
        #admobAd {
            min-width: 300px;
            min-height: 250px;
            background: #f8f9fa;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Google AdSense Container */
        .adsense-container {
            position: fixed;
            bottom: 80px;
            left: 20px;
            z-index: 99;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 3px solid #3498db;
            display: none;
            animation: slideInLeft 0.5s ease;
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .adsense-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        
        .adsense-title {
            color: #2c3e50;
            font-size: 0.9rem;
            font-weight: 700;
        }
        
        .close-adsense-btn {
            background: #3498db;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .close-adsense-btn:hover {
            background: #2980b9;
            transform: scale(1.1);
        }
        
        /* Ad Blocker Warning */
        .adblock-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.95);
            color: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            z-index: 1001;
            display: none;
            text-align: center;
            border: 4px solid #f1c40f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .warning-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 15px;
        }
        
        .warning-text {
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .warning-btn {
            padding: 10px 25px;
            background: #f1c40f;
            color: #2c3e50;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .warning-btn:hover {
            background: #f39c12;
            transform: scale(1.05);
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .game-header {
                padding: 6px 10px;
                height: 60px;
            }
            
            .game-title {
                font-size: 1.1rem;
            }
            
            .game-subtitle {
                font-size: 0.7rem;
            }
            
            .game-footer {
                padding: 8px 12px;
                height: 60px;
            }
            
            .game-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
                min-width: 80px;
            }
            
            .ad-container {
                right: 10px;
                bottom: 70px;
                padding: 8px;
            }
            
            #admobAd {
                min-width: 250px;
                min-height: 200px;
            }
            
            .adsense-container {
                left: 10px;
                bottom: 70px;
                padding: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .game-header {
                height: 55px;
                padding: 5px 8px;
            }
            
            .game-title {
                font-size: 1rem;
                margin-bottom: 2px;
            }
            
            .game-subtitle {
                font-size: 0.65rem;
            }
            
            .game-footer {
                height: 55px;
                padding: 6px 10px;
                gap: 8px;
            }
            
            .game-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
                min-width: 70px;
                gap: 4px;
            }
            
            .ad-container {
                display: none !important;
            }
            
            .adsense-container {
                display: none !important;
            }
        }
        
        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .game-btn:hover, .warning-btn:hover {
                transform: none;
            }
            
            .game-btn:active, .warning-btn:active {
                transform: scale(0.96);
            }
        }
    </style>

<body>
    <!-- Main Game Container -->
    <div class="game-container">
        <!-- Game Header -->
        <div class="game-header">
            <div class="game-title">Capybara Xmas Merge</div>
            <div class="game-subtitle">Χριστουγεννιάτικο παιχνίδι Συγχώνευσης με Καπιβάρα!</div>
        </div>
        
        <!-- Main Game Area -->
        <div class="main-game-area">
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div class="loading-text">Φόρτωση Capybara Xmas Merge...</div>
            </div>
            
            <iframe 
                src="https://html5.gamedistribution.com/1a09e82198a8432da4f0a9c103187f7e/?gd_sdk_referrer_url=https://gamedistribution.com/games/capybara-xmas-merge"

    <!-- Floating Ad Container (AdMob) -->
    <div class="ad-container" id="floatingAd">

            <!-- AdMob ad will load here -->

    <!-- Google AdSense Container -->
    <div class="adsense-container" id="adsenseContainer">

        <div id="adsenseAd">
            <!-- Google AdSense ad -->
            <ins class="adsbygoogle"

    <!-- Ad Blocker Warning -->
    <div class="adblock-warning" id="adblockWarning">
        <div class="warning-title">⚠️ AdBlocker Ανιχνεύθηκε</div>
        <div class="warning-text">
            Παρακαλώ απενεργοποιήστε το AdBlocker για να συνεχίσετε.<br>
            Οι διαφημίσεις υποστηρίζουν το δωρεάν παιχνίδι.
        </div>
        <button class="warning-btn" id="continueBtn">Συνέχεια</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gameFrame = document.getElementById('gameFrame');
            const loadingScreen = document.getElementById('loadingScreen');
            const reloadBtn = document.getElementById('reloadBtn');
            const soundBtn = document.getElementById('soundBtn');
            const floatingAd = document.getElementById('floatingAd');
            const closeFloatingAd = document.getElementById('closeFloatingAd');
            const adsenseContainer = document.getElementById('adsenseContainer');
            const closeAdsenseBtn = document.getElementById('closeAdsenseBtn');
            const adblockWarning = document.getElementById('adblockWarning');
            const continueBtn = document.getElementById('continueBtn');
            const admobAdContainer = document.getElementById('admobAd');
            const adsenseAdContainer = document.getElementById('adsenseAd');
            
            // Game state
            let soundEnabled = true;
            let adInterval = 90; // 1.5 minutes in seconds (ενάμιση λεπτό)
            let adIntervalId;
            let isAdShowing = false;
            let admobInterstitial = null;
            let adsenseLoaded = false;
            
            // Initialize game
            function initGame() {
                // Initialize AdMob interstitial
                initAdMobInterstitial();
                
                // Load Google AdSense
                initAdSense();
                
                // Start ad timer (NO VISUAL COUNTDOWN)
                startAdTimer();
                
                // Show ads after 30 seconds
                setTimeout(() => {
                    showAds();
                }, 30000);
            }
            
            // Initialize AdMob Interstitial
            function initAdMobInterstitial() {
                // Check if AdMob is available
                if (typeof adsbygoogle !== 'undefined') {
                    // Preload an interstitial
                    admobInterstitial = {
                        isLoaded: false,
                        load: function() {
                            console.log("AdMob Interstitial: Loading ad...");
                            // This is where you would normally use the Google Mobile Ads SDK
                            // For web, we'll simulate the behavior
                            this.isLoaded = true;
                            console.log("AdMob Interstitial: Ad loaded (Ad Unit: ca-app-pub-3186700611266549/7794500584)");
                        },
                        show: function() {
                            if (this.isLoaded) {
                                console.log("AdMob Interstitial: Showing video ad at 1.5 minutes");
                                showAdMobVideoAd();
                                this.isLoaded = false;
                                return true;
                            }
                            return false;
                        }
                    };
                    
                    // Load first interstitial
                    admobInterstitial.load();
                } else {
                    console.log("AdMob script not loaded");
                }
            }
            
            // Initialize Google AdSense
            function initAdSense() {
                if (typeof adsbygoogle !== 'undefined') {
                    console.log("Google AdSense: Initializing (Ad Slot: 6125539150)");
                    adsenseLoaded = true;
                    
                    // Create AdSense ad container
                    if (adsenseAdContainer) {
                        adsenseAdContainer.innerHTML = `
                            <ins class="adsbygoogle"
                                 style="display:block"
                                 data-ad-client="ca-pub-3186700611266549"
                                 data-ad-slot="6125539150"
                                 data-ad-format="auto"
                                 data-full-width-responsive="true"></ins>
                            <script>
                                 (adsbygoogle = window.adsbygoogle || []).push({});
                            <\/script>
                        `;
                        
                        // Try to load AdSense ad
                        try {
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        } catch(e) {
                            console.log("AdSense error: ", e);
                        }
                    }
                } else {
                    console.log("AdSense script not loaded");
                }
            }
            
            // Show both ads
            function showAds() {
                if (window.innerWidth > 480 && !isAdShowing) {
                    isAdShowing = true;
                    
                    // Show AdMob banner on the right
                    createAdMobBanner();
                    floatingAd.style.display = 'block';
                    
                    // Show AdSense on the left (if loaded)
                    if (adsenseLoaded) {
                        adsenseContainer.style.display = 'block';
                    }
                    
                    // Auto-hide after 30 seconds
                    setTimeout(() => {
                        closeAllAds();
                    }, 30000);
                }
            }
            
            // Show AdMob video ad (simulated)
            function showAdMobVideoAd() {
                isAdShowing = true;
                
                // Pause game timer
                clearInterval(adIntervalId);
                
                // Hide other ads
                closeAllAds();
                
                // Create fullscreen AdMob video ad simulation
                const videoAdOverlay = document.createElement('div');
                videoAdOverlay.id = 'videoAdOverlay';
                videoAdOverlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: #000;
                    z-index: 1000;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                `;
                
                // Video ad simulation - NO COUNTDOWN VISIBLE
                videoAdOverlay.innerHTML = `
                    <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                        <!-- Ad Header - Minimal, no countdown -->
                        <div style="background: rgba(0,0,0,0.8); padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <div style="color: white; font-size: 0.9rem; font-weight: bold;">
                                Διαφήμιση AdMob
                            </div>
                            <div id="adCloseBtn" style="color: white; font-size: 1.5rem; cursor: pointer; padding: 0 10px; display: none;">×</div>
                        </div>
                        
                        <!-- Video Ad Content -->
                        <div style="flex: 1; display: flex; justify-content: center; align-items: center; background: #1a1a1a;">
                            <div style="text-align: center; color: white; padding: 20px;">
                                <i class="fas fa-play-circle" style="font-size: 4rem; color: #e74c3c; margin-bottom: 20px;"></i>
                                <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 10px;">AdMob Video Διαφήμιση</div>
                                <div style="font-size: 1rem; margin-bottom: 20px; max-width: 400px;">
                                    Βίντεο διαφήμισης<br>
                                    <small>Αυτό το περιεχόμενο υποστηρίζει το δωρεάν παιχνίδι</small>
                                </div>
                                <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-top: 20px; font-size: 0.8rem;">
                                    Ad Unit: ca-app-pub-3186700611266549/7794500584
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(videoAdOverlay);
                
                // Start countdown (INVISIBLE)
                let countdown = 30; // 30-second video
                const closeBtn = document.getElementById('adCloseBtn');
                
                // Show close button after 5 seconds
                setTimeout(() => {
                    closeBtn.style.display = 'block';
                }, 5000);
                
                // Auto-close after 30 seconds
                setTimeout(() => {
                    if (document.getElementById('videoAdOverlay')) {
                        closeVideoAd();
                    }
                }, 30000);
                
                // Close button functionality
                closeBtn.addEventListener('click', function() {
                    if (closeBtn.style.display === 'block') {
                        closeVideoAd();
                    }
                });
            }
            
            // Close video ad
            function closeVideoAd() {
                const videoAdOverlay = document.getElementById('videoAdOverlay');
                if (videoAdOverlay) {
                    videoAdOverlay.style.opacity = '0';
                    videoAdOverlay.style.transition = 'opacity 0.5s ease';
                    
                    setTimeout(() => {
                        if (videoAdOverlay.parentNode) {
                            document.body.removeChild(videoAdOverlay);
                        }
                        isAdShowing = false;
                        
                        // Restart ad timer (1.5 minutes)
                        startAdTimer();
                        
                        // Preload next ad
                        if (admobInterstitial) {
                            setTimeout(() => {
                                admobInterstitial.load();
                            }, 1000);
                        }
                    }, 500);
                }
            }
            
            // Start ad countdown timer (NO VISUAL INDICATOR)
            function startAdTimer() {
                adInterval = 90; // 1.5 minutes
                
                adIntervalId = setInterval(() => {
                    adInterval--;
                    
                    if (adInterval <= 0 && !isAdShowing) {
                        // Show AdMob interstitial
                        if (admobInterstitial && admobInterstitial.show()) {
                            console.log("AdMob Interstitial shown at 1.5 minutes");
                        } else {
                            // Fallback to floating ad
                            showFullscreenAd();
                        }
                        adInterval = 90; // Reset to 1.5 minutes
                    }
                }, 1000);
            }
            
            // Show fullscreen ad (fallback)
            function showFullscreenAd() {
                isAdShowing = true;
                
                // Pause game timer
                clearInterval(adIntervalId);
                
                // Show floating ad as fullscreen
                floatingAd.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    width: 90%;
                    max-width: 500px;
                    max-height: 80vh;
                    z-index: 1000;
                    display: block;
                    animation: popIn 0.5s ease;
                `;
                
                // Create larger AdMob banner
                createAdMobBanner('large');
                
                // Auto-close after 30 seconds
                setTimeout(() => {
                    closeFullscreenAd();
                }, 30000);
            }
            
            // Create AdMob banner
            function createAdMobBanner(size = 'small') {
                // Clear container
                admobAdContainer.innerHTML = '';
                
                // Create ad placeholder
                const placeholder = document.createElement('div');
                placeholder.style.cssText = `
                    width: 100%;
                    height: ${size === 'large' ? '400px' : '250px'};
                    background: #f8f9fa;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    color: #666;
                `;
                
                placeholder.innerHTML = `
                    <i class="fas fa-ad" style="font-size: ${size === 'large' ? '3rem' : '2rem'}; color: #e74c3c; margin-bottom: 15px;"></i>
                    <div style="font-size: ${size === 'large' ? '1.2rem' : '1rem'}; margin-bottom: 10px;">AdMob Διαφήμιση</div>
                    <div style="font-size: 0.8rem; margin-bottom: 5px;">Ad Unit: ca-app-pub-3186700611266549/7794500584</div>
                    <div style="font-size: 0.9rem; text-align: center; padding: 0 20px;">
                        Αυτή η διαφήμιση υποστηρίζει το δωρεάν παιχνίδι
                    </div>
                `;
                
                admobAdContainer.appendChild(placeholder);

            // Close all ads
            function closeAllAds() {
                floatingAd.style.display = 'none';
                adsenseContainer.style.display = 'none';
                isAdShowing = false;
            }
            
            // Close floating ad
            function closeFloatingAdFunc() {
                floatingAd.style.display = 'none';
                isAdShowing = false;
            }
            
            // Close AdSense ad
            function closeAdsenseFunc() {
                adsenseContainer.style.display = 'none';
                isAdShowing = false;
            }
            
            // Close fullscreen ad
            function closeFullscreenAd() {
                // Reset floating ad position
                floatingAd.style.cssText = `
                    position: fixed;
                    bottom: 80px;
                    right: 20px;
                    z-index: 100;
                    background: rgba(255, 255, 255, 0.95);
                    border-radius: 10px;
                    padding: 10px;
                    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
                    border: 3px solid #f1c40f;
                    display: none;
                `;
                
                floatingAd.style.display = 'none';
                isAdShowing = false;
                
                // Hide ad blocker warning
                adblockWarning.style.display = 'none';
                
                // Restart ad timer (1.5 minutes)
                startAdTimer();
            }
            
            // Event Listeners
            
            // Game loaded
            gameFrame.addEventListener('load', function() {
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        // Initialize game after loading
                        initGame();
                    }, 300);
                }, 1500);
            });
            
            // Reload game
            reloadBtn.addEventListener('click', function() {
                loadingScreen.style.display = 'flex';
                loadingScreen.style.opacity = '1';
                
                // Reset ad system
                clearInterval(adIntervalId);
                floatingAd.style.display = 'none';
                adsenseContainer.style.display = 'none';
                adblockWarning.style.display = 'none';
                isAdShowing = false;
                
                setTimeout(() => {
                    gameFrame.src = gameFrame.src;
                }, 300);
                
                // Animation
                reloadBtn.style.transform = 'rotate(180deg)';
                setTimeout(() => {
                    reloadBtn.style.transform = '';
                }, 300);
            });
            
            // Sound toggle
            soundBtn.addEventListener('click', function() {
                soundEnabled = !soundEnabled;
                
                if (soundEnabled) {
                    soundBtn.innerHTML = '<i class="fas fa-volume-up"></i> Ήχος';
                    soundBtn.style.background = '#3498db';
                } else {
                    soundBtn.innerHTML = '<i class="fas fa-volume-mute"></i> Ήχος';
                    soundBtn.style.background = '#7f8c8d';
                }
                
                // Animation
                soundBtn.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    soundBtn.style.transform = '';
                }, 200);
            });
            
            // Close floating ad
            closeFloatingAd.addEventListener('click', function() {
                closeFloatingAdFunc();
            });
            
            // Close AdSense ad
            closeAdsenseBtn.addEventListener('click', function() {
                closeAdsenseFunc();
            });
            
            // Continue button for ad blocker warning
            continueBtn.addEventListener('click', function() {
                adblockWarning.style.display = 'none';
                closeFullscreenAd();
            });
            
            // Error handling
            gameFrame.addEventListener('error', function() {
                loadingScreen.innerHTML = `
                    <div style="text-align: center; padding: 20px; max-width: 400px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #f1c40f; margin-bottom: 15px;"></i>

                        <button class="game-btn" onclick="location.reload()" style="background: #e67e22;">
                            <i class="fas fa-sync-alt"></i> Ανανέωση
                        </button>
                    </div>
                `;
            });

            console.log("📱 Διαφημίσεις θα εμφανίζονται κάθε 1.5 λεπτά");
