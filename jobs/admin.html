<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ergasia Trikala</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; background: #e2e8f0; border: none; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #2563eb; color: white; }
        .panel { display: none; } .panel.active { display: block; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        .del-btn { background: #dc2626; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align:center;">Πίνακας Ελέγχου</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('workers')">Εργάτες</button>
        <button class="tab-btn" onclick="switchTab('employers')">Εργοδότες</button>
    </div>
    <div id="workers" class="panel active"><table><tbody id="w-tbody"></tbody></table></div>
    <div id="employers" class="panel"><table><tbody id="e-tbody"></tbody></table></div>
</div>
<script>
    const API = "https://jobs.kafevolta.workers.dev";
    function switchTab(t) { 
        document.querySelectorAll('.tab-btn, .panel').forEach(e => e.classList.remove('active'));
        document.querySelector(`.tab-btn[onclick="switchTab('${t}')"]`).classList.add('active');
        document.getElementById(t).classList.add('active');
    }
    async function load() {
        try {
            const [wr, er] = await Promise.all([fetch(`${API}/api/workers`), fetch(`${API}/api/employers`)]);
            render('w-tbody', await wr.json(), 'worker'); render('e-tbody', await er.json(), 'employer');
        } catch(e) { alert("Σφάλμα φόρτωσης"); }
    }
    function render(id, data, type) {
        document.getElementById(id).innerHTML = `<tr><th>Όνομα</th><th>Ειδικότητα</th><th>Επικοινωνία</th><th>Ενέργεια</th></tr>` + 
        data.map(r => `<tr><td>${r.name} ${r.is_urgent ? '🔴' : ''}</td><td>${r.specialty||r.task}</td><td>${r.phone}</td>
        <td><button class="del-btn" onclick="del(${r.id}, '${type}')">Διαγραφή</button></td></tr>`).join('');
    }
    async function del(id, type) {
        if(!confirm('Διαγραφή;')) return;
        await fetch(`${API}/`, { method: 'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, type, pin:'ADMIN999'}) });
        load();
    }
    window.onload = load;
</script>
</body>
</html>
