<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Εργασία - Νομός Τρικάλων</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0;
        }

        .role-selection { display: flex; flex-direction: column; gap: 15px; }

        .role-btn {
            display: flex; align-items: center; padding: 20px;
            background: #ffffff; border: 2px solid #e2e8f0;
            border-radius: 12px; cursor: pointer; text-align: left;
        }
        .role-btn:hover { border-color: var(--accent); background: #f0fdf4; }
        .role-icon { font-size: 2.5rem; margin-right: 20px; }
        .role-text h3 { margin: 0 0 5px 0; color: var(--primary); font-size: 1.2rem; }
        .role-text p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

        .screen { display: none; }
        .screen.active { display: block; }

        .back-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 1rem; cursor: pointer; margin-bottom: 20px;
            padding: 0; display: flex; align-items: center;
        }
        .back-btn:hover { color: var(--primary); }

        .form-group { margin-bottom: 20px; }
        label.main-label {
            display: block; margin-bottom: 8px; font-weight: 600;
            color: var(--primary); font-size: 0.95rem;
        }

        input[type="text"], input[type="tel"], select, textarea {
            width: 100%; padding: 14px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-size: 16px; box-sizing: border-box;
            background-color: #f8fafc; font-family: inherit;
        }
        textarea { resize: vertical; min-height: 80px; }

        /* Custom Checkbox Dropdown (Accordion) */
        .location-selector {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            max-height: 280px;
            overflow-y: auto;
            padding: 10px;
        }
        .municipality-group {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .municipality-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .municipality-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            cursor: pointer;
            flex-grow: 1;
            color: var(--primary);
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .toggle-btn {
            background: #e2e8f0;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px 12px;
            color: var(--primary);
            font-weight: bold;
        }

        .communities-list {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding-left: 30px;
            padding-top: 10px;
        }

        .submit-btn {
            width: 100%; background: var(--accent); color: white;
            border: none; padding: 16px; font-size: 1.1rem;
            font-weight: bold; border-radius: 8px; cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover { background: var(--accent-hover); }

    </style>
</head>
<body>

<div class="container">
    
    <div class="header">
        <h1>Εργασία - Νομός Τρικάλων</h1>
    </div>

    <!-- ΕΠΙΛΟΓΗ ΡΟΛΟΥ -->
    <div id="screen-home" class="screen active">
        <h2 style="text-align:center; margin-bottom: 25px;">Τι ψάχνετε;</h2>
        <div class="role-selection">
            <button class="role-btn" onclick="showScreen('screen-worker')">
                <div class="role-icon">👷‍♂️</div>
                <div class="role-text">
                    <h3>Ψάχνω για Εργασία</h3>
                    <p>Είμαι τεχνίτης, εργάτης ή προσφέρω υπηρεσίες</p>
                </div>
            </button>
            <button class="role-btn" onclick="showScreen('screen-employer')">
                <div class="role-icon">🏡</div>
                <div class="role-text">
                    <h3>Είμαι Εργοδότης</h3>
                    <p>Ψάχνω άτομο για εργασία, εστίαση ή χωράφια</p>
                </div>
            </button>
        </div>
    </div>

    <!-- ΦΟΡΜΑ ΕΡΓΑΤΗ -->
    <div id="screen-worker" class="screen">
        <button class="back-btn" onclick="showScreen('screen-home')">← Πίσω</button>
        <h2>Δήλωση Εργασίας</h2>
        <form id="workerForm">
            <div class="form-group">
                <label class="main-label">Όνομα (ή Επωνυμία):</label>
                <input type="text" id="w_name" required>
            </div>
            <div class="form-group">
                <label class="main-label">Τηλέφωνο επικοινωνίας:</label>
                <input type="tel" id="w_phone" required>
            </div>
            <div class="form-group">
                <label class="main-label">Ειδικότητα / Είδος εργασίας:</label>
                <select class="job-category" id="w_job" required></select>
            </div>
            <div class="form-group">
                <label class="main-label">Περιοχές που μπορείτε να εξυπηρετήσετε:</label>
                <div class="location-selector" id="worker-locations"></div>
            </div>
            <div class="form-group">
                <label class="main-label">Σχόλια / Λεπτομέρειες (Προαιρετικό):</label>
                <textarea id="w_comments" placeholder="π.χ. Διαθέτω δικό μου όχημα..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Καταχώρηση Προφίλ</button>
        </form>
    </div>

    <!-- ΦΟΡΜΑ ΕΡΓΟΔΟΤΗ -->
    <div id="screen-employer" class="screen">
        <button class="back-btn" onclick="showScreen('screen-home')">← Πίσω</button>
        <h2>Αναζήτηση Προσωπικού</h2>
        <form id="employerForm">
            <div class="form-group">
                <label class="main-label">Όνομα / Επιχείρηση:</label>
                <input type="text" id="e_name" required>
            </div>
            <div class="form-group">
                <label class="main-label">Τηλέφωνο επικοινωνίας:</label>
                <input type="tel" id="e_phone" required>
            </div>
            <div class="form-group">
                <label class="main-label">Τι ειδικότητα ψάχνετε;</label>
                <select class="job-category" id="e_job" required></select>
            </div>
            <div class="form-group">
                <label class="main-label">Τοποθεσία / Κοινότητες εργασίας:</label>
                <div class="location-selector" id="employer-locations"></div>
            </div>
            <div class="form-group">
                <label class="main-label">Περαιτέρω λεπτομέρειες / Παροχές (Προαιρετικό):</label>
                <textarea id="e_comments" placeholder="π.χ. Ωράριο, παροχές, αμοιβή..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Δημοσίευση Αγγελίας</button>
        </form>
    </div>

</div>

<script>
    const jobsData = {
        "Εστίαση & Αναψυχή": ["Καφετέρια Barista", "Καφετέρια Service", "Εστιατόριο Κουζίνα", "Εστιατόριο Service", "Καφενείο", "Τσιπουράδικο"],
        "Αγροτικές Εργασίες": ["Χωράφια / Αγροτικά", "Κηπουρικά", "Κλάδεμα"],
        "Τεχνικές - Οικοδομικές Εργασίες": ["Χτίσιμο - Γκρέμισμα - Σοβάτισμα", "Υδραυλικός", "Ηλεκτρολόγος", "Ψυκτικός (Κλιματιστικά/Ψυγεία)", "Πλακάκια - Μάρμαρα", "Σκεπές", "Μονώσεις", "Ανακαίνιση", "Βάψιμο"],
        "Οικιακές Υπηρεσίες": ["Καθαριότητα", "Φροντίδα Ηλικιωμένων", "Συναρμολόγηση Επίπλων", "Τοποθέτηση Τηλεόρασης", "Επισκευή Πλυντηρίου", "Επισκευή Στεγνωτηρίου"]
    };

    const locationsData = {
        "Δήμος Τρικκαίων": ["Τρίκαλα (Κέντρο)", "Αγία Κυριακή", "Αρδάνι", "Βαλτινό", "Γενέσι", "Γλίνος", "Γοργογύρι", "Δενδροχώρι", "Διαλεκτό", "Διπόταμο", "Ελληνόκαστρο", "Ζηλευτή", "Κάτω Ελάτη", "Κεφαλόβρυσο", "Κρηνίτσα", "Λιόπρασο", "Λόγγος", "Μεγάλα Καλύβια", "Μεγάλο Κεφαλόβρυσο", "Μεγαλοχώρι", "Μικρό Κεφαλόβρυσο", "Ξυλοπάροικο", "Παλαιόπυργος", "Πατουλιά", "Πλάτανος", "Πρίνος", "Ρίζωμα", "Σπαθάδες", "Φωτάδα", "Χρυσαυγή"],
        "Δήμος Μετεώρων": ["Καλαμπάκα", "Αγία Παρασκευή (Ασπροποτάμου)", "Αγία Παρασκευή (Κλεινοβού)", "Αγιόφυλλο", "Αγνάντια", "Αηδόνα", "Αμάραντο", "Αμπελοχώρι", "Ανθούσα", "Ασπροκκλησιά", "Αύρα", "Αχλαδέα", "Βασιλική", "Βλαχάβα", "Γαύρος", "Γερακάρι", "Γλυκομηλιά", "Θεόπετρα", "Θεοτόκος", "Κακοπλεύρι", "Καλλιθέα", "Καλλιρρόη", "Καλομοίρα", "Καστανέα", "Καστράκι", "Κατάφυτο", "Κλεινό", "Κονισκός", "Κορυδαλλός", "Κρανέα", "Κρύα Βρύση", "Λογγάς", "Μαλακάσι", "Ματονέρι", "Μαυρέλι", "Μεγάλη Κερασιά", "Ορθοβούνι", "Παναγία", "Περιστέρα", "Πεύκη", "Πολυθέα", "Σαρακήνα", "Στεφάνι", "Τρυγόνα", "Φλαμπουρέσι", "Χαλίκι", "Χρυσομηλιά"],
        "Δήμος Πύλης": ["Πύλη", "Άγιος Νικόλαος", "Άγιος Προκόπιος", "Αθαμανία", "Αρματολικό", "Βαθύρρευμα", "Βαλκάνο", "Γόμφοι", "Δέση", "Δροσερό", "Δροσοχώρι", "Ελάτη", "Ελευθεροχώρι", "Καρτέρι", "Κορυφή", "Κοτρώνι", "Λιβαδοχώρι", "Λυγαριά", "Μεσοχώρα", "Μοσχόφυτο", "Μουριά", "Μυρόφυλλο", "Νέα Πεύκη", "Νεράιδα", "Νεραϊδοχώρι", "Παλαιοκαρυά", "Παλαιομονάστηρο", "Παράμερο", "Παραπόταμος", "Παχτούρι", "Περτούλι", "Πετροχώρι", "Πηγή", "Πιάλεια", "Πολυνέρι", "Πύρρα", "Ροποτό", "Στουρναραίικα", "Φήκη (Φίκι)", "Φιλύρα"],
        "Δήμος Φαρκαδόνας": ["Φαρκαδόνα", "Αχλαδοχώρι", "Γεωργανάδες", "Γριζάνο", "Διάσελλο", "Ζάρκο", "Κεραμίδι", "Κρήνη", "Νομή", "Οιχαλία (Νεοχώρι)", "Παναγίτσα", "Πετρόπορος", "Πετρωτό", "Πηνειάδα", "Ταξιάρχες", "Φανερωμένη"]
    };

    function populateJobs() {
        document.querySelectorAll('.job-category').forEach(select => {
            select.innerHTML = '<option value="" disabled selected>-- Επιλέξτε --</option>';
            for (const [group, jobs] of Object.entries(jobsData)) {
                let optgroup = document.createElement('optgroup');
                optgroup.label = group;
                jobs.forEach(job => optgroup.innerHTML += `<option value="${job}">${job}</option>`);
                select.appendChild(optgroup);
            }
        });
    }

    function buildLocationSelectors() {
        const containers = [document.getElementById('worker-locations'), document.getElementById('employer-locations')];
        
        containers.forEach((container, index) => {
            let html = '';
            for (const [municipality, locations] of Object.entries(locationsData)) {
                const sortedLocs = locations.sort((a, b) => a.localeCompare(b, 'el'));
                const munId = `mun_${index}_${municipality.replace(/\s+/g, '')}`;
                
                html += `
                <div class="municipality-group">
                    <div class="municipality-header">
                        <label class="checkbox-label">
                            <input type="checkbox" class="mun-checkbox" data-target="${munId}" value="${municipality}">
                            <strong>${municipality}</strong>
                        </label>
                        <button type="button" class="toggle-btn" onclick="toggleAccordion('${munId}')">▼</button>
                    </div>
                    <div class="communities-list" id="${munId}">
                `;
                
                sortedLocs.forEach(loc => {
                    html += `
                        <label class="checkbox-label">
                            <input type="checkbox" class="com-checkbox" data-parent="${munId}" value="${loc}">
                            ${loc}
                        </label>
                    `;
                });
                
                html += `</div></div>`;
            }
            container.innerHTML = html;
        });

        attachCheckboxLogic();
    }

    function toggleAccordion(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
    }

    function attachCheckboxLogic() {
        document.querySelectorAll('.mun-checkbox').forEach(munCb => {
            munCb.addEventListener('change', function() {
                const targetId = this.getAttribute('data-target');
                document.querySelectorAll(`#${targetId} .com-checkbox`).forEach(cb => {
                    cb.checked = this.checked;
                });
            });
        });

        document.querySelectorAll('.com-checkbox').forEach(comCb => {
            comCb.addEventListener('change', function() {
                const parentId = this.getAttribute('data-parent');
                const parentCb = document.querySelector(`.mun-checkbox[data-target="${parentId}"]`);
                const siblings = Array.from(document.querySelectorAll(`#${parentId} .com-checkbox`));
                
                const allChecked = siblings.every(cb => cb.checked);
                const someChecked = siblings.some(cb => cb.checked);
                
                parentCb.checked = allChecked;
                parentCb.indeterminate = someChecked && !allChecked;
            });
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo(0,0);
    }

    window.onload = () => {
        populateJobs();
        buildLocationSelectors();
    };

    // Συλλογή Δεδομένων κατά την Υποβολή
    function handleFormSubmit(e, formType) {
        e.preventDefault();
        const containerId = formType === 'worker' ? 'worker-locations' : 'employer-locations';
        const checkedBoxes = document.querySelectorAll(`#${containerId} .com-checkbox:checked`);
        
        if (checkedBoxes.length === 0) {
            alert('Παρακαλώ επιλέξτε τουλάχιστον μία περιοχή ή δήμο.');
            return;
        }

        const selectedLocations = Array.from(checkedBoxes).map(cb => cb.value);
        console.log(`Επιλεγμένες περιοχές: ${selectedLocations.join(', ')}`);
        alert('Η φόρμα είναι έτοιμη για αποστολή στο backend!\nΕπιλέξατε ' + selectedLocations.length + ' περιοχές.');
    }

    document.getElementById('workerForm').addEventListener('submit', (e) => handleFormSubmit(e, 'worker'));
    document.getElementById('employerForm').addEventListener('submit', (e) => handleFormSubmit(e, 'employer'));
</script>

</body>
</html>
