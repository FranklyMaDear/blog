<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Εργασία - Νομός Τρικάλων</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Header */
        .header {
            text-align: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0;
        }

        /* Role Selection */
        .role-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .role-btn {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .role-btn:hover {
            border-color: var(--accent);
            background: #f0fdf4;
        }

        .role-icon {
            font-size: 2.5rem;
            margin-right: 20px;
        }

        .role-text h3 {
            margin: 0 0 5px 0;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .role-text p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Forms */
        .screen { display: none; }
        .screen.active { display: block; }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
            padding: 0;
            display: flex;
            align-items: center;
        }
        
        .back-btn:hover { color: var(--primary); }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #f8fafc;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #ffffff;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        optgroup {
            font-weight: bold;
            color: #0f172a;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .submit-btn:hover { background: var(--accent-hover); }

    </style>
</head>
<body>

<div class="container">
    
    <!-- HEADER -->
    <div class="header">
        <h1>Εργασία - Νομός Τρικάλων</h1>
    </div>

    <!-- ΟΘΟΝΗ 1: ΕΠΙΛΟΓΗ ΡΟΛΟΥ -->
    <div id="screen-home" class="screen active">
        <h2 style="text-align:center; margin-bottom: 25px;">Τι ψάχνετε;</h2>
        
        <div class="role-selection">
            <button class="role-btn" onclick="showScreen('screen-worker')">
                <div class="role-icon">👷‍♂️</div>
                <div class="role-text">
                    <h3>Ψάχνω για Εργασία</h3>
                    <p>Είμαι τεχνίτης, εργάτης ή προσφέρω υπηρεσίες</p>
                </div>
            </button>

            <button class="role-btn" onclick="showScreen('screen-employer')">
                <div class="role-icon">🏡</div>
                <div class="role-text">
                    <h3>Είμαι Εργοδότης</h3>
                    <p>Ψάχνω άτομο για εργασία, εστίαση ή χωράφια</p>
                </div>
            </button>
        </div>
    </div>

    <!-- ΟΘΟΝΗ 2: ΦΟΡΜΑ ΕΡΓΑΤΗ -->
    <div id="screen-worker" class="screen">
        <button class="back-btn" onclick="showScreen('screen-home')">← Πίσω</button>
        
        <h2>Δήλωση Εργασίας (Ψάχνω Δουλειά)</h2>
        
        <form id="workerForm">
            <div class="form-group">
                <label>Όνομα (ή Επωνυμία):</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Τηλέφωνο επικοινωνίας:</label>
                <input type="tel" required>
            </div>

            <div class="form-group">
                <label>Ειδικότητα / Είδος εργασίας:</label>
                <select class="job-category" required></select>
            </div>

            <div class="form-group">
                <label>Περιοχή που εξυπηρετείτε / μένετε:</label>
                <select class="location-select" required></select>
            </div>
            
            <div class="form-group">
                <label>Σχόλια / Λεπτομέρειες (Προαιρετικό):</label>
                <textarea placeholder="π.χ. Διαθέτω δικό μου όχημα, έχω εμπειρία 5 χρόνια κ.λπ."></textarea>
            </div>

            <button type="submit" class="submit-btn">Καταχώρηση Προφίλ</button>
        </form>
    </div>

    <!-- ΟΘΟΝΗ 3: ΦΟΡΜΑ ΕΡΓΟΔΟΤΗ -->
    <div id="screen-employer" class="screen">
        <button class="back-btn" onclick="showScreen('screen-home')">← Πίσω</button>
        
        <h2>Αναζήτηση Προσωπικού (Ψάχνω Εργάτη)</h2>
        
        <form id="employerForm">
            <div class="form-group">
                <label>Όνομα / Επιχείρηση:</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Τηλέφωνο επικοινωνίας:</label>
                <input type="tel" required>
            </div>

            <div class="form-group">
                <label>Τι ειδικότητα ψάχνετε;</label>
                <select class="job-category" required></select>
            </div>

            <div class="form-group">
                <label>Τοποθεσία εργασίας:</label>
                <select class="location-select" required></select>
            </div>
            
            <div class="form-group">
                <label>Περαιτέρω λεπτομέρειες / Παροχές (Προαιρετικό):</label>
                <textarea placeholder="π.χ. Ωράριο 08:00 - 16:00, παρέχεται διατροφή, αμοιβή συζητήσιμη."></textarea>
            </div>

            <button type="submit" class="submit-btn">Δημοσίευση Αγγελίας</button>
        </form>
    </div>

</div>

<script>
    // 1. ΔΕΔΟΜΕΝΑ: Κατηγορίες Εργασιών (Ομαδοποιημένες)
    const jobsData = {
        "Εστίαση & Αναψυχή": [
            "Καφετέρια Barista", "Καφετέρια Service", "Εστιατόριο Κουζίνα", 
            "Εστιατόριο Service", "Καφενείο", "Τσιπουράδικο"
        ],
        "Αγροτικές Εργασίες": [
            "Χωράφια / Αγροτικά", "Κηπουρικά", "Κλάδεμα"
        ],
        "Τεχνικές - Οικοδομικές Εργασίες": [
            "Χτίσιμο - Γκρέμισμα - Σοβάτισμα", "Υδραυλικός", "Ηλεκτρολόγος", 
            "Ψυκτικός (Κλιματιστικά/Ψυγεία)", "Πλακάκια - Μάρμαρα", 
            "Σκεπές", "Μονώσεις", "Ανακαίνιση", "Βάψιμο"
        ],
        "Οικιακές Υπηρεσίες & Μικροεργασίες": [
            "Καθαριότητα", "Φροντίδα Ηλικιωμένων", "Συναρμολόγηση Επίπλων", 
            "Τοποθέτηση Τηλεόρασης", "Επισκευή Πλυντηρίου", "Επισκευή Στεγνωτηρίου"
        ]
    };

    // 2. ΔΕΔΟΜΕΝΑ: Περιοχές / Δήμοι Ν. Τρικάλων (Ομαδοποιημένα)
    const locationsData = {
        "Δήμος Τρικκαίων": [
            "Τρίκαλα (Κέντρο)", "Αγία Κυριακή", "Αρδάνι", "Βαλτινό", "Γενέσι", "Γλίνος", 
            "Γοργογύρι", "Δενδροχώρι", "Διαλεκτό", "Διπόταμο", "Ελληνόκαστρο", "Ζηλευτή", 
            "Κάτω Ελάτη", "Κεφαλόβρυσο", "Κρηνίτσα", "Λιόπρασο", "Λόγγος", "Μεγάλα Καλύβια", 
            "Μεγάλο Κεφαλόβρυσο", "Μεγαλοχώρι", "Μικρό Κεφαλόβρυσο", "Ξυλοπάροικο", 
            "Παλαιόπυργος", "Πατουλιά", "Πλάτανος", "Πρίνος", "Ρίζωμα", "Σπαθάδες", 
            "Φωτάδα", "Χρυσαυγή"
        ],
        "Δήμος Μετεώρων": [
            "Καλαμπάκα", "Αγία Παρασκευή (Ασπροποτάμου)", "Αγία Παρασκευή (Κλεινοβού)", 
            "Αγιόφυλλο", "Αγνάντια", "Αηδόνα", "Αμάραντο", "Αμπελοχώρι", "Ανθούσα", 
            "Ασπροκκλησιά", "Αύρα", "Αχλαδέα", "Βασιλική", "Βλαχάβα", "Γαύρος", 
            "Γερακάρι", "Γλυκομηλιά", "Θεόπετρα", "Θεοτόκος", "Κακοπλεύρι", "Καλλιθέα", 
            "Καλλιρρόη", "Καλομοίρα", "Καστανέα", "Καστράκι", "Κατάφυτο", "Κλεινό", 
            "Κονισκός", "Κορυδαλλός", "Κρανέα", "Κρύα Βρύση", "Λογγάς", "Μαλακάσι", 
            "Ματονέρι", "Μαυρέλι", "Μεγάλη Κερασιά", "Ορθοβούνι", "Παναγία", "Περιστέρα", 
            "Πεύκη", "Πολυθέα", "Σαρακήνα", "Στεφάνι", "Τρυγόνα", "Φλαμπουρέσι", 
            "Χαλίκι", "Χρυσομηλιά"
        ],
        "Δήμος Πύλης": [
            "Πύλη", "Άγιος Νικόλαος", "Άγιος Προκόπιος", "Αθαμανία", "Αρματολικό", 
            "Βαθύρρευμα", "Βαλκάνο", "Γόμφοι", "Δέση", "Δροσερό", "Δροσοχώρι", 
            "Ελάτη", "Ελευθεροχώρι", "Καρτέρι", "Κορυφή", "Κοτρώνι", "Λιβαδοχώρι", 
            "Λυγαριά", "Μεσοχώρα", "Μοσχόφυτο", "Μουριά", "Μυρόφυλλο", "Νέα Πεύκη", 
            "Νεράιδα", "Νεραϊδοχώρι", "Παλαιοκαρυά", "Παλαιομονάστηρο", "Παράμερο", 
            "Παραπόταμος", "Παχτούρι", "Περτούλι", "Πετροχώρι", "Πηγή", "Πιάλεια", 
            "Πολυνέρι", "Πύρρα", "Ροποτό", "Στουρναραίικα", "Φήκη (Φίκι)", "Φιλύρα"
        ],
        "Δήμος Φαρκαδόνας": [
            "Φαρκαδόνα", "Αχλαδοχώρι", "Γεωργανάδες", "Γριζάνο", "Διάσελλο", "Ζάρκο", 
            "Κεραμίδι", "Κρήνη", "Νομή", "Οιχαλία (Νεοχώρι)", "Παναγίτσα", "Πετρόπορος", 
            "Πετρωτό", "Πηνειάδα", "Ταξιάρχες", "Φανερωμένη"
        ]
    };

    // 3. ΣΥΝΑΡΤΗΣΗ ΓΕΜΙΣΜΑΤΟΣ ΤΩΝ ΛΙΣΤΩΝ (Με OptGroups)
    function populateDropdowns() {
        // Γέμισμα Ειδικοτήτων
        document.querySelectorAll('.job-category').forEach(select => {
            select.innerHTML = '<option value="" disabled selected>-- Επιλέξτε Ειδικότητα --</option>';
            for (const [groupName, jobs] of Object.entries(jobsData)) {
                let optgroup = document.createElement('optgroup');
                optgroup.label = groupName;
                jobs.forEach(job => {
                    let option = document.createElement('option');
                    option.value = job;
                    option.textContent = job;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            }
        });

        // Γέμισμα Τοποθεσιών
        document.querySelectorAll('.location-select').forEach(select => {
            select.innerHTML = '<option value="" disabled selected>-- Επιλέξτε Περιοχή --</option>';
            // Προσθήκη γενικής επιλογής
            select.innerHTML += '<option value="Όλος ο Νομός">Όλος ο Νομός Τρικάλων</option>';
            
            for (const [municipality, locations] of Object.entries(locationsData)) {
                let optgroup = document.createElement('optgroup');
                optgroup.label = municipality;
                
                // Ταξινόμηση αλφαβητικά μέσα στον δήμο για ευκολία
                locations.sort((a, b) => a.localeCompare(b, 'el')).forEach(loc => {
                    let option = document.createElement('option');
                    option.value = loc;
                    option.textContent = loc;
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            }
        });
    }

    // 4. ΕΝΑΛΛΑΓΗ ΟΘΟΝΩΝ
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo(0,0); // Πάει στην αρχή της σελίδας όταν αλλάζει οθόνη
    }

    // Εκτέλεση κατά την εκκίνηση
    window.onload = () => {
        populateDropdowns();
    };

    // Αποτροπή προσωρινής αποστολής
    document.getElementById('workerForm').addEventListener('submit', e => { e.preventDefault(); alert('Έτοιμο για σύνδεση με το Cloudflare!'); });
    document.getElementById('employerForm').addEventListener('submit', e => { e.preventDefault(); alert('Έτοιμο για σύνδεση με το Cloudflare!'); });
</script>

</body>
</html>
