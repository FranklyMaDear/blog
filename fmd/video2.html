<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FranklyMaDear Video</title>
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:creator" content="@FranklyMaDear">
    <meta name="twitter:title" content="FranklyMaDear">
    <meta name="twitter:description" content="🎬 Creative Video">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail2.png">
    <meta name="twitter:image:alt" content="Creative Video">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FranklyMaDear">
    <meta property="og:description" content="🎬 Creative Video">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail2.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video2.html">
    <meta property="og:site_name" content="FranklyMaDear">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        .ad-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
        }
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px auto;
        }
        .share-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video poster="thumbnail2.png">
            <source src="video2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="ad-overlay">
            <button class="play-button" onclick="playVideo()">
                ▶️
            </button>
            <!-- Monetag Ad -->
            <div>
                <script type="text/javascript">
                    atOptions = {
                        'key' : '10000601',
                        'format' : 'iframe',
                        'height' : 60,
                        'width' : 468,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="https://otieu.com/4/10000601"></script>
            </div>
        </div>
    </div>
    
    <div class="share-buttons">
        <button class="btn" onclick="copyVideoLink()">
            <span>📋</span> Copy Link
        </button>
    </div>

    <script>
        function playVideo() {
            const video = document.querySelector('video');
            const overlay = document.querySelector('.ad-overlay');
            video.play();
            overlay.style.display = 'none';
        }

        function copyVideoLink() {
            const videoLink = 'https://blog.franklymadear.com/fmd/video2.html';
            navigator.clipboard.writeText(videoLink);
            alert('Video link copied to clipboard!');
        }

        // Hide overlay when video starts playing
        document.querySelector('video').addEventListener('play', function() {
            document.querySelector('.ad-overlay').style.display = 'none';
        });

        // Show overlay when video ends
        document.querySelector('video').addEventListener('ended', function() {
            document.querySelector('.ad-overlay').style.display = 'block';
        });
    </script>
</body>
</html>
