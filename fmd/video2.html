<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FranklyMaDear Video</title>
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:creator" content="@FranklyMaDear">
    <meta name="twitter:title" content="FranklyMaDear">
    <meta name="twitter:description" content="🎬 Creative Video">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail2.png">
    <meta name="twitter:image:alt" content="Creative Video">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FranklyMaDear">
    <meta property="og:description" content="🎬 Creative Video">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail2.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video2.html">
    <meta property="og:site_name" content="FranklyMaDear">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        .share-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls autoplay poster="thumbnail2.png">
            <source src="video2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
    <div class="share-buttons">
        <button class="btn" onclick="copyVideoLink()">
            <span>📋</span> Copy Link
        </button>
    </div>
    
    <!-- Ad script -->
    <script src="https://3nbf4.com/act/files/tag.min.js?z=10021853" data-cfasync="false" async></script>

    <script>
        function copyVideoLink() {
            const videoLink = 'https://blog.franklymadear.com/fmd/video2.html';
            navigator.clipboard.writeText(videoLink);
            alert('Video link copied to clipboard!');
        }

        // Auto-play and fullscreen experience
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.querySelector('video');
            video.play().catch(function(error) {
                console.log('Auto-play was prevented:', error);
            });
        });
    </script>
</body>
</html>
