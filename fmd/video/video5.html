    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        /* Enhanced Background Effects */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(41, 128, 185, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(231, 76, 60, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(46, 204, 113, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 60% 60%, rgba(155, 89, 182, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 30% 70%, rgba(241, 196, 15, 0.15) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        
        .floating-element:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 20s;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.3), transparent 70%);
        }
        
        .floating-element:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            left: 80%;
            animation-delay: -5s;
            animation-duration: 25s;
            background: radial-gradient(circle, rgba(231, 76, 60, 0.3), transparent 70%);
        }
        
        .floating-element:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 80%;
            left: 20%;
            animation-delay: -10s;
            animation-duration: 18s;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.3), transparent 70%);
        }
        
        .floating-element:nth-child(4) {
            width: 120px;
            height: 120px;
            top: 30%;
            left: 70%;
            animation-delay: -7s;
            animation-duration: 22s;
            background: radial-gradient(circle, rgba(155, 89, 182, 0.3), transparent 70%);
        }
        
        @keyframes bgPulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.05);
            }
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(50px, 50px) rotate(90deg);
            }
            50% {
                transform: translate(100px, 0) rotate(180deg);
            }
            75% {
                transform: translate(50px, -50px) rotate(270deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }
        
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 2;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            cursor: pointer;
            position: relative;
            z-index: 3;
        }
        
        /* Fullscreen controls */
        .fullscreen-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        
        .fullscreen-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.8);
        }
        
        /* Ad Container */
        #ad-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ad-banner {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            max-width: 90%;
            text-align: center;
            pointer-events: auto;
        }
        
        /* Play overlay for better UX */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.7);
            transition: all 0.3s ease;
        }
        
        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.9);
        }
        
        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }
        
        .play-overlay.hidden {
            display: none;
        }
        
        /* Enhanced border glow effect */
        .video-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            height: 95%;
            border: 2px solid transparent;
            border-radius: 10px;
            background: linear-gradient(45deg, transparent, rgba(52, 152, 219, 0.3), transparent);
            animation: glowRotate 6s linear infinite;
            pointer-events: none;
            z-index: 2;
            box-shadow: 0 0 50px rgba(52, 152, 219, 0.2);

        @keyframes glowRotate {

            }
            25% {

            50% {

            100% {

            height: 100% !important;
        }

        }
        
        :fullscreen {

<body>
    <!-- Background Container -->

        <div class="fullscreen-controls">
            <button class="fullscreen-btn" id="enterFullscreen">📺 Fullscreen</button>
            <button class="fullscreen-btn" id="exitFullscreen" style="display:none;">✕ Exit</button>

        <!-- Play Overlay -->
        <div class="play-overlay" id="playOverlay">
            <div class="play-button"></div>
        </div>
        
        <!-- Video Player -->
        <video 
            controls 
            muted
            playsinline
            preload="auto"
            poster="thumbnail5.png"
            id="videoPlayer"
        >
            <source src="video5.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            const playOverlay = document.getElementById('playOverlay');
            const adContainer = document.getElementById('ad-container');
            const enterFullscreenBtn = document.getElementById('enterFullscreen');
            const exitFullscreenBtn = document.getElementById('exitFullscreen');
            let adLoaded = false;
            
            // Fullscreen functionality
            function enterFullscreen() {
                const element = document.documentElement;
                
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                }
            }
            
            function exitFullscreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
            
            // Fullscreen event listeners
            enterFullscreenBtn.addEventListener('click', enterFullscreen);
            exitFullscreenBtn.addEventListener('click', exitFullscreen);
            
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('MSFullscreenChange', handleFullscreenChange);
            
            function handleFullscreenChange() {
                if (document.fullscreenElement || 
                    document.webkitFullscreenElement || 
                    document.mozFullScreenElement || 
                    document.msFullscreenElement) {
                    enterFullscreenBtn.style.display = 'none';
                    exitFullscreenBtn.style.display = 'block';
                } else {
                    enterFullscreenBtn.style.display = 'block';
                    exitFullscreenBtn.style.display = 'none';
                }
            }
            
            // Auto-enter fullscreen when video starts playing
            function autoEnterFullscreen() {
                setTimeout(() => {
                    if (!document.fullscreenElement && 
                        !document.webkitFullscreenElement && 
                        !document.mozFullScreenElement && 
                        !document.msFullscreenElement) {
                        enterFullscreen();
                    }
                }, 500);
            }
            
            // Function to load ads
            function loadAds() {
                if (!adLoaded) {
                    try {
                        // Option 1: Google AdSense (already in HTML)
                        console.log('Google AdSense loaded');
                        
                        // Option 2: Monetag as fallback
                        (function(s){
                            s.dataset.zone='10113668',
                            s.src='https://groleegni.net/vignette.min.js'
                        })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
                        
                        adLoaded = true;
                        console.log('Ads loaded successfully');
                        
                        // Hide ad after 10 seconds
                        setTimeout(() => {
                            adContainer.style.display = 'none';
                        }, 10000);
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Click on overlay to play video and load ads
            playOverlay.addEventListener('click', function() {
                video.play().catch(e => console.log('Video play prevented:', e));
                loadAds();
                playOverlay.classList.add('hidden');
                autoEnterFullscreen();
            });
            
            // Load ads when video starts playing
            video.addEventListener('play', function() {
                loadAds();
                playOverlay.classList.add('hidden');
                autoEnterFullscreen();
            });
            
            // Click on video to play and load ads
            video.addEventListener('click', function() {
                if (video.paused) {
                    video.play().catch(e => console.log('Video play prevented:', e));
                    loadAds();
                    autoEnterFullscreen();
                }
            });
            
            // Auto-hide overlay if video starts playing automatically
            video.addEventListener('playing', function() {
                playOverlay.classList.add('hidden');
                loadAds();
                autoEnterFullscreen();
            });
            
            // Hide ad container initially, show when video plays
            adContainer.style.display = 'none';
            
            // Try to auto-play and enter fullscreen on page load
            setTimeout(() => {
                video.play().then(() => {
                    loadAds();
                    playOverlay.classList.add('hidden');
                    autoEnterFullscreen();
                }).catch(e => {
                    console.log('Auto-play prevented, waiting for user interaction');
                });
            }, 1000);
        });
    </script>
</body>
