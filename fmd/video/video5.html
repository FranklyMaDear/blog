        * {

        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;

        /* Enhanced Background Effects */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(41, 128, 185, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(231, 76, 60, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(46, 204, 113, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 60% 60%, rgba(155, 89, 182, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 30% 70%, rgba(241, 196, 15, 0.15) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        
        .floating-element:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 20s;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.3), transparent 70%);
        }
        
        .floating-element:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            left: 80%;
            animation-delay: -5s;
            animation-duration: 25s;
            background: radial-gradient(circle, rgba(231, 76, 60, 0.3), transparent 70%);
        }
        
        .floating-element:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 80%;
            left: 20%;
            animation-delay: -10s;
            animation-duration: 18s;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.3), transparent 70%);
        }
        
        .floating-element:nth-child(4) {
            width: 120px;
            height: 120px;
            top: 30%;
            left: 70%;
            animation-delay: -7s;
            animation-duration: 22s;
            background: radial-gradient(circle, rgba(155, 89, 182, 0.3), transparent 70%);
        }
        
        @keyframes bgPulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.05);
            }
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(50px, 50px) rotate(90deg);
            }
            50% {
                transform: translate(100px, 0) rotate(180deg);
            }
            75% {
                transform: translate(50px, -50px) rotate(270deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }
        
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 2;

        /* Ad Overlay for Twitter */

            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #ad-overlay.active {
            display: flex;
        }
        
        .ad-content {
            background: linear-gradient(135deg, #1a1a1a, #333);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 2px solid #444;
            cursor: pointer;
        }
        
        .ad-title {
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .ad-close {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .ad-close:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        
        .ad-timer {

            font-size: 18px;
            margin-top: 15px;

        /* Ad container for Monetag */
        #monetag-ad-container {
            width: 100%;

            padding: 20px;

        }
        
        /* Play overlay for better UX */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;

            backdrop-filter: blur(5px);
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.7);
            transition: all 0.3s ease;
        }
        
        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.9);
        }
        
        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;

        /* Enhanced border glow effect */
        .video-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            height: 95%;
            border: 2px solid transparent;

            background: linear-gradient(45deg, transparent, rgba(52, 152, 219, 0.3), transparent);

        @keyframes glowRotate {

        /* Hide browser UI in fullscreen */

<body>

    <div id="ad-overlay">

            <div class="ad-title">📢 ADVERTISEMENT</div>
            <div id="ad-display">
                <p style="color: #ccc; margin-bottom: 15px;">Ad will complete in: <span id="countdown">5</span> seconds</p>
                <!-- Monetag Ad Container with Script -->
                <div id="monetag-ad-container">
                    <script>

                            s.dataset.zone = '10113668';

            <div class="play-button"></div>
        </div>
        
        <!-- Video Player -->
        <video 
            controls 
            muted
            playsinline
            preload="auto"
            poster="thumbnail5.png"
            id="videoPlayer"
        >
            <source src="video5.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            const playOverlay = document.getElementById('playOverlay');
            const adOverlay = document.getElementById('ad-overlay');
            const adContent = document.getElementById('ad-content');
            const closeAdBtn = document.getElementById('close-ad');
            const countdownElement = document.getElementById('countdown');
            let adShown = false;
            let countdownTimer;
            
            // Fullscreen functionality
            function enterFullscreen() {
                const element = document.documentElement;
                
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                }
            }
            
            // Auto-enter fullscreen when video starts playing
            function autoEnterFullscreen() {
                setTimeout(() => {
                    if (!document.fullscreenElement && 
                        !document.webkitFullscreenElement && 
                        !document.mozFullScreenElement && 
                        !document.msFullscreenElement) {
                        enterFullscreen();
                    }
                }, 500);
            }
            
            // Show ad overlay with countdown
            function showAdOverlay() {
                if (!adShown) {
                    adShown = true;
                    adOverlay.classList.add('active');
                    video.pause();
                    
                    // Start countdown from 5 seconds
                    let countdown = 5;
                    countdownElement.textContent = countdown;
                    
                    countdownTimer = setInterval(() => {
                        countdown--;
                        countdownElement.textContent = countdown;
                        
                        if (countdown <= 0) {
                            clearInterval(countdownTimer);
                            closeAdOverlay();
                        }
                    }, 1000);
                }
            }
            
            // Close ad overlay
            function closeAdOverlay() {
                adOverlay.classList.remove('active');
                clearInterval(countdownTimer);
                
                // Resume video
                setTimeout(() => {
                    video.play().catch(e => console.log('Video play error:', e));
                    autoEnterFullscreen();
                }, 500);
            }
            
            // Event Listeners
            closeAdBtn.addEventListener('click', closeAdOverlay);
            
            // Click anywhere on ad content to potentially trigger ad interaction
            adContent.addEventListener('click', function(e) {
                if (e.target !== closeAdBtn) {
                    console.log('Ad content clicked - may trigger ad interaction');
                }
            });
            
            // Click on overlay to play video and show ad
            playOverlay.addEventListener('click', function() {
                showAdOverlay();
                playOverlay.classList.add('hidden');
            });
            
            // Show ad when video starts playing (for direct play)
            video.addEventListener('play', function() {
                if (!adShown) {
                    showAdOverlay();
                }
                playOverlay.classList.add('hidden');
            });
            
            // Click on video to play and show ad
            video.addEventListener('click', function() {
                if (video.paused && !adShown) {
                    showAdOverlay();
                }
            });
            
            // Auto-hide overlay if video starts playing automatically
            video.addEventListener('playing', function() {
                playOverlay.classList.add('hidden');
                if (!adShown) {
                    showAdOverlay();
                }
            });
            
            // Try to auto-play on page load (with ad)
            setTimeout(() => {
                if (!adShown) {
                    video.play().then(() => {
                        // Ad will be shown via the play event listener
                    }).catch(e => {
                        console.log('Auto-play prevented, waiting for user interaction');
                    });
                }
            }, 1000);
            
            // Handle visibility change for better ad experience
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && adOverlay.classList.contains('active')) {
                    video.pause();
                }
            });
        });
    </script>
