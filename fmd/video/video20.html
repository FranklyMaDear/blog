        @keyframes glowRotate {

        /* Hide browser UI in fullscreen */

<body>
    <!-- Background Container -->
    <div class="background-container">
        <div class="animated-bg"></div>
        <div class="floating-elements">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>
    </div>
    
    <!-- Ad Overlay - Full Video Size -->
    <div id="ad-overlay">
        <div class="ad-content">
            <div class="ad-header">
                <div class="ad-title">📢 ADVERTISEMENT</div>
                <div class="ad-timer">Time: <span id="countdown">5</span>s</div>
            </div>
            
            <button class="ad-close" id="close-ad" disabled>✕</button>
            
            <!-- Ad Display - Full Size -->
            <div id="ad-display">
                <!-- New Ad Script -->
                <script src="https://fpyf8.com/88/tag.min.js" data-zone="175808" async data-cfasync="false"></script>
                
                <!-- Fallback content -->
                <div id="fallback-ad" style="display: none; color: white; text-align: center;">
                    <h3>Advertisement</h3>
                    <p>Please wait while the ad loads...</p>
                    <p>Video will play in <span id="fallback-countdown">5</span> seconds</p>
                </div>
            </div>
            
            <div class="ad-footer">
                <div class="ad-message">Video will start automatically after advertisement</div>
            </div>
        </div>
    </div>
    
    <div class="video-container">
        <!-- Video Glow Effect -->
        <div class="video-glow"></div>
        
        <!-- Play Overlay -->
        <div class="play-overlay" id="playOverlay">
            <div class="play-button"></div>
        </div>
        
        <!-- Video Player -->
        <video 
            controls 
            muted
            playsinline
            preload="auto"
            poster="thumbnail22.png"
            id="videoPlayer"
        >
            <source src="video22.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            const playOverlay = document.getElementById('playOverlay');
            const adOverlay = document.getElementById('ad-overlay');
            const closeAdBtn = document.getElementById('close-ad');
            const countdownElement = document.getElementById('countdown');
            const fallbackCountdown = document.getElementById('fallback-countdown');
            const fallbackAd = document.getElementById('fallback-ad');
            let adShown = false;
            let countdownTimer;
            let canSkipAd = false;
            
            // Fullscreen functionality
            function enterFullscreen() {
                const element = document.documentElement;
                
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                }
            }
            
            // Auto-enter fullscreen when video starts playing
            function autoEnterFullscreen() {
                setTimeout(() => {
                    if (!document.fullscreenElement && 
                        !document.webkitFullscreenElement && 
                        !document.mozFullScreenElement && 
                        !document.msFullscreenElement) {
                        enterFullscreen();
                    }
                }, 500);
            }
            
            // Show ad overlay with countdown
            function showAdOverlay() {
                if (!adShown) {
                    adShown = true;
                    adOverlay.classList.add('active');
                    video.pause();
                    
                    // Start countdown from 5 seconds
                    let countdown = 5;
                    countdownElement.textContent = countdown;
                    fallbackCountdown.textContent = countdown;
                    
                    // Disable close button initially
                    closeAdBtn.disabled = true;
                    closeAdBtn.style.background = '#7f8c8d';
                    
                    countdownTimer = setInterval(() => {
                        countdown--;
                        countdownElement.textContent = countdown;
                        fallbackCountdown.textContent = countdown;
                        
                        if (countdown <= 3) {
                            // Show fallback if no ad loaded
                            if (document.querySelectorAll('iframe, [id*="ad"], [class*="ad"]').length === 0) {
                                fallbackAd.style.display = 'block';
                            }
                        }
                        
                        if (countdown <= 0) {
                            clearInterval(countdownTimer);
                            closeAdOverlay();
                        } else if (countdown <= 2) {
                            // Enable skip button last 2 seconds
                            closeAdBtn.disabled = false;
                            closeAdBtn.style.background = '#e74c3c';
                            canSkipAd = true;
                        }
                    }, 1000);
                }
            }
            
            // Close ad overlay
            function closeAdOverlay() {
                adOverlay.classList.remove('active');
                clearInterval(countdownTimer);
                
                // Resume video
                setTimeout(() => {
                    video.play().catch(e => console.log('Video play error:', e));
                    autoEnterFullscreen();
                }, 500);
            }
            
            // Event Listeners
            closeAdBtn.addEventListener('click', function() {
                if (canSkipAd) {
                    closeAdOverlay();
                }
            });
            
            // Click on overlay to play video and show ad
            playOverlay.addEventListener('click', function() {
                showAdOverlay();
                playOverlay.classList.add('hidden');
            });
            
            // Show ad when video starts playing (for direct play)
            video.addEventListener('play', function() {
                if (!adShown) {
                    showAdOverlay();
                }
                playOverlay.classList.add('hidden');
            });
            
            // Click on video to play and show ad
            video.addEventListener('click', function() {
                if (video.paused && !adShown) {
                    showAdOverlay();
                }
            });
            
            // Auto-hide overlay if video starts playing automatically
            video.addEventListener('playing', function() {
                playOverlay.classList.add('hidden');
                if (!adShown) {
                    showAdOverlay();
                }
            });
            
            // Try to auto-play on page load (with ad)
            setTimeout(() => {
                if (!adShown) {
                    video.play().then(() => {
                        // Ad will be shown via the play event listener
                    }).catch(e => {
                        console.log('Auto-play prevented, waiting for user interaction');
                    });
                }
            }, 1000);
            
            // Handle visibility change for better ad experience
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && adOverlay.classList.contains('active')) {
                    video.pause();
                }
            });
            
            // Check if ad loaded successfully
            setTimeout(() => {
                const adElements = document.querySelectorAll('iframe, [id*="ad"], [class*="ad"]');
                if (adElements.length > 0) {
                    console.log('Ad loaded successfully');
                    fallbackAd.style.display = 'none';
                }
            }, 2000);
        });
    </script>
