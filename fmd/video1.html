<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Creative Video 1 - FmD🎬</title>
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:creator" content="@FranklyMaDear">
    <meta name="twitter:title" content="My Creative Video 1 - FranklyMaDear">
    <meta name="twitter:description" content="🎬 Check out this amazing video from FranklyMaDear!">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta name="twitter:image:alt" content="My Creative Video 1">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="My Creative Video 1 - FranklyMaDear">
    <meta property="og:description" content="🎬 Check out this amazing video from FranklyMaDear!">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video1.html">
    <meta property="og:site_name" content="FranklyMaDear">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .video-container {
            max-width: 400px;
            margin: 0 auto;
        }
        video {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .share-buttons {
            margin: 20px 0;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-twitter {
            background: #1DA1F2;
            color: white;
        }
        .btn-copy {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <h2>My Creative Video 1</h2>
        <video controls poster="thumbnail1.png">
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="share-buttons">
            <button class="btn btn-copy" onclick="copyVideoLink()">
                <span>📋</span> Copy Link
            </button>
            <button class="btn btn-twitter" onclick="shareOnTwitter()">
                <span>🐦</span> Share on X
            </button>
        </div>
        
        <p>Click the video to play and enjoy!</p>
    </div>
    
    <!-- Ad script -->
    <script src="https://3nbf4.com/act/files/tag.min.js?z=10021853" data-cfasync="false" async></script>

    <script>
        function shareOnTwitter() {
            const text = encodeURIComponent('Check out "My Creative Video 1" from FranklyMaDear! 🎬✨');
            const url = encodeURIComponent('https://blog.franklymadear.com/fmd/video1.html');
            const twitterUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            window.open(twitterUrl, '_blank', 'width=600,height=400');
        }

        function copyVideoLink() {
            const videoLink = 'https://blog.franklymadear.com/fmd/video1.html';
            navigator.clipboard.writeText(videoLink);
            alert('Video link copied to clipboard!');
        }
    </script>
</body>
</html>
