<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Video - Support the Creator | FmD</title>
    
    <!-- Enhanced Twitter Card for Video Player -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="🎬 Amazing Creative Video - Watch Now!">
    <meta name="twitter:description" content="Watch this incredible creative video and support the creator with a quick ad!">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta name="twitter:image:alt" content="Creative Video Preview">
    <meta name="twitter:player" content="https://blog.franklymadear.com/fmd/video1.html">
    <meta name="twitter:player:width" content="480">
    <meta name="twitter:player:height" content="480">
    <meta name="twitter:player:stream" content="https://blog.franklymadear.com/fmd/video1.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">

    <!-- Enhanced Open Graph -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Creative Video - FranklyMaDear">
    <meta property="og:description" content="🎬 Watch this amazing creative video and support the creator!">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video1.html">
    <meta property="og:video" content="https://blog.franklymadear.com/fmd/video1.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="480">
    <meta property="og:video:height" content="480">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
        }
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: all 0.3s ease;
        }
        .play-button:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 1);
        }
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        .ad-content {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            border: 2px solid #4CAF50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .skip-ad {
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .skip-ad:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        .ad-countdown {
            margin: 15px 0;
            font-size: 1.2rem;
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Ad Overlay -->
    <div class="ad-overlay" id="adOverlay">
        <div class="ad-content">
            <div style="margin: 20px 0; min-height: 250px; display: flex; align-items: center; justify-content: center;">
                <!-- Ad Container -->
                <div id="ad-container">
                    <div style="color: #4CAF50; font-size: 2rem; margin-bottom: 15px;">✨</div>
                </div>
            </div>
            <div class="ad-countdown" id="adCountdown">3s</div>
            <button class="skip-ad" onclick="skipAd()" id="skipButton">Skip Ad</button>
        </div>
    </div>

    <div class="video-container">
        <video controls poster="thumbnail1.png" id="mainVideo" preload="metadata">
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="play-overlay" id="playOverlay">
            <button class="play-button" onclick="playVideo()">
                ▶️
            </button>
        </div>
    </div>

    <script>
        let adTimer;
        let countdown = 3;
        let isTwitterEmbed = false;

        // Check if embedded in Twitter
        function checkTwitterEmbed() {
            if (window.self !== window.top || 
                document.referrer.includes('twitter.com') || 
                document.referrer.includes('t.co') ||
                window.location.search.includes('twitter_embed=true')) {
                isTwitterEmbed = true;
            }
        }

        function loadAdScript() {
            // Load the new ad script from al5sm.com
            (function(s){s.dataset.zone='10021779',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
        }

        function startAdCountdown() {
            const countdownElement = document.getElementById('adCountdown');
            const skipButton = document.getElementById('skipButton');
            countdown = 3;
            
            countdownElement.textContent = `${countdown}s`;
            skipButton.disabled = true;
            
            const countdownInterval = setInterval(() => {
                countdown--;
                countdownElement.textContent = `${countdown}s`;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    skipAd();
                } else if (countdown <= 1) {
                    skipButton.disabled = false;
                }
            }, 1000);
        }

        function skipAd() {
            clearTimeout(adTimer);
            document.getElementById('adOverlay').style.display = 'none';
            document.getElementById('mainVideo').play();
            
            // Track ad completion
            console.log('Ad completed - revenue generated');
        }

        function playVideo() {
            // Always show ad for Twitter embeds, sometimes for direct visits
            if (isTwitterEmbed || Math.random() > 0.3) {
                document.getElementById('adOverlay').style.display = 'flex';
                loadAdScript();
                startAdCountdown();
            } else {
                // Direct play without ad sometimes
                document.getElementById('mainVideo').play();
            }
        }

        // Auto-detect Twitter on load
        document.addEventListener('DOMContentLoaded', function() {
            checkTwitterEmbed();
            
            // For Twitter embeds, auto-show ad
            if (isTwitterEmbed) {
                setTimeout(() => {
                    document.getElementById('adOverlay').style.display = 'flex';
                    loadAdScript();
                    startAdCountdown();
                }, 500);
            }
        });

        // Video event listeners
        document.getElementById('mainVideo').addEventListener('play', function() {
            document.getElementById('playOverlay').style.display = 'none';
        });

        document.getElementById('mainVideo').addEventListener('pause', function() {
            document.getElementById('playOverlay').style.display = 'block';
        });

        document.getElementById('mainVideo').addEventListener('ended', function() {
            document.getElementById('playOverlay').style.display = 'block';
        });

        // Track video engagement for analytics
        document.getElementById('mainVideo').addEventListener('timeupdate', function() {
            if (this.currentTime > 10) {
                console.log('User watched more than 10 seconds - good engagement');
            }
        });

        // Handle visibility changes for better ad tracking
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('Page hidden - pausing ad tracking');
            } else {
                console.log('Page visible - resuming ad tracking');
            }
        });
    </script>
</body>
</html>
