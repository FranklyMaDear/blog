<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FmD🎬</title>
    
    <!-- Enhanced Twitter Card -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="🎬 Amazing Creative Video - Watch Now!">
    <meta name="twitter:description" content="Watch this incredible creative video and support the creator!">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">

    <!-- Enhanced Open Graph -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Creative Video - FranklyMaDear">
    <meta property="og:description" content="🎬 Watch this amazing creative video and support the creator!">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video1.html">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Ad Overlay */
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .ad-content {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .skip-ad {
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            text-align: center;
        }
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <!-- Ad Overlay -->
    <div class="ad-overlay" id="adOverlay">
        <div class="ad-content">
            <h2>🎬 Support the Creator!</h2>
            <p>Watch a quick ad to unlock this amazing video</p>
            <div style="margin: 20px 0; min-height: 250px;" id="adContainer">
                <!-- Ad will load here -->
            </div>
            <button class="skip-ad" onclick="skipAd()">Skip Ad</button>
        </div>
    </div>

    <div class="video-container">
        <video poster="thumbnail1.png" id="mainVideo">
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="play-overlay">
            <button class="play-button" onclick="showAdAndPlay()">
                ▶️
            </button>
        </div>
    </div>

    <script>
        function showAdAndPlay() {
            const adOverlay = document.getElementById('adOverlay');
            adOverlay.style.display = 'flex';
            
            // Load the new ad script
            const adScript = document.createElement('script');
            adScript.src = 'https://otieu.com/4/10000601';
            document.getElementById('adContainer').appendChild(adScript);
        }

        function skipAd() {
            const adOverlay = document.getElementById('adOverlay');
            adOverlay.style.display = 'none';
            
            // Play the video
            const video = document.getElementById('mainVideo');
            const playOverlay = document.querySelector('.play-overlay');
            video.play();
            playOverlay.style.display = 'none';
        }

        // Auto-show ad for Twitter visitors
        if (document.referrer.includes('twitter.com') || document.referrer.includes('t.co')) {
            // Show ad immediately for Twitter visitors
            setTimeout(showAdAndPlay, 500);
        }

        // Video event listeners
        document.getElementById('mainVideo').addEventListener('play', function() {
            document.querySelector('.play-overlay').style.display = 'none';
        });

        document.getElementById('mainVideo').addEventListener('ended', function() {
            document.querySelector('.play-overlay').style.display = 'block';
        });
    </script>
</body>
</html>
