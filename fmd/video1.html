<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Video - Support the Creator | FmD</title>
    
    <!-- Enhanced Twitter Card -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="🎬 Amazing Creative Video - Watch Now!">
    <meta name="twitter:description" content="Watch this incredible creative video and support the creator with a quick ad!">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta name="twitter:image:alt" content="Creative Video Preview">

    <!-- Enhanced Open Graph -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Creative Video - FranklyMaDear">
    <meta property="og:description" content="🎬 Watch this amazing creative video and support the creator!">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video1.html">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
        }
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        .ad-content {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }
        .skip-ad {
            margin-top: 15px;
            padding: 8px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .support-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <!-- Ad Overlay -->
    <div class="ad-overlay" id="adOverlay">
        <div class="ad-content">
            <h3>🎬 Support the Creator!</h3>
            <p>Watch a quick ad to help create more amazing content</p>
            <div style="margin: 15px 0;">
                <!-- New Ad Script -->
                <div id="ad-container"></div>
            </div>
            <button class="skip-ad" onclick="skipAd()">Skip Ad (5s)</button>
        </div>
    </div>

    <div class="support-message">
        Support creator by watching ads! 🎬
    </div>

    <div class="video-container">
        <video controls autoplay poster="thumbnail1.png" id="mainVideo">
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="play-overlay">
            <button class="play-button" onclick="playVideo()">
                ▶️
            </button>
        </div>
    </div>

    <script>
        let adTimer;
        
        function loadAdScript() {
            // Load the new ad script
            (function(s){
                s.dataset.zone='10052066',
                s.src='https://groleegni.net/vignette.min.js'
            })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
        }
        
        function skipAd() {
            clearTimeout(adTimer);
            document.getElementById('adOverlay').style.display = 'none';
            document.getElementById('mainVideo').play();
        }

        function playVideo() {
            // Show ad first
            document.getElementById('adOverlay').style.display = 'flex';
            loadAdScript();
            
            // Auto-skip ad after 5 seconds
            adTimer = setTimeout(skipAd, 5000);
        }

        // Auto-play when page loads but show ad first
        document.addEventListener('DOMContentLoaded', function() {
            // Show ad overlay instead of auto-playing
            document.getElementById('adOverlay').style.display = 'flex';
            loadAdScript();
            adTimer = setTimeout(skipAd, 5000);
        });

        // Hide play overlay when video starts playing
        document.querySelector('video').addEventListener('play', function() {
            document.querySelector('.play-overlay').style.display = 'none';
        });

        // Show play overlay when video ends
        document.querySelector('video').addEventListener('ended', function() {
            document.querySelector('.play-overlay').style.display = 'block';
            // Show thank you message
            alert('🎬 Thank you for watching! Share on Twitter to support more content! 🐦');
        });

        // Track video engagement
        document.querySelector('video').addEventListener('timeupdate', function() {
            if (this.currentTime > 10) {
                console.log('User watched more than 10 seconds - good engagement');
            }
        });
    </script>
</body>
</html>
