<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Video</title>
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="Creative Video">
    <meta name="twitter:description" content="🎬 Watch this amazing video">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta name="twitter:image:alt" content="Creative Video">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Creative Video">
    <meta property="og:description" content="🎬 Watch this amazing video">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video1.html">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
        }
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .ad-container {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- Monetag Ad -->
    <div class="ad-container">
        <script type="text/javascript">
            atOptions = {
                'key' : '10021790',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://otieu.com/4/10021790"></script>
    </div>

    <div class="video-container">
        <video controls autoplay poster="thumbnail1.png">
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="play-overlay">
            <button class="play-button" onclick="playVideo()">
                ▶️
            </button>
        </div>
    </div>

    <script>
        function playVideo() {
            const video = document.querySelector('video');
            const overlay = document.querySelector('.play-overlay');
            video.play();
            overlay.style.display = 'none';
        }

        // Auto-play when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.querySelector('video');
            video.play().catch(function(error) {
                console.log('Auto-play was prevented');
            });
        });

        // Hide play overlay when video starts playing
        document.querySelector('video').addEventListener('play', function() {
            document.querySelector('.play-overlay').style.display = 'none';
        });

        // Show play overlay when video ends
        document.querySelector('video').addEventListener('ended', function() {
            document.querySelector('.play-overlay').style.display = 'block';
        });
    </script>
</body>
</html>
