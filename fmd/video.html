<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video1 Player</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }
        .video-info {
            padding: 15px;
            color: white;
            text-align: center;
            background: #2d2d2d;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls autoplay muted>
            <source src="video1.mp4" type="video/mp4">
            Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την αναπαραγωγή βίντεο.
        </video>
        <div class="video-info">
            <h2>Video 1</h2>
        </div>
    </div>
</body>
</html>
