    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="FinaltyMaDear Video">
    <meta property="og:description" content="Exclusive video content from FinaltyMaDear">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video1.html">
    <meta property="og:video" content="https://blog.franklymadear.com/fmd/video1.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="800">
    <meta property="og:video:height" content="450">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }
        
        /* Minimal Ad Overlay */
        .ad-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4A90E2;
            z-index: 10;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .ad-overlay a {
            color: #4A90E2;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            display: block;
        }
        
        .ad-overlay:hover {
            background: rgba(74, 144, 226, 0.9);
        }
        
        .ad-overlay:hover a {
            color: white;
        }
        
        .ad-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Remove all other elements */
        .video-info,
        .ad-container {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Clean Video Container with Minimal Ad -->
    <div class="video-container">
        <!-- Minimal Ad Overlay -->
        <div class="ad-overlay" id="videoAd">
            <a href="https://otieu.com/4/10000601" target="_blank" title="Monetag Ad">
                🔗 Ad
            </a>
        </div>
        
        <!-- Clean Video Player -->
        <video 
            controls 
            autoplay
            muted
            playsinline
            preload="auto"
        >
            <source src="video1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.querySelector('video');
            const adOverlay = document.getElementById('videoAd');
            
            // Auto-play video
            video.play().catch(e => console.log('Autoplay prevented:', e));
            
            // Hide ad after 8 seconds
            setTimeout(() => {
                adOverlay.classList.add('hidden');
            }, 8000);
            
            // Show ad when video is paused
            video.addEventListener('pause', () => {
                adOverlay.classList.remove('hidden');
            });
            
            // Hide ad when video plays
            video.addEventListener('play', () => {
                setTimeout(() => {
                    adOverlay.classList.add('hidden');
                }, 5000);
            });
            
            // Toggle ad on video click (except when clicking controls)
            video.addEventListener('click', (e) => {
                if (e.target === video) {
                    adOverlay.classList.toggle('hidden');
                }
            });
            
            // Hide controls after 3 seconds of inactivity
            let controlsTimeout;
            function hideControls() {
                video.style.cursor = 'none';
                video.controls = false;
            }
            
            function showControls() {
                video.style.cursor = 'default';
                video.controls = true;
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(hideControls, 3000);
            }
            
            video.addEventListener('mousemove', showControls);
            video.addEventListener('touchstart', showControls);
            
            // Initial hide controls
            setTimeout(hideControls, 3000);
        });
    </script>
</body>
</html>
