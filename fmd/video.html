<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FranklyMaDear🎬</title>
    <link rel="icon" type="image/png" href="index.png">
    <link rel="apple-touch-icon" href="index.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="✨FranklyMaDear🎬">
    <meta property="og:description" content="Watch this amazing video from FranklyMaDear">
    <meta property="og:image" content="https://blog.franklymadear.com/twitter/video-thumbnail.jpg">
    <meta property="og:image:width" content="720">
    <meta property="og:image:height" content="1280">
    <meta property="og:url" content="https://blog.franklymadear.com/twitter/video.html">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://blog.franklymadear.com/twitter/video1.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="720">
    <meta property="og:video:height" content="1280">
    <meta property="og:site_name" content="FranklyMaDear">
    
    <!-- Twitter Card Meta Tags για EMBEDDED VIDEO -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@zamanfoutista">
    <meta name="twitter:creator" content="@zamanfoutista">
    <meta name="twitter:title" content="✨FranklyMaDear🎬">
    <meta name="twitter:description" content="Watch this amazing video from FranklyMaDear">
    <meta name="twitter:image" content="https://blog.franklymadear.com/twitter/video-thumbnail.jpg">
    <meta name="twitter:player" content="https://blog.franklymadear.com/twitter/video-embed.html">
    <meta name="twitter:player:width" content="720">
    <meta name="twitter:player:height" content="1280">
    <meta name="twitter:player:stream" content="https://blog.franklymadear.com/twitter/video1.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .video-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            background: #000;
        }

        .video-player {
            width: 100%;
            position: relative;
        }

        .video-player video {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .video-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
        }

        .play-button:hover {
            transform: scale(1.1);
            background: white;
        }

        .play-icon {
            font-size: 2rem;
            margin-left: 5px;
        }

        .social-sharing {
            display: flex;
            gap: 15px;
            justify-content: center;
            pointer-events: all;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-twitter {
            background: #1DA1F2;
            color: white;
        }

        .btn-share {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .video-started .play-button {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-player">
            <video id="mainVideo" poster="video-thumbnail.jpg" style="width:100%">
                <source src="video1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="video-overlay">
                <div class="logo">✨FranklyMaDear🎬</div>
                <div class="video-controls">
                    <button class="play-button" id="playButton">
                        <span class="play-icon">▶️</span>
                    </button>
                </div>
                <div class="social-sharing">
                    <button class="btn btn-share" onclick="copyVideoLink()">
                        <span>📋</span> Copy Link
                    </button>
                    <button class="btn btn-twitter" onclick="shareOnTwitter()">
                        <span>🐦</span> Twitter
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const playButton = document.getElementById('playButton');

        playButton.addEventListener('click', function() {
            video.play();
            document.querySelector('.video-player').classList.add('video-started');
            playButton.style.display = 'none';
        });

        document.addEventListener('DOMContentLoaded', function() {
            video.play().then(() => {
                document.querySelector('.video-player').classList.add('video-started');
                playButton.style.display = 'none';
            }).catch(error => {
                playButton.style.display = 'flex';
            });
        });

        function shareOnTwitter() {
            const text = encodeURIComponent("Check out this amazing video from FranklyMaDear! 🎬✨");
            const url = encodeURIComponent("https://blog.franklymadear.com/twitter/video.html");
            const twitterUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            window.open(twitterUrl, '_blank', 'width=600,height=400');
        }

        function copyVideoLink() {
            const videoLink = "https://blog.franklymadear.com/twitter/video.html";
            navigator.clipboard.writeText(videoLink);
            alert('Link copied!');
        }

        video.addEventListener('ended', function() {
            document.querySelector('.video-player').classList.remove('video-started');
            playButton.style.display = 'flex';
        });
    </script>
</body>
</html>
