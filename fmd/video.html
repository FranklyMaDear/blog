<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - FinaltyMaDear</title>
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FinaltyMaDear">
    <meta name="twitter:title" content="FinaltyMaDear Video">
    <meta name="twitter:description" content="Check out this amazing video content">
    <meta name="twitter:player" content="https://yourdomain.com/video.html">
    <meta name="twitter:player:width" content="800">
    <meta name="twitter:player:height" content="450">
    <meta name="twitter:image" content="https://yourdomain.com/thumbnail1.png">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            display: block;
            outline: none;
        }
        .video-info {
            padding: 20px;
            color: white;
            text-align: center;
            background: #2d2d2d;
        }
        .video-title {
            margin: 0 0 10px 0;
            font-size: 1.5em;
        }
        .video-description {
            margin: 0;
            color: #ccc;
            font-size: 0.9em;
        }
        .ad-container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <!-- Monetag Ad -->
    <div class="ad-container">
        <script>
            // Monetag ad script placeholder
            // Replace with actual Monetag code
            document.write('<a href="https://otieu.com/4/10000601" target="_blank">');
            document.write('<img src="https://via.placeholder.com/800x100/4A90E2/FFFFFF?text=Monetag+Advertisement" alt="Ad" style="max-width:100%;border-radius:8px;">');
            document.write('</a>');
        </script>
    </div>

    <!-- Video Player -->
    <div class="video-container">
        <video 
            controls 
            autoplay
            muted
            playsinline
            poster="thumbnail1.png"
            preload="metadata"
        >
            <source src="video1.mp4" type="video/mp4">
            Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την αναπαραγωγή βίντεο.
        </video>
        <div class="video-info">
            <h2 class="video-title">Video 1 - FinaltyMaDear</h2>
            <p class="video-description">Exclusive video content</p>
        </div>
    </div>

    <!-- Alternative Monetag Implementation -->
    <script>
        // For Twitter compatibility - video autoplay
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.querySelector('video');
            
            // Ensure video plays inline for mobile and Twitter
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            
            // Try to play video automatically
            video.play().catch(function(error) {
                console.log('Autoplay prevented:', error);
            });
        });
    </script>
</body>
</html>
