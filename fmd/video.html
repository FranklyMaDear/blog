<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FmD🎬</title>
    
    <!-- Enhanced Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="🎬 Amazing Creative Videos - FmD">
    <meta name="twitter:description" content="Watch incredible creative videos with ad support! Click to view the full collection.">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta name="twitter:image:alt" content="Creative Videos Collection">

    <!-- Enhanced Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="✨FmD🎬 - Creative Videos Collection">
    <meta property="og:description" content="Discover amazing creative videos with monetization support">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video.html">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: white; font-family: Arial; }
        .header { text-align: center; padding: 20px; background: #111; }
        .video-gallery { display: grid; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .video-item { background: #111; border-radius: 10px; overflow: hidden; position: relative; }
        .video-container { position: relative; width: 100%; padding-top: 177.78%; }
        .video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .video-player video { width: 100%; height: 100%; object-fit: cover; }
        .video-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }

        /* Ad Overlay */
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .ad-content {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .skip-ad {
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Play Button */
        .play-button-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
            position: relative;
            z-index: 20;
        }
        .play-button { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }
        .play-button:hover {
            transform: scale(1.1);
        }
        .play-icon {
            font-size: 2rem;
            color: white;
            margin-left: 4px;
        }

        /* Share Button */
        .social-sharing { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        .btn { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; 
        }
    </style>
</head>
<body>
    <!-- Ad Overlay -->
    <div class="ad-overlay" id="adOverlay">
        <div class="ad-content">
            <h2>🎬 Support the Creator!</h2>
            <p>Watch a quick ad to unlock this amazing video</p>
            <div style="margin: 20px 0; min-height: 250px;" id="adContainer">
                <!-- Ad will load here -->
            </div>
            <button class="skip-ad" onclick="skipAd()">Skip Ad</button>
        </div>
    </div>

    <div class="header">
        <h1>✨FmD🎬</h1>
        <p>Amazing Creative Videos - Support the Creator!</p>
    </div>

    <div class="video-gallery">
        <!-- Video 1 -->
        <div class="video-item">
            <div class="video-container">
                <div class="video-player">
                    <video poster="thumbnail1.png" preload="metadata">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    
                    <div class="video-overlay">
                        <div class="play-button-container">
                            <button class="play-button" onclick="showAdAndPlay(this)">
                                <span class="play-icon">▶</span>
                            </button>
                        </div>
                        <div class="social-sharing">
                            <button class="btn" onclick="shareToTwitter()">
                                🐦 Share on Twitter
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video 2 -->
        <div class="video-item">
            <div class="video-container">
                <div class="video-player">
                    <video poster="thumbnail2.png" preload="metadata">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                    
                    <div class="video-overlay">
                        <div class="play-button-container">
                            <button class="play-button" onclick="showAdAndPlay(this)">
                                <span class="play-icon">▶</span>
                            </button>
                        </div>
                        <div class="social-sharing">
                            <button class="btn" onclick="shareToTwitter()">
                                🐦 Share on Twitter
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentVideoButton = null;

        // Show ad and then play video
        function showAdAndPlay(button) {
            currentVideoButton = button;
            showAd();
        }

        function showAd() {
            const adOverlay = document.getElementById('adOverlay');
            adOverlay.style.display = 'flex';
            
            // Load the new ad script
            const adScript = document.createElement('script');
            adScript.src = 'https://otieu.com/4/10000601';
            document.getElementById('adContainer').appendChild(adScript);
        }

        function skipAd() {
            const adOverlay = document.getElementById('adOverlay');
            adOverlay.style.display = 'none';
            
            // Play the video after ad
            if (currentVideoButton) {
                const videoPlayer = currentVideoButton.closest('.video-player');
                const video = videoPlayer.querySelector('video');
                video.play();
                currentVideoButton.style.display = 'none';
            }
        }

        // Auto-show ad for Twitter visitors
        if (document.referrer.includes('twitter.com') || document.referrer.includes('t.co')) {
            // Show ad immediately for Twitter visitors
            setTimeout(showAd, 1000);
        }

        // Video event listeners
        document.querySelectorAll('video').forEach(video => {
            video.addEventListener('play', function() {
                const playButton = this.parentElement.querySelector('.play-button');
                playButton.style.display = 'none';
            });
            
            video.addEventListener('ended', function() {
                const playButton = this.parentElement.querySelector('.play-button');
                playButton.style.display = 'flex';
            });
        });

        function shareToTwitter() {
            const url = encodeURIComponent('https://blog.franklymadear.com/fmd/video.html');
            const text = encodeURIComponent('🎬 Check out these amazing creative videos from FranklyMaDear! Support the creator! ✨');
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
        }
    </script>
</body>
</html>
