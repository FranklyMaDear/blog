<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FmD🎬</title>
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@FranklyMaDear">
    <meta name="twitter:title" content="✨FmD🎬">
    <meta name="twitter:description" content="Creative Videos">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="✨FmD🎬">
    <meta property="og:description" content="Creative Videos">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video.html">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; }
        .video-gallery { display: grid; gap: 10px; padding: 10px; max-width: 1200px; margin: 0 auto; }
        .video-item { background: #111; border-radius: 10px; overflow: hidden; position: relative; }
        .video-container { position: relative; width: 100%; padding-top: 177.78%; }
        .video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .video-player video { width: 100%; height: 100%; object-fit: cover; }
        .video-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }

        /* Ad Overlay */
        .ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .ad-content {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .skip-ad {
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Play Button */
        .play-button-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100%;
        }
        .play-button { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.9);
            border: none; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <!-- Ad Overlay -->
    <div class="ad-overlay" id="adOverlay">
        <div class="ad-content">
            <div style="margin: 20px 0; min-height: 250px;" id="adContainer">
                <!-- Ad will load here -->
            </div>
            <button class="skip-ad" onclick="skipAd()">Skip Ad</button>
        </div>
    </div>

    <div class="video-gallery">
        <!-- Video 1 -->
        <div class="video-item">
            <div class="video-container">
                <div class="video-player">
                    <video poster="thumbnail1.png" preload="metadata">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    
                    <div class="video-overlay">
                        <div class="play-button-container">
                            <button class="play-button" onclick="showAdAndPlay(this)">
                                ▶
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video 2 -->
        <div class="video-item">
            <div class="video-container">
                <div class="video-player">
                    <video poster="thumbnail2.png" preload="metadata">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                    
                    <div class="video-overlay">
                        <div class="play-button-container">
                            <button class="play-button" onclick="showAdAndPlay(this)">
                                ▶
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentVideoButton = null;

        function showAdAndPlay(button) {
            currentVideoButton = button;
            showAd();
        }

        function showAd() {
            const adOverlay = document.getElementById('adOverlay');
            adOverlay.style.display = 'flex';
            
            const adScript = document.createElement('script');
            adScript.src = 'https://otieu.com/4/10000601';
            document.getElementById('adContainer').appendChild(adScript);
        }

        function skipAd() {
            const adOverlay = document.getElementById('adOverlay');
            adOverlay.style.display = 'none';
            
            if (currentVideoButton) {
                const videoPlayer = currentVideoButton.closest('.video-player');
                const video = videoPlayer.querySelector('video');
                video.play();
                currentVideoButton.style.display = 'none';
            }
        }

        if (document.referrer.includes('twitter.com') || document.referrer.includes('t.co')) {
            setTimeout(showAd, 1000);
        }

        document.querySelectorAll('video').forEach(video => {
            video.addEventListener('play', function() {
                const playButton = this.parentElement.querySelector('.play-button');
                playButton.style.display = 'none';
            });
            
            video.addEventListener('ended', function() {
                const playButton = this.parentElement.querySelector('.play-button');
                playButton.style.display = 'flex';
            });
        });
    </script>
</body>
</html>
