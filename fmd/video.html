<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FmD🎬</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: white; font-family: Arial; }
        .header { text-align: center; padding: 20px; background: #111; }
        .video-gallery { display: grid; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .video-item { background: #111; border-radius: 10px; overflow: hidden; }
        .video-container { position: relative; width: 100%; padding-top: 177.78%; }
        .video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .video-player video { width: 100%; height: 100%; object-fit: cover; }
        .video-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .video-title { color: white; font-size: 1rem; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.7); }
        .play-button { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.9); border: none; cursor: pointer; }
        .social-sharing { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 8px 15px; border: none; border-radius: 20px; cursor: pointer; }
        .btn-twitter { background: #1DA1F2; color: white; }
        .btn-share { background: rgba(255,255,255,0.9); color: #333; }
    </style>
</head>
<body>
    <script src="https://3nbf4.com/act/files/tag.min.js?z=10021853" data-cfasync="false" async></script>

    <div class="header">
        <h1>✨FmD🎬</h1>
        <p>Share these videos exclusively on Twitter</p>
    </div>

    <div class="video-gallery">
        <!-- Video 1 -->
        <div class="video-item">
            <div class="video-container">
                <div class="video-player">
                    <video poster="thumbnail1.png" preload="metadata">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    <div class="video-overlay">
                        <div class="video-title">My Creative Video 1</div>
                        <div style="display: flex; justify-content: center; align-items: center; height: 100%;">
                            <button class="play-button" onclick="this.parentElement.parentElement.parentElement.querySelector('video').play(); this.style.display='none'">▶️</button>
                        </div>
                        <div class="social-sharing">
                            <button class="btn btn-share" onclick="navigator.clipboard.writeText('https://blog.franklymadear.com/twitter/video1.html'); alert('Link copied!')">📋 Copy Link</button>
                            <button class="btn btn-twitter" onclick="window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent('Check out \"My Creative Video 1\" from FranklyMaDear! 🎬✨') + '&url=' + encodeURIComponent('https://blog.franklymadear.com/twitter/video1.html'), '_blank')">🐦 Twitter</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video 2 -->
        <div class="video-item">
            <div class="video-container">
                <div class="video-player">
                    <video poster="thumbnail2.png" preload="metadata">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                    <div class="video-overlay">
                        <div class="video-title">My Creative Video 2</div>
                        <div style="display: flex; justify-content: center; align-items: center; height: 100%;">
                            <button class="play-button" onclick="this.parentElement.parentElement.parentElement.querySelector('video').play(); this.style.display='none'">▶️</button>
                        </div>
                        <div class="social-sharing">
                            <button class="btn btn-share" onclick="navigator.clipboard.writeText('https://blog.franklymadear.com/twitter/video2.html'); alert('Link copied!')">📋 Copy Link</button>
                            <button class="btn btn-twitter" onclick="window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent('Check out \"My Creative Video 2\" from FranklyMaDear! 🎬✨') + '&url=' + encodeURIComponent('https://blog.franklymadear.com/twitter/video2.html'), '_blank')">🐦 Twitter</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add video event listeners
        document.querySelectorAll('video').forEach(video => {
            video.addEventListener('play', function() {
                this.parentElement.classList.add('video-started');
            });
            video.addEventListener('pause', function() {
                this.parentElement.classList.remove('video-started');
                this.parentElement.querySelector('.play-button').style.display = 'flex';
            });
            video.addEventListener('ended', function() {
                this.parentElement.classList.remove('video-started');
                this.parentElement.querySelector('.play-button').style.display = 'flex';
            });
        });
    </script>
</body>
</html>
