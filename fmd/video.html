<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinaltyMaDear Video</title>
    
    <!-- Twitter Player Card Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@FmD699">
    <meta name="twitter:title" content="FinaltyMaDear Exclusive Video">
    <meta name="twitter:description" content="Watch this exclusive video content">
    <meta name="twitter:player" content="https://blog.franklymadear.com/fmd/video.html">
    <meta name="twitter:player:width" content="1280">
    <meta name="twitter:player:height" content="720">
    <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/thumbnail.png">
    <meta name="twitter:player:stream" content="https://blog.franklymadear.com/fmd/video.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="FinaltyMaDear Exclusive Video">
    <meta property="og:description" content="Watch this exclusive video content">
    <meta property="og:image" content="https://blog.franklymadear.com/fmd/thumbnail.png">
    <meta property="og:url" content="https://blog.franklymadear.com/fmd/video.html">
    <meta property="og:video" content="https://blog.franklymadear.com/fmd/video.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="1280">
    <meta property="og:video:height" content="720">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            cursor: pointer;
        }
        
        /* Ad Container */
        #ad-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }
        
        /* Play overlay for better UX */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid white;
        }
        
        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }
        
        .play-overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Ad Container -->
        <div id="ad-container"></div>
        
        <!-- Play Overlay -->
        <div class="play-overlay" id="playOverlay">
            <div class="play-button"></div>
        </div>
        
        <!-- Video Player -->
        <video 
            controls 
            muted
            playsinline
            preload="auto"
            poster="thumbnail.png"
            id="videoPlayer"
        >
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            const playOverlay = document.getElementById('playOverlay');
            let adLoaded = false;
            
            // Function to load monetag ad
            function loadAd() {
                if (!adLoaded) {
                    try {
                        // Monetag script
                        (function(s){
                            s.dataset.zone='10113668',
                            s.src='https://groleegni.net/vignette.min.js'
                        })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
                        adLoaded = true;
                        console.log('Monetag ad loaded successfully');
                    } catch(e) {
                        console.log('Ad loading error:', e);
                    }
                }
            }
            
            // Click on overlay to play video and load ad
            playOverlay.addEventListener('click', function() {
                video.play().catch(e => console.log('Video play prevented:', e));
                loadAd();
                playOverlay.classList.add('hidden');
            });
            
            // Load ad when video starts playing (from controls or any method)
            video.addEventListener('play', function() {
                loadAd();
                playOverlay.classList.add('hidden');
            });
            
            // Click on video to play and load ad
            video.addEventListener('click', function() {
                if (video.paused) {
                    video.play().catch(e => console.log('Video play prevented:', e));
                    loadAd();
                }
            });
            
            // Auto-hide overlay if video starts playing automatically
            video.addEventListener('playing', function() {
                playOverlay.classList.add('hidden');
                loadAd();
            });
        });
    </script>
</body>
</html>
