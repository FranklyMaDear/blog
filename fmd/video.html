<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        video {
            width: 100%;
            display: block;
            outline: none;
        }
        .video-info {
            padding: 20px;
            color: white;
            text-align: center;
            background: #2d2d2d;
        }
        .video-title {
            margin: 0 0 10px 0;
            font-size: 1.5em;
        }
        .video-description {
            margin: 0;
            color: #ccc;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video 
            controls 
            poster="thumbnail1.png"
            preload="metadata"
        >
            <source src="video1.mp4" type="video/mp4">
            Το πρόγραμμα περιήγησής σας δεν υποστηρίζει την αναπαραγωγή βίντεο.
        </video>
        <div class="video-info">
            <h2 class="video-title">Video 1</h2>
            <p class="video-description">FinaltyMaDear Video Content</p>
        </div>
    </div>
</body>
</html>
