<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FmD🎬</title>
    <link rel="icon" type="image/png" href="index.png">
    <link rel="apple-touch-icon" href="index.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Open Graph tags for Twitter sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FmD Videos">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:creator" content="@FranklyMaDear">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: #111;
        }

        .video-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-item {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 177.78%; /* 9:16 aspect ratio */
        }

        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-player video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }

        .video-title {
            color: white;
            font-size: 1rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }

        .video-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .play-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
        }

        .play-button:hover {
            transform: scale(1.1);
            background: white;
        }

        .play-icon {
            font-size: 1.5rem;
            margin-left: 5px;
        }

        .social-sharing {
            display: flex;
            gap: 10px;
            justify-content: center;
            pointer-events: all;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .btn-twitter {
            background: #1DA1F2;
            color: white;
        }

        .btn-share {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .video-started .play-button {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Ad script -->
    <script src="https://3nbf4.com/act/files/tag.min.js?z=10021853" data-cfasync="false" async></script>

    <div class="header">
        <h1>✨FmD🎬</h1>
        <p>Share these videos exclusively on Twitter</p>
    </div>

    <div class="video-gallery" id="videoGallery">
        <!-- Videos will be added here dynamically -->
    </div>

    <script>
        // Sample videos with proper PNG thumbnails
        const videos = [
            {
                id: 1,
                title: "My Creative Video 1",
                videoUrl: "video1.mp4",
                thumbnail: "thumbnail1.png", // Changed to PNG
                embedUrl: "https://blog.franklymadear.com/twitter/video-embed.html?video=1"
            },
            {
                id: 2,
                title: "My Creative Video 2", 
                videoUrl: "video2.mp4",
                thumbnail: "thumbnail2.png", // Changed to PNG
                embedUrl: "https://blog.franklymadear.com/twitter/video-embed.html?video=2"
            }
        ];

        // Initialize the gallery
        function initGallery() {
            const gallery = document.getElementById('videoGallery');
            gallery.innerHTML = '';
            
            videos.forEach(video => {
                const videoElement = createVideoElement(video);
                gallery.appendChild(videoElement);
            });
        }

        // Create video element HTML
        function createVideoElement(video) {
            const videoItem = document.createElement('div');
            videoItem.className = 'video-item';
            videoItem.innerHTML = `
                <div class="video-container">
                    <div class="video-player">
                        <!-- Use poster attribute to show first frame -->
                        <video id="video${video.id}" poster="${video.thumbnail}" preload="metadata" style="width:100%">
                            <source src="${video.videoUrl}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <div class="video-overlay">
                            <div class="video-title">${video.title}</div>
                            <div class="video-controls">
                                <button class="play-button" id="playButton${video.id}">
                                    <span class="play-icon">▶️</span>
                                </button>
                            </div>
                            <div class="social-sharing">
                                <button class="btn btn-share" onclick="copyVideoLink(${video.id})">
                                    <span>📋</span> Copy Link
                                </button>
                                <button class="btn btn-twitter" onclick="shareOnTwitter(${video.id})">
                                    <span>🐦</span> Twitter
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Add event listeners for this video
            const videoEl = videoItem.querySelector(`#video${video.id}`);
            const playButton = videoItem.querySelector(`#playButton${video.id}`);
            
            playButton.addEventListener('click', function() {
                videoEl.play();
                videoEl.parentElement.parentElement.classList.add('video-started');
                playButton.style.display = 'none';
            });
            
            videoEl.addEventListener('pause', function() {
                videoEl.parentElement.parentElement.classList.remove('video-started');
                playButton.style.display = 'flex';
            });

            videoEl.addEventListener('ended', function() {
                videoEl.parentElement.parentElement.classList.remove('video-started');
                playButton.style.display = 'flex';
            });

            // Preload thumbnail to ensure it displays
            const img = new Image();
            img.onload = function() {
                console.log(`Thumbnail loaded: ${video.thumbnail}`);
            };
            img.onerror = function() {
                console.error(`Failed to load thumbnail: ${video.thumbnail}`);
            };
            img.src = video.thumbnail;
            
            return videoItem;
        }

        // Share on Twitter with proper URL
        function shareOnTwitter(videoId) {
            const video = videos.find(v => v.id === videoId);
            if (!video) return;
            
            // Use the actual video page URL, not embed URL
            const pageUrl = "https://blog.franklymadear.com/twitter/video.html";
            const text = encodeURIComponent(`Check out "${video.title}" from FranklyMaDear! 🎬✨`);
            const twitterUrl = `https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(pageUrl)}`;
            window.open(twitterUrl, '_blank', 'width=600,height=400');
        }

        // Copy video page link
        function copyVideoLink(videoId) {
            const pageUrl = "https://blog.franklymadear.com/twitter/video.html";
            navigator.clipboard.writeText(pageUrl);
            alert('Video link copied!');
        }

        // Initialize the gallery when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initGallery();
        });
    </script>
</body>
</html>
