<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Videos - Support the Creator | FmD</title>
  
  <!-- Enhanced Twitter Card -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:site" content="@FranklyMaDear">
  <meta name="twitter:title" content="🎬 Amazing Creative Videos - Watch Now!">
  <meta name="twitter:description" content="Watch these incredible creative videos and support the creator with a quick ad!">
  <meta name="twitter:image" content="https://blog.franklymadear.com/fmd/video/thumbnail1.png">
  <meta name="twitter:image:alt" content="Creative Videos Preview">

  <!-- Enhanced Open Graph -->
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Creative Videos - FranklyMaDear">
  <meta property="og:description" content="🎬 Watch these amazing creative videos and support the creator!">
  <meta property="og:image" content="https://blog.franklymadear.com/fmd/video/thumbnail1.png">
  <meta property="og:url" content="https://blog.franklymadear.com/fmd/video.html">
  
  <style>
    /* ΟΛΑ ΤΑ STYLES ΜΕΝΟΥΝ ΙΔΙΑ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ... ΟΛΑ ΤΑ ΑΛΛΑ STYLES ΜΕΝΟΥΝ ΙΔΙΑ ... */

  </style>
</head>
<body>

  <div class="video-container" id="videoContainer">
    <video id="mainVideo" playsinline webkit-playsinline muted preload="auto">
      <source id="videoSource" src="" type="video/mp4">
      Το βίντεο δεν υποστηρίζεται.
    </video>
    
    <!-- Video Preview Image -->
    <img id="videoPreview" class="video-preview" src="" alt="Video preview" style="display: none;">
    
    <div class="video-overlay hidden" id="videoOverlay">
        <div class="play-button"></div>
    </div>

    <!-- Previous Video Button -->
    <button class="prev-video-btn" id="prevVideoBtn" title="Προηγούμενο βίντεο"></button>

    <!-- Next Video Button -->
    <button class="next-video-btn" id="nextVideoBtn" title="Επόμενο βίντεο"></button>

    <!-- Video Counter -->
    <div class="video-counter" id="videoCounter"></div>
  </div> 

  <!-- Ad Overlay -->
  <div class="ad-overlay" id="adOverlay">
    <div class="ad-content">
      <h3>🎬 Support the Creator!</h3>
      <p>Watch a quick ad to help create more amazing content</p>
      <div style="margin: 15px 0;">
        <!-- Ad Container -->
        <div id="ad-container"></div>
      </div>
      <button class="skip-ad" onclick="skipAd()">Skip Ad (5s)</button>
    </div>
  </div>

  <div class="story-header">
    <img src="logo.png" alt="profile">
    <span id="storyTitle">Creative Videos - FranklyMaDear</span>
  </div>

  <div class="support-message hidden" id="supportMessage">
    Support creator by watching ads! 🎬
  </div>

  <!-- Share Button -->
  <div class="share-btn" onclick="openShareModal()" title="Κοινοποίηση βίντεο">
      <span>+</span>
  </div>

  <div class="share-modal" id="shareModal">
    <div class="share-header">
      <div class="share-title">Κοινοποίηση Βίντεο</div>
      <button class="close-share" onclick="closeShareModal()">×</button>
    </div>
    
    <div class="video-share-info" id="videoShareInfo" style="text-align: center; margin-bottom: 15px; font-size: 14px; color: rgba(255,255,255,0.8);">
      Βίντεο: <span id="currentVideoName">Creative Video</span>
    </div>
    
    <div class="share-options">
      <div class="share-option" onclick="shareToTwitter()">
        <div class="share-icon">🐦</div>
        <div class="share-label">Twitter/X</div>
      </div>
      
      <div class="share-option" onclick="shareToFacebook()">
        <div class="share-icon">📘</div>
        <div class="share-label">Facebook</div>
      </div>
      
      <div class="share-option" onclick="shareToInstagram()">
        <div class="share-icon">📷</div>
        <div class="share-label">Instagram</div>
      </div>
      
      <div class="share-option" onclick="copyLink()">
        <div class="share-icon">🔗</div>
        <div class="share-label">Αντιγραφή</div>
      </div>
      
      <div class="share-option" onclick="shareToWhatsApp()">
        <div class="share-icon">💬</div>
        <div class="share-label">WhatsApp</div>
      </div>
    </div>
    
    <div style="font-size: 11px; color: rgba(255,255,255,0.6); text-align: center; margin-top: 10px;">
      Θα κοινοποιηθεί το τρέχον βίντεο
    </div>
  </div>

  <script>
    const video = document.getElementById('mainVideo');
    const videoOverlay = document.getElementById('videoOverlay');
    const shareModal = document.getElementById('shareModal');
    const adOverlay = document.getElementById('adOverlay');
    const supportMessage = document.getElementById('supportMessage');
    const videoSource = document.getElementById('videoSource');
    const nextVideoBtn = document.getElementById('nextVideoBtn');
    const prevVideoBtn = document.getElementById('prevVideoBtn');
    const videoCounter = document.getElementById('videoCounter');
    const storyTitle = document.getElementById('storyTitle');
    const currentVideoName = document.getElementById('currentVideoName');
    const videoPreview = document.getElementById('videoPreview');

    // 🔧 ΔΙΟΡΘΩΜΕΝΗ ΛΙΣΤΑ ΒΙΝΤΕΟ - ΜΟΝΟ 1 ΒΙΝΤΕΟ ΠΡΩΤΑ
    const videoList = [
        "video/video1.mp4"  // Προσθήκη video/ μπροστά
    ];
    
    const videoTitles = [
        "Creative Video 1"
    ];
    
    const videoPreviews = [
        "video/thumbnail1.png"  // Προσθήκη video/ μπροστά
    ];
    
    let currentVideoIndex = 0;
    let isFirstLoad = true;
    let adTimer;
    let hasShownAd = false;

    // Function για να πάρουμε το video index από το URL
    function getVideoIndexFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const videoParam = urlParams.get('video');
      
      if (videoParam) {
        const index = parseInt(videoParam) - 1;
        if (index >= 0 && index < videoList.length) {
          return index;
        }
      }
      return 0;
    }

    // Function για να αλλάξουμε το URL χωρίς reload
    function updateURL() {
      const newURL = `${window.location.pathname}?video=${currentVideoIndex + 1}`;
      window.history.replaceState({}, '', newURL);
    }

    // Function για να πάρουμε το share URL για το τρέχον βίντεο
    function getCurrentVideoShareURL() {
      return `${window.location.origin}${window.location.pathname}?video=${currentVideoIndex + 1}`;
    }

    function updateVideoCounter() {
      videoCounter.textContent = `${currentVideoIndex + 1} / ${videoList.length}`;
      currentVideoName.textContent = videoTitles[currentVideoIndex];
      storyTitle.textContent = `${videoTitles[currentVideoIndex]} - FranklyMaDear`;
    }

    function updateNavigationButtons() {
      // 🔧 ΔΙΟΡΘΩΣΗ: Κρύψε τα βελάκια όταν έχουμε μόνο 1 βίντεο
      if (videoList.length <= 1) {
        prevVideoBtn.style.display = 'none';
        nextVideoBtn.style.display = 'none';
        return;
      }
      
      // Εμφάνιση/απόκρυψη previous button
      if (currentVideoIndex > 0) {
        prevVideoBtn.style.display = 'flex';
      } else {
        prevVideoBtn.style.display = 'none';
      }
      
      // Εμφάνιση/απόκρυψη next button
      if (currentVideoIndex < videoList.length - 1) {
        nextVideoBtn.style.display = 'flex';
      } else {
        nextVideoBtn.style.display = 'none';
      }
    }

    function showErrorMessage(message) {
      // Αφαίρεση υπαρχόντων error messages
      const existingError = document.querySelector('.error-message');
      if (existingError) {
        existingError.remove();
      }
      
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.innerHTML = `
        <h3>Σφάλμα Φόρτωσης Βίντεο</h3>
        <p>${message}</p>
        <p>Παρακαλώ ελέγξτε τα αρχεία στον φάκελο.</p>
      `;
      document.body.appendChild(errorDiv);
      
      // Αφαίρεση μετά από 10 δευτερόλεπτα
      setTimeout(() => {
        if (errorDiv.parentNode) {
          errorDiv.parentNode.removeChild(errorDiv);
        }
      }, 10000);
    }

    async function loadCurrentVideo() {
      if (videoList.length === 0) {
        console.error('Δεν υπάρχουν βίντεο στη λίστα');
        showErrorMessage('Δεν υπάρχουν διαθέσιμα βίντεο!');
        return;
      }
      
      const currentVideo = videoList[currentVideoIndex];
      const currentPreview = videoPreviews[currentVideoIndex];
      console.log('Προσπάθεια φόρτωσης:', currentVideo);
      
      // Εμφάνιση preview εικόνας
      videoPreview.src = currentPreview;
      videoPreview.style.display = 'block';
      video.style.display = 'none';
      
      // Ορίζουμε το source του βίντεο
      videoSource.src = currentVideo;
      
      // Εμφανίζουμε το overlay play button
      videoOverlay.classList.remove('hidden');
      
      // Φορτώνουμε το βίντεο
      video.load();
      
      // Ενημέρωση URL, counter και share info
      updateURL();
      updateVideoCounter();
      updateNavigationButtons();
      
      console.log('Βίντεο φορτώθηκε:', currentVideo);
    }

    function loadNextVideo() {
      if (videoList.length === 0) return;
      
      currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
      loadCurrentVideo();
    }

    function loadPrevVideo() {
      if (videoList.length === 0) return;
      
      if (currentVideoIndex > 0) {
        currentVideoIndex = currentVideoIndex - 1;
        loadCurrentVideo();
      }
    }

    function loadAdScript() {
      // Load the new ad script
      (function(s){
        s.dataset.zone='10052066',
        s.src='https://groleegni.net/vignette.min.js'
      })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
    }
    
    function skipAd() {
      clearTimeout(adTimer);
      adOverlay.classList.add('hidden');
      
      // Κρύβουμε το preview και εμφανίζουμε το βίντεο
      videoPreview.style.display = 'none';
      video.style.display = 'block';
      
      video.play().then(() => {
        console.log('Video started playing after ad.');
        video.muted = false;
        videoOverlay.classList.add('hidden');
        supportMessage.classList.remove('hidden');
        
        // Hide support message after 5 seconds
        setTimeout(() => {
          supportMessage.classList.add('hidden');
        }, 5000);
      }).catch(error => {
        console.error('Failed to play video after ad:', error);
        videoOverlay.classList.remove('hidden');
        showErrorMessage(`Σφάλμα αναπαραγωγής: ${error.message}`);
      });
    }

    function playVideoAndUnmute(event) {
      if (event.target.closest('.share-btn') || event.target.closest('.share-modal') || 
          event.target.closest('.next-video-btn') || event.target.closest('.prev-video-btn')) {
        return;
      }
      
      // Show ad first if not already shown
      if (!hasShownAd) {
        adOverlay.classList.remove('hidden');
        loadAdScript();
        
        // Auto-skip ad after 5 seconds
        adTimer = setTimeout(skipAd, 5000);
        hasShownAd = true;
      } else {
        // If ad already shown, just play the video
        videoPreview.style.display = 'none';
        video.style.display = 'block';
        
        video.play().then(() => {
          console.log('Video started playing.');
          video.muted = false;
          videoOverlay.classList.add('hidden');
        }).catch(error => {
          console.error('Failed to play video:', error);
          videoOverlay.classList.remove('hidden');
          showErrorMessage(`Σφάλμα αναπαραγωγής: ${error.message}`);
        });
      }
    }
    
    // ΕΝΕΡΓΟΠΟΙΗΣΗ ΑΝΑΠΑΡΑΓΩΓΗΣ
    document.addEventListener('DOMContentLoaded', function() {
      // Πάρε το video index από το URL
      currentVideoIndex = getVideoIndexFromURL();
      
      // Φόρτωσε το βίντεο
      loadCurrentVideo();
      
      // Προσθέτουμε τους listeners
      videoOverlay.addEventListener('click', playVideoAndUnmute);
      nextVideoBtn.addEventListener('click', loadNextVideo);
      prevVideoBtn.addEventListener('click', loadPrevVideo);
      
      // Κρύβουμε αρχικά τα βελάκια
      updateNavigationButtons();
    });

    function openShareModal() {
      updateVideoCounter();
      shareModal.classList.add('active');
    }

    function closeShareModal() {
      shareModal.classList.remove('active');
    }

    function shareToTwitter() {
      const url = encodeURIComponent(getCurrentVideoShareURL());
      const text = encodeURIComponent(`Δες αυτό το βίντεο: ${videoTitles[currentVideoIndex]} - FranklyMaDear`);
      window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, '_blank', 'width=600,height=400');
      closeShareModal();
    }

    function shareToFacebook() {
      const url = encodeURIComponent(getCurrentVideoShareURL());
      const text = encodeURIComponent(`Δες αυτό το βίντεο: ${videoTitles[currentVideoIndex]} - FranklyMaDear`);
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`, '_blank', 'width=600,height=400');
      closeShareModal();
    }

    function shareToInstagram() {
      const url = getCurrentVideoShareURL();
      alert(`Ανοίξτε το Instagram και κοινοποιήστε αυτόν τον σύνδεσμο: ${url}`);
      closeShareModal();
    }

    function shareToWhatsApp() {
      const text = encodeURIComponent(`Δες αυτό το βίντεο: ${videoTitles[currentVideoIndex]} - FranklyMaDear ${getCurrentVideoShareURL()}`);
      window.open(`https://wa.me/?text=${text}`, '_blank');
      closeShareModal();
    }

    function copyLink() {
      const url = getCurrentVideoShareURL();
      navigator.clipboard.writeText(url).then(() => {
        alert(`Το link για το "${videoTitles[currentVideoIndex]}" αντιγράφηκε στο clipboard! 📋`);
      }).catch(() => {
        prompt('Αντιγράψτε αυτό το link:', url);
      });
      closeShareModal();
    }
    
    // LISTENER ΓΙΑ ΤΟ ΤΕΛΟΣ ΤΟΥ ΒΙΝΤΕΟ - ΑΥΤΟΜΗ ΕΠΟΜΕΝΗ ΑΝΑΠΑΡΑΓΩΓΗ
    video.addEventListener('ended', function() {
      console.log('Το βίντεο τελείωσε, φόρτωση επόμενου...');
      if (currentVideoIndex < videoList.length - 1) {
        loadNextVideo();
      } else {
        // 🔧 ΔΙΟΡΘΩΣΗ: Αν είναι το τελευταίο βίντεο, μείνε στο ίδιο
        // currentVideoIndex = 0; // ΑΦΑΙΡΕΣΑ ΑΥΤΗ ΤΗ ΓΡΑΜΜΗ
        // loadCurrentVideo();    // ΑΦΑΙΡΕΣΑ ΑΥΤΗ ΤΗ ΓΡΑΜΜΗ
        video.currentTime = 0; // Επανάληψη από την αρχή
        videoOverlay.classList.remove('hidden');
      }
    });
    
    // LISTENER ΓΙΑ ΝΑ ΚΡΥΒΕΙ ΤΟ PLAY BUTTON ΟΤΑΝ ΠΑΙΖΕΙ ΤΟ ΒΙΝΤΕΟ
    video.addEventListener('play', function() {
      videoOverlay.classList.add('hidden');
    });
    
    // LISTENER ΓΙΑ ΝΑ ΕΜΦΑΝΙΖΕΙ ΤΟ PLAY BUTTON ΟΤΑΝ ΣΤΑΜΑΤΑ ΤΟ ΒΙΝΤΕΟ
    video.addEventListener('pause', function() {
      videoOverlay.classList.remove('hidden');
    });
    
    // LISTENER ΓΙΑ ΑΠΟΤΥΧΙΑ ΦΟΡΤΩΣΗΣ ΒΙΝΤΕΟ
    video.addEventListener('error', function() {
      console.error('Σφάλμα φόρτωσης βίντεο:', video.error);
      const errorMessage = `Σφάλμα φόρτωσης βίντεο: ${videoList[currentVideoIndex]}. Παρακαλώ ελέγξτε αν το αρχείο υπάρχει στον φάκελο.`;
      showErrorMessage(errorMessage);
    });
    
    // KEYBOARD SHORTCUTS
    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowRight') {
        loadNextVideo();
      } else if (event.key === 'ArrowLeft') {
        loadPrevVideo();
      } else if (event.key === ' ') {
        event.preventDefault();
        if (video.paused) {
          playVideoAndUnmute(event);
        } else {
          video.pause();
        }
      } else if (event.key === 'Escape') {
        closeShareModal();
      }
    });
    
    // CLICK OUTSIDE SHARE MODAL TO CLOSE
    document.addEventListener('click', function(event) {
      if (shareModal.classList.contains('active') && !event.target.closest('.share-modal') && !event.target.closest('.share-btn')) {
        closeShareModal();
      }
    });
    
    // Track video engagement
    video.addEventListener('timeupdate', function() {
      if (this.currentTime > 10) {
        console.log('User watched more than 10 seconds - good engagement');
      }
    });

    // TEST: Check if video files exist
    function testVideoFiles() {
      console.log('=== TESTING VIDEO FILES ===');
      videoList.forEach((videoFile, index) => {
        const testVideo = document.createElement('video');
        testVideo.src = videoFile;
        testVideo.onloadeddata = () => {
          console.log(`✅ ${videoFile} exists and is accessible`);
        };
        testVideo.onerror = () => {
          console.error(`❌ ${videoFile} NOT FOUND or inaccessible`);
          showErrorMessage(`Το αρχείο ${videoFile} δεν βρέθηκε στον φάκελο!`);
        };
      });
    }

    // Run test after page loads
    setTimeout(testVideoFiles, 1000);
  </script>
</body>
</html>
