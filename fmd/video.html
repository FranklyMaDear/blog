    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }
        
        /* Ad Container */
        #ad-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }
        
        .ad-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4A90E2;
            z-index: 25;
            pointer-events: auto;
        }
        
        .ad-overlay a {
            color: #4A90E2;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
        
        .ad-overlay.hidden {
            display: none;
        }
        
        /* Vignette Ad Styling */
        .vignette-ad {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 30;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Ad Container for Vignette -->
        <div id="ad-container"></div>
        
        <!-- Custom Ad Overlay -->
        <div class="ad-overlay">
            <a href="https://otieu.com/4/10000601" target="_blank" title="Sponsored">
                🔗 Ad
            </a>
        </div>
        
        <!-- Video Player -->
        <video 
            controls 
            autoplay
            muted
            playsinline
            preload="auto"
            poster="thumbnail.png"
        >
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        // Auto-play video
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.querySelector('video');
            video.play().catch(e => console.log('Video play prevented:', e));
            
            // Load Vignette ad after video starts
            video.addEventListener('play', function() {
                loadVignetteAd();
            });
            
            // Also try to load ad on page load
            setTimeout(loadVignetteAd, 2000);
        });
        
        function loadVignetteAd() {
            // Your Vignette ad script
            (function(s){
                s.dataset.zone='10113668',
                s.src='https://groleegni.net/vignette.min.js'
            })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
        }
        
        // Alternative ad loading method
        function loadVignetteAdAlternative() {
            const script = document.createElement('script');
            script.dataset.zone = '10113668';
            script.src = 'https://groleegni.net/vignette.min.js';
            document.getElementById('ad-container').appendChild(script);
        }
    </script>
    
    <!-- Fallback ad loading -->
    <script>
        // Try loading ad after 3 seconds
        setTimeout(() => {
            try {
                (function(s){
                    s.dataset.zone='10113668',
                    s.src='https://groleegni.net/vignette.min.js'
                })(document.body.appendChild(document.createElement('script')));
            } catch(e) {
                console.log('Ad loading error:', e);
            }
        }, 3000);
    </script>
</body>
</html>
