<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Πάνελ Διαχείρισης - Καφεμαντεία</title>
    <style>
        /* ... το ίδιο CSS παραμένει ... */
        
        /* Προσθήκη νέων στυλ για προβολή φωτογραφιών */
        .photo-preview-img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .photo-preview-img:hover {
            transform: scale(1.05);
        }
        
        .photo-info {
            flex: 1;
            min-width: 300px;
        }
        
        .photo-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- ... το ίδιο HTML παραμένει ... -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Στοιχεία DOM
            const adminLogin = document.getElementById('admin-login');
            const adminPanel = document.getElementById('admin-panel');
            const loginError = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const unreadBadge = document.getElementById('unread-badge');
            
            // Στοιχεία για στατιστικά
            const totalUsers = document.getElementById('total-users');
            const totalPhotos = document.getElementById('total-photos');
            const totalMessages = document.getElementById('total-messages');
            const freeCoffeeUsers = document.getElementById('free-coffee-users');
            
            // Λίστες
            const usersList = document.getElementById('users-list');
            const conversationsList = document.getElementById('conversations-list');
            const photosList = document.getElementById('photos-list');
            const pointsList = document.getElementById('points-list');
            const recentActivities = document.getElementById('recent-activities');
            
            // Φόρμες
            const messageUser = document.getElementById('message-user');
            const messageContent = document.getElementById('message-content');
            const sendMessageBtn = document.getElementById('send-message-btn');
            
            // Προκαθορισμένα διαπιστευτήρια διαχειριστή
            const ADMIN_EMAIL = "admin@example.com";
            const ADMIN_PASSWORD = "admin123";
            
            // Μεταβλητές
            let adminUser = null;
            let selectedUserId = null;
            
            // Έλεγχος αν ο διαχειριστής είναι συνδεδεμένος
            const isAdminLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
            
            if (isAdminLoggedIn) {
                showAdminPanel();
            }
            
            // Σύνδεση διαχειριστή
            loginBtn.addEventListener('click', function() {
                const email = document.getElementById('admin-email').value;
                const password = document.getElementById('admin-password').value;
                
                if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showAdminPanel();
                    loginError.style.display = 'none';
                } else {
                    loginError.textContent = 'Λάθος email ή κωδικός πρόσβασης';
                    loginError.style.display = 'block';
                }
            });
            
            // Αποσύνδεση διαχειριστή
            logoutBtn.addEventListener('click', function() {
                localStorage.setItem('adminLoggedIn', 'false');
                adminLogin.style.display = 'block';
                adminPanel.classList.remove('active');
            });
            
            // Εναλλαγή tabs διαχείρισης
            const adminTabs = document.querySelectorAll('.admin-tab[data-tab]');
            adminTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    if (tab.id === 'logout-btn') return;
                    
                    const tabId = tab.getAttribute('data-tab');
                    
                    // Αλλαγή ενεργού tab
                    adminTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Αλλαγή ενεργού περιεχομένου
                    document.querySelectorAll('.admin-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(`${tabId}-content`).classList.add('active');
                    
                    // Φόρτωση δεδομένων για το επιλεγμένο tab
                    loadTabData(tabId);
                });
            });
            
            // Εμφάνιση πάνελ διαχείρισης
            function showAdminPanel() {
                adminLogin.style.display = 'none';
                adminPanel.classList.add('active');
                
                // Βρες τον διαχειριστή
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                adminUser = users.find(u => u.email === ADMIN_EMAIL);
                
                if (!adminUser) {
                    // Δημιουργία διαχειριστή αν δεν υπάρχει
                    initializeDefaultAdmin();
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    adminUser = users.find(u => u.email === ADMIN_EMAIL);
                }
                
                loadDashboardData();
                updateUnreadCount();
            }
            
            // Αρχικοποίηση προκαθορισμένου διαχειριστή
            function initializeDefaultAdmin() {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Έλεγχος αν υπάρχει ήδη ο διαχειριστής
                const adminExists = users.find(user => user.email === ADMIN_EMAIL);
                
                if (!adminExists) {
                    // Δημιουργία προκαθορισμένου διαχειριστή
                    const adminUser = {
                        id: 1,
                        username: 'admin',
                        email: ADMIN_EMAIL,
                        password: ADMIN_PASSWORD,
                        points: 0,
                        role: 'admin',
                        photos: [],
                        conversations: {},
                        createdAt: new Date().toISOString()
                    };
                    users.push(adminUser);
                    localStorage.setItem('users', JSON.stringify(users));
                }
            }
            
            // Φόρτωση δεδομένων πίνακα ελέγχου
            function loadDashboardData() {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Υπολογισμός στατιστικών
                const userCount = users.filter(u => u.email !== ADMIN_EMAIL).length;
                const photoCount = users.reduce((total, user) => total + (user.photos ? user.photos.length : 0), 0);
                
                // Υπολογισμός μηνυμάτων από συνομιλίες
                let messageCount = 0;
                users.forEach(user => {
                    if (user.conversations) {
                        Object.values(user.conversations).forEach(conversation => {
                            messageCount += conversation.messages ? conversation.messages.length : 0;
                        });
                    }
                });
                
                const freeCoffeeCount = users.filter(user => user.points >= 100).length;
                
                // Ενημέρωση στατιστικών
                totalUsers.textContent = userCount;
                totalPhotos.textContent = photoCount;
                totalMessages.textContent = messageCount;
                freeCoffeeUsers.textContent = freeCoffeeCount;
                
                // Φόρτωση πρόσφατων ενεργειών
                loadRecentActivities(users);
            }
            
            // Φόρτωση πρόσφατων ενεργειών
            function loadRecentActivities(users) {
                recentActivities.innerHTML = '';
                
                // Συλλογή όλων των μηνυμάτων από όλες τις συνομιλίες
                let allMessages = [];
                users.forEach(user => {
                    if (user.conversations) {
                        Object.values(user.conversations).forEach(conversation => {
                            if (conversation.messages) {
                                conversation.messages.forEach(message => {
                                    allMessages.push({
                                        ...message,
                                        username: user.username,
                                        userEmail: user.email,
                                        conversationWith: conversation.username
                                    });
                                });
                            }
                        });
                    }
                });
                
                // Ταξινόμηση μηνυμάτων κατά χρονολογική σειρά (νεότερο πρώτο)
                allMessages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                // Εμφάνιση των 10 πιο πρόσφατων μηνυμάτων
                const recentMessages = allMessages.slice(0, 10);
                
                if (recentMessages.length === 0) {
                    recentActivities.innerHTML = '<div class="empty-state">Δεν υπάρχουν πρόσφατες ενέργειες</div>';
                    return;
                }
                
                recentMessages.forEach(message => {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'user-item';
                    
                    const messageDate = new Date(message.timestamp).toLocaleString('el-GR');
                    const senderInfo = message.senderId === adminUser.id ? 
                        '<strong>Διαχειριστής</strong>' : 
                        `<strong>${message.senderName}</strong>`;
                    
                    messageElement.innerHTML = `
                        <div class="user-info">
                            ${senderInfo} - ${messageDate}
                            <div class="message-content">
                                <p>${message.content}</p>
                                <small>Συνομιλία με: ${message.conversationWith || message.senderName}</small>
                            </div>
                        </div>
                    `;
                    
                    recentActivities.appendChild(messageElement);
                });
            }
            
            // Φόρτωση δεδομένων ανάλογα με το tab
            function loadTabData(tabId) {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                switch(tabId) {
                    case 'dashboard':
                        loadDashboardData();
                        break;
                    case 'users':
                        loadUsersData(users);
                        break;
                    case 'conversations':
                        loadConversationsData(users);
                        break;
                    case 'photos':
                        loadPhotosData(users);
                        break;
                    case 'points':
                        loadPointsData(users);
                        break;
                }
            }
            
            // Φόρτωση δεδομένων χρηστών
            function loadUsersData(users) {
                usersList.innerHTML = '';
                
                const regularUsers = users.filter(user => user.email !== ADMIN_EMAIL);
                
                if (regularUsers.length === 0) {
                    usersList.innerHTML = '<div class="empty-state">Δεν υπάρχουν χρήστες</div>';
                    return;
                }
                
                regularUsers.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.className = 'user-item';
                    
                    const registerDate = new Date(user.createdAt).toLocaleDateString('el-GR');
                    const photoCount = user.photos ? user.photos.length : 0;
                    const messageCount = user.conversations && user.conversations[adminUser.id] ? 
                        user.conversations[adminUser.id].messages.length : 0;
                    
                    userElement.innerHTML = `
                        <div class="user-info">
                            <strong>${user.username}</strong><br>
                            <small>${user.email}</small><br>
                            <small>Εγγραφή: ${registerDate}</small><br>
                            <small>Πόντοι: ${user.points || 0} | Φωτογραφίες: ${photoCount} | Μηνύματα: ${messageCount}</small>
                        </div>
                        <div class="user-actions">
                            <button class="admin-btn btn-danger" onclick="deleteUser(${user.id})">Διαγραφή</button>
                        </div>
                    `;
                    
                    usersList.appendChild(userElement);
                });
            }
            
            // Φόρτωση δεδομένων συνομιλιών
            function loadConversationsData(users) {
                conversationsList.innerHTML = '';
                
                // Συμπλήρωση dropdown επιλογής χρήστη
                messageUser.innerHTML = '<option value="">-- Επιλέξτε Χρήστη --</option>';
                users.forEach(user => {
                    if (user.email !== ADMIN_EMAIL) {
                        const option = document.createElement('option');
                        option.value = user.id;
                        option.textContent = `${user.username} (${user.email})`;
                        messageUser.appendChild(option);
                    }
                });
                
                // Εμφάνιση συνομιλιών με χρήστες
                if (!adminUser.conversations || Object.keys(adminUser.conversations).length === 0) {
                    conversationsList.innerHTML = '<div class="empty-state">Δεν υπάρχουν συνομιλίες</div>';
                    return;
                }
                
                Object.values(adminUser.conversations).forEach(conversation => {
                    const user = users.find(u => u.id === conversation.userId);
                    if (!user) return;
                    
                    const conversationElement = document.createElement('div');
                    conversationElement.className = 'conversation-item';
                    
                    const lastMessage = conversation.messages && conversation.messages.length > 0 ? 
                        conversation.messages[conversation.messages.length - 1] : null;
                    
                    const unreadCount = conversation.messages ? 
                        conversation.messages.filter(m => !m.read && m.senderId !== adminUser.id).length : 0;
                    
                    conversationElement.innerHTML = `
                        <div class="conversation-info">
                            <strong>${user.username} (${user.email})</strong>
                            ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
                            ${lastMessage ? `
                                <div class="message-content">
                                    <p><strong>Τελευταίο μήνυμα:</strong> ${lastMessage.content}</p>
                                    <small>${new Date(lastMessage.timestamp).toLocaleString('el-GR')}</small>
                                </div>
                            ` : ''}
                        </div>
                        <div class="conversation-actions">
                            <button class="admin-btn" onclick="viewConversation(${user.id})">Προβολή</button>
                            <button class="admin-btn btn-danger" onclick="deleteConversation(${user.id})">Διαγραφή</button>
                        </div>
                    `;
                    
                    conversationsList.appendChild(conversationElement);
                });
                
                updateUnreadCount();
            }
            
            // Φόρτωση δεδομένων φωτογραφιών (διορθωμένο)
            function loadPhotosData(users) {
                photosList.innerHTML = '';
                
                let hasPhotos = false;
                
                users.forEach(user => {
                    if (user.photos && user.photos.length > 0 && user.email !== ADMIN_EMAIL) {
                        hasPhotos = true;
                        
                        user.photos.forEach(photo => {
                            const photoElement = document.createElement('div');
                            photoElement.className = 'photo-item';
                            
                            const uploadDate = new Date(photo.uploadedAt).toLocaleString('el-GR');
                            
                            // Προβολή πραγματικής φωτογραφίας αν υπάρχει dataUrl
                            const photoPreview = photo.dataUrl ? 
                                `<img src="${photo.dataUrl}" alt="${photo.filename}" class="photo-preview-img" onclick="viewPhoto('${photo.dataUrl}', '${photo.filename}')">` :
                                `<div class="photo-preview">📷 ${photo.filename}</div>`;
                            
                            photoElement.innerHTML = `
                                <div class="photo-info">
                                    <strong>${user.username}</strong> (${user.email})<br>
                                    <small>Ανέβηκε: ${uploadDate}</small><br>
                                    <small>Όνομα αρχείου: ${photo.filename}</small>
                                    ${photoPreview}
                                </div>
                                <div class="photo-actions">
                                    <button class="admin-btn" onclick="viewPhoto('${photo.dataUrl || ''}', '${photo.filename}')">Προβολή</button>
                                    <button class="admin-btn btn-danger" onclick="deletePhoto(${user.id}, ${photo.id})">Διαγραφή</button>
                                </div>
                            `;
                            
                            photosList.appendChild(photoElement);
                        });
                    }
                });
                
                if (!hasPhotos) {
                    photosList.innerHTML = '<div class="empty-state">Δεν υπάρχουν φωτογραφίες</div>';
                }
            }
            
            // Φόρτωση δεδομένων πόντων
            function loadPointsData(users) {
                pointsList.innerHTML = '';
                
                const regularUsers = users.filter(user => user.email !== ADMIN_EMAIL);
                
                if (regularUsers.length === 0) {
                    pointsList.innerHTML = '<div class="empty-state">Δεν υπάρχουν χρήστες</div>';
                    return;
                }
                
                regularUsers.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.className = 'user-item';
                    
                    userElement.innerHTML = `
                        <div class="user-info">
                            <strong>${user.username}</strong><br>
                            <small>${user.email}</small><br>
                            <div class="points-control">
                                <span>Τρέχοντες Πόντοι: </span>
                                <strong id="points-${user.id}">${user.points || 0}</strong>
                            </div>
                        </div>
                        <div class="user-actions">
                            <div class="points-control">
                                <input type="number" id="add-points-${user.id}" class="points-input" min="1" max="100" value="1">
                                <button class="admin-btn btn-success" onclick="addPoints(${user.id})">+</button>
                                <input type="number" id="remove-points-${user.id}" class="points-input" min="1" max="100" value="1">
                                <button class="admin-btn btn-danger" onclick="removePoints(${user.id})">-</button>
                                <button class="admin-btn" onclick="setPoints(${user.id})">Ορισμός</button>
                            </div>
                        </div>
                    `;
                    
                    pointsList.appendChild(userElement);
                });
            }
            
            // Ενημέρωση αριθμού μη αναγνωσμένων μηνυμάτων
            function updateUnreadCount() {
                if (!adminUser.conversations) {
                    unreadBadge.style.display = 'none';
                    return;
                }
                
                let unreadCount = 0;
                Object.values(adminUser.conversations).forEach(conversation => {
                    if (conversation.messages) {
                        conversation.messages.forEach(message => {
                            if (!message.read && message.senderId !== adminUser.id) {
                                unreadCount++;
                            }
                        });
                    }
                });
                
                if (unreadCount > 0) {
                    unreadBadge.textContent = unreadCount;
                    unreadBadge.style.display = 'inline-flex';
                } else {
                    unreadBadge.style.display = 'none';
                }
            }
            
            // Αποστολή μηνύματος από διαχειριστή
            sendMessageBtn.addEventListener('click', function() {
                const userId = parseInt(messageUser.value);
                const content = messageContent.value.trim();
                
                if (!userId || !content) {
                    alert('Παρακαλώ επιλέξτε χρήστη και γράψτε ένα μήνυμα');
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const userIndex = users.findIndex(u => u.id === userId);
                const adminIndex = users.findIndex(u => u.id === adminUser.id);
                
                if (userIndex === -1 || adminIndex === -1) {
                    alert('Ο χρήστης δεν βρέθηκε');
                    return;
                }
                
                // Δημιουργία νέου μηνύματος
                const newMessage = {
                    id: Date.now(),
                    senderId: adminUser.id,
                    senderName: adminUser.username,
                    content: content,
                    timestamp: new Date().toISOString(),
                    read: false
                };
                
                // Προσθήκη μηνύματος στον χρήστη
                if (!users[userIndex].conversations) users[userIndex].conversations = {};
                if (!users[userIndex].conversations[adminUser.id]) {
                    users[userIndex].conversations[adminUser.id] = {
                        userId: adminUser.id,
                        username: adminUser.username,
                        email: adminUser.email,
                        messages: []
                    };
                }
                users[userIndex].conversations[adminUser.id].messages.push(newMessage);
                
                // Προσθήκη μηνύματος στον διαχειριστή
                if (!users[adminIndex].conversations) users[adminIndex].conversations = {};
                if (!users[adminIndex].conversations[userId]) {
                    users[adminIndex].conversations[userId] = {
                        userId: userId,
                        username: users[userIndex].username,
                        email: users[userIndex].email,
                        messages: []
                    };
                }
                users[adminIndex].conversations[userId].messages.push(newMessage);
                
                localStorage.setItem('users', JSON.stringify(users));
                
                // Ενημέρωση του adminUser
                adminUser = users[adminIndex];
                localStorage.setItem('currentUser', JSON.stringify(adminUser));
                
                // Εμφάνιση μηνύματος επιτυχίας
                alert('Το μήνυμα στάλθηκε επιτυχώς!');
                
                // Εκκαθάριση φόρμας
                messageContent.value = '';
                
                // Επαναφόρτωση δεδομένων
                loadConversationsData(users);
            });
            
            // Καθολικές συναρτήσεις για χειρισμό δεδομένων
            window.viewPhoto = function(dataUrl, filename) {
                if (!dataUrl) {
                    alert('Δεν υπάρχει διαθέσιμη προεπισκόπηση για αυτή τη φωτογραφία');
                    return;
                }
                
                // Άνοιγμα νέου παραθύρου για προβολή φωτογραφίας
                const photoWindow = window.open('', '_blank', 'width=800,height=600');
                photoWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Προβολή Φωτογραφίας: ${filename}</title>
                        <style>
                            body { 
                                display: flex; 
                                justify-content: center; 
                                align-items: center; 
                                height: 100vh; 
                                margin: 0; 
                                background: #f0f0f0; 
                                font-family: Arial, sans-serif;
                            }
                            .container {
                                text-align: center;
                                padding: 20px;
                            }
                            img { 
                                max-width: 90%; 
                                max-height: 80%; 
                                border-radius: 10px; 
                                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                                margin-bottom: 20px;
                            }
                            h1 {
                                color: #333;
                                margin-bottom: 10px;
                            }
                            p {
                                color: #666;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="container">
                            <h1>${filename}</h1>
                            <img src="${dataUrl}" alt="${filename}">
                            <p>Κλείστε αυτό το παράθυρο για να επιστρέψετε</p>
                        </div>
                    </body>
                    </html>
                `);
            };
            
            window.deleteUser = function(userId) {
                if (!confirm('Είστε σίγουρος ότι θέλετε να διαγράψετε αυτόν τον χρήστη;')) {
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const updatedUsers = users.filter(user => user.id !== userId);
                localStorage.setItem('users', JSON.stringify(updatedUsers));
                
                // Επαναφόρτωση δεδομένων
                loadUsersData(updatedUsers);
                loadDashboardData();
            };
            
            window.viewConversation = function(userId) {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const user = users.find(u => u.id === userId);
                
                if (!user || !adminUser.conversations || !adminUser.conversations[userId]) {
                    alert('Δεν βρέθηκε η συνομιλία');
                    return;
                }
                
                const conversation = adminUser.conversations[userId];
                let messagesHtml = '<h4>Συνομιλία με ' + user.username + '</h4>';
                
                conversation.messages.forEach(message => {
                    const time = new Date(message.timestamp).toLocaleString('el-GR');
                    messagesHtml += `
                        <div class="message-item">
                            <div class="message-info">
                                <strong>${message.senderName}</strong> - ${time}
                                <div class="message-content">${message.content}</div>
                            </div>
                        </div>
                    `;
                });
                
                alert('Προβολή συνομιλίας - θα εμφανιστεί σε νέο παράθυρο στην πλήρη έκδοση');
                console.log('Συνομιλία με ' + user.username + ':', conversation.messages);
            };
            
            window.deleteConversation = function(userId) {
                if (!confirm('Είστε σίγουρος ότι θέλετε να διαγράψετε αυτή τη συνομιλία;')) {
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const userIndex = users.findIndex(u => u.id === userId);
                const adminIndex = users.findIndex(u => u.id === adminUser.id);
                
                if (userIndex !== -1 && users[userIndex].conversations) {
                    delete users[userIndex].conversations[adminUser.id];
                }
                
                if (adminIndex !== -1 && users[adminIndex].conversations) {
                    delete users[adminIndex].conversations[userId];
                }
                
                localStorage.setItem('users', JSON.stringify(users));
                adminUser = users[adminIndex];
                
                // Επαναφόρτωση δεδομένων συνομιλιών
                loadConversationsData(users);
            };
            
            window.deletePhoto = function(userId, photoId) {
                if (!confirm('Είστε σίγουρος ότι θέλετε να διαγράψετε αυτή τη φωτογραφία;')) {
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const userIndex = users.findIndex(u => u.id === userId);
                
                if (userIndex !== -1 && users[userIndex].photos) {
                    users[userIndex].photos = users[userIndex].photos.filter(photo => photo.id !== photoId);
                    localStorage.setItem('users', JSON.stringify(users));
                    
                    // Επαναφόρτωση δεδομένων φωτογραφιών
                    loadPhotosData(users);
                    loadDashboardData();
                }
            };
            
            window.addPoints = function(userId) {
                const pointsToAdd = parseInt(document.getElementById(`add-points-${userId}`).value) || 1;
                updateUserPoints(userId, pointsToAdd);
            };
            
            window.removePoints = function(userId) {
                const pointsToRemove = parseInt(document.getElementById(`remove-points-${userId}`).value) || 1;
                updateUserPoints(userId, -pointsToRemove);
            };
            
            window.setPoints = function(userId) {
                const pointsToSet = parseInt(document.getElementById(`add-points-${userId}`).value) || 0;
                setUserPoints(userId, pointsToSet);
            };
            
            function updateUserPoints(userId, pointsChange) {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const userIndex = users.findIndex(u => u.id === userId);
                
                if (userIndex !== -1) {
                    users[userIndex].points = Math.max(0, (users[userIndex].points || 0) + pointsChange);
                    localStorage.setItem('users', JSON.stringify(users));
                    
                    // Ενημέρωση εμφάνισης
                    document.getElementById(`points-${userId}`).textContent = users[userIndex].points;
                    
                    // Επαναφόρτωση στατιστικών
                    loadDashboardData();
                }
            }
            
            function setUserPoints(userId, points) {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const userIndex = users.findIndex(u => u.id === userId);
                
                if (userIndex !== -1) {
                    users[userIndex].points = Math.max(0, points);
                    localStorage.setItem('users', JSON.stringify(users));
                    
                    // Ενημέρωση εμφάνισης
                    document.getElementById(`points-${userId}`).textContent = users[userIndex].points;
                    
                    // Επαναφόρτωση στατιστικών
                    loadDashboardData();
                }
            }
        });
    </script>
</body>
</html>
