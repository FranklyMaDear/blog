        /* MID-ROLL AD OVERLAY (για μέση διαφήμιση) */

        /* ADS CONTAINER - 3 ΤΕΤΡΑΓΩΝΙΣΜΕΝΕΣ ΜΠΑΡΕΣ */

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            const overlayAd = document.getElementById('overlayAd');
            const topBannerAd = document.getElementById('topBannerAd');
            const midrollOverlay = document.getElementById('midrollOverlay');
            const skipButton = document.getElementById('skipButton');
            const countdownElement = document.getElementById('countdown');
            const countdownSeconds = document.getElementById('countdownSeconds');
            
            let midrollTimer;
            let adCountdown = 5;
            
            console.log('Nature Blonde video page loaded with advanced ad system');
            
            // ΑΥΤΟΜΑΤΟ START ΤΟΥ ΒΙΝΤΕΟ
            setTimeout(() => {
                video.play().then(() => {
                    console.log('Auto-play successful');
                    // Εμφάνιση top banner μετά από 3 δευτερόλεπτα
                    setTimeout(() => {
                        topBannerAd.classList.add('active');
                        console.log('Top banner ad shown');
                        
                        // Κλείσιμο top banner μετά από 10 δευτερόλεπτα
                        setTimeout(() => {
                            topBannerAd.classList.remove('active');
                            console.log('Top banner ad hidden');
                        }, 10000);
                    }, 3000);
                    
                    // Προγραμματισμός mid-roll ad στο 30% του βίντεο
                    scheduleMidrollAd();
                }).catch(e => {
                    console.log('Auto-play failed:', e.message);
                });
            }, 1000);
            
            function scheduleMidrollAd() {
                if (!video.duration) return;
                
                const midrollTime = video.duration * 0.3; // 30% του βίντεο
                
                video.addEventListener('timeupdate', function checkMidroll() {
                    if (video.currentTime >= midrollTime && !midrollOverlay.classList.contains('active')) {
                        showMidrollAd();
                        video.removeEventListener('timeupdate', checkMidroll);
                    }
                });
            }
            
            function showMidrollAd() {
                console.log('Showing mid-roll ad');
                video.pause();
                midrollOverlay.classList.add('active');
                adCountdown = 5;
                
                midrollTimer = setInterval(() => {
                    adCountdown--;
                    countdownElement.textContent = adCountdown;
                    countdownSeconds.textContent = adCountdown;
                    
                    if (adCountdown <= 0) {
                        hideMidrollAd();
                    }
                }, 1000);
            }
            
            function hideMidrollAd() {
                clearInterval(midrollTimer);
                midrollOverlay.classList.remove('active');
                video.play();
                console.log('Mid-roll ad completed');
                
                // Εμφάνιση bottom overlay ad μετά το mid-roll
                setTimeout(() => {
                    overlayAd.classList.add('active');
                    console.log('Bottom overlay ad shown');
                    
                    // Απόκρυψη μετά από 15 δευτερόλεπτα
                    setTimeout(() => {
                        overlayAd.classList.remove('active');
                        console.log('Bottom overlay ad hidden');
                    }, 15000);
                }, 2000);
            }
            
            // Χειρισμός skip button
            skipButton.addEventListener('click', hideMidrollAd);
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ
            video.addEventListener('play', function() {
                console.log('Nature video playing');
            });
            
            video.addEventListener('pause', function() {
                console.log('Nature video paused');
            });
            
            video.addEventListener('ended', function() {
                console.log('Nature video ended');
                // Εμφάνιση τελικού overlay ad
                setTimeout(() => {
                    overlayAd.classList.add('active');
                    console.log('Final overlay ad shown on video end');
                }, 1000);
            });
            
            // Ανανέωση διαφημίσεων
            function refreshAds() {
                if (window.adsbygoogle) {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    console.log('Ads refreshed');
                }
            }
            
            // Αυτόματη ανανέωση διαφημίσεων
            setInterval(refreshAds, 60000); // Ανανέωση κάθε λεπτό
            
            // Χειρισμός σφαλμάτων
            window.addEventListener('error', function(e) {
                console.error('Global error:', e.message);
            });
            
            console.log('Advanced ad system initialized');
        });
    </script>
