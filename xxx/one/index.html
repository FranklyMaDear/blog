    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('mainVideo');
            
            console.log('Nature Blonde video page loaded with 3 ad slots');
            
            // ΑΥΤΟΜΑΤΟ START ΤΟΥ ΒΙΝΤΕΟ
            setTimeout(() => {
                console.log('Attempting auto-play...');
                video.play().then(() => {
                    console.log('Auto-play successful');
                }).catch(e => {
                    console.log('Auto-play failed:', e.message);
                });
            }, 1000);
            
            // ΒΙΝΤΕΟ ΛΕΙΤΟΥΡΓΙΑ
            video.addEventListener('play', function() {
                console.log('Nature video playing');
            });
            
            video.addEventListener('pause', function() {
                console.log('Nature video paused');
            });
            
            video.addEventListener('ended', function() {
                console.log('Nature video ended');
                video.currentTime = 0;
            });
            
            // Φόρτωση διαφημίσεων μετά την επανάληψη
            video.addEventListener('ended', function() {
                console.log('Reloading ads after Nature video end');
                setTimeout(() => {
                    if (window.adsbygoogle) {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                        console.log('Nature ads reloaded');
                    }
                }, 1000);
            });
            
            // Χειρισμός σφαλμάτων
            window.addEventListener('error', function(e) {
                console.error('Global error:', e.message, e.filename, e.lineno);
            });
            
            // Προσομοίωση κλικ για δοκιμή
            window.testVideo = function() {
                console.log('Nature test function called');
                video.play();
            };
            
            // Εμφάνιση πληροφοριών για debugging
            console.log('Nature page initialized successfully with 3 ad slots');
            console.log('Nature video source:', video.querySelector('source').src);
        });
        
        // Ταχύτερη φόρτωση διαφημίσεων όταν η σελίδα είναι ορατή
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                console.log('Nature page visible - refreshing ads');
                if (window.adsbygoogle) {
                    setTimeout(() => {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    }, 500);
