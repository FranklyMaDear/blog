    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #050505;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .video-wrapper {
            background: #111;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #00ffcc; /* Neon χρωματισμός */
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            text-align: center;
            width: 510px;
        }

        .ad-wrapper {
            width: 300px;
            height: 250px;
            border: 2px solid #ff0055; /* Neon για διαφήμιση */
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
        }

        iframe {
            border-radius: 10px;
            max-width: 100%;
        }

        /* Κουμπί X (Twitter) */
        .share-btn {
            display: inline-flex;
            align-items: center;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .share-btn:hover {
            background-color: #e1e1e1;
        }

        .share-btn i {
            margin-right: 8px;
        }

        @media (max-width: 550px) {
            .video-wrapper, .ad-wrapper {
                width: 95%;
            }
        }
    </style>
</head>
