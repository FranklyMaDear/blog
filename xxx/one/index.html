<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
     crossorigin="anonymous"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .ad-section {
            width: 100%;
            margin-bottom: 30px;
            text-align: center;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(510px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .video-item {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        iframe {
            max-width: 100%;
            border: none;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Προσαρμογή για κινητά */
        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Gallery</h1>

        <div class="ad-section">
            <ins class="adsbygoogle"
                 style="display:block"

        </div>
