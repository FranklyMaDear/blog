<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Video Gallery</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3186700611266549"
     crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b0b;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(510px, 1fr));
            gap: 40px;
            justify-items: center;
        }

        /* Εφέ για τα βίντεο */
        .video-item {
            background: #000;
            padding: 10px;
            border-radius: 15px;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px #00d2ff, inset 0 0 10px #00d2ff;
            transition: transform 0.3s ease;
        }

        .video-item:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #00d2ff;
        }

        /* Εφέ για τις διαφημίσεις */
        .ad-item {
            background: #1a1a1a;
            width: 510px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px #ff0055;
            overflow: hidden;
        }

        iframe {
            max-width: 100%;
            border-radius: 10px;
        }

        /* Responsive για κινητά */
        @media (max-width: 600px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .ad-item, .video-item {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <h1>Neon Video Gallery</h1>

    <div class="container">
        <div class="content-grid">
            
            <div class="video-item">

            </div>
