      color: white;

    /* Background Effects */
    .background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    
    .animated-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
          radial-gradient(circle at 20% 80%, rgba(41, 128, 185, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(231, 76, 60, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(46, 204, 113, 0.2) 0%, transparent 50%),
          radial-gradient(circle at 60% 60%, rgba(155, 89, 182, 0.25) 0%, transparent 50%),
          radial-gradient(circle at 30% 70%, rgba(241, 196, 15, 0.15) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite;
    }
    
    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .floating-element {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      animation: float 15s infinite linear;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
    }
    
    .floating-element:nth-child(1) {
      width: 100px;
      height: 100px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
      animation-duration: 20s;
      background: radial-gradient(circle, rgba(52, 152, 219, 0.3), transparent 70%);
    }
    
    .floating-element:nth-child(2) {
      width: 150px;
      height: 150px;
      top: 60%;
      left: 80%;
      animation-delay: -5s;
      animation-duration: 25s;
      background: radial-gradient(circle, rgba(231, 76, 60, 0.3), transparent 70%);
    }
    
    .floating-element:nth-child(3) {
      width: 80px;
      height: 80px;
      top: 80%;
      left: 20%;
      animation-delay: -10s;
      animation-duration: 18s;
      background: radial-gradient(circle, rgba(46, 204, 113, 0.3), transparent 70%);
    }
    
    .floating-element:nth-child(4) {
      width: 120px;
      height: 120px;
      top: 30%;
      left: 70%;
      animation-delay: -7s;
      animation-duration: 22s;
      background: radial-gradient(circle, rgba(155, 89, 182, 0.3), transparent 70%);
    }
    
    @keyframes bgPulse {
      0%, 100% {
        opacity: 0.6;
        transform: scale(1);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.05);
      }
    }
    
    @keyframes float {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(50px, 50px) rotate(90deg);
      }
      50% {
        transform: translate(100px, 0) rotate(180deg);
      }
      75% {
        transform: translate(50px, -50px) rotate(270deg);
      }
      100% {
        transform: translate(0, 0) rotate(360deg);
      }
    }

    .video-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Iframe styling */
    .rumble-iframe {
      width: 90%;
      height: 90%;
      max-width: 1200px;
      max-height: 675px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      z-index: 3;
      position: relative;
      background: #000;
    }
    
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .iframe-wrapper.active {
      display: flex;
    }

    /* Video Glow Effect */
    .video-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 95%;
      height: 95%;
      border: 2px solid transparent;
      border-radius: 10px;
      background: linear-gradient(45deg, transparent, rgba(52, 152, 219, 0.3), transparent);
      animation: glowRotate 6s linear infinite;
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 50px rgba(52, 152, 219, 0.2);
    }
    
    @keyframes glowRotate {
      0% {
        background: linear-gradient(45deg, transparent, rgba(52, 152, 219, 0.3), transparent);
        box-shadow: 0 0 50px rgba(52, 152, 219, 0.2);
      }
      25% {
        background: linear-gradient(135deg, transparent, rgba(46, 204, 113, 0.3), transparent);
        box-shadow: 0 0 50px rgba(46, 204, 113, 0.2);
      }
      50% {
        background: linear-gradient(225deg, transparent, rgba(231, 76, 60, 0.3), transparent);
        box-shadow: 0 0 50px rgba(231, 76, 60, 0.2);
      }
      75% {
        background: linear-gradient(315deg, transparent, rgba(155, 89, 182, 0.3), transparent);
        box-shadow: 0 0 50px rgba(155, 89, 182, 0.2);
      }
      100% {
        background: linear-gradient(45deg, transparent, rgba(52, 152, 219, 0.3), transparent);
        box-shadow: 0 0 50px rgba(52, 152, 219, 0.2);
      }
    }

    .video-counter {

    .video-preview {

      left: 0;

      z-index: 1;

    .reaction-bar {

      border: 1px solid rgba(255,255,255,0.2);

      flex-wrap: nowrap;
      overflow-x: auto;

    /* Hide scrollbar for reaction bar */
    .reaction-bar::-webkit-scrollbar {
      display: none;
    }

    .reaction-emoji {
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
      position: relative;
      flex-shrink: 0;
      min-width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none; 
      border-radius: 50%;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);

    .reaction-emoji.red-like, .reaction-emoji.blue-like {
        font-size: 48px;

    .reaction-emoji:nth-child(4), 
    .reaction-emoji:nth-child(5), 
    .reaction-emoji:nth-child(6), 
    .reaction-emoji:nth-child(7), 
    .reaction-emoji:nth-child(8) 
    {

    }

    .reaction-emoji:hover {
      transform: scale(1.1);
      background: none;
    }
    
    .reaction-emoji.clicked {
      animation: emojiPop 0.6s ease;
    }

    @keyframes emojiPop {

      50% {

      100% {

    .reaction-label {

    .share-icon {

    .share-label {
      font-size: 11px;

    }

    ::-webkit-scrollbar {
      display: none;
    }
    
    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;

    /* Loading Spinner */
    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-radius: 50%;

      z-index: 10;
    }
    
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      .rumble-iframe {

      .video-counter {

      .reaction-bar {

      }

      }

    // Video data
    const videoData = [

    // DOM Elements
    const nextVideoBtn = document.getElementById('nextVideoBtn');
    const prevVideoBtn = document.getElementById('prevVideoBtn');
    const videoCounter = document.getElementById('videoCounter');
    const currentVideoName = document.getElementById('currentVideoName');
    const shareModal = document.getElementById('shareModal');
    const loadingSpinner = document.getElementById('loadingSpinner');

    let currentVideoIndex = 0;
    const totalVideos = videoData.length;

    // Initialize
    function init() {
      currentVideoIndex = getVideoIndexFromURL();
      showVideo(currentVideoIndex);
      updateNavigationButtons();
      updateVideoCounter();
      
      // Hide loading spinner after 1 second
      setTimeout(() => {
        loadingSpinner.style.display = 'none';
      }, 1000);
    }

    // Get video index from URL
    function getVideoIndexFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const videoParam = urlParams.get('video');
      
      if (videoParam) {
        const index = parseInt(videoParam) - 1;
        if (index >= 0 && index < totalVideos) {
          return index;
        }
      }
      return 0;
    }

    // Update URL without reload
    function updateURL() {
      const newURL = `${window.location.pathname}?video=${currentVideoIndex + 1}`;
      window.history.replaceState({}, '', newURL);
    }

    // Show specific video
    function showVideo(index) {
      // Hide all iframes
      for (let i = 1; i <= totalVideos; i++) {
        const wrapper = document.getElementById(`iframeWrapper${i}`);
        if (wrapper) {
          wrapper.classList.remove('active');
        }
      }
      
      // Show loading spinner
      loadingSpinner.style.display = 'block';
      
      // Show selected iframe after short delay
      setTimeout(() => {
        const selectedWrapper = document.getElementById(`iframeWrapper${index + 1}`);
        if (selectedWrapper) {
          selectedWrapper.classList.add('active');
        }
        loadingSpinner.style.display = 'none';
      }, 300);
      
      updateURL();
      updateVideoCounter();
      updateNavigationButtons();
    }

    // Update video counter
    function updateVideoCounter() {
      videoCounter.textContent = `${currentVideoIndex + 1} / ${totalVideos}`;
      currentVideoName.textContent = videoData[currentVideoIndex].title;
    }

    // Update navigation buttons
    function updateNavigationButtons() {
      // Previous button
      if (currentVideoIndex > 0) {
        prevVideoBtn.style.display = 'flex';
      } else {
        prevVideoBtn.style.display = 'none';
      }
      
      // Next button
      if (currentVideoIndex < totalVideos - 1) {
        nextVideoBtn.style.display = 'flex';
      } else {
        nextVideoBtn.style.display = 'none';
      }
    }

    // Next video
    function nextVideo() {
      if (currentVideoIndex < totalVideos - 1) {
        currentVideoIndex++;
        showVideo(currentVideoIndex);
      }
    }

    // Previous video
    function prevVideo() {
      if (currentVideoIndex > 0) {
        currentVideoIndex--;
        showVideo(currentVideoIndex);
      }
    }

    // React to emoji
    function reactToEmoji(emoji, label) {
      const emojiElement = event.currentTarget;
      emojiElement.classList.add('clicked');
      
      showReactionMessage(emoji, label);
      
      setTimeout(() => {
        emojiElement.classList.remove('clicked');
      }, 600);
    }

    function showReactionMessage(emoji, label) {
      const message = document.createElement('div');
      message.textContent = `${emoji} ${label}`;
      message.style.position = 'fixed';
      message.style.top = '50%';
      message.style.left = '50%';
      message.style.transform = 'translate(-50%, -50%)';
      message.style.background = 'rgba(0,0,0,0.8)';
      message.style.color = 'white';
      message.style.padding = '10px 20px';
      message.style.borderRadius = '20px';
      message.style.fontSize = '18px';
      message.style.zIndex = '1000';
      message.style.backdropFilter = 'blur(10px)';
      message.style.border = '1px solid rgba(255,255,255,0.2)';
      
      document.body.appendChild(message);
      
      setTimeout(() => {
        message.style.opacity = '0';
        message.style.transition = 'opacity 0.5s ease';
        setTimeout(() => {
          document.body.removeChild(message);
        }, 500);
      }, 2000);
    }

    // Share modal functions
    function openShareModal() {
      shareModal.classList.add('active');
    }

    function closeShareModal() {
      shareModal.classList.remove('active');
    }

    // Share functions
    function getCurrentVideoShareURL() {
      return `${window.location.origin}${window.location.pathname}?video=${currentVideoIndex + 1}`;
    }

    function shareToFacebook() {
      const url = encodeURIComponent(getCurrentVideoShareURL());
      const text = encodeURIComponent(`Watch this amazing video: ${videoData[currentVideoIndex].title}`);
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`, '_blank', 'width=600,height=400');
      closeShareModal();
    }

    function shareToTwitter() {
      const url = encodeURIComponent(getCurrentVideoShareURL());
      const text = encodeURIComponent(`Watch this amazing video: ${videoData[currentVideoIndex].title}`);
      window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, '_blank', 'width=600,height=400');
      closeShareModal();
    }

    function shareToInstagram() {
      const url = getCurrentVideoShareURL();
      alert(`Open Instagram and share this link: ${url}`);
      closeShareModal();
    }

    function shareToWhatsApp() {
      const text = encodeURIComponent(`Watch this amazing video: ${videoData[currentVideoIndex].title} ${getCurrentVideoShareURL()}`);
      window.open(`https://wa.me/?text=${text}`, '_blank');
      closeShareModal();
    }

    function copyLink() {
      const url = getCurrentVideoShareURL();
      navigator.clipboard.writeText(url).then(() => {
        alert(`Link for "${videoData[currentVideoIndex].title}" copied to clipboard! 📋`);
      }).catch(() => {
        prompt('Copy this link:', url);
      });
      closeShareModal();
    }

    // Event listeners
    nextVideoBtn.addEventListener('click', nextVideo);
    prevVideoBtn.addEventListener('click', prevVideo);

    // Swipe functionality for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    
    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);
    
    function handleSwipe() {
      const swipeThreshold = 50;
      
      if (touchEndX < touchStartX - swipeThreshold) {
        nextVideo();
      }
      
      if (touchEndX > touchStartX + swipeThreshold) {
        prevVideo();
      }
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowRight') {
        nextVideo();
      } else if (event.key === 'ArrowLeft') {
        prevVideo();
      } else if (event.key === 'Escape') {
        closeShareModal();
      }
    });
    
    // Close share modal when clicking outside
    document.addEventListener('click', function(event) {
      if (shareModal.classList.contains('active') && 
          !event.target.closest('.share-modal') && 
          !event.target.closest('.share-btn')) {
        closeShareModal();
      }
    });

    // Initialize on page load
    window.addEventListener('load', init);
  </script>
