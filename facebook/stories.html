    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
        }
        
        .slider-container {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        
        .video-slider {
            display: flex;
            overflow: hidden;
        }
        
        .video-slide {
            min-width: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .video-wrapper {
            width: 100%;
            background: #000;
            position: relative;
        }
        
        .rumble-player {
            width: 100%;
            min-height: 560px;
            background: #000;
        }
        
        /* Navigation Arrows */
        .slider-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none;
            padding: 0 15px;
            z-index: 10;
        }
        
        .nav-arrow {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: all 0.3s ease;
        }
        
        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        /* Dots Indicator */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
        
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dot.active {
            background: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        /* Share Panel - ΕΠΑΓΓΕΛΜΑΤΙΚΟ */
        .share-panel {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .share-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .share-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .share-count {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ΕΠΑΓΓΕΛΜΑΤΙΚΑ ΚΟΥΜΠΙΑ */
        .share-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }
        
        .share-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }
        
        .share-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .share-btn:hover::before {
            left: 100%;
        }
        
        .share-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .share-btn i {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        
        /* Χρώματα πλατφορμών */
        .fb { 
            border-color: rgba(24, 119, 242, 0.4);
            color: #8bb9ff;
        }
        .fb i { color: #1877f2; }
        
        .tw { 
            border-color: rgba(29, 161, 242, 0.4);
            color: #7bcbff;
        }
        .tw i { color: #1da1f2; }
        
        .wa { 
            border-color: rgba(37, 211, 102, 0.4);
            color: #8bffb3;
        }
        .wa i { color: #25d366; }
        
        .tg { 
            border-color: rgba(0, 136, 204, 0.4);
            color: #80d4ff;
        }
        .tg i { color: #0088cc; }
        
        .link { 
            border-color: rgba(153, 153, 153, 0.4);
            color: #ccc;
        }
        .link i { color: #999; }
        
        .share-btn-text {
            flex-grow: 1;
        }
        
        /* Video Titles */
        .video-title {
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 18px;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.7));
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 5;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .container {

            }
            
            .rumble-player {

            }

            }
            
            .share-grid {

            }
            
            .share-btn {
                padding: 14px;

                text-align: center;

            }
            
            .share-btn i {

            }
        }
        
        @media (max-width: 480px) {
            .rumble-player {
                min-height: 300px;

            .share-btn {
                flex-direction: row;
                justify-content: flex-start;
                padding: 16px;
            }
        }
        
        /* Video Counter */
        .video-counter {

            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            z-index: 5;
        }
    </style>

    <script>
        // Slider functionality
        const slider = document.getElementById('videoSlider');
        const slides = document.querySelectorAll('.video-slide');
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const videoCounter = document.getElementById('videoCounter');
        const shareCountElement = document.getElementById('shareCount');
        
        let currentSlide = 0;
        let shareCount = 0;
        
        function updateCounter() {
            videoCounter.textContent = `${currentSlide + 1}/${slides.length}`;
        }
        
        function goToSlide(n) {
            currentSlide = n;
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Update dots
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
            
            updateCounter();
        }
        
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            goToSlide(currentSlide);
        }
        
        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            goToSlide(currentSlide);
        }
        
        // Event listeners
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);
        
        dots.forEach(dot => {
            dot.addEventListener('click', function() {
                const slideIndex = parseInt(this.getAttribute('data-slide'));
                goToSlide(slideIndex);
            });
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
        });
        
        // Copy link function
        function copyToClipboard() {
            const url = 'https://blog.franklymadear.com/facebook/stories.html';
            navigator.clipboard.writeText(url)
                .then(() => {
                    // Show temporary notification
                    const originalText = event.target.closest('.share-btn').querySelector('.share-btn-text').textContent;
                    event.target.closest('.share-btn').querySelector('.share-btn-text').textContent = 'Αντιγράφηκε!';
                    
                    setTimeout(() => {
                        event.target.closest('.share-btn').querySelector('.share-btn-text').textContent = originalText;
                    }, 2000);
                    
                    incrementShareCount();
                })
                .catch(err => {
                    console.error('Error copying:', err);
                });
        }
        
        // Share count tracking
        function incrementShareCount() {
            shareCount++;
            shareCountElement.textContent = `${shareCount} κοινόποιησ${shareCount === 1 ? 'η' : 'εις'}`;
            
            // Save to localStorage to persist across page reloads
            localStorage.setItem('videoShareCount', shareCount);
        }
        
        // Load share count from localStorage
        window.addEventListener('load', () => {
            const savedCount = localStorage.getItem('videoShareCount');
            if (savedCount) {
                shareCount = parseInt(savedCount);
                shareCountElement.textContent = `${shareCount} κοινόποιησ${shareCount === 1 ? 'η' : 'εις'}`;
            }
            
            // Track clicks on share buttons
            document.querySelectorAll('.share-btn').forEach(btn => {
                if (!btn.classList.contains('link')) { // Don't count copy link clicks here
                    btn.addEventListener('click', incrementShareCount);
                }
            });
            
            // Check URL hash for direct video access
            if (window.location.hash === '#video2') {
                goToSlide(1);
            }
            
            updateCounter();
        });
        
        // Auto-advance every 30 seconds (optional)
        // setInterval(nextSlide, 30000);
    </script>
