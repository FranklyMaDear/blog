        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;

        .container {
            width: 100%;

        }
        
        .slider-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .video-slider {
            display: flex;
            overflow: hidden;
        }
        
        .video-slide {
            min-width: 100%;
            transition: transform 0.4s ease;
        }
        
        .video-wrapper {
            width: 100%;
            background: #000;
            position: relative;
        }
        
        .rumble-player, .rumble-iframe {
            width: 100%;
            height: 500px;
            border: none;
            background: #000;
        }
        
        /* Navigation Arrows */
        .slider-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none;
            padding: 0 10px;
            z-index: 10;
        }
        
        .nav-arrow {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: all 0.2s ease;
        }
        
        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
        
        /* Dots Indicator */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dot.active {
            background: #fff;
            transform: scale(1.2);
        }
        
        /* COMPACT SHARE BUTTONS - ΜΙΚΡΑ ΚΑΙ ΔΙΠΛΑ ΔΙΠΛΑ */
        .share-container {
            background: rgba(25, 25, 25, 0.9);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }
        
        .share-title {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        .share-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        
        .share-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 500;
            min-width: 0;
            flex: 1;
            max-width: 120px;
            justify-content: center;
        }
        
        .share-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        
        /* Χρώματα πλατφορμών */
        .fb { 
            border-color: rgba(24, 119, 242, 0.3);
            color: #8bb9ff;
        }
        
        .tw { 
            border-color: rgba(29, 161, 242, 0.3);
            color: #7bcbff;
        }
        
        .wa { 
            border-color: rgba(37, 211, 102, 0.3);
            color: #8bffb3;
        }
        
        .tg { 
            border-color: rgba(0, 136, 204, 0.3);
            color: #80d4ff;
        }
        
        .link {

            color: #ccc;
        }
        
        .mail {

            color: #ff8b8b;
        }
        
        .icon {
            font-size: 14px;
        }
        
        /* Video Titles */
        .video-title {
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 5;
        }
        
        /* Video Counter */
        .video-counter {

            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;

            font-weight: 500;

        /* Mobile */

            }
        }
        
        @media (max-width: 480px) {

            }

            }
            
            .share-btn {

                max-width: calc(50% - 6px);

            }
        }
        
        @media (max-width: 360px) {
            .share-btn {
                flex: 0 0 100%;
                max-width: 100%;
                margin-bottom: 5px;
            }
        }
    </style>

    <script>
        // Slider functionality
        const slider = document.getElementById('videoSlider');
        const slides = document.querySelectorAll('.video-slide');
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const videoCounter = document.getElementById('videoCounter');
        
        let currentSlide = 0;
        
        function updateCounter() {
            videoCounter.textContent = `${currentSlide + 1}/${slides.length}`;
        }
        
        function goToSlide(n) {
            currentSlide = n;
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Update dots
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
            
            updateCounter();
        }
        
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            goToSlide(currentSlide);
        }
        
        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            goToSlide(currentSlide);
        }
        
        // Event listeners
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);
        
        dots.forEach(dot => {
            dot.addEventListener('click', function() {
                const slideIndex = parseInt(this.getAttribute('data-slide'));
                goToSlide(slideIndex);
            });
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
        });
        
        // Copy link function
        function copyToClipboard() {
            const url = 'https://blog.franklymadear.com/facebook/stories.html';
            navigator.clipboard.writeText(url)
                .then(() => {
                    // Show temporary notification
                    const btn = event.target.closest('.share-btn');
                    const originalText = btn.querySelector('span:not(.icon)').textContent;
                    btn.querySelector('span:not(.icon)').textContent = 'Αντιγράφηκε!';
                    
                    setTimeout(() => {
                        btn.querySelector('span:not(.icon)').textContent = originalText;
                    }, 1500);
                })
                .catch(err => {
                    console.error('Error copying:', err);
                });
        }
        
        // Check URL hash for direct video access
        window.addEventListener('load', () => {
            if (window.location.hash === '#video2') {
                goToSlide(1);
            }
            
            updateCounter();
        });
    </script>
