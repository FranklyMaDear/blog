<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Facebook Meta Tags -->
    <title>Facebook Stories Video</title>
    <meta property="og:title" content="Facebook Stories - Ενδιαφέρον Βίντεο">
    <meta property="og:description" content="Παρακολουθήστε αυτό το μοναδικό βίντεο">
    <meta property="og:image" content="https://blog.franklymadear.com/facebook/thumbnail1.png">
    <meta property="og:url" content="https://blog.franklymadear.com/facebook/stories.html">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://rumble.com/embed/v70uu96/">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Facebook Stories - Ενδιαφέρον Βίντεο">
    <meta name="twitter:description" content="Παρακολουθήστε αυτό το μοναδικό βίντεο">
    <meta name="twitter:image" content="https://blog.franklymadear.com/facebook/thumbnail1.png">
    <meta name="twitter:player" content="https://rumble.com/embed/v70uu96/">
    <meta name="twitter:player:width" content="640">
    <meta name="twitter:player:height" content="360">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .video-player {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        #rumble_v70uu96 {
            width: 100%;
            min-height: 450px;
            background: #111;
        }
        
        .share-container {
            margin-top: 20px;
            text-align: center;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }
        
        .share-container:hover {
            opacity: 1;
        }
        
        .share-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        
        .share-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .share-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .share-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .share-btn.facebook {
            color: #2d88ff;
        }
        
        .share-btn.twitter {
            color: #1d9bf0;
        }
        
        .share-btn .icon {
            font-size: 16px;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .video-player {
                border-radius: 0;
            }
            
            #rumble_v70uu96 {
                min-height: 350px;
            }
            
            .share-buttons {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
            
            .share-btn {
                width: 200px;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            #rumble_v70uu96 {
                min-height: 250px;
            }
            
            body {
                padding: 5px;
            }
        }
        
        /* Loading animation for video */
        .video-loading {
            display: none;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Video Container -->
    <div class="video-player">
        <div class="video-loading" id="loading">
            Φόρτωση βίντεο...
        </div>
        
        <!-- Your Rumble Script -->
        <script>
        !function(r,u,m,b,l,e){
            r._Rumble=b,
            r[b]||(r[b]=function(){
                (r[b]._=r[b]._||[]).push(arguments);
                if(r[b]._.length==1){
                    l=u.createElement(m),
                    e=u.getElementsByTagName(m)[0],
                    l.async=1,
                    l.src="https://rumble.com/embedJS/u4o047w"+(arguments[1].video?'.'+arguments[1].video:'')+"/?url="+encodeURIComponent(location.href)+"&args="+encodeURIComponent(JSON.stringify([].slice.apply(arguments))),
                    e.parentNode.insertBefore(l,e)
                }
            })
        }(window, document, "script", "Rumble");
        </script>

        <div id="rumble_v70uu96"></div>
        
        <script>
            // Show loading indicator
            document.getElementById('loading').style.display = 'block';
            
            // Load video
            Rumble("play", {
                "video":"v70uu96",
                "div":"rumble_v70uu96"
            });
            
            // Hide loading when video is ready
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 2000);
        </script>
    </div>
    
    <!-- Discreet Share Buttons -->
    <div class="share-container">
        <div class="share-text">Κοινοποίηση</div>
        <div class="share-buttons">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://blog.franklymadear.com/facebook/stories.html" 
               target="_blank" 
               class="share-btn facebook"
               onclick="trackShare('facebook')">
               <span class="icon">📘</span>
               <span>Facebook</span>
            </a>
            
            <a href="https://twitter.com/intent/tweet?url=https://blog.franklymadear.com/facebook/stories.html&text=Παρακολουθήστε%20αυτό%20το%20μοναδικό%20βίντεο" 
               target="_blank" 
               class="share-btn twitter"
               onclick="trackShare('twitter')">
               <span class="icon">🐦</span>
               <span>Twitter</span>
            </a>
        </div>
    </div>
    
    <script>
        function trackShare(platform) {
            // Analytics tracking (optional)
            console.log(`Sharing to ${platform}`);
            
            // Minimal notification
            const msg = platform === 'facebook' ? 
                'Ανοίγει το Facebook για κοινή χρήση...' : 
                'Ανοίγει το Twitter για κοινή χράση...';
            
            // Optional: Show a subtle notification
            const notification = document.createElement('div');
            notification.textContent = msg;
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 10px 20px;
                border-radius: 20px;
                font-size: 13px;
                z-index: 1000;
                animation: fadeInOut 3s ease;
            `;
            
            // Add animation styles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInOut {
                    0% { opacity: 0; bottom: 10px; }
                    20% { opacity: 1; bottom: 20px; }
                    80% { opacity: 1; bottom: 20px; }
                    100% { opacity: 0; bottom: 10px; }
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        // Handle thumbnail image
        const metaImage = document.createElement('link');
        metaImage.rel = 'preload';
        metaImage.as = 'image';
        metaImage.href = 'https://blog.franklymadear.com/facebook/thumbnail1.png';
        document.head.appendChild(metaImage);
    </script>
</body>
</html>
