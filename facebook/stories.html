<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Facebook Meta Tags -->
    <title>Βίντεο Αφιέρωμα</title>
    <meta property="og:title" content="Αφιέρωμα στην Ελλάδα">
    <meta property="og:description" content="Ένα μοναδικό βίντεο αφιέρωμα">
    <meta property="og:image" content="https://blog.franklymadear.com/facebook/thumbnail98.png">
    <meta property="og:url" content="https://blog.franklymadear.com/facebook/stories.html">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://rumble.com/embed/v70v7w4/">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Αφιέρωμα στην Ελλάδα">
    <meta name="twitter:description" content="Ένα μοναδικό βίντεο αφιέρωμα">
    <meta name="twitter:image" content="https://blog.franklymadear.com/facebook/thumbnail98.png">
    <meta name="twitter:player" content="https://rumble.com/embed/v70v7w4/">
    <meta name="twitter:player:width" content="640">
    <meta name="twitter:player:height" content="360">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://blog.franklymadear.com/facebook/stories.html">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .video-wrapper {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        #rumble_v70v7w4 {
            width: 100%;
            min-height: 450px;
        }
        
        .share-panel {
            max-width: 800px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .share-title {
            color: #fff;
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .share-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        
        .share-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .share-btn:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }
        
        .fb { border-color: #1877f2; }
        .tw { border-color: #1da1f2; }
        .wa { border-color: #25d366; }
        .tg { border-color: #0088cc; }
        .link { border-color: #666; }
        
        .icon {
            font-size: 18px;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .video-wrapper {
                margin-bottom: 15px;
            }
            
            #rumble_v70v7w4 {
                min-height: 300px;
            }
            
            .share-panel {
                padding: 15px;
            }
            
            .share-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            #rumble_v70v7w4 {
                min-height: 250px;
            }
            
            .share-grid {
                grid-template-columns: 1fr;
            }
            
            .share-btn {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Player -->
    <div class="video-wrapper">
        <!-- Rumble Script -->
        <script>
        !function(r,u,m,b,l,e){
            r._Rumble=b,
            r[b]||(r[b]=function(){
                (r[b]._=r[b]._||[]).push(arguments);
                if(r[b]._.length==1){
                    l=u.createElement(m),
                    e=u.getElementsByTagName(m)[0],
                    l.async=1,
                    l.src="https://rumble.com/embedJS/u4o047w"+(arguments[1].video?'.'+arguments[1].video:'')+"/?url="+encodeURIComponent(location.href)+"&args="+encodeURIComponent(JSON.stringify([].slice.apply(arguments))),
                    e.parentNode.insertBefore(l,e)
                }
            })
        }(window, document, "script", "Rumble");
        </script>

        <div id="rumble_v70v7w4"></div>
        
        <script>
            Rumble("play", {
                "video":"v70v7w4",
                "div":"rumble_v70v7w4"
            });
        </script>
    </div>
    
    <!-- Share Panel -->
    <div class="share-panel">
        <div class="share-title">Κοινοποίηση</div>
        <div class="share-grid">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://blog.franklymadear.com/facebook/stories.html" 
               target="_blank" 
               class="share-btn fb">
               <span class="icon">📘</span>
               <span>Facebook</span>
            </a>
            
            <a href="https://twitter.com/intent/tweet?url=https://blog.franklymadear.com/facebook/stories.html&text=Δείτε%20αυτό%20το%20μοναδικό%20βίντεο%20αφιέρωμα" 
               target="_blank" 
               class="share-btn tw">
               <span class="icon">🐦</span>
               <span>Twitter</span>
            </a>
            
            <a href="https://api.whatsapp.com/send?text=Δείτε%20αυτό%20το%20βίντεο:%20https://blog.franklymadear.com/facebook/stories.html" 
               target="_blank" 
               class="share-btn wa">
               <span class="icon">📱</span>
               <span>WhatsApp</span>
            </a>
            
            <a href="https://t.me/share/url?url=https://blog.franklymadear.com/facebook/stories.html&text=Δείτε%20αυτό%20το%20βίντεο" 
               target="_blank" 
               class="share-btn tg">
               <span class="icon">✈️</span>
               <span>Telegram</span>
            </a>
            
            <a href="#" 
               class="share-btn link"
               onclick="copyToClipboard(); return false;">
               <span class="icon">🔗</span>
               <span>Αντιγραφή</span>
            </a>
        </div>
    </div>

    <script>
        // Copy link function
        function copyToClipboard() {
            const url = 'https://blog.franklymadear.com/facebook/stories.html';
            navigator.clipboard.writeText(url)
                .then(() => {
                    alert('Ο σύνδεσμος αντιγράφηκε!');
                })
                .catch(err => {
                    console.error('Error copying:', err);
                });
        }
        
        // Simple analytics
        document.querySelectorAll('.share-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const platform = this.textContent.trim();
                console.log(`Shared to: ${platform}`);
            });
        });
    </script>
</body>
</html>
