<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Facebook Meta Tags (ΓΙΑ ΤΟ ΠΡΩΤΟ ΒΙΝΤΕΟ) -->
    <title>Βίντεο Αφιέρωμα</title>
    <meta property="og:title" content="Βίντεο Αφιέρωμα">
    <meta property="og:description" content="Δείτε αυτά τα μοναδικά βίντεο">
    <meta property="og:image" content="https://blog.franklymadear.com/facebook/thumbnail99.png">
    <meta property="og:url" content="https://blog.franklymadear.com/facebook/stories.html">
    <meta property="og:type" content="website">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Βίντεο Αφιέρωμα">
    <meta name="twitter:description" content="Δείτε αυτά τα μοναδικά βίντεο">
    <meta name="twitter:image" content="https://blog.franklymadear.com/facebook/thumbnail99.png">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://blog.franklymadear.com/facebook/stories.html">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
        }
        
        .video-slider {
            display: flex;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .video-slide {
            min-width: 100%;
            transition: transform 0.5s ease;
        }
        
        .video-wrapper {
            width: 100%;
            background: #111;
        }
        
        .rumble-player {
            width: 100%;
            min-height: 500px;
        }
        
        /* Navigation Arrows */
        .slider-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none;
            padding: 0 10px;
        }
        
        .nav-arrow {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: all 0.3s;
        }
        
        .nav-arrow:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.1);
        }
        
        /* Dots Indicator */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .dot.active {
            background: #fff;
            transform: scale(1.2);
        }
        
        /* Share Panel */
        .share-panel {
            max-width: 900px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .share-title {
            color: #fff;
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .share-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        
        .share-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .share-btn:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }
        
        .fb { border-color: #1877f2; }
        .tw { border-color: #1da1f2; }
        .wa { border-color: #25d366; }
        .tg { border-color: #0088cc; }
        .link { border-color: #666; }
        
        .icon {
            font-size: 18px;
        }
        
        /* Video Titles */
        .video-title {
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            border-radius: 0 0 12px 12px;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .rumble-player {
                min-height: 350px;
            }
            
            .nav-arrow {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .share-panel {
                padding: 15px;
            }
            
            .share-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .rumble-player {
                min-height: 250px;
            }
            
            .nav-arrow {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
            
            .share-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Video Slider -->
    <div class="slider-container">
        <div class="video-slider" id="videoSlider">
            <!-- Βίντεο 1 -->
            <div class="video-slide">
                <div class="video-wrapper">
                    <div id="rumble_v70uu96" class="rumble-player"></div>
                    <div class="video-title">Βίντεο 1</div>
                </div>
            </div>
            
            <!-- Βίντεο 2 -->
            <div class="video-slide">
                <div class="video-wrapper">
                    <div id="rumble_v70v7w4" class="rumble-player"></div>
                    <div class="video-title">Βίντεο 2</div>
                </div>
            </div>
        </div>
        
        <!-- Navigation Arrows -->
        <div class="slider-nav">
            <button class="nav-arrow" id="prevBtn">❮</button>
            <button class="nav-arrow" id="nextBtn">❯</button>
        </div>
        
        <!-- Dots Indicator -->
        <div class="slider-dots" id="dotsContainer">
            <div class="dot active" data-slide="0"></div>
            <div class="dot" data-slide="1"></div>
        </div>
    </div>
    
    <!-- Share Panel -->
    <div class="share-panel">
        <div class="share-title">Κοινοποίηση</div>
        <div class="share-grid">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://blog.franklymadear.com/facebook/stories.html" 
               target="_blank" 
               class="share-btn fb">
               <span class="icon">📘</span>
               <span>Facebook</span>
            </a>
            
            <a href="https://twitter.com/intent/tweet?url=https://blog.franklymadear.com/facebook/stories.html&text=Δείτε%20αυτά%20τα%20μοναδικά%20βίντεο" 
               target="_blank" 
               class="share-btn tw">
               <span class="icon">🐦</span>
               <span>Twitter</span>
            </a>
            
            <a href="https://api.whatsapp.com/send?text=Δείτε%20αυτά%20τα%20βίντεο:%20https://blog.franklymadear.com/facebook/stories.html" 
               target="_blank" 
               class="share-btn wa">
               <span class="icon">📱</span>
               <span>WhatsApp</span>
            </a>
            
            <a href="https://t.me/share/url?url=https://blog.franklymadear.com/facebook/stories.html&text=Δείτε%20αυτά%20τα%20βίντεο" 
               target="_blank" 
               class="share-btn tg">
               <span class="icon">✈️</span>
               <span>Telegram</span>
            </a>
            
            <a href="#" 
               class="share-btn link"
               onclick="copyToClipboard(); return false;">
               <span class="icon">🔗</span>
               <span>Αντιγραφή</span>
            </a>
        </div>
    </div>

    <!-- Rumble Script -->
    <script>
        !function(r,u,m,b,l,e){
            r._Rumble=b,
            r[b]||(r[b]=function(){
                (r[b]._=r[b]._||[]).push(arguments);
                if(r[b]._.length==1){
                    l=u.createElement(m),
                    e=u.getElementsByTagName(m)[0],
                    l.async=1,
                    l.src="https://rumble.com/embedJS/u4o047w"+(arguments[1].video?'.'+arguments[1].video:'')+"/?url="+encodeURIComponent(location.href)+"&args="+encodeURIComponent(JSON.stringify([].slice.apply(arguments))),
                    e.parentNode.insertBefore(l,e)
                }
            })
        }(window, document, "script", "Rumble");
    </script>

    <script>
        // Initialize both videos
        Rumble("play", {
            "video":"v70uu96",
            "div":"rumble_v70uu96"
        });
        
        Rumble("play", {
            "video":"v70v7w4",
            "div":"rumble_v70v7w4"
        });
        
        // Slider functionality
        const slider = document.getElementById('videoSlider');
        const slides = document.querySelectorAll('.video-slide');
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        let currentSlide = 0;
        
        function goToSlide(n) {
            currentSlide = n;
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Update dots
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }
        
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            goToSlide(currentSlide);
        }
        
        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            goToSlide(currentSlide);
        }
        
        // Event listeners
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);
        
        dots.forEach(dot => {
            dot.addEventListener('click', function() {
                const slideIndex = parseInt(this.getAttribute('data-slide'));
                goToSlide(slideIndex);
            });
        });
        
        // Copy link function
        function copyToClipboard() {
            const url = 'https://blog.franklymadear.com/facebook/stories.html';
            navigator.clipboard.writeText(url)
                .then(() => {
                    alert('Ο σύνδεσμος αντιγράφηκε!');
                })
                .catch(err => {
                    console.error('Error copying:', err);
                });
        }
        
        // Simple analytics
        document.querySelectorAll('.share-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const platform = this.textContent.trim();
                console.log(`Shared to: ${platform}`);
            });
        });
        
        // Auto-play next video when current ends (optional)
        // You would need Rumble API events for this
    </script>
</body>
</html>
