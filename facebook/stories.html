<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Facebook Meta Tags -->
    <title>Facebook Stories Video</title>
    <meta property="og:title" content="Facebook Stories - Ενδιαφέρον Βίντεο">
    <meta property="og:description" content="Παρακολουθήστε αυτό το μοναδικό βίντεο">
    <meta property="og:image" content="https://blog.franklymadear.com/facebook/thumbnail99.png">
    <meta property="og:url" content="https://blog.franklymadear.com/facebook/stories.html">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://rumble.com/embed/v70uu96/">
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Facebook Stories - Ενδιαφέρον Βίντεο">
    <meta name="twitter:description" content="Παρακολουθήστε αυτό το μοναδικό βίντεο">
    <meta name="twitter:image" content="https://blog.franklymadear.com/facebook/thumbnail99.png">
    <meta name="twitter:player" content="https://rumble.com/embed/v70uu96/">
    <meta name="twitter:player:width" content="640">
    <meta name="twitter:player:height" content="360">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://blog.franklymadear.com/facebook/stories.html">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .video-player {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #111;
        }
        
        #rumble_v70uu96 {
            width: 100%;
            min-height: 500px;
        }
        
        .share-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .share-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            margin-bottom: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        
        .share-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .share-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            min-width: 130px;
            justify-content: center;
        }
        
        .share-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        
        .share-btn.fb {
            border-color: rgba(59, 89, 152, 0.3);
            color: #8bb9ff;
        }
        
        .share-btn.tw {
            border-color: rgba(29, 161, 242, 0.3);
            color: #7bcbff;
        }
        
        .icon {
            font-size: 16px;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            #rumble_v70uu96 {
                min-height: 300px;
            }
            
            .share-container {
                padding: 12px;
            }
            
            .share-buttons {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
            
            .share-btn {
                width: 180px;
            }
        }
        
        /* Small screens */
        @media (max-width: 480px) {
            #rumble_v70uu96 {
                min-height: 250px;
            }
            
            .share-title {
                font-size: 14px;
            }
            
            .share-btn {
                font-size: 13px;
                padding: 9px 15px;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Container -->
    <div class="video-player">
        <!-- Rumble Script -->
        <script>
        !function(r,u,m,b,l,e){
            r._Rumble=b,
            r[b]||(r[b]=function(){
                (r[b]._=r[b]._||[]).push(arguments);
                if(r[b]._.length==1){
                    l=u.createElement(m),
                    e=u.getElementsByTagName(m)[0],
                    l.async=1,
                    l.src="https://rumble.com/embedJS/u4o047w"+(arguments[1].video?'.'+arguments[1].video:'')+"/?url="+encodeURIComponent(location.href)+"&args="+encodeURIComponent(JSON.stringify([].slice.apply(arguments))),
                    e.parentNode.insertBefore(l,e)
                }
            })
        }(window, document, "script", "Rumble");
        </script>

        <div id="rumble_v70uu96"></div>
        
        <script>
            Rumble("play", {
                "video":"v70uu96",
                "div":"rumble_v70uu96"
            });
        </script>
    </div>
    
    <!-- Share Buttons - Compact -->
    <div class="share-container">
        <div class="share-title">Κοινοποίηση</div>
        <div class="share-buttons">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://blog.franklymadear.com/facebook/stories.html" 
               target="_blank" 
               class="share-btn fb">
               <span class="icon">📘</span>
               <span>Facebook</span>
            </a>
            
            <a href="https://twitter.com/intent/tweet?url=https://blog.franklymadear.com/facebook/stories.html&text=Παρακολουθήστε%20αυτό%20το%20μοναδικό%20βίντεο" 
               target="_blank" 
               class="share-btn tw">
               <span class="icon">🐦</span>
               <span>Twitter</span>
            </a>
        </div>
    </div>

    <script>
        // Simple tracking
        document.querySelectorAll('.share-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const platform = this.classList.contains('fb') ? 'Facebook' : 'Twitter';
                console.log(`Sharing to ${platform}`);
            });
        });
    </script>
</body>
</html>
