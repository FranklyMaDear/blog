<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Favicon για όλους τους browsers και συσκευές -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <link rel="shortcut icon" href="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <link rel="manifest" href="https://blog.franklymadear.com/facebook/stories/manifest.json">
  
  <!-- Mobile Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FranklyMaDear Videos">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-TileImage" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  
  <title>FranklyMaDear Videos</title>
  
  <!-- Open Graph Meta Tags - COMPLETE FIX -->
  <meta property="og:title" content="Rumble Video 1 - Awesome Moments">
  <meta property="og:description" content="Watch amazing videos from Rumble on FranklyMaDear">
  <meta property="og:image" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta property="og:image:url" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta property="og:image:secure_url" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Franklymadear Video Thumbnail">
  <meta property="og:url" content="https://blog.franklymadear.com/facebook/stories1.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FranklyMaDear">
  <meta property="og:locale" content="en_US">
  <meta property="fb:app_id" content="123456789">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@franklymadear">
  <meta name="twitter:creator" content="@franklymadear">
  <meta name="twitter:title" content="Rumble Video 1 - Awesome Moments">
  <meta name="twitter:description" content="Watch amazing videos from Rumble on FranklyMaDear">
  <meta name="twitter:image" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta name="twitter:image:alt" content="Franklymadear Video">
  
  <!-- Additional Meta Tags -->
  <meta name="description" content="Watch amazing videos from Rumble on FranklyMaDear">
  <meta name="keywords" content="rumble, videos, funny, awesome, moments, franklymadear">
  <meta name="author" content="FranklyMaDear">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    /* Home Screen Splash Screen */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      margin-bottom: 20px;
      background-image: url('https://blog.franklymadear.com/facebook/stories/thumbnail1.png');
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .splash-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      color: white;
    }
    
    .splash-subtitle {
      font-size: 14px;
      opacity: 0.8;
      color: #ccc;
    }
    
    .splash-loading {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #3498db;
      margin-top: 30px;
      animation: spin 1s linear infinite;
    }

    .video-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    .rumble-iframe {
      width: 90%;
      height: 90%;
      max-width: 1200px;
      max-height: 675px;
      border: none;
      border-radius: 10px;
      z-index: 3;
      position: relative;
      background: #000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .iframe-wrapper.active {
      display: flex;
    }

    .next-video-btn, .prev-video-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 60;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.8;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .next-video-btn:hover, .prev-video-btn:hover,
    .next-video-btn:active, .prev-video-btn:active {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.1);
      opacity: 1;
    }

    .next-video-btn {
      right: 20px;
    }

    .next-video-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 14px solid white;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      margin-left: 3px;
    }

    .prev-video-btn {
      left: 20px;
    }

    .prev-video-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-right: 14px solid white;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      margin-right: 3px;
    }

    .video-counter {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      z-index: 100;
      padding: 8px 12px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 0 0 20px 20px;
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #3498db;
      animation: spin 1s ease-in-out infinite;
      z-index: 10;
    }
    
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Mobile Home Screen Styles */
    @media (display-mode: standalone) {
      body {
        -webkit-overflow-scrolling: touch;
      }
      
      .video-counter {
        top: env(safe-area-inset-top, 20px);
      }
    }

    @media (max-width: 768px) {
      .rumble-iframe {
        width: 96%;
        height: 70%;
        max-height: 500px;
      }
      
      .next-video-btn, .prev-video-btn {
        width: 48px;
        height: 48px;
        right: 10px;
        left: 10px;
      }
      
      .next-video-btn::after {
        border-left-width: 12px;
        border-top-width: 8px;
        border-bottom-width: 8px;
      }
      
      .prev-video-btn::after {
        border-right-width: 12px;
        border-top-width: 8px;
        border-bottom-width: 8px;
      }
      
      .video-counter {
        font-size: 13px;
        top: env(safe-area-inset-top, 15px);
        padding: 6px 10px;
      }
      
      .splash-logo {
        width: 100px;
        height: 100px;
      }
      
      .splash-title {
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .rumble-iframe {
        height: 60%;
        max-height: 400px;
        border-radius: 8px;
      }
      
      .next-video-btn, .prev-video-btn {
        width: 44px;
        height: 44px;
      }
      
      .video-counter {
        font-size: 12px;
        padding: 5px 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Splash Screen για Home Screen -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo"></div>
    <div class="splash-title">FranklyMaDear</div>
    <div class="splash-subtitle">Loading videos...</div>
    <div class="splash-loading"></div>
  </div>

  <div class="video-container" id="videoContainer">
    <div class="loading-spinner" id="loadingSpinner"></div>
    
    <div class="iframe-wrapper active" id="iframeWrapper1">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu96/?pub=4o047w"
              frameborder="0" 
              allowfullscreen
              allow="autoplay; encrypted-media"
              title="Franklymadear Video 1 - Awesome Moments">
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper2">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu97/?pub=4o047w"
              frameborder="0" 
              allowfullscreen
              allow="autoplay; encrypted-media"
              title="Rumble Video 2 - Funny Clips">
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper3">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu98/?pub=4o047w"
              frameborder="0" 
              allowfullscreen
              allow="autoplay; encrypted-media"
              title="Rumble Video 3 - Amazing Scenes">
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper4">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu99/?pub=4o047w"
              frameborder="0" 
              allowfullscreen
              allow="autoplay; encrypted-media"
              title="Rumble Video 4 - Epic Moments">
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper5">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu9a/?pub=4o047w"
              frameborder="0" 
              allowfullscreen
              allow="autoplay; encrypted-media"
              title="Rumble Video 5 - Funny Fails">
      </iframe>
    </div>

    <button class="prev-video-btn" id="prevVideoBtn" title="Previous video" aria-label="Previous video"></button>
    <button class="next-video-btn" id="nextVideoBtn" title="Next video" aria-label="Next video"></button>
    <div class="video-counter" id="videoCounter">1 / 5</div>
  </div> 

  <script>
    // Video data with thumbnails
    const videoData = [
      {
        id: 1,
        title: "Franklymadear Video 1 - Awesome Moments",
        url: "https://rumble.com/embed/v70uu96/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail1.png"
      },
      {
        id: 2,
        title: "Rumble Video 2 - Funny Clips",
        url: "https://rumble.com/embed/v70uu97/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail2.png"
      },
      {
        id: 3,
        title: "Rumble Video 3 - Amazing Scenes",
        url: "https://rumble.com/embed/v70uu98/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail3.png"
      },
      {
        id: 4,
        title: "Rumble Video 4 - Epic Moments",
        url: "https://rumble.com/embed/v70uu99/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail4.png"
      },
      {
        id: 5,
        title: "Rumble Video 5 - Funny Fails",
        url: "https://rumble.com/embed/v70uu9a/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail5.png"
      }
    ];

    // DOM Elements
    const splashScreen = document.getElementById('splashScreen');
    const nextVideoBtn = document.getElementById('nextVideoBtn');
    const prevVideoBtn = document.getElementById('prevVideoBtn');
    const videoCounter = document.getElementById('videoCounter');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const videoContainer = document.getElementById('videoContainer');

    let currentVideoIndex = 0;
    const totalVideos = videoData.length;

    // Function to update meta tags
    function updateMetaTags(videoIndex) {
      const video = videoData[videoIndex];
      
      // Update all meta tags
      const metaTags = [
        { property: 'og:title', content: video.title },
        { property: 'og:description', content: `Watch: ${video.title}` },
        { property: 'og:image', content: video.thumbnail },
        { property: 'og:url', content: `${window.location.origin}${window.location.pathname}?video=${video.id}` },
        { name: 'twitter:title', content: video.title },
        { name: 'twitter:description', content: `Watch: ${video.title}` },
        { name: 'twitter:image', content: video.thumbnail }
      ];
      
      metaTags.forEach(tag => {
        const element = document.querySelector(
          tag.property ? `meta[property="${tag.property}"]` : `meta[name="${tag.name}"]`
        );
        if (element) {
          element.setAttribute('content', tag.content);
        }
      });
      
      // Update page title
      document.title = `${video.title} - FranklyMaDear`;
    }

    function init() {
      // Hide splash screen after delay
      setTimeout(() => {
        splashScreen.style.opacity = '0';
        setTimeout(() => {
          splashScreen.style.display = 'none';
          videoContainer.style.opacity = '1';
        }, 500);
      }, 1500);
      
      // Get video from URL
      const urlParams = new URLSearchParams(window.location.search);
      const videoParam = urlParams.get('video');
      
      if (videoParam) {
        const index = parseInt(videoParam) - 1;
        if (index >= 0 && index < totalVideos) {
          currentVideoIndex = index;
        }
      }
      
      showVideo(currentVideoIndex);
      updateNavigationButtons();
      updateVideoCounter();
      updateMetaTags(currentVideoIndex);
      
      // Hide loading spinner
      setTimeout(() => {
        loadingSpinner.style.display = 'none';
      }, 1000);
      
      // Add to Home Screen prompt (optional)
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          // You can show an install button here
        });
      }
    }

    function updateURL() {
      const newURL = `${window.location.pathname}?video=${currentVideoIndex + 1}`;
      window.history.replaceState({}, '', newURL);
    }

    function showVideo(index) {
      // Hide all iframes
      for (let i = 1; i <= totalVideos; i++) {
        const wrapper = document.getElementById(`iframeWrapper${i}`);
        if (wrapper) {
          wrapper.classList.remove('active');
        }
      }
      
      loadingSpinner.style.display = 'block';
      
      setTimeout(() => {
        const selectedWrapper = document.getElementById(`iframeWrapper${index + 1}`);
        if (selectedWrapper) {
          selectedWrapper.classList.add('active');
        }
        loadingSpinner.style.display = 'none';
      }, 300);
      
      updateURL();
      updateVideoCounter();
      updateNavigationButtons();
      updateMetaTags(index);
    }

    function updateVideoCounter() {
      videoCounter.textContent = `${currentVideoIndex + 1} / ${totalVideos}`;
    }

    function updateNavigationButtons() {
      prevVideoBtn.style.display = currentVideoIndex > 0 ? 'flex' : 'none';
      nextVideoBtn.style.display = currentVideoIndex < totalVideos - 1 ? 'flex' : 'none';
    }

    function nextVideo() {
      if (currentVideoIndex < totalVideos - 1) {
        currentVideoIndex++;
        showVideo(currentVideoIndex);
      }
    }

    function prevVideo() {
      if (currentVideoIndex > 0) {
        currentVideoIndex--;
        showVideo(currentVideoIndex);
      }
    }

    // Event listeners
    nextVideoBtn.addEventListener('click', nextVideo);
    prevVideoBtn.addEventListener('click', prevVideo);

    // Touch/swipe for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    
    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const swipeThreshold = 50;
      
      if (touchEndX < touchStartX - swipeThreshold) {
        nextVideo();
      }
      
      if (touchEndX > touchStartX + swipeThreshold) {
        prevVideo();
      }
    }, false);

    // Keyboard shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowRight' || event.key === ' ') {
        nextVideo();
      } else if (event.key === 'ArrowLeft') {
        prevVideo();
      }
    });

    // Initialize
    window.addEventListener('load', init);
    
    // For Home Screen apps
    if (window.matchMedia('(display-mode: standalone)').matches) {
      document.body.classList.add('standalone');
    }
  </script>
</body>
</html>
