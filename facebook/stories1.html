<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FranklyMaDear - Rumble Videos</title>
  
  <!-- Open Graph Meta Tags - FIXED -->
  <meta property="og:title" content="Rumble Video 1 - Awesome Moments">
  <meta property="og:description" content="Watch amazing videos from Rumble">
  <meta property="og:image" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta property="og:image:url" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta property="og:image:secure_url" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Rumble Video Thumbnail">
  <meta property="og:url" content="https://blog.franklymadear.com/facebook/stories1.html">
  <meta property="og:type" content="video.other">
  <meta property="og:video" content="https://rumble.com/embed/v70uu96/?pub=4o047w">
  <meta property="og:video:url" content="https://rumble.com/embed/v70uu96/?pub=4o047w">
  <meta property="og:video:secure_url" content="https://rumble.com/embed/v70uu96/?pub=4o047w">
  <meta property="og:video:type" content="text/html">
  <meta property="og:video:width" content="640">
  <meta property="og:video:height" content="360">
  <meta property="fb:app_id" content="123456789"> <!-- Προσθέστε το δικό σας app_id αν έχετε -->
  
  <!-- Twitter Card Meta Tags - FIXED -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@franklymadear">
  <meta name="twitter:creator" content="@franklymadear">
  <meta name="twitter:title" content="Rumble Video 1 - Awesome Moments">
  <meta name="twitter:description" content="Watch amazing videos from Rumble">
  <meta name="twitter:image" content="https://blog.franklymadear.com/facebook/stories/thumbnail1.png">
  <meta name="twitter:image:alt" content="Rumble Video Thumbnail">
  <meta name="twitter:player" content="https://rumble.com/embed/v70uu96/?pub=4o047w">
  <meta name="twitter:player:width" content="640">
  <meta name="twitter:player:height" content="360">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .video-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rumble-iframe {
      width: 90%;
      height: 90%;
      max-width: 1200px;
      max-height: 675px;
      border: none;
      border-radius: 10px;
      z-index: 3;
      position: relative;
      background: #000;
    }
    
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .iframe-wrapper.active {
      display: flex;
    }

    .next-video-btn, .prev-video-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 60;
      transition: all 0.3s ease;
      opacity: 0.7;
    }

    .next-video-btn:hover, .prev-video-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.1);
      opacity: 1;
    }

    .next-video-btn {
      right: 20px;
    }

    .next-video-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 12px solid white;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      margin-left: 2px;
    }

    .prev-video-btn {
      left: 20px;
    }

    .prev-video-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-right: 12px solid white;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      margin-right: 2px;
    }

    .video-counter {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      z-index: 100;
      padding: 5px;
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #3498db;
      animation: spin 1s ease-in-out infinite;
      z-index: 10;
    }
    
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (max-width: 768px) {
      .rumble-iframe {
        width: 100%;
        height: 70%;
        max-height: 500px;
      }
      
      .next-video-btn, .prev-video-btn {
        width: 40px;
        height: 40px;
        right: 10px;
      }
      
      .next-video-btn::after {
        border-left-width: 10px;
        border-top-width: 6px;
        border-bottom-width: 6px;
      }
      
      .prev-video-btn::after {
        border-right-width: 10px;
        border-top-width: 6px;
        border-bottom-width: 6px;
      }
      
      .video-counter {
        font-size: 12px;
        top: 15px;
      }
    }

    @media (max-width: 480px) {
      .rumble-iframe {
        height: 60%;
        max-height: 400px;
      }
      
      .next-video-btn, .prev-video-btn {
        width: 35px;
        height: 35px;
      }
    }
  </style>
</head>
<body>

  <div class="video-container" id="videoContainer">
    <div class="loading-spinner" id="loadingSpinner"></div>
    
    <div class="iframe-wrapper active" id="iframeWrapper1">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu96/?pub=4o047w"
              frameborder="0" 
              allowfullscreen>
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper2">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu97/?pub=4o047w"
              frameborder="0" 
              allowfullscreen>
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper3">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu98/?pub=4o047w"
              frameborder="0" 
              allowfullscreen>
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper4">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu99/?pub=4o047w"
              frameborder="0" 
              allowfullscreen>
      </iframe>
    </div>
    
    <div class="iframe-wrapper" id="iframeWrapper5">
      <iframe class="rumble-iframe" 
              src="https://rumble.com/embed/v70uu9a/?pub=4o047w"
              frameborder="0" 
              allowfullscreen>
      </iframe>
    </div>

    <button class="prev-video-btn" id="prevVideoBtn" title="Previous video"></button>
    <button class="next-video-btn" id="nextVideoBtn" title="Next video"></button>
    <div class="video-counter" id="videoCounter">1 / 5</div>
  </div> 

  <script>
    // Video data with thumbnails
    const videoData = [
      {
        id: 1,
        title: "Rumble Video 1 - Awesome Moments",
        url: "https://rumble.com/embed/v70uu96/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail1.png"
      },
      {
        id: 2,
        title: "Rumble Video 2 - Funny Clips",
        url: "https://rumble.com/embed/v70uu97/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail2.png"
      },
      {
        id: 3,
        title: "Rumble Video 3 - Amazing Scenes",
        url: "https://rumble.com/embed/v70uu98/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail3.png"
      },
      {
        id: 4,
        title: "Rumble Video 4 - Epic Moments",
        url: "https://rumble.com/embed/v70uu99/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail4.png"
      },
      {
        id: 5,
        title: "Rumble Video 5 - Funny Fails",
        url: "https://rumble.com/embed/v70uu9a/?pub=4o047w",
        thumbnail: "https://blog.franklymadear.com/facebook/stories/thumbnail5.png"
      }
    ];

    // DOM Elements
    const nextVideoBtn = document.getElementById('nextVideoBtn');
    const prevVideoBtn = document.getElementById('prevVideoBtn');
    const videoCounter = document.getElementById('videoCounter');
    const loadingSpinner = document.getElementById('loadingSpinner');

    let currentVideoIndex = 0;
    const totalVideos = videoData.length;

    // Function to update meta tags
    function updateMetaTags(videoIndex) {
      const video = videoData[videoIndex];
      
      // Update meta tags in head
      document.querySelector('meta[property="og:title"]').setAttribute('content', video.title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', `Watch: ${video.title}`);
      document.querySelector('meta[property="og:image"]').setAttribute('content', video.thumbnail);
      document.querySelector('meta[property="og:url"]').setAttribute('content', `${window.location.origin}${window.location.pathname}?video=${video.id}`);
      document.querySelector('meta[property="og:video"]').setAttribute('content', video.url);
      document.querySelector('meta[property="og:video:url"]').setAttribute('content', video.url);
      
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', video.title);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', `Watch: ${video.title}`);
      document.querySelector('meta[name="twitter:image"]').setAttribute('content', video.thumbnail);
      document.querySelector('meta[name="twitter:player"]').setAttribute('content', video.url);
      
      // Also update page title
      document.title = video.title + " - FranklyMaDear";
    }

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const videoParam = urlParams.get('video');
      
      if (videoParam) {
        const index = parseInt(videoParam) - 1;
        if (index >= 0 && index < totalVideos) {
          currentVideoIndex = index;
        }
      }
      
      showVideo(currentVideoIndex);
      updateNavigationButtons();
      updateVideoCounter();
      updateMetaTags(currentVideoIndex);
      
      setTimeout(() => {
        loadingSpinner.style.display = 'none';
      }, 1000);
    }

    function updateURL() {
      const newURL = `${window.location.pathname}?video=${currentVideoIndex + 1}`;
      window.history.replaceState({}, '', newURL);
    }

    function showVideo(index) {
      for (let i = 1; i <= totalVideos; i++) {
        const wrapper = document.getElementById(`iframeWrapper${i}`);
        if (wrapper) {
          wrapper.classList.remove('active');
        }
      }
      
      loadingSpinner.style.display = 'block';
      
      setTimeout(() => {
        const selectedWrapper = document.getElementById(`iframeWrapper${index + 1}`);
        if (selectedWrapper) {
          selectedWrapper.classList.add('active');
        }
        loadingSpinner.style.display = 'none';
      }, 300);
      
      updateURL();
      updateVideoCounter();
      updateNavigationButtons();
      updateMetaTags(index);
    }

    function updateVideoCounter() {
      videoCounter.textContent = `${currentVideoIndex + 1} / ${totalVideos}`;
    }

    function updateNavigationButtons() {
      prevVideoBtn.style.display = currentVideoIndex > 0 ? 'flex' : 'none';
      nextVideoBtn.style.display = currentVideoIndex < totalVideos - 1 ? 'flex' : 'none';
    }

    function nextVideo() {
      if (currentVideoIndex < totalVideos - 1) {
        currentVideoIndex++;
        showVideo(currentVideoIndex);
      }
    }

    function prevVideo() {
      if (currentVideoIndex > 0) {
        currentVideoIndex--;
        showVideo(currentVideoIndex);
      }
    }

    nextVideoBtn.addEventListener('click', nextVideo);
    prevVideoBtn.addEventListener('click', prevVideo);

    let touchStartX = 0;
    let touchEndX = 0;
    
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    
    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const swipeThreshold = 50;
      
      if (touchEndX < touchStartX - swipeThreshold) {
        nextVideo();
      }
      
      if (touchEndX > touchStartX + swipeThreshold) {
        prevVideo();
      }
    }, false);

    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowRight') {
        nextVideo();
      } else if (event.key === 'ArrowLeft') {
        prevVideo();
      }
    });

    window.addEventListener('load', init);
  </script>
</body>
</html>
