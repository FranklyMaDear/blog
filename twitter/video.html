<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FranklyMaDear🎬</title>
    <link rel="icon" type="image/png" href="index.png">
    <link rel="apple-touch-icon" href="index.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="✨FranklyMaDear🎬">
    <meta property="og:description" content="Watch this amazing video from FranklyMaDear">
    <meta property="og:image" content="https://blog.franklymadear.com/twitter/video-thumbnail.jpg">
    <meta property="og:image:width" content="1080">
    <meta property="og:image:height" content="1920">
    <meta property="og:url" content="https://blog.franklymadear.com/twitter/video.html">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://blog.franklymadear.com/twitter/video1.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="1080">
    <meta property="og:video:height" content="1920">
    <meta property="og:site_name" content="FranklyMaDear">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@zamanfoutista">
    <meta name="twitter:creator" content="@zamanfoutista">
    <meta name="twitter:title" content="✨FranklyMaDear🎬">
    <meta name="twitter:description" content="Watch this amazing video from FranklyMaDear">
    <meta name="twitter:image" content="https://blog.franklymadear.com/twitter/video-thumbnail.jpg">
    <meta name="twitter:player" content="https://blog.franklymadear.com/twitter/video-embed.html">
    <meta name="twitter:player:width" content="720">
    <meta name="twitter:player:height" content="1280">
    <meta name="twitter:player:stream" content="https://blog.franklymadear.com/twitter/video1.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #000;
            color: white;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .reel-container {
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: #000;
        }

        .video-reel {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .video-player {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .video-player video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .logo h1 {
            font-family: 'Comic Neue', cursive;
            font-size: 2rem;
        }

        .animated-emoji {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .video-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-bottom: 100px;
        }

        .play-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .play-button:hover {
            transform: scale(1.1);
            background: white;
        }

        .play-icon {
            font-size: 3rem;
            margin-left: 8px;
        }

        .social-sharing {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 30px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .btn-twitter {
            background: #1DA1F2;
            color: white;
        }

        .btn-twitter:hover {
            background: #0d8bd9;
            transform: translateY(-2px);
        }

        .btn-facebook {
            background: #1877F2;
            color: white;
        }

        .btn-facebook:hover {
            background: #1666d9;
            transform: translateY(-2px);
        }

        .btn-share {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .btn-share:hover {
            background: white;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            padding: 1rem 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            position: absolute;
            bottom: 20px;
            width: 100%;
        }

        .copy-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copy-notification.show {
            opacity: 1;
        }

        .video-started .play-button {
            opacity: 0;
            pointer-events: none;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .reel-container {
                max-width: 100%;
            }
            
            .video-overlay {
                padding: 20px;
            }
            
            .logo h1 {
                font-size: 1.5rem;
            }
            
            .play-button {
                width: 100px;
                height: 100px;
            }
            
            .play-icon {
                font-size: 2.5rem;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .logo h1 {
                font-size: 1.2rem;
            }
            
            .play-button {
                width: 80px;
                height: 80px;
            }
            
            .play-icon {
                font-size: 2rem;
            }
            
            .social-sharing {
                gap: 15px;
            }
            
            .btn {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="reel-container">
        <div class="video-reel">
            <div class="video-player">
                <video id="mainVideo" poster="video-thumbnail.jpg" style="width:100%">
                    <source src="video1.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-overlay">
                    <div class="video-header">
                        <div class="logo">
                            <h1>✨FranklyMaDear🎬</h1>
                            <div class="animated-emoji">🔥</div>
                        </div>
                    </div>
                    
                    <div class="video-controls">
                        <button class="play-button" id="playButton">
                            <span class="play-icon">▶️</span>
                        </button>
                        
                        <div class="social-sharing">
                            <button class="btn btn-share" onclick="copyVideoLink()">
                                <span>📋</span> Copy Link
                            </button>
                            <button class="btn btn-twitter" onclick="shareOnTwitter()">
                                <span>🐦</span> Twitter
                            </button>
                            <button class="btn btn-facebook" onclick="shareOnFacebook()">
                                <span>📘</span> Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Made with ❤️ by FranklyMaDear</p>
        </footer>
    </div>

    <div id="copyNotification" class="copy-notification">
        ✅ Link copied!
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const playButton = document.getElementById('playButton');
        const videoContainer = document.querySelector('.video-reel');

        // Play video when button is clicked
        playButton.addEventListener('click', function() {
            video.play();
            videoContainer.classList.add('video-started');
            playButton.style.display = 'none';
        });

        // Auto-play when page loads
        document.addEventListener('DOMContentLoaded', function() {
            video.play().then(() => {
                videoContainer.classList.add('video-started');
                playButton.style.display = 'none';
            }).catch(error => {
                playButton.style.display = 'flex';
            });
        });

        // Social media sharing functions
        function shareOnTwitter() {
            const text = encodeURIComponent("Check out this amazing video from FranklyMaDear! 🎬✨");
            const url = encodeURIComponent("https://blog.franklymadear.com/twitter/video.html");
            const twitterUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            window.open(twitterUrl, '_blank', 'width=600,height=400');
        }

        function shareOnFacebook() {
            const url = encodeURIComponent("https://blog.franklymadear.com/twitter/video.html");
            const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
            window.open(facebookUrl, '_blank', 'width=600,height=400');
        }

        function copyVideoLink() {
            const videoLink = "https://blog.franklymadear.com/twitter/video.html";
            
            navigator.clipboard.writeText(videoLink).then(function() {
                showCopyNotification();
            }).catch(function(err) {
                const textArea = document.createElement('textarea');
                textArea.value = videoLink;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showCopyNotification();
            });
        }

        function showCopyNotification() {
            const notification = document.getElementById('copyNotification');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // Handle video end
        video.addEventListener('ended', function() {
            videoContainer.classList.remove('video-started');
            playButton.style.display = 'flex';
        });

        // Handle video pause
        video.addEventListener('pause', function() {
            if (!video.ended) {
                playButton.style.display = 'flex';
            }
        });

        // Handle video play
        video.addEventListener('play', function() {
            playButton.style.display = 'none';
        });
    </script>
</body>
</html>
