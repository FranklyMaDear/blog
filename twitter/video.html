<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨FMD🎬 - Video</title>
    <link rel="icon" type="image/png" href="index.png">
    <link rel="apple-touch-icon" href="index.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tagline {
            color: #888;
            font-size: 1.1rem;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .video-card {
            background: #111;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .video-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .video-description {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Video Player Modal */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 100%;
            max-width: 720px;
            position: relative;
        }

        .modal-video {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .modal-play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
        }

        .modal-play-btn:hover {
            transform: scale(1.1);
            background: white;
        }

        .play-icon {
            font-size: 2rem;
            margin-left: 5px;
        }

        .modal-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            pointer-events: all;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-twitter {
            background: #1DA1F2;
            color: white;
        }

        .btn-share {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        /* Loading */
        .loading {
            text-align: center;
            color: #888;
            padding: 40px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .video-grid {
                grid-template-columns: 1fr;
            }
            
            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">✨FMD🎬</div>
            <div class="tagline">Video </div>
        </div>

        <div class="video-grid" id="videoGrid">
            <!-- Videos will be loaded here dynamically -->
            <div class="loading">Loading videos...</div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="video-modal" id="videoModal">
        <div class="modal-content">
            <video class="modal-video" id="modalVideo" controls>
                Your browser does not support the video tag.
            </video>
            <div class="modal-overlay">
                <div class="modal-header">
                    <div class="modal-title" id="modalTitle">Video Title</div>
                    <button class="close-btn" id="closeModal">×</button>
                </div>
                <div class="modal-controls">
                    <button class="modal-play-btn" id="modalPlayBtn">
                        <span class="play-icon">▶️</span>
                    </button>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-share" id="copyLinkBtn">
                        <span>📋</span> Copy Link
                    </button>
                    <button class="btn btn-twitter" id="shareTwitterBtn">
                        <span>🐦</span> Twitter
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Video Data - ADD YOUR VIDEOS HERE
        const videoData = [
            {
                id: 1,
                title: "JavaScript Basics Tutorial",
                description: "Learn the fundamentals of JavaScript programming",
                videoUrl: "video1.mp4",
                thumbnail: "thumb1.jpg",
                shareUrl: "https://blog.franklymadear.com/twitter/video1.html"
            },
            {
                id: 2,
                title: "CSS Animations Masterclass",
                description: "Create stunning animations with CSS",
                videoUrl: "video2.mp4",
                thumbnail: "thumb2.jpg",
                shareUrl: "https://blog.franklymadear.com/twitter/video2.html"
            },
            {
                id: 3,
                title: "React Components Guide",
                description: "Build reusable React components",
                videoUrl: "video3.mp4",
                thumbnail: "thumb3.jpg",
                shareUrl: "https://blog.franklymadear.com/twitter/video3.html"
            },
            {
                id: 4,
                title: "Python for Beginners",
                description: "Start your Python programming journey",
                videoUrl: "video4.mp4",
                thumbnail: "thumb4.jpg",
                shareUrl: "https://blog.franklymadear.com/twitter/video4.html"
            },
            {
                id: 5,
                title: "Web Design Principles",
                description: "Modern web design techniques and best practices",
                videoUrl: "video5.mp4",
                thumbnail: "thumb5.jpg",
                shareUrl: "https://blog.franklymadear.com/twitter/video5.html"
            },
            {
                id: 6,
                title: "Git & GitHub Tutorial",
                description: "Version control and collaboration with Git",
                videoUrl: "video6.mp4",
                thumbnail: "thumb6.jpg",
                shareUrl: "https://blog.franklymadear.com/twitter/video6.html"
            }
        ];

        // DOM Elements
        const videoGrid = document.getElementById('videoGrid');
        const videoModal = document.getElementById('videoModal');
        const modalVideo = document.getElementById('modalVideo');
        const modalTitle = document.getElementById('modalTitle');
        const modalPlayBtn = document.getElementById('modalPlayBtn');
        const closeModal = document.getElementById('closeModal');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const shareTwitterBtn = document.getElementById('shareTwitterBtn');

        let currentVideo = null;

        // Load videos into grid
        function loadVideos() {
            videoGrid.innerHTML = '';
            
            videoData.forEach(video => {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.innerHTML = `
                    <img src="${video.thumbnail}" alt="${video.title}" class="video-thumbnail">
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-description">${video.description}</div>
                    </div>
                `;
                
                videoCard.addEventListener('click', () => openVideoModal(video));
                videoGrid.appendChild(videoCard);
            });
        }

        // Open video modal
        function openVideoModal(video) {
            currentVideo = video;
            modalVideo.src = video.videoUrl;
            modalTitle.textContent = video.title;
            videoModal.style.display = 'flex';
            
            // Try to auto-play
            modalVideo.play().then(() => {
                modalPlayBtn.style.display = 'none';
            }).catch(() => {
                modalPlayBtn.style.display = 'flex';
            });
        }

        // Close video modal
        function closeVideoModal() {
            videoModal.style.display = 'none';
            modalVideo.pause();
            modalVideo.currentTime = 0;
            modalPlayBtn.style.display = 'flex';
        }

        // Play video in modal
        modalPlayBtn.addEventListener('click', () => {
            modalVideo.play();
            modalPlayBtn.style.display = 'none';
        });

        // Close modal events
        closeModal.addEventListener('click', closeVideoModal);
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) {
                closeVideoModal();
            }
        });

        // Copy link
        copyLinkBtn.addEventListener('click', () => {
            if (currentVideo) {
                navigator.clipboard.writeText(currentVideo.shareUrl);
                alert('Link copied to clipboard!');
            }
        });

        // Share on Twitter
        shareTwitterBtn.addEventListener('click', () => {
            if (currentVideo) {
                const text = encodeURIComponent(`Check out "${currentVideo.title}" by FranklyMaDear! 🎬✨`);
                const url = encodeURIComponent(currentVideo.shareUrl);
                const twitterUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
                window.open(twitterUrl, '_blank', 'width=600,height=400');
            }
        });

        // Handle video end
        modalVideo.addEventListener('ended', () => {
            modalPlayBtn.style.display = 'flex';
        });

        // Handle video pause
        modalVideo.addEventListener('pause', () => {
            if (!modalVideo.ended) {
                modalPlayBtn.style.display = 'flex';
            }
        });

        // Handle video play
        modalVideo.addEventListener('play', () => {
            modalPlayBtn.style.display = 'none';
        });

        // Escape key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeVideoModal();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', loadVideos);
    </script>
</body>
</html>
