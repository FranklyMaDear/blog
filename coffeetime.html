<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Καφεμαντεία - Μάθε το μέλλον σου από το φλιτζάνι!</title>
    <style>
        /* ... το ίδιο CSS παραμένει ... */
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ... το ίδιο HTML παραμένει ... -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Αρχικοποίηση προκαθορισμένου διαχειριστή
            function initializeDefaultAdmin() {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Έλεγχος αν υπάρχει ήδη ο διαχειριστής
                const adminExists = users.find(user => user.email === 'admin@example.com');
                
                if (!adminExists) {
                    // Δημιουργία προκαθορισμένου διαχειριστή
                    const adminUser = {
                        id: 1,
                        username: 'admin',
                        email: 'admin@example.com',
                        password: 'admin123',
                        points: 0,
                        role: 'admin',
                        photos: [],
                        messages: [],
                        conversations: {},
                        createdAt: new Date().toISOString()
                    };
                    users.push(adminUser);
                    localStorage.setItem('users', JSON.stringify(users));
                }
            }

            // Στοιχεία DOM
            const authContainer = document.getElementById('auth-container');
            const userSection = document.getElementById('user-section');
            const uploadSection = document.getElementById('upload-section');
            const donationSection = document.getElementById('donation-section');
            const messagesSection = document.getElementById('messages-section');
            const adminPanel = document.getElementById('admin-panel');
            const adminToggle = document.getElementById('admin-toggle');
            const userName = document.getElementById('user-name');
            const userAvatar = document.getElementById('user-avatar');
            const userPoints = document.getElementById('user-points');
            const logoutBtn = document.getElementById('logout-btn');
            const uploadBtn = document.getElementById('upload-btn');
            const loading = document.getElementById('loading');
            const successMessage = document.getElementById('success-message');
            const freeCoffeeNotifications = document.getElementById('free-coffee-notifications');
            const photosGallery = document.getElementById('photos-gallery');
            const userMessagesContainer = document.getElementById('user-messages-container');
            const userMessageInput = document.getElementById('user-message-input');
            const userSendBtn = document.getElementById('user-send-btn');
            const adminMessagesContainer = document.getElementById('admin-messages-container');
            const adminMessageInput = document.getElementById('admin-message-input');
            const adminSendBtn = document.getElementById('admin-send-btn');
            const userList = document.getElementById('user-list');
            const adminUnreadBadge = document.getElementById('admin-unread-badge');
            const selectedUserMessages = document.getElementById('selected-user-messages');
            
            // Φόρμες
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginError = document.getElementById('login-error');
            const registerError = document.getElementById('register-error');
            
            // Μεταβλητές για την επικοινωνία
            let selectedUserId = null;
            
            // Αρχικοποίηση προκαθορισμένου διαχειριστή
            initializeDefaultAdmin();
            
            // Ελέγχουμε αν ο χρήστης είναι συνδεδεμένος
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (currentUser) {
                showUserSection(currentUser);
                
                // Αν είναι διαχειριστής, εμφάνισε το πάνελ διαχείρισης
                if (currentUser.email === 'admin@example.com' || currentUser.role === 'admin') {
                    adminPanel.classList.add('active');
                    updateAdminUnreadCount();
                }
            } else {
                authContainer.style.display = 'block';
            }
            
            // Σύνδεση/Εγγραφή
            const authTabs = document.querySelectorAll('.auth-tab');
            authTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    
                    // Αλλαγή ενεργού tab
                    authTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Αλλαγή ενεργής φόρμας
                    document.querySelectorAll('.auth-form').forEach(form => {
                        form.classList.remove('active');
                    });
                    document.getElementById(`${tabId}-form`).classList.add('active');
                });
            });
            
            // Σύνδεση
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    showUserSection(user);
                    
                    // Αν είναι διαχειριστής, εμφάνισε το πάνελ διαχείρισης
                    if (user.email === 'admin@example.com' || user.role === 'admin') {
                        adminPanel.classList.add('active');
                        updateAdminUnreadCount();
                    }
                    
                    loginError.style.display = 'none';
                } else {
                    loginError.textContent = 'Λάθος email ή κωδικός πρόσβασης';
                    loginError.style.display = 'block';
                }
            });
            
            // Εγγραφή
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('register-username').value;
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;
                const confirmPassword = document.getElementById('register-confirm-password').value;
                
                if (password !== confirmPassword) {
                    registerError.textContent = 'Οι κωδικοί δεν ταιριάζουν';
                    registerError.style.display = 'block';
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Έλεγχος αν υπάρχει ήδη χρήστης με το ίδιο email
                const existingUser = users.find(u => u.email === email);
                if (existingUser) {
                    registerError.textContent = 'Υπάρχει ήδη λογαριασμός με αυτό το email';
                    registerError.style.display = 'block';
                    return;
                }
                
                // Δημιουργία νέου χρήστη
                const newUser = {
                    id: Date.now(),
                    username,
                    email,
                    password,
                    points: 0,
                    photos: [],
                    messages: [],
                    conversations: {},
                    createdAt: new Date().toISOString()
                };
                
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                
                showUserSection(newUser);
                registerError.style.display = 'none';
            });
            
            // Αποσύνδεση
            logoutBtn.addEventListener('click', function() {
                localStorage.removeItem('currentUser');
                userSection.classList.remove('active');
                uploadSection.classList.remove('active');
                donationSection.classList.remove('active');
                messagesSection.classList.remove('active');
                adminPanel.classList.remove('active');
                authContainer.style.display = 'block';
            });
            
            // Ανέβασμα φωτογραφιών (διορθωμένο)
            uploadBtn.addEventListener('click', function() {
                const fileInput = document.getElementById('photo1');
                const files = fileInput.files;
                
                if (files.length === 0) {
                    alert('Παρακαλώ επιλέξτε τουλάχιστον μία φωτογραφία');
                    return;
                }
                
                // Προσομοίωση αποστολής
                loading.style.display = 'block';
                uploadBtn.disabled = true;
                
                // Διάβασμα και αποθήκευση φωτογραφιών ως base64
                const photoPromises = [];
                for (let i = 0; i < files.length; i++) {
                    photoPromises.push(readFileAsDataURL(files[i]));
                }
                
                Promise.all(photoPromises).then(photoDataUrls => {
                    // Αποθήκευση φωτογραφιών
                    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    const userIndex = users.findIndex(u => u.id === currentUser.id);
                    
                    if (userIndex !== -1) {
                        // Προσθήκη όλων των φωτογραφιών με πραγματικά δεδομένα
                        for (let i = 0; i < files.length; i++) {
                            const photoData = {
                                id: Date.now() + i,
                                filename: files[i].name,
                                dataUrl: photoDataUrls[i], // Αποθήκευση της πραγματικής εικόνας
                                uploadedAt: new Date().toISOString()
                            };
                            
                            users[userIndex].photos.push(photoData);
                        }
                        
                        localStorage.setItem('users', JSON.stringify(users));
                        
                        // Ενημέρωση του τρέχοντος χρήστη
                        for (let i = 0; i < files.length; i++) {
                            const photoData = {
                                id: Date.now() + i,
                                filename: files[i].name,
                                dataUrl: photoDataUrls[i],
                                uploadedAt: new Date().toISOString()
                            };
                            
                            currentUser.photos.push(photoData);
                        }
                        
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    }
                    
                    loading.style.display = 'none';
                    successMessage.style.display = 'block';
                    uploadBtn.disabled = false;
                    
                    // Απόκρυψη του μηνύματος επιτυχίας μετά από 3 δευτερόλεπτα
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 3000);
                }).catch(error => {
                    console.error('Σφάλμα ανεβάσματος:', error);
                    loading.style.display = 'none';
                    uploadBtn.disabled = false;
                    alert('Σφάλμα κατά το ανέβασμα των φωτογραφιών');
                });
            });
            
            // Βοηθητική συνάρτηση για ανάγνωση αρχείου ως Data URL
            function readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }
            
            // Αποστολή μηνύματος από χρήστη (διορθωμένο)
            userSendBtn.addEventListener('click', sendUserMessage);
            userMessageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendUserMessage();
                }
            });
            
            function sendUserMessage() {
                const messageText = userMessageInput.value.trim();
                if (!messageText) return;
                
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const admin = users.find(u => u.email === 'admin@example.com' || u.role === 'admin');
                
                if (!admin) {
                    alert('Δεν βρέθηκε διαχειριστής');
                    return;
                }
                
                // Δημιουργία μηνύματος
                const message = {
                    id: Date.now(),
                    senderId: currentUser.id,
                    senderName: currentUser.username,
                    content: messageText,
                    timestamp: new Date().toISOString(),
                    read: false
                };
                
                // Αποθήκευση μηνύματος στον διαχειριστή
                if (!admin.conversations) admin.conversations = {};
                if (!admin.conversations[currentUser.id]) {
                    admin.conversations[currentUser.id] = {
                        userId: currentUser.id,
                        username: currentUser.username,
                        email: currentUser.email,
                        messages: []
                    };
                }
                admin.conversations[currentUser.id].messages.push(message);
                
                // Αποθήκευση μηνύματος στον χρήστη
                if (!currentUser.conversations) currentUser.conversations = {};
                if (!currentUser.conversations[admin.id]) {
                    currentUser.conversations[admin.id] = {
                        userId: admin.id,
                        username: admin.username,
                        email: admin.email,
                        messages: []
                    };
                }
                currentUser.conversations[admin.id].messages.push(message);
                
                // Αποθήκευση στο localStorage
                const userIndex = users.findIndex(u => u.id === currentUser.id);
                const adminIndex = users.findIndex(u => u.id === admin.id);
                
                if (userIndex !== -1) {
                    users[userIndex] = currentUser;
                }
                if (adminIndex !== -1) {
                    users[adminIndex] = admin;
                }
                
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                // Ενημέρωση εμφάνισης
                displayUserMessages();
                userMessageInput.value = '';
                
                // Ενημέρωση ειδοποίησης για διαχειριστή
                if (adminPanel.classList.contains('active')) {
                    updateAdminUnreadCount();
                }
            }
            
            // Αποστολή μηνύματος από διαχειριστή (διορθωμένο)
            adminSendBtn.addEventListener('click', sendAdminMessage);
            adminMessageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendAdminMessage();
                }
            });
            
            function sendAdminMessage() {
                if (!selectedUserId) return;
                
                const messageText = adminMessageInput.value.trim();
                if (!messageText) return;
                
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const targetUser = users.find(u => u.id === selectedUserId);
                
                if (!targetUser) {
                    alert('Δεν βρέθηκε ο χρήστης');
                    return;
                }
                
                // Δημιουργία μηνύματος
                const message = {
                    id: Date.now(),
                    senderId: currentUser.id,
                    senderName: currentUser.username,
                    content: messageText,
                    timestamp: new Date().toISOString(),
                    read: false
                };
                
                // Αποθήκευση μηνύματος στον χρήστη
                if (!targetUser.conversations) targetUser.conversations = {};
                if (!targetUser.conversations[currentUser.id]) {
                    targetUser.conversations[currentUser.id] = {
                        userId: currentUser.id,
                        username: currentUser.username,
                        email: currentUser.email,
                        messages: []
                    };
                }
                targetUser.conversations[currentUser.id].messages.push(message);
                
                // Αποθήκευση μηνύματος στον διαχειριστή
                if (!currentUser.conversations) currentUser.conversations = {};
                if (!currentUser.conversations[targetUser.id]) {
                    currentUser.conversations[targetUser.id] = {
                        userId: targetUser.id,
                        username: targetUser.username,
                        email: targetUser.email,
                        messages: []
                    };
                }
                currentUser.conversations[targetUser.id].messages.push(message);
                
                // Αποθήκευση στο localStorage
                const targetUserIndex = users.findIndex(u => u.id === targetUser.id);
                const adminIndex = users.findIndex(u => u.id === currentUser.id);
                
                if (targetUserIndex !== -1) {
                    users[targetUserIndex] = targetUser;
                }
                if (adminIndex !== -1) {
                    users[adminIndex] = currentUser;
                }
                
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                // Ενημέρωση εμφάνισης
                displayAdminMessages(selectedUserId);
                adminMessageInput.value = '';
            }
            
            // Εμφάνιση προφίλ χρήστη
            function showUserSection(user) {
                authContainer.style.display = 'none';
                userSection.classList.add('active');
                uploadSection.classList.add('active');
                donationSection.classList.add('active');
                messagesSection.classList.add('active');
                
                userName.textContent = user.username;
                userPoints.textContent = user.points;
                
                // Φόρτωση μηνυμάτων
                displayUserMessages();
                
                // Αν είναι διαχειριστής, φόρτωσε τα δεδομένα διαχείρισης
                if (user.email === 'admin@example.com' || user.role === 'admin') {
                    loadAdminData();
                }
            }
            
            // Εμφάνιση μηνυμάτων για χρήστη
            function displayUserMessages() {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!currentUser.conversations) {
                    userMessagesContainer.innerHTML = '<div class="no-messages">Δεν υπάρχουν μηνύματα ακόμα. Στείλτε το πρώτο σας μήνυμα!</div>';
                    return;
                }
                
                const admin = getAdminUser();
                if (!admin) return;
                
                const conversation = currentUser.conversations[admin.id];
                if (!conversation || !conversation.messages || conversation.messages.length === 0) {
                    userMessagesContainer.innerHTML = '<div class="no-messages">Δεν υπάρχουν μηνύματα ακόμα. Στείλτε το πρώτο σας μήνυμα!</div>';
                    return;
                }
                
                userMessagesContainer.innerHTML = '';
                conversation.messages.forEach(message => {
                    const messageElement = document.createElement('div');
                    messageElement.className = `message ${message.senderId === currentUser.id ? 'user' : 'admin'}`;
                    
                    const time = new Date(message.timestamp).toLocaleString('el-GR');
                    
                    messageElement.innerHTML = `
                        <div class="message-header">
                            <span class="message-sender">${message.senderName}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-content">${message.content}</div>
                    `;
                    
                    userMessagesContainer.appendChild(messageElement);
                });
                
                // Κάνε scroll στο τελευταίο μήνυμα
                userMessagesContainer.scrollTop = userMessagesContainer.scrollHeight;
            }
            
            // Εμφάνιση μηνυμάτων για διαχειριστή
            function displayAdminMessages(userId) {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!currentUser.conversations || !currentUser.conversations[userId]) {
                    adminMessagesContainer.innerHTML = '<div class="no-messages">Δεν υπάρχουν μηνύματα με αυτόν τον χρήστη.</div>';
                    return;
                }
                
                const conversation = currentUser.conversations[userId];
                adminMessagesContainer.innerHTML = '';
                
                conversation.messages.forEach(message => {
                    const messageElement = document.createElement('div');
                    messageElement.className = `message ${message.senderId === currentUser.id ? 'admin' : 'user'}`;
                    
                    const time = new Date(message.timestamp).toLocaleString('el-GR');
                    
                    messageElement.innerHTML = `
                        <div class="message-header">
                            <span class="message-sender">${message.senderName}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-content">${message.content}</div>
                    `;
                    
                    adminMessagesContainer.appendChild(messageElement);
                    
                    // Σημείωση μηνύματος ως διαβασμένο
                    if (!message.read && message.senderId !== currentUser.id) {
                        message.read = true;
                        updateMessageReadStatus(userId, message.id);
                    }
                });
                
                // Κάνε scroll στο τελευταίο μήνυμα
                adminMessagesContainer.scrollTop = adminMessagesContainer.scrollHeight;
            }
            
            // Ενημέρωση κατάστασης ανάγνωσης μηνύματος
            function updateMessageReadStatus(userId, messageId) {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                
                const userIndex = users.findIndex(u => u.id === currentUser.id);
                if (userIndex !== -1 && users[userIndex].conversations && users[userIndex].conversations[userId]) {
                    const messageIndex = users[userIndex].conversations[userId].messages.findIndex(m => m.id === messageId);
                    if (messageIndex !== -1) {
                        users[userIndex].conversations[userId].messages[messageIndex].read = true;
                        localStorage.setItem('users', JSON.stringify(users));
                        currentUser.conversations[userId].messages[messageIndex].read = true;
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                        
                        updateAdminUnreadCount();
                    }
                }
            }
            
            // Λήψη διαχειριστή
            function getAdminUser() {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                return users.find(u => u.email === 'admin@example.com' || u.role === 'admin');
            }
            
            // Ενημέρωση αριθμού μη αναγνωσμένων μηνυμάτων για διαχειριστή
            function updateAdminUnreadCount() {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!currentUser || !currentUser.conversations) {
                    adminUnreadBadge.style.display = 'none';
                    return;
                }
                
                let unreadCount = 0;
                Object.values(currentUser.conversations).forEach(conversation => {
                    conversation.messages.forEach(message => {
                        if (!message.read && message.senderId !== currentUser.id) {
                            unreadCount++;
                        }
                    });
                });
                
                if (unreadCount > 0) {
                    adminUnreadBadge.textContent = unreadCount;
                    adminUnreadBadge.style.display = 'inline-flex';
                } else {
                    adminUnreadBadge.style.display = 'none';
                }
            }
            
            // Φόρτωση δεδομένων διαχείρισης
            function loadAdminData() {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Φόρτωση ειδοποιήσεων για δωρεάν καφέ
                loadFreeCoffeeNotifications(users);
                
                // Φόρτωση φωτογραφιών χρηστών
                loadUserPhotos(users);
                
                // Φόρτωση λίστας χρηστών με μηνύματα
                loadUserList(users);
            }
            
            // Φόρτωση ειδοποιήσεων για δωρεάν καφέ
            function loadFreeCoffeeNotifications(users) {
                freeCoffeeNotifications.innerHTML = '';
                
                const freeCoffeeUsers = users.filter(user => user.points >= 100);
                
                if (freeCoffeeUsers.length === 0) {
                    freeCoffeeNotifications.innerHTML = '<p>Δεν υπάρχουν ειδοποιήσεις για δωρεάν καφέ.</p>';
                    return;
                }
                
                freeCoffeeUsers.forEach(user => {
                    const notificationElement = document.createElement('div');
                    notificationElement.className = 'free-coffee-alert';
                    notificationElement.innerHTML = `
                        <p><strong>${user.username}</strong> (${user.email})</p>
                        <p>Έχει συγκεντρώσει ${user.points} πόντους και κέρδισε έναν δωρεάν καφέ! ☕</p>
                    `;
                    freeCoffeeNotifications.appendChild(notificationElement);
                });
            }
            
            // Φόρτωση φωτογραφιών χρηστών (διορθωμένο)
            function loadUserPhotos(users) {
                photosGallery.innerHTML = '';
                
                let hasPhotos = false;
                
                users.forEach(user => {
                    if (user.photos && user.photos.length > 0 && user.email !== 'admin@example.com') {
                        hasPhotos = true;
                        
                        user.photos.forEach(photo => {
                            const photoElement = document.createElement('div');
                            photoElement.className = 'photo-item';
                            
                            const uploadDate = new Date(photo.uploadedAt).toLocaleString('el-GR');
                            
                            // Προβολή πραγματικής φωτογραφίας αν υπάρχει dataUrl
                            const photoPreview = photo.dataUrl ? 
                                `<img src="${photo.dataUrl}" alt="${photo.filename}" class="photo-preview" style="max-width: 100%; height: 130px; object-fit: cover; border-radius: 5px; margin-bottom: 0.4rem;">` :
                                `<div class="photo-preview">📷 ${photo.filename}</div>`;
                            
                            photoElement.innerHTML = `
                                <div class="user-info">
                                    <strong>${user.username}</strong><br>
                                    ${user.email}<br>
                                    ${uploadDate}
                                </div>
                                ${photoPreview}
                            `;
                            
                            photosGallery.appendChild(photoElement);
                        });
                    }
                });
                
                if (!hasPhotos) {
                    photosGallery.innerHTML = '<p>Δεν υπάρχουν φωτογραφίες από χρήστες.</p>';
                }
            }
            
            // Φόρτωση λίστας χρηστών με μηνύματα
            function loadUserList(users) {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                userList.innerHTML = '';
                
                if (!currentUser.conversations || Object.keys(currentUser.conversations).length === 0) {
                    userList.innerHTML = '<p>Δεν υπάρχουν μηνύματα από χρήστες.</p>';
                    return;
                }
                
                Object.values(currentUser.conversations).forEach(conversation => {
                    const userItem = document.createElement('div');
                    userItem.className = 'user-item';
                    userItem.style.padding = '0.8rem';
                    userItem.style.borderBottom = '1px solid #eee';
                    userItem.style.cursor = 'pointer';
                    userItem.style.transition = 'background 0.3s';
                    
                    userItem.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong>${conversation.username}</strong><br>
                                <small>${conversation.email}</small>
                            </div>
                            <div>
                                ${getUnreadCount(conversation) > 0 ? 
                                    `<span class="unread-badge">${getUnreadCount(conversation)}</span>` : 
                                    ''}
                            </div>
                        </div>
                    `;
                    
                    userItem.addEventListener('click', () => {
                        selectedUserId = conversation.userId;
                        selectedUserMessages.style.display = 'block';
                        displayAdminMessages(conversation.userId);
                        
                        // Επισημάνετε τον επιλεγμένο χρήστη
                        document.querySelectorAll('.user-item').forEach(item => {
                            item.style.background = 'transparent';
                        });
                        userItem.style.background = '#f0f0f0';
                    });
                    
                    userList.appendChild(userItem);
                });
            }
            
            // Λήψη αριθμού μη αναγνωσμένων μηνυμάτων σε μια συνομιλία
            function getUnreadCount(conversation) {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                let count = 0;
                
                conversation.messages.forEach(message => {
                    if (!message.read && message.senderId !== currentUser.id) {
                        count++;
                    }
                });
                
                return count;
            }
            
            // Εναλλαγή πάνελ διαχείρισης
            adminToggle.addEventListener('click', function() {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                
                if (currentUser && (currentUser.email === 'admin@example.com' || currentUser.role === 'admin')) {
                    adminPanel.classList.toggle('active');
                    
                    if (adminPanel.classList.contains('active')) {
                        loadAdminData();
                        updateAdminUnreadCount();
                    }
                } else {
                    alert('Δεν έχετε δικαιώματα διαχειριστή');
                }
            });
            
            // Εναλλαγή tabs διαχείρισης
            const adminTabs = document.querySelectorAll('.admin-tab');
            adminTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    
                    // Αλλαγή ενεργού tab
                    adminTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Αλλαγή ενεργού περιεχομένου
                    document.querySelectorAll('.admin-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(`${tabId}-content`).classList.add('active');
                    
                    // Εάν επιλέγεται το tab μηνυμάτων, φόρτωσε ξανά τη λίστα
                    if (tabId === 'messages') {
                        const users = JSON.parse(localStorage.getItem('users') || '[]');
                        loadUserList(users);
                    }
                });
            });
            
            // Ενημέρωση ονόματος αρχείου όταν επιλέγονται πολλαπλά αρχεία
            const fileInput = document.getElementById('photo1');
            const fileName = document.getElementById('file-name1');
            
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    if (this.files.length === 1) {
                        fileName.textContent = this.files[0].name;
                    } else {
                        fileName.textContent = `${this.files.length} αρχεία επιλέχθηκαν`;
                    }
                } else {
                    fileName.textContent = 'Δεν έχουν επιλεγεί αρχεία';
                }
            });
        });
    </script>
</body>
</html>
